* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 12px/1.5 var(--mono);
  -webkit-font-smoothing: antialiased;
}

/* ---------- masthead ------------------------------------------------------ */
#masthead { padding: 1.6rem 2.5rem .4rem; }
#masthead h1 { font: 500 19px var(--mono); margin: 0 0 .35rem; letter-spacing: -.01em; }
.tagline {
  margin: 0; color: var(--teal); font-size: 10.5px;
  text-transform: uppercase; letter-spacing: .13em;
}

/* ---------- the tab bar --------------------------------------------------- */
#tabs { padding: 0 2.5rem; }
.tabrow {
  display: flex; align-items: center; gap: .35rem; flex-wrap: wrap;
  padding: .55rem 0; border-top: 1px solid var(--rule);
}
.tabrow.sub { border-top: 0; padding-top: 0; }
.nudge, .tab, .ctl {
  font: 11px var(--mono); color: var(--ink-2); background: var(--card);
  border: 1px solid var(--rule); border-radius: 3px; padding: .22rem .55rem;
  cursor: pointer; white-space: nowrap;
}
.nudge { padding: .22rem .45rem; }
.tab.sel, .ctl.sel { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.ctl:disabled { color: var(--ink-3); cursor: not-allowed;
  background: repeating-linear-gradient(45deg,#f5f3ee,#f5f3ee 3px,#efece4 3px,#efece4 6px); }
.grp { display: inline-flex; align-items: center; gap: .3rem; margin-left: .5rem; }
.grp .ctl { border-radius: 0; margin-left: -1px; }
.grp .ctl:first-of-type { border-radius: 3px 0 0 3px; margin-left: 0; }
.grp .ctl:last-of-type { border-radius: 0 3px 3px 0; }
.lbl, .hint-inline {
  color: var(--ink-3); font-size: 10px; text-transform: uppercase; letter-spacing: .1em;
}
.hint-inline { text-transform: none; letter-spacing: 0; margin-left: .6rem; }
.tag {
  font-size: 10px; background: var(--ink); color: var(--paper);
  padding: .2rem .5rem; border-radius: 3px; letter-spacing: .04em;
}
.status { margin-left: auto; color: var(--ink-3); font-size: 10.5px; }
select.ctl { padding: .18rem .3rem; }

/* ---------- how to read it ------------------------------------------------ */
#howto-panel {
  margin: .4rem 2.5rem 0; padding: .8rem 1.2rem; background: var(--card);
  border: 1px solid var(--rule); border-radius: 4px;
}
#howto-panel ol { margin: 0 0 .6rem; padding-left: 1.4rem; font-size: 11.5px; color: var(--ink-2); }
#howto-panel li { margin: .28rem 0; }
#howto-panel li b { color: var(--ink); }

/* ---------- stepper ------------------------------------------------------- */
main { padding: 1.1rem 2.5rem 3rem; }
#stepper { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; margin-bottom: .9rem; }
#stepper[hidden] { display: none; }
.step { display: inline-flex; align-items: center; gap: .4rem; color: var(--ink-3); font-size: 11px;
  text-transform: uppercase; letter-spacing: .1em; }
.step .n {
  width: 17px; height: 17px; border-radius: 50%; display: inline-grid; place-items: center;
  border: 1px solid var(--rule); font-size: 9.5px; color: var(--ink-3); background: var(--card);
}
.step.on { color: var(--ink); }
.step.on .n { background: var(--out); border-color: var(--out); color: #fff; }
.step .dash { color: var(--rule); }
#stepper .aside { margin-left: auto; color: var(--ink-3); font-size: 10.5px;
  text-transform: uppercase; letter-spacing: .09em; }

.caption {
  margin: 0 0 .18rem; color: var(--teal); font-size: 11px;
  text-transform: uppercase; letter-spacing: .08em;
}
.caption + .caption { margin-bottom: 1.1rem; }
/* The rows a panel argues about, and the row names inside its caption. Set in
   the mono face so a row id reads as an identifier rather than as prose. */
.caption.rows { font: 10.5px var(--mono); margin: -.5rem 0 1.1rem;
  text-transform: none; letter-spacing: 0; }
.caption.rows .xref { margin-right: .1rem; }
.sw-panel-note .xref { font: 10.5px var(--mono); }

/* ---------- the figure ---------------------------------------------------- */
.colheads { display: grid; grid-template-columns: calc(var(--treew) + var(--pathw)) minmax(0, 1fr);
  margin: .3rem 0 .4rem; max-width: 100%; }
/* The two sticky columns, as one pair of widths: the grid, the column heads and
   the sticky offsets all read these, so narrowing the tree on a phone cannot
   leave one of them at the old width. */
:root { --treew: 340px; --pathw: 62px; }
.colhead { font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em; }
.colhead.out { color: var(--out); }
.colhead.in { color: var(--in); justify-self: start; }

/* One scroll box, not three. The tree, the paths column and the matrix share a
   single viewport, so a branch opening cannot slide one out of step with
   another — which is the whole reason the tree is drawn inside the grid rather
   than beside it. The two left columns stick while the matrix scrolls sideways. */
.grid {
  display: grid;
  grid-template-columns: var(--treew) var(--pathw) max-content;
  gap: 0; align-items: start;
  overflow: auto; max-height: 76vh;
  border: 1px solid var(--rule-2); background: var(--card); border-radius: 3px;
  padding: 16px 12px 12px 0;
  width: max-content; max-width: 100%;
}
.pane { min-width: 0; }
#tree  { position: sticky; left: 0; z-index: 3; background: var(--card); width: var(--treew); }

/* ---------- the tree ------------------------------------------------------ */
#tree { padding-right: .2rem; padding-left: 12px; }
.trow { display: flex; align-items: stretch; height: calc(var(--cell) + 5px); }
.gutter { display: flex; align-items: stretch; flex: none; }
.gutter i {
  width: 13px; position: relative; display: block;
}
/* The lit branch: the path from the root to what you selected. */
.gutter i.line::before {
  content: ""; position: absolute; left: 6px; top: 0; bottom: 0; width: 1px; background: var(--rule);
}
.gutter i.line.lit::before { background: var(--teal); width: 1.5px; }
.gutter i.elbow::before {
  content: ""; position: absolute; left: 6px; top: 0; height: 50%; width: 1px; background: var(--rule);
}
.gutter i.elbow::after {
  content: ""; position: absolute; left: 6px; top: 50%; width: 7px; height: 1px; background: var(--rule);
}
.gutter i.elbow.lit::before, .gutter i.elbow.lit::after { background: var(--teal); height: 50%; }
.gutter i.elbow.lit::after { height: 1.5px; top: calc(50% - .5px); }
.gutter i.tee::before {
  content: ""; position: absolute; left: 6px; top: 0; bottom: 0; width: 1px; background: var(--rule);
}
.gutter i.tee::after {
  content: ""; position: absolute; left: 6px; top: 50%; width: 7px; height: 1px; background: var(--rule);
}
.gutter i.tee.lit::before, .gutter i.tee.lit::after { background: var(--teal); }

.pill {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: .4rem;
  border: 1px solid var(--rule); border-left-width: 3px; border-radius: 3px;
  background: var(--card); padding: 0 .45rem; margin: 1.5px 0;
  cursor: pointer; font-size: 11px; color: var(--ink);
}
.pill:hover { border-color: var(--ink-3); }
.pill .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.pill .tri { color: inherit; opacity: .55; font-size: 9px; flex: none; }
.pill .seeded { opacity: .55; font-style: italic; }
/* Retired, not absent. A deprecated row is struck through rather than hidden:
   its question was real and the decision to stop reading it is a fact worth
   seeing, but nothing should mistake it for a live answer. */
.pill .retired { opacity: .5; text-decoration: line-through; text-decoration-thickness: 1px; }

/* Relation to the selection, carried in the fill. Solid = one hop, pale =
   further down the chain. */
.pill.sel   { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.pill.out   { background: var(--out); color: #fff; border-color: var(--out); }
.pill.outp  { background: var(--out-pale); border-left-color: var(--out); }
.pill.in    { background: var(--in); color: #fff; border-color: var(--in); }
.pill.inp   { background: var(--in-pale); border-left-color: var(--in); }
.pill.both  { background: var(--both); color: #fff; border-color: var(--both); }
.pill.t-teal   { border-left-color: var(--teal); }
.pill.t-slate  { border-left-color: var(--slate); }
.pill.t-amber  { border-left-color: var(--out); }
.pill.t-violet { border-left-color: var(--in); }
.pill.t-green  { border-left-color: var(--both); }
.pill.crossing { box-shadow: inset 0 0 0 1px var(--teal); }

/* ---------- the paths column --------------------------------------------- */
#paths { position: sticky; left: var(--treew); z-index: 2; background: var(--card); width: var(--pathw); }
.paths-label {
  position: absolute; top: -15px; left: 0; right: 0;
  font-size: 10px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .1em;
  text-align: center;
}
#paths-svg { position: absolute; left: 0; top: 0; width: 100%; pointer-events: none; }
#paths-dots { position: relative; }
.pdot {
  height: calc(var(--cell) + 5px); display: flex; align-items: center; justify-content: flex-start;
  padding-left: 3px; font-size: 9px; color: var(--ink-3); cursor: pointer;
}
.pdot.sel { color: var(--ink); font-weight: 600; }

/* ---------- the matrix ---------------------------------------------------- */
#matrix-scroll { overflow: visible; }
#matrix-inner { position: relative; }
#matrix-cells { position: relative; }
#matrix-svg { position: absolute; left: 0; top: 0; pointer-events: none; }

/* Only the cells that carry something are in the document. A 387x387 grid is
   150 000 elements of which 600 are filled; the empty ones are paper, and paper
   does not need a div. */
.mcell {
  position: absolute; width: calc(var(--cell) + 5px); height: calc(var(--cell) + 5px);
}
/* The bands: the selected row and the selected column, so the eye can travel
   from a mark to the node it names without counting. */
.band { position: absolute; pointer-events: none; }
.band.rband { left: 0; background: var(--out-pale); }
.band.cband { top: 0; background: var(--in-pale); }
.mcell.diag { background: #efece4; cursor: pointer; box-shadow: inset 0 0 0 1px var(--paper); }
.mcell.diag:hover { background: #e2ddd0; }
.mcell.diag.seeded { background: repeating-linear-gradient(45deg,#f2efe8,#f2efe8 3px,#e9e5db 3px,#e9e5db 6px); }
.mcell.diag.sel, .mcell.diag.sel:hover { background: var(--ink); }
.mcell.diag .num { position: absolute; inset: 0; display: grid; place-items: center;
  font-size: 8.5px; color: var(--ink-3); }
.mcell.diag.sel .num { color: var(--paper); }
.mcell .mk {
  position: absolute; left: 5px; top: 5px; right: 5px; bottom: 5px; border-radius: 1px;
}
.mcell .mk.inside  { background: var(--ink-3); }
.mcell .mk.crosses { background: var(--out); }
.mcell .mk.rowsel  { background: var(--out); }
.mcell .mk.colsel  { background: var(--in); }
.mcell .mk.below   { outline: 1px solid rgba(0,0,0,.35); }

/* Nested boxes on the diagonal: the tree, drawn inside the matrix. */
.boxrect {
  position: absolute; border: 1px solid var(--rule); border-radius: 2px;
  pointer-events: none; background: rgba(255,255,255,.35);
}
.boxlabel {
  position: absolute; font-size: 9px; color: var(--ink-3); white-space: nowrap;
  pointer-events: none; padding-left: 3px;
}

/* ---------- legend and notes --------------------------------------------- */
#legend { margin-top: 1rem; }
#legend .rule { margin: .1rem 0; font-size: 10.5px; color: var(--ink-3);
  text-transform: uppercase; letter-spacing: .08em; }
#legend .keys { display: flex; gap: 1.6rem; flex-wrap: wrap; margin: .45rem 0; }
.key { display: inline-flex; align-items: center; gap: .4rem; font-size: 10.5px;
  text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); }
.sw { width: 9px; height: 9px; border-radius: 1px; display: inline-block; }
.sw.in { background: var(--in); } .sw.out { background: var(--out); } .sw.both { background: var(--both); }

.reach { margin: 1.1rem 0 0; font-size: 12.5px; color: var(--ink); }
.reach b { font-weight: 600; }

#notes { margin: 1.6rem 0 0; display: grid; grid-template-columns: 150px 1fr; gap: .35rem 1.2rem; }
#notes dt { font-size: 9.5px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .08em; }
#notes dd { margin: 0; font-size: 12px; color: var(--ink-2); font-family: Georgia, "Iowan Old Style", serif; }
#notes dd b { color: var(--ink); font-family: var(--mono); font-size: 11.5px; }

/* ---------- the node page ------------------------------------------------- */
#nodeview { max-width: 74rem; }
#back { margin-bottom: .9rem; }
.node-head h2 { font: 500 20px var(--mono); margin: .2rem 0 .25rem; }
.crumb { font-size: 10.5px; color: var(--ink-3); }
.crumb .sep { color: var(--rule); }
.ident { font-size: 10.5px; color: var(--ink-3); margin: 0 0 1rem; }
.kind { border: 1px solid var(--rule); border-radius: 2px; padding: 0 .3rem; }
.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--rule); margin-bottom: 1rem; flex-wrap: wrap; }
.tab-btn {
  font: 10.5px var(--mono); background: none; border: 0; border-bottom: 2px solid transparent;
  padding: .4rem .65rem; cursor: pointer; color: var(--ink-3);
  text-transform: uppercase; letter-spacing: .06em;
}
.tab-btn.sel { color: var(--ink); border-bottom-color: var(--ink); }
.tabs .tab {
  font: 10.5px var(--mono); background: none; border: 0; border-radius: 0;
  border-bottom: 2px solid transparent; padding: .4rem .65rem; cursor: pointer;
  color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em;
}
.tabs .tab.sel { color: var(--ink); background: none; border-bottom-color: var(--ink); }
.panel[data-panel] { display: none; }
.panel[data-panel].sel { display: block; }
.question { font: 15px/1.55 Georgia, "Iowan Old Style", serif; margin: 0 0 .8rem; }
.maths code { background: #f4f2ec; padding: .3rem .55rem; border-radius: 3px; display: inline-block; font-size: 12px; }
.src { font-size: 11px; color: var(--ink-2); }
.src.warn { color: #a4262c; }
.where { color: var(--ink-3); }
.note { font-size: 11.5px; color: var(--ink-2); border-left: 2px solid var(--rule); padding-left: .7rem; margin: .8rem 0; }
.muted { color: var(--ink-3); font-size: 11px; }
.empty { border: 1px dashed var(--rule); padding: .55rem .75rem; border-radius: 3px;
  background: #faf8f3; color: var(--ink-3); font-size: 11.5px; }
dl.asm { font-size: 11.5px; }
dl.asm dt { font-weight: 600; margin-top: .45rem; }
dl.asm dd { margin: 0 0 0 1rem; color: var(--ink-2); }
table.iface, table.fx { border-collapse: collapse; width: 100%; font-size: 11px; margin: .5rem 0; }
/* THE ANSWER, BESIDE THE QUESTION. Large enough to be read before the chart is,
   and the qualifier beside it in running weight so the number is what carries.
   Empty where a panel has no single number, and it collapses rather than
   leaving a gap. */
/* AN EMPTY BLOCK IS NOT A FREE BLOCK, even at display:none. Adding a bare <p>
   to panelBody moved three panels this change does not touch — predict by a
   whole CSS pixel of canvas height, repeatability and segmentation by 5.3 and
   2.5 per cent of their pixels — because the extra node shifts the layout the
   canvas is measured against by a sub-pixel, and the canvas height is a
   function of its measured width. Carrying `caption`, which the siblings
   already carry, makes the empty case identical to having no node at all. */
.sw-answer:empty { display: none; margin: 0; padding: 0; }
.sw-answer { margin: .1rem 0 .35rem; line-height: 1.35; }
.sw-answer b { font-size: 21px; font-weight: 600; color: var(--ink);
  font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.sw-answer span { font-size: 11.5px; color: var(--ink-3); margin-left: .45rem; }

/* WHAT THE POINTER CAN DO, WRITTEN DOWN. Drag-to-zoom and click-to-hide leave
   no trace on the page, so this strip names the state the figure is in and
   offers the way out of it — which is also the only path to either for a reader
   without a mouse. It carries one hint line when nothing has been done, and
   grows a button per thing that has. */
.sw-view { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem;
  margin: .1rem 0 .2rem; font-size: 10.5px; min-height: 1.35rem; }
.sw-view .sw-vs { color: var(--ink-2); font: 10.5px var(--mono); }
.sw-view .sw-hint { font-size: 10px; color: var(--ink-3); margin-left: auto;
  text-align: right; }
.sw-view button { font-size: 10px; padding: .1rem .4rem; }
/* The copy control sits with the table it copies, not with the view strip: it
   is about the numbers, and it is reachable only when they are open. */
.sw-table-copy { display: flex; align-items: center; gap: .45rem; margin: .3rem 0; }
.sw-table-copy button { font-size: 10px; padding: .1rem .4rem; }
.sw-copied { font-size: 10px; color: var(--teal); }

/* The numbers behind a figure. Closed by default — the picture is the point —
   and scrollable, because a panel with two hundred lead points should not push
   the next figure off the page to prove it has them. */
.sw-table { margin: .35rem 0 .1rem; }
.sw-table > summary { font-size: 10.5px; color: var(--ink-3); cursor: pointer; }
.sw-table > summary:hover { color: var(--ink-2); }
.sw-table-body { max-height: 260px; overflow: auto; }
/* COLUMNS THAT HUG THEIR NUMBERS. Inheriting width:100% from table.fx spread
   two columns across the whole panel, so "days in bin" sat halfway across the
   page from the value under it and the eye had to travel a foot to pair them —
   the same distance problem a legend off to the side has. At width:auto the
   columns are as wide as their contents and the reader compares adjacent
   numbers; the body scrolls in both directions if a wide one needs it. */
table.chart-table { width: auto; min-width: 0; }
table.chart-table td, table.chart-table th { font-variant-numeric: tabular-nums;
  text-align: right; white-space: nowrap; }
table.chart-table td:first-child, table.chart-table th:first-child { text-align: left;
  padding-right: 1.25rem; }
/* A focused chart says so, for a reader arriving by keyboard. */
canvas.plot:focus { outline: 2px solid var(--ink-3); outline-offset: 2px; }
table.iface th, table.fx th { text-align: left; font-size: 9.5px; text-transform: uppercase;
  letter-spacing: .07em; color: var(--ink-3); border-bottom: 1px solid var(--rule); padding: .3rem .5rem; }
table.iface td, table.fx td { padding: .25rem .5rem; border-bottom: 1px solid var(--rule-2); }
table.iface tr.out td { background: #fdf9f2; }
/* A set row publishes more than one variable, and every one of them is an
   output. The first row is the answer the node is named for; the members sit
   indented behind it, so the table reads as one answer plus its set. */
table.iface tr.out.member td:first-child { padding-left: 1.4rem; color: var(--ink-3); }
td.num { text-align: right; }
.xref { color: var(--in); cursor: pointer; text-decoration: underline dotted; }
/* the theory tab. Serif for the prose, because it is prose and is meant to be
   read at length rather than scanned like a table. */
.why, .reading { font: 14px/1.65 Georgia, "Iowan Old Style", serif; margin: 0 0 .9rem;
  max-width: 76ch; }
.reading { color: var(--ink-2); }
.derivectl { display: flex; gap: .4rem; align-items: center; flex-wrap: wrap; margin: .2rem 0 .7rem; }
ol.derive { font-size: 12.5px; padding-left: 1.6rem; margin: 0 0 1rem; max-width: 78ch; }
ol.derive li { margin: 0 0 .75rem; line-height: 1.65; padding: .1rem .3rem; }
ol.derive li.now { background: #fdf9f2; outline: 2px solid #f0e6d2; border-radius: 3px; }
ol.derive .dt { font: 13.5px/1.65 Georgia, "Iowan Old Style", serif; }
/* A derivation line is one expression, and a long one still has to be readable
   without a horizontal scroll nobody notices. It wraps at spaces only, and a
   continuation is indented so it cannot be mistaken for a second expression. */
ol.derive .dm { display: block; margin: .35rem 0 .1rem; background: #f4f2ec;
  padding: .32rem .55rem .32rem 1.75rem; border-radius: 3px; font-size: 11.5px;
  max-width: 100%; white-space: pre-wrap; text-indent: -1.2rem; }
.maths.concl { margin-top: .2rem; font-size: 11.5px; color: var(--ink-2); }
ol.algo { font-size: 12px; padding-left: 1.3rem; }
ol.algo .binds { color: var(--ink-3); font-size: 10.5px; }
ul.guards, ul.flags { font-size: 11.5px; color: var(--ink-2); padding-left: 1.2rem; }
pre.code { background: #f7f5ef; border: 1px solid var(--rule-2); border-radius: 3px;
  padding: .8rem; overflow: auto; font-size: 10.5px; line-height: 1.5; max-height: 38rem; }
/* THE METHOD, THE AUTHOR'S CODE, THE CASES AND FLIGHT SOFTWARE on a node page. */
pre.code.method { white-space: pre; border-left: 3px solid var(--in); }
details.author-code, details.flight { margin: .5rem 0; font-size: 11.5px; }
details.author-code summary, details.flight summary { cursor: pointer; color: var(--in); }
table.cases .ok { color: var(--both); }
table.cases .bad { color: var(--out); font-weight: 600; }
.gaps { border: 1px solid var(--out); border-radius: 3px; padding: .6rem .9rem;
  margin-top: 1.4rem; background: #fdf8f1; }
.gaps h4 { margin: 0 0 .3rem; font-size: 10px; text-transform: uppercase;
  letter-spacing: .08em; color: var(--out); }
.gaps ul { margin: 0; padding-left: 1.1rem; font-size: 11.5px; }
h4 { font-size: 10px; text-transform: uppercase; letter-spacing: .08em;
  color: var(--ink-3); margin: 1.2rem 0 .3rem; }

/* ---------- the run ------------------------------------------------------- */
#run-panel, #run-body { margin-top: 1.4rem; border-top: 1px solid var(--rule); padding-top: 1rem; }
.runbar { display: flex; gap: .35rem; align-items: center; flex-wrap: wrap; margin-bottom: .7rem; }
.runbar .why { color: var(--ink-3); font-size: 10.5px; }
.answer { font: 600 27px Georgia, serif; margin: .4rem 0 .2rem; }
.answer .unit { font-size: 14px; color: var(--ink-3); font-weight: 400; }
.answer.none { color: var(--ink-3); font-size: 18px; }
.cred { display: flex; gap: .2rem; align-items: flex-end; height: 40px; margin: .7rem 0 2.1rem; }
.cred .f { width: 34px; height: 100%; background: #ece8de; position: relative; border-radius: 2px 2px 0 0; }
.cred .f i { position: absolute; bottom: 0; left: 0; right: 0; min-height: 3px;
  background: var(--ink-2); border-radius: 2px 2px 0 0; }
.cred .f.gov i { background: var(--out); }
.cred .f span { position: absolute; top: 100%; left: 1px; font-size: 8px; color: var(--ink-3);
  white-space: nowrap; transform: rotate(38deg); transform-origin: left top; }
.blocked { font-size: 10.5px; color: #a4262c; background: #fdf5f4; border: 1px solid #f0d8d6;
  border-radius: 3px; padding: .5rem .7rem; margin: .7rem 0; max-height: 15rem; overflow: auto; }
.verdicts { font-size: 10.5px; margin: .7rem 0; }
.verdicts .pass { color: var(--both); }
.verdicts .fail { color: #a4262c; }
.chainline { font-size: 10.5px; color: var(--ink-3); margin-top: .7rem; }

/* ---------- who the run is for, and the inputs it runs at ------------------ */
/* The pale tokens are redefined for the dark scheme, so every badge below
   follows the page without a block of its own. */
.run-case { font-size: 11px; color: var(--ink-2); margin: -.3rem 0 .6rem; }
.run-case p { margin: .15rem 0; }
.run-case .xref { margin-left: .3rem; }
.run-inputs { margin: .2rem 0 .8rem; }
.run-inputs-h { font-size: 11px; color: var(--ink-2); cursor: pointer; margin-bottom: .35rem; }
.ri-wrap { overflow-x: auto; }
.run-in-table { width: 100%; border-collapse: collapse; font-size: 11px; }
.sweepctl select { max-width: 100%; }
.run-in-table th { text-align: left; font-weight: 500; color: var(--ink-3); font-size: 10px;
  border-bottom: 1px solid var(--rule); padding: .25rem .4rem; }
.run-in-table td { border-bottom: 1px solid var(--rule-2); padding: .3rem .4rem; vertical-align: top; }
.run-in-table tr.ri.more { display: none; }
.run-in-table tr.ri.on td { background: var(--out-pale); }
.run-in-table .ri-id { font-size: 10px; }
.run-in-table .ri-v { width: 7.5rem; font: 11px var(--mono); border: 1px solid var(--rule);
  background: var(--card); color: var(--ink); padding: .1rem .3rem; }
.run-in-table tr.bad .ri-v { border-color: #a4262c; }
.run-in-table .ri-why { color: #a4262c; font-size: 10px; }
.run-in-table .ri-was { font-size: 10px; }
.run-in-table .ri-range { white-space: nowrap; font-size: 10px; }
.ri-src { font-size: 10px; padding: 0 .35rem; border-radius: 2px; white-space: nowrap;
  border: 1px solid var(--rule); color: var(--ink-3); }
.ri-src.saved { color: var(--in); border-color: var(--in); background: var(--in-pale); }
.ri-grp { font-size: 10px; margin-top: .15rem; }
.ri-src.you  { color: var(--out); border-color: var(--out); background: var(--out-pale); }
.ri-more { margin-top: .4rem; }
.ri-foot { font-size: 10.5px; margin-top: .5rem; }
.ri-foot .ri-go, .ri-foot .ri-save { margin-left: .4rem; }
.run-go-bar { margin-top: .4rem; }
.run-for { font-size: 11px; color: var(--ink-2); margin: 0 0 .4rem; }
.run-stale { font-size: 11px; color: var(--out); background: var(--out-pale);
  border: 1px solid var(--out); border-radius: 3px; padding: .3rem .6rem; margin: .4rem 0; }
/* an answer read back from a saved result: said first, in the "saved" hue */
.run-saved { display: block; font-size: 11px; color: var(--in); background: var(--in-pale);
  border: 1px solid var(--in); border-radius: 3px; padding: .3rem .6rem; margin: .4rem 0; }
.run-saved .ctl { margin-left: .3rem; }
.sw-keep { margin-top: .4rem; }

  border-radius: 3px; padding: 0 4px; margin-left: .3rem; }
.run-evidence > summary, .run-blocked > summary { font-size: 10.5px; cursor: pointer;
  color: var(--ink-2); margin: .5rem 0 .2rem; }
.run-evidence > summary { color: var(--both); }
.run-evidence[open] > summary { margin-bottom: 0; }
.sw-all-l { font-size: 10.5px; color: var(--ink-2); display: inline-flex; align-items: center; gap: .3rem; }
.sweepctl input[type="checkbox"] { width: auto; }
/* the case bar, and the Inputs page */
#case-name { font-size: 11px; font-weight: 600; color: var(--ink); }
#case-upload-l, #case-download, .case-actions a.ctl, .case-up-l { cursor: pointer; text-decoration: none; }
.case-state { font-size: 11px; color: var(--ink-2); margin: 0 0 .6rem; }
.case-state p { margin: .15rem 0; }
.case-actions { flex-wrap: wrap; gap: .4rem; }
.case-tabs { margin-top: 1rem; align-items: center; flex-wrap: wrap; }
.case-tabs .case-n { font-size: 10px; color: var(--in); margin-left: .25rem; }
.case-filter { margin-left: auto; width: 14rem; max-width: 100%; font: 11px var(--mono);
  border: 1px solid var(--rule); background: var(--card); color: var(--ink); padding: .2rem .4rem; }

.case-table { width: 100%; border-collapse: collapse; font-size: 11px; }
.case-table th { text-align: left; font-weight: 500; color: var(--ink-3); font-size: 10px;
  border-bottom: 1px solid var(--rule); padding: .25rem .4rem; }
.case-table td { border-bottom: 1px solid var(--rule-2); padding: .3rem .4rem; vertical-align: top; }
.case-table tr.ci.saved td { background: var(--in-pale); }
.case-table tr.ci.on td { background: var(--out-pale); }
.case-table .ri-id { font-size: 10px; }
.case-table .ci-v { width: 7.5rem; font: 11px var(--mono); border: 1px solid var(--rule);

/* The unit sits after the field in a table row, not inside it as it does on
   the node page's single editor — absolute there, it escaped every table. */

.case-save-bar { margin-top: .6rem; }
/* saved results, and the forms page */
.res-actions, .res-do { flex-wrap: wrap; gap: .4rem; }
.res-up-l, .forms-up-l, .forms-dl, .forms-new { cursor: pointer; text-decoration: none; }
.res-list tr.sel td { background: var(--in-pale); }
.res-one { border: 1px solid var(--rule); border-radius: 3px; padding: .6rem .9rem; margin: 1rem 0; background: var(--card); }
.res-one h3 { margin: 0 0 .3rem; font-size: 13px; }

.res-cmp-box { border: 1px dashed var(--rule); border-radius: 3px; padding: .4rem .7rem; margin: .6rem 0; font-size: 11px; }
.res-bar-c { width: 30%; }
.res-bar { display: block; height: 8px; border-radius: 2px; }
.res-bar.up { background: var(--out); }
.res-bar.down { background: var(--in); }
.res-save-bar { margin-top: .6rem; flex-wrap: wrap; }

.forms-who { width: 100%; border-collapse: collapse; font-size: 11px; margin: .6rem 0 1rem; }

/* the node's form */
.nform-steps li { margin: .3rem 0; }
.nform-dl, .nform-up-l { cursor: pointer; text-decoration: none; }
.nform-file { border: 1px solid var(--rule); border-radius: 3px; padding: .5rem .7rem; margin: .6rem 0;
  font-size: 11px; background: var(--card); }
.nform-file h4 { margin: 0 0 .3rem; font-size: 11.5px; }
.nform-file table { border-collapse: collapse; font-size: 11px; margin: .3rem 0; width: 100%; }
.nform-file td, .nform-file th { border-bottom: 1px solid var(--rule-2); padding: .2rem .5rem; text-align: left;
  vertical-align: top; overflow-wrap: anywhere; }
.nform-file td:first-child, .nform-file td:nth-child(2) { white-space: nowrap; }
.nform-file td:nth-child(3), .nform-file td:nth-child(4) { width: 40%; }
.nform-file tr.nform-apply td:first-child { color: var(--both); }
.nform-file tr.nform-conflict td:first-child, .nform-file tr.nform-refused td:first-child { color: #a4262c; font-weight: 600; }
.nform-why { color: #a4262c; font-size: 10px; margin-top: .15rem; }
.nform-fx { font: 10.5px var(--mono); white-space: pre-wrap; background: var(--paper); padding: .4rem; }
.case-upgrade { border: 1px solid var(--in); border-radius: 3px; padding: .4rem .7rem; margin: .5rem 0;
  background: var(--in-pale); font-size: 11px; }
.case-upgrade p { margin: .25rem 0; }
.case-file { border: 1px solid var(--rule); border-radius: 3px; padding: .5rem .7rem; margin: .6rem 0;
  font-size: 11px; background: var(--card); }
.case-file h4 { margin: 0 0 .3rem; font-size: 11.5px; }
.case-file table { border-collapse: collapse; font-size: 11px; margin: .3rem 0; }
.case-file td, .case-file th { border-bottom: 1px solid var(--rule-2); padding: .2rem .5rem; text-align: left; }
.sweepctl { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap;
  margin-top: .8rem; font-size: 10.5px; color: var(--ink-3); }
.sweepctl input { width: 7rem; font: 11px var(--mono); border: 1px solid var(--rule);
  border-radius: 3px; padding: .18rem .35rem; }
.sweepctl input.bad { border-color: #a4262c; background: #fdf5f4; }
/* CONTENT-BOX, AGAINST THE SHEET'S OWN `* { box-sizing: border-box }`.
   A canvas's width is its DRAWING AREA, and with border-box an explicit width
   of 1180px gives a 1178px content box — so the backing store is stretched
   across two pixels fewer than it was drawn for, which is a squash nobody asked
   for. It only appeared when the figures started pinning their CSS size to
   carry a device pixel ratio; before that the element took its size from the
   width attribute and the border sat outside it, which is the behaviour this
   restores. */
canvas.plot { box-sizing: content-box; border: 1px solid var(--rule-2);
  background: var(--card); border-radius: 3px; margin-top: .6rem; max-width: 100%; }

footer { padding: 1rem 2.5rem 2.5rem; border-top: 1px solid var(--rule-2);
  color: var(--ink-3); font-size: 10.5px; }

@media print {
  #tabs, #howto-panel, .nudge, #back { display: none; }
  body { background: #fff; }
}
@media print {
  .grid { max-height: none; overflow: visible; }
}

/* ---------- the segments -------------------------------------------------- */
/* The node page is three named parts in a fixed order — what it is made of,
   what it is joined to, what it says — because the order is what has to be
   repeatable when the next thousand rows are filled in. */
.seg { margin: 0 0 2rem; }
.seg-h {
  display: flex; align-items: center; gap: .5rem; margin: 0 0 .6rem;
  font: 10.5px var(--mono); text-transform: uppercase; letter-spacing: .09em;
  color: var(--ink-3); border-bottom: 1px solid var(--rule); padding-bottom: .35rem;
}
.seg-n {
  width: 17px; height: 17px; border-radius: 50%; display: inline-grid; place-items: center;
  background: var(--ink); color: var(--paper); font-size: 9.5px; flex: none;
}
.seg-lead { font-size: 11.5px; color: var(--ink-2); margin: 0 0 .6rem; }
.seg-lead code { background: #f4f2ec; padding: .1rem .3rem; border-radius: 2px; }
.seg-note { font-size: 11px; color: var(--ink-3); margin: .5rem 0 0; }

table.asm-t, table.conn-t, table.grid-t {
  border-collapse: collapse; width: 100%; font-size: 11px; margin: .4rem 0 .2rem;
}
table.asm-t th, table.grid-t th {
  text-align: left; font-size: 9.5px; text-transform: uppercase; letter-spacing: .07em;
  color: var(--ink-3); border-bottom: 1px solid var(--rule); padding: .3rem .5rem;
}
table.asm-t td, table.grid-t td { padding: .28rem .5rem; border-bottom: 1px solid var(--rule-2); }
table.asm-t tr.absent td { color: var(--ink-3); }
table.grid-t tr.tot td { font-weight: 600; border-top: 1px solid var(--rule); }
.by { font-size: 9.5px; padding: .05rem .35rem; border-radius: 2px; }
.by.hand { background: var(--teal-pale); color: var(--teal); }
.by.gen  { background: #f0ede5; color: var(--ink-3); }

table.conn-t th {
  text-align: left; vertical-align: top; width: 15rem; padding: .45rem .6rem .45rem 0;
  border-bottom: 1px solid var(--rule-2); font-size: 10px; text-transform: uppercase;
  letter-spacing: .07em; color: var(--ink-2); font-weight: 500;
}
table.conn-t th .why {
  display: block; text-transform: none; letter-spacing: 0; font-size: 10px;
  color: var(--ink-3); margin-top: .15rem; font-weight: 400;
}
table.conn-t td { padding: .45rem 0; border-bottom: 1px solid var(--rule-2); line-height: 1.7; }

/* ---------- the architecture view ----------------------------------------- */
#archview { max-width: 78rem; }
.arch-nav { display: flex; gap: .35rem; flex-wrap: wrap; margin: 0 0 1.3rem; }
.tab.arch-tab { border-style: dashed; }
.arch-lead { font: 14px/1.6 Georgia, "Iowan Old Style", serif; color: var(--ink); margin: 0 0 1.1rem; max-width: 54rem; }
.prose { font: 12.5px/1.65 Georgia, "Iowan Old Style", serif; color: var(--ink-2); max-width: 54rem; margin: .5rem 0; }
.prose b { color: var(--ink); }
.cards { display: flex; gap: .6rem; flex-wrap: wrap; margin: 0 0 1.2rem; }
.card {
  border: 1px solid var(--rule); border-radius: 3px; background: var(--card);
  padding: .55rem .8rem; min-width: 11rem; flex: 1;
}
.card b { display: block; font: 500 22px var(--mono); }
.card .k { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .09em; color: var(--teal); }
.card .w { display: block; font-size: 10.5px; color: var(--ink-3); margin-top: .25rem; }
.tone { display: inline-block; width: 3px; height: 10px; margin-right: .4rem; vertical-align: -1px; background: var(--slate); }
.tone.t-teal { background: var(--teal); } .tone.t-amber { background: var(--out); }
.tone.t-violet { background: var(--in); } .tone.t-green { background: var(--both); }
table.tree-t td:first-child { white-space: nowrap; }

/* the solar weather tabs — eight panels, one canvas each */
#solarview { padding: 0 0 24px; }
#solarview .sw-tabs { margin: 10px 0 14px; display: flex; flex-wrap: wrap; gap: 6px; }
/* The canvas is sized in script to the width there actually is, so CSS must not
   then scale the backing store down — that is what made the axis labels shrink
   the moment the canvas was allowed to be wide. No width here at all: the
   element's own attributes are the size.

   The caption keeps a reading measure, because prose does not get better wide. */
#solarview .sw-panel { display: block; margin: 10px 0 8px; }
#solarview .sw-panel-note { max-width: 96ch; line-height: 1.55; font-size: 12px; }
#solarview .sweepctl { margin: 6px 0 4px; }

/* the relation, walked — one more statement of the same mathematics */
pre.pseudo { background: var(--card); border: 1px solid var(--rule-2); padding: 10px 12px;
  overflow-x: auto; font-size: 12px; line-height: 1.5; }
.relation-host .rel-plot { width: 100%; max-width: 900px; height: auto; margin: 8px 0; }
.relation-host .rel-scrub { vertical-align: middle; width: 220px; }
.relation-host .rel-note { max-width: 900px; line-height: 1.5; font-size: 12px; }


/* ---------------------------------------------------------------------------
   DARK MODE LIVES AT THE END OF THE SHEET, AND THAT IS NOT TIDINESS.

   It was written at the top, beside the tokens it overrides, and the token
   overrides worked while every plain-selector one silently did not: at equal
   specificity the LATER rule wins, and `.mcell.diag` is declared three hundred
   lines below. The matrix came out a grey slab with the light diagonal cells
   still glowing through it, and nothing reported a thing — the page was valid
   CSS doing exactly what it said.
   --------------------------------------------------------------------------- */

/* ---------------------------------------------------------------------------
   The what-if: an input a reader has moved, and the bar that will not let them
   forget it.

   Everything here is a token, never a literal. The dark work that preceded this
   found fourteen hex values in this stylesheet that never followed the scheme
   and showed up as light blocks burned into a dark page; a new block written in
   literals would be the fifteenth. Amber is the colour: it is already this
   face's "attention" hue and it is not teal, which is the shell's own.
*/
#ovrbar {
  margin: 0 0 14px; padding: 10px 12px;
  background: var(--out-pale); border: 1px solid var(--out);
  border-radius: 6px;
}
.ovr-bar-h { font-size: 13px; margin-bottom: 8px; }
.ovr-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.ovr-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 2px 4px 2px 8px; border-radius: 12px;
  background: var(--card); border: 1px solid var(--out);
  font: 12px/1.6 var(--mono); cursor: pointer;
}
.ovr-x {
  border: 0; background: none; cursor: pointer; color: var(--muted);
  font-size: 14px; line-height: 1; padding: 2px 5px; border-radius: 10px;
}
.ovr-x:hover { background: var(--out); color: var(--card); }
.ovr-bar-act { display: flex; align-items: center; gap: 8px; }
.ovr-bar-out:not(:empty) { margin-top: 10px; }

/* The control on a node page. */
.ovr-panel { border-left: 3px solid var(--out); }
.ovr { padding: 2px 0 8px; }
.ovr-h { margin-bottom: 6px; }
.ovr-tag {
  margin-left: 8px; padding: 1px 7px; border-radius: 10px;
  background: var(--out); color: var(--card);
  font: 11px/1.6 var(--mono); text-transform: uppercase; letter-spacing: .04em;
}
.ovr-row { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
.ovr-dec, .ovr-in {
  display: flex; flex-direction: column; gap: 3px;
  font-size: 11px; color: var(--muted); text-transform: uppercase;
  letter-spacing: .04em;
}
.ovr-dec span { font: 15px/1.4 var(--mono); color: var(--ink); text-transform: none; }
.ovr-in { position: relative; }
.ovr-v {
  width: 9em; padding: 5px 34px 5px 8px;
  font: 15px/1.4 var(--mono); color: var(--ink);
  background: var(--card); border: 1px solid var(--rule); border-radius: 4px;
}
.ovr.on .ovr-v { border-color: var(--out); background: var(--out-pale); }
.ovr.bad .ovr-v { border-color: #a4262c; background: #fdf5f4; }
.ovr-u {
  position: absolute; right: 8px; bottom: 7px;
  font: 12px/1 var(--mono); color: var(--muted); text-transform: none;
}
.ovr-range { font-size: 12px; margin-top: 6px; }
.ovr-why { color: #a4262c; }
.ovr-count { font-size: 13px; margin: 0 0 6px; }

/* The three stages of a run, numbered the way the segments on a node page are:
   alone, then every active branch, then everything. */
.ovr-stage { margin-top: 16px; }
.ovr-stage h4 {
  display: flex; align-items: center; gap: 8px;
  margin: 0 0 8px; font-size: 12px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .05em; color: var(--muted);
}
.ovr-n {
  display: inline-flex; align-items: center; justify-content: center;
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--out); color: var(--card);
  font: 11px/1 var(--mono); letter-spacing: 0;
}
.ovr-stage .answer { margin: 0; }
.ovr-diff td.num { text-align: right; font: 12px/1.5 var(--mono); }
.ovr-refused td { color: #a4262c; }
/* Already refusing before the edit: a fact, not an alarm. */
.ovr-pre td { color: var(--muted); }

/* What moved. A table, because the reader scans down one column. */
.ovr-diff { width: 100%; border-collapse: collapse; font-size: 12px; }
.ovr-diff th {
  text-align: left; font-weight: 600; color: var(--muted);
  border-bottom: 1px solid var(--rule); padding: 4px 8px 4px 0;
  text-transform: uppercase; letter-spacing: .04em; font-size: 11px;
}
.ovr-diff td { padding: 5px 8px 5px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
.ovr-diff td:last-child { text-align: right; font: 12px/1.5 var(--mono); white-space: nowrap; }
/* THE BRANCH TABLE'S LAST COLUMN IS PROSE, NOT A PERCENTAGE. A refusal message
   carries the offending value, and one of them is a 28-digit number: under the
   nowrap above it stretched the table past the viewport and pushed the `now`
   column off the right-hand edge, so every branch appeared to have no answer.
   The screenshot showed it; the text assertions did not, because the data was
   there and only the layout was wrong. */
.ovr-bt { table-layout: fixed; }
.ovr-bt td:last-child, .ovr-bt th:last-child { text-align: left; white-space: normal; }
.ovr-bt td { overflow-wrap: anywhere; }
.ovr-bt th:first-child, .ovr-bt td:first-child { width: 34%; }
.ovr-bt th.num, .ovr-bt td.num { width: 8%; }
.ovr-bt th:nth-child(3), .ovr-bt td:nth-child(3) { width: 16%; }
.ovr-diff .up { color: var(--out); }
.ovr-diff .down { color: var(--in); }

/* DARK IS SELECTED, NOT FLIPPED.
   Every token here is chosen against the dark surface rather than derived from
   the light one: an inverted palette is how hues picked against white end up
   unreadable on black. The paper/card relationship is kept — the card is a step
   LIGHTER than the paper here, where in light mode it is a step brighter — so a
   figure is still a card on a page and the 1px rule still separates them.

   The five accent pairs keep their meanings and their hue angles and take the
   lightness a dark surface needs; the pale companions become dark washes rather
   than light ones, because a pale fill on a dark page is a hole in it.

   The chart's own palette is NOT here. Canvas ink cannot come from CSS, so
   web/js/chart.js carries both schemes and swaps them; the two were validated
   separately, each against its own surface. */
@media (prefers-color-scheme: dark) {
  :root {
    --paper:   #141310;
    --card:    #1e1d19;
    --ink:     #ecebe6;
    --ink-2:   #b8b5ad;
    --ink-3:   #8f8c84;
    --rule:    #3a382f;
    --rule-2:  #2e2c27;

    --out:     #d18a2b;
    --out-pale:#3a2c14;
    --in:      #a98ae0;
    --in-pale: #2a2340;
    --both:    #4fa87a;
    --both-pale:#17301f;
    --teal:    #3cb3b1;
    --teal-pale:#123230;
    --slate:   #94a3b8;
    --slate-pale:#22262e;
  }
  /* WHITE ON AN ACCENT IS THE WRONG WAY ROUND HERE. In light mode the accents
     are dark enough to carry white text; in dark mode they are chosen light
     enough to be seen ON the page, so the text on top of one has to be the
     page's own dark instead. Five places print `color: #fff` on a filled
     accent, and every one of them reads as glare without this. */
  .step.on .n, .pill.out, .pill.in, .pill.both { color: var(--paper); }
  /* The seeded hatch is two light greys, which on a dark page is a bright
     block. Same pattern, dark. */
  .seeded, .hatch {
    background: repeating-linear-gradient(45deg,#232119,#232119 3px,#2b2921 3px,#2b2921 6px);
  }
  /* A form field inherits the system's light chrome unless told otherwise. */
  input, select, textarea, button { color-scheme: dark; }
  .sweepctl input.bad { background: #2c1a19; }
  .maths code, .seg-lead code, ol.derive .dm { background: #232119; }

  /* EVERY LITERAL LIGHT FILL IN THE SHEET, AND THERE WERE FOURTEEN. A token
     follows the scheme; a hex does not, and a warm off-white block is a hole
     burned in a dark page. The matrix was the loud one — its diagonal cells and
     the veil over the whole grid are both literals, so in dark mode the entire
     matrix came out a grey slab with the tree glowing through it. Nothing here
     is a new decision: each is the same job the light value does, chosen
     against the dark surface. */
  .mcell.diag { background: #2a2820; }
  .mcell.diag:hover { background: #3a372c; }
  .mcell.diag.seeded {
    background: repeating-linear-gradient(45deg,#26241d,#26241d 3px,#2f2c24 3px,#2f2c24 6px);
  }
  .boxrect { background: rgba(0,0,0,.35); }
  .empty { background: #1b1a16; }
  .gaps { background: #241f16; }
  table.iface tr.out td { background: #241f16; }
  ol.derive li.now { background: #241f16; outline-color: #4a3d23; }
  pre.code { background: #1b1a16; }
  .cred .f { background: #2e2c27; }
  .blocked { color: #e88a8a; background: #2c1a19; border-color: #4a2a28; }
  /* The what-if bar. The amber pale token is already dark-side, so the block
     only has to stop the chip reading as a hole in the page. */
  .ovr-chip { background: var(--paper); }
  .ovr.on .ovr-v { background: var(--paper); }
  .ovr-why { color: #e88a8a; }
  .ovr.bad .ovr-v { border-color: #e88a8a; background: #2c1a19; }
  .ovr-refused td { color: #e88a8a; }
}

/* INACTIVE — written, generated, compiling, and it does not answer.
   Deliberately not the seeded treatment: a seeded row is one nobody has
   written, and reading the two as one state is how a reader concludes the tool
   is mostly empty rather than mostly unaccounted for. Faded like seeded so it
   recedes, and underlined rather than italic so the two are distinguishable
   next to each other in the same tree. */
.pill .inactive { opacity: .6; text-decoration: underline dotted; text-underline-offset: 3px; }

/* The one-line verdict at the top of a node page. Ruled on the left in the
   same 3px the tree pills use, so it reads as a property of the row rather
   than as a message about the page. */
.banner {
  border: 1px solid var(--rule); border-left-width: 3px; border-radius: 3px;
  background: var(--card); padding: .5rem .6rem; margin: 0 0 .7rem;
  font-size: 12px; line-height: 1.5; color: var(--ink-2);
}
.banner b { color: var(--ink); }
.banner .muted { display: block; margin-top: .35rem; }
.banner.inactive { border-left-color: var(--out); }
.banner.unconfirmed { border-left-color: var(--slate); }
/* The same refusal in the run panel, where it is the reason a control is off. */
.empty.refuse { border-left: 3px solid var(--out); padding-left: .6rem; }

/* UNREAD — it answers, and the design is not reading the answer. Teal rather
   than amber: amber is "something here is missing", and nothing is missing in
   the row. What is missing is a wiring decision somewhere else. */
.banner.unread { border-left-color: var(--teal); }

/* the sheet, read — and the node's form beside it */
.sheet-tabs { margin: 0 0 10px; }

/* ─── the manual ────────────────────────────────────────────────────────────
   A page to read, not a figure: a narrow column for the prose, a sidebar for
   where you are, and a card at the top saying what is true of THIS copy of the
   tool before anything tells you to press a button it will refuse. Every colour
   is a token, so the dark scheme is the one the rest of the face already has. */
#manualview { max-width: 76rem; }
.man { display: grid; grid-template-columns: 15rem minmax(0, 1fr); gap: 2rem; align-items: start; }
.man-side { position: sticky; top: .75rem; max-height: calc(100vh - 1.5rem); overflow: auto;
  font-size: 13px; padding-right: .25rem; }
.man-side-h { font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
  color: var(--ink-3); margin: 1.1rem 0 .4rem; }
.man-side-h:first-child { margin-top: 0; }
.man-side-h.cur a { color: var(--ink); font-weight: 600; }
.man-side-h a { color: var(--ink-2); text-decoration: none; }
.man-filter { display: flex; gap: .25rem; flex-wrap: wrap; }
.man-side-note { font-size: 11.5px; color: var(--ink-3); line-height: 1.5; margin: .6rem 0 0; }
.man-toc { display: flex; flex-direction: column; border-left: 2px solid var(--rule-2);
  margin: .2rem 0 .4rem; }
.man-toc a { padding: .22rem .6rem; color: var(--ink-2); text-decoration: none; line-height: 1.35; }
.man-toc a:hover { color: var(--ink); background: var(--rule-2); }

.man-main { min-width: 0; max-width: 52rem; font-size: 14px; line-height: 1.6; color: var(--ink); }
.man-main p { margin: .55rem 0; }
.man-main code { font-family: var(--mono); font-size: .88em; background: var(--rule-2);
  padding: .05em .3em; border-radius: 3px; white-space: nowrap; }
.man-h { font-size: 22px; font-weight: 600; margin: 1.2rem 0 .2rem; }
.man-lede { color: var(--ink-2); }
.man-layers { display: flex; gap: .35rem; flex-wrap: wrap; margin: 1.1rem 0 0; }

/* What is true of this copy, right now. The first thing on the page. */
.man-live { border: 1px solid var(--rule); background: var(--card); border-radius: 6px;
  padding: .8rem 1rem; }
.man-live-h { font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
  color: var(--ink-3); margin-bottom: .35rem; }
.man-live-row { padding: .3rem 0 .3rem .7rem; border-left: 3px solid var(--rule); margin: .35rem 0; }
.man-live-row.good { border-left-color: var(--both); }
.man-live-row.bad  { border-left-color: var(--out); }

.man-sec { margin: 2rem 0 0; padding-top: 1.2rem; border-top: 1px solid var(--rule-2);
  scroll-margin-top: .75rem; }
.man-sec h3 { font-size: 17px; font-weight: 600; margin: 0 0 .3rem; }
.man-sub { font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3);
  margin: 1.1rem 0 .3rem; }
.man-who { font-size: 10.5px; font-weight: 500; letter-spacing: .05em; text-transform: uppercase;
  vertical-align: middle; padding: .1rem .45rem; border-radius: 10px; margin-left: .4rem;
  border: 1px solid var(--rule); color: var(--ink-3); }
.man-who.user { color: var(--in); border-color: var(--in); }
.man-who.developer { color: var(--teal); border-color: var(--teal); }
.man-who.maintainer { color: var(--out); border-color: var(--out); }

.man-steps { margin: .8rem 0 0; padding-left: 1.4rem; }
.man-step { margin: 0 0 .9rem; padding-left: .2rem; }
.man-step::marker { color: var(--ink-3); font-family: var(--mono); font-size: 12px; }
/* A label on the page, drawn the way a key is — the thing to look for. */
.man-ui { font-family: inherit; font-size: 12.5px; white-space: nowrap; padding: .08rem .45rem;
  border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px;
  background: var(--card); color: var(--ink); }

/* A command: exactly what to paste, what it will do, and a button to copy it. */
.man-cmd { margin: .45rem 0 0; }
/* The copy button sits in the box it copies, never on the note under it. */
.man-cmd-box { position: relative; }
.man-cmd pre { margin: 0; padding: .6rem 4.6rem .6rem .75rem; background: var(--card);
  border: 1px solid var(--rule); border-radius: 5px; overflow-x: auto; }
.man-cmd pre code { background: none; padding: 0; font-size: 12.5px; white-space: pre; }
.man-copy { position: absolute; top: .35rem; right: .35rem; font-size: 11.5px; }
.man-cmd-note { margin-top: .25rem; }
.man-tag { font-size: 11.5px; color: var(--ink-3); }
.man-tag::before { content: "● "; }
.man-tag.ok::before { color: var(--both); }
.man-tag.writes::before, .man-tag.refuse::before { color: var(--out); }
.man-tag.serve::before, .man-tag.ci::before { color: var(--teal); }

.man-tablewrap { overflow-x: auto; margin: .8rem 0 0; }
.man-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.man-table th { text-align: left; font-weight: 500; color: var(--ink-3); font-size: 11.5px;
  border-bottom: 1px solid var(--rule); padding: .35rem .5rem; }
.man-table td { border-bottom: 1px solid var(--rule-2); padding: .5rem; vertical-align: top; }
.man-table td .man-cmd { margin: 0; }
.man-table .muted { font-size: 12px; margin-top: .15rem; }
.man-usage { white-space: pre-wrap; word-break: break-word; }
.man-effect { font-size: 10.5px; letter-spacing: .04em; text-transform: uppercase; padding: .05rem .4rem;
  border-radius: 3px; border: 1px solid var(--rule); color: var(--ink-3); white-space: nowrap; }
.man-effect.writes { color: var(--out); border-color: var(--out); }
.man-effect.irreversible { color: var(--paper); background: var(--out); border-color: var(--out); }
.man-foot { margin: 2.5rem 0 1rem; font-size: 12px; }

/* A phone: the sidebar goes above the text, and the contents list becomes a
   short scroll rather than a column the text has to wait below. */
@media (max-width: 760px) {
  /* A phone is narrower than the two sticky columns were: the tree takes what
     is left beside the paths, and the column heads wrap rather than push the
     page sideways. */
  :root { --treew: 210px; --pathw: 44px; }
  .colheads { grid-template-columns: minmax(0, 1fr); gap: .15rem; }
  .man { grid-template-columns: minmax(0, 1fr); gap: 1rem; }
  .man-main code, .man-ui { white-space: normal; overflow-wrap: anywhere; }
  .man-side { position: static; max-height: none; }
  .man-toc { max-height: 12rem; overflow: auto; }
  .man-main { font-size: 15px; }
  .man-cmd pre { padding-right: .75rem; padding-bottom: 2.1rem; }
  .man-copy { top: auto; bottom: .35rem; }
}

/* ---------- the explanation standard (docs/EXPLAINING.md) ----------------- */
/* Depth: `d-l` only to a learner, `d-lr` to a learner and a reader. */
html:not([data-depth="learn"]) .d-l { display: none; }
html[data-depth="expert"] .d-lr { display: none; }
#depth { float: right; margin-top: -2.1rem; }
#depth .lbl { color: var(--ink-3); margin-right: .3rem; }

/* Answer first: the node in four lines, before any tab. */
.answer-first { border-left: 3px solid var(--both); background: var(--both-pale);
  padding: .5rem .9rem .6rem; margin: .6rem 0 .8rem; border-radius: 0 3px 3px 0; }
.af-k { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--both);
  margin: 0 0 .2rem; }
.af-q { font-weight: 600; margin: 0 0 .25rem; }
.af-a { margin: 0 0 .3rem; }
.af-points { margin: .2rem 0 0; padding-left: 1.1rem; }
.af-points li { margin: .1rem 0; }

/* The station: say it simply, the real thing, where it breaks, the wrong idea, try it. */
.station .st-h { display: flex; align-items: center; gap: .45rem; margin: .9rem 0 .3rem;
  font-size: 12px; }
.st-n { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%;
  background: var(--in-pale); color: var(--in); font-size: 10.5px; }
.simply { font-size: 13px; }
.breaks, .wrong { border-left: 2px solid var(--out); padding-left: .6rem; }
.wrong { border-left-color: #a4262c; }
.predict { background: var(--in-pale); padding: .4rem .6rem; border-radius: 3px; }

/* The kind of each tab (Diátaxis), and the kind of each claim. */
.dx { display: inline-block; font-size: 10px; text-transform: uppercase; letter-spacing: .07em;
  padding: 0 .4rem; border-radius: 2px; margin: 0 0 .4rem; border: 1px solid var(--rule);
  color: var(--ink-3); }
.dx-explanation { color: var(--in); border-color: var(--in); }
.dx-tutorial { color: var(--out); border-color: var(--out); }
.claim { display: inline-block; font-size: 10.5px; padding: 0 .35rem; border-radius: 2px;
  border: 1px solid var(--rule); color: var(--ink-2); white-space: nowrap; vertical-align: 1px; }
.claim-sourced { border-color: var(--teal); color: var(--teal); }
.claim-derived { border-color: var(--in); color: var(--in); }
.claim-declared { border-color: var(--out); color: var(--out); }
.claim-illustrative { border-style: dashed; }

/* De-risking: the belief a node rests on, and every version before it. */
.belief { border: 1px solid var(--both); border-radius: 3px; padding: .4rem .7rem; margin: 0 0 .6rem; }
.belief p { margin: .15rem 0; }
.belief-h { color: var(--both); }
ol.versions { padding-left: 1.2rem; }
li.version { margin: 0 0 .7rem; }
.version-h { margin: 0 0 .2rem; }
.version-h .about { color: var(--in); }
li.version dl { display: grid; grid-template-columns: max-content 1fr; gap: .1rem .8rem; margin: 0; }
li.version dt { color: var(--ink-3); }
li.version dd { margin: 0; }
table.risks td { vertical-align: top; }
@media (max-width: 640px) {
  li.version dl { grid-template-columns: 1fr; }
  #depth { float: none; margin: .3rem 0 0; display: inline-block; }
}
@media (prefers-color-scheme: dark) {
  .wrong { border-left-color: #ef8a8a; }
}

/* The manual: each section's answer, first, and its kind. */
.man-answer { border-left: 3px solid var(--both); background: var(--both-pale); padding: .35rem .7rem;
  margin: .3rem 0 .6rem; border-radius: 0 3px 3px 0; }
.man-answer .af-k { display: block; }
.dx-how-to { color: var(--teal); border-color: var(--teal); }
.dx-reference { color: var(--ink2, #555); border-color: currentColor; }
.view-af { margin: .4rem 0 .8rem; }
.nform-dr { display: grid; grid-template-columns: max-content 1fr; gap: .1rem .8rem; }
.nform-dr dt { color: var(--ink-3); }
.nform-dr dd { margin: 0; }
@media (max-width: 640px) { .nform-dr { grid-template-columns: 1fr; } }

/* A PREVIEW build: one author's change, before it is approved. The banner is on
   every view and never scrolls away, so a preview is never mistaken for a
   release; amber, the colour this face already uses for "not settled". */
#contract-bar { padding: .45rem .8rem; font-size: 12px; background: var(--out-pale); color: var(--ink);
  border-bottom: 2px solid var(--out); }
#mock-bar { padding: .45rem .8rem; font-size: 12px; background: var(--in-pale); color: var(--ink);
  border-bottom: 2px solid var(--in); }
#mock-bar b { color: var(--in); letter-spacing: .04em; }
#contract-bar b { color: var(--out); letter-spacing: .04em; }
#preview-bar {
  position: sticky; top: 0; z-index: 50;
  background: var(--out-pale); color: var(--ink); border-bottom: 2px solid var(--out);
  padding: .5rem 2.5rem; font-size: 13px; line-height: 1.6;
}
#preview-bar b { color: var(--out); letter-spacing: .04em; }
#preview-bar .pv-approve { margin-left: .5rem; }
#approve-dlg { max-width: 34rem; border: 1px solid var(--rule); border-radius: 4px;
  background: var(--card); color: var(--ink); padding: 1rem 1.2rem; }
#approve-dlg::backdrop { background: rgba(0, 0, 0, .35); }
.pv-form label { display: block; margin: .6rem 0; }
.pv-form input[name="by"], .pv-form textarea { display: block; width: 100%; box-sizing: border-box;
  margin-top: .25rem; font: inherit; color: inherit; background: var(--paper);
  border: 1px solid var(--rule); border-radius: 3px; padding: .35rem; }
.pv-form .pv-check { display: flex; gap: .5rem; align-items: baseline; }
.pv-answer { border-left: 3px solid var(--both); background: var(--both-pale); padding: .35rem .7rem; }
.pv-steps { padding-left: 1.2rem; }
.pv-btns { margin-top: 1rem; }
@media (max-width: 640px) { #preview-bar { padding: .5rem 16px; } }

/* ── the lesson: every part drawn by web/js/components.js ─────────────────── */
.lesson { max-width: 60rem; }
.lesson h4 { margin: 1.2rem 0 .4rem; }
.ls-by { margin: .4rem 0 0; }
.ls-station p { line-height: 1.55; }
.ls-claim { margin: .2rem 0 0; }
.ls-eq { margin: .8rem 0; padding: .6rem .8rem; border-left: 3px solid var(--rule-2); }
.ls-eq code { font-size: 15px; }
.ls-eq figcaption { margin-top: .35rem; font-size: 12.5px; color: var(--ink-2); }
.ls-widget { margin-top: 1rem; padding: .6rem .8rem; border: 1px solid var(--rule-2); border-radius: 4px; }
.ls-slider { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin: .3rem 0; font-size: 12.5px; }
.ls-slider input { flex: 1 1 14rem; min-width: 10rem; }
.ls-check .ls-opt.ls-right { border-color: var(--teal); color: var(--teal); }
.ls-check .ls-opt.ls-wrong { border-color: var(--out); color: var(--out); }
.ls-why { font-size: 13px; }
.fig-ctl:empty { display: none; }
.fig-ctl .fig-scrub { flex: 1 1 12rem; min-width: 8rem; }
.fig-canvas { max-width: 100%; }

/* The group application's own layout, on the tool's tokens (web/app.css), so
   a group sees its folder in the application's colours, in light and dark. */

body.gapp { margin: 0; }
.gtop { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: .8rem; flex-wrap: wrap;
  padding: .55rem 1rem; background: var(--card); border-bottom: 1px solid var(--rule); font: 12px var(--mono); }
.gbrand { font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.gtitle { color: var(--ink-2); }
.gspacer { flex: 1; }
.gtop-note { color: var(--ink-3); font-size: 11px; }
.gwrap { display: grid; grid-template-columns: 230px minmax(0, 1fr); min-height: calc(100vh - 44px); }
.gnav { border-right: 1px solid var(--rule); padding: .8rem .6rem; font: 12px var(--mono); position: sticky; top: 44px;
  align-self: start; max-height: calc(100vh - 44px); overflow: auto; }
.gnv { display: flex; align-items: center; gap: .4rem; padding: .28rem .5rem; color: var(--ink); text-decoration: none; border-radius: 4px;
  overflow-wrap: anywhere; }
.gnv:hover { background: var(--rule-2); }
.gnv.sel { background: var(--ink); color: var(--paper); }
.gnv-h { margin: .9rem .5rem .3rem; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.gnv-reload { margin: .9rem .5rem 0; }
.gdot { width: 8px; height: 8px; border-radius: 50%; flex: none; border: 1.5px solid var(--both); }
.gdot-ok { background: var(--both); }
.gdot-err { background: transparent; border-color: var(--out); border-style: dashed; }
.gcount { font-size: 10px; padding: 0 .35rem; border-radius: 8px; background: var(--rule-2); color: var(--ink-2); }
.gcount.bad { background: var(--out-pale); color: var(--out); font-weight: 700; }
.gmain { padding: 1.2rem 1.6rem 4rem; max-width: 1080px; min-width: 0; }
.gh1 { font-size: 1.6rem; margin: .2rem 0 .8rem; }
.gh { font-size: 1.15rem; margin: 2rem 0 .6rem; padding-top: .4rem; border-top: 1px solid var(--rule-2); }
.gh3 { font-size: .95rem; margin: 1.2rem 0 .4rem; }
.gsrc { font: 10.5px var(--mono); color: var(--ink-3); border: 1px solid var(--rule); border-radius: 3px; padding: 0 .3rem; white-space: nowrap; }
.gfrom { margin: .4rem 0 0; text-align: right; }
.gmiss { color: var(--out); font-style: italic; }
.gok { color: var(--both); }
.gout { font: 12px var(--mono); }
.gnote { width: min(100%, 560px); font: 13px var(--mono); padding: .35rem .5rem; border: 1px solid var(--rule); border-radius: 4px;
  background: var(--card); color: var(--ink); }
.gbtn { display: inline-block; cursor: pointer; }
.small { font-size: 11px; }

/* opening */
.gopen { margin: 1.4rem 0; }
.gdrop { border: 2px dashed var(--rule); border-radius: 10px; padding: 2rem 1rem; text-align: center; background: var(--card); }
body.gdragging .gdrop, body.gdragging .gmain { outline: 3px dashed var(--teal); outline-offset: -6px; }

/* stations and prose */
.gst { margin: .8rem 0; }
.prose p { line-height: 1.6; }
.prose img { max-width: 100%; }
.md-code { background: var(--rule-2); padding: .6rem .8rem; border-radius: 5px; overflow: auto; font: 12px/1.5 var(--mono); }
.md-table { border-collapse: collapse; }
.md-table td, .md-table th { border: 1px solid var(--rule); padding: .25rem .5rem; }
blockquote { border-left: 3px solid var(--rule); margin: .6rem 0; padding: .1rem .9rem; color: var(--ink-2); }
.gguess { border: 1px solid var(--out); background: var(--out-pale); border-radius: 6px; padding: .6rem .8rem; margin: .8rem 0; }
.gguess-k { font: 10px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--out); margin-right: .3rem; }
.gguess-q { margin: 0 0 .4rem; font-weight: 600; }
.gguess-a { margin: .4rem 0 0; }

/* equations */
math.tm { font-size: 1.12em; font-family: math, "STIX Two Math", "Cambria Math", "Latin Modern Math", serif; }
.geq { margin: .9rem 0; padding: .5rem .8rem; border-left: 3px solid var(--in); background: var(--in-pale); border-radius: 0 6px 6px 0; }
.geq-row { display: flex; align-items: center; gap: .8rem; overflow-x: auto; }
.geq-id { font: 11px var(--mono); color: var(--in); flex: none; }
.geq figcaption { font-size: 13px; color: var(--ink-2); margin-top: .3rem; }
.geq-where { margin: .4rem 0 0; font-size: 12.5px; display: grid; grid-template-columns: auto 1fr; gap: .1rem .6rem; }
.geq-where dt { color: var(--ink-3); grid-row: span 99; }
.geq-where dd { margin: 0; }
.geq-ref { font: 12px var(--mono); }
.gh-in { font-size: 16px; }
.gh-out { min-height: 3.5rem; padding: .6rem; background: var(--card); border: 1px solid var(--rule); border-radius: 6px; font-size: 1.3em; overflow-x: auto; }

/* pictures */
.gfig { margin: 1rem 0; }
.gfig-cap { font-size: 13px; color: var(--ink-2); margin: .3rem 0 0; }
.gimg { max-width: 100%; border-radius: 6px; border: 1px solid var(--rule); }
.gflow-host, .gwire, .gsteps-pic { overflow-x: auto; background: var(--card); border: 1px solid var(--rule); border-radius: 8px; padding: .4rem; }
svg.gflow { display: block; max-width: none; height: auto; font: 11.5px var(--mono); }
.gbox rect { fill: var(--card); stroke: var(--ink-3); stroke-width: 1.2; }
.gbox text { fill: var(--ink); }
.gbox .gt2 { fill: var(--ink-3); font-size: 10px; }
.glink { cursor: pointer; }
.glink:hover rect, .glink:focus rect { stroke: var(--ink); stroke-width: 2; }
.garrow { fill: none; stroke: var(--ink-3); stroke-width: 1.3; }
.gah { fill: var(--ink-3); }

function tokenize(src) {
  const t = [];
  let i = 0;
  while (i < src.length) {
    const c = src[i];
    if (c === '\\') {
      const m = /^\\([A-Za-z]+|.)/.exec(src.slice(i));
      if (!m) { t.push({ k: 'ch', v: '\\' }); i++; continue; }
      t.push({ k: 'cmd', v: m[1] }); i += m[0].length; continue;
    }
    if (/\s/.test(c)) { t.push({ k: 'sp' }); i++; continue; }
    if (/[0-9.]/.test(c)) {
      const m = /^[0-9]*\.?[0-9]+|^[0-9]+\.?/.exec(src.slice(i));
      t.push({ k: 'num', v: m[0] }); i += m[0].length; continue;
    }
    t.push({ k: 'ch', v: c }); i++;

  return t;
}

    if (c === 'mathrm' || c === 'operatorname' || c === 'rm') return '<mi mathvariant="normal">' + x(this.rawGroup()) + '</mi>';
    if (c === 'mathit') return '<mi>' + x(this.rawGroup()) + '</mi>';

/**

// ── shorthand and method-language expressions → LaTeX ─────────────────────

const NAMED_FUNCS = ['sin', 'cos', 'tan', 'asin', 'acos', 'atan', 'atan2', 'sinh', 'cosh', 'tanh', 'exp', 'ln',
  'log', 'log10', 'min', 'max', 'floor', 'ceil', 'round', 'interp', 'clamp', 'sign', 'hypot', 'mean', 'sum'];

function shortTokens(src) {
  const t = [];
  const re = /\s*(?:(\d+(?:\.\d*)?(?:[eE][+-]?\d+)?|\.\d+(?:[eE][+-]?\d+)?)|([A-Za-z][A-Za-z0-9_]*(?:\.[A-Za-z][A-Za-z0-9_]*)?)|(\[[^\]]*\])|(<=|>=|==|!=|->|<-|\*\*|[-+*/^(),=<>!_|]))/y;

    if (m[1] !== undefined) t.push({ k: 'num', v: m[1], sp });
    else if (m[2] !== undefined) t.push({ k: 'id', v: m[2], sp });
    else if (m[3] !== undefined) t.push({ k: 'unit', v: m[3].slice(1, -1).trim(), sp });

    last = re.lastIndex;
    if (last >= src.length) break;
  }
  const rest = src.slice(last).trim();
  return { t, rest };

/** An identifier as LaTeX: Greek names become Greek, `a_b` an index, long names upright-italic. */
function idTex(name) {
  const s = String(name);
  const i = s.indexOf('_');
  const base = i < 0 ? s : s.slice(0, i), sub = i < 0 ? '' : s.slice(i + 1);
  // `mu` and `MU` (a constant's name, MU_EARTH) are both the Greek letter.
  const one = n => GREEK[n] !== undefined ? '\\' + n
    : n.length > 1 && n === n.toUpperCase() && GREEK[n.toLowerCase()] !== undefined ? '\\' + n.toLowerCase()
      : n.length === 1 ? n : '\\mathit{' + n + '}';

class ShortParser {
  constructor(src) { const { t, rest } = shortTokens(src); this.t = t; this.i = 0; this.rest = rest; this.problems = []; }

        else l = { tex: wrap(l, 2) + ' \\, ' + wrap(r, 2), p: 2 };

      if (t && (t.k === 'id' || t.k === 'num' || (t.k === 'op' && t.v === '('))) {

      const known = ['sqrt', 'abs', 'pow'].includes(t.v) || NAMED_FUNCS.includes(t.v) || FUNCS.includes(t.v);

function wrap(e, p) { return e.p < p ? '\\left(' + e.tex + '\\right)' : e.tex; }

function unitTex(u) {
  if (!u || u === '1') return '';
  return '\\mathrm{' + u.replace(/\*/g, '\\cdot ').replace(/\^(-?\d+)/g, '^{$1}') + '}';

function call(name, args) {
  const a = args.map(e => e.tex);
  if (name === 'sqrt') return { tex: '\\sqrt{' + a[0] + '}', p: 5 };
  if (name === 'abs') return { tex: '\\left|' + a[0] + '\\right|', p: 5 };
  if (name === 'pow') return { tex: '{' + wrap(args[0], 5) + '}^{' + a[1] + '}', p: 4 };

/** `{ tex, problems }` from shorthand such as `v = sqrt(mu/r)`. */
function shortToTex(src) {
  const p = new ShortParser(String(src || ''));
  const e = p.peek() ? p.relation() : { tex: '' };
  if (p.peek()) p.problems.push('did not understand from ' + (p.peek().v || ''));
  if (p.rest) p.problems.push('did not understand: ' + p.rest);

/**
 * The equations a pseudocode states, one per `let`, `set` and `return` line,
 * as `{ line, lhs, tex }`. `answer` names the output a `return` gives. The
 * pseudocode is read, never run.
 */
function pseudocodeEquations(text, answer = 'answer') {
  const out = [];
  String(text || '').split('\n').forEach((raw, n) => {
    const s = raw.replace(/#.*$/, '').trim();
    let m;
    if ((m = /^(?:let|set)\s+([A-Za-z][A-Za-z0-9_]*)\s*(?::\s*[A-Za-z][A-Za-z0-9_]*)?\s*=\s*(.+)$/.exec(s))) {
      const r = shortToTex(m[2]);

    } else if ((m = /^const\s+([A-Za-z][A-Za-z0-9_]*)\s*=\s*(.+)$/.exec(s))) {
      const r = shortToTex(m[2]);
      out.push({ line: n + 1, lhs: m[1], tex: idTex(m[1]) + ' = ' + r.tex, problems: r.problems, constant: true });
    } else if ((m = /^return\s+(.+)$/.exec(s))) {
      const r = shortToTex(m[1]);
