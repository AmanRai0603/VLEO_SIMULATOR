<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VLEO Multipayload design tool</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%231a1a1a'/%3E%3Ctext x='8' y='12' font-size='11' fill='%23fbfaf7' text-anchor='middle' font-family='monospace'%3EV%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<!--
  Today's tool page, while the application takes over from it
  (docs/PLAN_F.md, decision 1). The layer figure, the run, the inputs and the
  results kept are the application's Explore now (/app), and every row's page
  its Node workspace (F3-h); what is left here is the rows, to find one, the
  architecture, the forms and the manual.
-->

<header id="masthead">
  <h1>VLEO Multipayload design tool</h1>
  <p class="tagline">Orbitt Space · one architecture, one case · runs, inputs and results in <a href="/app">the application</a></p>
  <span class="grp" id="depth" role="group" aria-label="how deep the page goes"
    title="Learn keeps every step and asks you to predict first · Read shows the answer, the plain words and the real thing · Expert keeps the answer, the relation, the limits and the reference"><span class="lbl">depth</span>
    <button class="ctl dp" data-depth="learn">Learn</button
    ><button class="ctl dp" data-depth="read">Read</button
    ><button class="ctl dp" data-depth="expert">Expert</button>
  </span>
</header>

<nav id="tabs">
  <div class="tabrow">
    <button class="tab rows-tab sel" id="rows-tab" title="every row of the design, to open its page">Rows</button>
    <button class="tab explore-tab" id="explore-tab" title="which design is open and what built it, where it breaks, and what differs between two files">Explore</button>
    <button class="tab arch-tab" id="arch-tab" title="the pattern every folder repeats">⌗ Architecture</button>
    <button class="tab forms-tab" id="forms-tab" title="every way something reaches this tool: the inputs and results">Forms</button>
    <button class="tab manual-tab" id="manual-tab" title="how to use this tool — in the browser and in a terminal, as an engineer and as the developer">? Manual</button>
    <span class="status" id="status"></span>
  </div>


  <div class="tabrow sub" id="caserow">
    <span class="lbl">case</span>
    <b id="case-name"></b>
    <span class="hint-inline" id="case-state"></span>
    <button class="ctl" id="case-inputs" title="every input of the case, in the application's Explore">inputs…</button>
    <a class="ctl" id="case-download" href="/v1/inputs.csv" download="vleo-case.csv" title="the saved case, one row per input">download CSV</a>
    <span class="hint-inline" id="caserow-note"></span>
  </div>
</nav>


<main>
  <!-- A what-if must never be mistaken for the design. This bar is hidden when
       nothing is overridden and impossible to miss when something is, because
       every number on every view below it is then a number about a design that
       is not the one in the repository. -->
  <div id="ovrbar" hidden></div>

  <!-- Every row, to open its page: the way into a row's page now the layer
       figure is gone. -->
  <div id="rowsview">
    <div id="rows-body"></div>
  </div>

  <!--
    The architecture: what has to be understood before anything is added. The
    node and its assembly, then how nodes connect, then how the connections
    stack into layers, then the hierarchy those layers hang on.
  -->
  <div id="archview" hidden>
    <div id="arch-nav" class="arch-nav"></div>
    <div id="arch-body"></div>
  </div>

  <!--
    The manual, about this tool, from docs/manual.toml. Every command it gives
    is run by the pipeline exactly as written, and every name in it is checked
    against the code both ways — so it can be followed without being doubted.
  -->
  <div id="manualview" hidden>
    <div id="manual-body"></div>
  </div>


  <!-- Explore: which design is open, where it breaks, what differs. Every
       state on it is the engine's (/v1/today, /v1/health, /v1/compare). -->
  <div id="exploreview" hidden>
    <div id="explore-body"></div>
  </div>

  <!-- The forms: the inputs and results, each with its owner. -->
  <div id="formsview" hidden>
    <div id="forms-body"></div>
  </div>



</main>

<footer>
  <span id="foot"></span>
</footer>

<!-- One module per concern, served individually. A bundler is a build step
     between the source and the thing that runs, and the first time they
     disagree the disagreement is invisible. -->
<script type="module" src="/js/app.js"></script>
</body>
</html>
