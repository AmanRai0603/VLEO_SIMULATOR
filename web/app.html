<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VLEO</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%231a1a1a'/%3E%3Ctext x='8' y='12' font-size='11' fill='%23fbfaf7' text-anchor='middle' font-family='monospace'%3EV%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/app.css">
<style>
/* The shell's own, kept here so the group and node pages that inline
   app.css do not carry it. */
body.sh { max-width: 64rem; margin: 0 auto; padding: 0 1.5rem 3rem; }
#sh-head { display: flex; align-items: baseline; gap: 1rem; padding: 1rem 0 .4rem; }
#sh-head h1 { font: 600 15px var(--mono); margin: 0; }
.sh-who { color: var(--ink-2); font: 11px var(--mono); margin-left: auto; }
/* The depth switch sits in the shell's header row, not floated over a title
   as today's tool page sets it. */
#sh-head #depth { float: none; margin-top: 0; }
#sh-head #depth[hidden] { display: none; }
.nw-case { margin: .2rem 0 .4rem; }
.sh-notice p { margin: .4rem 0; padding: .35rem .6rem; border-radius: 3px; font-size: 13px; }
.sh-said { background: var(--both-pale); color: var(--both); }
.sh-refused { background: var(--out-pale); color: var(--out); }
.sh-card { background: var(--card); border: 1px solid var(--rule); border-radius: 4px;
  padding: .6rem 1rem; margin: .8rem 0; }
.sh-card h2 { font: 600 12px var(--mono); text-transform: uppercase; letter-spacing: .08em;
  color: var(--ink-2); margin: .2rem 0 .5rem; }
.sh-card h3 { font: 600 12px var(--mono); margin: .8rem 0 .2rem; }
.sh-card label { font-size: 12px; color: var(--ink-2); }
.sh-card input { font: 12px var(--mono); padding: .2rem .35rem; border: 1px solid var(--rule); border-radius: 3px; }
.sh-wide { width: 34rem; max-width: 100%; }
.sh-fp code, .sh-handover code { word-break: break-all; }
.sh-anchor, .sh-handover { border-left: 3px solid var(--in); background: var(--in-pale);
  padding: .3rem .8rem; margin: .5rem 0; }
.sh-item { margin: .3rem 0; font-size: 13px; }
.sh-table { border-collapse: collapse; font-size: 12px; }
.sh-table th, .sh-table td { border-bottom: 1px solid var(--rule-2); padding: .2rem .6rem .2rem 0; text-align: left; }
.sh-loading { color: var(--ink-3); }
.ex-ws-nav { margin: .6rem 0; gap: .3rem; }
.ex-ws.sel { background: var(--ink); color: var(--paper); }
.ex-raising textarea { font: 12px var(--mono); vertical-align: top; }
.ex-raised { color: var(--both); }
.ex-raise-refused { color: var(--out); }
.ex-mark { font-size: 11px; color: var(--out); }
/* The Node workspace: its parts, its page, its file in your copy. Wider than
   the rest of the shell, since its page is what `/`'s node view was: on a wide
   enough screen its centre reaches that view's own 74rem, and no further, so a
   row's figures reach the size they were drawn at there, and their reference
   pictures (panels/reference/) still hold (panels/README.md). */
body.sh:has(#sh-system) { max-width: 100rem; }
body.sh:has(#sh-node) { max-width: 118rem; }
.nw-page { max-width: 74rem; }
.nw-pick { margin: .6rem 0; display: flex; flex-wrap: wrap; gap: .3rem; align-items: center; font-size: 12px; }
.nw-pick-k { font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); }
.nw-mine.sel { background: var(--ink); color: var(--paper); }
.nw-grid { display: grid; grid-template-columns: 15rem minmax(0, 1fr) 19rem; gap: 1rem; align-items: start; }
@media (max-width: 70rem) { .nw-grid { grid-template-columns: minmax(0, 1fr); } }
.nw-left .np-parts { grid-template-columns: minmax(0, 1fr); }
.nw-right h4 { font: 600 11px var(--mono); margin: .9rem 0 .2rem; }
.nw-kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 2px 10px; font-size: 12px; margin: 0; }
.nw-kv dd { margin: 0; overflow-wrap: anywhere; }
.nw-list { font-size: 12px; padding-left: 16px; margin: .2rem 0; }
.nw-error, .nw-not { color: var(--out); }
.nw-ok { color: var(--both); }
.nw-wide { width: 100%; font: 12px var(--mono); }
.nw-code { white-space: pre; tab-size: 4; }
.nw-right fieldset { border: 1px solid var(--rule, #ccc); margin: .5rem 0; padding: .3rem .5rem; font-size: 12px; }
.nw-right fieldset label { display: inline-block; margin: .15rem .4rem .15rem 0; }
.nw-why label { display: block; }
.nw-live { margin: .5rem 0; font-size: 12px; }
.nw-formula { margin: .5rem 0; }
.nw-formula label { display: block; }
.nw-formula-read { font-size: 12px; }
.nw-differs td { color: var(--out); }
.nw-theirs { font-size: 11px; color: var(--ink-2); margin: .2rem 0 .4rem; }
.nw-theirs pre { white-space: pre-wrap; margin: .1rem 0; }
.nw-behind { margin: .4rem 0; }
.nw-views { margin: .2rem 0 .5rem; }
.nw-view.sel { background: var(--ink); color: var(--paper); }
.nw-yours { font-size: 12px; border-left: 3px solid var(--rule, #ccc); padding: .2rem .6rem; margin: .4rem 0 .8rem; }
.nw-yours.is-drawn { border-left-color: var(--both); }
.nw-yours h4 { font: 600 11px var(--mono); margin: .5rem 0 .1rem; }
.nw-yours ul { padding-left: 16px; margin: .1rem 0; }
.nw-next { font-weight: 600; }
.nw-stale { margin: .5rem 0; }
.sy-grid { display: grid; grid-template-columns: 20rem minmax(0, 1fr); gap: 1rem; align-items: start; }
@media (max-width: 60rem) { .sy-grid { grid-template-columns: minmax(0, 1fr); } }
.sy-frame { margin: .4rem 0 1rem; }
.sy-frame .sy-below .ctl { margin: .1rem 0; }
.sy-tree ul { list-style: none; margin: 0; padding-left: 14px; font-size: 12px; }
.sy-tree > ul { padding-left: 0; }
.sy-tree li { margin: 2px 0; }
.sy-node { font: 12px var(--mono); background: none; border: 0; padding: 1px 3px; cursor: pointer; color: var(--ink); }
.sy-node.sel { background: var(--ink); color: var(--paper); }
.sy-archived { text-decoration: line-through; color: var(--ink-2); }
.sy-open { font-size: 11px; color: var(--ink-2); }
.sy-ok { color: var(--both); font-size: 11px; }
.sy-not { color: var(--out); font-size: 11px; }
.sy-block h4 { font: 600 11px var(--mono); margin: .9rem 0 .2rem; }
.sy-block p { font-size: 12px; }
.sy-cases { font-size: 12px; }
.sy-differs td { color: var(--out); }
.sy-next { font-weight: 600; }
.sy-stale { margin: .5rem 0; }
.sy-release { margin: 1.4rem 0 1rem; border-top: 1px solid var(--rule); padding-top: .6rem; }
.sy-r-lines { font-size: 12px; border-collapse: collapse; width: 100%; }
.sy-r-lines td, .sy-r-lines th { text-align: left; padding: 2px 6px; vertical-align: top; }
.sy-r-lines td:last-child { overflow-wrap: anywhere; }
.sy-r-fails td { color: var(--out); }
.sy-r-marks { font-size: 12px; }
.sy-r-form { margin: .6rem 0; display: flex; flex-wrap: wrap; gap: .5rem; align-items: end; }
.sy-r-form textarea { max-width: 100%; }
</style>
</head>
<body class="sh">
<!--
  The application (docs/OPERATING_1_0.md, section 4): one shell, five
  workspaces, and it opens on My work. Who you are is your key, opened here
  with its passphrase; what the screens show is read from your copy of the
  database. Explore holds today's design, its runs, its inputs and the
  results kept, and Node one node and its file in your copy; the other two
  workspaces fill as their stages arrive (F4 to F7).
-->
<header id="sh-head">
  <h1>VLEO</h1>
  <span id="sh-who" class="sh-who">no key open</span>
  <!-- How deep a node's page goes, as on today's tool page (depth.js). -->
  <span class="grp" id="depth" role="group" aria-label="how deep the page goes"
    title="Learn keeps every step and asks you to predict first · Read shows the answer, the plain words and the real thing · Expert keeps the answer, the relation, the limits and the reference"><span class="lbl">depth</span>
    <button class="ctl dp" data-depth="learn">Learn</button
    ><button class="ctl dp" data-depth="read">Read</button
    ><button class="ctl dp" data-depth="expert">Expert</button>
  </span>
</header>
<nav id="sh-nav" class="tabrow" aria-label="workspaces"></nav>
<div id="sh-notice" class="sh-notice" role="status" aria-live="polite"></div>
<main id="sh-main"><p class="sh-loading">Reading the program…</p></main>
<script type="module" src="/js/shell.js"></script>
</body>
</html>
