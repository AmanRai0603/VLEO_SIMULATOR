# ══════════════════════════════════════════════════════════════════════════════
# What each place cannot do, and where it is done instead.

[[cannot]]
place = "browser"
what = "Change a node — any field of its sheet"
why = "A change to the design has to be checked against every row that reads it, implemented, given evidence and released, so that everyone runs the same thing."
instead = "Fill the node's form and send it to the developers. Check it first, on the Forms page."
who = "user"

[[cannot]]
place = "browser"
what = "Add a new node"
why = "A new node is a new folder in the tree with an owner, a place among its siblings and interfaces to rows that exist."
instead = "The form for a new node, on the Forms page. A developer applies it with `cargo run -p xtask -- intake <form.html> --apply`."
who = "user"

[[cannot]]
place = "browser"
what = "Delete a node"
why = "Other rows read it. Removing one is a change to what every reader of it computes, and is decided in review, not in a form."
instead = "Say so in the node's form, in its note. A developer decides, after `cargo run -p xtask -- reach` shows what reads it."
who = "user"

[[cannot]]
place = "browser"
what = "Move a node, rename it, or change its owner, layer, kind or order"
why = "These move the tree or change who reviews the row. Its identifier is also its folder and its variable name."
instead = "Edit node.toml in a checkout, then `cargo run -p xtask -- gate`; the reason for each is under Reference."
who = "developer"

[[cannot]]
place = "browser"
what = "Change a declared number in the design itself"
why = "A what-if and the saved case never touch the sheet: a declared value carries the name of the person who chose it."
instead = "For your own runs, the case. For the design's default, the node's form."
who = "user"

[[cannot]]
place = "browser"
what = "Write the Rust in a step's slot"
why = "It is code: it has to compile, compose relations that already exist in the kernel, and be reviewed as code."
instead = "cargo run -p xtask -- fill <row> --hole <n> --body -"
who = "developer"

[[cannot]]
place = "browser"
what = "Add a known-good value (a fixture)"
why = "An expected value may never come from the code under test. A form may supply one; only a person records it, with its source."
instead = "Edit fixtures.toml in the row's folder, with the value's source and provenance."
who = "developer"

[[cannot]]
place = "browser"
what = "Put your name against a relation"
why = "Signing is an act of reading the relation against its source, done by the person who owns it."
instead = "cargo run -p xtask -- confirm <row> --by \"Your Name\""
who = "developer"

[[cannot]]
place = "browser"
what = "Run the checks, the tests or the generators for the whole tree"
why = "They are what decides whether a change may be merged, so they run where the change is committed — and in the pipeline, on every push."
instead = "cargo run -p xtask -- gate && cargo test"
who = "developer"

[[cannot]]
place = "browser"
what = "Publish or change reference data"
why = "A published set is permanent by design, and every number checked against it depends on it not changing."
instead = "cargo run -p xtask -- bundle publish <dir>"
who = "developer"

[[cannot]]
place = "terminal"
what = "Show a figure, or click from a number to where it came from"
why = "The terminal prints the numbers — a row's, the chain behind each and every blocked row, and with `vleo figure` the numbers a panel draws; pictures are the browser's."
instead = "The browser: the row's page, and the panels on layer 3."
who = "user"


