ui = "assembly — what this node is made of"

[[layer.section.step]]
say = "What the row reads and what reads it, as the sheets declare."
ui = "connectivity — what it is joined to, as declared"

[[layer.section.step]]
say = "The sheet, as its node engineer wrote it."
ui = "as written"

[[layer.section.step]]
say = "Back to the tree."
ui = "↑ back to the layer"


[[layer.section]]
id = "browser-inputs"
title = "Set the inputs — the case"
who = "user"
kind = "how-to"
answer = "Every run is on one case: its inputs, set on the Inputs page or uploaded as a CSV and saved outside the repository. A file is shown before it is saved, refused whole if any row is bad, and carried over when the tool is updated."
body = """
There is **one case**, the multipayload design, and every run, sweep and figure \
in the tool is for it. What changes from one customer to the next, or from one \
sky to the next, is its **inputs** — never the tree. A customer is a set of \
values, not a folder, so a new customer is never a change to the design.

The **Inputs** tab lists all of them in two halves. **Condition** is what the \
design flies in: the orbit, the environment and the solar weather it is sized \
for. **Customer** is everything else — the payloads, the vehicle, the service \
and what it must deliver. Each shows the value it runs at, its default — the \
value declared on its own sheet — and the range it may move in.

Change values there and save them, or **upload a CSV**. A file is read and \
shown before anything is saved: what it sets, what that changes, and every row \
it refuses. A file with any refused row — a name that is not an input, a unit \
that is not the row's, a value outside the declared range — is not used at \
all, because keeping the good half would be a run on values nobody asked for. \
A blank value means the default, so a file only has to name what it changes.

The saved case is kept by the tool **outside the repository** — beside the \
reference data, in `~/.vleo/case/`, or wherever `VLEO_CASE` points — so git \
never sees it. To keep a copy, or hand one to someone, download it; to put it \
back, upload it. The bar across the top always says how many inputs the saved \
case changes.

**When the tool is updated, a case carries over.** Every CSV the tool writes \
names the set of inputs it was written for, in a `#! template` line — keep it. \
When a release adds, retires or re-ranges inputs, a case written before is not \
refused: every value that still applies is carried, every new input runs at \
its default, and any value that can no longer be used — its input retired, or \
now outside its range — is **set aside** by name, with its value and why, \
rather than dropped. The saved case is carried over on its own the first time \
the updated tool reads it, and the file as it was is kept beside it; the \
Inputs page says what the update did until you keep the result. An old file \
you upload is carried over the same way, and shown before it is saved."""

[[layer.section.step]]
