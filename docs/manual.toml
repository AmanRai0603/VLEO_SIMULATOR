tool = "xtask"
name = "files-wasm"
usage = "files-wasm [--check]"
what = "Builds the design-file library the pages carry — vleo_files compiled to WebAssembly, so a page checks a release through the signature chain by the same code as the installed application — into web/files.wasm.gz with the fingerprint of its sources; --check only says whether the committed file is current."
who = "developer"
effect = "writes"

[[command]]
tool = "xtask"
name = "group-app"
usage = "group-app [--check]"
what = "Builds the two offline pages a group works in — web/group.html, where the subsystem engineer sets out the nodes and their contracts, issues each node engineer a node file, assembles the files into a release, has it signed and seals it, and web/node.html, where a node engineer fills their node file — each carrying SQLite (web/vendor/sqlite, checked against its recorded hashes) and the database format of groups/schema.sql; and the folder pattern's two documents, docs/GROUP_FOLDER.md and groups/skill/vleo-group-folder/SKILL.md, all from groups/SPEC.toml. --check only says whether the committed four are current."
who = "developer"
effect = "writes"

[[command]]
tool = "xtask"
name = "group-intake"
usage = "group-intake <folder> [--node <id>] [--apply [--partial]] [--draft]"
what = "A group's sealed release taken into the design. The release, written out with `node tools/group_db.mjs --unpack <file.vleo>`, is refused unless every file still gives the fingerprint it was sealed with; then each computed node's pseudocode and results become its node form — its method and test cases, in SI — and go through intake's own check: a conflict with a change made since, a method or results an assistant supplied (a `transcribed` method counts as one unless it names its source and a person who checked the copy), an incomplete de-risking record. `--apply` writes, regenerates and gates each, or puts it back. `--draft` looks at an unsealed release and never applies."
who = "developer"
effect = "writes"

[[command]]
tool = "xtask"
name = "group-build"
usage = "group-build <folder> [--node <id>]"
what = "Every computed node of a sealed release, once `group-intake --apply` has taken it in, built from its method: `build-node` on each — translated into the kernel, tested on its node engineer's cases, the tests proved to test, the interface checked. A node whose method in the design is not the release's is refused: the release is taken in first."
who = "developer"
effect = "writes"

[[command]]
tool = "xtask"
name = "group-test"
usage = "group-test <folder> [--out <dir>]"
what = "The group tested against its own results, never against the code under test: the design holds the release's isolation results case for case; each node's own tests pass; the group as a whole, run through the engine, gives `results/group.csv`; and both ends of every range the group declares answer or refuse by name — never NaN, never a crash. The report goes to `target/group/<group>-<version>/group-test.csv`."
who = "developer"
effect = "reads"

[[command]]
tool = "xtask"
name = "group-deliver"
usage = "group-deliver <folder> [--out <dir>] [--bin <dir>] [--uncommitted]"
what = "The test application for the group: the kit, built from this commit with their release in it, beside `DELIVERY.toml` — which release, which seal, which commit, which nodes — `DELIVERY.md`, what to try, and the group-test report. Refused until `group-test` has passed, and from uncommitted changes unless `--uncommitted` says the checkout is a throwaway. The group answers accepted, or changes."
who = "developer"
effect = "writes"

[[command]]
tool = "xtask"
name = "group-accept"
usage = "group-accept <file.accept.toml> [--delivery <DELIVERY.toml>] [--no-push]"
what = "The group's answer to its test application, recorded. The subsystem engineer writes it on the group application's Delivery & acceptance page, beside their sealed release; it names the delivery by its SHA-256, the commit it was built from and the release's fingerprint. An answer of accepted, saying what was tried and given by a person, is committed to `acceptances/<group>-<version>.toml` on the branch `group/<group>-<version>` — refused if anything but these records changed since the delivered commit. An answer of changes is never recorded: its note is printed, to take back into the group's work. `--verify` is the pipeline's check on a group branch."
who = "developer"
effect = "writes"

[[command]]
tool = "xtask"
name = "group-export"
usage = "group-export <group> [--out <dir>]"
what = "Writes one group's folder in the pattern of groups/SPEC.toml from every sheet in the group — its nodes, inputs, plain words, theory, assumptions, evidence and sources — for the group to start from. It invents nothing: a pseudocode, the group's own results and its pictures are left for the group, and the group application lists them. `--all` writes every group that owns a node, each in its own folder, with GROUPS.csv beside them; `node tools/group_db.mjs --all <dir>` then makes each into its database files and READY.csv, what each group still needs."
who = "maintainer"
effect = "writes"

[[command]]
tool = "xtask"
name = "rerun"
usage = "rerun <node>|--all [--require]"
what = "Runs each node engineer's own code again on the cases recorded from it and says whether it still gives them: Python directly, MATLAB and Octave through Octave where it is installed. Code in any other language is kept and read, not rerun, and it says so; `--require` fails instead, for a pipeline that installed the runners."
who = "maintainer"
effect = "reads"

[[command]]
tool = "xtask"
name = "build-node"
usage = "build-node <node>"
what = "Builds a node from its method, stage by stage, stopping at the first that fails: the method on its node engineer's cases; the translation into the kernel; the node's tests — the node engineer's cases and the translation against the method; the node engineer's code rerun; and only then the node in the tree."
who = "maintainer"
effect = "writes"

[[command]]
tool = "xtask"
name = "migration"
usage = "migration [--owner <o>] [--subsystem <s>] [--forms <dir>]"
what = "Says which computed rows still need a method, by owner, and with --forms writes each one's node form into <dir>/<owner>/ ready to send. It writes no method: each comes from the node's owner, on the node's form, through take like any other change."
who = "maintainer"
effect = "reads"

[[command]]
tool = "xtask"
name = "explain"
usage = "explain [<command>]"
what = "Where a command sits in a node's journey, what it reads, writes and checks, how to undo it, its steps and where its code is — from the one table docs/PIPELINE.md is written from. With no command, the whole journey."
who = "developer"
effect = "reads"

[[command]]
tool = "xtask"
name = "why"
usage = "why <node>"
what = "A node's history in one place: every recorded version and who made it, the commits that changed it, its approvals, how its code came to be, and its gate, run now."
who = "developer"
effect = "reads"

[[command]]
tool = "xtask"
name = "trace"
usage = "trace [<command>] [--list]"
what = "The last run's trace from target/xtask-trace/ — every command that writes leaves one, the newest 50 kept — or the last of one command, or --list every one kept."
who = "developer"
effect = "reads"

[[command]]
tool = "xtask"
name = "pipeline"
usage = "pipeline [--check]"
what = "Write docs/PIPELINE.md from the pipeline table; --check only says whether it is current."
who = "developer"
effect = "writes"

[[command]]
tool = "xtask"
name = "take"
usage = "take <form.html> --for <author> [--again] [--no-push] [--no-test]"
what = "Takes a filled node form in: checks it, and if it cannot be taken writes `<form>.returned.txt` to send back and changes nothing; otherwise puts it on its own branch `form/<author>/<node>` from a fresh `maintainer`, applies it, regenerates, gates, tests, commits naming the node engineer and pushes. The push builds the node engineer's preview."
who = "maintainer"
effect = "writes"

[[command]]
tool = "xtask"
name = "preview"
usage = "preview"
what = "Where the current form branch's preview build is, and what to do with it. Every push to a form branch builds one by itself."
who = "maintainer"
effect = "reads"

[[command]]
tool = "xtask"
name = "approve"
usage = "approve <approval.toml> [--no-push]"
what = "Records the node engineer's approval of a preview — the file the preview saves when they press Approve. Refused unless it is for the build of exactly what is on the branch now. `--verify <branch>` is the same check, as the pipeline runs it."
who = "maintainer"
effect = "writes"

[[command]]
tool = "xtask"
name = "queue"
usage = "queue"
what = "Every form branch and every group branch, and where each stands: not pushed; waiting for the node engineer's approval, or the group's acceptance of its test application; approved or accepted and ready to merge; or merged."
who = "maintainer"
effect = "reads"

[[command]]
tool = "xtask"
name = "ship"
usage = "ship <version> [--no-push] [--no-test]"
what = "Cuts a release from main on its own branch `release/<version>`: the de-risking narrative, the version stamp, regeneration, the gate and the tests, one commit, pushed — and prints the tag commands for after the merge."
who = "maintainer"
effect = "writes"

[[command]]
tool = "xtask"
name = "readers"
usage = "readers [--out <dir>]"
what = "The docs folder for readers: every row's page — the tool's own generated page — and every lesson, read with no tool running, from a shared drive or an internal web server. A lesson's widgets are answered by the engine compiled for the browser (crates/vleo-kernel-wasm), run on the design the folder carries — the tree converted to its files, opened by the page before its first run — on the declared values; a row that reads reference data refuses there by name. Written to target/readers, or --out; nothing committed."
who = "developer"
effect = "writes"

[[command]]
tool = "xtask"
name = "design"
usage = "design [--out <file>]"
what = "design.vleo: the tree the tool reads — every node folder with its sheet, fixtures and page, the layers, the cases and the source list — written into one SQLite file, each file whole with its SHA-256, and naming the oldest application that can run it — the one that wrote it; an older application refuses it, saying which it needs. The kit carries it in place of the folders and the daemon reads it as it reads them, so the pages are the same byte for byte. Default target/design.vleo; nothing committed."
who = "developer"
effect = "writes"

[[command]]
tool = "xtask"
name = "design"
usage = "design --check <file>"
what = "A design file held to the tree: each file against its SHA-256, all of them against the fingerprint, and every file against the folders it was written from. Prints the differences and fails on any."
who = "developer"
effect = "reads"

[[command]]
tool = "xtask"
name = "convert"
usage = "convert [--out <dir>]"
what = "The design as its files, for the switch-over (docs/PLAN_1_0.md, phase E): the programme's, the systems' and each subsystem group's group file, a node file for every row and for each open block proposed where its group's breakdown holds none yet, and each case, laid out as the shared drive holds them. Before anything is written they are read back as the folders and loaded as the design. Default target/converted/, or an empty --out; nothing in the repository changes."
who = "developer"
effect = "writes"

[[command]]
tool = "xtask"
name = "kit"
usage = "kit [--bin <dir>] [--out <dir>] [--files-only]"
what = "The tool as each person gets it: the two release-built programs beside exactly the files they read — the design among them as one file, design.vleo — with START_HERE.md and VERSION (and start.sh off Windows, where the daemon ships as Start VLEO.exe), in dist/vleo-<version>/. Zip it and share it; see docs/SHARING.md. --files-only leaves the programs out: the files the Python package carries."
who = "developer"
effect = "writes"

[[command]]
tool = "xtask"
name = "derisk"
usage = "derisk"
what = "Write the de-risking narrative — docs/DERISK_NARRATIVE.md and docs/derisking.csv — from every node's `[[version]]` record and the risk register. Generated, never edited."
who = "developer"
effect = "writes"

[[command]]
tool = "xtask"
name = "release"
usage = "release <version> [--check]"
what = "Stamp every node version still marked `next` with this release, set the workspace version and regenerate. `--check` refuses while anything is unstamped — the release pipeline runs it."
who = "developer"
effect = "writes"

[[command]]
tool = "xtask"
name = "confirm"
usage = "confirm <node> --by \"<name>\""
what = "Put a person's name against a relation, after printing it and its source. `confirm --list` shows the ones with no name yet."
who = "developer"
effect = "writes"

[[command]]
tool = "xtask"
name = "ready"
usage = "ready [<node>]"
what = "Whether a person should be asked to look yet."
who = "developer"
effect = "reads"

[[command]]
tool = "xtask"
name = "codeowners"
usage = "codeowners"
what = "Regenerate CODEOWNERS from the layer files."
who = "developer"
effect = "writes"

[[command]]
tool = "xtask"
name = "bundle"
usage = "bundle publish <dir>"
what = "`bundle verify` re-checks every published set's hashes. `bundle publish` publishes a new one, permanently."
who = "developer"
effect = "irreversible"

[[command]]
tool = "xtask"
name = "setup"
usage = "setup"
what = "Point git at the project's hooks. Once per checkout."
who = "developer"
effect = "writes"

[[command]]
tool = "xtask"
name = "variables"
usage = "variables"
what = "Write docs/VARIABLES.md — every variable, its unit, its range and why."
who = "developer"
effect = "writes"

[[command]]
tool = "vleo"
name = "run"
usage = "run <node> [--inputs <file.csv> | --defaults] [--mode alone|branch|all] [--set id=value ...] [--save <file.csv>] [--keep] [--again]"
what = "Evaluate a row and everything it needs. Always n ran, m blocked, with the blocked named. `--save` writes the run and its inputs as a result file; `--keep` keeps it in the results folder, once. A question already kept there is shown from its saved result; `--again` runs it anyway."
who = "user"
effect = "reads"

[[command]]
tool = "vleo"
name = "sweep"
usage = "sweep <node> --over <input> --from <a> --to <b> [--points n] [--inputs <file.csv> | --defaults] [--keep] [--again]"
what = "Sweep a declared input across a range. Refused points are recorded, never dropped. `--keep` and `--again` as for run."
who = "user"
effect = "reads"

[[command]]
tool = "vleo"
name = "campaign"
usage = "campaign <node> [--inputs <file.csv> ...]"
what = "The defaults, the saved case and each case file named, against one row."
who = "user"
effect = "reads"

[[command]]
tool = "vleo"
name = "list"
usage = "list [<subsystem>]"
what = "The rows, with kind, owner and state."
who = "user"
effect = "reads"

[[command]]
tool = "vleo"
name = "show"
usage = "show <node>"
what = "A row's sheet, as the engine holds it."
who = "user"
effect = "reads"

[[command]]
tool = "vleo"
name = "cases"
usage = "cases"
what = "The case, how its inputs divide into customer and condition, and whether a case is saved."
who = "user"
effect = "reads"

[[command]]
tool = "vleo"
name = "inputs"
usage = "inputs [--inputs <file.csv> | --defaults]"
what = "Every input of the case as a CSV — group, id, value, unit, default and range — to fill in and pass back with --inputs. With --inputs, a file from an older version comes out in the current template."
who = "user"
effect = "reads"

[[command]]
tool = "vleo"
name = "result"
usage = "result <file|folder> [--html <out.html>]"
what = "A saved result shown as it was — nothing runs. Reads a result's folder, the CSV `run --save` writes, or the report page it rides in; `--html` writes that report, to send. Given a results file (.vleor), lists the results it holds."
who = "user"
effect = "reads"

[[command]]
tool = "vleo"
name = "results"
usage = "results export <file.vleor> [<name> ...]"
what = "Saved results, many in one file to send or keep: every result in the results folder, or the ones named. Each goes out whole, and every value again as a row that Python (`vleo.results`) or any SQL reader can ask for."
who = "user"
effect = "writes"

[[command]]
tool = "vleo"
name = "results"
usage = "results import <file.vleor>"
what = "The results in a results file, put back in the results folder exactly as they were — nothing runs. A question already kept is kept once."
who = "user"
effect = "writes"

[[command]]
tool = "vleo"
name = "figure"
usage = "figure <id> [key=value ...]"
what = "The numbers one figure of the solar-weather record draws, as the JSON its panel reads — the same function as `/v1/figures/solar/<id>`, on the same bundle and saved case. From Python, `vleo.figure(id, **params)` returns the same as a dict. An unknown id or key is refused by name, with a failing exit status."
who = "everyone"
effect = "reads"

[[command]]
tool = "vleo"
name = "health"
usage = "health [--trace <closure>] [--inputs <file.csv> | --defaults] [--set id=value ...]"
what = "Where exactly the design breaks, from one run of the whole design: every row closes, fails, is refused, blocked (naming the row it waits on), unproven (its own cases not reproduced) or open; each group as bad as its worst row, and the spacecraft as bad as its worst group. `--trace` walks one closure down to the rows that cause it — refused, open, unproven, or changed by a release taken into today's design — with their group and owner, and ranks the declared inputs it reads by how far each moves its margin, with the value that would make it close. Over the values still open behind it, it says whether the closure holds for all of their range, part of it or none of it, ranks them in a tornado, and names the least mature value it rests on. No closure is judged tight until the programme declares a margin policy, and it says so."
who = "everyone"
effect = "reads"

[[command]]
tool = "vleo"
name = "selftest"
usage = "selftest"
what = "Check every fixture declaration in the tree is sound. `cargo test` executes them."
who = "developer"
effect = "reads"

[[command]]
tool = "vleo"
name = "data"
usage = "data sync|list|verify"
what = "Fill the local reference-data store, say what is in it, or re-check its hashes."
who = "developer"
effect = "writes"

[[command]]
tool = "vleo"
name = "version"
usage = "version"
what = "The kernel, graph and build identity, and which graph the engine runs — the one read from the design's files, or today's design from a drive, with the releases it took. Then the design it runs and what it answers, each by its fingerprint: two computers that print the same two run the same design and give every answer alike, to the last bit, which CI checks on Linux, Windows and macOS. Every command that runs the engine opens the design first and refuses, saying why, when it does not open."
who = "everyone"
effect = "reads"


# ══════════════════════════════════════════════════════════════════════════════
# The daemon's routes. Checked against its router, both ways.

[[route]]
method = "GET"
path = "/"
what = "This page."

[[route]]
method = "GET"
path = "/app.css"
what = "The page's stylesheet."

[[route]]
method = "GET"
path = "/js/<module>"
what = "The page's modules, one per concern, served as they are written — no build step between the source and what runs."

[[route]]
method = "GET"
path = "/fonts/<font>"
what = "The page's type, bundled with the tool (web/fonts, IBM Plex Mono under the SIL Open Font License): the page looks the same everywhere and fetches nothing to do it."

[[route]]
method = "GET"
path = "/v1/version"
what = "The engine's identity: the contract version it speaks, kernel, graph, row count and data versions."

[[route]]
method = "GET"
path = "/v1/index"
what = "Every row and group, with what the tree needs to draw itself."

[[route]]
method = "GET"
path = "/v1/fragment/<id>"
what = "A row's generated page."

[[route]]
method = "GET"
path = "/v1/node/<id>"
what = "A row, as the engine holds it."

[[route]]
method = "GET"
path = "/v1/lesson/<id>"
what = "A row's lesson — its `lesson.toml`, checked as the gate checks it — or `lesson: null` for a row with none. A lesson that fails its check is refused with the reasons."

[[route]]
method = "GET"
path = "/v1/manual"
what = "This manual, with what is true of the running tool right now."

[[route]]
method = "GET"
path = "/v1/run"
what = "Evaluate a row on the saved case. `node`, and optionally `mode`, `set`, and `inputs=defaults` to run the declared defaults instead. With `reuse=1`, a question already kept in the results folder is answered from its saved result, named in `from_saved`; `again=1` runs it anyway."

[[route]]
method = "POST"
path = "/v1/run"
what = "The same as GET, with the parameters in the body."

[[route]]
method = "GET"
path = "/v1/inputs"
what = "Every input of the case — group, unit, default, range and the saved value — whether a case is saved, the current template, and what the last carry-over did to it."

[[route]]
method = "GET"
path = "/v1/inputs.csv"
what = "The saved case as a CSV to keep, in the current template with the record of any carry-over; with `inputs=defaults` the blank template; with `backup=1` the file as it was before the tool last carried it over."

[[route]]
method = "POST"
path = "/v1/inputs/check"
what = "Read a case — `csv=` a file's text, or `set=<id>:<si>` pairs — and say what it sets and every row it refuses. Saves nothing."

[[route]]
method = "POST"
path = "/v1/inputs"
what = "Save a case, the same parameters as the check. All or nothing: a case with any refused row is not saved. Written outside the repository."

[[route]]
method = "POST"
path = "/v1/inputs/reset"
what = "Remove the saved case: every input back to its default."

[[route]]
method = "GET"
path = "/v1/form/<id>"
what = "A node's form, as one self-contained HTML file to fill anywhere. `new` is the form for a node the design does not have yet."

[[route]]
method = "GET"
path = "/v1/lesson-form/<id>"
what = "A row's lesson form, as one self-contained HTML file to fill anywhere, checked as it is typed by the gate's own lesson check. Writes nothing — a filled one is applied by a developer with `xtask lesson apply`."

[[route]]
method = "POST"
path = "/v1/form/check"
what = "What a filled node form would change, and every interface it declares: `html=` the file's text. Writes nothing — a form is applied by a developer with `xtask intake --apply`."

[[route]]
method = "GET"
path = "/v1/derisk"
what = "Every registered risk, where it stands and every node version that moved it — the conclusion the risk-register rows draw — and the version each recorded node is at."

[[route]]
method = "GET"
path = "/v1/results"
what = "Every result kept on this machine, newest first, and where they are kept."

[[route]]
method = "GET"
path = "/v1/result"
what = "One saved result, as it was: `name`. Nothing runs."

[[route]]
method = "GET"
path = "/v1/result.csv"
what = "A saved result's CSV, to keep or send: `name`."

[[route]]
method = "GET"
path = "/v1/result.sweep.csv"
what = "A saved sweep's points as CSV, to keep or send: `name`."

[[route]]
method = "GET"
path = "/v1/result.html"
what = "A saved result as a report page that reads without the tool, draws its sweep, and carries its CSVs: `name`."

[[route]]
method = "GET"
path = "/v1/figures/samples"
what = "One figure of every kind — line, scatter, bar, heatmap, animation, 3D scene — with illustrative numbers, as a result's `figures` carries them. What a face is built and checked against; not a result."

[[route]]
method = "GET"
path = "/v1/figures/solar/<id>"
what = "The numbers one figure of the solar-weather record states, worked out by the engine from the bundle it holds (`crates/vleo-modules/src/record.rs`): `density` — the correlation of F10.7 with Ap, their medians, the share of days below both, and the F10.7 deciles that saw a storm day; `storm-scale` — days a year at G1 to G3 in each cycle, the busiest cycle and the largest Ap in each; `kp-ap` — the daily Ap at each worst three-hourly Kp and where the published table sits above it; `recurrence-f107` and `recurrence-ap` — the autocorrelation of the detrended record against lag under three windows, Bartlett's band and the rotation's peaks; `spikes` — the F10.7 spike threshold, the spike days and bursts, and their rate per thousand days of cycle phase. `mean-cycle` takes `v` (f107, ap or ssn) and `bins` (2 to 100): every cycle stacked on phase, the mean of the complete ones, and how well the last two complete cycles repeat each other. `segments` takes `v` (ap or f107): the histogram and each band's share, banded by the rows themselves (`sw_regime`, `sw_activity_band`), and where the record crosses each cut; `regime-phase` — the share of days at each cycle phase `sw_regime` calls storm, and quiet. `climate` takes `v` and `by` (year, doy or month): the record's mean in each group on its own calendar, and the mean over its days; `smoother` takes `v`: each month's mean beside the 13-month smoothed value from `monthly_means.csv`, and what the smoothing removes. `growth` takes `v` and `by` (all or cycle): the signed change over leads from 30 days to 15 years at the 50th, 90th, 95th and 99th percentiles with the pairs behind each, or the 95th within each cycle. `forecast` takes `view` (lead, year or age): the issued 27-day outlook's skill against persistence — from the day before the issue, and from the issue date itself, which leaks — its bias and RMS error at each lead from 1 to 27 or in each year of issue on leads 1 to 14, with the pairs behind each; or the gaps between one issue and the next. `drivers` — the solar crossing's twenty-five scenario cells run on the saved case against the legacy tool's own run of them (`matlab/reference/mission_drivers.csv`): each ratio and gap, where each quantity's gap is widest, how many cells agree to a tenth of a per cent, and how far the worst is out. `thermosphere` takes `view` (solar, kp, slot or shape): env_exospheric_temperature run and probed as the panel asks — the three ways to raise the flux and their slopes, one Kp curve per scenario at its own flux with its two Kp readings and the widest gap, each scenario's two readings side by side, or the Kp sweep against the straight line its quiet end sets. `design` takes `v` (ap or f107): for Ap, with `g` (1 to 3) and `req` (l3_solar_req_03, _04 or _05), sw_storm_return_level swept over the mission duration, the G-level bound and the requirement, where the curve first reaches each, and the record's days at or above the bound in how many runs; for F10.7, with `reqf` (l3_solar_req_01 or _02), the four design-window rows and the analogue's peak swept the same way, the worst single day and what is left of the requirement above it, the window's width and where the peak first climbs above the hot single day. `closure` takes `pair` (01 to 05): the decision that spends that closure's margin fastest, by the levers' own ranking with the requirement skipped, the margin and the achieved quantity swept over it, and where each runs out. In these two the sweeps and the ranking run on the case the request carries, `set=` overrides and all, and each row's own answer — the requirement, the achieved margin — on the saved case, as the page's engine values are. The page draws them and computes none; an id the engine does not work out is refused by name."

[[route]]
method = "POST"
path = "/v1/results/save"
what = "Run, and keep what it returned and the inputs it ran on as a result folder: the parameters of `/v1/run`, and `label`; with `over`, `from`, `to` and `points` the sweep is kept with it. Kept once: a question already kept answers `already` and names it. Written outside the repository."

[[route]]
method = "POST"
path = "/v1/results/upload"
what = "Keep a result somebody sent: `csv=` its CSV or the text of its report, and `sweep=` its sweep CSV when it is one. Kept once, as a save is."

[[route]]
method = "POST"
path = "/v1/results/upload-file"
what = "Keep every result a results file (`results.vleor`) holds: `vleor=` the file, base64. Each is kept once, as a save is, pinned where the file says so; the answer names each one, how many were new and how many already kept."

[[route]]
method = "POST"
path = "/v1/results/pin"
what = "Pin a saved result so every value is kept for good (`on=1`), or unpin it (`on=0`) so it is thinned to its summary once it is older than `VLEO_KEEP_DAYS`: `name`."

[[route]]
method = "POST"
path = "/v1/results/delete"
what = "Remove one saved result: `name`."

[[route]]
method = "POST"
path = "/v1/results/as-case"
what = "Make a saved result's inputs the case: `name`. Checked like any case, and refused whole if one cannot apply."

[[route]]
method = "GET"
path = "/v1/sweep"
what = "A behaviour sweep, as `vleo sweep`. Refused points are reported with their reason. `reuse=1` and `again=1` as for `/v1/run`."

[[route]]
method = "GET"
path = "/v1/probe"
what = "One relation at chosen inputs: `node`, and `in=<var>:<value>` for each. Answers even where a run would refuse a supplied value."

[[route]]
method = "GET"
path = "/v1/levers"
what = "Which declared decisions actually move a row's answer, and by how much: `node`."

[[route]]
method = "GET"
path = "/v1/branches"
what = "The largest fully-published branches a row is part of: `node`."

[[route]]
method = "GET"
path = "/v1/bundle/<name>"
what = "A reference-data set's published files."

[[route]]
method = "GET"
path = "/v1/parity/<name>"
what = "The published output of the tool this was ported from, for comparison."


# ══════════════════════════════════════════════════════════════════════════════
# Settings. Checked against every place in the code that reads one, both ways.

[[env]]
name = "VLEO_CASE"
what = "Where the saved case is kept — the CSV the Inputs page and `vleo run` read. Outside the repository, so git never sees it. A copy made before a carry-over sits beside it."
default = "$HOME/.vleo/case/inputs.csv"

[[env]]
name = "VLEO_CONTRACT_RECORD"
what = "Set to `1` when running the contract tests, to record contract/examples/ again from the real engine after an answer's shape changes, and draft a schema for a route that has none. It never rewrites a schema. Unset, the tests only check."
default = "unset — check"

[[env]]
name = "VLEO_BASELINE"
what = "Set to `write` when running the test of today's answers, to record baseline/today.csv again after a deliberate change to the design, in the same commit as the change. Unset, the test compares and fails on any difference."
default = "unset — compare"

[[env]]
name = "VLEO_TRANSCRIBED"
what = "Set to `write` when running the test of the transcribed relations, to record baseline/transcribed.csv from the build that still has the code each method replaces. Written once, before the methods; never again to get green. Unset, the test holds every method to the record."
default = "unset — compare"

[[env]]
name = "VLEO_KINDS"
what = "Set to `write` when running the tests of crates/vleo-kinds, to write the table of file kinds into the Python reader (crates/vleo-py/python/vleo/files.py) again after a deliberate change to the table. Unset, the test compares and fails on any difference."
default = "unset — compare"

[[env]]
name = "VLEO_BROWSER_ANSWERS"
what = "The file `tools/readers_check.py --answers` wrote: every answer the engine in a readers' page gave. Set when running `cargo test -- --include-ignored` in crates/vleo-kernel-wasm, it holds each of those answers to the same engine built natively, byte for byte. Unset, that one test refuses to run and says why; the pipeline's readers job sets it."
default = "unset — the comparison is not run"

[[env]]
name = "VLEO_GOLDEN"
what = "Set to `write` when running the translator's golden test, to write the golden files again after an intended change to how methods are translated. Unset, the test compares and fails on any difference."
default = "unset — compare"

[[env]]
name = "VLEO_LOG"
what = "Where a crash log is written when the tool hits a bug — one small text file per bug, naming the line of code; the newest 50 are kept. Send the file to whoever maintains the tool. Set but empty counts as unset."
default = "$HOME/.vleo/log"

[[env]]
name = "VLEO_RESULTS"
what = "Where saved results are kept, one folder each — the Results page and `vleo run --keep`. Outside the repository. Point it at a shared or synced folder and everyone keeps one archive: each question is kept once, a question a colleague answered is shown rather than run again, and every result is written whole. Set but empty counts as unset."
default = "$HOME/.vleo/results"

[[env]]
name = "VLEO_KEEP_DAYS"
what = "How many days a saved result keeps every value. When the daemon starts, an unpinned result older than this is thinned to its summary — the inputs it ran on, its answer, what could not run — and says so; a pinned one is kept whole for good. `0` never thins. A folder named by `VLEO_RESULTS` — usually the shared archive — is kept whole unless this is set too: thinning it is everyone's decision, not whichever laptop starts first. A value that is not a whole number of days thins nothing and says why."
default = "30; kept whole when VLEO_RESULTS names the folder"

[[env]]
name = "VLEO_ROOT"
what = "Where the daemon finds the web face, the tree and its pages. Unset, it looks upward from where it was started, then from beside its own program — which is how a kit runs with no checkout."
default = "found"

[[env]]
name = "VLEO_DESIGN"
what = "A design file for the daemon to read the design from, in place of the one beside it or the folders of a checkout; or a folder of the design converted to its files (`cargo run -p xtask -- convert`), its group, node and case files read as the folders they came from. A file or folder that does not open stops the daemon, naming why: it never falls back to whatever folders sit beside it. A converted design with rows this build has not, such as the open blocks the conversion adds, is refused, saying so, until the faces read the graph (docs/PLAN_1_0.md, phase E)."
default = "design.vleo beside the tool, else the folders"

[[env]]
name = "VLEO_DRIVE"
what = "A shared drive to build today's design from: every group's latest sealed release in its `groups/<group>/releases/` that passes its checks — its seal, its content, and each node as the form its node engineer would have filled — taken into the design, in memory. A group whose latest is refused is built from its last good release, and the tool says which release each group's part is, and why one was refused. A folder that is not a drive stops the tool, naming why. Nothing on the drive is written."
default = "unset: the design file or the folders, as they are"

[[env]]
name = "VLEO_PORT"
what = "The first port the daemon tries. It takes the first free one of sixteen from there."
default = "7777"

[[env]]
name = "VLEO_DATA"
what = "Where the local reference-data store lives."
default = "$HOME/.vleo/data"

[[env]]
name = "VLEO_DAEMON"
what = "Where the checking scripts in tools/ find a running daemon."
default = "http://localhost:7777"

[[env]]
name = "VLEO_CHROMIUM"
what = "The browser the panel check drives, when it cannot find the installed one on its own."
default = "found under PLAYWRIGHT_BROWSERS_PATH"


