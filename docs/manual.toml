[[layer.section]]
id = "browser-whatif"
title = "Ask “what if” — change an input and watch the answer move"
who = "user"
body = """
A **declared** row is a number a person chose and put their name against — a \
mission length, an altitude, a storm level. You can try a different value for \
any published declared row and see what it does to everything downstream.

**This is not an edit.** The override lives in this browser only. The sheet on \
disk keeps its declared value and its attribution, and `git status` is empty \
afterwards. A bar across the top of every page lists what is overridden for as \
long as anything is, because every computed number below it is then about a \
design that is not the one in the repository.

A **computed** row cannot be overridden: its value would be recomputed from its \
inputs the moment it ran. Change one of the declared numbers it reads instead."""

[[layer.section.step]]
say = "Open a declared row. Beside its declared value is a box: type a new value inside the shown range."

