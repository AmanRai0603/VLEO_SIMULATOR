# ══════════════════════════════════════════════════════════════════════════════
# The daemon's routes. Checked against its router, both ways.

[[route]]
method = "GET"
path = "/"
what = "This page."

[[route]]
method = "GET"
path = "/app.css"
what = "The page's stylesheet."

[[route]]
method = "GET"
path = "/js/<module>"
what = "The page's modules, one per concern, served as they are written — no build step between the source and what runs."

[[route]]
method = "GET"
path = "/v1/version"
what = "The engine's identity: kernel, graph, row count and data versions."

[[route]]
method = "GET"
path = "/v1/index"
what = "Every row and group, with what the tree needs to draw itself."

[[route]]
method = "GET"
path = "/v1/fragment/<id>"
what = "A row's generated page."

[[route]]
method = "GET"
path = "/v1/node/<id>"
what = "A row, as the engine holds it."

[[route]]
method = "GET"
path = "/v1/declare/<id>"
what = "The form for one row: every question, its shape, its current answer and whether it blocks generation."

[[route]]
method = "GET"
path = "/v1/manual"
what = "This manual, with what is true of the running tool right now."

[[route]]
method = "POST"
path = "/v1/sheet/<id>"
what = "Save one field. `field`, `value`, and `base` — the version the form started from."
writes = true

[[route]]
method = "POST"
path = "/v1/block/<id>"
what = "Add, change or remove one entry of a list. `array`, `op`, `index`, the entry's keys, and `base`."
writes = true

[[route]]
method = "POST"
path = "/v1/view/<id>"
what = "Set how the answer is drawn. `kind`, `over`, `points`, and `base`."
writes = true

[[route]]
method = "POST"
path = "/v1/publish/<id>"
what = "Publish a seeded row. `base`."
writes = true

[[route]]
method = "POST"
path = "/v1/preview/<id>"
what = "What pasting a sheet body would change. Writes nothing. `body`."

[[route]]
method = "POST"
path = "/v1/propose"
what = "Commit the edited rows to a new branch. Does not push. `summary`, `kind`."
writes = true

[[route]]
method = "GET"
path = "/v1/run"
what = "Evaluate a row on the saved case. `node`, and optionally `mode`, `set`, and `inputs=defaults` to run the declared defaults instead."

[[route]]
method = "POST"
path = "/v1/run"
what = "The same as GET, with the parameters in the body."

[[route]]
method = "GET"
path = "/v1/inputs"
what = "Every input of the case — group, unit, default, range and the saved value — whether a case is saved, the current template, and what the last carry-over did to it."

[[route]]
method = "GET"
path = "/v1/inputs.csv"
what = "The saved case as a CSV to keep, in the current template with the record of any carry-over; with `inputs=defaults` the blank template; with `backup=1` the file as it was before the tool last carried it over."

[[route]]
method = "POST"
path = "/v1/inputs/check"
what = "Read a case — `csv=` a file's text, or `set=<id>:<si>` pairs — and say what it sets and every row it refuses. Saves nothing."

[[route]]
method = "POST"
path = "/v1/inputs"
what = "Save a case, the same parameters as the check. All or nothing: a case with any refused row is not saved. Written outside the repository, so it needs no write permission."

[[route]]
method = "POST"
path = "/v1/inputs/reset"
what = "Remove the saved case: every input back to its default."

[[route]]
method = "GET"
path = "/v1/form/<id>"
what = "A node's form, as one self-contained HTML file to fill anywhere."

[[route]]
method = "POST"
path = "/v1/form/check"
what = "What a filled node form would change: `html=` the file's text. Writes nothing — a form is applied with `xtask intake --apply`."

[[route]]
method = "GET"
path = "/v1/sweep"
what = "A behaviour sweep, as `vleo sweep`. Refused points are reported with their reason."

[[route]]
method = "GET"
path = "/v1/probe"
what = "One relation at chosen inputs: `node`, and `in=<var>:<value>` for each. Answers even where a run would refuse a supplied value."

[[route]]
method = "GET"
path = "/v1/levers"
what = "Which declared decisions actually move a row's answer, and by how much: `node`."

[[route]]
method = "GET"
path = "/v1/branches"
what = "The largest fully-published branches a row is part of: `node`."

[[route]]
method = "GET"
path = "/v1/bundle/<name>"
what = "A reference-data set's published files."

[[route]]
method = "GET"
path = "/v1/parity/<name>"
what = "The published output of the tool this was ported from, for comparison."


# ══════════════════════════════════════════════════════════════════════════════
# Settings. Checked against every place in the code that reads one, both ways.

[[env]]
name = "VLEO_ALLOW_WRITE"
what = "Start the daemon able to edit sheets: 1, true or yes. Anything else, or unset, is read-only."
default = "unset — read-only"

[[env]]
name = "VLEO_CASE"
what = "Where the saved case is kept — the CSV the Inputs page and `vleo run` read. Outside the repository, so git never sees it. A copy made before a carry-over sits beside it."
default = "$HOME/.vleo/case/inputs.csv"

[[env]]
name = "VLEO_PORT"
what = "The first port the daemon tries. It takes the first free one of sixteen from there."
default = "7777"

[[env]]
name = "VLEO_DATA"
what = "Where the local reference-data store lives."
default = "$HOME/.vleo/data"

[[env]]
name = "VLEO_DAEMON"
what = "Where the checking scripts in tools/ find a running daemon."
default = "http://localhost:7777"

[[env]]
name = "VLEO_CHROMIUM"
what = "The browser the panel check drives, when it cannot find the installed one on its own."
default = "found under PLAYWRIGHT_BROWSERS_PATH"


