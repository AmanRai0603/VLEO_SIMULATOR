[[layer.section]]
id = "browser-read"
title = "Read a row"
who = "user"
kind = "explanation"
answer = "A row's page opens with its answer first, then says it simply, then the real relation and its source, then where the simple version breaks. Every claim says whether it is sourced, derived or declared, and the depth switch chooses how much is shown."
body = """
A row's page answers four questions, in order.

**What it is made of** — the files in its folder, which one a person writes \
(`node.toml`, the sheet) and which ones are generated from it.

**What it is joined to** — the rows it reads, the rows that read it, and which \
customer targets it feeds.

**What it says** — the sheet itself, laid out the same way on every row: an \
**Answer first** box, then the row **said simply**, then **the real thing** — \
its relation and where that came from — then **where the simple version \
breaks**, and the wrong idea readers most often bring. Every claim is marked \
*sourced*, *derived* or *declared*, and every tab says whether it is an \
explanation, a reference or something to try. The **de-risking** tab says what \
the row rests on and why it changed. Beside the sheet is the node's **form**, \
for when what it says should change.

**The picture** — for the rows that have one, the figure the claim is argued \
from.

A **grey** row is *seeded*: its folder exists and nothing is specified in it \
yet. That is the normal state of most of the tree — the decomposition written \
down before anyone was asked to fill it — not a failure, and its form is how it \
gets filled. A row marked **INACTIVE** has a relation but nothing on its sheet \
saying where the relation came from, so it does not answer until a form \
supplies that and a developer applies it."""

