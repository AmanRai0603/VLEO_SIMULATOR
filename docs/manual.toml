[[layer.section]]
id = "browser-results"
title = "Keep a result, send it, and see it again without running"
who = "user"
kind = "how-to"
answer = "Save a run as a result, and see it again later without running anything — or send it as a CSV or a report page. A result keeps the node versions it rested on, and says when one of those beliefs has broken since."
body = """
A run is worth keeping when somebody will ask about it later. **Save** it and \
the tool writes one CSV: every value the run returned with its unit, its \
credibility and what governs it, every row it blocked on and why, and **every \
input it ran on**. The file is kept on this machine, in `~/.vleo/results/` or \
wherever `VLEO_RESULTS` points — outside the repository, like the case.

The **Results** tab lists every saved result and shows any of them as it was \
— **nothing runs**, so a result saved before a release reads exactly the same \
after it. Two results can be compared value by value, and the inputs that \
differ between them are listed first, because that is usually the answer.

To send one, download it as the **CSV** — it opens in any spreadsheet — or as \
a **report**: one HTML page that reads without the tool, and carries the CSV \
inside it, so uploading the report gives the result back whole. A result \
somebody sent you is uploaded the same way.

**A result's inputs can become the case.** That puts every input back to what \
the result ran on — the way to reproduce it, or to carry on from it. It is \
checked like any other case, and refused whole if a release has since retired \
or re-ranged something it sets."""

