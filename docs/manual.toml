# Settings. Checked against every place in the code that reads one, both ways.

[[env]]
name = "VLEO_CASE"
what = "Where the saved case is kept — the CSV the Inputs page and `vleo run` read. Outside the repository, so git never sees it. A copy made before a carry-over sits beside it."
default = "$HOME/.vleo/case/inputs.csv"

[[env]]
name = "VLEO_RESULTS"
what = "Where saved results are kept — the Results page and `vleo run --save` without a path of its own. Outside the repository."
default = "$HOME/.vleo/results"

[[env]]
name = "VLEO_ROOT"
what = "Where the daemon finds the web face, the tree and its pages. Unset, it looks upward from where it was started, then from beside its own program — which is how a kit runs with no checkout."
default = "found"

[[env]]
name = "VLEO_PORT"
what = "The first port the daemon tries. It takes the first free one of sixteen from there."
default = "7777"

[[env]]
name = "VLEO_DATA"
what = "Where the local reference-data store lives."
default = "$HOME/.vleo/data"

[[env]]
name = "VLEO_DAEMON"
what = "Where the checking scripts in tools/ find a running daemon."
default = "http://localhost:7777"

[[env]]
name = "VLEO_CHROMIUM"
what = "The browser the panel check drives, when it cannot find the installed one on its own."
default = "found under PLAYWRIGHT_BROWSERS_PATH"


