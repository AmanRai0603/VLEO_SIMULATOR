[[layer.section]]
id = "term-wrong"
title = "When something goes wrong"
who = "everyone"
kind = "reference"
answer = "The usual failures, each with what it means and what to do. Almost every refusal names the field and the rule, and that line is usually the whole answer."
body = """
**The tool will not start: nothing was free.** It tries sixteen ports from 7777 \
upward. Something else is holding them — often an earlier copy of the tool. \
Stop that one, or set `VLEO_PORT` to start somewhere else.

**An uploaded case or result is refused.** Every refused row is named, with \
why. A case is all or nothing, so correct the named rows and upload it again. \
A file from an older release is carried over rather than refused; one the \
tool did not write — no `#! result` line — is not a result at all.

**A form's check shows a conflict.** Somebody changed that field in the design \
after the form was made. Nothing is overwritten: download the node's form \
again, carry the answer across, and send the new one.

**A form's check says an interface does not connect.** The input names a row \
that does not exist, or one of a different quantity. The line says which, and \
what the row it names actually is.

**The checks refuse a row.** Each failure names the field and the rule. Read \
that line before anything else; it is almost always the whole answer.

**A row prints INACTIVE and does not answer.** Its relation is written but \
nobody has derived it: the sheet has no `[theory]` block saying why it is this \
relation. That is a person's work, supplied through the node's form, never \
something to work around — and every row that reads it is blocked, by name, \
until it is done. `active` lists each such row and how many rows wait on it.

**A sweep answers no point.** Every point is still recorded, with why: \
*blocked* when a row on its chain does not answer, or the bound and its reason \
when the value is outside the declared range of the row being swept.

**A command warns that the hooks are not wired.** Run `setup` once in this \
checkout.

**The commit hook refuses a message.** It must read \
`type(scope): a sentence`, and `tools/commit_message.py --types` prints every \
type and scope it accepts.

**A number looks wrong.** Run the row in the terminal, read its credibility \
line and which factor governs it, and look at *the chain behind this number* — \
every value that reached it, with each one's own credibility. If the design is \
what is wrong, that is a form."""

[[layer.section.step]]
say = "Start the tool on another port."
run = "VLEO_PORT=8080 cargo run --release -p vleo-daemon"
check = "serves"

[[layer.section.step]]
say = "Every row that is written but does not answer, and how many rows wait on each."
run = "cargo run -p xtask -- active"
check = "exits"
expect = "undefined — the relation is stated and never derived"


# ══════════════════════════════════════════════════════════════════════════════
[[layer]]
id = "codebase"
title = "The codebase"
lede = """
What is in the repository, why each part is there, and what breaks without it."""

[[layer.section]]
id = "code-shape"
title = "The shape of it"
who = "developer"
kind = "explanation"
answer = "One kernel computes every number; everything else is arranged in rings that depend inward only. A row is one folder, and only its node.toml is written by hand."
body = """
**One kernel computes every number.** Everything else is arranged in rings \
that depend inward only: quantities and portable maths (`vleo-units`), then the \
kernel of physics and relations (`vleo-core`), then transport (`vleo-bus`), \
then one crate per subsystem of rows (`vleo-mod-*`), then the faces — the \
browser daemon, the command line, and the Python, WebAssembly and C bindings. \
`xtask graph` checks every dependency points inward.

**Every formula lives in `vleo-core::physics` and nowhere else.** A row \
composes relations from there in a few lines; it never defines one of its own.

**The tree is layers of rows.** Layer 1 is the programme's view, layer 2 the \
system's, layer 3 the subsystems', and layer 4 is a run. Each subsystem reaches \
the layer above through exactly one interface row, so *where did this number \
come from* is answered by walking upward without ever leaving the tree.

**One row is one folder**, under `crates/vleo-mod-<subsystem>/nodes/<row>/`:

`node.toml` — the sheet. The only file written by hand — by a form's intake, or a developer.
`fixtures.toml` — known-good values from outside this code.
`model.rs` — generated, except the numbered slots where the Rust goes.
`contract.rs`, `mod.rs`, `evidence.rs`, `page.html`, `meta.json` — generated.

The rules that do not bend, and the developer's loop, are in `AGENTS.md`; the \
reasoning behind the architecture is in `docs/ARCHITECTURE.md`."""

[[layer.section]]
id = "code-folders"
title = "Every top-level folder"
who = "everyone"
kind = "reference"
answer = "Every folder and file at the top of the repository, and what it holds — checked against the repository both ways."
body = """
Every folder and file the repository tracks at its top level is below, with \
what it holds — the list is checked against the repository itself, so nothing \
is missing from it and nothing in it is gone."""

[[layer.section]]
id = "code-docs"
title = "Where to read next"
who = "everyone"
kind = "reference"
answer = "Every document under docs/, and what it is for — checked against the folder both ways."
body = """
Every document under `docs/`, and what it is for. Also checked against the \
folder, both ways."""


