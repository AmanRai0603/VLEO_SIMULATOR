# ══════════════════════════════════════════════════════════════════════════════
# What each place cannot do, and where it is done instead.

[[cannot]]
place = "browser"
what = "Change a node — any field of its sheet"
why = "A change to the design has to be checked against every row that reads it, implemented, given evidence and released, so that everyone runs the same thing."
instead = "Its node engineer changes it in the node's own file; it arrives with the group's sealed release."
who = "user"

[[cannot]]
place = "browser"
what = "Add a new node"
why = "A new node is a new node file in the tree with an owner, a place among its siblings and interfaces to rows that exist."
instead = "Its subsystem engineer adds it to the group, and it arrives with the group's sealed release."
who = "user"

[[cannot]]
place = "browser"
what = "Delete a node"
why = "Other rows read it. Removing one is a change to what every reader of it computes, and is decided in review."
instead = "Its subsystem engineer retires it in the group's release, after `cargo run -p xtask -- reach` shows what reads it."
who = "user"

[[cannot]]
place = "browser"
what = "Move a node, rename it, or change its owner, layer, kind or order"
why = "These move the tree or change who reviews the row. Its identifier is also its file and its variable name."
instead = "Its subsystem engineer changes it in the group's release (docs/GROUP_APPS.md); the reason for each is under Reference."
who = "developer"

[[cannot]]
place = "browser"
what = "Change a declared number in the design itself"
why = "A what-if and the saved case never touch the sheet: a declared value carries the name of the person who chose it."
instead = "For your own runs, the case. For the design's default, the node's own file."
who = "user"

[[cannot]]
place = "browser"
what = "Add a known-good value (a fixture)"
why = "An expected value may never come from the code under test. Only a person records one, with its source."
instead = "The node engineer adds it to their node's file in their group's application, with the value's source and provenance."
who = "developer"

[[cannot]]
place = "browser"
what = "Put your name against a relation"
why = "Signing is an act of reading the relation against its source, done by the person who owns it."
instead = "The node engineer signs their node's file in their group's application (docs/GROUP_APPS.md)."
who = "developer"

[[cannot]]
place = "browser"
what = "Run the checks, the tests or the generators for the whole tree"
why = "They are what decides whether a change may be merged, so they run where the change is committed — and in the pipeline, on every push."
instead = "cargo run -p xtask -- gate && cargo test"
who = "developer"

[[cannot]]
place = "browser"
what = "Publish or change reference data"
why = "A published set is permanent by design, and every number checked against it depends on it not changing."
instead = "cargo run -p xtask -- bundle publish <dir>"
who = "developer"

[[cannot]]
place = "terminal"
what = "Show a figure, or click from a number to where it came from"
why = "The terminal prints the numbers — a row's, the chain behind each and every blocked row, and with `vleo figure` the numbers a panel draws; pictures are the browser's."
instead = "The browser: the row's page, and the panels on layer 3."
who = "user"


