ui = "the node form — fill it anywhere"

[[layer.section.step]]
say = "Download it and send it to whoever should fill it."
ui = "download the node form"

[[layer.section.step]]
say = "For a node that does not exist yet."
ui = "download the form for a new node"

[[layer.section.step]]
say = "When it comes back, check it: what it would change, every interface, and what it cannot. Nothing is written."
ui = "check a filled form…"


[[layer.section]]
id = "browser-derisk"
title = "Why a node changes — its beliefs, versions and risks"
who = "user"
kind = "explanation"
answer = "A node changes only because a belief it rested on broke, and every change records what we believed, what we tested, what we now know and what changed. The risk-register rows of the management layer conclude, from every node's record, how that work has moved the programme's risks."
body = """
Every decision in the design rests on a belief — that this relation holds here, \
that this input is the one that matters, that this picture shows what it \
claims. A node changes only when one of those beliefs **breaks**: somebody \
tested it and learned otherwise. So a node's page has a **de-risking** tab. It \
says what the node rests on now and what would break it, then every version \
before it, newest first: what we believed, what we tested, what we now know, \
what it cost, what changed, and which risks that moved.

`sw_central_expectation` — the centre of the F10.7 design value — carries its \
real history as the worked example: three versions, each replaced because a \
test showed its belief did not hold.

**The conclusion is drawn in the management layer.** A risk is registered once, \
on one of the four risk-register rows — technical, schedule, supply, \
regulatory — and moved only by node versions. Each of those rows' pages lists \
its risks, where each started and where it stands now, and every version \
across the tree that moved it. That is how the work below, taken together, \
has de-risked the programme; `docs/DERISK_NARRATIVE.md` is the same thing as a \
document, and `docs/derisking.csv` as a spreadsheet.

**A saved result keeps the versions it rested on.** When one of those rows has \
moved on since, the result says so beside its number.

**How deep a page goes is yours to choose.** The switch at the top — **Learn**, \
**Read**, **Expert** — shows the same pages at three depths: Learn keeps every \
step and asks you to predict before you run; Read shows the answer, the plain \
words and the real thing; Expert keeps the answer, the relation, the limits and \
the reference. How every page is laid out, and why, is in `docs/EXPLAINING.md`."""

[[layer.section.step]]
say = "Choose how deep the pages go. Learn adds a prediction to make before each run."
ui = "Learn"

[[layer.section.step]]
say = "Open a row and its de-risking tab: what it rests on now, and every version before it."

[[layer.section.step]]
say = "Open a risk-register row under the management layer's risk register: its risks, and what the work below has done to them."
ui = "What the work below has done to them"


[[layer.section]]
id = "browser-limits"
title = "What the browser will not do"
who = "everyone"
kind = "reference"
answer = "The browser never changes the design. Each thing it will not do has a place it is done instead, and for a team that place is almost always a node's form."
body = """
The browser never changes the design: not a field, not a row, not the tree. \
That is not to keep anybody out. A change to the design has to be checked \
against every row that reads it, implemented, given evidence, and released so \
that everyone runs the same thing — and a change typed into one copy of the \
tool does none of that. So each one below has a place it is done instead, and \
for a team that place is almost always a form.

The fields a node form does not carry at all — the ones that move a row in the \
tree or change who owns it — are listed live under *Reference*, each with its \
reason."""


