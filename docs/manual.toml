effect = "reads"

[[command]]
tool = "xtask"
name = "reach"
usage = "reach [<subsystem>]"
what = "Where each answer goes, and which reach no customer target."
who = "everyone"
effect = "reads"

[[command]]
tool = "xtask"
name = "gap"
usage = "gap"
what = "What every sheet promised and nothing yet covers."
who = "developer"
effect = "reads"

[[command]]
tool = "xtask"
name = "graph"
usage = "graph"
what = "The three graphs, their sizes, and the check that every crate depends inward."
who = "developer"
effect = "reads"

[[command]]
tool = "xtask"
name = "new"
usage = "new <id> --like <sibling>"
what = "Start a row from a sibling's shape, with everything that must be re-decided blanked."
who = "developer"
effect = "writes"

[[command]]
tool = "xtask"
name = "declare"
usage = "declare <node>"
what = "The questions a sheet still has open, and what goes wrong without each."
who = "everyone"
effect = "reads"

[[command]]
tool = "xtask"
name = "fill"
