[[layer.section]]
id = "term-push"
title = "Before you push, and how to release"
who = "developer"
kind = "how-to"
answer = "Run the pipeline's checks before pushing: the gate and every test first, then formatting, lints, the assembly validations and the panels. A change from a form names who filled it."
body = """
The pipeline runs all of these on every push; running them first saves a round \
trip. The first is the one that must be green.

Commit messages read `type(scope): a sentence saying what changed`. The hook \
installed by `setup` refuses anything else before it leaves your machine, and \
the pipeline runs the same rule. A change that came from a form names who \
filled it. How many reviewers a change needs is in `CONTRIBUTING.md`.

Once merged, the change reaches the team in the next release: they update, and \
their saved case carries over on its own — see *Set the inputs*."""

