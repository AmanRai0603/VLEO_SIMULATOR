[[layer.section]]
id = "browser-forms"
title = "What comes in from outside, and what does not"
who = "user"
kind = "how-to"
answer = "Two things reach the tool from outside: your inputs, and a result you kept. Neither changes the design. A node changes only in its own file, written by its node engineer and sealed in its group's release."
body = """
The **Forms** page lists both, with where each is set: the inputs on the \
Inputs page, as a CSV or one value at a time, and results on the Results \
page, shown without running. Both are yours, kept on this machine.

**A node is not among them.** What a node asks, how it computes and what it \
reads is the design, and the design is written by the people who own it, \
each in their own file. A group's work reaches this tool as its sealed \
release, on the shared drive. The browser never writes a node.

**A lesson is the one thing still filled here**: a row's lesson form, filled \
anywhere and checked as you type, sent back to the developer."""

