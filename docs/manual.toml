Every computed row can be evaluated on the spot, on its own page or from the \
**4 The run** tab.

**A run is on the case** — its saved inputs, see *Set the inputs*. The panel \
says so in a sentence, and under it lists every input the answer depends on, \
the most influential first, each with the value it will run at, which half of \
the case it is in, and where the value came from: the **default**, the **saved \
case**, or **your edit**.

Change one to ask a what-if. The edit is kept in this browser only — listed in \
the bar at the top, applied to every run and sweep until you reset it, and \
never written to a file. When a what-if is worth keeping, **save it to the \
case** and every page runs on it from then on.

The result always says **n ran, m blocked**, and names every blocked row. A row \
with nothing in it does not quietly supply a default — it refuses, under its \
own name, and everything that needed it says so. That count is never hidden, \
because a number built partly on refusals is not the number it looks like."""

