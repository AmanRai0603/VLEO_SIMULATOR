[[layer.section]]
id = "term-run"
title = "Run, change an input, sweep, keep the result"
who = "user"
kind = "how-to"
answer = "Run a row on the case, on a CSV of your own or on the declared defaults, change a declared input with --set, sweep one, and keep a run as a result file."
body = """
The examples use the storm row `sw_ap_design`: *what daily Ap is this design \
built to survive?* It reads one declared number, the storm level designed for, \
and turns it into the Ap that level bounds.

A run prints the answer, its **credibility** — the weakest of eight factors, \
named — and **n ran, m blocked** with every blocked row named. The **chain** \
hash identifies that exact number: the engine, the tree and every input that \
reached it. Two runs with the same chain are the same run, so it is \
the thing to quote.

A run is on the **case**: the saved one — the same file the browser saves — or, \
with `--inputs`, a CSV of your own, or with `--defaults` every input at its \
declared value. The first lines of a run say which. `vleo inputs` prints the \
case as a CSV to fill in; a blank value means the default, and a file with any \
row that cannot be applied is refused whole, each bad row named. A file written \
by an older version of the tool — its `#! template` line says so — is carried \
over instead, and `vleo inputs --inputs old.csv` writes it out in the current \
template, with every value it could not carry kept as a `#! set-aside` line. The order is \
fixed: each row's declared value, then the case's, then `--set`.

`--set` only changes a **declared** number — never a computed one, which would \
be overwritten the moment it was evaluated — and it never writes the sheet.

`--save` writes the run as a **result** file where you say; `--keep` keeps it \
in the results folder the browser's Results page shows, once. A question \
already kept there is shown from its saved result instead of run — the first \
line says so — and `--again` runs it anyway. `vleo result` shows a result \
again, from its folder, its CSV or its report, without running anything.

Two of the steps use a **closure**, `l3_solar_ach_01`: the room the sustained \
F10.7 requirement has left once the design flux is taken from it. The launch \
date is one of the declared numbers behind it, and a time is given in seconds."""

[[layer.section.step]]
say = "Run a row and everything it needs."
run = "cargo run -p vleo-cli --bin vleo -- run sw_ap_design"
check = "exits"
expect = "Ap_design = 132"

[[layer.section.step]]
say = "What if the design were built for a weaker storm? Change the declared number it reads."
run = "cargo run -p vleo-cli --bin vleo -- run sw_ap_design --set sw_storm_design_level=2"
check = "exits"
expect = "Ap_design = 80"

[[layer.section.step]]
say = "A computed row cannot be set, and the tool says which declared numbers to set instead."
run = "cargo run -p vleo-cli --bin vleo -- run sw_ap_design --set sw_ap_design=100"
check = "fails"
expect = "is computed from its inputs"

[[layer.section.step]]
say = "Print the case as a CSV — every input, its unit, default and range. Fill in `value` and keep the file anywhere."
run = "cargo run -p vleo-cli --bin vleo -- inputs --defaults"
check = "exits"
expect = "group,id,name,value,unit,default,min,max"

[[layer.section.step]]
say = "Run on a case file. This one designs for a G2 storm and leaves every other input at its default."
run = "cargo run -p vleo-cli --bin vleo -- run sw_ap_design --inputs cases/examples/storm_level_2.csv"
check = "exits"
expect = "Ap_design = 80"

[[layer.section.step]]
say = "A file from an older version of the tool is carried over, not refused: what still applies runs, new inputs take their defaults, and a value that cannot be used is set aside by name."
run = "cargo run -p vleo-cli --bin vleo -- run sw_ap_design --inputs cases/examples/from_an_older_tool.csv"
check = "exits"
expect = "carried over from an older version"

[[layer.section.step]]
say = "Or on the declared defaults, whatever case is saved."
run = "cargo run -p vleo-cli --bin vleo -- run sw_ap_design --defaults"
check = "exits"
expect = "Ap_design = 132"

[[layer.section.step]]
say = "Keep the run as a result file — every value, every input it ran on."
run = "cargo run -p vleo-cli --bin vleo -- run sw_ap_design --inputs cases/examples/storm_level_2.csv --save my-result.csv"
check = "writes"
why = "writes the result file it is given"

[[layer.section.step]]
say = "See a saved result again. Nothing runs: this is what the run returned when it was saved. `--html <file>` writes it as a report to send."
run = "cargo run -p vleo-cli --bin vleo -- result docs/examples/sw_ap_design.result.csv"
check = "exits"
expect = "a saved result"

[[layer.section.step]]
say = "Sweep a declared input across a range. A point that refuses is recorded, never dropped."
run = "cargo run -p vleo-cli --bin vleo -- sweep sw_ap_design --over sw_storm_design_level --from 1 --to 3 --points 3"
check = "exits"
expect = "3 ran, 0 refused"

[[layer.section.step]]
say = "The defaults, the saved case and any case files against one row, side by side."
run = "cargo run -p vleo-cli --bin vleo -- campaign sw_ap_design --inputs cases/examples/storm_level_2.csv"
check = "exits"
expect = "storm_level_2.csv"

[[layer.section.step]]
say = "Run the closure at the declared launch date, 1 January 2027. The answer is the fraction of the requirement still free."
run = "cargo run -p vleo-cli --bin vleo -- run l3_solar_ach_01"
check = "exits"
expect = "M_f107_long = 0.599726"

[[layer.section.step]]
say = "Slip the launch to November 2032 and nothing else. The room falls from about 60 to 38 per cent, and the chain shows the design flux that moved it."
run = "cargo run -p vleo-cli --bin vleo -- run l3_solar_ach_01 --set sys_mission_requirements_mission_epoch=1036800000"
check = "exits"
expect = "M_f107_long = 0.376314"


[[layer.section]]
id = "term-fill"
title = "Check a node — the developer's reading of it"
who = "developer"
kind = "how-to"
answer = "The developer never writes a node. To see where one stands: check its method against its node engineer's cases, gate it, and ask whether a person should look yet. Every step names exactly what is still open."
body = """
A node is written, checked and sealed by its group, in the application, and \
reaches this repository only in `design/` (`docs/GROUP_APPS.md`). Its relation \
is its **method**, run by the interpreter; there is no code to write for it.

What the developer can do is read it: check its method on its cases, run the \
gate on it, and ask whether a person should look yet. Something the code \
cannot yet do comes back as a **request** (W14), and is answered with an \
application release.

**No assistant may supply the relation.** The method comes from its node \
engineer, and a person's name goes against it."""

[[layer.section.step]]
say = "Check the row's method, every line and every unit, and run it on each of its node engineer's cases."
run = "cargo run -p xtask -- method sw_ap_design"
check = "exits"

[[layer.section.step]]
say = "Check it. Every failure names the field and the rule."
run = "cargo run -p xtask -- gate sw_ap_design"
check = "exits"
expect = "0 node check failure(s)"

[[layer.section.step]]
say = "Ask whether a person should look yet. It stops at the first thing a machine could have found."
run = "cargo run -p xtask -- ready sw_ap_design"
check = "exits"


[[layer.section]]
id = "term-derisk"
title = "Record why it changed, and cut a release"
who = "developer"
kind = "how-to"
answer = "Every change to what a node computes appends a version to its node; the narrative is regenerated from all of them; and an application release sets the application's version, never the design's."
body = """
A change that moves what a node computes carries its reason — what we \
believed, what we tested, what we now know, what changed, and what the node \
rests on now. The node engineer writes that record in the application, with \
the change, and the library refuses a change to what a node computes that \
carries none. A risk move names a risk registered on a risk-register row, or \
the record is refused.

The narrative is generated from every node's record: \
`docs/DERISK_NARRATIVE.md` to read and `docs/derisking.csv` for a spreadsheet, \
in the columns of the quarterly de-risking narrative. The pipeline regenerates \
both and fails on a difference.

An application release names its own version. `xtask release <version>` sets \
the workspace version and regenerates; the release pipeline runs \
`release <version> --check` and refuses while the workspace says another. It \
stamps nothing in the design: which release carried a belief is said by the \
design's own release. Why, and the rules, are in `docs/DERISKING.md`."""

[[layer.section.step]]
say = "Regenerate the narrative. On a tree whose narrative is committed, nothing is written."
run = "cargo run -p xtask -- derisk"
check = "exits"
expect = "nothing to write"

[[layer.section.step]]
say = "A saved result says which node versions it rests on — and, if one has moved on since, that a belief it rested on has broken."
run = "cargo run -p vleo-cli --bin vleo -- result docs/examples/sw_ap_design.result.csv"
check = "exits"
expect = "a saved result"

[[layer.section.step]]
say = "Cut a release: the workspace version set, everything regenerated. Then gate, commit and tag."
run = "cargo run -p xtask -- release <version>"
check = "writes"
why = "sets the version in Cargo.toml and Cargo.lock, and regenerates"


[[layer.section]]
id = "term-pipeline"
title = "What a command does, where it stopped, and why a node is what it is"
who = "developer"
kind = "how-to"
answer = "Every xtask command is described in one table: explain prints a command's place in a node's journey, what it reads, writes and checks, how to undo it and where its code is. A command that writes prints numbered steps, says why it stopped and how to retry, leaves a trace, and takes --dry-run. why puts a node's history in one place."
body = """
**One table describes every command** — `xtask/src/pipeline.rs`. `explain` \
prints it for one command, or the whole journey with none; \
`docs/PIPELINE.md` is the same table as a page, regenerated by \
`xtask pipeline`; and a test fails when the table, `help` and the code \
disagree.

**A command that writes runs as numbered steps** — `release` and `ship`. Each step prints \
`n/total · name` as it starts and what it found when it ends. A step that \
stops prints **why**, the state the **files** are in, the exact command to \
**retry**, and the **code**: the file, and the step's name — a string in that \
file, so searching for the printed name finds the line.

**Every such run leaves a trace** in `target/xtask-trace/` — the command line, \
the commit, each step with its time and result. `xtask trace` shows the last \
one, `trace <command>` the last of one command, `trace --list` every one kept \
(the newest 50).

**--dry-run, on any command that writes**, does nothing: it runs the \
command's own check where it has one (`release --check`, `method-wasm --check`, `pipeline --check`), and otherwise \
prints the plan — its steps, what it would write, how to undo it.

**why <node>** answers "how did this node come to be this?": every recorded \
version and who made it, the commits that changed it, how its code came to \
be, and its gate, run now."""

[[layer.section.step]]
say = "The whole journey, and the command at each step."
run = "cargo run -p xtask -- explain"
check = "exits"
expect = "A node's journey"

[[layer.section.step]]
say = "One command: where it sits, what it reads, writes and checks, how to undo it, and where its code is."
run = "cargo run -p xtask -- explain ship"
check = "exits"
expect = "undo"

[[layer.section.step]]
say = "What a command would do, doing nothing."
run = "cargo run -p xtask -- derisk --dry-run"
check = "exits"
expect = "nothing was read or written"

[[layer.section.step]]
say = "A node's history in one place, and its gate now."
run = "cargo run -p xtask -- why sw_ap_design"
check = "exits"
expect = "its gate, run now"

[[layer.section]]
id = "term-contract"
title = "Work on the page without the engine, and change what they share"
who = "developer"
kind = "how-to"
answer = "The page and the engine meet at one contract in contract/: every route, a schema for every answer, the file formats, and answers recorded from the real engine. A frontend developer runs the page on the mock engine with no Rust; a backend developer proves the engine keeps the contract with cargo test. Inside /v1 a change may only add."
body = """
**The contract is `contract/`** — `routes.toml` lists every route and the \
requests the tests make; `schemas/` has one schema per kind of answer; \
`formats/` the CSV files people keep and send; `examples/` answers recorded \
from the real engine. `contract/README.md` is the whole of it.

**The backend keeps it.** The contract tests start the real server and make \
every request: every answer must validate against its schema, and a field \
the schema does not declare is a failure — so the page may read only what \
the contract lists. They run in `cargo test`.

**The frontend builds against it.** `tools/mock_engine.py` serves the page \
from `web/` and every answer from the recorded examples, with no Rust built; \
the page says **MOCK ENGINE** at the top, because every number on it is an \
example. `tools/mock_check.py` walks the page on it in a browser, and the \
pipeline runs that with no Rust toolchain at all.

**Changing it.** Within `/v1`, add only: a new route or field breaks nobody. \
A field goes into the schema first, in a pull request both sides review; \
then either side can use it. Removing or re-meaning one is `/v2`, beside \
`/v1` for a release. When an answer's shape changes, re-record the examples. \
The page carries the contract version it was built for and names an engine \
that speaks another."""

[[layer.section.step]]
say = "The mock engine checks itself: every recorded example reads, and each request finds the answer it should."
run = "python3 tools/mock_engine.py --selftest"
check = "exits"
expect = "selftest: ok"

[[layer.section.step]]
say = "The page on recorded answers, with no Rust — then open the address it prints."
run = "python3 tools/mock_engine.py"
check = "serves"
expect = "http://127.0.0.1:"

[[layer.section.step]]
say = "Re-record the examples from the real engine after an answer's shape changes. A schema is never rewritten: that is the contract, changed by hand."
run = "VLEO_CONTRACT_RECORD=1 cargo test -p vleo-server --test the_contract_holds"
check = "writes"
why = "rewrites contract/examples/ from the real engine, and drafts a schema for a route that has none"

[[layer.section]]
id = "term-lesson"
title = "A lesson's form, and its check"
who = "developer"
kind = "how-to"
answer = "A lesson arrives as a form: the node engineer who knows the row fills its lesson form anywhere, checked as they type by the gate's own check, and sends it back; lesson check checks it again and says every reason it would be refused."
body = """
The node engineer writes the lesson; nobody writes HTML for it and nobody writes a \
formula for the page to compute. `docs/LESSONS.md` is the file, table by \
table, and `docs/examples/orbit_velocity.lesson.toml` a complete example.

**The form** is one HTML file — from `lesson form`, or *write a lesson — its \
form* on the row's page. It carries the method checker the pages carry, which \
holds the lesson check the gate runs, and a table of the tree's rows, so a \
widget naming a row that is not there is refused while the node engineer types. \
**lesson check** says what a filled one holds and every reason it would be \
refused. Nothing here writes it into the design: the design is its group's, \
and a lesson goes in with the group's release. A lesson never changes an \
answer."""

[[layer.section.step]]
say = "A row's lesson form, to send to whoever knows the row."
run = "cargo run -p xtask -- lesson form orbit_velocity --out orbit_velocity.lesson-form.html"
check = "writes"
why = "writes the form beside you"

[[layer.section.step]]
say = "What a filled form — or a bare lesson.toml, with --for — holds, and every reason it would be refused. Writes nothing."
run = "cargo run -p xtask -- lesson check docs/examples/orbit_velocity.lesson.toml --for orbit_velocity"
check = "exits"
expect = "passes the check the gate runs"

[[layer.section.step]]
say = "Every row's page and every lesson as plain pages, for people who read without the tool — the engine runs in the page to answer the widgets."
run = "cargo run -p xtask -- readers"
check = "writes"
why = "writes target/readers"

[[layer.section.step]]
say = "Open that folder as a reader does — from a file, in a browser: the pages load, the engine in the page runs nothing until it opens the design the folder carries, then answers, refuses and sweeps, and a widget moves. With --answers it writes every answer down, and cargo test in crates/vleo-kernel-wasm, given the file in VLEO_BROWSER_ANSWERS, holds each one to the engine built natively."
run = "python3 tools/readers_check.py"
check = "ci"

[[layer.section]]
id = "term-kit"
title = "Share the tool with everyone"
who = "developer"
kind = "how-to"
answer = "Everyone gets the tool, not the repository: one Python package for every laptop, or a kit per platform — the programs beside exactly the files they read, with START_HERE.md on top. They use it and send back node forms; you apply them, release, and share the next version."
body = """
The daemon reads the web face, the tree and every node's page at run time, so \
the programs alone do not run. `xtask kit` puts them beside exactly those files \
— the design as its files, `design/`; no git history, no \
generators, no kernel source — in `dist/vleo-<version>/`, \
with `START_HERE.md` (from `docs/TEAM_GUIDE.md`) and `VERSION` — and `start.sh` \
off Windows; on Windows the daemon ships as `Start VLEO.exe`, which opens the \
browser itself. Zip it and share it. A kit runs on the platform that built it; \
the release pipeline builds one for Linux, macOS and Windows, and one Python \
package, `vleo-<version>-py3-none-any.whl`, that carries the engine for every \
system and runs with `python -m vleo` — no new program for Windows or an \
antivirus to question. Each person's case and results live under `~/.vleo/`, \
outside both, so the next version replaces them without losing either. The \
whole loop is in `docs/SHARING.md`."""

[[layer.section.step]]
say = "Build the two programs the kit carries."
run = "cargo build --release -p vleo-daemon -p vleo-cli"
check = "exits"

[[layer.section.step]]
say = "Assemble the kit in `dist/vleo-<version>/` — then zip that folder and share it."
run = "cargo run -p xtask -- kit"
check = "writes"
why = "writes dist/vleo-<version>/, which git ignores"


[[layer.section]]
id = "term-method"
title = "The method language and the pages' checker"
who = "developer"
kind = "how-to"
answer = "The method language is one module, vleo_sheet::method. The pages that check a method carry it compiled to WebAssembly as web/method.wasm.gz; after changing the language, rebuild that file with method-wasm and commit it with its stamp."
body = """
The gate, the library and every page that checks a method call \
`vleo_sheet::method` — the pages through `web/method.wasm.gz`, which \
`xtask method-wasm` builds from `crates/vleo-method-wasm`. A test refuses a \
checkout whose checker sources have moved on from the committed file, so a page \
can never check by older rules than the gate. A page reads the file from beside \
the tree when it is made; no program carries it built in, because compressed \
WebAssembly inside a program is what Chrome blocked in the first 0.3.0 Windows \
kit, and the release refuses a program that does. `docs/PSEUDOCODE.md` is written \
by `xtask docs` from the same tables the checker reads. Changing what a method \
means is a reviewed change to every node that has one."""

[[layer.section.step]]
say = "Rebuild the checker the pages carry, after changing the language."
run = "cargo run -p xtask -- method-wasm"
check = "writes"
why = "builds crates/vleo-method-wasm for wasm32 and writes web/method.wasm.gz and its stamp"

[[layer.section.step]]
say = "Or only ask whether it is current."
run = "cargo run -p xtask -- method-wasm --check"
check = "exits"
why = "compares the fingerprint of the checker's sources with the one recorded beside web/method.wasm.gz"

[[layer.section]]
id = "term-beyond"
title = "When the method language cannot say it"
who = "developer"
kind = "how-to"
answer = "A node the method language cannot express has no relation until the language can say it. It stays open, refused by name if a run reaches it, and what it needs is a request to the developer."
body = """
The language is closed on purpose: every construct has one meaning, so the \
interpreter needs no judgement. A relation it cannot express is not \
written in code instead: the node stays an open block, refused by name, and \
its node engineer raises a request with the evidence. The developer answers \
it by growing the language — and no assistant supplies the relation, the \
method or a case.

When the language grows a construct, it grows in \
`crates/vleo-sheet/src/method.rs` and the files under `method/` beside it — \
the grammar (`parse.rs`), the checker (`check.rs`) and the interpreter \
(`run.rs`) together, one reviewed change, followed by `method-wasm` so every \
page checks by the new rules."""

[[layer.section]]
id = "term-evidence"
title = "Is the evidence real?"
who = "developer"
kind = "how-to"
answer = "Two commands ask whether the evidence is worth anything: every fixture declaration is sound, and every case the design holds passes on the engine that reads it."
body = """
A test that passes against a broken implementation is not testing anything. Two \
commands ask that question directly."""

[[layer.section.step]]
say = "Check every fixture declaration in the tree is sound — its source is outside the code and its tolerance is positive. It does not execute them; `cargo test` does."
run = "cargo run -p vleo-cli --bin vleo -- selftest"
check = "exits"
expect = "fixture declarations sound"

[[layer.section.step]]
say = "Run every case the design holds on the engine that reads it from design/: each fixture, each node engineer's case, the properties from each row's declared range, and each prior implementation's grid. A disagreement is a physics question for the node's engineer, never a tolerance to widen."
run = "cargo test -p vleo-cli --test every_case_of_the_design_passes"
check = "exits"


[[layer.section]]
id = "term-push"
title = "Before you push, and how to release"
who = "developer"
kind = "how-to"
answer = "Run the pipeline's checks before pushing: the gate and every test first, then formatting, lints, the assembly validations and the panels. A change from a form names who filled it."
body = """
The pipeline runs all of these on every push; running them first saves a round \
trip. The first is the one that must be green.

Commit messages read `type(scope): a sentence saying what changed`. The hook \
installed by `setup` refuses anything else before it leaves your machine, and \
the pipeline runs the same rule. A change that came from a group's release \
names who sealed it. How many reviewers a change needs is in `CONTRIBUTING.md`.

Once merged, the change reaches everyone in the next release: they update, and \
their saved case carries over on its own — see *Set the inputs*."""

[[layer.section.step]]
say = "The checks and every test."
run = "cargo run -p xtask -- gate && cargo test"
check = "ci"

[[layer.section.step]]
say = "Formatting."
run = "cargo fmt --all -- --check"
check = "ci"

[[layer.section.step]]
say = "Lints, with every warning an error."
run = "cargo clippy --workspace --all-targets -- -D warnings"
check = "ci"

[[layer.section.step]]
say = "The assembly validations — the checks that can only be asked with the whole tree in view."
run = "cargo run -p xtask -- assemble"
check = "ci"

[[layer.section.step]]
say = "The panels render and respond, and the ones checked on pixels match their stored pictures, light and dark. A stored picture is only as good as whoever looked at it: `panels/REVIEW.md` says who has signed each, and which are still waiting."
run = "python3 tools/panel_check.py"
check = "ci"

[[layer.section.step]]
say = "The commit types and every valid scope."
run = "python3 tools/commit_message.py --types"
check = "exits"
expect = "scopes:"


[[layer.section]]
id = "term-data"
title = "Reference data"
who = "developer"
kind = "how-to"
answer = "Reference data arrives by an explicit sync as published, hashed sets; a run has verified data on disk or refuses to start."
body = """
The engine never fetches anything while it runs. Reference data arrives by an \
explicit sync beforehand, as published sets with a manifest, a licence term and \
a hash — so a run either has verified data on disk or refuses to start."""

[[layer.section.step]]
say = "What is in your local store, and whether it has gone stale."
run = "cargo run -p vleo-cli --bin vleo -- data list"
check = "exits"
expect = "verified"

[[layer.section.step]]
say = "Re-check every hash in the store."
run = "cargo run -p vleo-cli --bin vleo -- data verify"
check = "exits"

[[layer.section.step]]
say = "Re-check every published set in the repository."
run = "cargo run -p xtask -- bundle verify"
check = "exits"
expect = "0 refused"

[[layer.section.step]]
say = "Publish a new set. **This cannot be undone**, by design — publishing twice from the same input gives the same hash, which is what makes verifying mean anything."
run = "cargo run -p xtask -- bundle publish <dir>"
check = "writes"
why = "writes a new bundle and its manifest under bundles/, permanently"


[[layer.section]]
id = "term-regen"
title = "Regenerate what is generated"
who = "developer"
kind = "how-to"
answer = "Generated files are regenerated from their sources and committed; the pipeline fails if they differ from what the sources give."
body = """
Some files are written by the tool from others and never by hand. The pipeline \
regenerates each one and fails if the result differs from what was committed, \
so after changing what they are made from, regenerate and commit the result."""

[[layer.section.step]]
say = "Every row's generated files, from its sheet."
run = "cargo run -p xtask -- docs"
check = "writes"
why = "rewrites any row's generated files whose sheet has changed"

[[layer.section.step]]
say = "`CODEOWNERS`, from the layer files — who reviews which rows."
run = "cargo run -p xtask -- codeowners"
check = "writes"
why = "rewrites CODEOWNERS"

[[layer.section.step]]
say = "`docs/VARIABLES.md` — every variable, its unit, its range and the reason for each bound."
run = "cargo run -p xtask -- variables"
check = "writes"
why = "rewrites docs/VARIABLES.md"


[[layer.section]]
id = "term-http"
title = "Talk to the running tool from a script"
who = "developer"
kind = "reference"
answer = "Everything the page does is plain HTTP to the daemon, in SI units, and a script can do the same. No route writes the repository."
body = """
Everything the page does, it does over plain HTTP to the daemon, and so can a \
script. Every value crossing that boundary is in SI units; a face converts for \
display, never for transport. The full list of routes is under *Reference*. \
**No route writes the repository**: the only things a request can save are the \
case and results, both kept outside it."""

[[layer.section.step]]
say = "The engine's identity."
run = "curl -s http://127.0.0.1:7777/v1/version"
check = "probe"
expect = "kernel"

[[layer.section.step]]
say = "Run a row; the answer comes back as JSON."
run = "curl -s 'http://127.0.0.1:7777/v1/run?node=sw_ap_design'"
check = "probe"
expect = "sw_ap_design"

[[layer.section.step]]
say = "The results kept on this machine, newest first, and where they are kept."
run = "curl -s http://127.0.0.1:7777/v1/results"
check = "probe"
expect = "results"

[[layer.section.step]]
say = "This manual, as the page receives it."
run = "curl -s http://127.0.0.1:7777/v1/manual"
check = "probe"
expect = "layers"


[[layer.section]]
id = "term-wrong"
title = "When something goes wrong"
who = "everyone"
kind = "reference"
answer = "The usual failures, each with what it means and what to do. Almost every refusal names the field and the rule, and that line is usually the whole answer."
body = """
**The tool will not start: nothing was free.** It tries sixteen ports from 7777 \
upward. Something else is holding them — often an earlier copy of the tool. \
Stop that one, or set `VLEO_PORT` to start somewhere else.

**An uploaded case or result is refused.** Every refused row is named, with \
why. A case is all or nothing, so correct the named rows and upload it again. \
A file from an older release is carried over rather than refused; one the \
tool did not write — no `#! result` line — is not a result at all.

**A group's release is refused on the drive.** Today's design names the \
group, the release and why — an input naming a row that does not exist or one \
of a different quantity, a broken seal, an assistant's method — and builds that \
group's part from its last good release. The fix goes back to the group.

**The checks refuse a row.** Each failure names the field and the rule. Read \
that line before anything else; it is almost always the whole answer.

**A row prints INACTIVE and does not answer.** Its relation is written but \
nobody has derived it: the sheet has no `[theory]` block saying why it is this \
relation. That is a person's work, supplied by the node's engineer, never \
something to work around — and every row that reads it is blocked, by name, \
until it is done. `active` lists each such row and how many rows wait on it.

**A sweep answers no point.** Every point is still recorded, with why: \
*blocked* when a row on its chain does not answer, or the bound and its reason \
when the value is outside the declared range of the row being swept.

**A command warns that the hooks are not wired.** Run `setup` once in this \
checkout.

**The commit hook refuses a message.** It must read \
`type(scope): a sentence`, and `tools/commit_message.py --types` prints every \
type and scope it accepts.

**A number looks wrong.** Run the row in the terminal, read its credibility \
line and which factor governs it, and look at *the chain behind this number* — \
every value that reached it, with each one's own credibility. If the design is \
what is wrong, that goes to the node's engineer."""

[[layer.section.step]]
say = "Start the tool on another port."
run = "VLEO_PORT=8080 cargo run --release -p vleo-daemon"
check = "serves"

[[layer.section.step]]
say = "Every row that is written but does not answer, and how many rows wait on each."
run = "cargo run -p xtask -- active"
check = "exits"
expect = "undefined — the relation is stated and never derived"


# ══════════════════════════════════════════════════════════════════════════════
[[layer]]
id = "codebase"
title = "The codebase"
lede = """
What is in the repository, why each part is there, and what breaks without it."""

[[layer.section]]
id = "code-shape"
title = "The shape of it"
who = "developer"
kind = "explanation"
answer = "One kernel computes every number; everything else is arranged in rings that depend inward only. A row is one file in design/, and nothing in the repository writes it."
body = """
**One kernel computes every number.** Everything else is arranged in rings \
that depend inward only: quantities and portable maths (`vleo-units`), then the \
kernel of physics and relations (`vleo-core`), then transport (`vleo-bus`), \
then the engine that runs the design read from its files (`vleo-modules`), \
then the faces — the browser daemon, the command line, and the Python, \
WebAssembly and C bindings. \
`xtask graph` checks every dependency points inward.

**Every formula lives in `vleo-core::physics` and nowhere else.** A row \
composes relations from there in a few lines; it never defines one of its own.

**The tree is layers of rows.** Layer 1 is the programme's view, layer 2 the \
system's, layer 3 the subsystems', and layer 4 is a run. Each subsystem reaches \
the layer above through exactly one interface row, so *where did this number \
come from* is answered by walking upward without ever leaving the tree.

**One row is one file**, `design/groups/<group>/nodes/<row>.vnode`:

its block, ports and wires — what it asks, reads and returns, and from where.
its test cases — known-good values from outside this code.
its texts — the row's method, its explanations, and the sheet it was converted from.
Nothing in the repository writes it, and no row holds code: its method is run by the interpreter.
The row's page is not in the file: the tool renders it from the sheet when it is opened.

The rules that do not bend, and the developer's loop, are in `AGENTS.md`; the \
reasoning behind the architecture is in `docs/ARCHITECTURE.md`."""

[[layer.section]]
id = "code-folders"
title = "Every top-level folder"
who = "everyone"
kind = "reference"
answer = "Every folder and file at the top of the repository, and what it holds — checked against the repository both ways."
body = """
Every folder and file the repository tracks at its top level is below, with \
what it holds — the list is checked against the repository itself, so nothing \
is missing from it and nothing in it is gone."""

[[layer.section]]
id = "code-docs"
title = "Where to read next"
who = "everyone"
kind = "reference"
answer = "Every document under docs/, and what it is for — checked against the folder both ways."
body = """
Every document under `docs/`, and what it is for. Also checked against the \
folder, both ways."""


