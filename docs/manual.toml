# ══════════════════════════════════════════════════════════════════════════════
# THE THREE GUIDES. Each guide — docs/roles/<id>.html, generated by
# `cargo run -p xtask -- guides` — opens with who it is for, then carries every
# section and command for them and for everyone. The parser refuses a manual
# without all three, or one missing any field. The ids are the files' names and
# stay; what people read is the title and the words (docs/PLAN_1_0.md, phase B).

[[role]]
id = "user"
title = "Engineer"
answer = "You own part of the design — as its programme manager, system engineer, subsystem engineer or node engineer, or a deputy for one — and you use the tool: read the design, set your inputs, run, keep results. A node changes in its own file, written by its node engineer; a group's work reaches the design as its sealed release, on the shared drive, where the tool takes it into today's design when it opens."
simply = "The tool is a shared reference book you can read and calculate with but not write in. Each chapter is written by its owners, in their own copy; the group's editor signs the chapter off and files it, and the book is read from what is filed."
does = [
  "Read the design: the four layers, and each node's page.",
  "Set your inputs, run, save results and send them on.",
  "As a node engineer, give your node's method, your code and your test cases — three answers and one refusal — in the group's application, until its check says Sound.",
  "As a subsystem engineer, seal the group's release and put it in its folder on the shared drive; read what today's design says of it.",
  "Install each new version over the old one; your inputs and results carry over.",
]
never = [
  "Edit files inside the tool — a change there reaches nobody and is lost at the next version.",
  "Seal a release whose checks you have not read.",
  "Give an expected value that came from the tool itself — it has to come from outside it.",
]
wrong = "If I change something in my copy of the tool, everyone gets it."
right = "Your copy changes nobody else's. Inputs you set are yours; the design itself changes only in its owners' files — sealed, put on the drive, checked, and taken into today's design for everyone at once."
breaks = "‘You cannot write in it’ is about the design, not your own work: your inputs, saved case and results are yours to change freely, and stay on your machine. From the switch-over on, the design is written in the application itself, on the shared drive, by each part's owner (docs/OPERATING_1_0.md)."
predict = "Your group's new release is on the drive, and today's design says it was refused and built your part from the last good release. Is your new work in the numbers?"
reveal = "No. A refused release is never taken in part: the numbers are your last good release's, and the tool says so and why. Fix what it names, seal again, and put the new release beside the old one."

[[role]]
id = "maintainer"
title = "Releases"
answer = "Until the switch-over, the developer — or their deputy — moves the tool to everyone: cut a release, build the kits, pack the drive, share. Every step is one command — ship, kit, the drive's pack — and each does its whole step or nothing and says what to do next. No code is written here, and no node: a node comes from its group, sealed."
simply = "This is the print shop. The pages come from the people who own them, filed on the shared drive; the shop prints the book that reads them — a release — and sends it to everyone."
does = [
  "Merge each pull request once every check is green.",
  "Release with ship; publish and share the four files.",
  "Pack the drive from the release, and share it.",
]
never = [
  "Edit a group's release — it comes from the group, sealed, and is never changed after.",
  "Change a tolerance to make a test pass — that is a physics question for the node's engineer.",
  "Skip or silence a failing check; diagnose it as code, with its output.",
]
wrong = "A green pull request is ready to merge."
right = "Green says the change is consistent, not that it is right. A change to the code also needs the reviews CONTRIBUTING sets, by the people it names."
breaks = "‘Every step is a command’ stops where a release needs new code or a check fails for a reason of its own. Those are the developer's work on the code, with the command's output. On the switch-over day this guide retires (docs/PLAN_1_0.md, phase H)."
predict = "Every check on a pull request is green, but the reviewers CONTRIBUTING names have not looked. The change is small. Can you merge?"
reveal = "Not yet. Green is the machine's half; the review is the person's. A small change still needs its reviewers, because size is not what decides whether it is right."

[[role]]
id = "developer"
title = "Developer"
answer = "You write what the routine cannot: a new relation in the kernel, a construct the method language lacks, a diagnosis of a failing check — and you improve the tool itself: its checks, generators, pages and pictures. Everything goes through the gate and a pull request reviewed by the number of people CONTRIBUTING sets."
simply = "If releases are the print shop, you build and repair the presses. You do not decide what is printed — that comes from the people who own the design — but you make sure the presses print it exactly, and you check them against pages you did not print yourself: the fixtures."
does = [
  "Check a node's method on its node engineer's cases with method; for what the method language cannot say, grow the language.",
  "Keep the method language, its checker and its interpreter one reviewed change, and rebuild the pages' checker with method-wasm.",
  "Add a relation to vleo-core::physics when a method needs one — a reviewed change every node reads.",
  "Diagnose a check that fails, with its output.",
  "Improve the tool: its pages and pictures, the routine's commands, the checks, the release pipeline.",
  "Keep this manual true: every command, route and label it names is tested against the tool.",
]
never = [
  "Supply a relation — the physics comes from a node's engineer.",
  "Take an expected value from the code under test.",
  "Edit a generated file by hand.",
  "Put a formula anywhere but vleo-core::physics, or call the standard library's transcendentals in the kernel.",
  "Widen a tolerance to get green.",
]
wrong = "The tests pass, so the node is right."
right = "Tests compare the code with values from outside it — the fixtures. A test whose expected value came from the code only proves the code agrees with itself, which is why the gate refuses one."
breaks = "‘You do not decide what is printed’ stops at the tool itself: its pages, pictures, checks and generators are yours to design — reviewed like any code, by two people where CONTRIBUTING says so."
predict = "A node's test fails after a group's release changed its input range. The fixture's expected value is 0.8% off and the tolerance is 0.5%. What do you change?"
reveal = "Neither the tolerance nor the fixture. A fixture disagreement is a physics question: it goes to the node's engineer, with the number. If the fixture is wrong, its source says so and a person corrects it; if the code is wrong, you fix the code."
