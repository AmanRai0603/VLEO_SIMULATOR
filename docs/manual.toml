[[layer.section]]
id = "browser-nodeform"
title = "Ask for a node to change, or for a new one"
who = "user"
kind = "how-to"
answer = "To change a node, or ask for a new one, download its form, fill it anywhere and send it to the developers. If the change moves what the node computes, the form also says why: which belief broke, what was tested and what we now know."
body = """
Every node has a **form**: one self-contained HTML file that needs no \
connection and nothing installed. It explains itself, asks every question the \
node's sheet answers with *why* each is asked, shows what the node reads and \
feeds and the known-good values that already hold it, lists every row it \
could read, and saves a filled copy of itself. Send it to whoever should say \
what the node is — a payload team, a customer's engineer, a reviewer. It can \
be filled by hand, or given to an assistant: the content is a plain block of \
text near the end of the file.

**For a node the design does not have yet**, download the form for a new node. \
It also asks where the node goes — its parent, and so its layer — and what kind \
of row it is.

**What it reads is its interface.** Every input names a row that exists, and \
the form says, as you type, what that row is and its quantity. A developer's \
first check is exactly this: that every input is a row, of the quantity the \
node expects.

**Why it is changing.** A change to what the node computes — an input, the \
output, the model, the maths, the algorithm, how it is drawn — also says which \
belief broke: what we believed, what we tested, what we now know, what \
changes, and what the node rests on now. The form says as you type which \
decisions your changes move and what is still to answer; without it the \
developers apply only your wording. Wording alone needs none of it.

Send the filled file to the developers. **This page can check it first** — \
what it would change in the node, every interface it declares, and what \
cannot be applied: a field the design changed since the form was made is a \
*conflict*, never overwritten, and a relation an assistant supplied is \
*refused*, because mathematics is derived by a person. Nothing is written \
here. Known-good values in a form are passed to whoever records fixtures; \
they are never written from a form."""

[[layer.section.step]]
say = "Every form in one place: the inputs, results, and each node's form."
ui = "Forms"

[[layer.section.step]]
say = "Or from a node's own page: in *the sheet*, open the form tab."
ui = "the node form — fill it anywhere"

[[layer.section.step]]
say = "Download it and send it to whoever should fill it."
ui = "download the node form"

[[layer.section.step]]
say = "For a node that does not exist yet."
ui = "download the form for a new node"

[[layer.section.step]]
say = "When it comes back, check it: what it would change, every interface, and what it cannot. Nothing is written."
ui = "check a filled form…"


[[layer.section.step]]
say = "A lesson is written the same way: its form, filled anywhere, checked as you type, sent back."
ui = "write a lesson — its form"

[[layer.section]]
id = "browser-method"
title = "Give the method, your code and your test cases"
who = "user"
kind = "how-to"
answer = "In a node's form, write the relation once more as a method — a few lines in a small fixed language — paste the code you wrote and tested, and give at least three cases your code answered and one it refuses. The form runs your method on your cases as you type and shows any that disagree, before you send it."
body = """
A node's relation arrives three ways, and each checks the other two. **Your \
code** — MATLAB, Python, C, anything — produced your test cases. **The method** \
says the same relation in the method language (docs/PSEUDOCODE.md), which the \
tool can check for units and run. **The code the tool ships** is generated from \
the method. All three must give your answers, so a mistake in any one of them \
shows up as a case that disagrees.

**The method.** It reads the node's inputs by their names, gives every number \
its unit in brackets — `250 [km]`, `30 [deg]` — and ends every path with \
`return` (the answer) or `refuse` (why it will not answer). The form checks \
the units as you type: adding a length to a time, taking the logarithm of a \
length, or returning the wrong quantity is shown on the line it happens.

**Your cases.** Each is a set of inputs, in SI, and the answer your code gave \
for them, with how close counts. At least three answers and one case the node \
must refuse — the refusal shows the method says no where your code says no. \
The method's value appears beside yours only after you have typed yours, so \
the tool is never where your answer came from.

**Your code and its test** are pasted whole, with what ran them. They are \
kept with the node so the cases can be produced again and a reviewer can read \
where the numbers came from.

**Flight software** that implements the node can be kept in the same form, \
each file with its test and its last result. It is stored beside the relation, \
not built by the tool.

Every question has **Show the example** beside it: the same question answered \
for one worked node, marked illustrative."""

[[layer.section.step]]
say = "Open the node's form and find *The method*. Read *The method language on one page* if it is your first."

[[layer.section.step]]
say = "Write the method, then fill *Your code*: the code, its language, the function that is this node, and the test code that ran it."

[[layer.section.step]]
say = "Add your test cases — three or more with the answer your code gave, and one it refuses — and watch *Check: the method against your cases* until it says **Sound**."

[[layer.section.step]]
say = "Say in *Why it is changing* what adding the method tested, save a filled copy and send it."

[[layer.section]]
id = "browser-preview"
title = "Try the preview of your change, and approve it"
who = "user"
kind = "how-to"
answer = "After you send a form, you get a preview of the tool with your change in it. Install it, try the nodes it names, and press Approve only when they give what you expect; send back the small file it saves. Nothing reaches everyone else until you do."
body = """
A **preview** is the tool built from your form, before the change is approved. \
It is the same one-file package as a release, and it says so on every view: an \
orange **PREVIEW** banner names your change, the nodes it touches and the build. \
Install it exactly like a release, over the one you have — your inputs and \
results are kept, and the next release replaces the preview.

Open each node the banner names, read its page, run it, move its inputs, and \
check the answers against your own. **If anything is wrong, do not approve** — \
tell the developer what, and you will get a new preview. When it is right, \
press **Approve this preview…**, tick that you ran it, and save the file. Send \
that file back the way you sent the form.

The file is for this build and no other: if anything changes after you approve, \
you are sent a new preview to approve."""

[[layer.section.step]]
say = "Install the preview package you were sent, then start it."
run = "python -m pip install <preview>.whl"
check = "writes"
why = "installs the preview over the tool you have; your case and results are kept"

[[layer.section.step]]
say = "The banner names the nodes your change touches — open each, run it, check it."
ui = "not a release"

[[layer.section.step]]
say = "When every one is right, approve — tick that you ran it — and save the file to send back."
ui = "Approve this preview…"

[[layer.section.step]]
say = "The file it saves is your approval of this exact build."
ui = "Save the approval file"


[[layer.section]]
id = "browser-derisk"
title = "Why a node changes — its beliefs, versions and risks"
who = "user"
kind = "explanation"
answer = "A node changes only because a belief it rested on broke, and every change records what we believed, what we tested, what we now know and what changed. The risk-register rows of the management layer conclude, from every node's record, how that work has moved the programme's risks."
body = """
Every decision in the design rests on a belief — that this relation holds here, \
that this input is the one that matters, that this picture shows what it \
claims. A node changes only when one of those beliefs **breaks**: somebody \
tested it and learned otherwise. So a node's page has a **de-risking** tab. It \
says what the node rests on now and what would break it, then every version \
before it, newest first: what we believed, what we tested, what we now know, \
what it cost, what changed, and which risks that moved.

`sw_central_expectation` — the centre of the F10.7 design value — carries its \
real history as the worked example: three versions, each replaced because a \
test showed its belief did not hold.

**The conclusion is drawn in the management layer.** A risk is registered once, \
on one of the four risk-register rows — technical, schedule, supply, \
regulatory — and moved only by node versions. Each of those rows' pages lists \
its risks, where each started and where it stands now, and every version \
across the tree that moved it. That is how the work below, taken together, \
has de-risked the programme; `docs/DERISK_NARRATIVE.md` is the same thing as a \
document, and `docs/derisking.csv` as a spreadsheet.

**A saved result keeps the versions it rested on.** When one of those rows has \
moved on since, the result says so beside its number.

**How deep a page goes is yours to choose.** The switch at the top — **Learn**, \
**Read**, **Expert** — shows the same pages at three depths: Learn keeps every \
step and asks you to predict before you run; Read shows the answer, the plain \
words and the real thing; Expert keeps the answer, the relation, the limits and \
the reference. How every page is laid out, and why, is in `docs/EXPLAINING.md`."""

[[layer.section.step]]
say = "Choose how deep the pages go. Learn adds a prediction to make before each run."
ui = "Learn"

[[layer.section.step]]
say = "Open a row and its de-risking tab: what it rests on now, and every version before it."

[[layer.section.step]]
say = "Open a risk-register row under the management layer's risk register: its risks, and what the work below has done to them."
ui = "What the work below has done to them"


[[layer.section]]
id = "browser-limits"
title = "What the browser will not do"
who = "everyone"
kind = "reference"
answer = "The browser never changes the design. Each thing it will not do has a place it is done instead, and for anyone using it that place is almost always a node's form."
body = """
The browser never changes the design: not a field, not a row, not the tree. \
That is not to keep anybody out. A change to the design has to be checked \
against every row that reads it, implemented, given evidence, and released so \
that everyone runs the same thing — and a change typed into one copy of the \
tool does none of that. So each one below has a place it is done instead, and \
for anyone using it that place is almost always a form.

The fields a node form does not carry at all — the ones that move a row in the \
tree or change who owns it — are listed live under *Reference*, each with its \
reason."""


# ══════════════════════════════════════════════════════════════════════════════
# ══════════════════════════════════════════════════════════════════════════════
[[layer]]
id = "maintain"
title = "Maintaining the repository"
lede = """
The routine that moves every change from a node form to everyone's copy: take \
the form in, send the node engineer who filled it a preview, record their \
approval, merge, release, \
share. **Every step is one command**, and each does its whole step or nothing \
and says what to do next. Nothing here writes code — what needs code goes to a \
developer, with the output that says why."""

[[layer.section]]
id = "maint-loop"
title = "The loop, and where each change stands"
who = "maintainer"
kind = "explanation"
answer = "Each form lives on its own branch, form/<name>/<node>, and passes through four stages: taken, previewed, approved, merged into the `maintainer` branch. main only ever receives changes whose node engineer tried and approved them, through a pull request from `maintainer`; a release takes everything merged into main since the last one."
body = """
**Taken.** `take` checks the form and, if it can be applied, puts it on its own \
branch from a fresh `maintainer` — applied, regenerated, gated, tested, committed with \
the node engineer's name, pushed. If it cannot, it writes a note to send back and \
changes nothing.

**Previewed.** Every push to a form branch builds a preview by itself: the tool \
with this one change in it, marked PREVIEW on every view. You send it to the \
node engineer who filled the form.

**Approved.** They try it and press Approve; the file it saves names \
the exact build. `approve` records it on the branch — refused if anything has \
changed since that build — and the pull request's approval check turns green.

**Merged, then released.** You merge the pull request into `maintainer` when \
every check is green. When a set of changes is ready, a pull request takes \
`maintainer` into `main`; `ship` cuts a release from main when you choose; the \
release pipeline builds the four files; you publish and share them.

Many forms can be in flight at once, each on its own branch, none waiting for \
another. `queue` says where each one stands."""

[[layer.section.step]]
say = "Where every form branch stands right now."
run = "cargo run -p xtask -- queue"
check = "exits"

[[layer.section]]
id = "maint-take"
title = "Take a node form in"
who = "maintainer"
kind = "how-to"
answer = "Save the form you received into forms/, then run take naming its node engineer. It either puts the change on its own branch — applied, tested, committed, pushed — or writes a note to send back and changes nothing."
body = """
`forms/` at the top of the repository is where received forms and the notes \
sent back live; git ignores it, because the form is its node engineer's and is \
attached to the pull request rather than committed.

`take` refuses to start with uncommitted changes, so nothing of yours is swept \
into a commit that names somebody else. It then works in numbered steps — the \
branch, the form applied, everything regenerated, the gate, the tests, the \
commit and push — and stops at the first that fails, saying which and how to \
abandon the branch. A test that fails is a physics question for the node's \
owner, never a tolerance to change.

**Not taken** means a field conflicts with a change made since the form was \
downloaded, an input is not a row of the right quantity, or a relation came \
from an assistant. The note says which, field by field; send it back, and take \
the corrected form when it returns — with `--again` if its branch exists."""

[[layer.section.step]]
say = "Save the filled form into `forms/`, then take it in, naming the node engineer who filled it as they want to be called."
run = "cargo run -p xtask -- take forms/<file>.node-form.html --for \"<author>\""
check = "writes"
why = "puts the form on its own branch form/<name>/<node>, applies it, regenerates, gates, tests, commits naming the node engineer, and pushes"

[[layer.section.step]]
say = "If it says **the form was not taken**, send the node engineer the `.returned.txt` file it wrote beside the form. Nothing was changed."

[[layer.section.step]]
say = "A corrected form for the same node goes onto the same branch."
run = "cargo run -p xtask -- take forms/<file>.node-form.html --for \"<author>\" --again"
check = "writes"
why = "applies the corrected form onto the branch that already holds the first one"

[[layer.section]]
id = "maint-group"
title = "Take a group's sealed release in"
who = "maintainer"
kind = "how-to"
answer = "A group sends a sealed release instead of forms. Unpack it, read what group-intake says, then apply, build, test and deliver it on the branch group/<group>-<version>. It merges only with the group's acceptance of the test application."
body = """
The release is checked against its seal before anything is read: one byte \
changed and it is refused, and the fix goes back to the group as a note. Each \
computed node then becomes the form its node engineer would have filled, and goes \
through intake's own check.

**Not taken** means a conflict with a change made since, an incomplete \
de-risking record, or a method or results an assistant supplied. A node whose \
declaration says `transcribed` is taken only when it names the source the \
method was copied from and the person who read the copy against it; without \
either, or with an assistant as the checker, it counts as one an assistant \
supplied. A transcription is still reviewed at H1b against its source, by \
someone other than the person who signed it.

`group-test` holds the build to the group's own results. A disagreement is \
physics, for the group — never a result or tolerance moved to pass."""

[[layer.section.step]]
say = "Write the sealed release out as the folder it holds."
run = "node tools/group_db.mjs --unpack <file.vleo> --out target/groups/<group>-<version>"
check = "writes"
why = "writes the release's files and RELEASE.toml, which says who sealed it and the fingerprint every signature was given for"

[[layer.section.step]]
say = "Read what it would change, node by node, and what cannot be taken."
run = "cargo run -p xtask -- group-intake target/groups/<group>-<version>"
check = "writes"
why = "checks the seal, then prints each computed node's plan and what it reaches in other groups; nothing is written without --apply"

[[layer.section.step]]
say = "Apply, build from the methods, test against the group's results, and deliver the test application."
run = "cargo run -p xtask -- group-intake target/groups/<group>-<version> --apply"
check = "writes"
why = "then group-build, group-test and group-deliver on the same folder; the group answers with group-accept"

[[layer.section]]
id = "maint-method"
title = "Check a node's method against its node engineer's cases"
who = "maintainer"
kind = "how-to"
answer = "Run method with the node's id. It checks the method and runs every one of the node engineer's cases through it — the same check the node engineer saw in their form, and the one the gate refuses on."
body = """
`take` prints the same check before it applies a form, under *the method, \
against the node engineer's cases*, and the gate refuses a node whose method does not \
check, whose cases disagree, or that has fewer than three answers and one \
refusal. A case that disagrees is the node engineer's to settle — their code, their \
method or their expected value is wrong — so it goes back to them with the \
line printed, never to a tolerance."""

[[layer.section.step]]
say = "Check one node's method and cases."
run = "cargo run -p xtask -- method orbit_velocity"
check = "exits"
why = "prints each case with what the node engineer's code gave and what the method gives; for a method transcribed from code, what it is held to instead; or says the node has no method yet"

[[layer.section]]
id = "maint-build"
title = "Build a node from its method"
who = "maintainer"
kind = "how-to"
answer = "take does this for you when a form carries a method; build-node does it by hand. Every stage must pass before the next runs, and the node is connected to the rest of the design only at the end."
body = """
**M** the method runs on the node engineer's cases. **G1** the method is \
translated, by fixed rules, into a kernel function in \
`vleo-core::physics::methods` — the node's code calls it and has no holes. \
**T1** the node, guards and all, must reproduce every case; **T2** the \
translation must give the method's own answer to the last bit, around every \
case. **T3** the node engineer's own code is run again where it can be. **T4** the \
answer is moved on purpose and the tests must notice. **I1** only then is the \
node checked in the tree, and the rows that read it are named.

A case that fails is the node engineer's to settle. A translation test that fails is \
a translator defect, for a developer. Neither is ever a tolerance to change."""

[[layer.section.step]]
say = "Rerun every node engineer's code on the cases recorded from it."
run = "cargo run -p xtask -- rerun --all"
check = "exits"
why = "says, per node with cases, whether the node engineer's code still gives them, or why it could not be run here"

[[layer.section]]
id = "maint-migrate"
title = "Move the design over to methods, a batch at a time"
who = "maintainer"
kind = "how-to"
answer = "Run migration to see which rows still need a method and whose they are; with --forms it writes each owner's node forms into one folder. Send them; each comes back through take like any other change."
body = """
Nothing breaks meanwhile. A row without a method keeps its hand-written \
code and its gap list says *no method yet*; a row with one is built from it \
and tested against its owner's cases. A method is mathematics, so it only \
ever comes from the node's owner — never from this command, and never from \
an assistant. A row that answers a set of values keeps its holes: the method \
language answers one quantity."""

[[layer.section.step]]
say = "See what is still to come, by owner."
run = "cargo run -p xtask -- migration"
check = "exits"
why = "counts the computed rows with and without a method, and lists each owner's"

[[layer.section.step]]
say = "Write one owner's forms into a folder, ready to send."
run = "cargo run -p xtask -- migration --owner <owner> --forms forms/out"
check = "writes"
why = "writes that owner's node forms into forms/out/<owner>/"

[[layer.section]]
id = "maint-preview"
title = "Send the node engineer a preview"
who = "maintainer"
kind = "how-to"
answer = "The push from take builds the preview by itself, in about ten minutes. Download it from the newest green preview run, unzip it once, and send the .whl inside to the node engineer."
body = """
The preview is the one-file Python package a release ships, built from this \
branch, with Windows and Linux engines. Its version carries \
`+preview.<author>.<build>`, so it is never taken for a release, and every view \
shows the PREVIEW banner with the Approve button.

**Node engineers on a Mac:** the macOS engines cost ten times the build minutes, so they \
are built only when asked — Actions → preview → Run workflow → the branch → \
*also build the macOS engines*.

**How the file travels is yours to choose.** Whatever channel you use, send \
the `.whl` itself, not a link that needs a GitHub login."""

[[layer.section.step]]
say = "Where this branch's preview is. On main it refuses: previews are built for form branches."
run = "cargo run -p xtask -- preview"
check = "fails"
expect = "not a form branch"

[[layer.section.step]]
say = "Open the newest green **preview** run for the branch, download `vleo-preview-<author>-<build>` at the bottom of the page, unzip it once, and send the `.whl` inside."

[[layer.section]]
id = "maint-approve"
title = "Record the node engineer's approval, and merge"
who = "maintainer"
kind = "how-to"
answer = "Run approve on the file the node engineer sends back. It is recorded only if it is for the build of exactly what is on the branch now; then the pull request can be merged once every check is green."
body = """
**Refused, and why that is right:** the file is for an older build (anything \
pushed since — a fix, main merged in — needs a new preview and a new \
approval); the node engineer did not tick that they ran it; the file is not an \
approval at all. Each refusal says which.

**The pull request.** `take` and `approve` both print its link. Merge only when \
every check is green — among them **the author approved this exact change**, \
which reruns the same check the pipeline's way. Use *Squash and merge*: the \
node engineer's `Form-by:` line and the approval travel with it into `maintainer`, and on into main.

An approval is a record, not a password: it proves which build was approved, \
and you, who received it, vouch for who sent it."""

[[layer.section.step]]
say = "Record the approval the node engineer sent back."
run = "cargo run -p xtask -- approve <file>.toml"
check = "writes"
why = "stores it in approvals/ on the branch, commits naming the node engineer, and pushes"

[[layer.section.step]]
say = "The same check the pull request runs."
run = "cargo run -p xtask -- approve --verify <branch>"
check = "writes"
why = "reads only; shown as not run because it needs a form branch to name"

[[layer.section]]
id = "maint-ship"
title = "Release a version"
who = "maintainer"
kind = "how-to"
answer = "Once maintainer and developer are merged into main, run ship on an up-to-date main. Merge the pull request it opens the way to and tag the merge commit; the release pipeline builds and publishes the four files itself."
body = """
`ship` cuts `release/<version>`: the de-risking narrative regenerated, every \
node version still marked `next` stamped with this release, regeneration, the \
gate, the tests, one commit, pushed. It lists whose forms the release carries.

**The merge is the decision.** The release workflow builds only a commit that \
a merged pull request put on main, and refuses anything else before it builds \
(docs/RELEASE_SETUP.md). After the merge, tag the merge commit (the commands \
`ship` prints). The **release** workflow then builds the three kits and the \
one-file package, installs the package on Windows, macOS and Linux, and \
publishes the release with the four files attached; share the `.whl` with \
everyone.

Choosing the number: the middle number for new behaviour or a change in how \
everyone gets the tool, the last for fixes."""

[[layer.section.step]]
say = "Cut the release from an up-to-date main."
run = "cargo run -p xtask -- ship <version>"
check = "writes"
why = "creates release/<version>, stamps, regenerates, gates, tests, commits and pushes"

[[layer.section.step]]
say = "After its pull request is merged: tag the merged main."
run = "git switch main && git pull origin main && git tag v<version> && git push origin v<version>"
check = "writes"
why = "the tag starts the release workflow, which builds the four files"

[[layer.section]]
id = "maint-interface"
title = "When a form changes what a node reads or feeds"
who = "maintainer"
kind = "how-to"
answer = "take prints every input the form declares and whether it connects. A change to what a node reads or feeds can move other nodes' answers, so find who reads it and send those owners the preview too."
body = """
The interface check at take is the same one intake runs: each input names a row \
that exists, of the quantity the node expects. A form that re-points an input \
or changes a node's output is still one node's change, but its answers travel: \
`reach` shows where each answer goes, and CODEOWNERS names who owns the nodes \
downstream. Send them the same preview; an approval from the node engineer who filled \
the form covers their node, and the downstream nodes' engineers' word covers theirs."""

[[layer.section.step]]
say = "Where each answer goes, and which reach no KPI closure."
run = "cargo run -p xtask -- reach"
check = "exits"

[[layer.section]]
id = "maint-two"
title = "Two forms for the same node"
who = "maintainer"
kind = "how-to"
answer = "Each still gets its own branch. Merge the first when it is approved; then bring maintainer into the second, send its node engineer a new preview, and record their new approval."
body = """
Two node engineers can send forms for one node at once — each is taken onto its own \
branch, and neither waits. After the first merges, the second is behind \
maintainer. Bring maintainer into it (`git switch form/<author>/<node>` then \
`git merge origin/maintainer`); if the same field changed in both, git stops with a conflict — \
that is a question for the two node engineers, never a coin toss, and a developer can \
resolve it once they agree. Anything pushed after an approval needs a new \
preview and a new approval, so the second author approves the combined \
change."""

[[layer.section]]
id = "maint-example"
title = "Worked example: one form, start to finish"
who = "maintainer"
kind = "tutorial"
answer = "Ana sends a form for sw_ap_design. It is taken onto form/ana-sharma/sw-ap-design, previewed, approved, merged and released — five commands and two files exchanged. (Illustrative: the steps and messages are real, the people are not.)"
body = """
**1 · The form arrives.** Ana's filled `sw_ap_design.node-form.html` is saved \
into `forms/`. `take … --for "Ana Sharma"` prints each change it applies, runs \
the gate and the tests, commits *feat(mod-solar): sw_ap_design from a node \
form* with `Form-by: Ana Sharma`, pushes, and prints two links.

**2 · The preview.** Ten minutes later the preview run is green. Its package \
`vleo-preview-ana-sharma-7` holds one `.whl`, sent to Ana.

**3 · Ana tries it.** The banner reads *PREVIEW of Ana Sharma's change to \
sw_ap_design · build 7 · not a release*. She runs the node, checks it against \
the NOAA table she used, presses Approve and sends back \
`vleo-approval-ana-sharma-build7.toml`.

**4 · Recorded.** `approve` on that file prints *approved. Ana Sharma approved \
build 7*. `queue` now shows the branch as *approved — review and merge*. The \
pull request's checks are green, among them *the author approved this exact \
change*; it is squash-merged.

**5 · Released.** When a few forms are merged, `ship 0.3.0` cuts the release, \
its pull request is merged, `v0.3.0` is tagged on the merge commit, and the \
release workflow publishes the four files. Ana installs 0.3.0 over the preview; her inputs and \
results are still there.

**What would have stopped it:** had Ana's form re-pointed an input to a row \
that does not exist, take would have written the note to send back and changed \
nothing; had a fix been pushed after build 7, approve would have refused her \
file and asked for a new preview."""

[[layer.section]]
id = "maint-handover"
title = "What goes to a developer"
who = "maintainer"
kind = "reference"
answer = "Anything that needs code or judgement about the machinery: a form that adds a relation, a check that fails for a reason not in the form, a merge conflict, a change to the tool itself. Hand over the command and its output."
body = """
**A new relation.** A form for a new node, or one that changes its maths, can \
need a function in the kernel and a filled HOLE. take applies the form; \
`declare` and `publish` then say what code is owed — a developer's step.

**A failing check that is not the form's.** The gate or a test fails on the \
form branch for a reason in another node, a generator or the pipeline. The \
output names it; hand it over with the branch.

**A merge conflict** between two forms, once their node engineers agree.

**The tool itself** — its pages and pictures, the commands in this layer, the \
checks, the release pipeline. Those are code, reviewed as code."""


[[layer]]
id = "terminal"
title = "In the terminal"
lede = """
Paste these from the top of the repository. Each command is marked with what it \
does: the ones marked **safe to run** only read, and the pipeline runs every one \
of them exactly as written here and holds it to what this page says it prints. \
The ones marked **changes files** are not run by the pipeline — they would change \
the repository it is checking — but their names and flags are still checked \
against the programs themselves."""

[[layer.section]]
id = "term-setup"
title = "Set up a copy"
who = "developer"
kind = "how-to"
answer = "Install Rust, clone, wire the hooks once and fill the reference-data store once. Then the gate and the tests are the one command that must be green."
body = """
The only thing to install is Rust; the exact version is pinned in \
`rust-toolchain.toml` and fetched on first use. There is no database and no \
service.

`setup` points git at the project's own hooks so the commit-message rule runs \
before a bad message ever leaves your machine. Git will not do this on its own, \
because a hook that ran just because it was cloned would be a way to run \
anybody's code.

Every command here is written out in full. Two shorter forms work too: \
`cargo xtask …` for `cargo run -p xtask -- …`, and `cargo vleo …` for \
`cargo run -p vleo-cli --bin vleo -- …`."""

[[layer.section.step]]
say = "Get the repository."
run = "git clone https://github.com/AmanRai0603/VLEO_SIMULATOR && cd VLEO_SIMULATOR"
check = "writes"
why = "creates a new checkout in the current directory"

[[layer.section.step]]
say = "Wire the hooks, once per checkout."
run = "cargo run -p xtask -- setup"
check = "writes"
why = "sets core.hooksPath in this checkout's git configuration"

[[layer.section.step]]
say = "Fill the local store of reference data, once. It lives in your home directory, outside the checkout, so it never makes the working tree dirty."
run = "cargo run -p vleo-cli --bin vleo -- data sync"
check = "writes"
why = "writes the reference-data store under $HOME/.vleo, or wherever VLEO_DATA points"

[[layer.section.step]]
say = "Prove the copy works. This is the one command that must be green before anything is pushed."
run = "cargo run -p xtask -- gate && cargo test"
check = "ci"

[[layer.section.step]]
say = "The short form works the same way."
run = "cargo xtask status"
check = "exits"
expect = "KPI closures declared"


[[layer.section]]
id = "term-look"
title = "Look around"
who = "user"
kind = "how-to"
answer = "Everything the browser shows, the terminal prints: the rows, a sheet, the case, what answers and what reaches a customer target."
body = """
Everything the browser shows, the terminal can print. `vleo` is the \
command-line face of the engine; `xtask` is the project's own tool for the tree \
— what exists, what answers, what is missing."""

[[layer.section.step]]
say = "The rows of one subsystem, with each one's kind, owner and state."
run = "cargo run -p vleo-cli --bin vleo -- list solar"
check = "exits"
expect = "sw_ap_design"

[[layer.section.step]]
say = "One row's sheet, as the engine holds it — including what it reads."
run = "cargo run -p vleo-cli --bin vleo -- show sw_ap_design"
check = "exits"
expect = "reads"

[[layer.section.step]]
say = "The case, how its inputs divide into customer and condition, and whether a case is saved."
run = "cargo run -p vleo-cli --bin vleo -- cases"
check = "exits"
expect = "108 customer, 20 condition"

[[layer.section.step]]
say = "Counts by state and by subsystem, and what is holding the tree back."
run = "cargo run -p xtask -- status"
check = "exits"
expect = "rows carry no open gap"

[[layer.section.step]]
say = "Which rows of a subsystem answer, and for each that does not, why."
