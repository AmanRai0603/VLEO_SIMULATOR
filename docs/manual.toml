[[layer.section]]
id = "browser-results"
title = "Keep a result, send it, and see it again without running"
who = "user"
kind = "how-to"
answer = "Save a run or a sweep as a result, and see it again later without running anything — or send its report page. A question already answered is not run again: the tool shows the saved answer and says so. A result keeps the node versions it rested on, and says when one of those beliefs has broken since."
body = """
A run is worth keeping when somebody will ask about it later. **Save** it and \
the tool keeps a **folder**: `result.csv` — every value the run returned with \
its unit, its credibility and what governs it, every row it blocked on and why, \
and **every input it ran on** — `sweep.csv` when it is a sweep, and \
`report.html`, the page to send. It is kept in `~/.vleo/results/` or wherever \
`VLEO_RESULTS` points — outside the repository, like the case.

**A question already answered is not run again.** Everything that decides an \
answer — the row, how much of the graph, every input, the engine, the tree and \
the reference data, and for a sweep what it moved and how — is one key. Press \
**run** or **sweep** on a question already kept and the saved answer is shown, \
with a line saying which result it came from and when; **run again anyway** \
runs it fresh. Saving the same question twice keeps it once. With \
`VLEO_RESULTS` on a shared folder, that includes questions a colleague \
answered. A change to the engine's code or to the tree is a different key, so \
an answer from before a correction is never shown for the corrected tool.

The **Results** tab lists every saved result and shows any of them as it was \
— **nothing runs**, so a result saved before a release reads exactly the same \
after it. Two results can be compared value by value, and the inputs that \
differ between them are listed first, because that is usually the answer.

A saved **sweep** is drawn again on the Results page from its saved points, \
with the same chart the run panel uses — hover, zoom and copy the numbers — \
and nothing runs.

To send one, download its **report**: one HTML page that reads without the \
tool, draws the sweep, and carries the CSVs inside it, so uploading the report \
gives the result back whole. The **CSV** opens in any spreadsheet. A result \
somebody sent you is uploaded the same way: its report, or its `result.csv` \
with its `sweep.csv`.

**Results are kept in tiers.** Every value for 30 days — `VLEO_KEEP_DAYS` \
sets how many — and the summary for good: when the tool starts, an older \
result is thinned to the inputs it ran on, its answer and what could not run, \
and says so on its page and in its report. The rest is one run away, because \
the same engine on the same inputs gives the same answer; a thinned result is \
not offered as a kept answer, so asking its question again runs it. **Pin** a \
result to keep every value of it for good. A shared folder named by \
`VLEO_RESULTS` is kept whole unless `VLEO_KEEP_DAYS` is set too.

**A result's inputs can become the case.** That puts every input back to what \
the result ran on — the way to reproduce it, or to carry on from it. It is \
checked like any other case, and refused whole if a release has since retired \
or re-ranged something it sets."""

