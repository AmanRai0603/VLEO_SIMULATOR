# ══════════════════════════════════════════════════════════════════════════════
# THE THREE GUIDES. Each guide — docs/roles/<id>.html, generated by
# `cargo run -p xtask -- guides` — opens with who it is for, then carries every
# section and command for them and for everyone. The parser refuses a manual
# without all three, or one missing any field. The ids are the files' names and
# stay; what people read is the title and the words (docs/PLAN_1_0.md, phase B).

[[role]]
id = "user"
title = "Engineer"
answer = "You own part of the design — as its programme manager, system engineer, subsystem engineer or node engineer, or a deputy for one — and you use the tool: read the design, set your inputs, run, keep results. When a node is wrong or missing, its node engineer fills its node form and sends it; a group's work comes as its sealed release. You get a preview of the change back, try it, and approve it; only then does it reach everyone, in the next release."
simply = "The tool is a shared reference book you can read and calculate with but not write in. To correct a page, you fill in a correction slip — the node form — and hand it in. You are shown the corrected page before it is printed for everyone, and you sign it off."
does = [
  "Read the design: the four layers, and each node's page.",
  "Set your inputs, run, save results and send them on.",
  "Fill a node's form when it is wrong or missing, and send it to the developer.",
  "In the form, give the method, your code and your test cases — three answers and one refusal — until its check says Sound.",
  "Try the preview of your change and press Approve — or say what is still wrong.",
  "Install each new version over the old one; your inputs and results carry over.",
]
never = [
  "Edit files inside the tool — a change there reaches nobody and is lost at the next version.",
  "Approve a preview you have not run.",
  "Put an expected value in a form that came from the tool itself — it has to come from outside it.",
]
wrong = "If I change something in my copy of the tool, everyone gets it."
right = "Your copy changes nobody else's. Inputs you set are yours; the design itself changes only through a node form — checked, previewed, approved by you, and released to everyone at once."
breaks = "‘You cannot write in it’ is about the design, not your own work: your inputs, saved case and results are yours to change freely, and stay on your machine. From the switch-over on, the design is written in the application itself, on the shared drive, by each part's owner (docs/OPERATING_1_0.md)."
predict = "You approved build 7 of your change on Monday. On Tuesday the developer fixes a typo in the same node and pushes. Is your approval still good?"
reveal = "No. Your approval is for build 7 exactly; anything pushed after it makes a new build, and you are sent that preview to approve. It costs you a minute and it means nobody can merge something you did not see."

[[role]]
id = "maintainer"
title = "Intake"
answer = "Until the switch-over, the developer — or their deputy — moves each change to the design through: take a node form in, send the node engineer who filled it a preview, record their approval, merge, release, share. Every step is one command — take, preview, approve, queue, ship — and each does its whole step or nothing and says what to do next. No code is written here."
simply = "This is the post office and the print shop. Forms come in; each goes into its own envelope — a branch. The node engineer who filled it sees a proof — the preview — and signs it — the approval file. When the developer chooses, everything signed is printed for everyone — a release."
does = [
  "Save each form you receive into forms/ and run take on it.",
  "Send back the note take writes when a form cannot be taken.",
  "Send the node engineer their preview; record the approval file they return with approve.",
  "Merge each approved pull request once every check is green.",
  "See what is waiting with queue; release with ship; publish and share the four files.",
  "Send node engineers the forms for rows still without a method, with migration; take them back like any other.",
]
never = [
  "Edit a node's files by hand — the form is the only way in.",
  "Merge a form branch without its node engineer's approval of that exact build.",
  "Change a tolerance to make a test pass — that is a physics question for the node's engineer.",
  "Skip or silence a failing check; diagnose it as code, with its output.",
]
wrong = "A green pull request is ready to merge."
right = "Green says the change is consistent, not that it is right. A form branch also needs the approval of the node engineer who filled it, for the exact build — the check named ‘the author approved this exact change’ says whether it has one."
breaks = "‘Every step is a command’ stops where a form needs new code, where a check fails for a reason not in the form, or where two forms conflict. Those are the developer's work on the code, with the command's output. On the switch-over day this guide retires with the form loop (docs/PLAN_1_0.md, phase H)."
predict = "Every check on a form branch's pull request is green except ‘the author approved this exact change’. The node engineer said on the phone it is fine. Can you merge?"
reveal = "Not yet. Ask them to press Approve in the preview and send the file — then run approve. The check is the record that they tried this exact build; a phone call leaves none."

[[role]]
id = "developer"
title = "Developer"
answer = "You write what the routine cannot: a new relation in the kernel, a filled HOLE, a diagnosis of a failing check — and you improve the tool itself: its checks, generators, pages and pictures. Everything goes through the gate and a pull request reviewed by the number of people CONTRIBUTING sets."
simply = "If intake is the print shop, you build and repair the presses. You do not decide what is printed — that comes from the people who own the design — but you make sure the presses print it exactly, and you check them against pages you did not print yourself: the fixtures."
does = [
  "Build a node from its method with build-node; for what the method language cannot say, fill its HOLEs from kernel relations.",
  "Keep the method language, its checker and its translator one reviewed change, and rebuild the form's checker with method-wasm.",
  "Add a relation to vleo-core::physics when a form needs one — a reviewed change every node reads.",
  "Diagnose a check that fails for a reason outside the form.",
  "Improve the tool: its pages and pictures, the loop's commands, the checks, the release pipeline.",
  "Keep this manual true: every command, route and label it names is tested against the tool.",
]
never = [
  "Supply a relation — the physics comes from a node's engineer, through their form.",
  "Take an expected value from the code under test.",
  "Edit a generated file outside a numbered HOLE.",
  "Put a formula anywhere but vleo-core::physics, or call the standard library's transcendentals in the kernel.",
  "Widen a tolerance to get green.",
]
wrong = "The tests pass, so the node is right."
right = "Tests compare the code with values from outside it — the fixtures. A test whose expected value came from the code only proves the code agrees with itself, which is why the gate refuses one."
breaks = "‘You do not decide what is printed’ stops at the tool itself: its pages, pictures, checks and generators are yours to design — reviewed like any code, by two people where CONTRIBUTING says so."
predict = "A node's test fails after a form changed its input range. The fixture's expected value is 0.8% off and the tolerance is 0.5%. What do you change?"
reveal = "Neither the tolerance nor the fixture. A fixture disagreement is a physics question: it goes to the node's engineer, with the number. If the fixture is wrong, its source says so and a person corrects it; if the code is wrong, you fix the code."
