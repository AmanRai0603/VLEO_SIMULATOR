[[layer]]
id = "maintain"
title = "Maintaining the repository"
lede = """
The routine that moves the tool to everyone's copy: build a node from its \
method, cut a release, build the kits, pack the drive, share. **Every step is \
one command**, and each does its whole step or nothing and says what to do next. Nothing here writes code — \
what needs code goes to a developer, with the output that says why."""


[[layer.section]]
id = "maint-method"
title = "Check a node's method against its node engineer's cases"
who = "maintainer"
kind = "how-to"
answer = "Run method with the node's id. It checks the method and runs every one of the node engineer's cases through it — the same check the node engineer saw in the group's application, and the one the gate refuses on."
body = """
The gate refuses a node whose method does not check, whose cases disagree, or that has fewer than three answers and one \
refusal. A case that disagrees is the node engineer's to settle — their code, their \
method or their expected value is wrong — so it goes back to them with the \
line printed, never to a tolerance."""

[[layer.section.step]]
say = "Check one node's method and cases."
run = "cargo run -p xtask -- method orbit_velocity"
check = "exits"
why = "prints each case with what the node engineer's code gave and what the method gives; for a method transcribed from code, what it is held to instead; or says the node has no method yet"

[[layer.section]]
id = "maint-build"
title = "Check a node against its cases"
who = "maintainer"
kind = "how-to"
answer = "A node is built from its method in its group's application, and arrives in the group's sealed release. Here, method checks one node's method on its node engineer's cases, and rerun runs the node engineer's own code on them again."
body = """
Nothing here writes a node. Its group writes it, checks it and seals it in \
the application (`docs/GROUP_APPS.md`); what the repository holds is \
`design/`, the design as its files, and every case it holds must pass on the \
engine that reads it — each fixture, each node engineer's case, the \
properties from each declared range and each prior implementation's grid.

A case that fails is the node engineer's to settle. It is never a tolerance to \
change."""

[[layer.section.step]]
say = "Rerun every node engineer's code on the cases recorded from it."
run = "cargo run -p xtask -- rerun --all"
check = "exits"
why = "says, per node with cases, whether the node engineer's code still gives them, or why it could not be run here"


[[layer.section]]
id = "maint-ship"
title = "Release a version"
who = "maintainer"
kind = "how-to"
answer = "Once maintainer and developer are merged into main, run ship on an up-to-date main. Merge the pull request it opens the way to and tag the merge commit; the release pipeline builds and publishes the four files itself."
body = """
`ship` cuts `release/<version>`: the de-risking narrative regenerated, every \
node version still marked `next` stamped with this release, regeneration, the \
gate, the tests, one commit, pushed.

**The merge is the decision.** The release workflow builds only a commit that \
a merged pull request put on main, and refuses anything else before it builds \
(docs/RELEASE_SETUP.md). After the merge, tag the merge commit (the commands \
`ship` prints). The **release** workflow then builds the three kits and the \
one-file package, installs the package on Windows, macOS and Linux, and \
publishes the release with the four files attached; share the `.whl` with \
everyone.

Choosing the number: the middle number for new behaviour or a change in how \
everyone gets the tool, the last for fixes."""

[[layer.section.step]]
say = "Cut the release from an up-to-date main."
run = "cargo run -p xtask -- ship <version>"
check = "writes"
why = "creates release/<version>, stamps, regenerates, gates, tests, commits and pushes"

[[layer.section.step]]
say = "After its pull request is merged: tag the merged main."
run = "git switch main && git pull origin main && git tag v<version> && git push origin v<version>"
check = "writes"
why = "the tag starts the release workflow, which builds the four files"


[[layer.section]]
id = "maint-handover"
title = "What goes to a developer"
who = "maintainer"
kind = "reference"
answer = "Anything that needs code or judgement about the machinery: a method that needs a relation the kernel does not have, a check that fails for a reason of its own, a merge conflict, a change to the tool itself. Hand over the command and its output."
body = """
**A new relation.** A node whose method calls on maths the kernel does not \
have needs a function in `vleo-core::physics` first — a developer's step, and \
a reviewed change every node reads.

**A failing check.** The gate or a test fails for a reason in a node, a \
generator or the pipeline. The output names it; hand it over with the branch.

**A merge conflict** in the code.

**The tool itself** — its pages and pictures, the commands in this layer, the \
checks, the release pipeline. Those are code, reviewed as code."""


[[layer]]
id = "terminal"
title = "In the terminal"
lede = """
Paste these from the top of the repository. Each command is marked with what it \
does: the ones marked **safe to run** only read, and the pipeline runs every one \
of them exactly as written here and holds it to what this page says it prints. \
The ones marked **changes files** are not run by the pipeline — they would change \
the repository it is checking — but their names and flags are still checked \
against the programs themselves."""

[[layer.section]]
id = "term-setup"
title = "Set up a copy"
who = "developer"
kind = "how-to"
answer = "Install Rust, clone, wire the hooks once and fill the reference-data store once. Then the gate and the tests are the one command that must be green."
body = """
The only thing to install is Rust; the exact version is pinned in \
`rust-toolchain.toml` and fetched on first use. There is no database and no \
service.

`setup` points git at the project's own hooks so the commit-message rule runs \
before a bad message ever leaves your machine. Git will not do this on its own, \
because a hook that ran just because it was cloned would be a way to run \
anybody's code.

Every command here is written out in full. Two shorter forms work too: \
`cargo xtask …` for `cargo run -p xtask -- …`, and `cargo vleo …` for \
`cargo run -p vleo-cli --bin vleo -- …`."""

[[layer.section.step]]
say = "Get the repository."
run = "git clone https://github.com/AmanRai0603/VLEO_SIMULATOR && cd VLEO_SIMULATOR"
check = "writes"
why = "creates a new checkout in the current directory"

[[layer.section.step]]
say = "Wire the hooks, once per checkout."
run = "cargo run -p xtask -- setup"
check = "writes"
why = "sets core.hooksPath in this checkout's git configuration"

[[layer.section.step]]
say = "Fill the local store of reference data, once. It lives in your home directory, outside the checkout, so it never makes the working tree dirty."
run = "cargo run -p vleo-cli --bin vleo -- data sync"
check = "writes"
why = "writes the reference-data store under $HOME/.vleo, or wherever VLEO_DATA points"

[[layer.section.step]]
say = "Prove the copy works. This is the one command that must be green before anything is pushed."
run = "cargo run -p xtask -- gate && cargo test"
check = "ci"

[[layer.section.step]]
say = "The short form works the same way."
run = "cargo xtask status"
check = "exits"
expect = "KPI closures declared"


