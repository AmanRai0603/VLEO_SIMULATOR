# The manual the tool shows about itself — the Manual tab in the browser.
#
# This file is prose, and prose drifts, so it is not trusted: it is checked.
#
#   cargo test -p xtask --test the_manual_is_true
#       every command, route, variable, label, folder and document named here
#       is held against the thing it names — and every one that exists is held
#       against this file, so adding a command without documenting it fails as
#       surely as documenting one that was removed.
#
#   python3 tools/manual_check.py
#       runs every command below exactly as written and holds it to the exit
#       code and the output this file says it gives.
#
# So a step that shows a command must say what running it proves:
#
#   check = "exits"   run it; it exits 0 and prints `expect`, if given
#   check = "fails"   run it; it must REFUSE — the step is showing a refusal
#   check = "serves"  start it; it must come up and answer
#   check = "writes"  it changes files, so it is not run; `why` says what
#   check = "ci"      the pipeline runs this exact command; found in gate.yml
#   check = "probe"   a request to the daemon `serves` started
#
# No counts are written here. How many rows there are, how many answer, where
# this copy keeps the case and whether one is saved — the page asks the running
# tool, because a number copied into a manual is wrong the day after it is
# copied. USING_IT proved it: it said 1329 rows until 26 September 2026, long
# after the tree reached 1396.
#
# Every section says what kind of reading it is (`kind`: tutorial, how-to,
# reference or explanation) and opens with its `answer` — docs/EXPLAINING.md,
# E1 and E8. The parser refuses a section without either.
#
# Markup in `body` and `say`: blank line = new paragraph, `code`, **bold**.


# ══════════════════════════════════════════════════════════════════════════════
[[layer]]
id = "browser"
title = "In the browser"
lede = """
Everything anyone using the tool does: read the design, set the inputs, run, \
keep what a run returned, and ask for a node to change. **Nothing in the \
browser changes the design.** What you set and what you keep are yours and \
stay on your machine; what the design *is* changes only through a node's form, \
which the developers check, apply and release."""

[[layer.section]]
id = "browser-open"
title = "Open the tool"
who = "everyone"
kind = "how-to"
answer = "Start the tool with one command and open the address it prints. It never writes the repository: what you keep — the case and your results — stays on your machine under ~/.vleo."
body = """
The tool is one program on your own machine. It serves this page and computes \
every number on it, from one address, with no internet and no database. It \
listens on `127.0.0.1` only, so nobody else on the network can reach it.

**It never writes the repository.** The two things you can keep — the case you \
run on and the results you save — are kept outside it, under `~/.vleo/`, so a \
checkout stays exactly as it was released and `git status` is empty however \
much you use the tool. The status card at the top of this manual says where \
this copy keeps them."""

[[layer.section.step]]
say = "Start it. It prints the address it got — the first free port from 7777 upward."
run = "cargo run --release -p vleo-daemon"
check = "serves"

[[layer.section.step]]
say = "Open the address it printed, normally `http://127.0.0.1:7777`."

[[layer.section.step]]
say = "In a Codespace there is nothing to type: the tool is already running and port 7777 opens as a preview."

[[layer.section.step]]
say = "Without a repository, the tool comes two ways. The one file for every laptop: `python -m pip install vleo-<version>-py3-none-any.whl` once, then `python -m vleo` — it runs inside Python, so Windows has no new program to stop. Or a kit, the zip for your system: double-click `Start VLEO.exe` on Windows, or run `./start.sh` on macOS and Linux. Either opens the page itself; `START_HERE.md` says the rest."


[[layer.section]]
id = "browser-roles"
title = "Who does what"
who = "everyone"
kind = "explanation"
answer = "Five roles, and one loop until the switch-over. The programme manager, the system engineer, each subsystem engineer and each node engineer own the design and use the tool; when a node is wrong or missing, its node engineer fills its form, tries the preview of the change and approves it. The developer takes each form in, sends the preview, records the approval and releases — and writes what that routine cannot: code, checks, the tool itself. Each role has a deputy who may act for it."
body = """
The line between the roles is the line between *owning and using* the design, \
*moving a change through*, and *building the machinery*. The design's own roles \
follow the tree: the **programme manager** owns the management side, the \
**system engineer** the whole spacecraft and the one release everyone works \
from, each **subsystem engineer** their group's branch, and each **node \
engineer** their nodes (`docs/OPERATING_1_0.md`, section 2).

**Everyone uses it.** Anyone can set the inputs — by hand or as a CSV — run any \
row on them, save what the run returned and send it on, and look at a result \
somebody else saved without running anything. When a node is wrong, missing or \
unfinished, its node engineer — the person who knows the answer — fills in \
**that node's form** and \
sends it. They get a **preview** of their change back, try it, and press \
**Approve** — or say what is still wrong.

**The developer moves each change through, until the switch-over.** A form that \
arrives is taken in onto its own branch — checked, applied, tested — and the \
node engineer who filled it is sent the preview. Their approval comes back as a \
file, and is recorded against exactly the build they tried. Approved changes \
are merged, and released to everyone when the developer chooses. Every step is \
one command. From the switch-over on there are no forms: each owner signs their \
own files in the application, and the developer maintains only the code.

**The developer builds the machinery.** A form that adds a relation needs code in \
the kernel; a check that fails for a reason not in the form needs a diagnosis; \
the tool's pages, pictures, checks and generators are designed and improved. \
All of it through the gate and a reviewed pull request.

There are three guides — for the engineers, `docs/roles/user.html`; for intake \
until the switch-over, `maintainer.html`; and for the developer, \
`developer.html` — generated from this manual, so the three can never \
disagree with it."""


