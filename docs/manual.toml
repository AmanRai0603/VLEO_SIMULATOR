[[layer.section]]
id = "term-http"
title = "Talk to the running tool from a script"
who = "developer"
body = """
Everything the page does, it does over plain HTTP to the daemon, and so can a \
script. Every value crossing that boundary is in SI units; a face converts for \
display, never for transport. The full list of routes is under *Reference*. \
The ones that change a sheet are refused unless the daemon was started with \
writing allowed."""

[[layer.section.step]]
say = "The engine's identity."
run = "curl -s http://127.0.0.1:7777/v1/version"
check = "probe"
expect = "kernel"

[[layer.section.step]]
say = "Run a row; the answer comes back as JSON."
run = "curl -s 'http://127.0.0.1:7777/v1/run?node=sw_ap_design'"
check = "probe"
expect = "sw_ap_design"

[[layer.section.step]]
say = "The form for one row: every question, its shape and whether it is still open."
run = "curl -s http://127.0.0.1:7777/v1/declare/sw_ap_design"
check = "probe"
expect = "fields"

[[layer.section.step]]
say = "This manual, as the page receives it."
run = "curl -s http://127.0.0.1:7777/v1/manual"
check = "probe"
expect = "layers"


[[layer.section]]
id = "term-wrong"
title = "When something goes wrong"
who = "everyone"
body = """
**The tool will not start: nothing was free.** It tries sixteen ports from 7777 \
upward. Something else is holding them — often an earlier copy of the tool. \
Stop that one, or set `VLEO_PORT` to start somewhere else.

**A save says the daemon is read-only.** It was started without writing \
allowed. Stop it and start it with `VLEO_ALLOW_WRITE=1`.

**A save says the name is an agent's.** This checkout's `git config user.name` \
is an agent. Set your own name and reload.

**A save says somebody else changed the row.** Nothing was written. Reopen the \
row and make your change again on top of theirs.

**The checks refuse a row.** Each failure names the field and the rule. Read \
that line before anything else; it is almost always the whole answer.

**A row prints INACTIVE and does not answer.** Its relation is written but \
nobody has derived it: the sheet has no `[theory]` block saying why it is this \
relation. That is a person's work on the sheet, never something to work around \
— and every row that reads it is blocked, by name, until it is done. \
`active` lists each such row and how many rows wait on it.

**A sweep answers no point.** Every point is still recorded, with why: \
*blocked* when a row on its chain does not answer, or the bound and its reason \
when the value is outside the declared range of the row being swept.

**A command warns that the hooks are not wired.** Run `setup` once in this \
checkout.

**The commit hook refuses a message.** It must read \
`type(scope): a sentence`, and `tools/commit_message.py --types` prints every \
type and scope it accepts.

**A number looks wrong.** Run the row in the terminal, read its credibility \
line and which factor governs it, and look at *the chain behind this number* — \
every value that reached it, with each one's own credibility."""

[[layer.section.step]]
say = "Start the tool on another port."
run = "VLEO_PORT=8080 cargo run --release -p vleo-daemon"
check = "serves"

[[layer.section.step]]
say = "Every row that is written but does not answer, and how many rows wait on each."
run = "cargo run -p xtask -- active"
check = "exits"
expect = "undefined — the relation is stated and never derived"


