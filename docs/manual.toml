[[layer.section]]
id = "term-run"
title = "Run, change an input, sweep, compare cases"
who = "user"
body = """
The examples use the storm row `sw_ap_design`: *what daily Ap is this design \
built to survive?* It reads one declared number, the storm level designed for, \
and turns it into the Ap that level bounds.

A run prints the answer, its **credibility** — the weakest of eight factors, \
named — and **n ran, m blocked** with every blocked row named. The **chain** \
hash identifies that exact number: the engine, the tree and every input that \
reached it. Two runs with the same chain are the same run, so it is \
the thing to quote.

A run is on the **case**: the saved one — the same file the browser saves — or, \
with `--inputs`, a CSV of your own, or with `--defaults` every input at its \
declared value. The first lines of a run say which. `vleo inputs` prints the \
case as a CSV to fill in; a blank value means the default, and a file with any \
row that cannot be applied is refused whole, each bad row named. A file written \
by an older version of the tool — its `#! template` line says so — is carried \
over instead, and `vleo inputs --inputs old.csv` writes it out in the current \
template, with every value it could not carry kept as a `#! set-aside` line. The order is \
fixed: each row's declared value, then the case's, then `--set`.

`--set` only changes a **declared** number — never a computed one, which would \
be overwritten the moment it was evaluated — and it never writes the sheet.

The last two steps use a **closure**, `l3_solar_ach_01`: the room the sustained \
F10.7 requirement has left once the design flux is taken from it. The launch \
date is one of the declared numbers behind it, and a time is given in seconds."""

[[layer.section.step]]
say = "Run a row and everything it needs."
run = "cargo run -p vleo-cli --bin vleo -- run sw_ap_design"
check = "exits"
expect = "Ap_design = 132"

[[layer.section.step]]
say = "What if the design were built for a weaker storm? Change the declared number it reads."
run = "cargo run -p vleo-cli --bin vleo -- run sw_ap_design --set sw_storm_design_level=2"
check = "exits"
expect = "Ap_design = 80"

[[layer.section.step]]
say = "A computed row cannot be set, and the tool says which declared numbers to set instead."
run = "cargo run -p vleo-cli --bin vleo -- run sw_ap_design --set sw_ap_design=100"
check = "fails"
expect = "is computed from its inputs"

[[layer.section.step]]
say = "Print the case as a CSV — every input, its unit, default and range. Fill in `value` and keep the file anywhere."
run = "cargo run -p vleo-cli --bin vleo -- inputs --defaults"
check = "exits"
expect = "group,id,name,value,unit,default,min,max"

[[layer.section.step]]
say = "Run on a case file. This one designs for a G2 storm and leaves every other input at its default."
run = "cargo run -p vleo-cli --bin vleo -- run sw_ap_design --inputs cases/examples/storm_level_2.csv"
check = "exits"
expect = "Ap_design = 80"

[[layer.section.step]]
say = "A file from an older version of the tool is carried over, not refused: what still applies runs, new inputs take their defaults, and a value that cannot be used is set aside by name."
run = "cargo run -p vleo-cli --bin vleo -- run sw_ap_design --inputs cases/examples/from_an_older_tool.csv"
check = "exits"
expect = "carried over from an older version"

[[layer.section.step]]
say = "Or on the declared defaults, whatever case is saved."
run = "cargo run -p vleo-cli --bin vleo -- run sw_ap_design --defaults"
check = "exits"
expect = "Ap_design = 132"

[[layer.section.step]]
say = "Sweep a declared input across a range. A point that refuses is recorded, never dropped."
run = "cargo run -p vleo-cli --bin vleo -- sweep sw_ap_design --over sw_storm_design_level --from 1 --to 3 --points 3"
check = "exits"
expect = "3 ran, 0 refused"

[[layer.section.step]]
say = "The defaults, the saved case and any case files against one row, side by side."
run = "cargo run -p vleo-cli --bin vleo -- campaign sw_ap_design --inputs cases/examples/storm_level_2.csv"
check = "exits"
expect = "storm_level_2.csv"

[[layer.section.step]]
say = "Run the closure at the declared launch date, 1 January 2027. The answer is the fraction of the requirement still free."
run = "cargo run -p vleo-cli --bin vleo -- run l3_solar_ach_01"
check = "exits"
expect = "M_f107_long = 0.599726"

[[layer.section.step]]
say = "Slip the launch to November 2032 and nothing else. The room falls from about 60 to 38 per cent, and the chain shows the design flux that moved it."
run = "cargo run -p vleo-cli --bin vleo -- run l3_solar_ach_01 --set sys_mission_requirements_mission_epoch=1036800000"
check = "exits"
expect = "M_f107_long = 0.376314"


[[layer.section]]
id = "term-fill"
title = "Fill a row — the loop you will live in"
who = "developer"
body = """
A row is a folder, and **only `node.toml` in it is written by hand**. Every \
other file is generated from it; an edit anywhere else is thrown away the next \
time the row is regenerated, and the checks catch it before then.

The loop: start a row from a sibling, answer its questions, generate, check, \
write the few lines of Rust in each numbered slot, give it evidence from \
outside this code, and ask whether a person should look yet. Every step names \
exactly what is still open, so there is never a guess about what is next.

The form in the browser writes the same `node.toml` through the same checks — \
use whichever you prefer for the words and numbers. The Rust in the slots and \
the evidence are done here."""

[[layer.section.step]]
say = "Start a new row from a sibling. It copies the shape and blanks everything that has to be decided again — a real copy would drag a stale citation along."
run = "cargo run -p xtask -- new <new_row_id> --like <sibling_row_id>"
check = "writes"
why = "creates a new row folder and its sheet"

[[layer.section.step]]
say = "Ask what is still open, and what goes wrong without each answer."
run = "cargo run -p xtask -- declare sw_ap_design"
check = "exits"
expect = "ready to generate"

[[layer.section.step]]
say = "Edit `node.toml` in your editor — or in the browser's form. It is the only hand-written file in the folder."

[[layer.section.step]]
say = "Generate the row's other files from its sheet. On a row that is already up to date, nothing is written."
run = "cargo run -p xtask -- docs sw_ap_design"
check = "exits"
expect = "0 artefact(s) written"

[[layer.section.step]]
say = "Check it. Every failure names the field and the rule."
run = "cargo run -p xtask -- gate sw_ap_design"
check = "exits"
expect = "0 node check failure(s)"

[[layer.section.step]]
say = "Write the Rust for one numbered slot. It goes in as text, never by opening the generated file; the tool refuses a body that would reach outside its slot."
run = "cargo run -p xtask -- fill <row> --hole <n> --body -"
check = "writes"
why = "splices a body into the row's generated model.rs"

[[layer.section.step]]
say = "Add evidence to `fixtures.toml`: values from a paper, a measurement or a trusted tool. An expected value may never come from the code under test, and the checks refuse one marked as if it did."

[[layer.section.step]]
say = "Ask whether a person should look yet. It stops at the first thing a machine could have found."
run = "cargo run -p xtask -- ready sw_ap_design"
check = "exits"

[[layer.section.step]]
say = "List the relations nobody has put their name against yet, grouped by who owns them."
run = "cargo run -p xtask -- confirm --list solar"
check = "exits"

[[layer.section.step]]
say = "Put your name against one relation, after reading it against its source. There is deliberately no way to do many at once."
run = "cargo run -p xtask -- confirm <row> --by \"Your Name\""
check = "writes"
why = "writes your name and today's date against the relation on the row's sheet"


[[layer.section]]
id = "term-nodeform"
title = "Apply a node's form"
who = "developer"
body = """
A node's form is how a change to a node arrives from someone without a \
checkout. `xtask form <node>` writes one, the same file the node's page \
offers. When a filled one comes back, `xtask intake` says field by field what \
it would change in `node.toml`, against three versions: the node when the form \
was made, what the filler made of it, and the node now — so a change made in \
the repository meanwhile is a **conflict**, not overwritten. A relation an \
assistant supplied is **refused**. A numbered step removed from the middle is \
refused, because each number is a hole holding somebody's Rust.

`--apply` writes the rest as one edit — regenerate the node, gate it, and put \
everything back if the gate refuses — with your name on any relation it \
changes. It refuses while anything is blocked unless you add `--partial`. \
Then review with `git diff`, commit naming whoever filled the form, and push. \
Known values in the form are printed as `[[fixture]]` blocks for the person \
who records fixtures; they are never written by intake."""

[[layer.section.step]]
say = "A node's form, to send out. With `--out <file>` it is written to a file."
run = "cargo run -p xtask -- form sw_ap_design"
check = "exits"
expect = "vleo-node-form/1"

[[layer.section.step]]
say = "What a filled form would change — this one, filled in a browser, changes the note, adds an assumption and supplies a known value."
run = "cargo run -p xtask -- intake docs/examples/sw_ap_design.node-form.html"
check = "exits"
expect = "can be applied"

[[layer.section.step]]
say = "Apply it: written, regenerated and gated as one edit, or not at all. Then `git diff`, commit and push."
run = "cargo run -p xtask -- intake docs/examples/sw_ap_design.node-form.html --apply"
check = "writes"
why = "it writes the node's sheet and regenerates its generated files, which is a change to the repository to review and commit"


[[layer.section]]
id = "term-evidence"
title = "Is the evidence real?"
who = "developer"
body = """
A test that passes against a broken implementation is not testing anything. Two \
commands ask that question directly."""

[[layer.section.step]]
say = "Run one subsystem's tests, including every row's fixtures."
run = "cargo test -p vleo-mod-solar"
check = "exits"

[[layer.section.step]]
say = "Check every fixture declaration in the tree is sound — its source is outside the code and its tolerance is positive. It does not execute them; `cargo test` does."
run = "cargo run -p vleo-cli --bin vleo -- selftest"
check = "exits"
expect = "fixture declarations sound"

[[layer.section.step]]
say = "Perturb a row's answer slightly and require its own tests to notice. The row is put back afterwards."
run = "cargo run -p xtask -- mutate sw_ap_design"
check = "exits"
expect = "mutant(s) killed"


[[layer.section]]
id = "term-push"
title = "Before you push, and how to commit"
who = "developer"
body = """
The pipeline runs all of these on every push; running them first saves a round \
trip. The first is the one that must be green.

Commit messages read `type(scope): a sentence saying what changed`. The hook \
installed by `setup` refuses anything else before it leaves your machine, and \
the pipeline runs the same rule. How many reviewers a change needs is in \
`CONTRIBUTING.md`."""

[[layer.section.step]]
say = "The checks and every test."
run = "cargo run -p xtask -- gate && cargo test"
check = "ci"

[[layer.section.step]]
say = "Formatting."
