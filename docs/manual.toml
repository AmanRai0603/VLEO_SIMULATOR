# ══════════════════════════════════════════════════════════════════════════════
# The daemon's routes. Checked against its router, both ways.

[[route]]
method = "GET"
path = "/"
what = "This page."

[[route]]
method = "GET"
path = "/app.css"
what = "The page's stylesheet."

[[route]]
method = "GET"
path = "/js/<module>"
what = "The page's modules, one per concern, served as they are written — no build step between the source and what runs."

[[route]]
method = "GET"
path = "/v1/version"
what = "The engine's identity: kernel, graph, row count and data versions."

[[route]]
method = "GET"
path = "/v1/index"
what = "Every row and group, with what the tree needs to draw itself."

[[route]]
method = "GET"
path = "/v1/fragment/<id>"
what = "A row's generated page."

[[route]]
method = "GET"
path = "/v1/node/<id>"
what = "A row, as the engine holds it."

[[route]]
method = "GET"
path = "/v1/declare/<id>"
what = "The form for one row: every question, its shape, its current answer and whether it blocks generation."

[[route]]
method = "GET"
path = "/v1/manual"
what = "This manual, with what is true of the running tool right now."

[[route]]
method = "POST"
path = "/v1/sheet/<id>"
what = "Save one field. `field`, `value`, and `base` — the version the form started from."
writes = true

[[route]]
method = "POST"
path = "/v1/block/<id>"
what = "Add, change or remove one entry of a list. `array`, `op`, `index`, the entry's keys, and `base`."
writes = true

[[route]]
method = "POST"
path = "/v1/view/<id>"
what = "Set how the answer is drawn. `kind`, `over`, `points`, and `base`."
writes = true

[[route]]
method = "POST"
path = "/v1/publish/<id>"
what = "Publish a seeded row. `base`."
writes = true

[[route]]
method = "POST"
path = "/v1/preview/<id>"
what = "What pasting a sheet body would change. Writes nothing. `body`."

[[route]]
method = "POST"
path = "/v1/propose"
what = "Commit the edited rows to a new branch. Does not push. `summary`, `kind`."
writes = true

[[route]]
method = "GET"
path = "/v1/run"
what = "Evaluate a row. `node`, and optionally `case`, `mode` and `set`."

[[route]]
method = "POST"
path = "/v1/run"
what = "The same as GET, with the parameters in the body."

[[route]]
method = "GET"
path = "/v1/sweep"
what = "A behaviour sweep, as `vleo sweep`. Refused points are reported with their reason."

[[route]]
method = "GET"
path = "/v1/probe"
what = "One relation at chosen inputs: `node`, and `in=<var>:<value>` for each. Answers even where a run would refuse a supplied value."

[[route]]
method = "GET"
path = "/v1/levers"
what = "Which declared decisions actually move a row's answer, and by how much: `node`."

[[route]]
method = "GET"
path = "/v1/branches"
what = "The largest fully-published branches a row is part of: `node`."

[[route]]
method = "GET"
path = "/v1/bundle/<name>"
what = "A reference-data set's published files."

[[route]]
method = "GET"
path = "/v1/parity/<name>"
what = "The published output of the tool this was ported from, for comparison."


