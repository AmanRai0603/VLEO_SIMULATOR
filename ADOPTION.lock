# What this repository depends on that it did not write, and what happens when
# one of them goes away.
#
# The audit that produced this took three passes and found three dead or wrong
# rows out of fourteen. That rate is normal and it will recur, which is why the
# re-verification below is a scheduled afternoon rather than a rediscovery every
# time somebody notices.
#
# Re-verify quarterly: still maintained, licence unchanged, still does what this
# file says. Update the date. On a load-bearing row going dead, switch to the
# recorded fallback — it is already named, so that is a decision of minutes.
#
# Eight fields per row, and two of them exist because of specific failures:
#
#   upstream  the exact address. NOT the name — four separate projects answer
#             to "AgentLint" and one tool appears under two organisations, so a
#             name does not identify anything
#   licence   as read, not as assumed. One row in the wider audit turned out to
#             run a tiered licence rather than being uniformly open

[[adopted]]
name = "toml"
upstream = "https://github.com/toml-rs/toml"
licence = "MIT OR Apache-2.0"
version = "0.8"
used_by = "vleo-sheet, vleo-data, xtask"
load_bearing = true
why = "reads the sheets, the layer files, the cases and the bundle manifests"
fallback = "a hand-written parser for the subset used here — the schema is small and fixed"
verified = "2026-09-11"

[[adopted]]
name = "wasm-bindgen"
upstream = "https://github.com/rustwasm/wasm-bindgen"
licence = "MIT OR Apache-2.0"
version = "0.2"
used_by = "vleo-wasm"
load_bearing = false
why = "the browser binding surface, and it emits the TypeScript declarations"
fallback = "the daemon face already covers everything the browser face does"
verified = "2026-09-11"

[[adopted]]
name = "pyo3"
upstream = "https://github.com/PyO3/pyo3"
licence = "MIT OR Apache-2.0"
version = "0.22"
used_by = "vleo-py"
load_bearing = false
why = "the Python wheel, which is how MATLAB reaches the engine"
fallback = "the C ABI in vleo-ffi, called from MATLAB through loadlibrary"
verified = "2026-09-11"

[[adopted]]
name = "maturin"
upstream = "https://github.com/PyO3/maturin"
licence = "MIT OR Apache-2.0"
version = ">=1.5,<2"
used_by = "the wheel build"
load_bearing = false
why = "builds and publishes the stable-ABI wheel"
fallback = "setuptools-rust, or shipping the shared library and a ctypes shim"
verified = "2026-09-11"

[[adopted]]
name = "embed-resource"
upstream = "https://github.com/nabijaczleweli/rust-embed-resource"
licence = "MIT"
version = "3"
used_by = "vleo-daemon, vleo-cli, vleo-py (build scripts, Windows only)"
load_bearing = false
why = "compiles the Windows version information — company, product, version — into the programs, which a file with none of is one more thing an antivirus weighs against it"
fallback = "call the Windows SDK's rc.exe from the build script directly, or ship without the version information"
verified = "2026-09-28"

[[adopted]]
name = "IBM Plex Mono"
upstream = "https://github.com/IBM/plex, as packaged by https://www.npmjs.com/package/@fontsource/ibm-plex-mono (5.3.0)"
licence = "OFL-1.1 (web/fonts/OFL.txt, carried beside the files as the licence requires)"
version = "5.3.0 — the Latin subset, weights 400, 500, 600, 700 and 400 italic, as woff2"
used_by = "web/app.css — the tool's face and the readers' folder"
load_bearing = false
why = "the face's own type, so it reads the same on every laptop and fetches nothing to do it; before this the face named Plex and fell back to whatever monospace the reader had"
fallback = "delete web/fonts and the @font-face rules in web/app.css: the stack falls back to the reader's own monospace, as it did before phase 9d"
verified = "2026-09-30"

# --- deliberately not adopted, with the reason -------------------------------
#
# hifitime, ANISE, nalgebra and hyperdual are the right answers to time, frames,
# linear algebra and automatic differentiation, and adopting them rather than
# writing them again would be correct the moment this tool needs any of the
# four. It does not yet: nothing here propagates a trajectory, nothing converts
# between frames, no relation needs a decomposition, and no state transition
# matrix is formed. Adding a dependency before a node needs it is a dependency
# nobody reviews.
#
# TRIGGER — adopt hifitime and ANISE outright on the first node that needs an
# epoch or a frame conversion. Writing leap seconds again is a way to be wrong,
# and an analytic Jacobian drifts from the model it differentiates while an
# autodiff one cannot.
