# VLEO Integrated Design Tool — one workspace, one version for every artefact.
#
# Ring discipline (enforced by the crate graph; a backwards call fails the build):
#   RING 0  vleo-units    newtype units, frames, constants, portable maths
#   RING 1  vleo-core     every formula, the resolver, the graph types   (no_std)
#   RING 2  vleo-bus      typed messages, ports, schedule, cache keys
#   RING 3  vleo-modules  the engine: the graph read from the design's files, run in the
#                         interpreter; holds no formula and no row of the design
#           vleo-results  results.vleor: saved results, many in one file
#           vleo-kinds    every kind of file the tools write, and how a reader takes it
#           vleo-server   the local server both the daemon and the Python package start
#   FACES   vleo-cli · vleo-daemon · vleo-kernel-wasm · vleo-ffi · vleo-py
[workspace]
resolver = "2"
members = [
    "crates/vleo-units",
    "crates/vleo-core",
    "crates/vleo-sheet",
    "crates/vleo-bus",
    "crates/vleo-data",
    "crates/vleo-kinds",
    "crates/vleo-results",
    "crates/vleo-files",
    "crates/vleo-modules",
    "crates/vleo-cli",
    "crates/vleo-daemon",
    "crates/vleo-server",
    "crates/vleo-ffi",
    "xtask",
]
exclude = ["crates/vleo-py", "crates/vleo-method-wasm", "crates/vleo-kernel-wasm", "crates/vleo-files-wasm"]

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.94"
license = "UNLICENSED"
authors = ["Orbitt Space"]
repository = "https://github.com/AmanRai0603/VLEO_SIMULATOR"

[workspace.dependencies]
vleo-units   = { path = "crates/vleo-units" }
vleo-sheet   = { path = "crates/vleo-sheet" }
vleo-core    = { path = "crates/vleo-core" }
vleo-bus     = { path = "crates/vleo-bus" }
vleo-data    = { path = "crates/vleo-data" }
vleo-results = { path = "crates/vleo-results" }
vleo-kinds   = { path = "crates/vleo-kinds" }
vleo-modules = { path = "crates/vleo-modules" }
vleo-server = { path = "crates/vleo-server" }
toml         = "0.8"
# Edits a TOML file keeping its comments and layout — the tools' edits to
# Cargo.toml and the sheets, instead of rewriting lines by hand.
toml_edit    = "0.22"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
# SQLite with its C source compiled in, so no machine needs it installed: the
# results file (vleo-results), in the same format the group applications write.
rusqlite     = { version = "0.32", features = ["bundled"] }

# The kernel is the hot path.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# UNWIND, SO ONE BUG ENDS ONE REQUEST AND NOT THE TOOL. With "abort" a panic in
# any request closed the whole daemon, leaving nothing written and a page that
# simply stopped. (The Python package is built outside this workspace, where
# unwinding was already the default: there a panic ended only that request's
# thread — silently, with a dropped connection and one connection place never
# given back.) The server now catches a panic per request, the C entry point
# catches it at the boundary, and a crash log records it (vleo_data::crash).
# None of that can work under "abort". A full run is 12 ms; the cost of
# unwinding tables is not measurable against that.
panic = "unwind"
strip = "symbols"

# Dependencies optimised once and cached; an unoptimised nalgebra-class dependency
# makes the edit-run cycle unusable.
[profile.dev]
opt-level = 0
[profile.dev.package."*"]
opt-level = 2
# The kernel too: a probe far outside every range runs a production run or a
# binomial four billion units long, and unoptimised that is minutes a test.
# Optimising changes no answer: the compiler neither reorders nor fuses
# floating-point arithmetic, and baseline/ holds every answer to the bit.
[profile.dev.package.vleo-units]
opt-level = 2
[profile.dev.package.vleo-core]
opt-level = 2
