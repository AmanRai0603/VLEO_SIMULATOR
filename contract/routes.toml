# The contract between the frontend and the backend: every route the engine
# serves, what kind of answer it gives, and the requests the contract tests
# make of it (crates/vleo-server/tests/the_contract_holds.rs).
#
# Reviewed by both sides — see contract/README.md. Inside /v1 a change may
# only ADD a route or a field. Anything that removes or re-means one is /v2,
# served beside /v1 for one release.
#
# Each route:
#   method, path   as the manual lists it (docs/manual.toml [[route]])
#   answer         json | html | csv | css | js | font
#   schema         for a json answer: contract/schemas/<schema>.json
#   format         for a csv answer that is one of the file formats:
#                  contract/formats/<format>.toml
#   contains       for an html, css or js answer: text it must carry
#
# Each example is a request the tests make, in the order written here — the
# results routes save, read, upload and delete in that order. A json answer is
# recorded as contract/examples/<name>.json, and the mock engine serves it.
#   path     when the route has a part in its path (default: the route's)
#   params   [key, value] pairs: the query for GET, the body for POST.
#            "@saved" is the `file` of the last result saved or uploaded;
#            "@get:<path>" is the text of that GET, made first;
#            "@vleor" is the last result saved, as a results file, base64.
#            "@session" is this launch's word, which a POST that opens or uses
#            a key, or writes the person's copy, carries.

# --- the page ---------------------------------------------------------------

[[route]]
method = "GET"
path = "/"
answer = "html"
contains = "<script"

[[route]]
method = "GET"
path = "/app"
answer = "html"
contains = "/js/shell.js"

[[route]]
method = "GET"
path = "/app.css"
answer = "css"
contains = ":root"

[[route]]
method = "GET"
path = "/js/<module>"
answer = "js"
contains = "import"
[[route.example]]
name = "js-app"
path = "/js/app.js"

[[route]]
method = "GET"
path = "/fonts/<font>"
answer = "font"
[[route.example]]
name = "font-regular"
path = "/fonts/ibm-plex-mono-latin-400-normal.woff2"

