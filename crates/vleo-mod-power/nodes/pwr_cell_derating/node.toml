# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "pwr_cell_derating"
label = "Array temperature derating factor"
folder = "pwr_cell_derating"   # frozen at seed; renaming the label never moves the directory
subsystem = "power"
parent = "l3_power"
kind = "computed"
owner = "power"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 717
state = "published"

[question]
text = "How much output does the array lose because it is hotter than its rating?"
note = "This node closes the loop. Without it power, thermal and propulsion are three independent chains; with it they are one system, and the resolver has to relax them together."

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How much output the solar array loses because it runs hotter than the temperature its rating assumes. It ties power, thermal and propulsion into one system: without it they are three separate chains, and with it they have to be solved together."
breaks = "It treats the loss as a straight line in temperature about a reference of 298.15 kelvin, and it is floored at 30 per cent so the calculation cannot chase an array producing negative power; at that floor the answer is a guard, not a result. Above 1.5 the coefficient does not permit it."
by = "an assistant, from what this sheet states — for its owner (power) to confirm"

[maths]
expression = "f_T = 1 + k_T*(T_eq - 298.15)"
source = "larson_wertz"

[method]
text = """
# Transcribed from crates/vleo-mod-power/nodes/pwr_cell_derating/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
# "* 1 [unit]" gives a number this design states as a pure ratio the unit the kernel reads it in,
# and "/ 1 [unit]" the other way; the number itself does not change.
# Constants the code held, written out here as it held them: 0.3; 298.15 [K].
return max(0.3, 1 + k * 1 [1/K] * (t - 298.15 [K]))
"""
by = ""
transcribed_from = "crates/vleo-mod-power/nodes/pwr_cell_derating/model.rs"
checked_by = ""

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "f_T"
type = "Ratio"
unit = "One"
lower = 0.0
upper = 1.5
reason_lower = "a derating factor cannot be negative"
reason_upper = "above 1.5 the array would be producing half again its rating, which the coefficient does not permit"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "k"
var = "pwr_cell_temperature_coefficient"
type = "Ratio"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "t"
var = "thm_equilibrium_temperature"
type = "Temperature"

[[algorithm.step]]
number = 1
text = "apply the linear temperature coefficient about the 298.15 K reference, floored at 30% so the relaxation cannot chase a negative array"
binds = "f"
type = "Ratio"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (power) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "The linear temperature coefficient about the 298.15 kelvin reference, as stated and cited to larson_wertz, not yet derived on the sheet, floored at 30 per cent."
breaks_if = "Array output that does not fall in a straight line with temperature over the temperatures this design reaches, a result held at the 30 per cent floor, or a derivation or comparison with larson_wertz that disagrees."
relation = "f_T = 1 + k_T*(T_eq - 298.15)"
source = "larson_wertz"
