# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "pwr_cell_efficiency"
label = "Solar cell efficiency"
folder = "pwr_cell_efficiency"   # frozen at seed; renaming the label never moves the directory
subsystem = "power"
parent = "l3_power"
kind = "declared"
owner = "power"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 571
state = "published"

[question]
text = "How efficiently does one cell convert sunlight?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "The share of sunlight falling on one solar cell that it turns into electricity: 30 per cent."
breaks = "It is the efficiency of one cell, not of the whole array. Below 10 per cent no cell considered for this programme performs that badly, and above 40 per cent is beyond any qualified space cell available at the time of this baseline."
by = "an assistant, from what this sheet states — for its owner (power) to confirm"

[maths]
expression = "eta_cell = 0.3"
source = "larson_wertz"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "eta_cell"
type = "Ratio"
unit = "One"
lower = 0.1
upper = 0.4
reason_lower = "below 10% no cell technology considered for this programme performs that badly"
reason_upper = "above 40% is beyond any qualified space cell available at the time of this baseline"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 0.3
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "next"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (power) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That a cell efficiency of 0.3 is right for the cells chosen; the value is declared, confirmed by A. Rai on 2026-09-01, and the sheet gives no further reason for it."
breaks_if = "A datasheet or test of the chosen solar cell giving a different efficiency."
relation = "eta_cell = 0.3"
source = "larson_wertz"
