# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "pwr_array_areal_density"
label = "Array areal density"
folder = "pwr_array_areal_density"   # frozen at seed; renaming the label never moves the directory
subsystem = "power"
parent = "l3_power"
kind = "declared"
owner = "power"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 578
state = "published"

[question]
text = "What does a square metre of deployed array weigh?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How much one square metre of unfolded solar array weighs: 2.8 kilograms. It turns the array's size into its mass."
breaks = "It is one declared figure for the whole array. Below half a kilogram per square metre no unfolding array structure of this size is that light, and above 10 the array's mass alone breaks the mass budget."
by = "an assistant, from what this sheet states — for its owner (power) to confirm"

[maths]
expression = "sigma_a = 2.8"
source = "larson_wertz"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "sigma_a"
type = "Ratio"
unit = "One"
lower = 0.5
upper = 10.0
reason_lower = "below 0.5 kg/m2 no deployable array structure of this size is that light"
reason_upper = "above 10 kg/m2 the array mass alone breaks the mass budget"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 2.8
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "next"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (power) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That the array weighs 2.8 kilograms per square metre; the value is declared, confirmed by A. Rai on 2026-09-01, and the sheet gives no further reason for it. The sheet records the unit as a plain number, while its bounds read in kilograms per square metre."
breaks_if = "A mass figure for the chosen array design that differs from 2.8 kilograms per square metre."
relation = "sigma_a = 2.8"
source = "larson_wertz"
