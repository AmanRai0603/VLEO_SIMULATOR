# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "pwr_battery_cycles"
label = "Battery charge cycles"
folder = "pwr_battery_cycles"   # frozen at seed; renaming the label never moves the directory
subsystem = "power"
parent = "l3_power"
kind = "computed"
owner = "power"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 590
state = "published"

[question]
text = "How many charge and discharge cycles does the battery see?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How many times the battery is charged and discharged over the mission, counted as one cycle for every orbit flown. It is the number the battery's cells must have data for."
breaks = "It is a count of orbits and nothing more: it says nothing about how deeply each cycle drains the battery. Above a million cycles no cell chemistry has data to hold it against."
by = "an assistant, from what this sheet states — for its owner (power) to confirm"

[maths]
expression = "N = t_mission/T_orbit"
source = "larson_wertz"

[method]
text = """
# Transcribed from crates/vleo-mod-power/nodes/pwr_battery_cycles/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
return battery_cycles(tm, t_orbit)
"""
by = ""
transcribed_from = "crates/vleo-mod-power/nodes/pwr_battery_cycles/model.rs"
checked_by = ""

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "N_cyc"
type = "Ratio"
unit = "One"
lower = 0.0
upper = 1000000.0
reason_lower = "a cycle count cannot be negative"
reason_upper = "above a million cycles no cell chemistry has data"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "tm"
var = "orbit_mission_duration"
type = "Time"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "t_orbit"
var = "orbit_period"
type = "Time"

[[algorithm.step]]
number = 1
text = "divide the mission duration by the orbital period"
binds = "n"
type = "Ratio"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (power) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "The relation as stated and cited to larson_wertz, the mission duration divided by the orbital period, not yet derived on the sheet."
breaks_if = "An orbit that does not give the battery exactly one cycle, a derivation or comparison with larson_wertz that disagrees, or a count above a million cycles."
relation = "N = t_mission/T_orbit"
source = "larson_wertz"
