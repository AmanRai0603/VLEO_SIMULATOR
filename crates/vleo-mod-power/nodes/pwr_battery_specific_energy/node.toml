# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "pwr_battery_specific_energy"
label = "Battery specific energy"
folder = "pwr_battery_specific_energy"   # frozen at seed; renaming the label never moves the directory
subsystem = "power"
parent = "l3_power"
kind = "declared"
owner = "power"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 579
state = "published"

[question]
text = "How much energy does a kilogram of battery store?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How much energy one kilogram of battery stores: 150 watt-hours. It turns the energy the battery must hold into battery mass."
breaks = "It is one declared figure for the cell chosen. Below 50 watt-hours per kilogram no cell considered is that poor, and above 350 it is beyond any lithium-ion cell qualified for space at this baseline."
by = "an assistant, from what this sheet states — for its owner (power) to confirm"

[maths]
expression = "e_batt = 150"
source = "larson_wertz"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "e_batt"
type = "Ratio"
unit = "One"
lower = 50.0
upper = 350.0
reason_lower = "below 50 Wh/kg no cell considered is that poor"
reason_upper = "above 350 Wh/kg is beyond any space-qualified lithium-ion cell at this baseline"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 150.0
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "next"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (power) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That the battery stores 150 watt-hours per kilogram; the value is declared, confirmed by A. Rai on 2026-09-01, and the sheet gives no further reason for it. The sheet records the unit as a plain number, while its bounds read in watt-hours per kilogram."
breaks_if = "A datasheet for the chosen battery cell giving a different energy per kilogram."
relation = "e_batt = 150"
source = "larson_wertz"
