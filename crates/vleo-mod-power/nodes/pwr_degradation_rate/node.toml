# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "pwr_degradation_rate"
label = "Annual array degradation rate"
folder = "pwr_degradation_rate"   # frozen at seed; renaming the label never moves the directory
subsystem = "power"
parent = "l3_power"
kind = "declared"
owner = "power"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 573
state = "published"

[question]
text = "How much output does the array lose each year?"
note = "VLEO is below the inner belt, so the dominant mechanism is atomic-oxygen erosion of coverglass adhesive and thermal cycling, not displacement damage. This is the one place a VLEO power design differs from the textbook figure."

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How much output the solar array loses each year: 2.5 per cent. At very low altitude the main cause is atomic oxygen, the reactive single oxygen atoms there, eating the adhesive under the cover glass, together with repeated heating and cooling."
breaks = "It is one steady yearly rate. The sheet notes this is where a very-low-orbit power design departs from the textbook figure; above 15 per cent a year the array is gone within the mission and the design does not close."
wrong = "It is easy to assume the array wears out mainly from radiation damage; at this altitude it sits below the inner radiation belt, so atomic-oxygen erosion and thermal cycling dominate instead."
by = "an assistant, from what this sheet states — for its owner (power) to confirm"

[maths]
expression = "d_yr = 0.025"
source = "larson_wertz"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "d_yr"
type = "Ratio"
unit = "One"
lower = 0.0
upper = 0.15
reason_lower = "a degradation rate cannot be negative"
reason_upper = "above 15% a year the array is gone within the mission and the design does not close"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 0.025
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (power) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That the array loses 0.025 of its output a year, driven by atomic-oxygen erosion of cover-glass adhesive and thermal cycling rather than radiation damage; the value is declared, confirmed by A. Rai on 2026-09-01."
breaks_if = "Flight or test data on arrays at this altitude showing a different yearly loss, or a different mechanism dominating."
relation = "d_yr = 0.025"
source = "larson_wertz"
