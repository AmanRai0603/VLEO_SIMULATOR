# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "pwr_subsystem_mass"
label = "Power subsystem mass"
folder = "pwr_subsystem_mass"   # frozen at seed; renaming the label never moves the directory
subsystem = "power"
parent = "l3_power"
kind = "computed"
owner = "power"
tier = "B"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 593
state = "published"

[question]
text = "What does the whole power subsystem weigh?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "What the whole power subsystem weighs: the solar array and the battery, plus 25 per cent of their combined mass for the unit that distributes and controls the power."
breaks = "The distribution and control unit is not sized here; it is a flat 25 per cent of the array and battery, and nothing else is added. Above two tonnes the power system is not part of this spacecraft."
by = "an assistant, from what this sheet states — for its owner (power) to confirm"

[maths]
expression = "m = m_arr + m_batt + m_pcdu"
source = "larson_wertz"

[method]
text = """
# Transcribed from crates/vleo-mod-power/nodes/pwr_subsystem_mass/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
# Constants the code held, written out here as it held them: 1.25.
return (ma + mb) * 1.25
"""
by = ""
transcribed_from = "crates/vleo-mod-power/nodes/pwr_subsystem_mass/model.rs"
checked_by = "Aman Rai"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "m_pwr"
type = "Mass"
unit = "Kilogram"
lower = 0.0
upper = 2000.0
reason_lower = "a mass cannot be negative"
reason_upper = "above two tonnes the power system is not part of this spacecraft"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "ma"
var = "pwr_array_mass"
type = "Mass"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "mb"
var = "pwr_battery_mass"
type = "Mass"

[[algorithm.step]]
number = 1
text = "sum the array and battery masses and add 25% for the distribution and control unit"
binds = "m"
type = "Mass"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (power) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "The relation as stated and cited to larson_wertz, with the distribution and control unit taken as 25 per cent of the array and battery masses, not yet derived on the sheet."
breaks_if = "A distribution and control unit whose mass is far from 25 per cent of the array and battery, a derivation or comparison with larson_wertz that disagrees, or a result above two tonnes."
relation = "m = m_arr + m_batt + m_pcdu"
source = "larson_wertz"
