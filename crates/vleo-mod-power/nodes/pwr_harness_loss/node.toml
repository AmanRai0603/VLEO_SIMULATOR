# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "pwr_harness_loss"
label = "Harness and distribution loss"
folder = "pwr_harness_loss"   # frozen at seed; renaming the label never moves the directory
subsystem = "power"
parent = "l3_power"
kind = "declared"
owner = "power"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 577
state = "published"

[question]
text = "What fraction is lost between the source and the loads?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "The share of power lost in the wiring and distribution between the power source and the equipment that uses it: 6 per cent."
breaks = "It is one declared fraction for all the wiring. Above 25 per cent the wiring would be the largest load on the spacecraft, and the figure stops describing a working design."
by = "an assistant, from what this sheet states — for its owner (power) to confirm"

[maths]
expression = "L_h = 0.06"
source = "larson_wertz"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "L_h"
type = "Ratio"
unit = "One"
lower = 0.0
upper = 0.25
reason_lower = "a loss fraction cannot be negative"
reason_upper = "above 25% the harness is the largest load on the bus"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 0.06
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (power) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That harness and distribution lose 0.06 of the power; the value is declared, confirmed by A. Rai on 2026-09-01, and the sheet gives no further reason for it."
breaks_if = "A harness design or measurement for this spacecraft giving a different loss."
relation = "L_h = 0.06"
source = "larson_wertz"
