# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "pwr_array_power_bol"
label = "Array power, beginning of life"
folder = "pwr_array_power_bol"   # frozen at seed; renaming the label never moves the directory
subsystem = "power"
parent = "l3_power"
kind = "computed"
owner = "power"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 584
state = "published"

[question]
text = "How much does the array produce when new, in sunlight?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How many watts the solar array produces when new and in sunlight: the Sun's power falling on the array's area, reduced by how efficiently the cells convert it, how much of the area is covered by cells, and the average angle at which the sunlight strikes."
breaks = "It is a new array in full sun at an average angle, so it leaves out eclipse, ageing and heat. It uses the solar constant, one fixed figure for sunlight. Above 50 kilowatts the array is not the one these inputs describe."
by = "an assistant, from what this sheet states — for its owner (power) to confirm"

[maths]
expression = "P_bol = S*A*eta_cell*f_pack*cos(theta)"
source = "larson_wertz"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "P_bol"
type = "Power"
unit = "Watt"
lower = 0.0
upper = 50000.0
reason_lower = "array output cannot be negative"
reason_upper = "above 50 kW the array is not the one described by these inputs"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "a"
var = "pwr_array_area"
type = "Area"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "e"
var = "pwr_cell_efficiency"
type = "Ratio"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "f"
var = "pwr_packing"
type = "Ratio"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "th"
var = "pwr_array_incidence"
type = "Angle"

[[algorithm.step]]
number = 1
text = "apply the solar constant to the illuminated active area at the mean incidence"
binds = "p"
type = "Power"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (power) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "The relation as stated and cited to larson_wertz, applying the solar constant to the illuminated active area at the mean incidence, not yet derived on the sheet."
breaks_if = "A derivation or comparison with larson_wertz that disagrees, or a result above 50 kilowatts, which would mean the inputs do not describe this array."
relation = "P_bol = S*A*eta_cell*f_pack*cos(theta)"
source = "larson_wertz"
