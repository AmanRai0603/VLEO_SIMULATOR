# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "pwr_array_power_bol"
label = "Array power, beginning of life"
folder = "array_power_bol"   # frozen at seed; renaming the label never moves the directory
subsystem = "power"
parent = "l3_power"
kind = "computed"
owner = "power"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
state = "published"

[question]
text = "How much does the array produce when new, in sunlight?"

[maths]
expression = "P_bol = S*A*eta_cell*f_pack*cos(theta)"
source = "larson_wertz"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "P_bol"
type = "Power"
unit = "Watt"
lower = 0.0
upper = 50000.0
reason_lower = "array output cannot be negative"
reason_upper = "above 50 kW the array is not the one described by these inputs"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "a"
var = "pwr_array_area"
type = "Area"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "e"
var = "pwr_cell_efficiency"
type = "Ratio"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "f"
var = "pwr_packing"
type = "Ratio"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "th"
var = "pwr_array_incidence"
type = "Angle"

[[algorithm.step]]
number = 1
text = "apply the solar constant to the illuminated active area at the mean incidence"
binds = "p"
type = "Power"

[view]
kind = "number"

