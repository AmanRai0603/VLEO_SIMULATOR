# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "pwr_battery_mass"
label = "Battery mass"
folder = "pwr_battery_mass"   # frozen at seed; renaming the label never moves the directory
subsystem = "power"
parent = "l3_power"
kind = "computed"
owner = "power"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 591
state = "published"

[question]
text = "What does the battery weigh?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "What the battery weighs: the energy it must hold divided by how much energy each kilogram of battery stores."
breaks = "It sizes the battery on stored energy alone and is only as good as the energy-per-kilogram figure it is given. Above a tonne the battery is not part of this spacecraft."
by = "an assistant, from what this sheet states — for its owner (power) to confirm"

[maths]
expression = "m = E/e_batt"
source = "larson_wertz"

[method]
text = """
# Transcribed from crates/vleo-mod-power/nodes/pwr_battery_mass/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
return battery_mass(e, se)
"""
by = ""
transcribed_from = "crates/vleo-mod-power/nodes/pwr_battery_mass/model.rs"
checked_by = ""

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "m_batt"
type = "Mass"
unit = "Kilogram"
lower = 0.0
upper = 1000.0
reason_lower = "a mass cannot be negative"
reason_upper = "above a tonne the battery is not part of this spacecraft"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "e"
var = "pwr_battery_energy"
type = "Energy"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "se"
var = "pwr_battery_specific_energy"
type = "Ratio"

[[algorithm.step]]
number = 1
text = "divide the required energy by the specific energy"
binds = "m"
type = "Mass"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (power) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "The relation as stated and cited to larson_wertz, the required energy divided by the specific energy, not yet derived on the sheet."
breaks_if = "A derivation or comparison with larson_wertz that disagrees, a battery whose mass does not scale with the energy it holds, or a result above a tonne."
relation = "m = E/e_batt"
source = "larson_wertz"
