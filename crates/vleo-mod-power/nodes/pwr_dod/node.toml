# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "pwr_dod"
label = "Battery depth of discharge"
folder = "pwr_dod"   # frozen at seed; renaming the label never moves the directory
subsystem = "power"
parent = "l3_power"
kind = "declared"
owner = "power"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 575
state = "published"

[question]
text = "How deeply is the battery discharged each eclipse?"
note = "A lifetime decision rather than an energy one: 92-minute orbits over five years is roughly 29000 cycles."

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How much of the battery's charge is used up in each eclipse: 20 per cent. It is really a choice about battery life, since orbits of 92 minutes over five years mean about 29000 charge cycles."
breaks = "It is one declared fraction. Below 5 per cent the battery is absurdly oversized, and above 80 per cent no lithium-ion cell survives the 29000 cycles a five-year mission at this altitude means."
wrong = "It is easy to treat this as a question of how much energy the battery holds; the sheet says it is a lifetime decision, set by how many cycles the battery must survive."
by = "an assistant, from what this sheet states — for its owner (power) to confirm"

[maths]
expression = "DoD = 0.2"
source = "larson_wertz"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "DoD"
type = "Ratio"
unit = "One"
lower = 0.05
upper = 0.8
reason_lower = "below 5% the battery is absurdly oversized"
reason_upper = "above 80% no lithium-ion cell survives 29000 cycles, which is what a five-year VLEO mission is"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 0.2
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "next"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (power) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That a depth of discharge of 0.2 is right for a five-year mission of about 29000 cycles; the value is declared, confirmed by A. Rai on 2026-09-01."
breaks_if = "Cycle-life data for the chosen cell showing it cannot survive about 29000 cycles at this depth, or a mission length or orbit period that changes the cycle count."
relation = "DoD = 0.2"
source = "larson_wertz"
