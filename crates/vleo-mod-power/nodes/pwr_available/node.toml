# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "pwr_available"
label = "Orbit-average power available"
folder = "pwr_available"   # frozen at seed; renaming the label never moves the directory
subsystem = "power"
parent = "l3_power"
kind = "computed"
owner = "power"
tier = "B"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 586
state = "published"

[question]
text = "How much power is actually available to the loads, averaged over an orbit?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How much power actually reaches the spacecraft's equipment, averaged over one orbit. In sunlight the array feeds it directly; in eclipse the power comes through the battery, each path with its own efficiency, and the two are weighted by how much of the orbit is spent in each."
breaks = "It assumes the array is big enough that the sunlit part of the orbit both runs the equipment and recharges the battery. If it is not, the battery's charge walks down orbit after orbit and this number is optimistic from the second day onwards."
by = "an assistant, from what this sheet states — for its owner (power) to confirm"

[maths]
expression = "P_avail = P_eol*(1 - f_ecl)*eta_direct + P_eol*f_ecl*eta_batt"
source = "larson_wertz"

[[assumption]]
text = "The array is sized so that the sunlit period both runs the loads and recharges the battery"
fails_when = "if it is not, the battery state of charge walks down over successive orbits and this number is optimistic from the second day onwards"

[method]
text = """
# Transcribed from crates/vleo-mod-power/nodes/pwr_available/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
# Constants the code held, written out here as it held them: 0.97; 0.95.
return pe * ((1 - fe) * 0.97 + fe * ed * 0.95)
"""
by = ""
transcribed_from = "crates/vleo-mod-power/nodes/pwr_available/model.rs"
checked_by = "Aman Rai"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "P_avail"
type = "Power"
unit = "Watt"
lower = 0.0
upper = 50000.0
reason_lower = "available power cannot be negative"
reason_upper = "above 50 kW the array is not the one described by these inputs"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "pe"
var = "pwr_array_power_eol"
type = "Power"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "fe"
var = "orbit_eclipse_fraction"
type = "Ratio"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "ed"
var = "pwr_discharge_efficiency"
type = "Ratio"

[[algorithm.step]]
number = 1
text = "average the direct and battery-borne paths over the sunlit and eclipsed parts of the orbit"
binds = "p"
type = "Power"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (power) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "The relation as stated and cited to larson_wertz, not yet derived on the sheet, and the assumption that the sunlit period both runs the loads and recharges the battery."
breaks_if = "The battery's state of charge falls over successive orbits, showing the sunlit period does not cover both the loads and the recharge, or a derivation or comparison with larson_wertz disagrees."
relation = "P_avail = P_eol*(1 - f_ecl)*eta_direct + P_eol*f_ecl*eta_batt"
source = "larson_wertz"
