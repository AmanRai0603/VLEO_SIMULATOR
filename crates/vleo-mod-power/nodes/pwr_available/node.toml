# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "pwr_available"
label = "Orbit-average power available"
folder = "pwr_available"   # frozen at seed; renaming the label never moves the directory
subsystem = "power"
parent = "l3_power"
kind = "computed"
owner = "power"
tier = "B"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 586
state = "published"

[question]
text = "How much power is actually available to the loads, averaged over an orbit?"

[maths]
expression = "P_avail = P_eol*(1 - f_ecl)*eta_direct + P_eol*f_ecl*eta_batt"
source = "larson_wertz"

[[assumption]]
text = "The array is sized so that the sunlit period both runs the loads and recharges the battery"
fails_when = "if it is not, the battery state of charge walks down over successive orbits and this number is optimistic from the second day onwards"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "P_avail"
type = "Power"
unit = "Watt"
lower = 0.0
upper = 50000.0
reason_lower = "available power cannot be negative"
reason_upper = "above 50 kW the array is not the one described by these inputs"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "pe"
var = "pwr_array_power_eol"
type = "Power"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "fe"
var = "orbit_eclipse_fraction"
type = "Ratio"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "ed"
var = "pwr_discharge_efficiency"
type = "Ratio"

[[algorithm.step]]
number = 1
text = "average the direct and battery-borne paths over the sunlit and eclipsed parts of the orbit"
binds = "p"
type = "Power"

[view]
kind = "number"

