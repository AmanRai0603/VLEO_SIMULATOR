# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "pwr_battery_energy"
label = "Battery energy required"
folder = "battery_energy"   # frozen at seed; renaming the label never moves the directory
subsystem = "power"
parent = "l3_power"
kind = "computed"
owner = "power"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 587
state = "published"

[question]
text = "How much energy must the battery hold to carry the load through eclipse?"

[maths]
expression = "E = P_ecl*t_ecl/(DoD*eta_dis)"
source = "larson_wertz"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "E_batt"
type = "Energy"
unit = "WattHour"
lower = 0.0
upper = 27778.0
reason_lower = "battery energy cannot be negative"
reason_upper = "above 27 kWh the battery is heavier than the whole spacecraft"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "dem"
var = "pwr_demand"
type = "Power"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "fe"
var = "orbit_eclipse_fraction"
type = "Ratio"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "t"
var = "orbit_period"
type = "Time"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "dod"
var = "pwr_dod"
type = "Ratio"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "ed"
var = "pwr_discharge_efficiency"
type = "Ratio"

[[algorithm.step]]
number = 1
text = "carry the full demand through the eclipse fraction of one revolution at the declared depth of discharge"
binds = "e"
type = "Energy"

[view]
kind = "number"

