# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "pwr_cell_temperature_coefficient"
label = "Cell power temperature coefficient"
folder = "pwr_cell_temperature_coefficient"   # frozen at seed; renaming the label never moves the directory
subsystem = "power"
parent = "l3_power"
kind = "declared"
owner = "power"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 716
state = "published"

[question]
text = "How much output does the array lose per kelvin above its reference temperature?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How much output the solar array loses for each degree it runs hotter than its reference temperature: a small negative fraction, so the array gives less power when warm."
breaks = "It is one declared rate. A positive value would mean a cell that improves when heated, which does not happen, and no cell technology degrades faster than one per cent per degree."
by = "an assistant, from what this sheet states — for its owner (power) to confirm"

[maths]
expression = "k_T = -0.0025"
source = "larson_wertz"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "k_T"
type = "Ratio"
unit = "One"
lower = -0.01
upper = 0.0
reason_lower = "below -1% per kelvin no cell technology degrades that fast"
reason_upper = "a positive coefficient would mean a cell that improves when heated, which does not happen"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = -0.0025
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (power) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That the array loses -0.0025 of its output per kelvin above its reference temperature; the value is declared, confirmed by A. Rai on 2026-09-01, and the sheet gives no further reason for it."
breaks_if = "A datasheet or test of the chosen cells giving a different loss of output with temperature."
relation = "k_T = -0.0025"
source = "larson_wertz"
