# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "pwr_degradation"
label = "Array degradation factor"
folder = "degradation"   # frozen at seed; renaming the label never moves the directory
subsystem = "power"
parent = "power"
kind = "computed"
owner = "power"
tier = "A"
state = "published"

[question]
text = "How much of the array's beginning-of-life output survives to the end of the mission?"

[maths]
expression = "f_deg = (1 - d_yr)^t"
source = "larson_wertz"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "f_deg"
type = "Ratio"
unit = "One"
lower = 0.0
upper = 1.0
reason_lower = "a degradation factor cannot be negative"
reason_upper = "an array cannot end life producing more than it began with"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "d"
var = "pwr_degradation_rate"
type = "Ratio"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "t"
var = "orbit_mission_duration"
type = "Time"

[[algorithm.step]]
number = 1
text = "compound the annual rate over the mission duration in years"
binds = "f"
type = "Ratio"

[view]
kind = "number"

