# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "pwr_array_mass"
label = "Array mass"
folder = "array_mass"   # frozen at seed; renaming the label never moves the directory
subsystem = "power"
parent = "power"
kind = "computed"
owner = "power"
tier = "A"
state = "published"

[question]
text = "What does the deployed array weigh?"

[maths]
expression = "m = A*sigma_a"
source = "larson_wertz"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "m_arr"
type = "Mass"
unit = "Kilogram"
lower = 0.0
upper = 1000.0
reason_lower = "a mass cannot be negative"
reason_upper = "above a tonne the array is not part of this spacecraft"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "a"
var = "pwr_array_area"
type = "Area"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "s"
var = "pwr_array_areal_density"
type = "Ratio"

[[algorithm.step]]
number = 1
text = "multiply the deployed area by the areal density"
binds = "m"
type = "Mass"

[view]
kind = "number"

