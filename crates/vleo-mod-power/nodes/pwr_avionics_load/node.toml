# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "pwr_avionics_load"
label = "Avionics and housekeeping load"
folder = "pwr_avionics_load"   # frozen at seed; renaming the label never moves the directory
subsystem = "power"
parent = "l3_power"
kind = "declared"
owner = "avionics"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 580
state = "published"

[question]
text = "What does the on-board computer, the harness electronics and the housekeeping draw?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "The power drawn by the on-board computer, the wiring electronics and general housekeeping: 35 watts. It is one of the loads the power system must supply."
breaks = "It is one declared figure. Below 5 watts no spacecraft avionics set runs, and above 500 watts the avionics would dominate the power supply, which no design in this class does."
by = "an assistant, from what this sheet states — for its owner (avionics) to confirm"

[maths]
expression = "P_av = 35"
source = "orbitt_case_c1"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "P_av"
type = "Power"
unit = "Watt"
lower = 5.0
upper = 500.0
reason_lower = "below 5 W no spacecraft avionics set runs"
reason_upper = "above 500 W the avionics dominate the bus, which no design in this class does"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 35.0
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "next"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (avionics) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That the avionics and housekeeping draw 35 watts; the value is declared, confirmed by A. Rai on 2026-09-01, and the sheet gives no further reason for it."
breaks_if = "A power budget for the chosen avionics that differs from 35 watts."
relation = "P_av = 35"
source = "orbitt_case_c1"
