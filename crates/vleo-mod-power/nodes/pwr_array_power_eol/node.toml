# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "pwr_array_power_eol"
label = "Array power, end of life"
folder = "pwr_array_power_eol"   # frozen at seed; renaming the label never moves the directory
subsystem = "power"
parent = "l3_power"
kind = "computed"
owner = "power"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 585
state = "published"

[question]
text = "How much does the array produce at the end of the mission?"
note = "Every power budget in this tree closes against this number, not against the beginning-of-life one."

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How many watts the solar array still produces at the end of the mission, after ageing and after the loss from running hotter than its rating. Every power budget in the design closes against this number."
breaks = "It starts from the new array's output and applies exactly two reductions, ageing and temperature; any other loss is not in it. It cannot exceed the beginning-of-life output, so a result above that is wrong."
wrong = "That the power budget can be closed against what the new array produces. Every power budget in this tree closes against this end-of-life number, not the beginning-of-life one."
by = "an assistant, from what this sheet states — for its owner (power) to confirm"

[maths]
expression = "P_eol = P_bol*f_deg*f_T"
source = "larson_wertz"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "P_eol"
type = "Power"
unit = "Watt"
lower = 0.0
upper = 50000.0
reason_lower = "array output cannot be negative"
reason_upper = "cannot exceed the beginning-of-life output"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "p"
var = "pwr_array_power_bol"
type = "Power"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "f"
var = "pwr_degradation"
type = "Ratio"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "ft"
var = "pwr_cell_derating"
type = "Ratio"

[[algorithm.step]]
number = 1
text = "apply both the ageing degradation and the temperature derating to the beginning-of-life output"
binds = "pe"
type = "Power"

[view]
kind = "number"

[[version]]
n = 1
release = "next"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (power) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "The relation as stated and cited to larson_wertz, applying both the ageing degradation and the temperature derating to the beginning-of-life output, not yet derived on the sheet."
breaks_if = "A derivation or comparison with larson_wertz that disagrees, or an end-of-life output above the beginning-of-life output."
relation = "P_eol = P_bol*f_deg*f_T"
source = "larson_wertz"
