# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "pwr_array_power_eol"
label = "Array power, end of life"
folder = "array_power_eol"   # frozen at seed; renaming the label never moves the directory
subsystem = "power"
parent = "power"
kind = "computed"
owner = "power"
tier = "A"
state = "published"

[question]
text = "How much does the array produce at the end of the mission?"
note = "Every power budget in this tree closes against this number, not against the beginning-of-life one."

[maths]
expression = "P_eol = P_bol*f_deg*f_T"
source = "larson_wertz"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "P_eol"
type = "Power"
unit = "Watt"
lower = 0.0
upper = 50000.0
reason_lower = "array output cannot be negative"
reason_upper = "cannot exceed the beginning-of-life output"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "p"
var = "pwr_array_power_bol"
type = "Power"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "f"
var = "pwr_degradation"
type = "Ratio"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "ft"
var = "pwr_cell_derating"
type = "Ratio"

[[algorithm.step]]
number = 1
text = "apply both the ageing degradation and the temperature derating to the beginning-of-life output"
binds = "pe"
type = "Power"

[view]
kind = "number"

