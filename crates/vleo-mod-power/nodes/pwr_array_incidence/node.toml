# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "pwr_array_incidence"
label = "Mean solar incidence angle on the array"
folder = "pwr_array_incidence"   # frozen at seed; renaming the label never moves the directory
subsystem = "power"
parent = "l3_power"
kind = "declared"
owner = "power"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 574
state = "published"

[question]
text = "At what mean angle does the sunlight strike the array over an orbit?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "The average angle at which sunlight hits the solar array over an orbit: 25 degrees away from straight on. The further from straight on, the less power the array collects."
breaks = "It is one average angle for the whole orbit, not the angle at any moment. Zero is the best case of light striking straight on, and above 85 degrees almost nothing is collected and the array is not pointed at the Sun in any useful sense."
by = "an assistant, from what this sheet states — for its owner (power) to confirm"

[maths]
expression = "theta_s = 25"
source = "larson_wertz"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "theta_s"
type = "Angle"
unit = "Degree"
lower = 0.0
upper = 85.0
reason_lower = "zero is normal incidence, the best case and the limit"
reason_upper = "above 85 degrees the cosine loss leaves almost nothing and the array is not pointed at the Sun in any useful sense"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 25.0
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "next"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (power) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That the mean incidence angle is 25 degrees; the value is declared, confirmed by A. Rai on 2026-09-01, and the sheet gives no further reason for it."
breaks_if = "A pointing or attitude analysis for this orbit giving a different average angle between sunlight and the array."
relation = "theta_s = 25"
source = "larson_wertz"
