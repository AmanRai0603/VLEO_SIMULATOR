[package]
name = "vleo-server"
description = "The local server: the interface assets and the engine from one origin on loopback. The daemon starts it as a program; the Python package starts it inside python.exe. One server, so the two cannot disagree."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
vleo-modules = { workspace = true, features = ["std"] }
vleo-bus = { workspace = true, features = ["std"] }
vleo-core = { workspace = true, features = ["std"] }
vleo-units = { workspace = true, features = ["std"] }
vleo-data = { workspace = true }
# The sheet loader, so a face can be served the declaration form. This crate
# reads what a sheet means from the single implementation of it; the
# alternative was a second copy of the form in JavaScript, which would drift
# and look complete while doing it.
vleo-sheet = { workspace = true }
# Today's design is built from the groups' sealed releases, read, sealed and
# checked by the one library every design file goes through.
vleo-files = { path = "../vleo-files" }
# The design file a kit carries in place of the node folders (design.vleo),
# read through the same interface as the folders.
vleo-design = { workspace = true }

[dev-dependencies]
# Reads contract/routes.toml and the manual in the contract tests.
toml = { workspace = true }
# Changes one row inside a design file, to prove a file from another release
# runs as it states.
rusqlite = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
