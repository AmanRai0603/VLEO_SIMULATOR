# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "gnc_total_disturbance"
label = "Total disturbance torque"
folder = "total_disturbance"   # frozen at seed; renaming the label never moves the directory
subsystem = "gnc"
parent = "sys_point"
kind = "computed"
owner = "gnc"
tier = "A"
layer = 2   # 1 management · 2 the system · 3 subsystem · 4 the run
state = "published"

[question]
text = "What is the worst-case disturbance torque the control system has to answer?"
note = "Summed, not root-sum-squared. These are biases that can and do align, and a wheel sized on their RSS saturates the first time they do."

[maths]
expression = "T = |T_aero| + |T_gg| + |T_srp| + |T_mag|"
source = "larson_wertz"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "T_dis"
type = "Torque"
unit = "NewtonMetre"
lower = 0.0
upper = 5.0
reason_lower = "a torque magnitude cannot be negative"
reason_upper = "above 5 N.m the vehicle is uncontrollable by any actuator that fits it"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "ta"
var = "aero_torque"
type = "Torque"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "tg"
var = "gnc_gravity_gradient_torque"
type = "Torque"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "ts"
var = "gnc_solar_torque"
type = "Torque"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "tm"
var = "gnc_magnetic_torque"
type = "Torque"

[[algorithm.step]]
number = 1
text = "sum the magnitudes rather than root-sum-squaring them"
binds = "t"
type = "Torque"

[view]
kind = "number"

