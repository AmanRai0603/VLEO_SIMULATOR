# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "gnc_pointing_error"
label = "Pointing error, three sigma"
folder = "pointing_error"   # frozen at seed; renaming the label never moves the directory
subsystem = "gnc"
parent = "sys_point"
kind = "computed"
owner = "gnc"
tier = "A"
layer = 2   # 1 management · 2 the system · 3 subsystem · 4 the run
state = "published"

[question]
text = "How accurately does the payload point?"
note = "Root-sum-squared, unlike the disturbance torques above. These terms are genuinely independent, and summing them linearly would give a budget nothing could ever meet."

[maths]
expression = "sigma = sqrt(sum of squares of the independent contributors)"
source = "larson_wertz"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "sig_pt"
type = "Angle"
unit = "Arcsecond"
lower = 0.0
upper = 10800.0
reason_lower = "a pointing error cannot be negative"
reason_upper = "above three degrees no payload in this design produces a usable product"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "sen"
var = "gnc_sensor_noise"
type = "Angle"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "ali"
var = "gnc_alignment_error"
type = "Angle"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "ctl"
var = "gnc_control_error"
type = "Angle"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "thm"
var = "gnc_thermal_distortion"
type = "Angle"

[[algorithm.step]]
number = 1
text = "root-sum-square the four independent contributors and scale to three sigma"
binds = "s"
type = "Angle"

[contributes]
kpis = ["kpi_geolocation"]

[view]
kind = "bar"
y = "gnc_pointing_error"

