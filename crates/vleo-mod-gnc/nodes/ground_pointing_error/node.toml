# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "gnc_ground_pointing_error"
label = "Ground pointing error"
folder = "ground_pointing_error"   # frozen at seed; renaming the label never moves the directory
subsystem = "gnc"
parent = "l3_acs"
kind = "computed"
owner = "gnc"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
state = "published"

[question]
text = "How far off the ground does the pointing error put the aim point?"

[maths]
expression = "e = sigma*d"
source = "larson_wertz"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "e_gnd"
type = "Length"
unit = "Metre"
lower = 0.0
upper = 100000.0
reason_lower = "a ground error cannot be negative"
reason_upper = "above 100 km the pointing is not usable for any payload here"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "s"
var = "gnc_pointing_error"
type = "Angle"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "d"
var = "orbit_slant_range"
type = "Length"

[[algorithm.step]]
number = 1
text = "multiply the pointing error by the slant range"
binds = "e"
type = "Length"

[contributes]
kpis = ["kpi_geolocation"]

[view]
kind = "number"

