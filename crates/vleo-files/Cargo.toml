[package]
name = "vleo-files"
description = "The one library that reads, writes and checks every design file (docs/OPERATING_1_0.md, section 10), compiled for the installed application and for the page. So far: the keys — a person's key made, locked by their passphrase, a signature made and checked (section 14); and the one schema every file is, a file as its rows, what each kind of file says about itself and the versions it follows (sections 10 and 13), read and written as SQLite when installed; and the upgrade of a group's file from before 1.0, with nothing dropped, its fingerprint and the programme manager's anchor (section 16)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
# The cryptography, adopted through ADOPTION.lock (docs/PLAN_1_0.md, phase C):
# signatures, the digest every fingerprint is, the passphrase's key
# derivation, and the cipher that locks a private key. All pure Rust, so the
# same code compiles for wasm32 and the page and the application agree.
ed25519-dalek = "3"
sha2 = "0.11"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
hmac = "0.13"
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
zeroize = "1"

# Randomness comes from the operating system when installed; in the page the
# caller passes bytes from the browser's crypto.getRandomValues, so the page's
# build carries no randomness of its own.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.3"
# The file on disk, installed. The page reads its files with its own SQLite
# (web/vendor/sqlite) and hands the library the rows.
rusqlite = { workspace = true }

[dev-dependencies]
rusqlite = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
