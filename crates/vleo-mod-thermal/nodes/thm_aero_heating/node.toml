# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "thm_aero_heating"
label = "Free-molecular aerodynamic heating"
folder = "thm_aero_heating"   # frozen at seed; renaming the label never moves the directory
subsystem = "thm"
parent = "l3_thermal"
kind = "computed"
owner = "thermal"
tier = "C"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 604
state = "published"

[question]
text = "How much does the air itself heat the spacecraft?"
note = "Usually neglected, and at 200 km it should not be. It is a real term in the balance of a small, fast, low-flying vehicle."

[maths]
expression = "Q = 0.5*rho*V^3*A*C_h"
source = "larson_wertz"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "Q_aero"
type = "Power"
unit = "Watt"
lower = 0.0
upper = 100000.0
reason_lower = "heating cannot be negative"
reason_upper = "above 100 kW the vehicle is re-entering"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "rho"
var = "env_mass_density"
type = "MassDensity"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "v"
var = "orbit_velocity"
type = "Velocity"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "a"
var = "aero_frontal_area"
type = "Area"

[[algorithm.step]]
number = 1
text = "form the incident kinetic energy flux and apply a heat transfer coefficient of 0.9"
binds = "q"
type = "Power"

[view]
kind = "number"

