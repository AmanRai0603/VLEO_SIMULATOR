# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "thm_absorbed_ir"
label = "Absorbed Earth infrared"
folder = "thm_absorbed_ir"   # frozen at seed; renaming the label never moves the directory
subsystem = "thm"
parent = "l3_thermal"
kind = "computed"
owner = "thermal"
tier = "B"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 603
state = "published"

[question]
text = "How much of the Earth's own thermal emission does the spacecraft absorb?"
note = "Unlike albedo this does not switch off in eclipse, which is what stops a low-orbiting spacecraft getting as cold as an intuition built on higher orbits expects."

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How much of the Earth's own heat radiation the spacecraft absorbs, in watts. Unlike reflected sunlight it does not switch off in eclipse, and that is what stops a low-orbiting spacecraft getting as cold as intuition built on higher orbits expects."
breaks = "It applies the Earth's mean outgoing heat radiation to the spacecraft's frontal area, so it is one average figure rather than the load on a particular surface. The sheet states no assumptions and no derivation."
wrong = "That a low-orbiting spacecraft gets as cold in eclipse as intuition from higher orbits suggests. The Earth's heat radiation keeps arriving in eclipse, and it stops that happening."
by = "an assistant, from what this sheet states — for its owner (thermal) to confirm"

[maths]
expression = "Q = q_IR*A*eps*F"
source = "larson_wertz"

[method]
text = """
# Transcribed from crates/vleo-mod-thermal/nodes/thm_absorbed_ir/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
return absorbed_earth_ir(a, e, f)
"""
by = ""
transcribed_from = "crates/vleo-mod-thermal/nodes/thm_absorbed_ir/model.rs"
checked_by = "Aman Rai"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "Q_ir"
type = "Power"
unit = "Watt"
lower = 0.0
upper = 100000.0
reason_lower = "absorbed power cannot be negative"
reason_upper = "above 100 kW the surface is not this spacecraft"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "a"
var = "aero_frontal_area"
type = "Area"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "e"
var = "thm_emissivity"
type = "Ratio"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "f"
var = "thm_view_factor"
type = "Ratio"

[[algorithm.step]]
number = 1
text = "apply the mean outgoing longwave radiation through the view factor"
binds = "q"
type = "Power"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (thermal) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "Its relation as stated and cited from larson_wertz, using the mean outgoing longwave radiation, not yet derived on the sheet."
breaks_if = "A derivation or a comparison with larson_wertz that disagrees, or a result above 100 kilowatts, which would mean the surface is not this spacecraft."
relation = "Q = q_IR*A*eps*F"
source = "larson_wertz"
