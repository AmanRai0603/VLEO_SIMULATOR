# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "thm_absorbed_ir"
label = "Absorbed Earth infrared"
folder = "thm_absorbed_ir"   # frozen at seed; renaming the label never moves the directory
subsystem = "thm"
parent = "l3_thermal"
kind = "computed"
owner = "thermal"
tier = "B"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 602
state = "published"

[question]
text = "How much of the Earth's own thermal emission does the spacecraft absorb?"
note = "Unlike albedo this does not switch off in eclipse, which is what stops a low-orbiting spacecraft getting as cold as an intuition built on higher orbits expects."

[maths]
expression = "Q = q_IR*A*eps*F"
source = "larson_wertz"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "Q_ir"
type = "Power"
unit = "Watt"
lower = 0.0
upper = 100000.0
reason_lower = "absorbed power cannot be negative"
reason_upper = "above 100 kW the surface is not this spacecraft"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "a"
var = "aero_frontal_area"
type = "Area"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "e"
var = "thm_emissivity"
type = "Ratio"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "f"
var = "thm_view_factor"
type = "Ratio"

[[algorithm.step]]
number = 1
text = "apply the mean outgoing longwave radiation through the view factor"
binds = "q"
type = "Power"

[view]
kind = "number"

