# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "thm_internal_dissipation"
label = "Internal dissipation"
folder = "internal_dissipation"   # frozen at seed; renaming the label never moves the directory
subsystem = "thm"
parent = "thermal"
kind = "declared"
owner = "thermal"
tier = "A"
state = "published"

[question]
text = "How much of the electrical power ends up as heat inside the spacecraft?"
note = "Left at zero and overridden by the computed dissipation node. It exists so a case can pin a measured value in place of the computed one."

[maths]
expression = "Q_int = 0"
source = "larson_wertz"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "Q_int"
type = "Power"
unit = "Watt"
lower = 0.0
upper = 20000.0
reason_lower = "dissipation cannot be negative"
reason_upper = "above 20 kW nothing in this mass class dissipates that much"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 0.0
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

