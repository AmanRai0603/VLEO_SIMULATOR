# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "thm_internal_dissipation"
label = "Internal dissipation"
folder = "thm_internal_dissipation"   # frozen at seed; renaming the label never moves the directory
subsystem = "thm"
parent = "l3_thermal"
kind = "declared"
owner = "thermal"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 598
state = "published"

[question]
text = "How much of the electrical power ends up as heat inside the spacecraft?"
note = "Left at zero and overridden by the computed dissipation node. It exists so a case can pin a measured value in place of the computed one."

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How much of the electrical power ends up as heat inside the spacecraft, set here to zero watts. It is a placeholder: the computed dissipation replaces it, and it exists so a case can pin a measured value instead."
breaks = "Zero is not a claim that nothing heats the inside; it holds only because the computed value overrides it. Read on its own, it would mean no internal heat at all."
wrong = "That the spacecraft makes no internal heat. The zero is left in place and overridden by the computed dissipation; the row exists so a case can pin a measured value."
by = "an assistant, from what this sheet states — for its owner (thermal) to confirm"

[maths]
expression = "Q_int = 0"
source = "larson_wertz"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "Q_int"
type = "Power"
unit = "Watt"
lower = 0.0
upper = 20000.0
reason_lower = "dissipation cannot be negative"
reason_upper = "above 20 kW nothing in this mass class dissipates that much"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 0.0
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (thermal) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "The declared 0.0 watts stands only as a placeholder that the computed dissipation overrides; A. Rai confirmed it on 2026-09-01."
breaks_if = "The computed dissipation stops overriding it, or a case pins a measured value in its place."
relation = "Q_int = 0"
source = "larson_wertz"
