# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "thm_absorbed_solar"
label = "Absorbed direct solar"
folder = "thm_absorbed_solar"   # frozen at seed; renaming the label never moves the directory
subsystem = "thm"
parent = "l3_thermal"
kind = "computed"
owner = "thermal"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 601
state = "published"

[question]
text = "How much heat does direct sunlight put into the spacecraft?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How much heat direct sunlight puts into the spacecraft, in watts: the Sun's standard strength at the Earth, falling on the lit area at an average angle, times how readily the surface absorbs it."
breaks = "It uses one mean angle of incidence, taken from the solar array, and the spacecraft's frontal area, so it is an average rather than the load on a given surface at a given moment. The sheet states no assumptions and no derivation."
by = "an assistant, from what this sheet states — for its owner (thermal) to confirm"

[maths]
expression = "Q = S*A*alpha_s*cos(theta)"
source = "larson_wertz"

[method]
text = """
# Transcribed from crates/vleo-mod-thermal/nodes/thm_absorbed_solar/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
return absorbed_solar(a, al, th)
"""
by = ""
transcribed_from = "crates/vleo-mod-thermal/nodes/thm_absorbed_solar/model.rs"
checked_by = "Aman Rai"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "Q_sol"
type = "Power"
unit = "Watt"
lower = 0.0
upper = 100000.0
reason_lower = "absorbed power cannot be negative"
reason_upper = "above 100 kW the illuminated area is not this spacecraft"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "a"
var = "aero_frontal_area"
type = "Area"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "al"
var = "thm_absorptivity"
type = "Ratio"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "th"
var = "pwr_array_incidence"
type = "Angle"

[[algorithm.step]]
number = 1
text = "apply the solar constant to the illuminated area at the mean incidence"
binds = "q"
type = "Power"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (thermal) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "Its relation as stated and cited from larson_wertz, using the solar constant at a mean incidence, not yet derived on the sheet."
breaks_if = "A derivation or a comparison with larson_wertz that disagrees, or a result above 100 kilowatts, which would mean the illuminated area is not this spacecraft."
relation = "Q = S*A*alpha_s*cos(theta)"
source = "larson_wertz"
