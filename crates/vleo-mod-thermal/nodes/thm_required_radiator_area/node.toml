# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "thm_required_radiator_area"
label = "Radiator area required"
folder = "thm_required_radiator_area"   # frozen at seed; renaming the label never moves the directory
subsystem = "thm"
parent = "l3_thermal"
kind = "computed"
owner = "thermal"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 607
state = "published"

[question]
text = "How much radiator would be needed to hold the temperature limit?"
note = "The inverse question, and the one a thermal design actually asks."

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How much radiator, in square metres, the spacecraft would need to get rid of its heat while staying at its temperature limit. It is the inverse of the settling-temperature question, and the one a thermal design actually asks."
breaks = "Its only heat input is the heat the spacecraft must reject; the surroundings enter only as a fixed effective background of 250 kelvin. The sheet states no assumptions and no derivation. Above 1000 square metres the design does not close and the dissipation is wrong."
by = "an assistant, from what this sheet states — for its owner (thermal) to confirm"

[maths]
expression = "A = Q/(eps*sigma*(T^4 - T_sink^4))"
source = "larson_wertz"

[method]
text = """
# Transcribed from crates/vleo-mod-thermal/nodes/thm_required_radiator_area/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
# Constants the code held, written out here as it held them: 250 [K].
return required_radiator_area(q, e, lim, 250 [K])
"""
by = ""
transcribed_from = "crates/vleo-mod-thermal/nodes/thm_required_radiator_area/model.rs"
checked_by = ""

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "A_req"
type = "Area"
unit = "SquareMetre"
lower = 0.0
upper = 1000.0
reason_lower = "a required area cannot be negative"
reason_upper = "above 1000 m2 the design does not close and the answer is that the dissipation is wrong"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "q"
var = "thm_dissipation"
type = "Power"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "e"
var = "thm_emissivity"
type = "Ratio"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "lim"
var = "thm_temperature_limit"
type = "Temperature"

[[algorithm.step]]
number = 1
text = "solve the grey-body balance for area against a 250 K effective sink"
binds = "a"
type = "Area"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (thermal) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "Its relation as stated and cited from larson_wertz, radiating against a 250 kelvin effective sink, not yet derived on the sheet."
breaks_if = "A derivation or a comparison with larson_wertz that disagrees, or evidence that 250 kelvin is not the right effective background for this orbit."
relation = "A = Q/(eps*sigma*(T^4 - T_sink^4))"
source = "larson_wertz"
