# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "thm_absorptivity"
label = "Solar absorptivity"
folder = "thm_absorptivity"   # frozen at seed; renaming the label never moves the directory
subsystem = "thm"
parent = "l3_thermal"
kind = "declared"
owner = "thermal"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 594
state = "published"

[question]
text = "What fraction of incident sunlight does the external surface absorb?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "The share of the sunlight falling on the spacecraft's outer surface that the surface absorbs: 0.3, or 30 per cent. It is one of the numbers the thermal margins are built from."
breaks = "It is one number for the whole outer surface, and the sheet gives no reason for 0.3. Its lower limit notes that no space-qualified coating stays below 0.05 after exposure to atomic oxygen, so a coating's value is not fixed by what it was on the ground."
by = "an assistant, from what this sheet states — for its owner (thermal) to confirm"

[maths]
expression = "alpha_s = 0.3"
source = "larson_wertz"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "alpha_s"
type = "Ratio"
unit = "One"
lower = 0.05
upper = 1.0
reason_lower = "below 0.05 no space-qualified coating is that reflective after atomic-oxygen exposure"
reason_upper = "unity is a perfect black body, the limit rather than a coating"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 0.3
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (thermal) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "The declared 0.3 is right for this design's outer surface; the sheet cites a standard reference but gives no reason for the value, which A. Rai confirmed on 2026-09-01."
breaks_if = "A measured or specified absorptivity for this design's coating, including after atomic-oxygen exposure, that differs from 0.3."
relation = "alpha_s = 0.3"
source = "larson_wertz"
