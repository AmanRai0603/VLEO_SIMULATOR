# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "thm_dissipation"
label = "Heat to reject"
folder = "thm_dissipation"   # frozen at seed; renaming the label never moves the directory
subsystem = "thm"
parent = "l3_thermal"
kind = "computed"
owner = "thermal"
tier = "B"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 599
state = "published"

[question]
text = "How much heat does the spacecraft have to get rid of?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How much heat the spacecraft has to get rid of, in watts. Everything drawn from the power system ends up as heat, except what leaves as the thruster beam's kinetic power and as radiated radio power."
breaks = "It ignores the small share of power stored in the battery over a cycle, which averages to zero over an orbit, so it is an orbit-average figure. The sheet gives no derivation."
wrong = "That all the power drawn becomes heat. The thruster beam's kinetic power and the radiated radio power leave the spacecraft and are taken off."
by = "an assistant, from what this sheet states — for its owner (thermal) to confirm"

[maths]
expression = "Q = P_dem - P_rf - P_beam"
source = "larson_wertz"

[[assumption]]
text = "All bus power that is not beam kinetic energy or radiated radio power becomes heat"
fails_when = "true to within the accuracy of this budget; it ignores the small fraction stored in the battery over a cycle, which averages to zero over an orbit"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "Q"
type = "Power"
unit = "Watt"
lower = 0.0
upper = 50000.0
reason_lower = "heat to reject cannot be negative"
reason_upper = "above 50 kW nothing in this mass class dissipates that much"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "dem"
var = "pwr_demand"
type = "Power"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "pj"
var = "prop_jet_power"
type = "Power"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "tx"
var = "com_tx_power"
type = "Power"

[[algorithm.step]]
number = 1
text = "everything drawn from the bus becomes heat except the beam kinetic power and the radiated radio-frequency power"
binds = "q"
type = "Power"

[view]
kind = "number"

[[version]]
n = 1
release = "next"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (thermal) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "Its relation as stated and cited from larson_wertz, not yet derived on the sheet, and the assumption that all bus power not leaving as beam kinetic energy or radiated radio power becomes heat."
breaks_if = "Energy stored in the battery stops averaging to zero over an orbit, or a result above 50 kilowatts, which nothing in this mass class dissipates."
relation = "Q = P_dem - P_rf - P_beam"
source = "larson_wertz"
