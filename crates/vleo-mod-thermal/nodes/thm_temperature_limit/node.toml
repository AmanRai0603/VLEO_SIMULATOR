# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "thm_temperature_limit"
label = "Upper temperature limit"
folder = "thm_temperature_limit"   # frozen at seed; renaming the label never moves the directory
subsystem = "thm"
parent = "l3_thermal"
kind = "declared"
owner = "thermal"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 597
state = "published"

[question]
text = "What is the highest temperature the electronics may reach?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "The highest temperature the spacecraft's electronics may reach: 323 kelvin. The thermal design has to keep them at or below it."
breaks = "It is one limit for all the electronics, and the sheet gives no reason for 323 beyond the standard it cites. Its bounds say no electronics box in this design is qualified to operate below 273 kelvin or survives above 400."
by = "an assistant, from what this sheet states — for its owner (thermal) to confirm"

[maths]
expression = "T_max = 323"
source = "ecss_e_st_10_02"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "T_max"
type = "Temperature"
unit = "Kelvin"
lower = 273.0
upper = 400.0
reason_lower = "below 273 K no electronics box in this design is qualified to operate"
reason_upper = "above 400 K no electronics box in this design survives"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 323.0
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (thermal) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "The declared 323 kelvin is the upper limit for this design's electronics, from the standard the sheet cites and confirmed by A. Rai on 2026-09-01; no further reason is given."
breaks_if = "A qualification temperature for this design's electronics boxes that differs from 323 kelvin."
relation = "T_max = 323"
source = "ecss_e_st_10_02"
