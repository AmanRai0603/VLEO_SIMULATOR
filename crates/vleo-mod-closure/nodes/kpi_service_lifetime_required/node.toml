# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "kpi_service_lifetime_required"
label = "Service lifetime — required"
folder = "kpi_service_lifetime_required"   # frozen at seed; renaming the label never moves the directory
subsystem = "kpi"
parent = "l3_x_closure"
kind = "declared"
owner = "systems"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 1319
state = "published"
# years of service: it must last at least 5
sense = ">="

[question]
text = "What does the customer require for service lifetime?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How long the customer requires the service to last: at least 5 years. The design's achieved lifetime must reach it."
breaks = "The sheet gives the number and its source but no reasoning for it. Below five weeks the satellite is not a mission, and above 25 years the debris mitigation standard would be violated."
by = "an assistant, from what this sheet states — for its owner (systems) to confirm"

[maths]
expression = "R_req = 5"
source = "orbitt_case_c1"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "R_req"
type = "Time"
unit = "Year"
lower = 0.1
upper = 25.0
reason_lower = "below five weeks the satellite is not a mission"
reason_upper = "above 25 years the debris mitigation standard is violated"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 5.0
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (systems) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That the declared 5 years is the customer's service lifetime requirement, taken from its cited reference case and confirmed by A. Rai on 2026-09-01."
breaks_if = "A customer requirement stating a service lifetime other than 5 years."
relation = "R_req = 5"
source = "orbitt_case_c1"
