# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "kpi_thrust_margin_required"
label = "Thrust to drag closure — required"
folder = "kpi_thrust_margin_required"   # frozen at seed; renaming the label never moves the directory
subsystem = "kpi"
parent = "l3_x_closure"
kind = "declared"
owner = "systems"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 1323
state = "published"
# thrust over drag: it must reach 1, which is the design closing at all
sense = ">="

[question]
text = "What does the customer require for thrust to drag closure?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "Whether the engine's push can at least match the air's drag: the required ratio of thrust to drag is 1. Reaching 1 is what it means for the design to close at all."
breaks = "The sheet gives the number and a single source, with no margin above 1 stated. Below 0.1 it is not a closure requirement, and above 5 it is not one an air-breathing design is written against."
by = "an assistant, from what this sheet states — for its owner (systems) to confirm"

[maths]
expression = "R_req = 1"
source = "romano2021"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "R_req"
type = "Ratio"
unit = "One"
lower = 0.1
upper = 5.0
reason_lower = "a required ratio below 0.1 is not a closure requirement"
reason_upper = "above 5 the requirement is not one an air-breathing design is written against"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 1.0
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "next"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (systems) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That the declared 1 is the right thrust-to-drag requirement, the point at which the design closes at all, taken from its cited source and confirmed by A. Rai on 2026-09-01."
breaks_if = "A programme decision to require thrust to exceed drag by some margin, or a requirement stating a ratio other than 1."
relation = "R_req = 1"
source = "romano2021"
