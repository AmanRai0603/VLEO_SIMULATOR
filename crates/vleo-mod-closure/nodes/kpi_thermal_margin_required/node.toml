# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "kpi_thermal_margin_required"
label = "Thermal margin — required"
folder = "kpi_thermal_margin_required"   # frozen at seed; renaming the label never moves the directory
subsystem = "kpi"
parent = "l3_x_closure"
kind = "declared"
owner = "systems"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 1327
state = "published"
# kelvin of headroom: it must reach 10 K
sense = ">="

[question]
text = "What does the customer require for thermal margin?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How much temperature headroom the design must keep: 10 kelvin. The achieved thermal margin must reach it."
breaks = "The sheet gives the number and cites a European space standard as its source, with no further reasoning. A negative required margin would not be a requirement; above 100 kelvin the requirement is not one this design is written against."
by = "an assistant, from what this sheet states — for its owner (systems) to confirm"

[maths]
expression = "R_req = 10"
source = "ecss_e_st_10_02"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "R_req"
type = "Temperature"
unit = "Kelvin"
lower = 0.0
upper = 100.0
reason_lower = "a negative required margin is not a requirement"
reason_upper = "above 100 K the requirement is not one this design is written against"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 10.0
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (systems) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That the declared 10 kelvin is the right thermal margin requirement, taken from its cited European space standard and confirmed by A. Rai on 2026-09-01."
breaks_if = "A programme or standard requirement calling for a thermal margin other than 10 kelvin."
relation = "R_req = 10"
source = "ecss_e_st_10_02"
