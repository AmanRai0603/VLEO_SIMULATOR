# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "kpi_geolocation_required"
label = "Emitter geolocation accuracy — required"
folder = "kpi_geolocation_required"   # frozen at seed; renaming the label never moves the directory
subsystem = "kpi"
parent = "l3_x_closure"
kind = "declared"
owner = "systems"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 1311
state = "published"
# an error in metres: it must stay inside 500 m, and a larger error is worse
sense = "<="

[question]
text = "What does the customer require for emitter geolocation accuracy?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How precisely the customer requires the system to locate a radio emitter on the ground: to within 500 metres. The design's achieved location error must stay at or under it."
breaks = "The sheet gives the number and a different reference case from its siblings as source, but no reasoning. Below one metre no time-difference location system in this class achieves it; above 100 kilometres the product carries no information."
wrong = "Reading 500 metres as something to reach. It is an error, so it must stay inside 500 metres, and a larger error is worse."
by = "an assistant, from what this sheet states — for its owner (systems) to confirm"

[maths]
expression = "R_req = 500"
source = "orbitt_case_c2"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "R_req"
type = "Length"
unit = "Metre"
lower = 1.0
upper = 100000.0
reason_lower = "below one metre no time-difference system in this class achieves it"
reason_upper = "above 100 km the product carries no information"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 500.0
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (systems) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That the declared 500 metres is the customer's geolocation accuracy requirement, taken from its cited reference case and confirmed by A. Rai on 2026-09-01."
breaks_if = "A customer requirement stating a geolocation accuracy other than 500 metres."
relation = "R_req = 500"
source = "orbitt_case_c2"
