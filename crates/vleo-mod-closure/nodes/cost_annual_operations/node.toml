# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "cost_annual_operations"
label = "Annual operations cost"
folder = "cost_annual_operations"   # frozen at seed; renaming the label never moves the directory
subsystem = "cost"
parent = "l3_x_closure"
kind = "declared"
owner = "programme"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 707
state = "published"

[question]
text = "What does running the constellation cost each year?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "What it costs each year to run the constellation, its ground segment and its team: 4.5 million US dollars."
breaks = "It is one yearly figure, not built up from the work it pays for. Below 100 thousand dollars a year no ground segment and team exist, and above 200 million a year the programme is not the one costed here."
by = "an assistant, from what this sheet states — for its owner (programme) to confirm"

[maths]
expression = "C_ops = 4.5"
source = "orbitt_case_c1"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "C_ops"
type = "Money"
unit = "MillionUsDollar"
lower = 0.1
upper = 200.0
reason_lower = "below 100 thousand a year no ground segment and team exist"
reason_upper = "above 200 million a year the programme is not the one costed here"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 4.5
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (programme) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That 4.5 million US dollars a year is the operations cost of this constellation, from the source the sheet cites (orbitt_case_c1), confirmed by A. Rai on 2026-09-01."
breaks_if = "An operations quote or staffing plan for this constellation costing other than 4.5 million US dollars a year."
relation = "C_ops = 4.5"
source = "orbitt_case_c1"
