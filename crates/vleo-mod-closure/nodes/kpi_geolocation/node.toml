# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "kpi_geolocation"
label = "Emitter geolocation accuracy — closure"
folder = "kpi_geolocation"   # frozen at seed; renaming the label never moves the directory
subsystem = "kpi"
parent = "l3_x_closure"
kind = "kpi"
owner = "systems"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 1312
state = "published"

[question]
text = "Are emitters located accurately enough?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "Whether emitters on the ground are located accurately enough: the signed margin between the payload's geolocation error and the error allowed, as a fraction of the requirement, read in the direction the requirement is stated."
breaks = "It is only as good as the geolocation error and the requirement it compares. A margin below minus 10000 per cent means the inputs are not the ones the requirement was written against; above 100000 per cent the requirement is not the one that binds."
by = "an assistant, from what this sheet states — for its owner (systems) to confirm"

[maths]
expression = "M = (achieved - required)/required, in the sense the requirement is stated"
source = "orbitt_case_c2"

[method]
text = """
# Transcribed from crates/vleo-mod-closure/nodes/kpi_geolocation/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
return margin_at_most(req, ach)
"""
by = ""
transcribed_from = "crates/vleo-mod-closure/nodes/kpi_geolocation/model.rs"
checked_by = "Aman Rai"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "M"
type = "Ratio"
unit = "One"
lower = -100.0
upper = 1000.0
reason_lower = "a margin below -10000% means the inputs are not the ones the requirement was written against"
reason_upper = "a margin above 100000% means the requirement is not the one that binds"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "req"
var = "kpi_geolocation_required"
type = "Length"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "ach"
var = "pay_geolocation_error"
type = "Length"

[[algorithm.step]]
number = 1
text = "compare achieved against required in the declared sense and return the signed fractional margin"
binds = "m"
type = "Ratio"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (systems) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "The margin comparison as stated and cited from orbitt_case_c2, not yet derived on the sheet, read in the sense the geolocation requirement declares."
breaks_if = "The requirement read in the wrong direction, or a margin below minus 10000 per cent or above 100000 per cent."
relation = "M = (achieved - required)/required, in the sense the requirement is stated"
source = "orbitt_case_c2"
