# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "cost_bus_recurring"
label = "Bus recurring cost, first unit"
folder = "cost_bus_recurring"   # frozen at seed; renaming the label never moves the directory
subsystem = "cost"
parent = "l3_x_closure"
kind = "computed"
owner = "programme"
tier = "C"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 709
state = "published"

[question]
text = "What does the first spacecraft bus cost to build?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "What the first spacecraft bus, the spacecraft apart from its payload, costs to build. It is estimated from dry mass by a fit to historical costs and escalated to 2026 money."
breaks = "It is a historical fit whose one-sigma scatter is 40 per cent, larger than most of the design decisions it would be used to compare. Above 10 billion dollars for one bus the relation is being fed a mass it was not fitted on."
wrong = "That a gap between two designs' estimates here shows which bus is cheaper. The fit's one-sigma residual is 40 per cent, larger than most of the differences it would be asked to compare."
by = "an assistant, from what this sheet states — for its owner (programme) to confirm"

[maths]
expression = "C = a*m_dry^b, escalated"
source = "nasa_cer"

[[assumption]]
text = "The historical fit applies to this class of spacecraft"
fails_when = "the fit's one-sigma residual is 40%, which is larger than most of the design decisions it would be used to compare"

[method]
text = """
# Transcribed from crates/vleo-mod-closure/nodes/cost_bus_recurring/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
# Constants the code held, written out here as it held them: a = 0.98; b = 0.72; base year 2020; 2026.
return cer_inflated(m, 0.98, 0.72, 2020, 2026, i)
"""
by = ""
transcribed_from = "crates/vleo-mod-closure/nodes/cost_bus_recurring/model.rs"
checked_by = "Aman Rai"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "C_bus"
type = "Money"
unit = "MillionUsDollar"
lower = 0.0
upper = 10000.0
reason_lower = "a cost cannot be negative"
reason_upper = "above 10 billion for one bus the relation is being fed a mass it was not fitted on"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "m"
var = "mass_dry"
type = "Mass"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "i"
var = "cost_inflation"
type = "Ratio"

[[algorithm.step]]
number = 1
text = "evaluate the bus cost estimating relation on dry mass and escalate to 2026"
binds = "c"
type = "Money"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (programme) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "The historical fit cited from nasa_cer applies to this class of spacecraft, with a one-sigma residual of 40%; the relation is not yet derived on the sheet."
breaks_if = "This class of spacecraft falls outside the historical fit, the dry mass lies beyond the masses it was fitted on, or a comparison with nasa_cer disagrees."
relation = "C = a*m_dry^b, escalated"
source = "nasa_cer"
