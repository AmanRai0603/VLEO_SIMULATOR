# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "kpi_cost_per_year_required"
label = "Cost per operational year — required"
folder = "kpi_cost_per_year_required"   # frozen at seed; renaming the label never moves the directory
subsystem = "kpi"
parent = "l3_x_closure"
kind = "declared"
owner = "systems"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 1321
state = "published"
# money spent: a year that costs more than the business case allows fails
sense = "<="

[question]
text = "What does the customer require for cost per operational year?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "The most the customer will pay for each year the system operates: 45 million US dollars. The design's achieved cost per operational year must stay at or under it."
breaks = "The sheet gives the number and its source but no reasoning for it. Below 100 thousand a year no programme of this size runs, and above 10 billion a year the programme is not the one being designed."
wrong = "Reading 45 million as a target to reach. It is a ceiling: a year that costs more than the business case allows fails."
by = "an assistant, from what this sheet states — for its owner (systems) to confirm"

[maths]
expression = "R_req = 45"
source = "orbitt_case_c1"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "R_req"
type = "Money"
unit = "MillionUsDollar"
lower = 0.1
upper = 10000.0
reason_lower = "below 100 thousand a year no programme of this size runs"
reason_upper = "above 10 billion a year the programme is not the one being designed"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 45.0
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "next"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (systems) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That the declared 45 million US dollars a year is the customer's cost ceiling for this design, taken from its cited reference case and confirmed by A. Rai on 2026-09-01."
breaks_if = "A business case or customer requirement stating a different allowable cost per operational year than 45 million US dollars."
relation = "R_req = 45"
source = "orbitt_case_c1"
