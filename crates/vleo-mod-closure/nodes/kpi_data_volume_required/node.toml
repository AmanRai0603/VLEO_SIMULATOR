# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "kpi_data_volume_required"
label = "Daily downlink volume — required"
folder = "kpi_data_volume_required"   # frozen at seed; renaming the label never moves the directory
subsystem = "kpi"
parent = "l3_x_closure"
kind = "declared"
owner = "systems"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 1317
state = "published"
# delivered volume: more is better, and 500 Gbit is the floor
sense = ">="

[question]
text = "What does the customer require for daily downlink volume?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How much data the customer requires the system to bring down to the ground each day: 500 gigabits. The design's achieved daily downlink must reach it; more is better."
breaks = "The sheet gives the number and its source but no reasoning for it. Below one gigabit a day the mission returns nothing useful, and above 10 petabits a day the ground segment is not the one costed."
wrong = "Reading 500 gigabits as a cap. It is a floor: more delivered volume is better, and 500 gigabits is the least acceptable."
by = "an assistant, from what this sheet states — for its owner (systems) to confirm"

[maths]
expression = "R_req = 500"
source = "orbitt_case_c1"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "R_req"
type = "DataVolume"
unit = "Gigabit"
lower = 1.0
upper = 10000000.0
reason_lower = "below one gigabit a day the mission returns nothing useful"
reason_upper = "above 10 petabits a day the ground segment is not the one costed"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 500.0
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (systems) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That the declared 500 gigabits a day is the customer's downlink requirement for this design, taken from its cited reference case and confirmed by A. Rai on 2026-09-01."
breaks_if = "A customer requirement stating a daily downlink volume other than 500 gigabits."
relation = "R_req = 500"
source = "orbitt_case_c1"
