# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "kpi_revisit_required"
label = "Mean revisit time — required"
folder = "kpi_revisit_required"   # frozen at seed; renaming the label never moves the directory
subsystem = "kpi"
parent = "l3_x_closure"
kind = "declared"
owner = "systems"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 1307
state = "published"
# hours between revisits: fewer hours is more often, so 6 h is a ceiling
sense = "<="

[question]
text = "What does the customer require for mean revisit time?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How often, on average, the customer requires the system to look at the same place again: at least every 6 hours. The design's achieved mean revisit time must be 6 hours or less."
breaks = "The sheet gives the number and its source but no reasoning for it. It is a mean, so it says nothing on its own about the longest gap. Below six minutes no constellation in this class achieves it; above 30 days the service is not the one being sold."
wrong = "Reading 6 hours as a floor. Fewer hours means more often, so 6 hours is a ceiling."
by = "an assistant, from what this sheet states — for its owner (systems) to confirm"

[maths]
expression = "R_req = 6"
source = "orbitt_case_c1"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "R_req"
type = "Time"
unit = "Hour"
lower = 0.1
upper = 720.0
reason_lower = "below six minutes no constellation in this class achieves it"
reason_upper = "above 30 days the service is not the one being sold"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 6.0
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "next"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (systems) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That the declared 6 hours is the customer's mean revisit requirement, taken from its cited reference case and confirmed by A. Rai on 2026-09-01."
breaks_if = "A customer requirement stating a mean revisit time other than 6 hours."
relation = "R_req = 6"
source = "orbitt_case_c1"
