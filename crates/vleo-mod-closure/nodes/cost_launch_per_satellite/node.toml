# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "cost_launch_per_satellite"
label = "Launch cost per satellite"
folder = "cost_launch_per_satellite"   # frozen at seed; renaming the label never moves the directory
subsystem = "cost"
parent = "l3_x_closure"
kind = "declared"
owner = "programme"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 706
state = "published"

[question]
text = "What does it cost to put one satellite in orbit?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "What it costs to put one satellite into orbit: 1.8 million US dollars. It is counted once for every satellite in the constellation."
breaks = "It is a single price per satellite, not a quote for a particular launch. Below 50 thousand dollars no launch service exists, and above 100 million per satellite the constellation is not the one costed here."
by = "an assistant, from what this sheet states — for its owner (programme) to confirm"

[maths]
expression = "C_lch = 1.8"
source = "orbitt_case_c1"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "C_lch"
type = "Money"
unit = "MillionUsDollar"
lower = 0.05
upper = 100.0
reason_lower = "below 50 thousand dollars no launch service exists"
reason_upper = "above 100 million per satellite the constellation is not the one costed here"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 1.8
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "next"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (programme) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That 1.8 million US dollars per satellite is the launch cost, from the source the sheet cites (orbitt_case_c1), confirmed by A. Rai on 2026-09-01."
breaks_if = "A launch quote for this constellation that works out to other than 1.8 million US dollars per satellite."
relation = "C_lch = 1.8"
source = "orbitt_case_c1"
