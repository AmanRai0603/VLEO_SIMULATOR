# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "pwr_margin"
label = "Power margin"
folder = "pwr_margin"   # frozen at seed; renaming the label never moves the directory
subsystem = "power"
parent = "l3_x_closure"
kind = "computed"
owner = "power"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 588
state = "published"

[question]
text = "Does the power system supply what the spacecraft asks for?"
note = "A margin silently corrected to zero is a design that drifted without anyone deciding to. This one is signed."

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "Whether the power system supplies what the spacecraft asks for: how far the power available exceeds or falls short of the power demanded, as a signed fraction of the demand. A negative answer is a shortfall, and it is reported as one."
breaks = "It compares two single figures, available and demanded power, so it is only as good as they are. The sheet treats a margin below minus one hundred per cent as no longer a design, and one above ten thousand per cent as an absurdly oversized array."
wrong = "That a negative power margin should be tidied up to zero. A margin silently corrected to zero is a design that drifted without anyone deciding to, so this one is signed and never clamped."
by = "an assistant, from what this sheet states — for its owner (power) to confirm"

[maths]
expression = "M = (P_avail - P_dem)/P_dem"
source = "ecss_e_st_10_02"

[method]
text = """
# Transcribed from crates/vleo-mod-closure/nodes/pwr_margin/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
return power_margin(av, dem)
"""
by = ""
transcribed_from = "crates/vleo-mod-closure/nodes/pwr_margin/model.rs"
checked_by = ""

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "M_pwr"
type = "Ratio"
unit = "One"
lower = -1.0
upper = 100.0
reason_lower = "a margin below -100% would mean the demand is more than twice the supply and the design is not a design"
reason_upper = "above 10000% the array is absurdly oversized"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "av"
var = "pwr_available"
type = "Power"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "dem"
var = "pwr_demand"
type = "Power"

[[algorithm.step]]
number = 1
text = "form the signed fractional margin; a negative value is reported, never clamped"
binds = "m"
type = "Ratio"

[contributes]
kpis = ["kpi_power_margin"]

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (power) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "The signed fractional margin of available over demanded power, as stated and cited to ecss_e_st_10_02 and not yet derived on the sheet."
breaks_if = "A derivation or a comparison with ecss_e_st_10_02 that disagrees, or a margin below minus one hundred or above ten thousand per cent, showing the inputs are not a real design."
relation = "M = (P_avail - P_dem)/P_dem"
source = "ecss_e_st_10_02"
