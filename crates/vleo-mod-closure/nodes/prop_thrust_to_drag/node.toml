# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "prop_thrust_to_drag"
label = "Thrust to drag ratio"
folder = "prop_thrust_to_drag"   # frozen at seed; renaming the label never moves the directory
subsystem = "prop"
parent = "l3_x_closure"
kind = "computed"
owner = "systems"
tier = "B"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 570
state = "published"

[question]
text = "Does the thrust the air produces exceed the drag the air imposes? This is the closure the whole design exists to reach."
note = "At or above one the orbit holds indefinitely. Below one the mission has a lifetime rather than an altitude, and every other number in the design is a detail."

[maths]
expression = "T/D"
source = "romano2021"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "T_D"
type = "Ratio"
unit = "One"
lower = 0.0
upper = 100.0
reason_lower = "a negative ratio means a sign error in thrust or drag"
reason_upper = "above 100 the vehicle is a launch stage, not a satellite"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "t"
var = "prop_delivered_thrust"
type = "Force"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "d"
var = "aero_drag_force"
type = "Force"

[[algorithm.step]]
number = 1
text = "divide thrust by drag; at or above one the orbit holds with no stored propellant"
binds = "r"
type = "Ratio"

[contributes]
kpis = ["kpi_thrust_margin", "kpi_service_lifetime"]

[view]
kind = "line"
over = "orbit_altitude"
points = 80

