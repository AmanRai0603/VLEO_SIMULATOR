# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "cost_replacement_avoided"
label = "Replacement cost avoided"
folder = "cost_replacement_avoided"   # frozen at seed; renaming the label never moves the directory
subsystem = "cost"
parent = "l3_x_closure"
kind = "computed"
owner = "programme"
tier = "C"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 715
state = "published"

[question]
text = "What does air-breathing propulsion save by removing the need to replace satellites when propellant runs out?"
note = "The commercial argument for the whole programme, as a node with a source and evidence rather than a slide."

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How much air-breathing propulsion, which takes its propellant from the thin air around it, saves by removing the need to replace satellites when propellant runs out: the cost of building and launching the constellation again. It is the commercial argument for the whole programme, kept as a row with a source and evidence rather than a slide."
breaks = "It is all or nothing: exactly one replacement of the whole constellation is counted when thrust exceeds drag, and none when it does not. It prices each replacement at the first unit's bus and payload cost plus launch."
by = "an assistant, from what this sheet states — for its owner (programme) to confirm"

[maths]
expression = "C = (C_unit + C_launch)*N_replacements"
source = "orbitt_case_c1"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "C_avd"
type = "Money"
unit = "MillionUsDollar"
lower = 0.0
upper = 1000000.0
reason_lower = "a saving cannot be negative"
reason_upper = "above a trillion dollars the programme is not the one being designed"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "cb"
var = "cost_bus_recurring"
type = "Money"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "cp"
var = "cost_payload_recurring"
type = "Money"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "lc"
var = "cost_launch_per_satellite"
type = "Money"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "n"
var = "mis_satellites"
type = "Ratio"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "td"
var = "prop_thrust_to_drag"
type = "Ratio"

[[algorithm.step]]
number = 1
text = "count one avoided replacement of the whole constellation when thrust exceeds drag, and none when it does not"
binds = "c"
type = "Money"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (programme) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "The relation as stated and cited from orbitt_case_c1, not yet derived on the sheet: one avoided replacement of the whole constellation whenever thrust exceeds drag, and none otherwise."
breaks_if = "A mission that would need more or fewer than one replacement without air-breathing propulsion, replacements that cost other than the first unit, or a comparison with orbitt_case_c1 that disagrees."
relation = "C = (C_unit + C_launch)*N_replacements"
source = "orbitt_case_c1"
