# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "mass_margin"
label = "Mass margin"
folder = "mass_margin"   # frozen at seed; renaming the label never moves the directory
subsystem = "mass"
parent = "l3_x_closure"
kind = "computed"
owner = "mass"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 693
state = "published"

[question]
text = "Does the spacecraft fit the mass it is allowed?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "Whether the spacecraft fits within the mass it is allowed: how much of the mass limit is left once the fully fuelled spacecraft is counted, as a signed fraction of that limit. A negative answer means the spacecraft is too heavy."
breaks = "It knows only the two masses it is given, so it is as trustworthy as the mass estimate and the declared limit. A margin below minus five hundred per cent means the design is five times over and the inputs are wrong; a margin of one would mean the spacecraft weighs nothing."
by = "an assistant, from what this sheet states — for its owner (mass) to confirm"

[maths]
expression = "M = (m_lim - m_wet)/m_lim"
source = "ecss_e_st_10_02"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "M_mass"
type = "Ratio"
unit = "One"
lower = -5.0
upper = 1.0
reason_lower = "a margin below -500% means the design is five times over and the inputs are wrong"
reason_upper = "a margin of one means the spacecraft weighs nothing"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "l"
var = "mass_limit"
type = "Mass"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "w"
var = "mass_wet"
type = "Mass"

[[algorithm.step]]
number = 1
text = "form the signed fractional margin against the declared limit"
binds = "m"
type = "Ratio"

[contributes]
kpis = ["kpi_mass_margin"]

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (mass) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "The signed fractional margin against the declared mass limit, as stated and cited to ecss_e_st_10_02 and not yet derived on the sheet."
breaks_if = "A derivation or a comparison with ecss_e_st_10_02 that disagrees, or a margin below minus five hundred per cent or reaching one, which would point at wrong inputs rather than a real design."
relation = "M = (m_lim - m_wet)/m_lim"
source = "ecss_e_st_10_02"
