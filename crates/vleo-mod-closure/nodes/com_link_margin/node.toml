# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "com_link_margin"
label = "Link margin"
folder = "com_link_margin"   # frozen at seed; renaming the label never moves the directory
subsystem = "com"
parent = "l3_x_closure"
kind = "computed"
owner = "comms"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 650
state = "published"

[question]
text = "Does the downlink close with margin to spare?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How much the downlink, the radio link carrying data to the ground, has to spare, in decibels: the signal energy per bit against the noise that the link delivers, less what is required and less the losses of real equipment. It contributes to whether enough data reaches the ground each day."
breaks = "It is only as good as the three numbers it combines: what the link delivers, what is required, and the implementation loss. Below minus 30 decibels the design is wrong somewhere upstream; above 40 decibels the link is overdesigned by orders of magnitude."
by = "an assistant, from what this sheet states — for its owner (comms) to confirm"

[maths]
expression = "M = Eb/N0 - EbN0_req - L_imp"
source = "ecss_e_st_50"

[method]
text = """
# Transcribed from crates/vleo-mod-closure/nodes/com_link_margin/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
return link_margin_db(e, er, li)
"""
by = ""
transcribed_from = "crates/vleo-mod-closure/nodes/com_link_margin/model.rs"
checked_by = "Aman Rai"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "M_link"
type = "Ratio"
unit = "Decibel"
lower = -30.0
upper = 40.0
reason_lower = "below -30 dB the link is not close to closing and the design is wrong somewhere upstream"
reason_upper = "above 40 dB the link is overdesigned by orders of magnitude"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "e"
var = "com_ebn0"
type = "Ratio"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "er"
var = "com_required_ebn0"
type = "Ratio"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "li"
var = "com_implementation_loss"
type = "Ratio"

[[algorithm.step]]
number = 1
text = "subtract the requirement and the implementation loss from what the link delivers"
binds = "m"
type = "Ratio"

[contributes]
kpis = ["kpi_data_volume"]

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (comms) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "The relation as stated and cited from ecss_e_st_50, not yet derived on the sheet."
breaks_if = "A derivation or a comparison with ecss_e_st_50 that disagrees, or a margin below minus 30 decibels or above 40 decibels, which the sheet reads as an upstream error or gross overdesign."
relation = "M = Eb/N0 - EbN0_req - L_imp"
source = "ecss_e_st_50"
