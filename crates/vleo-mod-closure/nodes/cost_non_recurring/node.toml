# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "cost_non_recurring"
label = "Non-recurring engineering cost"
folder = "cost_non_recurring"   # frozen at seed; renaming the label never moves the directory
subsystem = "cost"
parent = "l3_x_closure"
kind = "computed"
owner = "programme"
tier = "C"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 711
state = "published"

[question]
text = "What does developing the design cost, once?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "What developing the design costs, paid once. It is estimated from dry mass by a cost estimating relation, a fit of cost to mass, and escalated to 2026 money."
breaks = "Dry mass is its only design input, so anything that drives development cost without changing mass is not in it. Above 100 billion dollars the relation is being fed a mass it was not fitted on."
by = "an assistant, from what this sheet states — for its owner (programme) to confirm"

[maths]
expression = "C = a*m_dry^b, escalated"
source = "nasa_cer"

[method]
text = """
# Transcribed from crates/vleo-mod-closure/nodes/cost_non_recurring/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
# Constants the code held, written out here as it held them: a = 14.2; b = 0.55; base year 2020; 2026.
return cer_inflated(m, 14.2, 0.55, 2020, 2026, i)
"""
by = ""
transcribed_from = "crates/vleo-mod-closure/nodes/cost_non_recurring/model.rs"
checked_by = ""

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "C_nre"
type = "Money"
unit = "MillionUsDollar"
lower = 0.0
upper = 100000.0
reason_lower = "a cost cannot be negative"
reason_upper = "above 100 billion the relation is being fed a mass it was not fitted on"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "m"
var = "mass_dry"
type = "Mass"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "i"
var = "cost_inflation"
type = "Ratio"

[[algorithm.step]]
number = 1
text = "evaluate the non-recurring cost estimating relation on dry mass and escalate to 2026"
binds = "c"
type = "Money"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (programme) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "The non-recurring cost estimating relation as cited from nasa_cer, not yet derived on the sheet, applies to this design's dry mass, escalated to 2026."
breaks_if = "A dry mass outside the range the relation was fitted on, shown by an estimate above 100 billion dollars, or a comparison with nasa_cer that disagrees."
relation = "C = a*m_dry^b, escalated"
source = "nasa_cer"
