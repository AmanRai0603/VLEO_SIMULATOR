# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "kpi_gsd_required"
label = "Ground sample distance — required"
folder = "kpi_gsd_required"   # frozen at seed; renaming the label never moves the directory
subsystem = "kpi"
parent = "l3_x_closure"
kind = "declared"
owner = "systems"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 1309
state = "published"
# a ground sample distance in metres: smaller is sharper, so 1 m is a ceiling
sense = "<="

[question]
text = "What does the customer require for ground sample distance?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How fine a detail on the ground the customer requires each image pixel to cover: 1 metre. The design's achieved ground sample distance must be 1 metre or smaller."
breaks = "The sheet gives the number and its source but no reasoning for it. Below 5 centimetres no optical payload in this mass class achieves it; above 100 metres the product is not the one being sold."
wrong = "Treating a larger ground sample distance as better. Smaller is sharper, so 1 metre is a ceiling the design must stay under."
by = "an assistant, from what this sheet states — for its owner (systems) to confirm"

[maths]
expression = "R_req = 1"
source = "orbitt_case_c1"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "R_req"
type = "Length"
unit = "Metre"
lower = 0.05
upper = 100.0
reason_lower = "below 5 cm no optical payload in this mass class achieves it"
reason_upper = "above 100 m the product is not the one being sold"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 1.0
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "next"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (systems) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That the declared 1 metre is the customer's ground sample distance requirement, taken from its cited reference case and confirmed by A. Rai on 2026-09-01."
breaks_if = "A customer requirement stating a ground sample distance other than 1 metre."
relation = "R_req = 1"
source = "orbitt_case_c1"
