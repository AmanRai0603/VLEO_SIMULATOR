# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "thm_margin"
label = "Thermal margin"
folder = "thm_margin"   # frozen at seed; renaming the label never moves the directory
subsystem = "thm"
parent = "l3_x_closure"
kind = "computed"
owner = "thermal"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 606
state = "published"

[question]
text = "Is the spacecraft inside its temperature limit?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "Whether the spacecraft stays inside its temperature limit: how many kelvin the predicted temperature sits below the declared limit. A negative answer means the spacecraft runs hotter than it is allowed to."
breaks = "It sets one predicted balance temperature against one limit, so it is only as good as that prediction. A margin below minus five hundred kelvin means the balance is being fed a nonsense load; above five hundred kelvin, the limit is not the one that binds."
by = "an assistant, from what this sheet states — for its owner (thermal) to confirm"

[maths]
expression = "M = T_max - T_eq"
source = "ecss_e_st_10_02"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "M_thm"
type = "Temperature"
unit = "Kelvin"
lower = -500.0
upper = 500.0
reason_lower = "a margin below -500 K means the balance is being fed a nonsense load"
reason_upper = "a margin above 500 K means the limit is not the one that binds"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "t"
var = "thm_equilibrium_temperature"
type = "Temperature"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "lim"
var = "thm_temperature_limit"
type = "Temperature"

[[algorithm.step]]
number = 1
text = "subtract the predicted temperature from the declared limit"
binds = "m"
type = "Temperature"

[contributes]
kpis = ["kpi_thermal_margin"]

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (thermal) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "The difference between the declared temperature limit and the predicted equilibrium temperature, as stated and cited to ecss_e_st_10_02 and not yet derived on the sheet."
breaks_if = "A derivation or a comparison with ecss_e_st_10_02 that disagrees, or a margin beyond five hundred kelvin either way, showing a nonsense load or the wrong limit."
relation = "M = T_max - T_eq"
source = "ecss_e_st_10_02"
