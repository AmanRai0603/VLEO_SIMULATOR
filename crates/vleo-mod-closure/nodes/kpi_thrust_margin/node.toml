# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "kpi_thrust_margin"
label = "Thrust to drag closure — closure"
folder = "kpi_thrust_margin"   # frozen at seed; renaming the label never moves the directory
subsystem = "kpi"
parent = "l3_x_closure"
kind = "kpi"
owner = "systems"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 1324
state = "published"

[question]
text = "Does thrust exceed drag — does the design close at all?"
note = "The one closure the whole programme exists to reach. Everything else is a detail until this is at or above zero margin."

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "Whether the design closes at all: how far the thrust-to-drag ratio the design achieves sits above or below the ratio it is required to reach, as a signed fraction of that requirement. It is the one closure the whole programme exists to reach; until it is at or above zero, everything else is a detail."
breaks = "It is only as good as the achieved ratio and the requirement fed to it, and the comparison is made in the direction the requirement is stated. A margin below minus ten thousand per cent means the inputs are not the ones the requirement was written against; above a hundred thousand per cent, the requirement is not the one that binds."
by = "an assistant, from what this sheet states — for its owner (systems) to confirm"

[maths]
expression = "M = (achieved - required)/required, in the sense the requirement is stated"
source = "romano2021"

[method]
text = """
# Transcribed from crates/vleo-mod-closure/nodes/kpi_thrust_margin/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
return margin_at_least(req, ach)
"""
by = ""
transcribed_from = "crates/vleo-mod-closure/nodes/kpi_thrust_margin/model.rs"
checked_by = ""

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "M"
type = "Ratio"
unit = "One"
lower = -100.0
upper = 1000.0
reason_lower = "a margin below -10000% means the inputs are not the ones the requirement was written against"
reason_upper = "a margin above 100000% means the requirement is not the one that binds"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "req"
var = "kpi_thrust_margin_required"
type = "Ratio"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "ach"
var = "prop_thrust_to_drag"
type = "Ratio"

[[algorithm.step]]
number = 1
text = "compare achieved against required in the declared sense and return the signed fractional margin"
binds = "m"
type = "Ratio"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (systems) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "The signed fractional margin of achieved against required, taken in the sense the requirement is stated, as stated and cited to romano2021 and not yet derived on the sheet."
breaks_if = "A derivation or a comparison with romano2021 that disagrees, or a margin below minus ten thousand or above a hundred thousand per cent, showing the inputs or the requirement are not the ones meant."
relation = "M = (achieved - required)/required, in the sense the requirement is stated"
source = "romano2021"
