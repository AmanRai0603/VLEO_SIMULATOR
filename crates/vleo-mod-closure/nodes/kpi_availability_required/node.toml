# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "kpi_availability_required"
label = "Service availability — required"
folder = "kpi_availability_required"   # frozen at seed; renaming the label never moves the directory
subsystem = "kpi"
parent = "l3_x_closure"
kind = "declared"
owner = "systems"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 1315
state = "published"
# a service availability fraction: it must reach 0.99, not stay under it
sense = ">="

[question]
text = "What does the customer require for service availability?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "The share of time the customer requires the service to be available: 0.99, that is 99 per cent. The design's achieved availability is checked against it and must reach it."
breaks = "The sheet gives the number and its source but no reasoning for it. Above five nines no constellation in this class has demonstrated it, and below 50 per cent the service would be down more often than up."
wrong = "Reading 0.99 as a ceiling the service must stay under. It is a floor: the achieved availability must reach 0.99."
by = "an assistant, from what this sheet states — for its owner (systems) to confirm"

[maths]
expression = "R_req = 0.99"
source = "orbitt_case_c1"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "R_req"
type = "Ratio"
unit = "One"
lower = 0.5
upper = 0.99999
reason_lower = "below 50% the service is unavailable more often than not"
reason_upper = "above five nines no constellation in this class has demonstrated it"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 0.99
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (systems) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That the declared 0.99 is the customer's availability requirement for this design, taken from its cited reference case and confirmed by A. Rai on 2026-09-01."
breaks_if = "A customer requirement or contract stating an availability other than 0.99."
relation = "R_req = 0.99"
source = "orbitt_case_c1"
