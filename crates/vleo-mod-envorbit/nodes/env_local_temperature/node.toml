# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "env_local_temperature"
label = "Local kinetic temperature"
folder = "env_local_temperature"   # frozen at seed; renaming the label never moves the directory
subsystem = "env"
parent = "l3_x_envorbit"
kind = "computed"
owner = "environment"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 501
state = "published"

[question]
text = "What is the gas temperature at the flight altitude?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "The temperature of the gas at the flight altitude. It rises from a fixed base at 120 kilometres towards the temperature of the upper atmosphere far above."
breaks = "It is a smooth profile between two ends, the 120 kilometre base and the limiting upper-atmosphere temperature, and nothing else. Below the base temperature the profile is not defined, and it cannot exceed the upper-atmosphere temperature it approaches."
by = "an assistant, from what this sheet states — for its owner (environment) to confirm"

[maths]
expression = "T(z) = T_inf - (T_inf - T_120)*exp(-s*(z - z_120))"
source = "jacchia1971"

[method]
text = """
# Transcribed from crates/vleo-mod-envorbit/nodes/env_local_temperature/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
return thermosphere_temperature(h, t_inf)
"""
by = ""
transcribed_from = "crates/vleo-mod-envorbit/nodes/env_local_temperature/model.rs"
checked_by = "Aman Rai"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "T"
type = "Temperature"
unit = "Kelvin"
lower = 200.0
upper = 2500.0
reason_lower = "below the 120 km base temperature the profile is not defined"
reason_upper = "cannot exceed the exospheric temperature it approaches"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "h"
var = "orbit_altitude"
type = "Length"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "t_inf"
var = "env_exospheric_temperature"
type = "Temperature"

[[algorithm.step]]
number = 1
text = "evaluate the Bates profile between the 120 km base and the exospheric limit"
binds = "t"
type = "Temperature"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (environment) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "The Bates temperature profile between the 120 kilometre base and the exospheric limit, as stated and cited to jacchia1971 and not yet derived on the sheet."
breaks_if = "A derivation or a comparison with jacchia1971 that disagrees, or a temperature below 200 or above 2500 kelvin, or above the exospheric temperature it is meant to approach."
relation = "T(z) = T_inf - (T_inf - T_120)*exp(-s*(z - z_120))"
source = "jacchia1971"
