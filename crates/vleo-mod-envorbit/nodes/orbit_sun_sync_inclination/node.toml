# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "orbit_sun_sync_inclination"
label = "Sun-synchronous inclination"
folder = "orbit_sun_sync_inclination"   # frozen at seed; renaming the label never moves the directory
subsystem = "orbit"
parent = "l3_x_envorbit"
kind = "computed"
owner = "systems"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 520
state = "published"

[question]
text = "What inclination makes the orbit plane keep pace with the Sun?"

[maths]
expression = "cos(i) = -Omega_sun*(1-e^2)^2*a^(7/2)/(1.5*J2*sqrt(mu)*Re^2)"
source = "vallado2013"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "i_ss"
type = "Angle"
unit = "Degree"
lower = 85.0
upper = 115.0
reason_lower = "a Sun-synchronous inclination is always retrograde and above about 95 degrees in this band"
reason_upper = "above 115 degrees no Sun-synchronous solution exists below 2000 km"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "r"
var = "orbit_radius"
type = "Length"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "e"
var = "orbit_eccentricity"
type = "Ratio"

[[algorithm.step]]
number = 1
text = "solve the nodal regression relation for the inclination that matches the Sun's apparent motion; refuse when no such inclination exists"
binds = "i"
type = "Angle"

[view]
kind = "number"

