# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "orbit_period"
label = "Orbital period"
folder = "orbit_period"   # frozen at seed; renaming the label never moves the directory
subsystem = "orbit"
parent = "l3_x_envorbit"
kind = "computed"
owner = "systems"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 519
state = "published"

[question]
text = "How long does one revolution take?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How long the spacecraft takes to go once around the Earth, in minutes, worked out from its distance from the Earth's centre by Kepler's third law. In this tool's band it lies between 83 and 104 minutes."
breaks = "It treats the orbit as a circle at that distance. Its limits are the tool's band, not physics at large: a period below 5000 seconds would be an orbit inside the Earth, and 6200 seconds corresponds to about 1000 kilometres, outside the band."
by = "an assistant, from what this sheet states — for its owner (systems) to confirm"

[maths]
expression = "T = 2*pi*sqrt(a^3/mu)"
source = "vallado2013"

[method]
text = """
# Transcribed from crates/vleo-mod-envorbit/nodes/orbit_period/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
return orbital_period(r)
"""
by = ""
transcribed_from = "crates/vleo-mod-envorbit/nodes/orbit_period/model.rs"
checked_by = ""

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "T_orb"
type = "Time"
unit = "Minute"
lower = 83.0
upper = 104.0
reason_lower = "a period below 5000 s corresponds to an orbit inside the Earth"
reason_upper = "6200 s corresponds to about 1000 km, outside this tool's band"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "r"
var = "orbit_radius"
type = "Length"

[[algorithm.step]]
number = 1
text = "apply Kepler's third law at the circular radius"
binds = "t"
type = "Time"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (systems) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "Kepler's third law at the circular radius, as stated and cited from vallado2013, not yet derived on the sheet."
breaks_if = "A derivation or a check against vallado2013 disagrees, or a period falls outside 83 to 104 minutes, meaning an orbit inside the Earth or beyond about 1000 kilometres."
relation = "T = 2*pi*sqrt(a^3/mu)"
source = "vallado2013"
