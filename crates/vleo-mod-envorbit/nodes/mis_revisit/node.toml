# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "mis_revisit"
label = "Mean revisit time"
folder = "mis_revisit"   # frozen at seed; renaming the label never moves the directory
subsystem = "mis"
parent = "l3_x_envorbit"
kind = "computed"
owner = "systems"
tier = "C"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 700
state = "published"

[question]
text = "How often does the constellation come back to a given place?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How often, on average, the constellation comes back over a given place, found from the Earth's surface area and the rate at which all the satellites' swaths, the strips of ground their sensors see, sweep across it."
breaks = "It assumes uniform coverage of the whole globe with no weighting by latitude. A Sun-synchronous constellation revisits the poles far more often than the equator, so this mean is optimistic at low latitudes and pessimistic at high ones."
wrong = "That the mean revisit is the revisit at any particular place. It is a global average: at low latitudes the real revisit is longer than this, and at high latitudes shorter."
by = "an assistant, from what this sheet states — for its owner (systems) to confirm"

[maths]
expression = "t = A_earth/(N*W*V_g)"
source = "larson_wertz"

[[assumption]]
text = "Uniform coverage of the whole globe, no latitude weighting"
fails_when = "a Sun-synchronous constellation revisits the poles far more often than the equator, so this mean is optimistic at low latitudes and pessimistic at high ones"

[method]
text = """
# Transcribed from crates/vleo-mod-envorbit/nodes/mis_revisit/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
return mean_revisit_time(w, v, n)
"""
by = ""
transcribed_from = "crates/vleo-mod-envorbit/nodes/mis_revisit/model.rs"
checked_by = ""

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "t_rev"
type = "Time"
unit = "Hour"
lower = 0.0
upper = 2400.0
reason_lower = "a revisit time cannot be negative"
reason_upper = "above 100 days the constellation does not provide a service"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "w"
var = "pay_swath"
type = "Length"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "v"
var = "orbit_ground_track_speed"
type = "Velocity"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "n"
var = "mis_satellites"
type = "Ratio"

[[algorithm.step]]
number = 1
text = "divide the Earth's surface area by the total swath sweep rate of the constellation"
binds = "t"
type = "Time"

[contributes]
kpis = ["kpi_revisit"]

[view]
kind = "line"
over = "mis_satellites"
points = 60

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (systems) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "Uniform coverage of the whole globe with no latitude weighting, and the relation as stated and cited to larson_wertz, not yet derived on the sheet."
breaks_if = "The places that matter sit at latitudes where the real revisit departs from the global mean, a comparison with larson_wertz that disagrees, or a revisit above 100 days."
relation = "t = A_earth/(N*W*V_g)"
source = "larson_wertz"
