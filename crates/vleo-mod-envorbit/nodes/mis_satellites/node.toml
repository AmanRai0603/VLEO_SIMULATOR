# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "mis_satellites"
label = "Number of satellites"
folder = "mis_satellites"   # frozen at seed; renaming the label never moves the directory
subsystem = "mis"
parent = "l3_x_envorbit"
kind = "declared"
owner = "systems"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 694
state = "published"

[question]
text = "How many satellites are in the constellation?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How many satellites fly in the constellation: 24. It shapes how often a place can be seen again and what the service costs each year."
breaks = "It is a count a person picked, not one worked out from a revisit need. It is only held to be sensible from one satellite, the single-satellite limit of the trade, up to 500, above which the constellation is not the one costed here."
by = "an assistant, from what this sheet states — for its owner (systems) to confirm"

[maths]
expression = "N_sat = 24"
source = "orbitt_case_c1"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "N_sat"
type = "Ratio"
unit = "One"
lower = 1.0
upper = 500.0
reason_lower = "one satellite is the single-satellite concept, the limit of the trade"
reason_upper = "above 500 the constellation is not the one costed here"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 24.0
confirmed_by = "A. Rai / 2026-09-01"

[contributes]
kpis = ["kpi_revisit", "kpi_cost_per_year"]

[view]
kind = "number"

[[version]]
n = 1
release = "next"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (systems) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That 24 satellites is the constellation size for this design, as taken from the source case the sheet cites (orbitt_case_c1), confirmed by A. Rai on 2026-09-01."
breaks_if = "A constellation plan or revisit requirement for this design that calls for a number other than 24, or more than 500."
relation = "N_sat = 24"
source = "orbitt_case_c1"
