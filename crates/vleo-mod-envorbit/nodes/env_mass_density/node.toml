# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "env_mass_density"
label = "Atmospheric mass density"
folder = "env_mass_density"   # frozen at seed; renaming the label never moves the directory
subsystem = "env"
parent = "l3_x_envorbit"
kind = "computed"
owner = "environment"
tier = "B"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 502
state = "published"

[question]
text = "How much air is there at the flight altitude, in kilograms per cubic metre?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How much air there is at the flight altitude, in kilograms per cubic metre, built up gas by gas over five gases. It is the density the drag downstream is worked out from, and it feeds the service lifetime."
breaks = "It returns the daily mean, with no daily, seasonal or longitudinal variation, while the real density at a fixed altitude varies by a factor of two around the orbit. It assumes the gases separate by weight above 120 kilometres, which fails below about 100 kilometres, where mixing dominates."
wrong = "That this is the density the spacecraft meets at every point of its orbit. It is the daily mean; the real density at a fixed altitude varies by a factor of two around the orbit."
by = "an assistant, from what this sheet states — for its owner (environment) to confirm"

[maths]
expression = "rho = SUM_i n_i(z)*m_i,  n_i(z) = n_i(z0)*(T0/T)^(1+alpha_i)*exp(-INT M_i*g/(R*T) dz)"
source = "jacchia1971"

[[assumption]]
text = "Diffusive equilibrium above 120 km, five species"
fails_when = "below about 100 km turbulent mixing dominates and species do not separate; the model is not valid there"

[[assumption]]
text = "No diurnal, seasonal or longitudinal variation"
fails_when = "the real density at a fixed altitude varies by a factor of two around the orbit; this returns the daily mean"

[method]
text = """
# Transcribed from crates/vleo-mod-envorbit/nodes/env_mass_density/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
return thermosphere_density(h, t_inf)
"""
by = ""
transcribed_from = "crates/vleo-mod-envorbit/nodes/env_mass_density/model.rs"
checked_by = "Aman Rai"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "rho"
type = "MassDensity"
unit = "KgPerCubicMetre"
lower = 1e-15
upper = 1e-06
reason_lower = "below 1e-15 kg/m3 the free-molecular relations downstream stop producing a meaningful drag"
reason_upper = "above 1e-6 kg/m3 the flow is no longer free-molecular and every aerodynamic node in this tree is outside its envelope"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "h"
var = "orbit_altitude"
type = "Length"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "t_inf"
var = "env_exospheric_temperature"
type = "Temperature"

[[algorithm.step]]
number = 1
text = "integrate diffusive equilibrium from the 120 km base for every species and sum the masses"
binds = "rho"
type = "MassDensity"

[contributes]
kpis = ["kpi_service_lifetime"]

[data]
bundles = ["solar-drivers"]

[view]
kind = "line"
over = "orbit_altitude"
points = 80

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (environment) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "Diffusive equilibrium above 120 kilometres for five species, with no diurnal, seasonal or longitudinal variation, as stated and cited to jacchia1971; the relation is not yet derived on the sheet."
breaks_if = "Use below about 100 kilometres, a design that depends on the density around the orbit rather than its daily mean, a result outside the sheet's bounds, or a comparison with jacchia1971 that disagrees."
relation = "rho = SUM_i n_i(z)*m_i,  n_i(z) = n_i(z0)*(T0/T)^(1+alpha_i)*exp(-INT M_i*g/(R*T) dz)"
source = "jacchia1971"
