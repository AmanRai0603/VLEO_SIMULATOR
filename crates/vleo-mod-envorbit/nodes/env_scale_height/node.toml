# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "env_scale_height"
label = "Density scale height"
folder = "env_scale_height"   # frozen at seed; renaming the label never moves the directory
subsystem = "env"
parent = "l3_x_envorbit"
kind = "computed"
owner = "environment"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 506
state = "published"

[question]
text = "Over what altitude change does the density fall by a factor of e?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "The height over which the air's density falls by a fixed factor, the mathematical constant e. It is set by the local temperature, the average weight of the gas and gravity, and it says how quickly the air thins with height."
breaks = "It is a local figure at one altitude. The sheet holds it between 5 and 200 kilometres: less than 5 does not occur above the model base, and above 200 the atmosphere is effectively at one temperature throughout and the idea stops being useful."
by = "an assistant, from what this sheet states — for its owner (environment) to confirm"

[maths]
expression = "H = R*T/(M*g)"
source = "vallado2013"

[method]
text = """
# Transcribed from crates/vleo-mod-envorbit/nodes/env_scale_height/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
return thermosphere_scale_height(h, t_inf)
"""
by = ""
transcribed_from = "crates/vleo-mod-envorbit/nodes/env_scale_height/model.rs"
checked_by = ""

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "H"
type = "Length"
unit = "Kilometre"
lower = 5.0
upper = 200.0
reason_lower = "a scale height below 5 km does not occur above the model base"
reason_upper = "above 200 km the atmosphere is effectively isothermal and the concept stops being useful"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "h"
var = "orbit_altitude"
type = "Length"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "t_inf"
var = "env_exospheric_temperature"
type = "Temperature"

[[algorithm.step]]
number = 1
text = "form the barometric scale height from the local temperature, mean molar mass and gravity"
binds = "hs"
type = "Length"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (environment) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "The barometric scale height from local temperature, mean molar mass and gravity, as stated and cited to vallado2013 and not yet derived on the sheet."
breaks_if = "A derivation or a comparison with vallado2013 that disagrees, or a result below 5 or above 200 kilometres."
relation = "H = R*T/(M*g)"
source = "vallado2013"
