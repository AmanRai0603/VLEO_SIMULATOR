# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "orbit_min_elevation"
label = "Minimum useful elevation angle"
folder = "orbit_min_elevation"   # frozen at seed; renaming the label never moves the directory
subsystem = "orbit"
parent = "l3_x_envorbit"
kind = "declared"
owner = "systems"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 514
state = "published"

[question]
text = "Below what elevation is a target or a ground station no longer usable?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "The lowest angle above the horizon at which a target or ground station is still usable: 10 degrees. Below it, the satellite is treated as out of reach."
breaks = "It is one fixed angle for every target and station. At the horizon the distance is longest and the air thickest, so no useful link or image is obtained there; at 90 degrees, straight overhead, the area within reach shrinks to nothing."
wrong = "It is easy to take the horizon, zero degrees, as the usable limit. It is not a working value: zero is only the limit, and nothing useful is obtained there."
by = "an assistant, from what this sheet states — for its owner (systems) to confirm"

[maths]
expression = "eps = 10"
source = "larson_wertz"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "eps"
type = "Angle"
unit = "Degree"
lower = 0.0
upper = 90.0
reason_lower = "at the horizon the slant range is longest, the atmosphere is thickest and no useful link or image is obtained; zero is the limit, not a working value"
reason_upper = "90 degrees is the zenith, at which the access circle has no area"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 10.0
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (systems) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That 10 degrees is the lowest usable elevation for this design, with the value drawn from the textbook the sheet cites (larson_wertz), confirmed by A. Rai on 2026-09-01."
breaks_if = "Link or imaging performance for this design's targets or stations showing that a different lowest elevation than 10 degrees is usable."
relation = "eps = 10"
source = "larson_wertz"
