# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "mis_latency"
label = "End to end latency"
folder = "mis_latency"   # frozen at seed; renaming the label never moves the directory
subsystem = "mis"
parent = "l3_x_envorbit"
kind = "computed"
owner = "operations"
tier = "B"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 703
state = "published"

[question]
text = "How long from collection to the product reaching the customer?"
note = "The wait term dominates, and it is the one a constellation design can actually move."

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How long it takes from collecting data to the product reaching the customer: the wait for a downlink, the downlink itself, processing and delivery, added up. The wait dominates, and it is the one a constellation design can actually move."
breaks = "It adds four times end to end, so it is only as good as each of them and knows nothing the four do not carry. Above two days the product is not the near-real-time one being sold."
wrong = "That latency is mostly the downlink or the processing. The wait for the next downlink dominates, and it is the part a constellation design can actually move."
by = "an assistant, from what this sheet states — for its owner (operations) to confirm"

[maths]
expression = "t = t_wait + t_downlink + t_process + t_deliver"
source = "orbitt_case_c1"

[method]
text = """
# Transcribed from crates/vleo-mod-envorbit/nodes/mis_latency/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
return end_to_end_latency(tw, td, tp, tdl)
"""
by = ""
transcribed_from = "crates/vleo-mod-envorbit/nodes/mis_latency/model.rs"
checked_by = ""

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "t_lat"
type = "Time"
unit = "Minute"
lower = 0.0
upper = 2880.0
reason_lower = "a latency cannot be negative"
reason_upper = "above two days the product is not the near-real-time one being sold"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "tw"
var = "mis_time_to_downlink"
type = "Time"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "td"
var = "com_contact_time"
type = "Time"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "tp"
var = "mis_processing_time"
type = "Time"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "tdl"
var = "mis_delivery_time"
type = "Time"

[[algorithm.step]]
number = 1
text = "sum the wait, the downlink, the processing and the delivery"
binds = "t"
type = "Time"

[contributes]
kpis = ["kpi_latency"]

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (operations) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "The sum of wait, downlink, processing and delivery, as stated and cited to orbitt_case_c1 and not yet derived on the sheet."
breaks_if = "A comparison with orbitt_case_c1 that disagrees, a step between collection and delivery that the sum leaves out, or a latency above two days."
relation = "t = t_wait + t_downlink + t_process + t_deliver"
source = "orbitt_case_c1"
