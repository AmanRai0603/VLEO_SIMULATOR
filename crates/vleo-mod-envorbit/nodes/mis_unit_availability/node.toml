# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "mis_unit_availability"
label = "Single satellite availability"
folder = "mis_unit_availability"   # frozen at seed; renaming the label never moves the directory
subsystem = "mis"
parent = "l3_x_envorbit"
kind = "declared"
owner = "operations"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 697
state = "published"

[question]
text = "What fraction of the time is one satellite fully operational?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "The fraction of the time one satellite is fully working: 0.97, that is 97 per cent. It feeds how available the service is as a whole."
breaks = "It is a single average fraction and says nothing about how long outages last or when they fall. It is only held to be sensible between a half, below which the satellite is down more often than not, and 0.9999, which no small satellite has demonstrated."
wrong = "It is easy to read this as the availability of the service. It is not: it is for a single satellite only."
by = "an assistant, from what this sheet states — for its owner (operations) to confirm"

[maths]
expression = "A_unit = 0.97"
source = "orbitt_case_c1"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "A_unit"
type = "Ratio"
unit = "One"
lower = 0.5
upper = 0.9999
reason_lower = "below 50% the satellite is unavailable more often than not"
reason_upper = "above 0.9999 no small satellite has demonstrated that availability"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 0.97
confirmed_by = "A. Rai / 2026-09-01"

[contributes]
kpis = ["kpi_availability"]

[view]
kind = "number"

[[version]]
n = 1
release = "next"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (operations) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That 0.97 is the fraction of time one satellite of this design is fully operational, as taken from the source case the sheet cites (orbitt_case_c1), confirmed by A. Rai on 2026-09-01."
breaks_if = "Flight or test records for this design's satellites showing a fully operational fraction different from 0.97."
relation = "A_unit = 0.97"
source = "orbitt_case_c1"
