# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "orbit_nodal_regression"
label = "Nodal regression rate"
folder = "orbit_nodal_regression"   # frozen at seed; renaming the label never moves the directory
subsystem = "orbit"
parent = "l3_x_envorbit"
kind = "computed"
owner = "systems"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 521
state = "published"

[question]
text = "How fast does the orbit plane rotate under the second zonal harmonic?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How fast the plane of the orbit slowly turns around the Earth, in degrees per day, because the Earth's gravity is not quite that of a perfect sphere. It depends on the orbit's distance from the Earth's centre, how nearly circular it is, and how steeply it is tilted."
breaks = "It is the steady long-term drift from the single largest departure of the Earth's gravity from a sphere, not the short wobble around that drift. Its limit of 15 degrees per day either way holds only for this tool's altitude band, where a faster rate does not occur."
by = "an assistant, from what this sheet states — for its owner (systems) to confirm"

[maths]
expression = "dOmega/dt = -1.5*J2*sqrt(mu)*Re^2*cos(i)/((1-e^2)^2*a^(7/2))"
source = "vallado2013"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "dOmega"
type = "AngularRate"
unit = "DegreePerDay"
lower = -15.0
upper = 15.0
reason_lower = "a regression faster than 15 degrees per day does not occur in this altitude band"
reason_upper = "a regression faster than 15 degrees per day does not occur in this altitude band"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "r"
var = "orbit_radius"
type = "Length"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "e"
var = "orbit_eccentricity"
type = "Ratio"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "i"
var = "orbit_inclination"
type = "Angle"

[[algorithm.step]]
number = 1
text = "evaluate the secular J2 node rate"
binds = "d"
type = "AngularRate"

[view]
kind = "number"

[[version]]
n = 1
release = "next"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (systems) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "The long-term node-rate relation for the second zonal harmonic, as stated and cited from vallado2013, not yet derived on the sheet."
breaks_if = "A derivation or a check against vallado2013 disagrees with the relation as stated, or a rate faster than 15 degrees per day either way appears, which the sheet says does not occur in this altitude band."
relation = "dOmega/dt = -1.5*J2*sqrt(mu)*Re^2*cos(i)/((1-e^2)^2*a^(7/2))"
source = "vallado2013"
