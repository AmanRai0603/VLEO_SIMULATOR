# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "mis_time_to_downlink"
label = "Mean time to next downlink"
folder = "mis_time_to_downlink"   # frozen at seed; renaming the label never moves the directory
subsystem = "mis"
parent = "l3_x_envorbit"
kind = "computed"
owner = "operations"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 702
state = "published"

[question]
text = "How long does data wait on board before it can come down?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How long, on average, data waits on board before a ground pass lets it come down, taken as half the average gap between passes, from the number of passes a day."
breaks = "It is an average that treats the passes as evenly spaced through the day, so a particular wait can be much longer. Above a day the mission is not operable."
by = "an assistant, from what this sheet states — for its owner (operations) to confirm"

[maths]
expression = "t = 86400/(2*N_pass)"
source = "larson_wertz"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "t_dl"
type = "Time"
unit = "Minute"
lower = 0.0
upper = 1440.0
reason_lower = "a wait cannot be negative"
reason_upper = "above a day the mission is not operable"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "n"
var = "com_passes_per_day"
type = "Ratio"

[[algorithm.step]]
number = 1
text = "take half the mean interval between passes"
binds = "t"
type = "Time"

[contributes]
kpis = ["kpi_latency"]

[view]
kind = "number"

[[version]]
n = 1
release = "next"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (operations) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "Half the mean interval between passes, as stated and cited to larson_wertz and not yet derived on the sheet."
breaks_if = "A derivation or a comparison with larson_wertz that disagrees, or a wait above a day."
relation = "t = 86400/(2*N_pass)"
source = "larson_wertz"
