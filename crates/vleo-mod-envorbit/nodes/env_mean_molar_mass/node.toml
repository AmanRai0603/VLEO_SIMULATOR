# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "env_mean_molar_mass"
label = "Mean molar mass of the local gas"
folder = "env_mean_molar_mass"   # frozen at seed; renaming the label never moves the directory
subsystem = "env"
parent = "l3_x_envorbit"
kind = "computed"
owner = "environment"
tier = "B"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 504
state = "published"

[question]
text = "What is the mean molar mass of the air the vehicle is flying through?"
note = "Falls from 26 g/mol at 120 km to near 16 — pure atomic oxygen — by 350 km. Every free-molecular relation downstream reads it."

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "The average weight of the gas the vehicle flies through, per mole (a fixed count of molecules). It falls from 26 grams per mole at 120 kilometres to near 16, pure atomic oxygen, by 350 kilometres, and every free-molecular relation downstream reads it."
breaks = "It is a mass-weighted average over the five gases the model carries. The sheet holds it between 2 grams per mole, which would be pure hydrogen, and 30, heavier than molecular nitrogen; neither occurs in this band."
by = "an assistant, from what this sheet states — for its owner (environment) to confirm"

[maths]
expression = "M = rho*N_A/n"
source = "jacchia1971"

[method]
text = """
# Transcribed from crates/vleo-mod-envorbit/nodes/env_mean_molar_mass/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
return thermosphere_molar_mass(h, t_inf)
"""
by = ""
transcribed_from = "crates/vleo-mod-envorbit/nodes/env_mean_molar_mass/model.rs"
checked_by = "Aman Rai"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "M"
type = "MolarMass"
unit = "KgPerMol"
lower = 0.002
upper = 0.03
reason_lower = "below 2 g/mol the mixture would be pure hydrogen, which does not occur in this band"
reason_upper = "above 30 g/mol the mixture would be heavier than molecular nitrogen, which does not occur above the base"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "h"
var = "orbit_altitude"
type = "Length"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "t_inf"
var = "env_exospheric_temperature"
type = "Temperature"

[[algorithm.step]]
number = 1
text = "take the mass-weighted mean over the five species"
binds = "m"
type = "MolarMass"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (environment) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "The mass-weighted mean over five species, as stated and cited to jacchia1971 and not yet derived on the sheet."
breaks_if = "A derivation or a comparison with jacchia1971 that disagrees, a value outside 2 to 30 grams per mole, or one that does not fall towards 16 by 350 kilometres."
relation = "M = rho*N_A/n"
source = "jacchia1971"
