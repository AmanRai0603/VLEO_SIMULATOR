# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "env_mean_free_path"
label = "Mean free path"
folder = "env_mean_free_path"   # frozen at seed; renaming the label never moves the directory
subsystem = "env"
parent = "l3_x_envorbit"
kind = "computed"
owner = "environment"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 507
state = "published"

[question]
text = "How far does a molecule travel between collisions?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How far a gas molecule travels, on average, between collisions at the flight altitude. It decides whether the air meets a spacecraft-sized body as separate molecules or as a continuous flow."
breaks = "It treats every molecule as a hard ball of one fixed effective size, whatever the gas. Below a millimetre a spacecraft-sized body would be in continuous flow; beyond a billion metres the idea has no operational meaning here."
by = "an assistant, from what this sheet states — for its owner (environment) to confirm"

[maths]
expression = "lambda = 1/(sqrt(2)*n*sigma)"
source = "us_std_1976"

[method]
text = """
# Transcribed from crates/vleo-mod-envorbit/nodes/env_mean_free_path/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
return mean_free_path(n)
"""
by = ""
transcribed_from = "crates/vleo-mod-envorbit/nodes/env_mean_free_path/model.rs"
checked_by = ""

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "lambda"
type = "Length"
unit = "Metre"
lower = 0.001
upper = 1000000000.0
reason_lower = "a mean free path below a millimetre would put a spacecraft-scale body in continuum flow"
reason_upper = "beyond 1e9 m the concept of a mean free path has no operational meaning here"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "n"
var = "env_number_density"
type = "NumberDensity"

[[algorithm.step]]
number = 1
text = "apply the hard-sphere mean free path with an effective cross-section of 1e-19 m2"
binds = "l"
type = "Length"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (environment) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "The hard-sphere mean free path with an effective cross-section of 1e-19 square metres, as stated and cited to us_std_1976 and not yet derived on the sheet."
breaks_if = "A derivation or a comparison with us_std_1976 that disagrees, or a path below a millimetre at a design point."
relation = "lambda = 1/(sqrt(2)*n*sigma)"
source = "us_std_1976"
