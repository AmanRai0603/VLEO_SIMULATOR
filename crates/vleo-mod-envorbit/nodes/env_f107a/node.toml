# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "env_f107a"
label = "Solar radio flux F10.7, 81-day mean"
folder = "env_f107a"   # frozen at seed; renaming the label never moves the directory
subsystem = "env"
parent = "l3_x_envorbit"
kind = "computed"
owner = "environment"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 496
state = "published"

[question]
text = "What 81-day mean 10.7 cm radio flux is the design sized to?"
note = """
The slow solar term the thermosphere relation weights 3.24 — the dominant one.
Computed by the solar-weather subsystem over the mission window and carried
here through layer 2, for the same reason as env_f107: one row owns the answer
and the rest read it.
"""

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "The Sun's 10.7 centimetre radio emission averaged over 81 days, about three turns of the Sun, which is the slow and biggest solar influence on the upper atmosphere's temperature. It is forecast for the mission window by the solar-weather part of the tool and passed on here unchanged."
breaks = "At the hot sustained scenario this mean equals the daily level beside it, so the day-to-day term contributes nothing. On the hot single-day scenario the daily level sits above its mean and that term does work."
wrong = "A zero difference between the daily flux and this mean is not a defect: it is a property of the hot sustained scenario, so check which scenario is loaded first."
by = "an assistant, from what this sheet states — for its owner (environment) to confirm"

[maths]
# NOT A RELATION. The identity is the point: one row owns the answer and this
# one carries it, because two rows declaring the design flux is two rows that
# can disagree and the readers are sized against whichever they opened.
confirmed_by = ""
expression = "F107A = F107bar_sys"
source = "orbitt_case_c1"

# WHERE THIS RELATION CAME FROM. Prose, outside the sheet hash.
[theory]
why = """
It restates what the system layer was told; it does not decide it.

The 81-day mean stands in for the EUV averaged over three solar rotations,
which is the timescale the whole thermosphere equilibrates on. Producing it for
a window that has not happened yet is a forecast, and the subsystem that makes
forecasts makes it. This row carries it inward.

It is a separate row from env_f107 rather than a derivation of it because the
two are independently published members of the driver set: the study's hotday
scenario carries hotmean's 81-day mean beneath it, so the pair is a lookup and
not a relation.
"""
reading = """
It is a MEAN over the window and the daily value beside it is a level over the
same window, so at the hotmean scenario the two are equal and the thermosphere
relation's departure term contributes nothing. That is a property of this
scenario, not of the relation: on the hotday scenario the daily level is above
its own mean and the departure term does work.

Whoever reads a departure of exactly zero as a defect should check which
scenario is loaded before treating it as one.
"""

[[theory.step]]
text = """
Take what layer 2 publishes and pass it on, at the same type and the same unit.
There is no arithmetic here on purpose: the value of the row is that there is
nowhere for a discrepancy to enter between what the subsystem concluded and
what the design is built to.
"""
math = "F107A = F107bar_sys"

[[input]]
# Read across the layer boundary: the driver is a system-level conclusion and
# lives at layer 2. The subsystem that produced it is reached through its
# interface, never by reaching into it.
binding = "from_system"
var = "sys_space_environment_f10_7_81day"
type = "Ratio"

[[algorithm.step]]
number = 1
text = "carry the system layer's 81-day mean flux through unchanged"
binds = "mean_flux"
type = "Ratio"


[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "F107A"
type = "Ratio"
unit = "One"
lower = 60.0
upper = 400.0
reason_lower = "same support limit as the daily value"
reason_upper = "same support limit as the daily value"


[view]
kind = "number"

[[version]]
n = 1
release = "next"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (environment) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That the solar-weather subsystem's forecast 81-day mean for the mission window, carried unchanged through the system layer, is the right value to size this design to."
breaks_if = "The subsystem's forecast for the window is shown wrong, or the design has to be sized to a scenario other than the hot sustained one."
relation = "F107A = F107bar_sys"
source = "orbitt_case_c1"
