# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "orbit_swath_width"
label = "Ground swath width"
folder = "orbit_swath_width"   # frozen at seed; renaming the label never moves the directory
subsystem = "orbit"
parent = "l3_x_envorbit"
kind = "computed"
owner = "systems"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 524
state = "published"

[question]
text = "How wide a strip of ground does one pass cover?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How wide a strip of ground one pass covers, in kilometres, measured over the Earth's surface. It turns the angle at the Earth's centre between the ground track and the edge of coverage into a distance on the ground, and it feeds the revisit performance measure."
breaks = "It is a width along the shortest path over the Earth's surface, taken from an angle at the Earth's centre, and is only as right as that angle. It cannot exceed the Earth's circumference, and below one kilometre it would not be a swath."
by = "an assistant, from what this sheet states — for its owner (systems) to confirm"

[maths]
expression = "W = 2*lambda*Re"
source = "larson_wertz"

[method]
text = """
# Transcribed from crates/vleo-mod-envorbit/nodes/orbit_swath_width/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
return swath_width(lam)
"""
by = ""
transcribed_from = "crates/vleo-mod-envorbit/nodes/orbit_swath_width/model.rs"
checked_by = "Aman Rai"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "W"
type = "Length"
unit = "Kilometre"
lower = 1.0
upper = 40000.0
reason_lower = "a swath below one kilometre would not be a swath"
reason_upper = "a swath cannot exceed the Earth's circumference"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "lam"
var = "orbit_earth_central_angle"
type = "Angle"

[[algorithm.step]]
number = 1
text = "convert the Earth-central half-angle into a great-circle width"
binds = "w"
type = "Length"

[contributes]
kpis = ["kpi_revisit"]

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (systems) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "The great-circle width from the Earth-central half-angle, as stated and cited from larson_wertz, not yet derived on the sheet."
breaks_if = "A derivation or a check against larson_wertz disagrees, or a width comes out under one kilometre or beyond the Earth's circumference."
relation = "W = 2*lambda*Re"
source = "larson_wertz"
