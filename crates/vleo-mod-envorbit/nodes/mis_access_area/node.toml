# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "mis_access_area"
label = "Instantaneous access area"
folder = "mis_access_area"   # frozen at seed; renaming the label never moves the directory
subsystem = "mis"
parent = "l3_x_envorbit"
kind = "computed"
owner = "systems"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 698
state = "published"

[question]
text = "How much ground does one satellite see at any instant?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How much ground one satellite can see at any instant, in square metres: the cap of the Earth's surface within its view at the working elevation."
breaks = "It treats the Earth as a sphere and the view as a round cap set by one angle at the Earth's centre. It can be no less than zero and no more than the surface area of the Earth."
by = "an assistant, from what this sheet states — for its owner (systems) to confirm"

[maths]
expression = "A = 2*pi*Re^2*(1 - cos(lambda))"
source = "larson_wertz"

[method]
text = """
# Transcribed from crates/vleo-mod-envorbit/nodes/mis_access_area/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
return access_area(lam)
"""
by = ""
transcribed_from = "crates/vleo-mod-envorbit/nodes/mis_access_area/model.rs"
checked_by = "Aman Rai"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "A_acc"
type = "Area"
unit = "SquareMetre"
lower = 0.0
upper = 520000000000000.0
reason_lower = "an area cannot be negative"
reason_upper = "cannot exceed the surface area of the Earth"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "lam"
var = "orbit_earth_central_angle"
type = "Angle"

[[algorithm.step]]
number = 1
text = "integrate the spherical cap subtended by the Earth-central half-angle"
binds = "a"
type = "Area"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (systems) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "The spherical cap subtended by the Earth-central half-angle, as stated and cited to larson_wertz and not yet derived on the sheet."
breaks_if = "A derivation or a comparison with larson_wertz that disagrees, or an area below zero or above the Earth's surface area."
relation = "A = 2*pi*Re^2*(1 - cos(lambda))"
source = "larson_wertz"
