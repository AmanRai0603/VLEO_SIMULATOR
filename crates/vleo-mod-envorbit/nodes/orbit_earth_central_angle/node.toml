# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "orbit_earth_central_angle"
label = "Earth central half-angle"
folder = "orbit_earth_central_angle"   # frozen at seed; renaming the label never moves the directory
subsystem = "orbit"
parent = "l3_x_envorbit"
kind = "computed"
owner = "systems"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 523
state = "published"

[question]
text = "How much of the Earth's surface is in view at the working elevation?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How far across the Earth's surface the satellite can reach at the working elevation, measured as the angle at the Earth's centre between the point beneath the satellite and the edge of what it can see."
breaks = "It treats the Earth as a perfect sphere. A negative angle means the target is below the horizon, and beyond 85 degrees the whole visible hemisphere would be in view, which does not occur in this band."
by = "an assistant, from what this sheet states — for its owner (systems) to confirm"

[maths]
expression = "lambda = acos((Re/r)*cos(eps)) - eps"
source = "larson_wertz"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "lambda"
type = "Angle"
unit = "Degree"
lower = 0.0
upper = 86.0
reason_lower = "a negative half-angle means the target is below the horizon"
reason_upper = "beyond 85 degrees the whole visible hemisphere is in view, which does not occur in this band"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "r"
var = "orbit_radius"
type = "Length"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "eps"
var = "orbit_min_elevation"
type = "Angle"

[[algorithm.step]]
number = 1
text = "apply the spherical Earth access geometry"
binds = "l"
type = "Angle"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (systems) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "The spherical Earth access geometry, as stated and cited to larson_wertz and not yet derived on the sheet."
breaks_if = "A derivation or a comparison with larson_wertz that disagrees, or an angle below zero or beyond the sheet's upper bound."
relation = "lambda = acos((Re/r)*cos(eps)) - eps"
source = "larson_wertz"
