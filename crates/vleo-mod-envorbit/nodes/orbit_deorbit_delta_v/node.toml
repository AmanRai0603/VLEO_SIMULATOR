# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "orbit_deorbit_delta_v"
label = "Disposal delta-v"
folder = "orbit_deorbit_delta_v"   # frozen at seed; renaming the label never moves the directory
subsystem = "orbit"
parent = "l3_x_envorbit"
kind = "computed"
owner = "systems"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 529
state = "published"

[question]
text = "What does the end-of-life disposal manoeuvre cost, as required by the debris mitigation standard?"
note = "Carried as a design variable rather than discovered at the end, because ISO 24113 makes it a requirement and not a courtesy."

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "What the end-of-life disposal manoeuvre costs, as a change of speed: lowering the orbit's lowest point to a 60 kilometre re-entry interface. It is carried as a design variable from the start because ISO 24113, the debris mitigation standard, makes disposal a requirement and not a courtesy."
breaks = "It prices one idealised Hohmann transfer, the standard two-burn orbit change, from the flight altitude. Above 500 metres per second the disposal budget dominates the design and the altitude choice should be revisited."
by = "an assistant, from what this sheet states — for its owner (systems) to confirm"

[maths]
expression = "dv = |V_circ - V_transfer(r, a_t)|"
source = "iso24113"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "dv_dis"
type = "Velocity"
unit = "MetrePerSecond"
lower = 0.0
upper = 500.0
reason_lower = "a disposal manoeuvre cannot cost negative delta-v"
reason_upper = "above 500 m/s the disposal budget dominates the design and the altitude choice should be revisited"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "h"
var = "orbit_altitude"
type = "Length"

[[algorithm.step]]
number = 1
text = "lower perigee to a 60 km re-entry interface on a Hohmann transfer"
binds = "dv"
type = "Velocity"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (systems) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "A Hohmann transfer lowering perigee to a 60 kilometre re-entry interface, as stated and cited to iso24113 and not yet derived on the sheet."
breaks_if = "A derivation or a comparison with iso24113 that disagrees, a disposal that must reach an interface other than 60 kilometres, or a cost above 500 metres per second."
relation = "dv = |V_circ - V_transfer(r, a_t)|"
source = "iso24113"
