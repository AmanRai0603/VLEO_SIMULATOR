# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "env_wall_temperature"
label = "Spacecraft surface temperature"
folder = "env_wall_temperature"   # frozen at seed; renaming the label never moves the directory
subsystem = "env"
parent = "l3_x_envorbit"
kind = "declared"
owner = "thermal"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 498
state = "published"

[question]
text = "What temperature are the surfaces the atmosphere strikes?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How hot the outer surfaces are where the air strikes them: 300 kelvin. It feeds how the air is taken to bounce off those surfaces, and so the drag the spacecraft feels."
breaks = "It is one declared temperature for the struck surfaces. Below 150 kelvin no external surface of this design is predicted to fall and the fit has no data; above 500 kelvin the materials are outside their qualification range, so a drag figure there means nothing."
by = "an assistant, from what this sheet states — for its owner (thermal) to confirm"

[maths]
expression = "T_w = 300"
source = "sentman1961"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "T_w"
type = "Temperature"
unit = "Kelvin"
lower = 150.0
upper = 500.0
reason_lower = "below 150 K no external surface of this design is predicted to fall, and the accommodation fit has no data there"
reason_upper = "above 500 K the surface materials are outside their qualification range, so a drag figure computed there is meaningless anyway"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 300.0
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "next"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (thermal) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That 300 kelvin is the temperature of the surfaces the air strikes, from the source the sheet cites (sentman1961), confirmed by A. Rai on 2026-09-01."
breaks_if = "A thermal prediction for this design's exposed surfaces that differs from 300 kelvin."
relation = "T_w = 300"
source = "sentman1961"
