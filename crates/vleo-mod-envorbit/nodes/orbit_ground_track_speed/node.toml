# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "orbit_ground_track_speed"
label = "Ground track speed"
folder = "orbit_ground_track_speed"   # frozen at seed; renaming the label never moves the directory
subsystem = "orbit"
parent = "l3_x_envorbit"
kind = "computed"
owner = "systems"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 520
state = "published"

[question]
text = "How fast does the sub-satellite point move over the ground?"
note = "Not the orbital speed. The difference is what sets sensor dwell time and therefore signal-to-noise."

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How fast the point directly beneath the satellite moves across the ground. It is not the orbital speed, and the difference is what sets how long a sensor dwells on a scene and therefore how much signal it gathers against noise."
breaks = "The sheet holds it between 6 and 8 kilometres per second: below 6 is outside this tool's altitude band, and the ground track can never move faster than the orbital speed."
wrong = "That the ground track moves at the orbital speed. It does not; the difference sets sensor dwell time and therefore signal-to-noise."
by = "an assistant, from what this sheet states — for its owner (systems) to confirm"

[maths]
expression = "V_g = V*Re/r"
source = "larson_wertz"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "V_g"
type = "Velocity"
unit = "MetrePerSecond"
lower = 6000.0
upper = 8000.0
reason_lower = "below 6 km/s is outside this tool's altitude band"
reason_upper = "the ground track can never move faster than the orbital speed"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "v"
var = "orbit_velocity"
type = "Velocity"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "r"
var = "orbit_radius"
type = "Length"

[[algorithm.step]]
number = 1
text = "scale the orbital speed by the ratio of Earth radius to orbital radius"
binds = "vg"
type = "Velocity"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (systems) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "The orbital speed scaled by the ratio of Earth radius to orbital radius, as stated and cited to larson_wertz and not yet derived on the sheet."
breaks_if = "A derivation or a comparison with larson_wertz that disagrees, a speed above the orbital speed, or one below 6 kilometres per second."
relation = "V_g = V*Re/r"
source = "larson_wertz"
