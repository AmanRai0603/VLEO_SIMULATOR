# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "orbit_slant_range"
label = "Slant range at working elevation"
folder = "orbit_slant_range"   # frozen at seed; renaming the label never moves the directory
subsystem = "orbit"
parent = "l3_x_envorbit"
kind = "computed"
owner = "systems"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 525
state = "published"

[question]
text = "How far away is a target or ground station at the edge of the access circle?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "The straight-line distance from the spacecraft to a target or ground station at the edge of the area it can reach, where the station sees it at the lowest elevation it will work at. It comes from the triangle formed by the Earth's centre, the spacecraft and the station."
breaks = "It is the distance at the edge of that area only; the sheet notes the distance can never be less than the altitude. Beyond 4000 kilometres the geometry is outside this tool's band."
by = "an assistant, from what this sheet states — for its owner (systems) to confirm"

[maths]
expression = "d = sqrt(Re^2 + r^2 - 2*Re*r*cos(lambda))"
source = "larson_wertz"

[method]
text = """
# Transcribed from crates/vleo-mod-envorbit/nodes/orbit_slant_range/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
return slant_range(r, eps)
"""
by = ""
transcribed_from = "crates/vleo-mod-envorbit/nodes/orbit_slant_range/model.rs"
checked_by = "Aman Rai"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "d"
type = "Length"
unit = "Kilometre"
lower = 100.0
upper = 4000.0
reason_lower = "the slant range is at least the altitude"
reason_upper = "beyond 4000 km the geometry is outside this tool's band"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "r"
var = "orbit_radius"
type = "Length"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "eps"
var = "orbit_min_elevation"
type = "Angle"

[[algorithm.step]]
number = 1
text = "apply the law of cosines across the access triangle"
binds = "d"
type = "Length"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (systems) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "The law of cosines across the access triangle, as stated and cited from larson_wertz, not yet derived on the sheet."
breaks_if = "A derivation or a check against larson_wertz disagrees, or the result comes out below the altitude or beyond 4000 kilometres."
relation = "d = sqrt(Re^2 + r^2 - 2*Re*r*cos(lambda))"
source = "larson_wertz"
