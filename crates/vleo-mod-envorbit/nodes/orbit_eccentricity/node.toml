# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "orbit_eccentricity"
label = "Orbit eccentricity"
folder = "orbit_eccentricity"   # frozen at seed; renaming the label never moves the directory
subsystem = "orbit"
parent = "l3_x_envorbit"
kind = "declared"
owner = "systems"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 512
state = "published"

[question]
text = "How circular is the orbit?"
note = "Moving this reaches 3 nodes. Moving the altitude reaches 54. The difference is the answer to how much of the design a change just invalidated."

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How far the orbit is from a perfect circle: zero, a circular orbit. Changing it reaches only three rows, which shows how little of the design depends on it compared with altitude."
breaks = "It is only meaningful up to 0.05. Beyond that the lowest point of a 250 kilometre orbit dips below 200 kilometres, the drag on each revolution stops being a small effect, and the circular-orbit working used throughout the tree no longer applies."
wrong = "It is easy to assume every orbit setting reaches as far as any other. It does not: moving this one reaches three rows, while moving the altitude reaches 54."
by = "an assistant, from what this sheet states — for its owner (systems) to confirm"

[maths]
expression = "e = 0"
source = "orbitt_case_c1"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "e"
type = "Ratio"
unit = "One"
lower = 0.0
upper = 0.05
reason_lower = "a negative eccentricity is not an orbit"
reason_upper = "above 0.05 the perigee of a 250 km orbit is below 200 km, where the drag per revolution stops being a small perturbation and the circular-orbit relations used throughout this tree no longer apply"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 0.0
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "next"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (systems) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That the orbit is circular, eccentricity 0, as taken from the source case the sheet cites (orbitt_case_c1), confirmed by A. Rai on 2026-09-01."
breaks_if = "An orbit for this design with eccentricity above 0.05, where the circular-orbit working throughout the tree stops applying."
relation = "e = 0"
source = "orbitt_case_c1"
