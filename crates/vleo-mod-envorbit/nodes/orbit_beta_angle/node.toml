# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "orbit_beta_angle"
label = "Beta angle"
folder = "orbit_beta_angle"   # frozen at seed; renaming the label never moves the directory
subsystem = "orbit"
parent = "l3_x_envorbit"
kind = "declared"
owner = "systems"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 515
state = "published"

[question]
text = "What angle does the Sun make with the orbit plane? It decides eclipse duration and therefore both the power and the thermal design."

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "The angle the Sun makes with the plane of the orbit: 30 degrees. It decides how long the spacecraft spends in the Earth's shadow on each orbit, and so drives both the power and the thermal design."
breaks = "It is one fixed angle, while the sheet gives no reason for choosing 30 degrees in particular. The angle is defined only from minus 90 to 90 degrees."
by = "an assistant, from what this sheet states — for its owner (systems) to confirm"

[maths]
expression = "beta = 30"
source = "larson_wertz"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "beta"
type = "Angle"
unit = "Degree"
lower = -90.0
upper = 90.0
reason_lower = "the angle between the orbit plane and the Sun is defined on -90..90"
reason_upper = "the angle between the orbit plane and the Sun is defined on -90..90"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 30.0
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (systems) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That a Sun angle of 30 degrees to the orbit plane is the right case for this design, with the value drawn from the textbook the sheet cites (larson_wertz), confirmed by A. Rai on 2026-09-01; the sheet gives no reason for this value."
breaks_if = "An orbit for this design that puts the Sun at a different angle to the orbit plane than 30 degrees."
relation = "beta = 30"
source = "larson_wertz"
