# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "env_chamber_temperature"
label = "Intake chamber gas temperature"
folder = "env_chamber_temperature"   # frozen at seed; renaming the label never moves the directory
subsystem = "env"
parent = "l3_x_envorbit"
kind = "declared"
owner = "propulsion"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 499
state = "published"

[question]
text = "What temperature does the collected gas reach in the collection chamber?"
note = "Drives the mean thermal speed, and therefore back-flow: a hotter chamber leaks harder."

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How hot the gas collected by the intake gets inside its collection chamber: 600 kelvin. Hotter gas moves faster and leaks back out harder, so this sets how much of the collected air escapes the way it came in."
breaks = "It is one declared temperature, not worked out from the chamber itself. It cannot be colder than the walls around it, and above 1500 kelvin the gas can no longer be treated as settled at one temperature and electrically neutral."
by = "an assistant, from what this sheet states — for its owner (propulsion) to confirm"

[maths]
expression = "T_c = 600"
source = "romano2021"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "T_c"
type = "Temperature"
unit = "Kelvin"
lower = 300.0
upper = 1500.0
reason_lower = "the chamber cannot be colder than the walls that bound it"
reason_upper = "above 1500 K the assumption that the chamber gas is thermalised and un-ionised stops holding"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 600.0
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "next"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (propulsion) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That 600 kelvin is the chamber gas temperature, from the source the sheet cites (romano2021), confirmed by A. Rai on 2026-09-01."
breaks_if = "A thermal analysis or test of the intake chamber giving a gas temperature other than 600 kelvin, or one above 1500 kelvin where the gas is no longer thermalised and un-ionised."
relation = "T_c = 600"
source = "romano2021"
