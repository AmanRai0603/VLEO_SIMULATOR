# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "mis_availability"
label = "Constellation service availability"
folder = "mis_availability"   # frozen at seed; renaming the label never moves the directory
subsystem = "mis"
parent = "l3_x_envorbit"
kind = "computed"
owner = "operations"
tier = "B"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 704
state = "published"

[question]
text = "What fraction of the time is the service available?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "What fraction of the time the service is available, taken as the chance that at least 80 per cent of the constellation's satellites are working at once, given how often each one is working on its own."
breaks = "It treats every satellite as equally reliable and as failing independently of the others, which is what the binomial count assumes. The 80 per cent threshold is written into the relation rather than read from the mission."
by = "an assistant, from what this sheet states — for its owner (operations) to confirm"

[maths]
expression = "A = P(at least ceil(0.8*N) of N satellites up)"
source = "larson_wertz"

[method]
text = """
# Transcribed from crates/vleo-mod-envorbit/nodes/mis_availability/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
# Constants the code held, written out here as it held them: 0.8.
return k_of_n_availability(a, n, ceil(n * 0.8))
"""
by = ""
transcribed_from = "crates/vleo-mod-envorbit/nodes/mis_availability/model.rs"
checked_by = "Aman Rai"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "A_svc"
type = "Ratio"
unit = "One"
lower = 0.0
upper = 1.0
reason_lower = "an availability cannot be negative"
reason_upper = "an availability cannot exceed one"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "a"
var = "mis_unit_availability"
type = "Ratio"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "n"
var = "mis_satellites"
type = "Ratio"

[[algorithm.step]]
number = 1
text = "evaluate the binomial probability that at least 80% of the constellation is operational"
binds = "av"
type = "Ratio"

[contributes]
kpis = ["kpi_availability"]

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (operations) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "The binomial probability that at least 80 per cent of the constellation is operational, as stated and cited to larson_wertz and not yet derived on the sheet."
breaks_if = "A derivation or a comparison with larson_wertz that disagrees, satellites whose failures are linked, or a service that needs more or fewer than 80 per cent of the constellation."
relation = "A = P(at least ceil(0.8*N) of N satellites up)"
source = "larson_wertz"
