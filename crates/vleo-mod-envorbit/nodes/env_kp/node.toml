# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "env_kp"
label = "Planetary geomagnetic index Kp"
folder = "env_kp"   # frozen at seed; renaming the label never moves the directory
subsystem = "env"
parent = "l3_x_envorbit"
kind = "computed"
owner = "environment"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 497
state = "published"

[question]
text = "What planetary geomagnetic index is the design sized to?"
note = """
The geomagnetic driver of the thermosphere relation, computed by the solar-
weather subsystem and carried here through layer 2.

WHICH SLOT this is remains open. The subsystem publishes a daily MEAN slot and
a daily PEAK slot per scenario and they are different numbers; sw_kp_driving_slot
is the seeded row that will say which one a design is driven by, and it needs a
person. Until it carries a value this row carries what layer 2 publishes, and
env_exospheric_temperature's second assumption says so at length.
"""

[maths]
# NOT A RELATION. The identity is the point: one row owns the answer and this
# one carries it, because two rows declaring the design flux is two rows that
# can disagree and the readers are sized against whichever they opened.
confirmed_by = ""
expression = "Kp = Kp_sys"
source = "orbitt_case_c1"

# WHERE THIS RELATION CAME FROM. Prose, outside the sheet hash.
[theory]
why = """
It restates what the system layer was told; it does not decide it.

Kp indexes the energy the auroral electrojets deposit directly into the
thermosphere, and what level a design should be sized to over a mission window
is a statement about that window — the subsystem's work, not this row's. It was
declared here as 3 while the subsystem computed 5.198 over the same window, and
nothing compared them.
"""
reading = """
It is QUASI-LOGARITHMIC and it is a slot. Kp is not a linear index, which is
why the relation reading it has an exponential term as well as a linear one,
and it is not a single daily number either — the record has eight three-hourly
values a day and a daily statistic has to choose between their mean and their
peak.

The value rose from 3 to 5.198 when this wiring landed, which through the
thermosphere relation is a substantially hotter and therefore denser upper
atmosphere. That direction is the opposite of what env_f107 did, and both are
the record's own answer replacing a round number.
"""

[[theory.step]]
text = """
Take what layer 2 publishes and pass it on, at the same type and the same unit.
There is no arithmetic here on purpose: the value of the row is that there is
nowhere for a discrepancy to enter between what the subsystem concluded and
what the design is built to.
"""
math = "Kp = Kp_sys"

[[input]]
# Read across the layer boundary: the driver is a system-level conclusion and
# lives at layer 2. The subsystem that produced it is reached through its
# interface, never by reaching into it.
binding = "from_system"
var = "sys_space_environment_kp"
type = "Ratio"

[[algorithm.step]]
number = 1
text = "carry the system layer's geomagnetic index through unchanged"
binds = "index"
type = "Ratio"


[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "Kp"
type = "Ratio"
unit = "One"
lower = 0.0
upper = 9.0
reason_lower = "Kp is defined on 0..9; a negative index is not a quiet day, it is a unit error"
reason_upper = "Kp is defined on 0..9. This is the guard that catches an Ap value passed in by mistake, which would otherwise return an exospheric temperature of 1e18 K without complaint"


[view]
kind = "number"

