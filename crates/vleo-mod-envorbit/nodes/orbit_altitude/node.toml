# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "orbit_altitude"
label = "Orbit altitude"
folder = "orbit_altitude"   # frozen at seed; renaming the label never moves the directory
subsystem = "orbit"
parent = "l3_x_envorbit"
kind = "declared"
owner = "systems"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 511
state = "published"

[question]
text = "At what altitude does the constellation fly? This is the one parameter the whole architecture is shaped around."
note = "Move this one value and 54 other nodes become stale. That is the requirement the tool exists to satisfy."

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How high above the Earth the constellation flies: 250 kilometres. It is the one choice the whole design is shaped around; changing it makes 54 other rows out of date, and it bears on revisit, image sharpness and service lifetime."
breaks = "It is only meaningful between 150 and 450 kilometres. Below 150 kilometres the air around a body this size stops behaving as separate molecules, and every aerodynamic row is outside the range it was built for; above 450 kilometres there is not enough air for the air-breathing concept to be the reason for the design."
by = "an assistant, from what this sheet states — for its owner (systems) to confirm"

[maths]
expression = "h = 250"
source = "orbitt_case_c1"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "h"
type = "Length"
unit = "Kilometre"
lower = 150.0
upper = 450.0
reason_lower = "below 150 km the flow stops being free-molecular for a body of this size and every aerodynamic node in the tree is outside its envelope"
reason_upper = "above 450 km there is not enough air for the air-breathing concept to be the reason for the design"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 250.0
confirmed_by = "A. Rai / 2026-09-01"

[contributes]
kpis = ["kpi_revisit", "kpi_gsd", "kpi_service_lifetime"]

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (systems) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That 250 km is the altitude this design flies at, as taken from the source case the sheet cites (orbitt_case_c1), confirmed by A. Rai on 2026-09-01."
breaks_if = "A decision to fly the constellation at a different altitude, or one below 150 km or above 450 km, where the tree's aerodynamic and air-breathing reasoning no longer holds."
relation = "h = 250"
source = "orbitt_case_c1"
