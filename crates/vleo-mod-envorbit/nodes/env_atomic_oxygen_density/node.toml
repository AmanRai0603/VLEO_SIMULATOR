# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "env_atomic_oxygen_density"
label = "Atomic oxygen number density"
folder = "env_atomic_oxygen_density"   # frozen at seed; renaming the label never moves the directory
subsystem = "env"
parent = "l3_x_envorbit"
kind = "computed"
owner = "environment"
tier = "B"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 505
state = "published"

[question]
text = "How much atomic oxygen is there — the species that erodes materials and the one an intake actually collects?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How many oxygen atoms, as single atoms rather than molecules, there are in each cubic metre at the flight altitude. Atomic oxygen is the gas that erodes materials and the one an air intake actually collects, so it matters twice over."
breaks = "It treats atomic oxygen alone, settled by its own weight as if undisturbed, driven only by altitude and the temperature of the upper atmosphere. Below a hundred million per cubic metre there is effectively none; above ten billion billion it would be denser than all the gas together at the model's base."
by = "an assistant, from what this sheet states — for its owner (environment) to confirm"

[maths]
expression = "n_O(z) = n_O(z0)*(T0/T)*exp(-INT M_O*g/(R*T) dz)"
source = "jacchia1971"

[method]
text = """
# Transcribed from crates/vleo-mod-envorbit/nodes/env_atomic_oxygen_density/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
return thermosphere_o(h, t_inf)
"""
by = ""
transcribed_from = "crates/vleo-mod-envorbit/nodes/env_atomic_oxygen_density/model.rs"
checked_by = ""

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "n_O"
type = "NumberDensity"
unit = "PerCubicMetre"
lower = 100000000.0
upper = 1e+19
reason_lower = "below 1e8 there is effectively no atomic oxygen and the accommodation model returns a specular surface"
reason_upper = "above 1e19 is denser than the total number density at the model base"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "h"
var = "orbit_altitude"
type = "Length"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "t_inf"
var = "env_exospheric_temperature"
type = "Temperature"

[[algorithm.step]]
number = 1
text = "integrate diffusive equilibrium for atomic oxygen alone"
binds = "n_o"
type = "NumberDensity"

[contributes]
kpis = ["kpi_service_lifetime"]

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (environment) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "Atomic oxygen alone in diffusive equilibrium, settled against gravity at the local temperature, as stated and cited to jacchia1971 and not yet derived on the sheet."
breaks_if = "A derivation or a comparison with jacchia1971 that disagrees, or a result below a hundred million or above ten billion billion per cubic metre."
relation = "n_O(z) = n_O(z0)*(T0/T)*exp(-INT M_O*g/(R*T) dz)"
source = "jacchia1971"
