# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "orbit_radius"
label = "Geocentric radius"
folder = "orbit_radius"   # frozen at seed; renaming the label never moves the directory
subsystem = "orbit"
parent = "l3_x_envorbit"
kind = "computed"
owner = "systems"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 517
state = "published"

[question]
text = "How far is the spacecraft from the centre of the Earth?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How far the spacecraft is from the centre of the Earth, in metres: its altitude added to the Earth's radius at the equator, as the WGS-84 standard model of the Earth's shape gives it."
breaks = "It adds the one equatorial radius whatever latitude the spacecraft is over. It is held between 6400 and 7000 kilometres: below the Earth's mean radius is not an orbit, and above 7000 kilometres is outside the band this tool is scoped to."
by = "an assistant, from what this sheet states — for its owner (systems) to confirm"

[maths]
expression = "r = R_earth + h"
source = "wgs84"

[method]
text = """
# Transcribed from crates/vleo-mod-envorbit/nodes/orbit_radius/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
return orbit_radius(h)
"""
by = ""
transcribed_from = "crates/vleo-mod-envorbit/nodes/orbit_radius/model.rs"
checked_by = ""

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "r"
type = "Length"
unit = "Metre"
lower = 6400000.0
upper = 7000000.0
reason_lower = "below the Earth's mean radius is not an orbit"
reason_upper = "above 7000 km is outside the band this tool is scoped to"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "h"
var = "orbit_altitude"
type = "Length"

[[algorithm.step]]
number = 1
text = "add the WGS-84 equatorial radius to the altitude"
binds = "r"
type = "Length"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (systems) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "Altitude plus the WGS-84 equatorial radius, as stated and cited from wgs84, not yet derived on the sheet."
breaks_if = "A comparison with wgs84 disagrees, or the result falls below the Earth's mean radius or above 7000 kilometres, meaning the altitude fed in is not an orbit in this tool's band."
relation = "r = R_earth + h"
source = "wgs84"
