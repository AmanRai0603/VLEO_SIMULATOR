# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "mis_delivery_time"
label = "Delivery time to the customer"
folder = "mis_delivery_time"   # frozen at seed; renaming the label never moves the directory
subsystem = "mis"
parent = "l3_x_envorbit"
kind = "declared"
owner = "operations"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 696
state = "published"

[question]
text = "How long does the product take to reach the customer once processed?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How long a finished product takes to reach the customer once ground processing is done: 3 minutes. It is part of how quickly the service can put a product in a customer's hands, which is one of the figures the design is judged by."
breaks = "It is one fixed number, so it leaves out any spread from day to day or customer to customer. It is only held to be sensible between six seconds and a day: below that no delivery path in this design runs, and above a day the product is not the near-real-time one being sold."
wrong = "It is easy to read this as the whole wait after the data lands. It is not: it starts once the product is processed, and ground processing is counted separately."
by = "an assistant, from what this sheet states — for its owner (operations) to confirm"

[maths]
expression = "t_del = 3"
source = "orbitt_case_c1"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "t_del"
type = "Time"
unit = "Minute"
lower = 0.1
upper = 1440.0
reason_lower = "below six seconds no delivery path in this design runs"
reason_upper = "above a day the product is not the near-real-time one being sold"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 3.0
confirmed_by = "A. Rai / 2026-09-01"

[contributes]
kpis = ["kpi_latency"]

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (operations) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That 3 minutes is the delivery time for this design's product, as taken from the source case the sheet cites (orbitt_case_c1), confirmed by A. Rai on 2026-09-01."
breaks_if = "A measured or specified delivery time for this design's delivery path that differs from 3 minutes, or one longer than a day."
relation = "t_del = 3"
source = "orbitt_case_c1"
