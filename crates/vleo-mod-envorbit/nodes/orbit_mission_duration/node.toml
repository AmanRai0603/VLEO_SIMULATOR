# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "orbit_mission_duration"
label = "Mission duration"
folder = "orbit_mission_duration"   # frozen at seed; renaming the label never moves the directory
subsystem = "orbit"
parent = "l3_x_envorbit"
kind = "computed"
owner = "systems"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 516
state = "published"

[question]
text = "How long must one satellite operate?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How long one satellite must keep operating. It does not decide this itself: it carries the mission length already set as a programme requirement, five years, unchanged to the subsystem rows that need it, so that there is only one number for it and nowhere for a second opinion to enter."
breaks = "It is one satellite's working life, not the service's. A constellation that replaces satellites sooner than a satellite's life has two mission lengths, and this is the shorter. It is only meaningful between six months and 15 years, the same range as the requirement it carries."
wrong = "It is easy to read this as how long the service runs. It is one satellite's operating duration, and it restates the requirement rather than setting it."
by = "an assistant, from what this sheet states — for its owner (systems) to confirm"

[maths]
# IT RESTATES THE REQUIREMENT, it does not set it. Two rows declaring a mission
# length is two rows that can disagree about how long the mission is, and the
# twelve rows reading this one would then be sized against whichever of the two
# their author happened to open. The number lives at layer 2 where the
# requirement is, and this row carries it into the subsystems that read it.
expression = "T_mis = T_mis_req"
source = "orbitt_case_c1"

# WHERE THIS RELATION CAME FROM. The account below is the one that was already
# written as a comment on [maths] above, moved into the field the schema keeps
# for it. Nothing about the relation changed: it was and is the identity, and
# `T_mis_req` is still declared at layer 2 and confirmed there.
#
# It is here because a comment is not a field. A row whose derivation lives in a
# comment reads, to everything downstream, exactly like a row nobody derived —
# and this one was standing in front of 26 others, 21 of them the solar
# subsystem, for that reason alone.
[theory]
why = """
It restates the requirement; it does not set it.

Mission length is a programme decision, so it is declared once, at layer 2,
where the requirements are — `sys_mission_requirements_mission_duration`, five
years, confirmed. This row is the subsystem-facing copy of that decision, and
its relation is the identity because a copy that computes anything is a second
opinion about how long the mission is.

Two rows declaring a mission length is two rows that can disagree, and the
twelve rows reading this one would then be sized against whichever of the two
their author happened to open. Carrying the number rather than re-declaring it
is what makes that impossible.
"""

reading = """
It is ONE SATELLITE'S operating duration, not the service's. A constellation
that replenishes on a schedule shorter than a satellite's life has two mission
lengths and this is the shorter one — the upstream row states that as its
assumption, and it travels with the number rather than staying at layer 2.

The declared range is the same 0.5 to 15 years as the requirement it carries,
and deliberately so: a copy with a wider range would admit a value its own
source refuses.
"""

[[theory.step]]
text = """
Take the declared requirement and publish it unchanged, at the same type and
the same unit. There is no arithmetic here on purpose: the whole value of the
row is that there is nowhere for a discrepancy to enter.
"""
math = "T_mis = T_mis_req"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "required"
var = "sys_mission_requirements_mission_duration"
type = "Time"

[[algorithm.step]]
number = 1
text = "carry the declared mission duration through unchanged"
binds = "duration"
type = "Time"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "T_mis"
type = "Time"
unit = "Year"
lower = 0.5
upper = 15.0
reason_lower = "below six months the programme cannot amortise a satellite, so it is not the mission being designed"
reason_upper = "above 15 years the cost model, the degradation model and the battery cycle model are all extrapolated well past their fits"

[contributes]
kpis = ["kpi_cost_per_year"]

[view]
kind = "number"

[[version]]
n = 1
release = "next"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (systems) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That the declared mission-duration requirement at layer 2 is the right length for one satellite, carried here unchanged in type and unit, within 0.5 to 15 years."
breaks_if = "A mission length below six months, where the programme cannot pay back a satellite, or above 15 years, where the cost, degradation and battery cycle models are all used well past their fits."
relation = "T_mis = T_mis_req"
source = "orbitt_case_c1"
