# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "env_density_uncertainty"
label = "Density model uncertainty"
folder = "env_density_uncertainty"   # frozen at seed; renaming the label never moves the directory
subsystem = "env"
parent = "l3_x_envorbit"
kind = "computed"
owner = "environment"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 509
state = "published"

[question]
text = "How wrong might the density be, and therefore how wrong is every margin built on it?"
note = "A node that consumes density and does not carry this forward is a node whose margin is fictional."

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How far wrong the air density might be, as a fraction of it, and therefore how wrong every margin built on the density might be. It starts from the error the model makes on quiet days and grows as the Earth's magnetic field becomes more disturbed."
breaks = "It is one spread that depends only on geomagnetic disturbance. The sheet holds it to no less than five per cent, because no published comparison of an empirical model against measured drag does better, and no more than one hundred per cent, beyond which there is no model at all."
wrong = "That a margin computed from density is as certain as it looks. A row that consumes density and does not carry this uncertainty forward has a margin that is fictional."
by = "an assistant, from what this sheet states — for its owner (environment) to confirm"

[maths]
expression = "sigma_rho = 0.15 + 0.03*Kp"
source = "doornbos2011"

[method]
text = """
# Transcribed from crates/vleo-mod-envorbit/nodes/env_density_uncertainty/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
return density_uncertainty(kp)
"""
by = ""
transcribed_from = "crates/vleo-mod-envorbit/nodes/env_density_uncertainty/model.rs"
checked_by = ""

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "sigma_rho"
type = "Ratio"
unit = "One"
lower = 0.05
upper = 1.0
reason_lower = "no published comparison of an empirical thermosphere model against measured drag does better than 5%"
reason_upper = "an uncertainty above 100% of the value is not an uncertainty, it is an absence of a model"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "kp"
var = "env_kp"
type = "Ratio"

[[algorithm.step]]
number = 1
text = "apply the quiet-time residual and grow it with geomagnetic activity"
binds = "s"
type = "Ratio"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (environment) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "A quiet-time residual that grows with geomagnetic activity, as stated and cited to doornbos2011 and not yet derived on the sheet."
breaks_if = "A comparison with doornbos2011 or with measured drag that disagrees, or a result below five per cent or above one hundred per cent."
relation = "sigma_rho = 0.15 + 0.03*Kp"
source = "doornbos2011"
