# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "env_magnetic_field"
label = "Geomagnetic flux density"
folder = "env_magnetic_field"   # frozen at seed; renaming the label never moves the directory
subsystem = "env"
parent = "l3_x_envorbit"
kind = "computed"
owner = "environment"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 509
state = "published"

[question]
text = "How strong is the magnetic field at the flight altitude?"

[maths]
expression = "B = B0*(Re/r)^3*sqrt(1 + 3*sin^2(lat_m))"
source = "igrf2020"

[[assumption]]
text = "Centred dipole, no higher-order terms"
fails_when = "the South Atlantic Anomaly departs from a dipole by up to 30%; a magnetorquer sized on this alone is undersized there"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "B"
type = "MagneticFluxDensity"
unit = "Tesla"
lower = 1e-06
upper = 0.0001
reason_lower = "the field never falls below a microtesla at these altitudes"
reason_upper = "the surface equatorial field is 3.1e-5 T; 1e-4 would be four times the polar surface value"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "r"
var = "orbit_radius"
type = "Length"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "lat_m"
var = "gnc_magnetic_latitude"
type = "Angle"

[[algorithm.step]]
number = 1
text = "evaluate the tilted dipole approximation at the orbital radius"
binds = "b"
type = "MagneticFluxDensity"

[view]
kind = "number"

