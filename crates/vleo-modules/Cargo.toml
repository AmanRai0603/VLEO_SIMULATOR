[package]
name = "vleo-modules"
description = "The facade. Holds the graph read from the design's files when a face opens it, and implements the one NodeTable the resolver walks. It has no formula and no design of its own."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
vleo-core = { workspace = true }
vleo-bus = { workspace = true }
vleo-units = { workspace = true }
vleo-sheet = { workspace = true, optional = true }
vleo-data = { workspace = true, optional = true }
# The design as its files (design/), read where the engine opens.
vleo-files = { path = "../vleo-files", optional = true }

[dev-dependencies]
# The table every reader takes a file by: the saved files here are held to it.
vleo-kinds = { workspace = true }
# The tests run the engine on the design read from its files, which needs the
# standard library; the crate itself still builds without it.
vleo-modules = { path = ".", features = ["std"] }

[features]
default = []
# With std the facade also keeps the case and saved results on disk, and every
# such write goes through vleo-data's write_whole — one way of writing a
# person's data, not one per file.
# ... and writes a result as its page, from the page's parts in web/pages
# (vleo-sheet reads them), which only a face that saves results needs.
std = ["vleo-bus/std", "vleo-core/std", "dep:vleo-data", "dep:vleo-sheet", "dep:vleo-files"]

[lints.rust]
unsafe_code = "forbid"
