[package]
name = "vleo-modules"
description = "The facade. Re-exports the subsystem crates, holds the graph tables generated from the sheets at build time, and implements the one NodeTable the resolver walks. It has no formula of its own."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
vleo-core = { workspace = true }
vleo-bus = { workspace = true }
vleo-units = { workspace = true }
vleo-data = { workspace = true, optional = true }
# --- node crates, generated by tools/seed_tree.py ---
vleo-mod-acs = { path = "../vleo-mod-acs" }
vleo-mod-atthw = { path = "../vleo-mod-atthw" }
vleo-mod-closure = { path = "../vleo-mod-closure" }
vleo-mod-envorbit = { path = "../vleo-mod-envorbit" }
vleo-mod-fsw = { path = "../vleo-mod-fsw" }
vleo-mod-management = { path = "../vleo-mod-management" }
vleo-mod-massaero = { path = "../vleo-mod-massaero" }
vleo-mod-multipay = { path = "../vleo-mod-multipay" }
vleo-mod-navod = { path = "../vleo-mod-navod" }
vleo-mod-navsense = { path = "../vleo-mod-navsense" }
vleo-mod-orbmaint = { path = "../vleo-mod-orbmaint" }
vleo-mod-payload = { path = "../vleo-mod-payload" }
vleo-mod-pointing = { path = "../vleo-mod-pointing" }
vleo-mod-power = { path = "../vleo-mod-power" }
vleo-mod-prop = { path = "../vleo-mod-prop" }
vleo-mod-solar = { path = "../vleo-mod-solar" }
vleo-mod-struct = { path = "../vleo-mod-struct" }
vleo-mod-system = { path = "../vleo-mod-system" }
vleo-mod-thermal = { path = "../vleo-mod-thermal" }
vleo-mod-ttc = { path = "../vleo-mod-ttc" }
# --- end node crates ---

[build-dependencies]
vleo-sheet = { workspace = true }

[features]
default = []
# With std the facade also keeps the case and saved results on disk, and every
# such write goes through vleo-data's write_whole — one way of writing a
# person's data, not one per file.
std = ["vleo-bus/std", "vleo-core/std", "dep:vleo-data"]

[lints.rust]
unsafe_code = "forbid"
