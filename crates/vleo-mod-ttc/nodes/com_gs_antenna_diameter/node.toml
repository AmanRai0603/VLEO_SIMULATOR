# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "com_gs_antenna_diameter"
label = "Ground station antenna diameter"
folder = "com_gs_antenna_diameter"   # frozen at seed; renaming the label never moves the directory
subsystem = "com"
parent = "l3_ttc"
kind = "declared"
owner = "comms"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 634
state = "published"

[question]
text = "How large is the ground station antenna?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How wide the ground station's receiving antenna is: 5.4 metres. It is the ground end of the link the spacecraft's data must cross."
breaks = "It is one declared size for the ground antenna. Below half a metre no station in the costed network is that small, and above 35 metres it is a deep-space antenna, not a commercial ground station."
by = "an assistant, from what this sheet states — for its owner (comms) to confirm"

[maths]
expression = "D_g = 5.4"
source = "orbitt_case_c1"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "D_g"
type = "Length"
unit = "Metre"
lower = 0.5
upper = 35.0
reason_lower = "below 0.5 m no ground station in the costed network is that small"
reason_upper = "above 35 m is a deep-space aperture, not a commercial ground station"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 5.4
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

