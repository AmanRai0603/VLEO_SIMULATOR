# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "com_implementation_loss"
label = "Implementation loss"
folder = "com_implementation_loss"   # frozen at seed; renaming the label never moves the directory
subsystem = "com"
parent = "l3_ttc"
kind = "declared"
owner = "comms"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 637
state = "published"

[question]
text = "How far short of theory does the real modem fall, in decibels?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How far the real modem, the equipment that turns data into a radio signal and back, falls short of theory: 1.5 decibels. The link has to carry that much extra to make up for it."
breaks = "It is one declared figure, not a measurement of the modem that will fly. Above 6 decibels the equipment is not flight hardware."
by = "an assistant, from what this sheet states — for its owner (comms) to confirm"

[maths]
expression = "L_imp = 1.5"
source = "ccsds131"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "L_imp"
type = "Ratio"
unit = "One"
lower = 0.0
upper = 6.0
reason_lower = "an implementation loss cannot be negative"
reason_upper = "above 6 dB the equipment is not flight hardware"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 1.5
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "next"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (comms) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That 1.5 decibels is the implementation loss of this design's modem, from the source the sheet cites (ccsds131), confirmed by A. Rai on 2026-09-01."
breaks_if = "Test results on the flight modem showing a shortfall from theory other than 1.5 decibels."
relation = "L_imp = 1.5"
source = "ccsds131"
