# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "com_antenna_diameter"
label = "Spacecraft antenna diameter"
folder = "com_antenna_diameter"   # frozen at seed; renaming the label never moves the directory
subsystem = "com"
parent = "l3_ttc"
kind = "declared"
owner = "comms"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 631
state = "published"

[question]
text = "How large is the spacecraft downlink antenna?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How wide the spacecraft's antenna for sending payload data to the ground is. A bigger antenna focuses the signal more strongly, but it also faces the airflow and adds drag."
breaks = "Below 2 centimetres the relation that turns antenna size into focusing power does not hold at this frequency. Above 2 metres the antenna is a drag surface larger than the vehicle."
by = "an assistant, from what this sheet states — for its owner (comms) to confirm"

[maths]
expression = "D_a = 0.3"
source = "orbitt_case_c1"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "D_a"
type = "Length"
unit = "Metre"
lower = 0.02
upper = 2.0
reason_lower = "below 2 cm the aperture gain relation is not valid at this frequency"
reason_upper = "above 2 m the antenna is a drag surface larger than the vehicle"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 0.3
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (comms) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That 0.3 metres is this design's downlink antenna diameter, from the source the sheet cites (orbitt_case_c1), confirmed by A. Rai on 2026-09-01."
breaks_if = "A chosen antenna for this design with a different diameter, or a downlink that does not close with a 0.3 metre antenna."
relation = "D_a = 0.3"
source = "orbitt_case_c1"
