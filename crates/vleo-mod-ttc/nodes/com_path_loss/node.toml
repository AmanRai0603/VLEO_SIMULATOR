# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "com_path_loss"
label = "Free space path loss"
folder = "com_path_loss"   # frozen at seed; renaming the label never moves the directory
subsystem = "com"
parent = "l3_ttc"
kind = "computed"
owner = "comms"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 644
state = "published"

[question]
text = "How much of the signal is lost simply by spreading out over the range?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How much of the signal is lost simply by spreading out over the distance between spacecraft and ground station, in decibels. It is set by the straight-line working distance to the station and the carrier frequency."
breaks = "It is spreading loss alone, taken at one working distance, and the sheet states no assumptions or derivation. Below 100 decibels the range is shorter than any orbit in this band; above 250 it is not a range this tool covers."
by = "an assistant, from what this sheet states — for its owner (comms) to confirm"

[maths]
expression = "L = (4*pi*d/lambda)^2"
source = "larson_wertz"

[method]
text = """
# Transcribed from crates/vleo-mod-ttc/nodes/com_path_loss/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
return free_space_path_loss_db(d, f)
"""
by = ""
transcribed_from = "crates/vleo-mod-ttc/nodes/com_path_loss/model.rs"
checked_by = "Aman Rai"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "L_fs"
type = "Ratio"
unit = "Decibel"
lower = 100.0
upper = 250.0
reason_lower = "below 100 dB the range is shorter than any orbit in this band"
reason_upper = "above 250 dB the range is not one this tool covers"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "d"
var = "orbit_slant_range"
type = "Length"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "f"
var = "com_frequency"
type = "Frequency"

[[algorithm.step]]
number = 1
text = "apply the inverse-square spreading loss at the working slant range"
binds = "l"
type = "Ratio"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (comms) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "Its relation as stated and cited from larson_wertz, the inverse-square spreading loss at the working slant range, not yet derived on the sheet."
breaks_if = "A derivation or a comparison with larson_wertz that disagrees, or a result outside 100 to 250 decibels."
relation = "L = (4*pi*d/lambda)^2"
source = "larson_wertz"
