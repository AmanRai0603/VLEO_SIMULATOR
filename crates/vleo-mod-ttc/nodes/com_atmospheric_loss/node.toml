# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "com_atmospheric_loss"
label = "Atmospheric and polarisation loss"
folder = "com_atmospheric_loss"   # frozen at seed; renaming the label never moves the directory
subsystem = "com"
parent = "l3_ttc"
kind = "declared"
owner = "comms"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 638
state = "published"

[question]
text = "How much is lost to the atmosphere, rain and polarisation mismatch, in decibels?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How much of the downlink signal is lost to the air, to rain, and to the two antennas not quite matching in polarisation, the orientation of the radio wave: 1.8 decibels. It is signal the rest of the link has to make up."
breaks = "It is one fixed figure for a loss that depends on the frequency, the elevation of the link and the rain. Above 15 decibels the link is not available at the stated elevation and frequency at all."
by = "an assistant, from what this sheet states — for its owner (comms) to confirm"

[maths]
expression = "L_atm = 1.8"
source = "itu_p618"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "L_atm"
type = "Ratio"
unit = "One"
lower = 0.0
upper = 15.0
reason_lower = "an atmospheric loss cannot be negative"
reason_upper = "above 15 dB the link is not available at the stated elevation and frequency"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 1.8
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "next"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (comms) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That 1.8 decibels covers atmosphere, rain and polarisation loss on this link, from the source the sheet cites (itu_p618), confirmed by A. Rai on 2026-09-01."
breaks_if = "A loss worked out for this link's actual frequency, elevation and rain conditions that differs from 1.8 decibels."
relation = "L_atm = 1.8"
source = "itu_p618"
