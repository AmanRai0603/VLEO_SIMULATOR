# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "com_gs_gain"
label = "Ground station antenna gain"
folder = "com_gs_gain"   # frozen at seed; renaming the label never moves the directory
subsystem = "com"
parent = "l3_ttc"
kind = "computed"
owner = "comms"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 642
state = "published"

[question]
text = "How much does the ground antenna concentrate the received power?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How strongly the ground station's antenna focuses the power it receives, in decibels, using the same circular-aperture relation as the spacecraft antenna, applied to the ground dish's diameter at the carrier frequency."
breaks = "It describes a circular aperture, and the sheet states no assumptions or derivation. A ground aperture of this class always has positive gain; above 80 decibels it is a deep-space aperture."
by = "an assistant, from what this sheet states — for its owner (comms) to confirm"

[maths]
expression = "G = eta*(pi*D/lambda)^2"
source = "larson_wertz"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "G_r"
type = "Ratio"
unit = "Decibel"
lower = 0.0
upper = 80.0
reason_lower = "a ground aperture of this class always has positive gain"
reason_upper = "above 80 dBi is a deep-space aperture"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "d"
var = "com_gs_antenna_diameter"
type = "Length"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "f"
var = "com_frequency"
type = "Frequency"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "e"
var = "com_antenna_efficiency"
type = "Ratio"

[[algorithm.step]]
number = 1
text = "apply the same aperture relation to the ground antenna"
binds = "g"
type = "Ratio"

[view]
kind = "number"

[[version]]
n = 1
release = "next"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (comms) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "Its relation as stated and cited from larson_wertz, the circular aperture gain applied to the ground antenna, not yet derived on the sheet."
breaks_if = "A derivation or a comparison with larson_wertz that disagrees, or a ground antenna that is not a circular aperture."
relation = "G = eta*(pi*D/lambda)^2"
source = "larson_wertz"
