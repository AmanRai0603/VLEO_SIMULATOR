[explain]
simply = "How much signal energy each bit of data needs, compared with the background noise, for the chosen modulation and coding (the way data is put on the radio wave and protected against errors) to reach its required error rate: 4.5 decibels."
breaks = "It holds only for the modulation and coding assumed here; above 20 decibels they are not the ones assumed. Below 0 decibels no practical coded modulation reaches the required bit error rate."
by = "an assistant, from what this sheet states — for its owner (comms) to confirm"

[maths]
