# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "com_eirp"
label = "Effective isotropic radiated power"
folder = "com_eirp"   # frozen at seed; renaming the label never moves the directory
subsystem = "com"
parent = "l3_ttc"
kind = "computed"
owner = "comms"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 643
state = "published"

[question]
text = "How much power does the spacecraft appear to radiate towards the ground station?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How much power the spacecraft appears to radiate toward the ground station, in decibels relative to one watt: the transmitter power, raised by the antenna's gain and reduced by the line loss between them."
breaks = "It is one figure toward the station, and the sheet states no assumptions or derivation for where that stops holding. Below minus 20 decibels relative to one watt no link in this design closes; above 90 the transmitter is not the one described."
by = "an assistant, from what this sheet states — for its owner (comms) to confirm"

[maths]
expression = "EIRP = 10*log10(P_t) + G_t - L_line"
source = "larson_wertz"

[method]
text = """
# Transcribed from crates/vleo-mod-ttc/nodes/com_eirp/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
return eirp_dbw(p, g, l)
"""
by = ""
transcribed_from = "crates/vleo-mod-ttc/nodes/com_eirp/model.rs"
checked_by = ""

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "EIRP"
type = "Ratio"
unit = "Decibel"
lower = -20.0
upper = 90.0
reason_lower = "below -20 dBW no link in this design closes"
reason_upper = "above 90 dBW the transmitter is not the one described"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "p"
var = "com_tx_power"
type = "Power"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "g"
var = "com_antenna_gain"
type = "Ratio"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "l"
var = "com_line_loss"
type = "Ratio"

[[algorithm.step]]
number = 1
text = "add the antenna gain to the transmitter power in decibels and subtract the line loss"
binds = "e"
type = "Ratio"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (comms) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "Its relation as stated and cited from larson_wertz, not yet derived on the sheet."
breaks_if = "A derivation or a comparison with larson_wertz that disagrees, or a result outside minus 20 to 90 decibels relative to one watt."
relation = "EIRP = 10*log10(P_t) + G_t - L_line"
source = "larson_wertz"
