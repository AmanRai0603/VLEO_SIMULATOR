# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "com_pass_volume"
label = "Data volume per pass"
folder = "com_pass_volume"   # frozen at seed; renaming the label never moves the directory
subsystem = "com"
parent = "l3_ttc"
kind = "computed"
owner = "comms"
tier = "B"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 652
state = "published"

[question]
text = "How much data comes down in one pass?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How much data comes down in one pass, in gigabits: the data rate times the contact time, cut to 60 per cent to allow for the average pass and for protocol overhead."
breaks = "One fixed 60 per cent stands for both the average pass and the protocol efficiency, and the sheet states no assumptions or derivation for it. Above a petabit per pass no modem in this class runs."
by = "an assistant, from what this sheet states — for its owner (comms) to confirm"

[maths]
expression = "V = R*t*eta_link"
source = "larson_wertz"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "V_pass"
type = "DataVolume"
unit = "Gigabit"
lower = 0.0
upper = 1000000.0
reason_lower = "a data volume cannot be negative"
reason_upper = "above a petabit per pass no modem in this class runs"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "r"
var = "com_data_rate"
type = "DataRate"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "t"
var = "com_contact_time"
type = "Time"

[[algorithm.step]]
number = 1
text = "multiply rate by contact time and apply a 60% mean-pass and protocol efficiency"
binds = "v"
type = "DataVolume"

[view]
kind = "number"

[[version]]
n = 1
release = "next"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (comms) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "Its relation as stated and cited from larson_wertz, with a 60 per cent mean-pass and protocol efficiency, not yet derived on the sheet."
breaks_if = "A derivation or a comparison with larson_wertz that disagrees, or a measured mean-pass and protocol efficiency that differs from 60 per cent."
relation = "V = R*t*eta_link"
source = "larson_wertz"
