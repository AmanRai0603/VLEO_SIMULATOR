# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "com_g_over_t"
label = "Ground station figure of merit"
folder = "com_g_over_t"   # frozen at seed; renaming the label never moves the directory
subsystem = "com"
parent = "l3_ttc"
kind = "computed"
owner = "comms"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 646
state = "published"

[question]
text = "What is the ground station's sensitivity, as gain over system noise temperature?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How sensitive the ground station is, in decibels per kelvin: its receive antenna's gain set against the noise its receiving system adds, expressed as a temperature."
breaks = "It is one figure for the station, and the sheet states no assumptions or derivation. Below minus 30 decibels per kelvin no ground station in this network performs that badly; above 60 it is a deep-space station."
by = "an assistant, from what this sheet states — for its owner (comms) to confirm"

[maths]
expression = "G/T = G_r - 10*log10(T_s)"
source = "larson_wertz"

[method]
text = """
# Transcribed from crates/vleo-mod-ttc/nodes/com_g_over_t/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
return g_over_t_db(g, t)
"""
by = ""
transcribed_from = "crates/vleo-mod-ttc/nodes/com_g_over_t/model.rs"
checked_by = "Aman Rai"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "GT"
type = "Ratio"
unit = "Decibel"
lower = -30.0
upper = 60.0
reason_lower = "below -30 dB/K no ground station in this network performs that badly"
reason_upper = "above 60 dB/K is a deep-space station"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "g"
var = "com_gs_gain"
type = "Ratio"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "t"
var = "com_system_noise_temperature"
type = "Temperature"

[[algorithm.step]]
number = 1
text = "subtract the system noise temperature in decibels from the receive gain"
binds = "gt"
type = "Ratio"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (comms) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "Its relation as stated and cited from larson_wertz, not yet derived on the sheet."
breaks_if = "A derivation or a comparison with larson_wertz that disagrees, or a result outside minus 30 to 60 decibels per kelvin."
relation = "G/T = G_r - 10*log10(T_s)"
source = "larson_wertz"
