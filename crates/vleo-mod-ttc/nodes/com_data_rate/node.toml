# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "com_data_rate"
label = "Achievable downlink data rate"
folder = "com_data_rate"   # frozen at seed; renaming the label never moves the directory
subsystem = "com"
parent = "l3_ttc"
kind = "computed"
owner = "comms"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 648
state = "published"

[question]
text = "How fast can data come down while keeping the required margin?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "The fastest data can come down, in megabits per second, while the link still keeps the margin it is required to hold. It feeds the mission's data-volume performance indicator."
breaks = "It is the rate that leaves exactly the required margin and nothing spare, so it is only as sound as the link figures it reads. The sheet states no assumptions or derivation. Below 1 kilobit per second the downlink cannot even carry housekeeping."
by = "an assistant, from what this sheet states — for its owner (comms) to confirm"

[maths]
expression = "R = 10^((C/N0 - EbN0_req - L_imp - M)/10)"
source = "larson_wertz"

[method]
text = """
# Transcribed from crates/vleo-mod-ttc/nodes/com_data_rate/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
return achievable_data_rate(c, er, li, m)
"""
by = ""
transcribed_from = "crates/vleo-mod-ttc/nodes/com_data_rate/model.rs"
checked_by = "Aman Rai"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "R_b"
type = "DataRate"
unit = "MegabitPerSecond"
lower = 0.001
upper = 100000.0
reason_lower = "below 1 kbit/s the downlink cannot even carry housekeeping"
reason_upper = "above 100 Gbit/s no spacecraft modem in this class runs"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "c"
var = "com_cn0"
type = "Ratio"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "er"
var = "com_required_ebn0"
type = "Ratio"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "li"
var = "com_implementation_loss"
type = "Ratio"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "m"
var = "com_link_margin_required"
type = "Ratio"

[[algorithm.step]]
number = 1
text = "solve the link equation for the rate that leaves exactly the required margin"
binds = "r"
type = "DataRate"

[contributes]
kpis = ["kpi_data_volume"]

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (comms) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "Its relation as stated and cited from larson_wertz, the link equation solved for rate, not yet derived on the sheet."
breaks_if = "A derivation or a comparison with larson_wertz that disagrees, or a result above 100 gigabits per second, which no spacecraft modem in this class runs."
relation = "R = 10^((C/N0 - EbN0_req - L_imp - M)/10)"
source = "larson_wertz"
