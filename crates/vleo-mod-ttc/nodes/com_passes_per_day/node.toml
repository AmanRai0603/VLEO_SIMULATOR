# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "com_passes_per_day"
label = "Usable passes per day"
folder = "com_passes_per_day"   # frozen at seed; renaming the label never moves the directory
subsystem = "com"
parent = "l3_ttc"
kind = "declared"
owner = "operations"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 640
state = "published"

[question]
text = "How many usable ground station contacts are there each day?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How many usable contacts with a ground station the spacecraft gets each day: 9. Each pass is a chance to bring data down, so this count feeds both how long data waits to reach the ground and how much of it arrives."
breaks = "It is a declared count, not one this tool works out. Below half a pass a day the mission cannot be operated, and above 60 it would exceed the number of revolutions the spacecraft makes in a day."
by = "an assistant, from what this sheet states — for its owner (operations) to confirm"

[maths]
expression = "N_pass = 9"
source = "orbitt_case_c1"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "N_pass"
type = "Ratio"
unit = "One"
lower = 0.5
upper = 60.0
reason_lower = "below half a pass a day the mission cannot be operated"
reason_upper = "above 60 passes a day exceeds the number of revolutions in a day"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 9.0
confirmed_by = "A. Rai / 2026-09-01"

[contributes]
kpis = ["kpi_latency", "kpi_data_volume"]

[view]
kind = "number"

[[version]]
n = 1
release = "next"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (operations) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That 9 usable passes a day is right for this design, from the source the sheet cites (orbitt_case_c1), confirmed by A. Rai on 2026-09-01."
breaks_if = "A contact schedule for the actual orbit and ground network giving a number of usable passes other than 9 a day."
relation = "N_pass = 9"
source = "orbitt_case_c1"
