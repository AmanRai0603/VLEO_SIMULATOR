# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "com_tx_power"
label = "Transmitter radio-frequency output power"
folder = "com_tx_power"   # frozen at seed; renaming the label never moves the directory
subsystem = "com"
parent = "l3_ttc"
kind = "declared"
owner = "comms"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 630
state = "published"

[question]
text = "How much radio-frequency power does the transmitter deliver?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How much radio power the transmitter delivers: 8 watts. More power makes the downlink easier, but it loads the spacecraft's power and thermal design."
breaks = "Below 0.1 watts no link closes from this altitude. Above 200 watts the transmitter is the largest load on the spacecraft and the thermal design does not close."
wrong = "The 8 watts is not what the transmitter draws from the spacecraft: it is the radio-frequency power it puts out."
by = "an assistant, from what this sheet states — for its owner (comms) to confirm"

[maths]
expression = "P_t = 8"
source = "orbitt_case_c1"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "P_t"
type = "Power"
unit = "Watt"
lower = 0.1
upper = 200.0
reason_lower = "below 0.1 W no link closes from this altitude"
reason_upper = "above 200 W the transmitter is the largest load on the bus and the thermal design does not close"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 8.0
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "next"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (comms) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That 8 watts of radio-frequency output is right for this design, from the source the sheet cites (orbitt_case_c1), confirmed by A. Rai on 2026-09-01."
breaks_if = "A chosen transmitter with a different output, or a downlink that does not close at 8 watts."
relation = "P_t = 8"
source = "orbitt_case_c1"
