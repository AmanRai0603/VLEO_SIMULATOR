# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "com_doppler"
label = "Doppler shift at closest approach"
folder = "com_doppler"   # frozen at seed; renaming the label never moves the directory
subsystem = "com"
parent = "l3_ttc"
kind = "computed"
owner = "comms"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 654
state = "published"

[question]
text = "How far does the carrier move in frequency as the satellite passes?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How far the radio carrier's frequency shifts because of the satellite's motion as it passes the station, in megahertz. The receiver has to acquire the carrier across that shift: above 10 megahertz it cannot, and the link never locks."
breaks = "It is a first-order estimate taken at the ground-track speed, and the sheet states no assumptions about the geometry of a real pass and no derivation."
by = "an assistant, from what this sheet states — for its owner (comms) to confirm"

[maths]
expression = "df = f*v/c"
source = "larson_wertz"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "df"
type = "Frequency"
unit = "Megahertz"
lower = 0.0
upper = 10.0
reason_lower = "a shift magnitude cannot be negative"
reason_upper = "above 10 MHz the receiver acquisition range is exceeded and the link never locks"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "f"
var = "com_frequency"
type = "Frequency"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "v"
var = "orbit_ground_track_speed"
type = "Velocity"

[[algorithm.step]]
number = 1
text = "apply the first-order Doppler relation at the ground track speed"
binds = "d"
type = "Frequency"

[view]
kind = "number"

[[version]]
n = 1
release = "next"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (comms) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "Its relation as stated and cited from larson_wertz, the first-order Doppler relation at the ground-track speed, not yet derived on the sheet."
breaks_if = "A derivation or a comparison with larson_wertz that disagrees, or a shift above 10 megahertz, beyond the receiver's acquisition range."
relation = "df = f*v/c"
source = "larson_wertz"
