# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "com_gs_noise_temperature"
label = "Ground station antenna noise temperature"
folder = "com_gs_noise_temperature"   # frozen at seed; renaming the label never moves the directory
subsystem = "com"
parent = "l3_ttc"
kind = "declared"
owner = "comms"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 635
state = "published"

[question]
text = "How much noise does the ground antenna see?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How much background radio noise the ground antenna picks up, stated as a temperature: 60 kelvin. The spacecraft's signal has to stand out against this noise."
breaks = "It is one declared figure. Above 300 kelvin the antenna is looking at the ground, and below 10 kelvin it would need deep cryogenic cooling that no commercial station in this network has."
by = "an assistant, from what this sheet states — for its owner (comms) to confirm"

[maths]
expression = "T_a = 60"
source = "larson_wertz"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "T_a"
type = "Temperature"
unit = "Kelvin"
lower = 10.0
upper = 300.0
reason_lower = "below 10 K requires cryogenic cooling that no commercial station in this network has"
reason_upper = "above 300 K the antenna is looking at the ground"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 60.0
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "next"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (comms) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That 60 kelvin is the ground antenna noise temperature, from the source the sheet cites (larson_wertz), confirmed by A. Rai on 2026-09-01."
breaks_if = "A measured or specified noise temperature for the chosen ground stations that differs from 60 kelvin."
relation = "T_a = 60"
source = "larson_wertz"
