# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "com_frequency"
label = "Downlink carrier frequency"
folder = "com_frequency"   # frozen at seed; renaming the label never moves the directory
subsystem = "com"
parent = "l3_ttc"
kind = "declared"
owner = "comms"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 629
state = "published"

[question]
text = "On what frequency does the payload data come down?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "The radio frequency the payload data comes down on: 8.2 gigahertz. It shapes how large the antennas must be, how much rain gets in the way, and what ground segment the link needs."
breaks = "Below 100 megahertz the antenna does not fit on this spacecraft. Above 40 gigahertz rain fade, the weakening of the signal by rain, dominates, and the ground stations are no longer the ones costed here."
by = "an assistant, from what this sheet states — for its owner (comms) to confirm"

[maths]
expression = "f_c = 8.2"
source = "itu_sa1862"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "f_c"
type = "Frequency"
unit = "Gigahertz"
lower = 0.1
upper = 40.0
reason_lower = "below 100 MHz the antenna does not fit on this spacecraft"
reason_upper = "above 40 GHz rain fade dominates and the ground segment is not the one costed here"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 8.2
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "next"
