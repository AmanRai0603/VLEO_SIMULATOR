# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "com_ebn0"
label = "Achieved energy per bit over noise density"
folder = "com_ebn0"   # frozen at seed; renaming the label never moves the directory
subsystem = "com"
parent = "l3_ttc"
kind = "computed"
owner = "comms"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 649
state = "published"

[question]
text = "What energy per bit does the link actually deliver at the design rate?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How much signal energy each bit of data actually gets, compared with the noise, at the design data rate, in decibels. It is the received signal strength with the data rate taken out."
breaks = "It is only as sound as the signal-strength and rate figures it combines, and the sheet states no assumptions or derivation. Below minus 10 decibels no coded link closes; above 40 the link is overdesigned by orders of magnitude."
by = "an assistant, from what this sheet states — for its owner (comms) to confirm"

[maths]
expression = "Eb/N0 = C/N0 - 10*log10(R)"
source = "larson_wertz"

[method]
text = """
# Transcribed from crates/vleo-mod-ttc/nodes/com_ebn0/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
return eb_over_n0_db(c, r)
"""
by = ""
transcribed_from = "crates/vleo-mod-ttc/nodes/com_ebn0/model.rs"
checked_by = "Aman Rai"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "EbN0"
type = "Ratio"
unit = "Decibel"
lower = -10.0
upper = 40.0
reason_lower = "below -10 dB no coded link closes"
reason_upper = "above 40 dB the link is overdesigned by orders of magnitude"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "c"
var = "com_cn0"
type = "Ratio"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "r"
var = "com_data_rate"
type = "DataRate"

[[algorithm.step]]
number = 1
text = "subtract the data rate in decibels from the carrier to noise density"
binds = "e"
type = "Ratio"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
