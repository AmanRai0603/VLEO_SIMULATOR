# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "com_antenna_efficiency"
label = "Antenna aperture efficiency"
folder = "com_antenna_efficiency"   # frozen at seed; renaming the label never moves the directory
subsystem = "com"
parent = "l3_ttc"
kind = "declared"
owner = "comms"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 632
state = "published"

[question]
text = "How efficiently does the antenna use its aperture?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "What share of the antenna's physical size does useful work in focusing the signal: 60 per cent. An antenna whose surface is not evenly lit by its feed behaves as if it were smaller than it is."
breaks = "It is one declared figure, not a measurement of the antenna flown. Below 20 per cent the surface is so badly lit that it is not a design considered here, and above 90 per cent no practical feed, the part that lights the antenna, achieves it."
by = "an assistant, from what this sheet states — for its owner (comms) to confirm"

[maths]
expression = "eta_a = 0.6"
source = "larson_wertz"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "eta_a"
type = "Ratio"
unit = "One"
lower = 0.2
upper = 0.9
reason_lower = "below 0.2 the aperture is badly illuminated and the design is not one considered here"
reason_upper = "above 0.9 no practical feed achieves it"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 0.6
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (comms) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That 0.6 is the aperture efficiency of this design's antenna, from the source the sheet cites (larson_wertz), confirmed by A. Rai on 2026-09-01."
breaks_if = "A measured or specified efficiency for the chosen antenna and feed that differs from 0.6."
relation = "eta_a = 0.6"
source = "larson_wertz"
