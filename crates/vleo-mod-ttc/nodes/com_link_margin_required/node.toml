[explain]
simply = "How much spare signal the downlink must carry above the bare minimum it needs to work: 3 decibels. It is a requirement the link has to meet, not a result."
breaks = "It says what the link must reach, not what it achieves. Above 12 decibels the link would be designed for an availability, the share of time it works, that nobody asked for."
by = "an assistant, from what this sheet states — for its owner (comms) to confirm"

