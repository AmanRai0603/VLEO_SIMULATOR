# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "aero_body_diameter"
label = "Body diameter"
folder = "aero_body_diameter"   # frozen at seed; renaming the label never moves the directory
subsystem = "aero"
parent = "l3_massaero"
kind = "declared"
owner = "mass"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 532
state = "published"

[question]
text = "How wide is the vehicle across the flight direction?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How wide the spacecraft body is across the direction it flies. The width sets how much of the body faces the oncoming air, and so how hard the air-breathing design has to work to balance its drag."
breaks = "It is one width for the body; what sticks out beyond it is counted separately. Below 0.1 metres no useful payload opening fits, and above 3 metres the frontal area makes the air-breathing design impossible at any altitude in the band."
by = "an assistant, from what this sheet states — for its owner (mass) to confirm"

[maths]
expression = "D_b = 0.6"
source = "orbitt_case_c1"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "D_b"
type = "Length"
unit = "Metre"
lower = 0.1
upper = 3.0
reason_lower = "below 0.1 m no useful payload aperture fits"
reason_upper = "above 3 m the frontal area makes the air-breathing closure impossible at any altitude in the band"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 0.6
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "next"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (mass) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That 0.6 metres is this design's body diameter, from the source the sheet cites (orbitt_case_c1), confirmed by A. Rai on 2026-09-01."
breaks_if = "A layout for this design whose width across the flight direction differs from 0.6 metres, or a payload opening that does not fit within it."
relation = "D_b = 0.6"
source = "orbitt_case_c1"
