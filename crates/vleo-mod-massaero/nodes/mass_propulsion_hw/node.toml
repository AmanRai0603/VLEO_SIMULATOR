# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "mass_propulsion_hw"
label = "Propulsion hardware mass"
folder = "mass_propulsion_hw"   # frozen at seed; renaming the label never moves the directory
subsystem = "mass"
parent = "l3_massaero"
kind = "declared"
owner = "propulsion"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 682
state = "published"

[question]
text = "What do the intake, thruster and power processing unit weigh?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "What the intake, thruster and power processing unit weigh, as a single number a person picked: 26 kilograms. Every mass margin in the design is built out of numbers like this one, so an error here moves them all."
breaks = "It is one declared figure with no breakdown, and no reason beyond the case it came from. It is only held to be sensible between half a kilogram and 500 kilograms: below half a kilogram no intake, thruster and power processing unit exist, and above 500 kilograms the propulsion system is the spacecraft."
by = "an assistant, from what this sheet states — for its owner (propulsion) to confirm"

[maths]
expression = "m_prop = 26"
source = "orbitt_case_c1"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "m_prop"
type = "Mass"
unit = "Kilogram"
lower = 0.5
upper = 500.0
reason_lower = "below half a kilogram no intake, thruster and power processing unit exist"
reason_upper = "above 500 kg the propulsion system is the spacecraft"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 26.0
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "next"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (propulsion) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That 26 kg is right for the intake, thruster and power processing unit on this design, as taken from the source case the sheet cites (orbitt_case_c1), confirmed by A. Rai on 2026-09-01."
breaks_if = "A measured, quoted or itemised mass for the intake, thruster and power processing unit on this design that differs from 26 kg, or a design whose hardware falls outside half a kilogram to 500 kilograms."
relation = "m_prop = 26"
source = "orbitt_case_c1"
