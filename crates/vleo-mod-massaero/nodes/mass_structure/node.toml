# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "mass_structure"
label = "Structure and mechanisms mass"
folder = "mass_structure"   # frozen at seed; renaming the label never moves the directory
subsystem = "mass"
parent = "l3_massaero"
kind = "declared"
owner = "mass"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 681
state = "published"

[question]
text = "What do the primary structure, panels and mechanisms weigh?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "What the primary structure, panels and mechanisms weigh, as a single number a person picked: 38 kilograms. Every mass margin in the design is built out of numbers like this one, so an error here moves them all."
breaks = "It is one declared figure with no breakdown, and no reason beyond the case it came from. It is only held to be sensible between one kilogram and two tonnes: below a kilogram there is no structure, and above two tonnes the vehicle is not in this class."
by = "an assistant, from what this sheet states — for its owner (mass) to confirm"

[maths]
expression = "m_str = 38"
source = "orbitt_case_c1"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "m_str"
type = "Mass"
unit = "Kilogram"
lower = 1.0
upper = 2000.0
reason_lower = "below a kilogram there is no structure"
reason_upper = "above two tonnes the vehicle is not in this class"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 38.0
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (mass) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That 38 kg is right for the primary structure, panels and mechanisms on this design, as taken from the source case the sheet cites (orbitt_case_c1), confirmed by A. Rai on 2026-09-01."
breaks_if = "A measured, quoted or itemised mass for the primary structure, panels and mechanisms on this design that differs from 38 kg, or a design whose hardware falls outside one kilogram to two tonnes."
relation = "m_str = 38"
source = "orbitt_case_c1"
