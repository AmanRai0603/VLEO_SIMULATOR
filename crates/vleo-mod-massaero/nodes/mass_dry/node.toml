# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "mass_dry"
label = "Dry mass"
folder = "mass_dry"   # frozen at seed; renaming the label never moves the directory
subsystem = "mass"
parent = "l3_massaero"
kind = "computed"
owner = "mass"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 690
state = "published"

[question]
text = "What does the spacecraft weigh with no propellant on board?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "What the spacecraft weighs with no propellant on board, in kilograms: the masses of structure, propulsion hardware, power, harness, avionics, communications, guidance and control hardware and payload added up, with the system margin applied. It feeds the mass-margin performance measure."
breaks = "It is only as complete as the list of masses it sums; anything missing from that list is missing from the answer unless the margin covers it. Below a kilogram there is no spacecraft; above 5 tonnes the vehicle is not in this class."
by = "an assistant, from what this sheet states — for its owner (mass) to confirm"

[maths]
expression = "m_dry = (sum of subsystem masses)*(1 + M_sys)"
source = "ecss_e_st_10_02"

[method]
text = """
# Transcribed from crates/vleo-mod-massaero/nodes/mass_dry/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
# Constants the code held, written out here as it held them: 0 [kg] for thermal: the thermal hardware is carried in the harness line, as the code carried it.
return dry_mass(st, pr, pw, 0 [kg], av, cm, gn, th, pa, mg)
"""
by = ""
transcribed_from = "crates/vleo-mod-massaero/nodes/mass_dry/model.rs"
checked_by = ""

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "m_dry"
type = "Mass"
unit = "Kilogram"
lower = 1.0
upper = 5000.0
reason_lower = "below a kilogram there is no spacecraft"
reason_upper = "above 5 tonnes the vehicle is not in this class"

