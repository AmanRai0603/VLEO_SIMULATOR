# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "mass_system_margin"
label = "System-level mass margin"
folder = "mass_system_margin"   # frozen at seed; renaming the label never moves the directory
subsystem = "mass"
parent = "l3_massaero"
kind = "declared"
owner = "mass"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 688
state = "published"

[question]
text = "What system-level margin is held above the sum of the subsystem masses?"
note = "Separate from and additional to the per-item maturity allowances. It covers what is not on the list yet, which on any real programme is the term that bites."

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "The extra share of mass held back above the sum of all the subsystem masses: 0.2, a fifth. It covers what is not on the list yet, which on any real programme is the part that bites."
breaks = "It is a single fraction applied to the whole, so it says nothing about which items will grow. It is only meaningful between nothing and a half: a margin cannot be negative, and above half the design is a sketch and the number is not a budget."
wrong = "It is easy to think this is the same as the allowances already added to each item for how mature its design is. It is not: it is separate from and on top of them."
by = "an assistant, from what this sheet states — for its owner (mass) to confirm"

[maths]
expression = "M_sys = 0.2"
source = "ecss_e_st_10_02"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "M_sys"
type = "Ratio"
unit = "One"
lower = 0.0
upper = 0.5
reason_lower = "a margin cannot be negative"
reason_upper = "above 50% the design is a sketch and the number is not a budget"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 0.2
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "next"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (mass) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That a system margin of 0.2 on top of the per-item maturity allowances is enough for this design, following the standard the sheet cites (ecss_e_st_10_02), confirmed by A. Rai on 2026-09-01."
breaks_if = "Unlisted items that together grow the spacecraft by more than a fifth of the subsystem total, or a governing standard or customer that requires a different system margin."
relation = "M_sys = 0.2"
source = "ecss_e_st_10_02"
