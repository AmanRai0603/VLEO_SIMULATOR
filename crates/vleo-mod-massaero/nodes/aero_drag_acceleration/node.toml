# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "aero_drag_acceleration"
label = "Drag deceleration"
folder = "aero_drag_acceleration"   # frozen at seed; renaming the label never moves the directory
subsystem = "aero"
parent = "l3_massaero"
kind = "computed"
owner = "aero"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 541
state = "published"

[question]
text = "What deceleration does the drag produce on this mass?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How quickly drag slows the spacecraft, in metres per second each second: the drag force divided by the wet mass."
breaks = "It divides by the wet mass, the mass at separation, so it describes that one mass and not a lighter spacecraft later. Above 0.1 metres per second each second the orbit decays within hours."
by = "an assistant, from what this sheet states — for its owner (aero) to confirm"

[maths]
expression = "a_D = D/m"
source = "vallado2013"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "a_D"
type = "Acceleration"
unit = "MetrePerSecond2"
lower = 0.0
upper = 0.1
reason_lower = "drag deceleration cannot be negative"
reason_upper = "above 0.1 m/s2 the orbit decays within hours"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "d"
var = "aero_drag_force"
type = "Force"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "m"
var = "mass_wet"
type = "Mass"

[[algorithm.step]]
number = 1
text = "divide the drag force by the wet mass"
binds = "a"
type = "Acceleration"

[view]
kind = "number"

[[version]]
n = 1
release = "next"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (aero) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "Deceleration as drag force over wet mass, as stated and cited from vallado2013, not yet derived on the sheet."
breaks_if = "A derivation or a check against vallado2013 disagrees, or the result exceeds 0.1 metres per second each second, where the sheet says the orbit decays within hours."
relation = "a_D = D/m"
source = "vallado2013"
