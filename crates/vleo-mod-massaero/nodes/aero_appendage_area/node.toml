# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "aero_appendage_area"
label = "Appendage frontal area"
folder = "aero_appendage_area"   # frozen at seed; renaming the label never moves the directory
subsystem = "aero"
parent = "l3_massaero"
kind = "declared"
owner = "mass"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 533
state = "published"

[question]
text = "How much frontal area do the array, antennas and radiators add beyond the body?"
note = "Separated from the body area because it is the term a power or thermal decision moves, and the tree has to show that coupling."

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "The extra area facing the oncoming air that the solar array, antennas and radiators add beyond the body itself. It is kept separate from the body because it is the part a power or thermal decision moves, and the design has to show that link to drag."
breaks = "It is a fixed number, so it does not follow the power or thermal choices it depends on. Above 5 square metres of appendage the vehicle is really an array with a satellite attached, and the drag is decided by the array alone."
by = "an assistant, from what this sheet states — for its owner (mass) to confirm"

[maths]
expression = "A_app = 0.05"
source = "orbitt_case_c1"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "A_app"
type = "Area"
unit = "SquareMetre"
lower = 0.0
upper = 5.0
reason_lower = "an area cannot be negative"
reason_upper = "above 5 m2 of appendage the design is an array with a satellite attached, and the drag closure is decided by the array alone"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 0.05
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (mass) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That 0.05 square metres is this design's appendage frontal area, from the source the sheet cites (orbitt_case_c1), confirmed by A. Rai on 2026-09-01."
breaks_if = "A power or thermal decision that grows the array, antennas or radiators, or a measured frontal area for this design that differs from 0.05 square metres."
relation = "A_app = 0.05"
source = "orbitt_case_c1"
