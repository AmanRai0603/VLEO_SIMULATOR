# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "aero_ao_fluence"
label = "Atomic oxygen fluence"
folder = "aero_ao_fluence"   # frozen at seed; renaming the label never moves the directory
subsystem = "aero"
parent = "l3_massaero"
kind = "computed"
owner = "mass"
tier = "B"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 544
state = "published"

[question]
text = "How many oxygen atoms strike a forward-facing surface over the mission?"
note = "Polyimide erodes at about 3e-24 cm3 per incident atom, so 1e22 removes roughly 30 micrometres of it."

[maths]
expression = "F = n_O*V*t"
source = "moe2005"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "F_AO"
type = "Ratio"
unit = "One"
lower = 0.0
upper = 1e+26
reason_lower = "a fluence cannot be negative"
reason_upper = "above 1e26 atoms per square metre no known external material survives, so the design is not a design"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "n_o"
var = "env_atomic_oxygen_density"
type = "NumberDensity"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "v"
var = "orbit_velocity"
type = "Velocity"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "t"
var = "orbit_mission_duration"
type = "Time"

[[algorithm.step]]
number = 1
text = "multiply the atomic oxygen number density by the flight speed and the mission duration"
binds = "f"
type = "Ratio"

[contributes]
kpis = ["kpi_service_lifetime"]

[view]
kind = "number"

