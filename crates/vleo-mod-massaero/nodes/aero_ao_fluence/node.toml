# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "aero_ao_fluence"
label = "Atomic oxygen fluence"
folder = "aero_ao_fluence"   # frozen at seed; renaming the label never moves the directory
subsystem = "aero"
parent = "l3_massaero"
kind = "computed"
owner = "mass"
tier = "B"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 544
state = "published"

[question]
text = "How many oxygen atoms strike a forward-facing surface over the mission?"
note = "Polyimide erodes at about 3e-24 cm3 per incident atom, so 1e22 removes roughly 30 micrometres of it."

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How many oxygen atoms strike each square metre of a forward-facing surface over the whole mission: the atomic oxygen density, times the flight speed, times the mission's length. It matters because the atoms wear material away; polyimide, for example, loses roughly 30 micrometres at a fluence of 1e22."
breaks = "It is for a surface facing forward into the flow, and it multiplies one density, one speed and one duration, so it is only as good as those single figures are for the whole mission. Above 1e26 atoms per square metre no known external material survives."
by = "an assistant, from what this sheet states — for its owner (mass) to confirm"

[maths]
expression = "F = n_O*V*t"
source = "moe2005"

[method]
text = """
# Transcribed from crates/vleo-mod-massaero/nodes/aero_ao_fluence/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
# "* 1 [unit]" gives a number this design states as a pure ratio the unit the kernel reads it in,
# and "/ 1 [unit]" the other way; the number itself does not change.
return atomic_oxygen_fluence(n_o, v, t) / 1 [1/m^2]
"""
by = ""
transcribed_from = "crates/vleo-mod-massaero/nodes/aero_ao_fluence/model.rs"
checked_by = ""

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "F_AO"
type = "Ratio"
unit = "One"
lower = 0.0
upper = 1e+26
reason_lower = "a fluence cannot be negative"
reason_upper = "above 1e26 atoms per square metre no known external material survives, so the design is not a design"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "n_o"
var = "env_atomic_oxygen_density"
type = "NumberDensity"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "v"
var = "orbit_velocity"
type = "Velocity"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "t"
var = "orbit_mission_duration"
type = "Time"

[[algorithm.step]]
number = 1
text = "multiply the atomic oxygen number density by the flight speed and the mission duration"
binds = "f"
type = "Ratio"

[contributes]
kpis = ["kpi_service_lifetime"]

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (mass) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "Fluence as density times speed times duration, as stated and cited from moe2005, not yet derived on the sheet."
breaks_if = "A derivation or a check against moe2005 disagrees, or the fluence exceeds 1e26 atoms per square metre, beyond which the sheet says no known external material survives."
relation = "F = n_O*V*t"
source = "moe2005"
