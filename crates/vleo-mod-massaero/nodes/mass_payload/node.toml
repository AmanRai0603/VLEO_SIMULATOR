# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "mass_payload"
label = "Payload mass"
folder = "mass_payload"   # frozen at seed; renaming the label never moves the directory
subsystem = "mass"
parent = "l3_massaero"
kind = "declared"
owner = "payload"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 687
state = "published"

[question]
text = "What does the whole service payload set weigh?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "What the whole service payload set weigh, as a single number a person picked: 55 kilograms. Every mass margin in the design is built out of numbers like this one, so an error here moves them all."
breaks = "It is one declared figure with no breakdown, and no reason beyond the case it came from. It is only held to be sensible between half a kilogram and a tonne: below half a kilogram no service payload exists, and above a tonne the payload set is not in this class."
by = "an assistant, from what this sheet states — for its owner (payload) to confirm"

[maths]
expression = "m_pay = 55"
source = "orbitt_case_c1"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "m_pay"
type = "Mass"
unit = "Kilogram"
lower = 0.5
upper = 1000.0
reason_lower = "below half a kilogram no service payload exists"
reason_upper = "above a tonne the payload set is not in this class"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 55.0
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (payload) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That 55 kg is right for the whole service payload set on this design, as taken from the source case the sheet cites (orbitt_case_c1), confirmed by A. Rai on 2026-09-01."
breaks_if = "A measured, quoted or itemised mass for the whole service payload set on this design that differs from 55 kg, or a design whose hardware falls outside half a kilogram to a tonne."
relation = "m_pay = 55"
source = "orbitt_case_c1"
