# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "aero_torque"
label = "Aerodynamic disturbance torque"
folder = "aero_torque"   # frozen at seed; renaming the label never moves the directory
subsystem = "aero"
parent = "l3_massaero"
kind = "computed"
owner = "gnc"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 541
state = "published"

[question]
text = "How much torque does the drag apply about the centre of mass?"
note = "In VLEO this dominates gravity gradient and solar pressure by one to three orders of magnitude, which is why a control design carried over from a higher orbit is undersized here."

[maths]
expression = "T = D*x_cp"
source = "larson_wertz"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "T_aero"
type = "Torque"
unit = "NewtonMetre"
lower = 0.0
upper = 1.0
reason_lower = "a torque magnitude cannot be negative"
reason_upper = "above 1 N.m no reaction wheel that fits this vehicle can hold attitude"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "d"
var = "aero_drag_force"
type = "Force"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "x"
var = "aero_cp_cm_offset"
type = "Length"

[[algorithm.step]]
number = 1
text = "multiply the drag force by the centre-of-pressure offset"
binds = "t"
type = "Torque"

[view]
kind = "number"

