# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "aero_torque"
label = "Aerodynamic disturbance torque"
folder = "aero_torque"   # frozen at seed; renaming the label never moves the directory
subsystem = "aero"
parent = "l3_massaero"
kind = "computed"
owner = "gnc"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 543
state = "published"

[question]
text = "How much torque does the drag apply about the centre of mass?"
note = "In VLEO this dominates gravity gradient and solar pressure by one to three orders of magnitude, which is why a control design carried over from a higher orbit is undersized here."

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How strongly drag tries to turn the spacecraft about its centre of mass, in newton metres: the drag force times the distance between where drag acts and the centre of mass. In very low orbit it outweighs the pull of gravity gradient and solar pressure by ten to a thousand times."
breaks = "It is one drag force times one offset, so it is a single magnitude and is only as right as that offset. Above 1 newton metre no reaction wheel that fits this vehicle can hold attitude."
wrong = "That an attitude control design carried over from a higher orbit will do. Here drag torque dominates gravity gradient and solar pressure by one to three orders of magnitude, so such a design is undersized."
by = "an assistant, from what this sheet states — for its owner (gnc) to confirm"

[maths]
expression = "T = D*x_cp"
source = "larson_wertz"

[method]
text = """
# Transcribed from crates/vleo-mod-massaero/nodes/aero_torque/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
return aerodynamic_torque(d, x)
"""
by = ""
transcribed_from = "crates/vleo-mod-massaero/nodes/aero_torque/model.rs"
checked_by = "Aman Rai"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "T_aero"
type = "Torque"
unit = "NewtonMetre"
lower = 0.0
upper = 1.0
reason_lower = "a torque magnitude cannot be negative"
reason_upper = "above 1 N.m no reaction wheel that fits this vehicle can hold attitude"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "d"
var = "aero_drag_force"
type = "Force"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "x"
var = "aero_cp_cm_offset"
type = "Length"

[[algorithm.step]]
number = 1
text = "multiply the drag force by the centre-of-pressure offset"
binds = "t"
type = "Torque"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (gnc) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "Drag force times the centre-of-pressure offset, as stated and cited from larson_wertz, not yet derived on the sheet."
breaks_if = "A derivation or a check against larson_wertz disagrees, or the torque exceeds 1 newton metre, beyond which the sheet says no fitting reaction wheel can hold attitude."
relation = "T = D*x_cp"
source = "larson_wertz"
