# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "mass_harness"
label = "Harness and thermal hardware mass"
folder = "mass_harness"   # frozen at seed; renaming the label never moves the directory
subsystem = "mass"
parent = "l3_massaero"
kind = "declared"
owner = "thermal"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 686
state = "published"

[question]
text = "What do the harness, multi-layer insulation and radiators weigh?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "What the harness, multi-layer insulation and radiators weigh, as a single number a person picked: 12 kilograms. Every mass margin in the design is built out of numbers like this one, so an error here moves them all."
breaks = "It is one declared figure with no breakdown, and no reason beyond the case it came from. It is only held to be sensible between 200 grams and 300 kilograms: below 200 grams no harness exists, and above 300 kilograms the harness is not in this class."
by = "an assistant, from what this sheet states — for its owner (thermal) to confirm"

[maths]
expression = "m_har = 12"
source = "orbitt_case_c1"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "m_har"
type = "Mass"
unit = "Kilogram"
lower = 0.2
upper = 300.0
reason_lower = "below 200 grams no harness exists"
reason_upper = "above 300 kg the harness is not in this class"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 12.0
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (thermal) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That 12 kg is right for the harness, multi-layer insulation and radiators on this design, as taken from the source case the sheet cites (orbitt_case_c1), confirmed by A. Rai on 2026-09-01."
breaks_if = "A measured, quoted or itemised mass for the harness, multi-layer insulation and radiators on this design that differs from 12 kg, or a design whose hardware falls outside 200 grams to 300 kilograms."
relation = "m_har = 12"
source = "orbitt_case_c1"
