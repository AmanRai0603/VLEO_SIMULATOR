# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "aero_drag_force"
label = "Drag force"
folder = "aero_drag_force"   # frozen at seed; renaming the label never moves the directory
subsystem = "aero"
parent = "l3_massaero"
kind = "computed"
owner = "aero"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 540
state = "published"

[question]
text = "How hard is the atmosphere pulling the satellite backwards?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How hard the atmosphere pulls the spacecraft backwards, in millinewtons: the pressure of the oncoming flow times the drag coefficient times the area facing the flow. It feeds the service-lifetime performance measure."
breaks = "It takes the flow's pressure, the drag coefficient and the area as single numbers, so it is only as good as each of them. Above 10 newtons the vehicle is slowing at a rate no electric propulsion system can answer."
by = "an assistant, from what this sheet states — for its owner (aero) to confirm"

[maths]
expression = "D = 0.5*rho*V^2*Cd*A"
source = "vallado2013"

[method]
text = """
# Transcribed from crates/vleo-mod-massaero/nodes/aero_drag_force/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
return q * cd * a
"""
by = ""
transcribed_from = "crates/vleo-mod-massaero/nodes/aero_drag_force/model.rs"
checked_by = "Aman Rai"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "D"
type = "Force"
unit = "Millinewton"
lower = 0.0
upper = 10000.0
reason_lower = "drag cannot be negative"
reason_upper = "above 10 N the vehicle is decelerating at a rate no electric propulsion system can answer"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "q"
var = "aero_dynamic_pressure"
type = "Pressure"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "cd"
var = "aero_drag_coefficient"
type = "Ratio"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "a"
var = "aero_frontal_area"
type = "Area"

[[algorithm.step]]
number = 1
text = "multiply dynamic pressure by the drag coefficient and the frontal area"
binds = "d"
type = "Force"

[contributes]
kpis = ["kpi_service_lifetime"]

[view]
kind = "line"
over = "orbit_altitude"
points = 60

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (aero) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "Dynamic pressure times drag coefficient times frontal area, as stated and cited from vallado2013, not yet derived on the sheet."
breaks_if = "A derivation or a check against vallado2013 disagrees, or the force exceeds 10 newtons."
relation = "D = 0.5*rho*V^2*Cd*A"
source = "vallado2013"
