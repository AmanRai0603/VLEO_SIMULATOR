# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "aero_dynamic_pressure"
label = "Dynamic pressure"
folder = "aero_dynamic_pressure"   # frozen at seed; renaming the label never moves the directory
subsystem = "aero"
parent = "l3_massaero"
kind = "computed"
owner = "aero"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 539
state = "published"

[question]
text = "What pressure does the flow exert per unit of drag coefficient and area?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "The pressure the oncoming air exerts for each unit of drag coefficient and area, in pascals, worked out from the air's density and the flight speed."
breaks = "It belongs to the oncoming flow alone; what the spacecraft feels also depends on its drag coefficient and area. Above 1 pascal the vehicle is re-entering, not orbiting."
by = "an assistant, from what this sheet states — for its owner (aero) to confirm"

[maths]
expression = "q = 0.5*rho*V^2"
source = "vallado2013"

[method]
text = """
# Transcribed from crates/vleo-mod-massaero/nodes/aero_dynamic_pressure/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
return dynamic_pressure(rho, v)
"""
by = ""
transcribed_from = "crates/vleo-mod-massaero/nodes/aero_dynamic_pressure/model.rs"
checked_by = "Aman Rai"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "q"
type = "Pressure"
unit = "Pascal"
lower = 0.0
upper = 1.0
reason_lower = "dynamic pressure cannot be negative"
reason_upper = "above 1 Pa the vehicle is re-entering, not orbiting"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "rho"
var = "env_mass_density"
type = "MassDensity"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "v"
var = "orbit_velocity"
type = "Velocity"

[[algorithm.step]]
number = 1
text = "form the dynamic pressure of the free stream"
binds = "q"
type = "Pressure"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (aero) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "The free-stream dynamic pressure relation, as stated and cited from vallado2013, not yet derived on the sheet."
breaks_if = "A derivation or a check against vallado2013 disagrees, or the pressure exceeds 1 pascal, where the sheet says the vehicle is re-entering."
relation = "q = 0.5*rho*V^2"
source = "vallado2013"
