# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "aero_frontal_area"
label = "Total frontal area"
folder = "aero_frontal_area"   # frozen at seed; renaming the label never moves the directory
subsystem = "aero"
parent = "l3_massaero"
kind = "computed"
owner = "mass"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 535
state = "published"

[question]
text = "What area does the flow actually see?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "The area the oncoming flow actually sees, in square metres: the circular cross-section of the body plus the area of its appendages."
breaks = "It treats the body's cross-section as a circle of its diameter and adds the appendage area as one figure, so it is only as right as those two inputs. Below 50 square centimetres there is no vehicle; above 20 square metres nothing in this design closes."
by = "an assistant, from what this sheet states — for its owner (mass) to confirm"

[maths]
expression = "A = pi*D^2/4 + A_app"
source = "orbitt_case_c1"

[method]
text = """
# Transcribed from crates/vleo-mod-massaero/nodes/aero_frontal_area/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
# Constants the code held, written out here as it held them: 0.25.
return 0.25 * PI * d * d + a_app
"""
by = ""
transcribed_from = "crates/vleo-mod-massaero/nodes/aero_frontal_area/model.rs"
checked_by = ""

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "A"
type = "Area"
unit = "SquareMetre"
lower = 0.005
upper = 20.0
reason_lower = "below 50 cm2 there is no vehicle"
reason_upper = "above 20 m2 nothing in this design closes"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "d"
var = "aero_body_diameter"
type = "Length"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "a_app"
var = "aero_appendage_area"
type = "Area"

[[algorithm.step]]
number = 1
text = "add the circular body cross-section to the appendage area"
binds = "a"
type = "Area"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (mass) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "Circular body cross-section plus appendage area, as stated and cited from orbitt_case_c1, not yet derived on the sheet."
breaks_if = "A derivation or a check against orbitt_case_c1 disagrees, or the area comes out below 50 square centimetres or above 20 square metres."
relation = "A = pi*D^2/4 + A_app"
source = "orbitt_case_c1"
