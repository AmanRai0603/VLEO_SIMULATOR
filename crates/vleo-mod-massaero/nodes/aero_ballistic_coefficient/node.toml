# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "aero_ballistic_coefficient"
label = "Ballistic coefficient"
folder = "aero_ballistic_coefficient"   # frozen at seed; renaming the label never moves the directory
subsystem = "aero"
parent = "l3_massaero"
kind = "computed"
owner = "aero"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 542
state = "published"

[question]
text = "How well does this vehicle resist the atmosphere, per unit of its own mass?"
note = "Higher is better here. A cubesat is around 50; a slender VLEO platform reaches 150, and that difference is worth tens of kilometres of altitude."

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How well the spacecraft resists the atmosphere for its mass: its wet mass set against its drag coefficient and the area facing the flow. A cubesat is around 50, a slender very-low-orbit platform reaches 150, and that difference is worth tens of kilometres of altitude."
breaks = "It takes mass, drag coefficient and area as single numbers, so it moves whenever any of them does. Below 5 kilograms per square metre the vehicle is a sail and nothing in this band closes; above 500 it is denser than any spacecraft ever flown."
wrong = "That a lower number is better because it sounds like less drag. Here higher is better: more mass behind each unit of drag."
by = "an assistant, from what this sheet states — for its owner (aero) to confirm"

[maths]
expression = "BC = m/(Cd*A)"
source = "vallado2013"

[method]
text = """
# Transcribed from crates/vleo-mod-massaero/nodes/aero_ballistic_coefficient/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
# "* 1 [unit]" gives a number this design states as a pure ratio the unit the kernel reads it in,
# and "/ 1 [unit]" the other way; the number itself does not change.
return ballistic_coefficient(m, cd, a) / 1 [kg/m^2]
"""
by = ""
transcribed_from = "crates/vleo-mod-massaero/nodes/aero_ballistic_coefficient/model.rs"
checked_by = "Aman Rai"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "BC"
type = "Ratio"
unit = "One"
lower = 5.0
upper = 500.0
reason_lower = "below 5 kg/m2 the vehicle is a sail, and nothing in this band closes"
reason_upper = "above 500 kg/m2 the vehicle is denser than any spacecraft ever flown"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "m"
var = "mass_wet"
type = "Mass"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "cd"
var = "aero_drag_coefficient"
type = "Ratio"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "a"
var = "aero_frontal_area"
type = "Area"

[[algorithm.step]]
number = 1
text = "divide the wet mass by the product of drag coefficient and frontal area"
binds = "bc"
type = "Ratio"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (aero) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "Wet mass over drag coefficient times frontal area, as stated and cited from vallado2013, not yet derived on the sheet."
breaks_if = "A derivation or a check against vallado2013 disagrees, or a value comes out below 5 or above 500 kilograms per square metre."
relation = "BC = m/(Cd*A)"
source = "vallado2013"
