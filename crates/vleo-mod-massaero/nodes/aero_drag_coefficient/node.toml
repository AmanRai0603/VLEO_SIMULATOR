# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "aero_drag_coefficient"
label = "Drag coefficient"
folder = "aero_drag_coefficient"   # frozen at seed; renaming the label never moves the directory
subsystem = "aero"
parent = "l3_massaero"
kind = "computed"
owner = "aero"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 538
state = "published"

[question]
text = "What is the drag coefficient of this body, at this speed ratio, with this surface?"
note = "Treating this as a constant 2.2 is the single largest avoidable error in a VLEO drag estimate, and it is what most concept studies do."

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How much drag this body's shape and surface produce for its frontal area, at its flight speed, in its gas and with its surface condition. It is worked out for gas too thin for its molecules to collide near the body, for the front face and the side walls, and referred back to the frontal area."
breaks = "It assumes a molecule leaving the surface never returns and never strikes an incoming one. That fails below a Knudsen number of 10, a measure of how thin the gas is for a body this size, roughly 150 kilometres for this body. Above 5 the body is not the slender one the model assumes."
wrong = "That the drag coefficient is a constant 2.2. Treating it so is the single largest avoidable error in a very-low-orbit drag estimate, and it is what most concept studies do."
by = "an assistant, from what this sheet states — for its owner (aero) to confirm"

[maths]
expression = "Cd = P/sqrt(pi) + gamma*Q*Z + (gamma/2)*vr*(gamma*sqrt(pi)*Z + P)"
source = "doornbos2011"

[[assumption]]
text = "Free-molecular flow — a molecule leaving the surface never returns and never strikes an incoming one"
fails_when = "below Kn = 10, which is roughly 150 km for this body; the Knudsen number is an input so that the guard on it is visible here"

[method]
text = """
# Transcribed from crates/vleo-mod-massaero/nodes/aero_drag_coefficient/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
return cylinder_drag_coefficient(s, l, d, alpha, t_w, v, m)
"""
by = ""
transcribed_from = "crates/vleo-mod-massaero/nodes/aero_drag_coefficient/model.rs"
checked_by = ""

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "Cd"
type = "Ratio"
unit = "One"
lower = 1.5
upper = 5.0
reason_lower = "no free-molecular body has a drag coefficient below 1.5; a lower value means the speed ratio or the accommodation is wrong"
reason_upper = "above 5.0 the geometry is not the slender body this model assumes"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "s"
var = "aero_speed_ratio"
type = "Ratio"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "l"
var = "aero_body_length"
type = "Length"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "d"
var = "aero_body_diameter"
type = "Length"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "alpha"
var = "aero_accommodation"
type = "Ratio"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "t_w"
var = "env_wall_temperature"
type = "Temperature"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "v"
var = "orbit_velocity"
type = "Velocity"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "m"
var = "env_mean_molar_mass"
type = "MolarMass"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "kn"
var = "env_knudsen"
type = "Ratio"

[[algorithm.step]]
number = 1
text = "evaluate Sentman's free-molecular coefficients for the front face and the side walls, referred back to the frontal area"
binds = "cd"
type = "Ratio"

[view]
kind = "line"
over = "orbit_altitude"
points = 60

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (aero) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "Free-molecular flow, with Sentman's coefficients for front face and side walls as stated and cited from doornbos2011, not yet derived on the sheet."
breaks_if = "The Knudsen number falls below 10, roughly 150 kilometres for this body; the result falls below 1.5, meaning the speed ratio or accommodation is wrong; or a check against doornbos2011 disagrees."
relation = "Cd = P/sqrt(pi) + gamma*Q*Z + (gamma/2)*vr*(gamma*sqrt(pi)*Z + P)"
