# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "aero_body_length"
label = "Body length"
folder = "aero_body_length"   # frozen at seed; renaming the label never moves the directory
subsystem = "aero"
parent = "l3_massaero"
kind = "declared"
owner = "mass"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 531
state = "published"

[question]
text = "How long is the vehicle along the flight direction?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How long the spacecraft is along the direction it flies. It bounds how much fits inside, including the several payloads the mission carries."
breaks = "Below 0.3 metres the vehicle is smaller than a three-unit cubesat, a small standard satellite size, and the payloads do not fit. Above 10 metres both the launch envelope and the panel drag model this tool uses stop applying."
by = "an assistant, from what this sheet states — for its owner (mass) to confirm"

[maths]
expression = "L = 2"
source = "orbitt_case_c1"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "L"
type = "Length"
unit = "Metre"
lower = 0.3
upper = 10.0
reason_lower = "below 0.3 m the vehicle is smaller than a 3U cubesat and the multipayload mission does not fit in it"
reason_upper = "above 10 m the launch envelope and the free-molecular panel model both stop applying"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 2.0
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (mass) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That 2 metres is this design's body length, from the source the sheet cites (orbitt_case_c1), confirmed by A. Rai on 2026-09-01."
breaks_if = "A launch envelope that cannot take a 2 metre body, or a payload layout for this design that needs a different length."
relation = "L = 2"
source = "orbitt_case_c1"
