# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "aero_cp_cm_offset"
label = "Centre of pressure to centre of mass offset"
folder = "aero_cp_cm_offset"   # frozen at seed; renaming the label never moves the directory
subsystem = "aero"
parent = "l3_massaero"
kind = "declared"
owner = "gnc"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 534
state = "published"

[question]
text = "How far behind the centre of mass does the aerodynamic force act?"
note = "Positive means aft, which is the stable configuration. Arranging that is most of what passive aerostability in VLEO means."

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How far behind the centre of mass the air's push on the spacecraft acts. Behind is the stable arrangement, where the vehicle tends to keep facing into the flow, and arranging that is most of what staying stable by the air alone means at these low altitudes."
breaks = "It is one declared distance, not worked out from where the mass and the surfaces actually sit. A zero offset is only neutrally stable, and the offset cannot be longer than the body."
wrong = "A zero offset is not a safe balanced choice: it is neutrally stable, which is the limit and not a design. The stable arrangement has the push acting behind the centre of mass."
by = "an assistant, from what this sheet states — for its owner (gnc) to confirm"

[maths]
expression = "x_cp = 0.15"
source = "orbitt_case_c1"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "x_cp"
type = "Length"
unit = "Metre"
lower = 0.0
upper = 2.0
reason_lower = "a zero offset is neutrally stable, which is the limit and not a design"
reason_upper = "the offset cannot exceed the body length"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 0.15
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (gnc) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That 0.15 metres behind the centre of mass is this design's offset, from the source the sheet cites (orbitt_case_c1), confirmed by A. Rai on 2026-09-01."
breaks_if = "A mass or layout estimate for this design that puts the aerodynamic force at a different distance behind the centre of mass, or ahead of it."
relation = "x_cp = 0.15"
source = "orbitt_case_c1"
