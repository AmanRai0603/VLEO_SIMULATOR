# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "aero_speed_ratio"
label = "Molecular speed ratio"
folder = "aero_speed_ratio"   # frozen at seed; renaming the label never moves the directory
subsystem = "aero"
parent = "l3_massaero"
kind = "computed"
owner = "aero"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 536
state = "published"

[question]
text = "How hyperthermal is the flow — does the gas arrive as a beam or as a cloud?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How fast the spacecraft moves compared with the random thermal motion of the gas around it, which says whether the gas arrives as a beam or as a cloud. It is the flight speed divided by the most probable thermal speed of the local gas mixture."
breaks = "Below one the flow is thermal rather than beam-like and Sentman's drag relations lose their meaning. Above 30 the numbers inside those relations become too small to compute and the relations are numerically dead."
by = "an assistant, from what this sheet states — for its owner (aero) to confirm"

[maths]
expression = "s = V/sqrt(2*R*T/M)"
source = "sentman1961"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "s"
type = "Ratio"
unit = "One"
lower = 1.0
upper = 30.0
reason_lower = "below a speed ratio of one the flow is thermal rather than hyperthermal, and Sentman's relations lose their meaning"
reason_upper = "above 30 the exponential terms underflow and the relations are numerically dead"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "v"
var = "orbit_velocity"
type = "Velocity"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "t"
var = "env_local_temperature"
type = "Temperature"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "m"
var = "env_mean_molar_mass"
type = "MolarMass"

[[algorithm.step]]
number = 1
text = "divide the bulk speed by the most probable thermal speed of the local mixture"
binds = "s"
type = "Ratio"

[view]
kind = "number"

[[version]]
n = 1
release = "next"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (aero) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "Bulk speed over the most probable thermal speed of the local mixture, as stated and cited from sentman1961, not yet derived on the sheet."
breaks_if = "A derivation or a check against sentman1961 disagrees, or the ratio falls below one or rises above 30."
relation = "s = V/sqrt(2*R*T/M)"
source = "sentman1961"
