# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "mass_limit"
label = "Mass limit"
folder = "mass_limit"   # frozen at seed; renaming the label never moves the directory
subsystem = "mass"
parent = "l3_massaero"
kind = "declared"
owner = "systems"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 689
state = "published"

[question]
text = "What is the mass the launch slot or the bus allows?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "The most the spacecraft is allowed to weigh, set by the launch slot or the bus it rides on: 250 kilograms. It is the ceiling the spacecraft's mass must stay under."
breaks = "It is one declared number with no reason beyond the case it came from, and it does not say whether the launch slot or the bus sets it. It is only held to be sensible between 5 kilograms and 5 tonnes: below that no multi-payload mission fits, above it the launch and class are not the ones costed here."
by = "an assistant, from what this sheet states — for its owner (systems) to confirm"

[maths]
expression = "m_lim = 250"
source = "orbitt_case_c1"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "m_lim"
type = "Mass"
unit = "Kilogram"
lower = 5.0
upper = 5000.0
reason_lower = "below 5 kg no multipayload mission fits"
reason_upper = "above 5 tonnes the launch and the class are not the ones costed here"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 250.0
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (systems) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That 250 kg is the mass the launch slot or bus allows for this design, as taken from the source case the sheet cites (orbitt_case_c1), confirmed by A. Rai on 2026-09-01."
breaks_if = "A launch agreement or bus specification for this design that allows a different mass than 250 kg."
relation = "m_lim = 250"
source = "orbitt_case_c1"
