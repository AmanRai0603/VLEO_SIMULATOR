# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "mass_disposal_propellant"
label = "Disposal propellant mass"
folder = "mass_disposal_propellant"   # frozen at seed; renaming the label never moves the directory
subsystem = "mass"
parent = "l3_massaero"
kind = "computed"
owner = "propulsion"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 691
state = "published"

[question]
text = "How much stored propellant must be carried for the disposal manoeuvre?"
note = "An air-breathing design does not reach zero here. Debris mitigation is a requirement, not a courtesy."

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How much stored propellant must be carried, in kilograms, for the manoeuvre that brings the spacecraft down at the end of its life. It comes from the dry mass and the speed change the manoeuvre needs, at a specific impulse, a measure of engine efficiency, of 220 seconds."
breaks = "It assumes a stored-propellant engine at 220 seconds of specific impulse. Above a tonne the disposal budget is larger than the spacecraft."
wrong = "That an air-breathing spacecraft needs no disposal propellant. It does not reach zero here: debris mitigation is a requirement, not a courtesy."
by = "an assistant, from what this sheet states — for its owner (propulsion) to confirm"

[maths]
expression = "m = m_dry*(exp(dv/v_e) - 1)"
source = "iso24113"

[method]
text = """
# Transcribed from crates/vleo-mod-massaero/nodes/mass_disposal_propellant/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
# Constants the code held, written out here as it held them: 220 [s].
return propellant_mass(m, dv, exhaust_velocity(220 [s]))
"""
by = ""
transcribed_from = "crates/vleo-mod-massaero/nodes/mass_disposal_propellant/model.rs"
checked_by = ""

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "m_dis"
type = "Mass"
unit = "Kilogram"
lower = 0.0
upper = 1000.0
reason_lower = "a propellant mass cannot be negative"
reason_upper = "above a tonne the disposal budget is larger than the spacecraft"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "m"
var = "mass_dry"
type = "Mass"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "dv"
var = "orbit_deorbit_delta_v"
type = "Velocity"

[[algorithm.step]]
number = 1
text = "apply the rocket equation at a 220 s stored-propellant specific impulse"
binds = "mp"
type = "Mass"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (propulsion) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "The rocket equation at a 220 s stored-propellant specific impulse, as stated and cited from iso24113, not yet derived on the sheet."
breaks_if = "The disposal engine's specific impulse is not 220 seconds, a check against iso24113 disagrees, or the result exceeds a tonne."
relation = "m = m_dry*(exp(dv/v_e) - 1)"
source = "iso24113"
