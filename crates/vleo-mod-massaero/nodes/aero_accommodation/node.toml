# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "aero_accommodation"
label = "Energy accommodation coefficient"
folder = "aero_accommodation"   # frozen at seed; renaming the label never moves the directory
subsystem = "aero"
parent = "l3_massaero"
kind = "computed"
owner = "aero"
tier = "B"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 537
state = "published"

[question]
text = "How completely does an incoming molecule thermalise with the surface before leaving?"
note = "A design that assumes a fixed accommodation has a margin that moves when the Sun does."

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How completely a gas molecule that hits the spacecraft settles to the surface's own temperature before it leaves, as a fraction from zero to one. It is worked out from how much atomic oxygen covers the surface, which depends on the oxygen density and the temperature of the upper atmosphere."
breaks = "It assumes the surface is covered in atomic oxygen stuck to it and behaves as that coverage dictates. A freshly cleaned or fluorinated surface holds far less, and its drag differs by tens of per cent from what this gives."
wrong = "That accommodation is a fixed property of the surface, set once. It follows the atmosphere, so a design that assumes a fixed value has a margin that moves when the Sun does."
by = "an assistant, from what this sheet states — for its owner (aero) to confirm"

[maths]
expression = "alpha = K*n_O*T_inf/(1 + K*n_O*T_inf),  K = 7.5e-17"
source = "moe2005"

[[assumption]]
text = "The surface is covered in adsorbed atomic oxygen and behaves as that coverage dictates"
fails_when = "a freshly cleaned or a fluorinated surface adsorbs far less, and its drag differs by tens of per cent from this"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "alpha"
type = "Ratio"
unit = "One"
lower = 0.0
upper = 1.0
reason_lower = "accommodation is a fraction and cannot be negative"
reason_upper = "full accommodation is one; above it the reflected molecules would carry away energy the surface does not have"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "n_o"
var = "env_atomic_oxygen_density"
type = "NumberDensity"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "t_inf"
var = "env_exospheric_temperature"
type = "Temperature"

[[algorithm.step]]
number = 1
text = "apply the Langmuir adsorption isotherm for atomic oxygen coverage"
binds = "a"
type = "Ratio"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (aero) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "The surface is covered in adsorbed atomic oxygen, with the adsorption relation as stated and cited from moe2005, not yet derived on the sheet."
breaks_if = "The surface is freshly cleaned or fluorinated and holds far less oxygen, or a derivation or check against moe2005 disagrees."
relation = "alpha = K*n_O*T_inf/(1 + K*n_O*T_inf),  K = 7.5e-17"
source = "moe2005"
