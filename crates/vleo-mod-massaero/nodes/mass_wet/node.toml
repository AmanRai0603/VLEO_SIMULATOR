# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "mass_wet"
label = "Wet mass"
folder = "mass_wet"   # frozen at seed; renaming the label never moves the directory
subsystem = "mass"
parent = "l3_massaero"
kind = "computed"
owner = "mass"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 692
state = "published"

[question]
text = "What does the spacecraft weigh at separation?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "What the spacecraft weighs at separation from its launcher, in kilograms: the dry mass plus the disposal propellant."
breaks = "The only propellant it adds is the disposal propellant, so any other propellant carried is not in this sum. Below a kilogram there is no spacecraft; above 6 tonnes the vehicle is not in this class."
by = "an assistant, from what this sheet states — for its owner (mass) to confirm"

[maths]
expression = "m_wet = m_dry + m_prop"
source = "ecss_e_st_10_02"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "m_wet"
type = "Mass"
unit = "Kilogram"
lower = 1.0
upper = 6000.0
reason_lower = "below a kilogram there is no spacecraft"
reason_upper = "above 6 tonnes the vehicle is not in this class"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "d"
var = "mass_dry"
type = "Mass"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "p"
var = "mass_disposal_propellant"
type = "Mass"

[[algorithm.step]]
number = 1
text = "add the disposal propellant to the dry mass"
binds = "m"
type = "Mass"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (mass) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "Dry mass plus disposal propellant, as stated and cited from ecss_e_st_10_02, not yet derived on the sheet."
breaks_if = "The design carries propellant other than for disposal, a check against ecss_e_st_10_02 disagrees, or the result falls outside a kilogram to 6 tonnes."
relation = "m_wet = m_dry + m_prop"
source = "ecss_e_st_10_02"
