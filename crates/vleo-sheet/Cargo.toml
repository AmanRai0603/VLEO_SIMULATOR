[package]
name = "vleo-sheet"
description = "What a sheet means — read, checked, generated from and edited. One implementation, used by the generators in xtask, by the build scripts, and by the daemon for the declaration form and the manual, so no face carries a second copy that could disagree. Not linked into the engine: a run never reads a sheet."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
toml = { workspace = true }
vleo-units = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
