[package]
name = "vleo-sheet"
description = "What a node's content means — the sheet, read from the design's files, checked, run as a method and printed as its page. One implementation, used by xtask, the server, the command line, the engine's graph and the pages' checkers, so no face carries a second copy that could disagree."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
toml = { workspace = true }
toml_edit = { workspace = true }
vleo-units = { workspace = true }
# The kernel functions a method may call by name (method/kernel.rs): the
# interpreter runs the kernel itself, so a method and the kernel cannot differ.
vleo-core = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
