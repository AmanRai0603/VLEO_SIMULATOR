# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "prop_throttle"
label = "Propulsion throttle"
folder = "throttle"   # frozen at seed; renaming the label never moves the directory
subsystem = "prop"
parent = "l3_prop"
kind = "computed"
owner = "propulsion"
tier = "B"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
state = "published"

[question]
text = "How much of what the thruster asks for can the bus actually give it?"
note = "The node that makes the power budget bite on the physics rather than being reported beside it."

[maths]
expression = "k = clamp((P_avail - P_other)/P_prop, 0, 1)"
source = "orbitt_case_c1"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "k_thr"
type = "Ratio"
unit = "One"
lower = 0.0
upper = 1.0
reason_lower = "a throttle cannot be negative"
reason_upper = "the thruster cannot be given more than it asked for"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "av"
var = "pwr_available"
type = "Power"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "pp"
var = "prop_bus_power"
type = "Power"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "pay"
var = "pay_power"
type = "Power"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "ax"
var = "pwr_avionics_load"
type = "Power"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "cm"
var = "com_tx_power"
type = "Power"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "th"
var = "pwr_thermal_load"
type = "Power"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "lh"
var = "pwr_harness_loss"
type = "Ratio"

[[algorithm.step]]
number = 1
text = "subtract every other load from what is available and give the remainder to propulsion, capped at what it asked for"
binds = "k"
type = "Ratio"

[contributes]
kpis = ["kpi_thrust_margin", "kpi_power_margin"]

[view]
kind = "number"

