# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "prop_input_power"
label = "Thruster input power"
folder = "prop_input_power"   # frozen at seed; renaming the label never moves the directory
subsystem = "prop"
parent = "l3_prop"
kind = "computed"
owner = "propulsion"
tier = "B"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 566
state = "published"

[question]
text = "How much electrical power does the thruster itself draw?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How much electrical power the thruster itself draws: the power that ends up in the beam plus the power spent making ions, raised to cover the thruster's other losses."
breaks = "Every loss other than ionisation is gathered into one fraction, so the answer is only as good as that single figure. It is the thruster's own draw, not what propulsion takes from the bus. Above 100 kilowatts no bus in this mass class supplies it."
by = "an assistant, from what this sheet states — for its owner (propulsion) to confirm"

[maths]
expression = "P_in = (P_jet + P_ion)/(1 - L_other)"
source = "romano2021"

[method]
text = """
# Transcribed from crates/vleo-mod-prop/nodes/prop_input_power/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
return thruster_input_power(pj, pi, lo)
"""
by = ""
transcribed_from = "crates/vleo-mod-prop/nodes/prop_input_power/model.rs"
checked_by = "Aman Rai"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "P_in"
type = "Power"
unit = "Watt"
lower = 0.0
upper = 100000.0
reason_lower = "input power cannot be negative"
reason_upper = "above 100 kW no bus in this mass class supplies it"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "pj"
var = "prop_jet_power"
type = "Power"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "pi"
var = "prop_ionisation_power"
type = "Power"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "lo"
var = "prop_other_losses"
type = "Ratio"

[[algorithm.step]]
number = 1
text = "sum the useful terms and inflate them by the other-loss fraction"
binds = "p"
type = "Power"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (propulsion) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "The relation as stated and cited to romano2021, the jet and ionisation power inflated by the other-loss fraction, not yet derived on the sheet."
breaks_if = "A derivation or comparison with romano2021 that disagrees, or other losses that do not scale with the jet and ionisation power."
relation = "P_in = (P_jet + P_ion)/(1 - L_other)"
source = "romano2021"
