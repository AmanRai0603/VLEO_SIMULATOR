# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "prop_ionisation_power"
label = "Ionisation power"
folder = "prop_ionisation_power"   # frozen at seed; renaming the label never moves the directory
subsystem = "prop"
parent = "l3_prop"
kind = "computed"
owner = "propulsion"
tier = "B"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 565
state = "published"

[question]
text = "How much power does making the ions cost, before any of them is accelerated?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How much power it costs to make the ions, before any of them is accelerated: the number of ions made each second, each charged its stated energy cost."
breaks = "It is only as good as the stated energy cost per ion, and it counts ions of the air's average mass. Above 100 kilowatts no bus in this mass class supplies it."
by = "an assistant, from what this sheet states — for its owner (propulsion) to confirm"

[maths]
expression = "P_ion = (mdot_i/m_i)*eps_i*q"
source = "romano2021"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "P_ion"
type = "Power"
unit = "Watt"
lower = 0.0
upper = 100000.0
reason_lower = "ionisation power cannot be negative"
reason_upper = "above 100 kW no bus in this mass class supplies it"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "mi"
var = "prop_ion_flow"
type = "MassFlow"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "m"
var = "env_mean_molar_mass"
type = "MolarMass"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "eps"
var = "prop_ionisation_cost"
type = "Ratio"

[[algorithm.step]]
number = 1
text = "convert the ion mass flow into ions per second and charge each one its stated energy cost"
binds = "p"
type = "Power"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (propulsion) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "The relation as stated and cited to romano2021, ions per second each charged its stated energy cost, not yet derived on the sheet."
breaks_if = "A derivation or comparison with romano2021 that disagrees, or ions whose mass is not the air's average."
relation = "P_ion = (mdot_i/m_i)*eps_i*q"
source = "romano2021"
