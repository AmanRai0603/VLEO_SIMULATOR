# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "prop_incident_flux"
label = "Incident mass flux"
folder = "prop_incident_flux"   # frozen at seed; renaming the label never moves the directory
subsystem = "prop"
parent = "l3_prop"
kind = "computed"
owner = "propulsion"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 556
state = "published"

[question]
text = "How much mass arrives on a square metre facing the flow each second?"
note = "The ceiling on everything downstream. At 200 km it is about 2 milligrams per square metre per second."

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How much air arrives each second on one square metre facing the flow: the air's density times the flight speed. It is the ceiling on everything downstream; at 200 kilometres it is about 2 milligrams per square metre per second."
breaks = "It is what arrives, not what is captured; everything downstream is at most a part of it. Above 1 kilogram per square metre per second the flow is continuum, behaving as a fluid rather than as separate molecules, and the intake model does not apply."
by = "an assistant, from what this sheet states — for its owner (propulsion) to confirm"

[maths]
expression = "phi = rho*V"
source = "romano2021"

[method]
text = """
# Transcribed from crates/vleo-mod-prop/nodes/prop_incident_flux/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
return incident_mass_flux(rho, v)
"""
by = ""
transcribed_from = "crates/vleo-mod-prop/nodes/prop_incident_flux/model.rs"
checked_by = ""

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "phi"
type = "MassFlux"
unit = "KgPerSecond"
lower = 0.0
upper = 1.0
reason_lower = "an incident flux cannot be negative"
reason_upper = "above 1 kg/m2/s the flow is continuum and the intake model does not apply"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "rho"
var = "env_mass_density"
type = "MassDensity"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "v"
var = "orbit_velocity"
type = "Velocity"

[[algorithm.step]]
number = 1
text = "multiply the free-stream density by the flight speed"
binds = "f"
type = "MassFlux"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (propulsion) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "The relation as stated and cited to romano2021, the free-stream density multiplied by the flight speed, not yet derived on the sheet."
breaks_if = "A derivation or comparison with romano2021 that disagrees, a value at 200 kilometres far from about 2 milligrams per square metre per second, or a flux above 1 kilogram per square metre per second."
relation = "phi = rho*V"
source = "romano2021"
