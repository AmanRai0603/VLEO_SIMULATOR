# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "prop_throat_area"
label = "Intake throat area"
folder = "prop_throat_area"   # frozen at seed; renaming the label never moves the directory
subsystem = "prop"
parent = "l3_prop"
kind = "declared"
owner = "propulsion"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 546
state = "published"

[question]
text = "How large is the opening from the collection chamber into the thruster?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "The size of the opening from the intake's collection chamber into the thruster: 0.01 square metres."
breaks = "It is a declared size. Below one square centimetre the throat chokes the flow to the thruster however much the mouth collects, and it cannot be larger than the mouth in any useful intake."
by = "an assistant, from what this sheet states — for its owner (propulsion) to confirm"

[maths]
expression = "A_out = 0.01"
source = "romano2021"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "A_out"
type = "Area"
unit = "SquareMetre"
lower = 0.0001
upper = 1.0
reason_lower = "below 1 cm2 the throat chokes the flow to the thruster whatever the mouth collects"
reason_upper = "the throat cannot be larger than the mouth in any useful intake"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 0.01
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "next"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (propulsion) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That a throat of 0.01 square metres is right for this intake; the value is declared, confirmed by A. Rai on 2026-09-01, and the sheet gives no further reason for it."
breaks_if = "An intake design or test with a different throat opening, or evidence that this one chokes the flow to the thruster."
relation = "A_out = 0.01"
source = "romano2021"
