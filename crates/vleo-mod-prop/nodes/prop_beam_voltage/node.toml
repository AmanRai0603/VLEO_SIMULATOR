# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "prop_beam_voltage"
label = "Beam accelerating voltage"
folder = "prop_beam_voltage"   # frozen at seed; renaming the label never moves the directory
subsystem = "prop"
parent = "l3_prop"
kind = "declared"
owner = "propulsion"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 550
state = "published"

[question]
text = "Through what potential is the ion beam accelerated?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "The voltage the thruster uses to speed up its ions: 300 volts. It sets how fast the exhaust leaves and so how much thrust a given flow of collected gas gives."
breaks = "It is a chosen number, not one derived from the thruster. Below 50 volts the exhaust is too slow to give useful thrust from this flow, and above 2000 volts the grids wear away under atomic oxygen, the reactive single oxygen atoms of this altitude, with no demonstrated design to rely on."
by = "an assistant, from what this sheet states — for its owner (propulsion) to confirm"

[maths]
expression = "V_b = 300"
source = "romano2021"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "V_b"
type = "Voltage"
unit = "Volt"
lower = 50.0
upper = 2000.0
reason_lower = "below 50 V the exhaust velocity is too low to produce useful thrust from this mass flow"
reason_upper = "above 2000 V grid erosion by atomic oxygen becomes the life-limiting mechanism, and the design has no demonstrated basis"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 300.0
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "next"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (propulsion) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That a beam voltage of 300 volts is right for this thruster; the value is declared, confirmed by A. Rai on 2026-09-01, and the sheet gives no further reason for it."
breaks_if = "A thruster design or test at a different working voltage, or grid erosion by atomic oxygen showing up at this voltage."
relation = "V_b = 300"
source = "romano2021"
