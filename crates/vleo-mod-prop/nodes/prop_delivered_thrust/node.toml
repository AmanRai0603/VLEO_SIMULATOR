# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "prop_delivered_thrust"
label = "Thrust actually delivered"
folder = "prop_delivered_thrust"   # frozen at seed; renaming the label never moves the directory
subsystem = "prop"
parent = "l3_prop"
kind = "computed"
owner = "propulsion"
tier = "B"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 720
state = "published"

[question]
text = "How much thrust is produced once the power available is taken into account?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How much thrust the thruster actually delivers once the power it can get is taken into account: its full thrust scaled by the throttle, with the push it gets from each unit of propellant held unchanged."
breaks = "It assumes thrust falls in step with power. A real thruster's efficiency falls away from its design point, so a deeply throttled system delivers less than this; the answer is optimistic below about half throttle."
wrong = "That a thruster given half its power gives half its thrust. That is what the relation assumes, and below about half throttle a real thruster delivers less."
by = "an assistant, from what this sheet states — for its owner (propulsion) to confirm"

[maths]
expression = "T = k*T"
source = "orbitt_case_c1"

[[assumption]]
text = "Thrust scales linearly with delivered power at fixed specific impulse"
fails_when = "a real thruster's efficiency falls away from its design point, so a deeply throttled system delivers less than this; the relation is optimistic below about half throttle"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "T_del"
type = "Force"
unit = "Millinewton"
lower = 0.0
upper = 1000.0
reason_lower = "thrust cannot be negative"
reason_upper = "above 1 N no air-breathing thruster in this band produces thrust"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "t"
var = "prop_thrust"
type = "Force"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "k"
var = "prop_throttle"
type = "Ratio"

[[algorithm.step]]
number = 1
text = "scale thrust with the throttle at fixed specific impulse"
binds = "d"
type = "Force"

[contributes]
kpis = ["kpi_thrust_margin"]

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (propulsion) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "The relation as stated and cited to orbitt_case_c1, not yet derived on the sheet, assuming thrust scales linearly with delivered power at fixed specific impulse."
breaks_if = "Data showing the thruster's thrust falls faster than its power when throttled, most likely below about half throttle, or a derivation or comparison with orbitt_case_c1 that disagrees."
relation = "T = k*T"
source = "orbitt_case_c1"
