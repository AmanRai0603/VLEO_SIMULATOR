# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "prop_other_losses"
label = "Other thruster losses"
folder = "prop_other_losses"   # frozen at seed; renaming the label never moves the directory
subsystem = "prop"
parent = "l3_prop"
kind = "declared"
owner = "propulsion"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 554
state = "published"

[question]
text = "What fraction of the thruster's input power goes to losses other than ionisation and the beam?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "The share of the thruster's input power lost to things other than making ions and the beam itself: 15 per cent."
breaks = "It gathers every other loss into one declared fraction, without naming them. Above 60 per cent the thruster would be mostly a heater with a beam attached, and the figure stops describing a working thruster."
by = "an assistant, from what this sheet states — for its owner (propulsion) to confirm"

[maths]
expression = "L_other = 0.15"
source = "romano2021"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "L_other"
type = "Ratio"
unit = "One"
lower = 0.0
upper = 0.6
reason_lower = "a loss fraction cannot be negative"
reason_upper = "above 0.6 the thruster is a heater with a beam attached"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 0.15
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "next"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (propulsion) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That other losses take 0.15 of the thruster's input power; the value is declared, confirmed by A. Rai on 2026-09-01, and the sheet gives no further reason for it."
breaks_if = "A power audit or test of this thruster showing a different share of input power lost outside ionisation and the beam."
relation = "L_other = 0.15"
source = "romano2021"
