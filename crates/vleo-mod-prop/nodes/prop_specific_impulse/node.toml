# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "prop_specific_impulse"
label = "Specific impulse"
folder = "prop_specific_impulse"   # frozen at seed; renaming the label never moves the directory
subsystem = "prop"
parent = "l3_prop"
kind = "computed"
owner = "propulsion"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 569
state = "published"

[question]
text = "What is the specific impulse, referred honestly to the collected flow rather than the ionised part?"
note = "Referring this to the ion flow alone flatters the number by the reciprocal of the utilisation, which is how brochure figures are made."

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How much thrust the system gets for each unit of propellant weight used per second, counted honestly against all the air collected rather than only the part that was ionised."
breaks = "Below 100 seconds an air-breathing system offers nothing a cold gas thruster does not. Above 50,000 seconds the relation is being fed an ion flow that is not physical."
wrong = "That specific impulse should be counted against the ionised flow alone. Doing so makes the number look larger by one over the share of propellant used, which is how brochure figures are made."
by = "an assistant, from what this sheet states — for its owner (propulsion) to confirm"

[maths]
expression = "Isp = T/(mdot*g0)"
source = "romano2021"

[method]
text = """
# Transcribed from crates/vleo-mod-prop/nodes/prop_specific_impulse/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
return specific_impulse(t, md)
"""
by = ""
transcribed_from = "crates/vleo-mod-prop/nodes/prop_specific_impulse/model.rs"
checked_by = "Aman Rai"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "Isp"
type = "Time"
unit = "Second"
lower = 100.0
upper = 50000.0
reason_lower = "below 100 s an air-breathing system offers nothing a cold gas thruster does not"
reason_upper = "above 50000 s the relation is being fed an ion flow that is not physical"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "t"
var = "prop_thrust"
type = "Force"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "md"
var = "prop_collected_flow"
type = "MassFlow"

[[algorithm.step]]
number = 1
text = "divide thrust by the weight flow of everything collected, not only what was ionised"
binds = "i"
type = "Time"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (propulsion) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "The relation as stated and cited to romano2021, thrust divided by the weight flow of everything collected, not yet derived on the sheet."
breaks_if = "A derivation or comparison with romano2021 that disagrees, or a result below 100 or above 50,000 seconds."
relation = "Isp = T/(mdot*g0)"
source = "romano2021"
