# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "prop_div_efficiency"
label = "Beam divergence efficiency"
folder = "prop_div_efficiency"   # frozen at seed; renaming the label never moves the directory
subsystem = "prop"
parent = "l3_prop"
kind = "declared"
owner = "propulsion"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 551
state = "published"

[question]
text = "How much thrust is lost because the beam is not perfectly axial?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How much thrust survives the ion beam spreading out instead of leaving perfectly straight backwards: 97 per cent, so three per cent is lost."
breaks = "It is one declared factor for the beam's spread. A perfectly straight beam, a factor of one, does not exist, and below 0.7 the beam is more a cloud than a beam, so the idea stops applying."
by = "an assistant, from what this sheet states — for its owner (propulsion) to confirm"

[maths]
expression = "alpha_div = 0.97"
source = "romano2021"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "alpha_div"
type = "Ratio"
unit = "One"
lower = 0.7
upper = 1.0
reason_lower = "below 0.7 the beam is a cloud rather than a beam"
reason_upper = "unity is a perfectly collimated beam, which does not exist"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 0.97
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "next"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (propulsion) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That a divergence efficiency of 0.97 (a fraction) is right for this thruster's beam; the value is declared, confirmed by A. Rai on 2026-09-01, and the sheet gives no further reason for it."
breaks_if = "A measurement of this thruster's beam spread giving a noticeably different thrust loss."
relation = "alpha_div = 0.97"
source = "romano2021"
