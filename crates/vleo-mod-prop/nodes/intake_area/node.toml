# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "prop_intake_area"
label = "Intake mouth area"
folder = "intake_area"   # frozen at seed; renaming the label never moves the directory
subsystem = "prop"
parent = "l3_prop"
kind = "declared"
owner = "propulsion"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
state = "published"

[question]
text = "How large is the opening the intake presents to the flow?"
note = "Both the numerator and part of the denominator of the closure. A bigger mouth collects more and drags more, which is why there is an optimum rather than a maximum."

[maths]
expression = "A_in = 0.2"
source = "romano2021"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "A_in"
type = "Area"
unit = "SquareMetre"
lower = 0.01
upper = 5.0
reason_lower = "below 100 cm2 the collected flow is below the ionisation threshold of any thruster considered"
reason_upper = "above 5 m2 the mouth is itself more drag than the thrust it can produce, at every altitude in the band"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 0.2
confirmed_by = "A. Rai / 2026-09-01"

[contributes]
kpis = ["kpi_thrust_margin"]

[view]
kind = "number"

