# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "prop_ionisation_cost"
label = "Energy cost per ion"
folder = "prop_ionisation_cost"   # frozen at seed; renaming the label never moves the directory
subsystem = "prop"
parent = "l3_prop"
kind = "declared"
owner = "propulsion"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 553
state = "published"

[question]
text = "How much energy does the source spend to make one ion, including every loss?"
note = "Not the ionisation potential. A real source spends 2 to 30 times the theoretical minimum on excitation, radiation and wall losses."

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How much energy the thruster's source actually spends to make one ion, counting every loss along the way: 250 electronvolts per ion."
breaks = "It is one declared figure. A real source spends between 2 and 30 times the theoretical minimum on excitation, radiation and losses to the walls; below 20 electronvolts per ion no source has come close, and above 1000 the ionisation power alone exceeds any plausible spacecraft power supply."
wrong = "It is easy to take this as the energy needed to remove one electron from an oxygen atom, 13.6 electronvolts; it is not, because a real source spends many times that on losses."
by = "an assistant, from what this sheet states — for its owner (propulsion) to confirm"

[maths]
expression = "eps_i = 250"
source = "romano2021"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "eps_i"
type = "Ratio"
unit = "One"
lower = 20.0
upper = 1000.0
reason_lower = "below 20 eV per ion is under twice the 13.6 eV ionisation potential of atomic oxygen; no source has approached it"
reason_upper = "above 1000 eV per ion the ionisation power alone exceeds any plausible bus, whatever the beam does"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 250.0
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "next"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (propulsion) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That the source spends 250 electronvolts per ion, all losses included; the value is declared, confirmed by A. Rai on 2026-09-01, and the sheet gives no further reason for it. The sheet records the unit as a plain number, while its bounds read in electronvolts per ion."
breaks_if = "A measured energy cost per ion for this source that differs from 250 electronvolts."
relation = "eps_i = 250"
source = "romano2021"
