# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "prop_utilisation"
label = "Propellant utilisation efficiency"
folder = "prop_utilisation"   # frozen at seed; renaming the label never moves the directory
subsystem = "prop"
parent = "l3_prop"
kind = "declared"
owner = "propulsion"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 549
state = "published"

[question]
text = "What fraction of the collected mass is actually ionised and accelerated?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "The share of the gas the intake collects that the thruster actually turns into ions and speeds up: 40 per cent. It feeds the thrust margin."
breaks = "It is one declared fraction. Below 5 per cent the thruster ionises almost nothing and the concept does not work, and above 95 per cent no source of the kind used here has shown it on atomic oxygen."
by = "an assistant, from what this sheet states — for its owner (propulsion) to confirm"

[maths]
expression = "eta_u = 0.4"
source = "romano2021"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "eta_u"
type = "Ratio"
unit = "One"
lower = 0.05
upper = 0.95
reason_lower = "below 5% the thruster ionises almost nothing and the concept does not work"
reason_upper = "above 95% no inductively coupled source has demonstrated utilisation this high on atomic oxygen"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 0.4
confirmed_by = "A. Rai / 2026-09-01"

[contributes]
kpis = ["kpi_thrust_margin"]

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (propulsion) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That 0.4 of the collected mass is ionised and accelerated; the value is declared, confirmed by A. Rai on 2026-09-01, and the sheet gives no further reason for it."
breaks_if = "A test of this thruster on atomic oxygen showing a different utilisation."
relation = "eta_u = 0.4"
source = "romano2021"
