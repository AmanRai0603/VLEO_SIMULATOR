# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "prop_ppu_efficiency"
label = "Power processing unit efficiency"
folder = "ppu_efficiency"   # frozen at seed; renaming the label never moves the directory
subsystem = "prop"
parent = "sys_keep_orbit"
kind = "declared"
owner = "power"
tier = "A"
layer = 2   # 1 management · 2 the system · 3 subsystem · 4 the run
state = "published"

[question]
text = "How efficiently does the power processing unit convert bus power into thruster power?"

[maths]
