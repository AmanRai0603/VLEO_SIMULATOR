# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "prop_capture_efficiency"
label = "Intake collection efficiency"
folder = "prop_capture_efficiency"   # frozen at seed; renaming the label never moves the directory
subsystem = "prop"
parent = "l3_prop"
kind = "computed"
owner = "propulsion"
tier = "B"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 557
state = "published"

[question]
text = "What fraction of the flow entering the mouth actually reaches the thruster?"
note = "Read the relation slowly: the collection efficiency does not depend on the flight speed at all, only on geometry. Speed buys compression, not capture. A design trying to raise capture by flying faster is optimising the wrong term."

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "What fraction of the air entering the intake's mouth actually reaches the thruster. It depends only on the intake's shape, not on how fast the spacecraft flies: speed buys compression, not capture."
breaks = "It assumes the molecules in the duct and chamber do not collide with one another, which fails once the chamber is compressed beyond roughly ten thousand times. It also assumes the chamber gas has fully settled to the chamber temperature; a short duct passes part of the flow straight through, raising the delivered flow unmodelled."
wrong = "That flying faster raises capture. The fraction captured depends only on geometry, so a design trying to raise it by flying faster is optimising the wrong term."
by = "an assistant, from what this sheet states — for its owner (propulsion) to confirm"

[maths]
expression = "eta_c = A_out*eta_geo/(A_out + beta*A_in)"
source = "romano2021"

[[assumption]]
text = "Free-molecular flow throughout the duct and the chamber"
fails_when = "if the chamber compresses far enough to become collisional the balance is no longer a simple flux balance, which happens above a compression ratio of roughly 1e4"

[[assumption]]
text = "The chamber gas is fully thermalised at the chamber temperature"
fails_when = "a short duct passes part of the beam straight through, which raises the delivered flow above this and is not modelled"

[method]
text = """
# Transcribed from crates/vleo-mod-prop/nodes/prop_capture_efficiency/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
return intake_collection_efficiency(n, v, a_in, a_out, eta_geo, beta, t_c, m)
"""
by = ""
transcribed_from = "crates/vleo-mod-prop/nodes/prop_capture_efficiency/model.rs"
checked_by = "Aman Rai"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "eta_c"
type = "Ratio"
unit = "One"
lower = 0.0
upper = 1.0
reason_lower = "a collection efficiency cannot be negative"
reason_upper = "an intake cannot deliver more than enters its mouth"

