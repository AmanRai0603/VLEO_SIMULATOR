# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "prop_ppu_efficiency"
label = "Power processing unit efficiency"
folder = "prop_ppu_efficiency"   # frozen at seed; renaming the label never moves the directory
subsystem = "prop"
parent = "l3_prop"
kind = "declared"
owner = "power"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 555
state = "published"

[question]
text = "How efficiently does the power processing unit convert bus power into thruster power?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How much of the spacecraft's electrical power the power processing unit, the electronics that feed the thruster, passes on to the thruster: 90 per cent. The rest becomes heat."
breaks = "It is one declared efficiency. Below 50 per cent the unit wastes more than the thruster uses and the thermal design does not close, and above 98 per cent no flown unit has been demonstrated."
by = "an assistant, from what this sheet states — for its owner (power) to confirm"

[maths]
expression = "eta_ppu = 0.9"
source = "larson_wertz"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "eta_ppu"
type = "Ratio"
unit = "One"
lower = 0.5
upper = 0.98
reason_lower = "below 50% the power processing unit dissipates more than the thruster uses and the thermal design does not close"
reason_upper = "above 98% no flown power processing unit has been demonstrated"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 0.9
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "next"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (power) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That the power processing unit is 0.9 efficient; the value is declared, confirmed by A. Rai on 2026-09-01, and the sheet gives no further reason for it."
breaks_if = "A specification or test of the chosen power processing unit giving a different efficiency."
relation = "eta_ppu = 0.9"
source = "larson_wertz"
