# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "prop_delivered_thrust"
label = "Thrust actually delivered"
folder = "delivered_thrust"   # frozen at seed; renaming the label never moves the directory
subsystem = "prop"
parent = "l3_prop"
kind = "computed"
owner = "propulsion"
tier = "B"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
state = "published"

[question]
text = "How much thrust is produced once the power available is taken into account?"

[maths]
expression = "T = k*T"
source = "orbitt_case_c1"

[[assumption]]
text = "Thrust scales linearly with delivered power at fixed specific impulse"
fails_when = "a real thruster's efficiency falls away from its design point, so a deeply throttled system delivers less than this; the relation is optimistic below about half throttle"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "T_del"
type = "Force"
unit = "Millinewton"
lower = 0.0
upper = 1000.0
reason_lower = "thrust cannot be negative"
reason_upper = "above 1 N no air-breathing thruster in this band produces thrust"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "t"
var = "prop_thrust"
type = "Force"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "k"
var = "prop_throttle"
type = "Ratio"

[[algorithm.step]]
number = 1
text = "scale thrust with the throttle at fixed specific impulse"
binds = "d"
type = "Force"

[contributes]
kpis = ["kpi_thrust_margin"]

[view]
kind = "number"

