# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "prop_collected_flow"
label = "Collected mass flow"
folder = "prop_collected_flow"   # frozen at seed; renaming the label never moves the directory
subsystem = "prop"
parent = "l3_prop"
kind = "computed"
owner = "propulsion"
tier = "B"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 559
state = "published"

[question]
text = "How much mass per second reaches the thruster?"

[maths]
expression = "mdot = rho*V*A_in*eta_c"
source = "romano2021"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "mdot"
type = "MassFlow"
unit = "MgPerSecond"
lower = 0.0
upper = 10.0
reason_lower = "a mass flow cannot be negative"
reason_upper = "above 10 mg/s no intake in this band collects, at any mouth size the vehicle can carry"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "rho"
var = "env_mass_density"
type = "MassDensity"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "v"
var = "orbit_velocity"
type = "Velocity"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "a_in"
var = "prop_intake_area"
type = "Area"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "eta_c"
var = "prop_capture_efficiency"
type = "Ratio"

[[algorithm.step]]
number = 1
text = "multiply the incident flux by the mouth area and the collection efficiency"
binds = "md"
type = "MassFlow"

[view]
kind = "line"
over = "orbit_altitude"
points = 60

