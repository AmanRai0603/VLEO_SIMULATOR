# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "prop_incident_flux"
label = "Incident mass flux"
folder = "incident_flux"   # frozen at seed; renaming the label never moves the directory
subsystem = "prop"
parent = "prop_intake"
kind = "computed"
owner = "propulsion"
tier = "A"
state = "published"

[question]
text = "How much mass arrives on a square metre facing the flow each second?"
note = "The ceiling on everything downstream. At 200 km it is about 2 milligrams per square metre per second."

[maths]
expression = "phi = rho*V"
source = "romano2021"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "phi"
type = "MassFlux"
unit = "KgPerSecond"
lower = 0.0
upper = 1.0
reason_lower = "an incident flux cannot be negative"
reason_upper = "above 1 kg/m2/s the flow is continuum and the intake model does not apply"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "rho"
var = "env_mass_density"
type = "MassDensity"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "v"
var = "orbit_velocity"
type = "Velocity"

[[algorithm.step]]
number = 1
text = "multiply the free-stream density by the flight speed"
binds = "f"
type = "MassFlux"

[view]
kind = "number"

