# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "prop_delivered_bus_power"
label = "Propulsion power actually drawn"
folder = "prop_delivered_bus_power"   # frozen at seed; renaming the label never moves the directory
subsystem = "prop"
parent = "l3_prop"
kind = "computed"
owner = "propulsion"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 719
state = "published"

[question]
text = "How much power does the thruster actually take, after throttling?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How much power the thruster actually takes once it has been throttled back: the power it asks for, scaled by the throttle."
breaks = "It is the request scaled down and nothing more; how the thruster behaves at that lower power is not part of it. Above 100 kilowatts no bus in this mass class supplies it."
by = "an assistant, from what this sheet states — for its owner (propulsion) to confirm"

[maths]
expression = "P = k*P_prop"
source = "orbitt_case_c1"

[method]
text = """
# Transcribed from crates/vleo-mod-prop/nodes/prop_delivered_bus_power/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
return pp * k
"""
by = ""
transcribed_from = "crates/vleo-mod-prop/nodes/prop_delivered_bus_power/model.rs"
checked_by = ""

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "P_del"
type = "Power"
unit = "Watt"
lower = 0.0
upper = 100000.0
reason_lower = "power drawn cannot be negative"
reason_upper = "above 100 kW no bus in this mass class supplies it"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "pp"
var = "prop_bus_power"
type = "Power"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "k"
var = "prop_throttle"
type = "Ratio"

[[algorithm.step]]
number = 1
text = "scale the requested bus power by the throttle"
binds = "p"
type = "Power"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (propulsion) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "The relation as stated and cited to orbitt_case_c1, the requested bus power scaled by the throttle, not yet derived on the sheet."
breaks_if = "A derivation or comparison with orbitt_case_c1 that disagrees, or a thruster that draws something other than its request scaled by the throttle."
relation = "P = k*P_prop"
source = "orbitt_case_c1"
