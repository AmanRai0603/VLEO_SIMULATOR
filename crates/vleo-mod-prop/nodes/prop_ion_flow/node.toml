# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "prop_ion_flow"
label = "Ionised mass flow"
folder = "prop_ion_flow"   # frozen at seed; renaming the label never moves the directory
subsystem = "prop"
parent = "l3_prop"
kind = "computed"
owner = "propulsion"
tier = "B"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 561
state = "published"

[question]
text = "How much of the collected mass is actually accelerable?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How much of the collected air, in mass per second, is actually turned into ions the thruster can accelerate: the collected flow times the share of propellant that is used."
breaks = "The share used is a single figure. The ion flow can never exceed the collected flow it comes from."
by = "an assistant, from what this sheet states — for its owner (propulsion) to confirm"

[maths]
expression = "mdot_i = eta_u*mdot"
source = "romano2021"

[method]
text = """
# Transcribed from crates/vleo-mod-prop/nodes/prop_ion_flow/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
return ion_mass_flow(md, eta_u)
"""
by = ""
transcribed_from = "crates/vleo-mod-prop/nodes/prop_ion_flow/model.rs"
checked_by = "Aman Rai"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "mdot_i"
type = "MassFlow"
unit = "MgPerSecond"
lower = 0.0
upper = 10.0
reason_lower = "an ion mass flow cannot be negative"
reason_upper = "cannot exceed the collected flow it comes from"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "md"
var = "prop_collected_flow"
type = "MassFlow"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "eta_u"
var = "prop_utilisation"
type = "Ratio"

[[algorithm.step]]
number = 1
text = "apply the propellant utilisation efficiency"
binds = "mi"
type = "MassFlow"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (propulsion) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "The relation as stated and cited to romano2021, the propellant utilisation efficiency applied to the collected flow, not yet derived on the sheet."
breaks_if = "An ion flow above the collected flow, or a derivation or comparison with romano2021 that disagrees."
relation = "mdot_i = eta_u*mdot"
source = "romano2021"
