# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "prop_chamber_density"
label = "Collection chamber number density"
folder = "chamber_density"   # frozen at seed; renaming the label never moves the directory
subsystem = "prop"
parent = "prop_intake"
kind = "computed"
owner = "propulsion"
tier = "B"
state = "published"

[question]
text = "How dense is the gas the thruster is asked to ionise?"
note = "This is the number that decides whether a plasma can be struck at all, and it is why compression matters even though it does not appear in the capture efficiency."

[maths]
expression = "n_c = CR*n"
source = "romano2021"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "n_c"
type = "NumberDensity"
unit = "PerCubicMetre"
lower = 1000000000000.0
upper = 1e+22
reason_lower = "below 1e12 per cubic metre no inductively coupled source will strike a discharge"
reason_upper = "above 1e22 the gas is at atmospheric pressure, which no intake in this band can produce"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "n"
var = "env_number_density"
type = "NumberDensity"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "cr"
var = "prop_compression_ratio"
type = "Ratio"

[[algorithm.step]]
number = 1
text = "scale the free-stream number density by the compression ratio"
binds = "nc"
type = "NumberDensity"

[view]
kind = "number"

