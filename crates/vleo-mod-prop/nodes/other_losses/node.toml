# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "prop_other_losses"
label = "Other thruster losses"
folder = "other_losses"   # frozen at seed; renaming the label never moves the directory
subsystem = "prop"
parent = "sys_keep_orbit"
kind = "declared"
owner = "propulsion"
tier = "A"
layer = 2   # 1 management · 2 the system · 3 subsystem · 4 the run
state = "published"

[question]
text = "What fraction of the thruster's input power goes to losses other than ionisation and the beam?"

[maths]
expression = "L_other = 0.15"
source = "romano2021"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "L_other"
type = "Ratio"
unit = "One"
lower = 0.0
upper = 0.6
reason_lower = "a loss fraction cannot be negative"
reason_upper = "above 0.6 the thruster is a heater with a beam attached"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 0.15
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

