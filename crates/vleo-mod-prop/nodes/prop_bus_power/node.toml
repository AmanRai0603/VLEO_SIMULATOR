# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "prop_bus_power"
label = "Propulsion demand on the bus"
folder = "prop_bus_power"   # frozen at seed; renaming the label never moves the directory
subsystem = "prop"
parent = "l3_prop"
kind = "computed"
owner = "propulsion"
tier = "B"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 567
state = "published"

[question]
text = "How much power does the propulsion system take from the bus?"
note = "The largest single load on the bus, and the reason the power chapter is where an air-breathing design usually fails."

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How much power the propulsion system takes from the spacecraft's electrical supply: what the thruster itself draws, raised by the losses in the power processing unit that feeds it. It is the largest single load, and the reason power is where an air-breathing design usually fails."
breaks = "The only loss it adds is the power processing unit's, taken as one efficiency figure. Above 100 kilowatts no bus in this mass class supplies it."
by = "an assistant, from what this sheet states — for its owner (propulsion) to confirm"

[maths]
expression = "P_prop = P_in/eta_ppu"
source = "larson_wertz"

[method]
text = """
# Transcribed from crates/vleo-mod-prop/nodes/prop_bus_power/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
return bus_power_demand(pin, eta)
"""
by = ""
transcribed_from = "crates/vleo-mod-prop/nodes/prop_bus_power/model.rs"
checked_by = "Aman Rai"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "P_prop"
type = "Power"
unit = "Watt"
lower = 0.0
upper = 100000.0
reason_lower = "bus demand cannot be negative"
reason_upper = "above 100 kW no bus in this mass class supplies it"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "pin"
var = "prop_input_power"
type = "Power"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "eta"
var = "prop_ppu_efficiency"
type = "Ratio"

[[algorithm.step]]
number = 1
text = "divide by the power processing unit efficiency"
binds = "p"
type = "Power"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (propulsion) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "The relation as stated and cited to larson_wertz, the thruster's input power divided by the power processing unit efficiency, not yet derived on the sheet."
breaks_if = "A derivation or comparison with larson_wertz that disagrees, a power processing unit whose loss is not a fixed fraction, or a demand above 100 kilowatts."
relation = "P_prop = P_in/eta_ppu"
source = "larson_wertz"
