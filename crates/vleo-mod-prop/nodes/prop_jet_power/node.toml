# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "prop_jet_power"
label = "Jet power"
folder = "prop_jet_power"   # frozen at seed; renaming the label never moves the directory
subsystem = "prop"
parent = "l3_prop"
kind = "computed"
owner = "propulsion"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 564
state = "published"

[question]
text = "How much power ends up in the beam?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How much power ends up in the beam as motion, worked out from the thrust and the flow of ions."
breaks = "It has no answer when the ion flow is zero, and refuses rather than give one. Above 100 kilowatts no bus in this mass class supplies it."
by = "an assistant, from what this sheet states — for its owner (propulsion) to confirm"

[maths]
expression = "P_jet = T^2/(2*mdot_i)"
source = "romano2021"

[method]
text = """
# Transcribed from crates/vleo-mod-prop/nodes/prop_jet_power/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
if mi <= 0 [kg/s] then
  refuse "no ion flow, so jet power is undefined rather than infinite"
end
return jet_power(t, mi)
"""
by = ""
transcribed_from = "crates/vleo-mod-prop/nodes/prop_jet_power/model.rs"
checked_by = "Aman Rai"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "P_jet"
type = "Power"
unit = "Watt"
lower = 0.0
upper = 100000.0
reason_lower = "jet power cannot be negative"
reason_upper = "above 100 kW no bus in this mass class supplies it"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "t"
var = "prop_thrust"
type = "Force"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "mi"
var = "prop_ion_flow"
type = "MassFlow"

[[algorithm.step]]
number = 1
text = "form the kinetic power of the beam from thrust and ion flow; refuse when the flow is zero"
binds = "p"
type = "Power"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (propulsion) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "The relation as stated and cited to romano2021, the beam's kinetic power formed from thrust and ion flow, not yet derived on the sheet."
breaks_if = "A derivation or comparison with romano2021 that disagrees, or a jet power above 100 kilowatts."
relation = "P_jet = T^2/(2*mdot_i)"
source = "romano2021"
