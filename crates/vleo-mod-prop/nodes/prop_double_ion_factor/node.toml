# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "prop_double_ion_factor"
label = "Doubly-charged ion correction"
folder = "prop_double_ion_factor"   # frozen at seed; renaming the label never moves the directory
subsystem = "prop"
parent = "l3_prop"
kind = "declared"
owner = "propulsion"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 552
state = "published"

[question]
text = "How much thrust is lost to doubly-charged ions carrying charge without proportional mass?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How much thrust survives some ions carrying two charges instead of one, which carry charge without the matching mass: 97 per cent, so three per cent is lost."
breaks = "It assumes most ions carry a single charge. Below 0.8 the gas is dominated by ions with several charges and the single-charge picture behind this correction no longer applies; a factor of one would mean no doubly charged ions, which no real source achieves."
by = "an assistant, from what this sheet states — for its owner (propulsion) to confirm"

[maths]
expression = "alpha_pp = 0.97"
source = "romano2021"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "alpha_pp"
type = "Ratio"
unit = "One"
lower = 0.8
upper = 1.0
reason_lower = "below 0.8 the plasma is dominated by multiply-charged species and the single-charge model does not apply"
reason_upper = "unity means no doubly-charged ions at all, which no real source achieves"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 0.97
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (propulsion) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That a correction of 0.97 (a fraction) is right for this thruster; the value is declared, confirmed by A. Rai on 2026-09-01, and the sheet gives no further reason for it."
breaks_if = "A measured share of doubly charged ions in this source that gives a different correction, or one large enough to push it below 0.8."
relation = "alpha_pp = 0.97"
source = "romano2021"
