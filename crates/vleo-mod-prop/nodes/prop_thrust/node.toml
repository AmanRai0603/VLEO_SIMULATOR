# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "prop_thrust"
label = "Thrust"
folder = "prop_thrust"   # frozen at seed; renaming the label never moves the directory
subsystem = "prop"
parent = "l3_prop"
kind = "computed"
owner = "propulsion"
tier = "B"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 563
state = "published"

[question]
text = "How much thrust does the thruster produce from the air it is given?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How much thrust the thruster produces from the air it is given: the flow of ions times the speed they leave at, corrected for the beam spreading out and for ions carrying more than one charge. It is shown against altitude."
breaks = "It takes no account of how much power the spacecraft can actually supply. Above 1 newton no air-breathing thruster in this band produces thrust, at any intake size."
by = "an assistant, from what this sheet states — for its owner (propulsion) to confirm"

[maths]
expression = "T = mdot_i*v_e*alpha_div*alpha_pp"
source = "romano2021"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "T"
type = "Force"
unit = "Millinewton"
lower = 0.0
upper = 1000.0
reason_lower = "thrust cannot be negative"
reason_upper = "above 1 N no air-breathing thruster in this band produces thrust, at any intake size"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "mi"
var = "prop_ion_flow"
type = "MassFlow"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "ve"
var = "prop_exhaust_velocity"
type = "Velocity"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "ad"
var = "prop_div_efficiency"
type = "Ratio"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "ap"
var = "prop_double_ion_factor"
type = "Ratio"

[[algorithm.step]]
number = 1
text = "multiply the ion flow by the exhaust velocity and apply the divergence and multiple-charge corrections"
binds = "t"
type = "Force"

[contributes]
kpis = ["kpi_thrust_margin"]

[view]
kind = "line"
over = "orbit_altitude"
points = 60

[[version]]
n = 1
release = "next"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (propulsion) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "The relation as stated and cited to romano2021, ion flow times exhaust velocity with divergence and multiple-charge corrections, not yet derived on the sheet."
breaks_if = "A derivation or comparison with romano2021 that disagrees, or a thrust above 1 newton."
relation = "T = mdot_i*v_e*alpha_div*alpha_pp"
source = "romano2021"
