# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "prop_exhaust_velocity"
label = "Beam exhaust velocity"
folder = "prop_exhaust_velocity"   # frozen at seed; renaming the label never moves the directory
subsystem = "prop"
parent = "l3_prop"
kind = "computed"
owner = "propulsion"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 562
state = "published"

[question]
text = "How fast does the accelerated beam leave the thruster?"
note = "Air is lighter than xenon, so the same voltage buys a far higher exhaust velocity. It is the one respect in which air-breathing propulsion is easier rather than harder."

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How fast the accelerated beam leaves the thruster, for an ion of the local air's average mass, carrying a single charge, pushed through the beam voltage. Air is lighter than xenon, so the same voltage gives a far higher exhaust speed: the one respect in which breathing air is easier rather than harder."
breaks = "It takes every ion as singly charged and of the air's average mass, so a mixed beam is described by one average. Below 1 kilometre per second the concept has no advantage over a cold gas thruster; above 500 kilometres per second the relativistic and space-charge assumptions in the relation break down."
by = "an assistant, from what this sheet states — for its owner (propulsion) to confirm"

[maths]
expression = "v_e = sqrt(2*q*V_b/m_i)"
source = "romano2021"

[method]
text = """
# Transcribed from crates/vleo-mod-prop/nodes/prop_exhaust_velocity/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
return beam_exhaust_velocity(vb, m)
"""
by = ""
transcribed_from = "crates/vleo-mod-prop/nodes/prop_exhaust_velocity/model.rs"
checked_by = ""

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "v_e"
type = "Velocity"
unit = "MetrePerSecond"
lower = 1000.0
upper = 500000.0
reason_lower = "below 1 km/s the exhaust is slower than a cold gas thruster and the concept has no advantage"
reason_upper = "above 500 km/s the relativistic and space-charge assumptions in the relation break down"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "vb"
var = "prop_beam_voltage"
type = "Voltage"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "m"
var = "env_mean_molar_mass"
type = "MolarMass"

[[algorithm.step]]
number = 1
text = "accelerate a singly-charged ion of the local mean mass through the beam potential"
binds = "ve"
type = "Velocity"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (propulsion) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "The relation as stated and cited to romano2021, a singly charged ion of the local mean mass accelerated through the beam potential, not yet derived on the sheet."
breaks_if = "Ions that are not singly charged or not of the local mean mass, an exhaust speed above 500 kilometres per second, or a derivation or comparison with romano2021 that disagrees."
relation = "v_e = sqrt(2*q*V_b/m_i)"
source = "romano2021"
