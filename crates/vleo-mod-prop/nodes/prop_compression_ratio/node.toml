# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "prop_compression_ratio"
label = "Intake compression ratio"
folder = "prop_compression_ratio"   # frozen at seed; renaming the label never moves the directory
subsystem = "prop"
parent = "l3_prop"
kind = "computed"
owner = "propulsion"
tier = "B"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 558
state = "published"

[question]
text = "By how much does the intake concentrate the gas before it reaches the thruster?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How many times denser the gas in the intake's chamber is than the air outside, taken from the same balance of flow in against flow out that sets how much air is captured."
breaks = "The balance assumes the molecules do not collide with one another; above a compression of one hundred thousand the chamber gas becomes collisional and that no longer holds. A value below one would mean the intake dilutes the flow, which says the geometry is inverted."
by = "an assistant, from what this sheet states — for its owner (propulsion) to confirm"

[maths]
expression = "CR = 4*V*A_in*eta_geo/(v_bar*(A_out + beta*A_in))"
source = "romano2021"

[method]
text = """
# Transcribed from crates/vleo-mod-prop/nodes/prop_compression_ratio/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
return intake_compression_ratio(n, v, a_in, a_out, eta_geo, beta, t_c, m)
"""
by = ""
transcribed_from = "crates/vleo-mod-prop/nodes/prop_compression_ratio/model.rs"
checked_by = ""

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "CR"
type = "Ratio"
unit = "One"
lower = 1.0
upper = 100000.0
reason_lower = "an intake cannot dilute the flow; a compression ratio below one means the geometry is inverted"
reason_upper = "above 1e5 the chamber gas becomes collisional and the free-molecular balance no longer holds"

