# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "prop_beta_backflow"
label = "Duct back-flow transmission"
folder = "prop_beta_backflow"   # frozen at seed; renaming the label never moves the directory
subsystem = "prop"
parent = "l3_prop"
kind = "declared"
owner = "propulsion"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 548
state = "published"

[question]
text = "What fraction of thermal molecules in the chamber find their way back out of the mouth?"
note = "This single number is what an intake design is for. A long, narrow, honeycombed duct makes it small; that is the whole device."

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "The share of the slow, warmed-up gas in the collection chamber that escapes back out through the intake's mouth: 6 per cent. Keeping this small is the whole purpose of an intake; a long, narrow, honeycombed duct is how it is done."
breaks = "It is a single declared number standing in for the whole duct design. Below one in a thousand no duct that can be built traps gas that well, and above one half the duct traps nothing and the intake stops compressing the gas at all."
by = "an assistant, from what this sheet states — for its owner (propulsion) to confirm"

[maths]
expression = "beta = 0.06"
source = "romano2021"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "beta"
type = "Ratio"
unit = "One"
lower = 0.001
upper = 0.5
reason_lower = "below 0.001 no manufacturable duct is that good at trapping thermal molecules"
reason_upper = "above 0.5 the duct traps nothing and the compression ratio collapses to one"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 0.06
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "next"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (propulsion) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That 0.06 of the chamber's thermal molecules find their way back out of the mouth; the value is declared, confirmed by A. Rai on 2026-09-01, and the sheet gives no further reason for the number."
breaks_if = "A test or simulation of the actual duct showing a different back-flow fraction; the design depends on it more than on any other intake number."
relation = "beta = 0.06"
source = "romano2021"
