# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "env_local_temperature"
label = "Local kinetic temperature"
folder = "local_temperature"   # frozen at seed; renaming the label never moves the directory
subsystem = "env"
parent = "space_env"
kind = "computed"
owner = "environment"
tier = "A"
state = "published"

[question]
text = "What is the gas temperature at the flight altitude?"

[maths]
expression = "T(z) = T_inf - (T_inf - T_120)*exp(-s*(z - z_120))"
source = "jacchia1971"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "T"
type = "Temperature"
unit = "Kelvin"
lower = 200.0
upper = 2500.0
reason_lower = "below the 120 km base temperature the profile is not defined"
reason_upper = "cannot exceed the exospheric temperature it approaches"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "h"
var = "orbit_altitude"
type = "Length"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "t_inf"
var = "env_exospheric_temperature"
type = "Temperature"

[[algorithm.step]]
number = 1
text = "evaluate the Bates profile between the 120 km base and the exospheric limit"
binds = "t"
type = "Temperature"

[view]
kind = "number"

