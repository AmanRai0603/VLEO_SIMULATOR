# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "env_mean_molar_mass"
label = "Mean molar mass of the local gas"
folder = "mean_molar_mass"   # frozen at seed; renaming the label never moves the directory
subsystem = "env"
parent = "l3_x_envorbit"
kind = "computed"
owner = "environment"
tier = "B"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
state = "published"

[question]
text = "What is the mean molar mass of the air the vehicle is flying through?"
note = "Falls from 26 g/mol at 120 km to near 16 — pure atomic oxygen — by 350 km. Every free-molecular relation downstream reads it."

[maths]
expression = "M = rho*N_A/n"
source = "jacchia1971"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "M"
type = "MolarMass"
unit = "KgPerMol"
lower = 0.002
upper = 0.03
reason_lower = "below 2 g/mol the mixture would be pure hydrogen, which does not occur in this band"
reason_upper = "above 30 g/mol the mixture would be heavier than molecular nitrogen, which does not occur above the base"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "h"
var = "orbit_altitude"
type = "Length"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "t_inf"
var = "env_exospheric_temperature"
type = "Temperature"

[[algorithm.step]]
number = 1
text = "take the mass-weighted mean over the five species"
binds = "m"
type = "MolarMass"

[view]
kind = "number"

