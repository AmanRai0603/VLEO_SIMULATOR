# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "env_f107"
label = "Solar radio flux F10.7, daily"
folder = "f107"   # frozen at seed; renaming the label never moves the directory
subsystem = "env"
parent = "space_env"
kind = "declared"
owner = "environment"
tier = "A"
state = "published"

[question]
text = "How active is the Sun today, on the 10.7 cm radio flux index?"
note = "Shipped climatology stands in when no solar-drivers bundle is synced, and the run is marked amber."

[maths]
expression = "F107 = 150"
source = "noaa_swpc"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "F107"
type = "Ratio"
unit = "One"
lower = 60.0
upper = 400.0
reason_lower = "below 60 sfu has never been observed; the fit has no support there"
reason_upper = "above 400 sfu is beyond the largest recorded daily value, so the temperature relation is extrapolated"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 150.0
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

