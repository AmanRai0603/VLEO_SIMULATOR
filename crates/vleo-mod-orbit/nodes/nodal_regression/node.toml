# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "orbit_nodal_regression"
label = "Nodal regression rate"
folder = "nodal_regression"   # frozen at seed; renaming the label never moves the directory
subsystem = "orbit"
parent = "sys_orbit_env"
kind = "computed"
owner = "systems"
tier = "A"
layer = 2   # 1 management · 2 the system · 3 subsystem · 4 the run
state = "published"

[question]
text = "How fast does the orbit plane rotate under the second zonal harmonic?"

[maths]
expression = "dOmega/dt = -1.5*J2*sqrt(mu)*Re^2*cos(i)/((1-e^2)^2*a^(7/2))"
source = "vallado2013"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "dOmega"
type = "AngularRate"
unit = "DegreePerDay"
lower = -15.0
upper = 15.0
reason_lower = "a regression faster than 15 degrees per day does not occur in this altitude band"
reason_upper = "a regression faster than 15 degrees per day does not occur in this altitude band"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "r"
var = "orbit_radius"
type = "Length"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "e"
var = "orbit_eccentricity"
type = "Ratio"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "i"
var = "orbit_inclination"
type = "Angle"

[[algorithm.step]]
number = 1
text = "evaluate the secular J2 node rate"
binds = "d"
type = "AngularRate"

[view]
kind = "number"

