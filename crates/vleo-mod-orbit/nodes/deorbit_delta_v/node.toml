# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "orbit_deorbit_delta_v"
label = "Disposal delta-v"
folder = "deorbit_delta_v"   # frozen at seed; renaming the label never moves the directory
subsystem = "orbit"
parent = "sys_orbit_env"
kind = "computed"
owner = "systems"
tier = "A"
layer = 2   # 1 management · 2 the system · 3 subsystem · 4 the run
state = "published"

[question]
text = "What does the end-of-life disposal manoeuvre cost, as required by the debris mitigation standard?"
note = "Carried as a design variable rather than discovered at the end, because ISO 24113 makes it a requirement and not a courtesy."

[maths]
expression = "dv = |V_circ - V_transfer(r, a_t)|"
source = "iso24113"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "dv_dis"
type = "Velocity"
unit = "MetrePerSecond"
lower = 0.0
upper = 500.0
reason_lower = "a disposal manoeuvre cannot cost negative delta-v"
reason_upper = "above 500 m/s the disposal budget dominates the design and the altitude choice should be revisited"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "h"
var = "orbit_altitude"
type = "Length"

[[algorithm.step]]
number = 1
text = "lower perigee to a 60 km re-entry interface on a Hohmann transfer"
binds = "dv"
type = "Velocity"

[view]
kind = "number"

