# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "orbit_radius"
label = "Geocentric radius"
folder = "radius"   # frozen at seed; renaming the label never moves the directory
subsystem = "orbit"
parent = "sys_orbit_env"
kind = "computed"
owner = "systems"
tier = "A"
layer = 2   # 1 management · 2 the system · 3 subsystem · 4 the run
state = "published"

[question]
text = "How far is the spacecraft from the centre of the Earth?"

[maths]
expression = "r = R_earth + h"
source = "wgs84"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "r"
type = "Length"
unit = "Metre"
lower = 6400000.0
upper = 7000000.0
reason_lower = "below the Earth's mean radius is not an orbit"
reason_upper = "above 7000 km is outside the band this tool is scoped to"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "h"
var = "orbit_altitude"
type = "Length"

[[algorithm.step]]
number = 1
text = "add the WGS-84 equatorial radius to the altitude"
binds = "r"
type = "Length"

[view]
kind = "number"

