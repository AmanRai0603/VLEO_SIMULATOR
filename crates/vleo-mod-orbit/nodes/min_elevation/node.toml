# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "orbit_min_elevation"
label = "Minimum useful elevation angle"
folder = "min_elevation"   # frozen at seed; renaming the label never moves the directory
subsystem = "orbit"
parent = "l3_x_envorbit"
kind = "declared"
owner = "systems"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
state = "published"

[question]
text = "Below what elevation is a target or a ground station no longer usable?"

[maths]
expression = "eps = 10"
source = "larson_wertz"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "eps"
type = "Angle"
unit = "Degree"
lower = 0.0
upper = 90.0
reason_lower = "at the horizon the slant range is longest, the atmosphere is thickest and no useful link or image is obtained; zero is the limit, not a working value"
reason_upper = "90 degrees is the zenith, at which the access circle has no area"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 10.0
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

