# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "cost_inflation"
label = "Annual inflation rate"
folder = "inflation"   # frozen at seed; renaming the label never moves the directory
subsystem = "cost"
parent = "mgt_cost"
kind = "declared"
owner = "programme"
tier = "A"
state = "published"

[question]
text = "At what annual rate are the fitted cost relations escalated to the target year?"

[maths]
expression = "i_r = 0.03"
source = "nasa_cer"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "i_r"
type = "Ratio"
unit = "One"
lower = 0.0
upper = 0.15
reason_lower = "a negative rate is deflation, which the cost model has no basis for"
reason_upper = "above 15% a year the estimate is dominated by the escalation rather than the design"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 0.03
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

