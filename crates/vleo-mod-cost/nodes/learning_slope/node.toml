# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "cost_learning_slope"
label = "Production learning curve slope"
folder = "learning_slope"   # frozen at seed; renaming the label never moves the directory
subsystem = "cost"
parent = "sys_cost"
kind = "declared"
owner = "programme"
tier = "A"
layer = 2   # 1 management · 2 the system · 3 subsystem · 4 the run
state = "published"

[question]
text = "By what factor does unit cost fall with each doubling of cumulative production?"
note = "The term that decides whether forty satellites cost forty times one, and the term most concept estimates leave out."

[maths]
expression = "b_lc = 0.92"
source = "nasa_cer"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "b_lc"
type = "Ratio"
unit = "One"
lower = 0.7
upper = 1.0
reason_lower = "below 0.70 no space production programme has learned that fast"
reason_upper = "unity is no learning at all, the pessimistic limit"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 0.92
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

