# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "cost_per_year"
label = "Cost per operational year"
folder = "per_year"   # frozen at seed; renaming the label never moves the directory
subsystem = "cost"
parent = "sys_cost"
kind = "computed"
owner = "programme"
tier = "C"
layer = 2   # 1 management · 2 the system · 3 subsystem · 4 the run
state = "published"

[question]
text = "What does a year of service cost?"

[maths]
expression = "C = C_total/years"
source = "nasa_cer"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "C_yr"
type = "Money"
unit = "MillionUsDollar"
lower = 0.0
upper = 1000000.0
reason_lower = "a cost cannot be negative"
reason_upper = "above a trillion dollars a year the programme is not the one being designed"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "c"
var = "cost_programme"
type = "Money"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "y"
var = "orbit_mission_duration"
type = "Time"

[[algorithm.step]]
number = 1
text = "divide the programme cost by the mission duration in years"
binds = "cy"
type = "Money"

[contributes]
kpis = ["kpi_cost_per_year"]

[view]
kind = "number"

