# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "cost_replacement_avoided"
label = "Replacement cost avoided"
folder = "replacement_avoided"   # frozen at seed; renaming the label never moves the directory
subsystem = "cost"
parent = "l3_x_closure"
kind = "computed"
owner = "programme"
tier = "C"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
state = "published"

[question]
text = "What does air-breathing propulsion save by removing the need to replace satellites when propellant runs out?"
note = "The commercial argument for the whole programme, as a node with a source and evidence rather than a slide."

[maths]
expression = "C = (C_unit + C_launch)*N_replacements"
source = "orbitt_case_c1"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "C_avd"
type = "Money"
unit = "MillionUsDollar"
lower = 0.0
upper = 1000000.0
reason_lower = "a saving cannot be negative"
reason_upper = "above a trillion dollars the programme is not the one being designed"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "cb"
var = "cost_bus_recurring"
type = "Money"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "cp"
var = "cost_payload_recurring"
type = "Money"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "lc"
var = "cost_launch_per_satellite"
type = "Money"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "n"
var = "mis_satellites"
type = "Ratio"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "td"
var = "prop_thrust_to_drag"
type = "Ratio"

[[algorithm.step]]
number = 1
text = "count one avoided replacement of the whole constellation when thrust exceeds drag, and none when it does not"
binds = "c"
type = "Money"

[view]
kind = "number"

