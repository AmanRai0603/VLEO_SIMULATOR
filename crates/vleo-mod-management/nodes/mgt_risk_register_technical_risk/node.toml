# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "mgt_risk_register_technical_risk"
label = "Technical risk"
folder = "mgt_risk_register_technical_risk"   # frozen at seed; renaming the label never moves the directory
subsystem = "mgt"
parent = "mgt_risk_register"
kind = "declared"
owner = "programme"
tier = ""
layer = 1   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 70
state = "empty"

# SEEDED — the folder exists and nothing has been specified in it.
# Every field below is required before anything can be generated. An
# open field blocks generation, which is the mechanism: ambiguity
# becomes a blocking item on an engineer's screen rather than
# something an implementer resolves silently.

[question]
text = ""

[maths]
expression = ""
source = ""

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
# A unit is a decision, not data. None of these is filled yet.
symbol = ""
type = ""
unit = ""
lower = 0.0
upper = 0.0
reason_lower = ""
reason_upper = ""

[view]
kind = "number"


# The risks this row registers. A risk is moved only by node versions: see the
# de-risking tab on this row's page, and docs/DERISKING.md.

[[risk]]
id = "R-01"
title = "The design solar flux is set for the wrong part of the solar cycle"
level = "L4"
owner = "solar"
since = "2026-09-14"
why = "Drag, and with it propellant, lifetime and the thrust margin, scale with F10.7. A centre that does not follow the cycle sizes a mission on the declining half of cycle 25 for a sky 26 per cent brighter than the record says — carrying propellant it does not need — or leaves one flying into a stronger cycle short. The level is the owner's to confirm."
