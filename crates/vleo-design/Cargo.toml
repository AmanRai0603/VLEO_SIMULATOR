[package]
name = "vleo-design"
description = "The tool's database files. design.vleo — the design as one file. The tree the loader reads (every node folder, the layers, the cases and the source list) written into one SQLite database, and read back through the same interface the folders are read through, so the tool a team runs reads the file and a developer's checkout reads the folders, and the two give the same pages. And results.vleor — saved results, many in one file."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
vleo-sheet = { workspace = true }
# Every kind of file the tools write, and the one rule a reader takes one by.
vleo-kinds = { workspace = true }
# SQLite, compiled in (`bundled`): the same database engine the group
# applications run in the page, so a design file, a group's release and a
# Python reader all open one format. ADOPTION.lock records it and its fallback.
rusqlite = { workspace = true }

[dev-dependencies]
rusqlite = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
