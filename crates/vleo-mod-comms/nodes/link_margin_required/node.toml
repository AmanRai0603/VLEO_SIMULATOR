# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "com_link_margin_required"
label = "Required link margin"
folder = "link_margin_required"   # frozen at seed; renaming the label never moves the directory
subsystem = "com"
parent = "sys_command"
kind = "declared"
owner = "comms"
tier = "A"
layer = 2   # 1 management · 2 the system · 3 subsystem · 4 the run
state = "published"

[question]
text = "How much margin must the link carry above threshold, in decibels?"

[maths]
expression = "M_req = 3"
source = "ecss_e_st_50"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "M_req"
type = "Ratio"
unit = "One"
lower = 0.0
upper = 12.0
reason_lower = "a required margin cannot be negative"
reason_upper = "above 12 dB the link is being designed for an availability nobody asked for"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 3.0
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

