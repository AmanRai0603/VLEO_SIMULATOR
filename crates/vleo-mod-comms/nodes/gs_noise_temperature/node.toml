# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "com_gs_noise_temperature"
label = "Ground station antenna noise temperature"
folder = "gs_noise_temperature"   # frozen at seed; renaming the label never moves the directory
subsystem = "com"
parent = "comms"
kind = "declared"
owner = "comms"
tier = "A"
state = "published"

[question]
text = "How much noise does the ground antenna see?"

[maths]
expression = "T_a = 60"
source = "larson_wertz"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "T_a"
type = "Temperature"
unit = "Kelvin"
lower = 10.0
upper = 300.0
reason_lower = "below 10 K requires cryogenic cooling that no commercial station in this network has"
reason_upper = "above 300 K the antenna is looking at the ground"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 60.0
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

