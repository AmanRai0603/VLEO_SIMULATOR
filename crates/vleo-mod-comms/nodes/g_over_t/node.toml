# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "com_g_over_t"
label = "Ground station figure of merit"
folder = "g_over_t"   # frozen at seed; renaming the label never moves the directory
subsystem = "com"
parent = "sys_command"
kind = "computed"
owner = "comms"
tier = "A"
layer = 2   # 1 management · 2 the system · 3 subsystem · 4 the run
state = "published"

[question]
text = "What is the ground station's sensitivity, as gain over system noise temperature?"

[maths]
expression = "G/T = G_r - 10*log10(T_s)"
source = "larson_wertz"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "GT"
type = "Ratio"
unit = "Decibel"
lower = -30.0
upper = 60.0
reason_lower = "below -30 dB/K no ground station in this network performs that badly"
reason_upper = "above 60 dB/K is a deep-space station"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "g"
var = "com_gs_gain"
type = "Ratio"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "t"
var = "com_system_noise_temperature"
type = "Temperature"

[[algorithm.step]]
number = 1
text = "subtract the system noise temperature in decibels from the receive gain"
binds = "gt"
type = "Ratio"

[view]
kind = "number"

