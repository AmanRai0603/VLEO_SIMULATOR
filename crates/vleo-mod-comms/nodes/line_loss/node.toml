# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "com_line_loss"
label = "Transmit line loss"
folder = "line_loss"   # frozen at seed; renaming the label never moves the directory
subsystem = "com"
parent = "comms"
kind = "declared"
owner = "comms"
tier = "A"
state = "published"

[question]
text = "How much is lost between the transmitter and the antenna, in decibels?"

[maths]
expression = "L_line = 1.2"
source = "larson_wertz"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "L_line"
type = "Ratio"
unit = "One"
lower = 0.0
upper = 6.0
reason_lower = "a loss cannot be negative in decibels here"
reason_upper = "above 6 dB most of the transmitter output is heating the harness"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 1.2
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

