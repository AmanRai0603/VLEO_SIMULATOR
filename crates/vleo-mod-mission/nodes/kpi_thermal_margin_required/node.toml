# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "kpi_thermal_margin_required"
label = "Thermal margin — required"
folder = "kpi_thermal_margin_required"   # frozen at seed; renaming the label never moves the directory
subsystem = "kpi"
parent = "l3_x_closure"
kind = "declared"
owner = "systems"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
state = "published"

[question]
text = "What does the customer require for thermal margin?"

[maths]
expression = "R_req = 10"
source = "ecss_e_st_10_02"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "R_req"
type = "Temperature"
unit = "Kelvin"
lower = 0.0
upper = 100.0
reason_lower = "a negative required margin is not a requirement"
reason_upper = "above 100 K the requirement is not one this design is written against"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 10.0
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

