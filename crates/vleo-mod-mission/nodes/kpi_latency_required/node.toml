# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "kpi_latency_required"
label = "End to end latency — required"
folder = "kpi_latency_required"   # frozen at seed; renaming the label never moves the directory
subsystem = "kpi"
parent = "mgt_customer"
kind = "declared"
owner = "systems"
tier = "A"
state = "published"

[question]
text = "What does the customer require for end to end latency?"

[maths]
expression = "R_req = 30"
source = "orbitt_case_c1"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "R_req"
type = "Time"
unit = "Minute"
lower = 1.0
upper = 2880.0
reason_lower = "below a minute no ground segment in this design delivers"
reason_upper = "above two days the product is not the near-real-time one being sold"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 30.0
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

