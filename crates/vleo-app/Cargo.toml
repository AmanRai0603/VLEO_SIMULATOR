[package]
name = "vleo-app"
description = "FACE — the desktop app. The server, started in-process by a program a person double-clicks: no console window, opens the browser, one at a time, and ends by itself when no page is open."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "vleo-app"
path = "src/main.rs"

[dependencies]
vleo-server = { workspace = true }

[lints.rust]
unsafe_code = "forbid"

[build-dependencies]
embed-resource = "3"
