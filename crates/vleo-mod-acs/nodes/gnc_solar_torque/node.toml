# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "gnc_solar_torque"
label = "Solar radiation pressure torque"
folder = "gnc_solar_torque"   # frozen at seed; renaming the label never moves the directory
subsystem = "gnc"
parent = "l3_acs"
kind = "computed"
owner = "gnc"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 620
state = "published"

[question]
text = "How much torque does solar radiation pressure apply?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "The twisting force that the pressure of sunlight puts on the spacecraft, because the point where it pushes is offset from the centre of mass. It uses the frontal area, that offset, and the angle at which sunlight meets the solar array, with a reflectivity of 0.6."
breaks = "It takes the frontal area to stand for the sunlit area and fixes reflectivity at 0.6; a spacecraft whose sunlit face or surfaces differ feels a different torque. Above 1 newton metre no wheel that fits this vehicle can hold attitude."
by = "an assistant, from what this sheet states — for its owner (gnc) to confirm"

[maths]
expression = "T = (S/c)*A*(1+q)*cos(theta)*x_cp"
source = "larson_wertz"

[method]
text = """
# Transcribed from crates/vleo-mod-acs/nodes/gnc_solar_torque/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
# Constants the code held, written out here as it held them: 0.6.
return solar_pressure_torque(a, 0.6, x, th)
"""
by = ""
transcribed_from = "crates/vleo-mod-acs/nodes/gnc_solar_torque/model.rs"
checked_by = "Aman Rai"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "T_srp"
type = "Torque"
unit = "NewtonMetre"
lower = 0.0
upper = 1.0
reason_lower = "a torque magnitude cannot be negative"
reason_upper = "above 1 N.m no wheel that fits this vehicle can hold attitude"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "a"
var = "aero_frontal_area"
type = "Area"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "x"
var = "aero_cp_cm_offset"
type = "Length"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "th"
var = "pwr_array_incidence"
type = "Angle"

[[algorithm.step]]
number = 1
text = "apply solar radiation pressure over the illuminated area with a reflectivity of 0.6"
binds = "t"
type = "Torque"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (gnc) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "The relation as stated and cited from larson_wertz, not yet derived on the sheet, with a reflectivity of 0.6 and the frontal area taken as the illuminated area."
breaks_if = "A derivation or a comparison with larson_wertz that disagrees, surfaces whose reflectivity is not 0.6, an illuminated area unlike the frontal area, or a torque above 1 newton metre."
relation = "T = (S/c)*A*(1+q)*cos(theta)*x_cp"
source = "larson_wertz"
