# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "gnc_ground_pointing_error"
label = "Ground pointing error"
folder = "gnc_ground_pointing_error"   # frozen at seed; renaming the label never moves the directory
subsystem = "gnc"
parent = "l3_acs"
kind = "computed"
owner = "gnc"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 626
state = "published"

[question]
text = "How far off the ground does the pointing error put the aim point?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How far from its intended spot on the ground the payload actually aims, once the pointing error is carried along the slant range, the straight-line distance from the spacecraft to the ground point. It contributes to how accurately emitters on the ground can be located."
breaks = "It uses only the pointing error and the slant range; an error in where the spacecraft itself is, is not in it. Above 100 kilometres the pointing is not usable for any payload here, and the number stops describing a working design."
by = "an assistant, from what this sheet states — for its owner (gnc) to confirm"

[maths]
expression = "e = sigma*d"
source = "larson_wertz"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "e_gnd"
type = "Length"
unit = "Metre"
lower = 0.0
upper = 100000.0
reason_lower = "a ground error cannot be negative"
reason_upper = "above 100 km the pointing is not usable for any payload here"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "s"
var = "gnc_pointing_error"
type = "Angle"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "d"
var = "orbit_slant_range"
type = "Length"

[[algorithm.step]]
number = 1
text = "multiply the pointing error by the slant range"
binds = "e"
type = "Length"

[contributes]
kpis = ["kpi_geolocation"]

[view]
kind = "number"

[[version]]
n = 1
release = "next"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (gnc) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "The relation as stated and cited from larson_wertz, not yet derived on the sheet, fed with the pointing error and the slant range."
breaks_if = "A derivation or a comparison with larson_wertz that disagrees, or a ground error above 100 kilometres, where the pointing is not usable for any payload here."
relation = "e = sigma*d"
source = "larson_wertz"
