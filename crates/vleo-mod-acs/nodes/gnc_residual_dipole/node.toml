# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "gnc_residual_dipole"
label = "Residual magnetic dipole"
folder = "gnc_residual_dipole"   # frozen at seed; renaming the label never moves the directory
subsystem = "gnc"
parent = "l3_acs"
kind = "declared"
owner = "gnc"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 609
state = "published"

[question]
text = "How much uncompensated magnetic moment does the spacecraft carry?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How strongly the spacecraft behaves like a small magnet that nobody has cancelled out: 0.05 ampere square metres. That leftover magnetism pushes against the Earth's field and twists the spacecraft, so it is a disturbance the attitude control must carry."
breaks = "It is one declared number taken from a textbook reference, not measured on this vehicle. Above 5 ampere square metres the sheet says the magnetic disturbance would outweigh every other torque and the design could not be controlled."
by = "an assistant, from what this sheet states — for its owner (gnc) to confirm"

[maths]
expression = "m_res = 0.05"
source = "larson_wertz"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "m_res"
type = "DipoleMoment"
unit = "AmpereSquareMetre"
lower = 0.0
upper = 5.0
reason_lower = "a residual dipole magnitude cannot be negative"
reason_upper = "above 5 A.m2 the magnetic disturbance dominates every other torque and the design is uncontrollable"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 0.05
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "next"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (gnc) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That the declared 0.05 ampere square metres is right for this design, taken from the Larson and Wertz reference and confirmed by A. Rai on 2026-09-01."
breaks_if = "A magnetic cleanliness test or estimate of this vehicle giving a residual dipole different from 0.05 ampere square metres."
relation = "m_res = 0.05"
source = "larson_wertz"
