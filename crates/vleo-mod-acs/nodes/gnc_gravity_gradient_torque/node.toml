# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "gnc_gravity_gradient_torque"
label = "Gravity gradient torque"
folder = "gnc_gravity_gradient_torque"   # frozen at seed; renaming the label never moves the directory
subsystem = "gnc"
parent = "l3_acs"
kind = "computed"
owner = "gnc"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 619
state = "published"

[question]
text = "How much torque does the gravity gradient apply?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "The twisting force, or torque, that the difference in gravity's pull across the spacecraft applies to it, worked out with the spacecraft held 10 degrees off the local vertical. It depends on the size of the orbit and on how unevenly the spacecraft's mass is spread, and the attitude wheels must hold against it."
breaks = "It is taken at one attitude, 10 degrees off the local vertical; a spacecraft held at another angle feels a different torque. Above 1 newton metre the number no longer describes a design that works, because no wheel that fits this vehicle can hold attitude against it."
by = "an assistant, from what this sheet states — for its owner (gnc) to confirm"

[maths]
expression = "T = (3*mu/(2*r^3))*|Iz - Iy|*sin(2*theta)"
source = "larson_wertz"

[method]
text = """
# Transcribed from crates/vleo-mod-acs/nodes/gnc_gravity_gradient_torque/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
# "* 1 [unit]" gives a number this design states as a pure ratio the unit the kernel reads it in,
# and "/ 1 [unit]" the other way; the number itself does not change.
# Constants the code held, written out here as it held them: 10 [deg].
return gravity_gradient_torque(r, imax * 1 [kg.m^2], imin * 1 [kg.m^2], 10 [deg])
"""
by = ""
transcribed_from = "crates/vleo-mod-acs/nodes/gnc_gravity_gradient_torque/model.rs"
checked_by = ""

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "T_gg"
type = "Torque"
unit = "NewtonMetre"
lower = 0.0
upper = 1.0
reason_lower = "a torque magnitude cannot be negative"
reason_upper = "above 1 N.m no wheel that fits this vehicle can hold attitude"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "r"
var = "orbit_radius"
type = "Length"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "imax"
var = "gnc_inertia_max"
type = "Ratio"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "imin"
var = "gnc_inertia_min"
type = "Ratio"

[[algorithm.step]]
number = 1
text = "evaluate the gravity gradient torque at a 10 degree offset from local vertical"
binds = "t"
type = "Torque"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (gnc) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "The gravity-gradient relation as stated and cited from larson_wertz, not yet derived on the sheet, evaluated at a 10 degree offset from local vertical."
breaks_if = "A derivation or a comparison with larson_wertz that disagrees, an attitude held at a different offset from local vertical, or a torque above 1 newton metre."
relation = "T = (3*mu/(2*r^3))*|Iz - Iy|*sin(2*theta)"
source = "larson_wertz"
