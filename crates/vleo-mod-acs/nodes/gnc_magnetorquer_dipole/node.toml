# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "gnc_magnetorquer_dipole"
label = "Magnetorquer dipole required"
folder = "gnc_magnetorquer_dipole"   # frozen at seed; renaming the label never moves the directory
subsystem = "gnc"
parent = "l3_acs"
kind = "computed"
owner = "gnc"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 624
state = "published"

[question]
text = "How strong must the torque rods be to dump that momentum?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How strong the torque rods must be: the electromagnets that, pushing against Earth's magnetic field, empty the momentum the wheels have stored. It is sized on the stored momentum, the local field and the time available to dump it."
breaks = "It uses one value of the field and one dump interval; where the field is weaker or the time shorter, stronger rods are needed. Above 1000 ampere square metres no torque rod that fits this vehicle produces it."
by = "an assistant, from what this sheet states — for its owner (gnc) to confirm"

[maths]
expression = "m = h/(B*t_dump)"
source = "larson_wertz"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "m_req"
type = "DipoleMoment"
unit = "AmpereSquareMetre"
lower = 0.0
upper = 1000.0
reason_lower = "a dipole magnitude cannot be negative"
reason_upper = "above 1000 A.m2 no torque rod that fits this vehicle produces it"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "h"
var = "gnc_momentum_storage"
type = "AngularMomentum"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "b"
var = "env_magnetic_field"
type = "MagneticFluxDensity"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "td"
var = "gnc_dump_time"
type = "Time"

[[algorithm.step]]
number = 1
text = "divide the stored momentum by the field and the available dump interval"
binds = "m"
type = "DipoleMoment"

[view]
kind = "number"

[[version]]
n = 1
release = "next"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (gnc) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "The relation as stated and cited from larson_wertz, not yet derived on the sheet, fed with the stored momentum, the local field and the available dump interval."
breaks_if = "A derivation or a comparison with larson_wertz that disagrees, or a required dipole above 1000 ampere square metres, which no rod that fits this vehicle produces."
relation = "m = h/(B*t_dump)"
source = "larson_wertz"
