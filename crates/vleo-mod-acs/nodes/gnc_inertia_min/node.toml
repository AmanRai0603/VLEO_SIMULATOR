# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "gnc_inertia_min"
label = "Smallest principal moment of inertia"
folder = "gnc_inertia_min"   # frozen at seed; renaming the label never moves the directory
subsystem = "gnc"
parent = "l3_acs"
kind = "declared"
owner = "gnc"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 611
state = "published"

[question]
text = "What is the smallest principal moment of inertia?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How easy the spacecraft is to turn about the axis where it resists turning least. It is a number a person set for this design, and it sits beside the largest moment so the attitude control can be sized for both."
breaks = "It is a single declared number with no derivation on the sheet beyond its source. It cannot exceed the largest principal moment, and the sheet stores it as a plain number while its bounds are written in kilogram square metres."
by = "an assistant, from what this sheet states — for its owner (gnc) to confirm"

[maths]
expression = "I_min = 1.2"
source = "orbitt_case_c1"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "I_min"
type = "Ratio"
unit = "One"
lower = 0.01
upper = 1000.0
reason_lower = "below 0.01 kg.m2 there is no vehicle"
reason_upper = "cannot exceed the largest principal moment"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 1.2
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (gnc) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That the declared 1.2 (bounds written in kilogram square metres) is right for this design, as taken from its cited reference case and confirmed by A. Rai on 2026-09-01."
breaks_if = "A mass-properties estimate or measurement of this vehicle whose smallest principal moment differs from 1.2, or one that exceeds the largest moment."
relation = "I_min = 1.2"
source = "orbitt_case_c1"
