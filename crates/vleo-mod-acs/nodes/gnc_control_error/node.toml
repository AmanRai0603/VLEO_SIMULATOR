# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "gnc_control_error"
label = "Attitude control error"
folder = "gnc_control_error"   # frozen at seed; renaming the label never moves the directory
subsystem = "gnc"
parent = "l3_acs"
kind = "declared"
owner = "gnc"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 614
state = "published"

[question]
text = "How well does the controller hold the commanded attitude?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How closely the controller holds the spacecraft at the attitude it was commanded to: within 40 arcseconds, where an arcsecond is a 3600th of a degree. It is part of how accurately the payload can point."
breaks = "It is a declared figure, not the result of simulating the controller. Below 1 arcsecond no wheel-based controller holds that against the air's twisting force at these low altitudes; above two degrees it supports no pointing requirement in this design."
by = "an assistant, from what this sheet states — for its owner (gnc) to confirm"

[maths]
expression = "sig_ctl = 40"
source = "larson_wertz"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "sig_ctl"
type = "Angle"
unit = "Arcsecond"
lower = 1.0
upper = 7200.0
reason_lower = "below 1 arcsec no wheel-based controller holds that in the presence of VLEO aerodynamic torque"
reason_upper = "above two degrees the controller does not support any pointing requirement in this design"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 40.0
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "next"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (gnc) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That 40 arcseconds is this design's attitude control error, from the source the sheet cites (larson_wertz), confirmed by A. Rai on 2026-09-01."
breaks_if = "A control simulation or test with this design's wheels and the aerodynamic torque it meets showing a holding error other than 40 arcseconds."
relation = "sig_ctl = 40"
source = "larson_wertz"
