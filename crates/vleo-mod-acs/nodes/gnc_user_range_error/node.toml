# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "gnc_user_range_error"
label = "GNSS user range error"
folder = "gnc_user_range_error"   # frozen at seed; renaming the label never moves the directory
subsystem = "gnc"
parent = "l3_acs"
kind = "declared"
owner = "gnc"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 616
state = "published"

[question]
text = "How accurate is one pseudorange measurement?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How accurate one range measurement from the satellite navigation receiver to a navigation satellite is: 1.5 metres. It sets how well the spacecraft can work out its own orbit."
breaks = "It is one declared number from a textbook reference, not this receiver's measured performance. Below 5 centimetres would need carrier-phase processing that this receiver does not do on board; above 50 metres the receiver is no use for orbit determination."
by = "an assistant, from what this sheet states — for its owner (gnc) to confirm"

[maths]
expression = "URE = 1.5"
source = "larson_wertz"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "URE"
type = "Length"
unit = "Metre"
lower = 0.05
upper = 50.0
reason_lower = "below 5 cm requires carrier-phase processing that this receiver does not perform on board"
reason_upper = "above 50 m the receiver is not usable for orbit determination"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 1.5
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "next"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (gnc) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That the declared 1.5 metres is right for this design's receiver, taken from the Larson and Wertz reference and confirmed by A. Rai on 2026-09-01."
breaks_if = "A receiver specification or test giving a range error different from 1.5 metres, or a change to on-board carrier-phase processing."
relation = "URE = 1.5"
source = "larson_wertz"
