# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "gnc_alignment_error"
label = "Payload to sensor alignment error"
folder = "gnc_alignment_error"   # frozen at seed; renaming the label never moves the directory
subsystem = "gnc"
parent = "l3_acs"
kind = "declared"
owner = "gnc"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 613
state = "published"

[question]
text = "How well is the payload aligned to the attitude sensor after launch and thermal cycling?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How far the payload may be out of line with the attitude sensor once launch and repeated heating and cooling have had their effect: 30 arcseconds, where an arcsecond is a 3600th of a degree. The payload can only point as well as it is lined up with what measures its pointing."
breaks = "It is one declared figure, not a measurement of this build. Below 1 arcsecond no mechanical alignment survives launch and thermal cycling; above one degree the alignment supports no pointing requirement in this design."
by = "an assistant, from what this sheet states — for its owner (gnc) to confirm"

[maths]
expression = "sig_ali = 30"
source = "larson_wertz"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "sig_ali"
type = "Angle"
unit = "Arcsecond"
lower = 1.0
upper = 3600.0
reason_lower = "below 1 arcsec no mechanical alignment survives launch and thermal cycling"
reason_upper = "above one degree the alignment does not support any pointing requirement in this design"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 30.0
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "next"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (gnc) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That 30 arcseconds is this design's payload to sensor alignment error, from the source the sheet cites (larson_wertz), confirmed by A. Rai on 2026-09-01."
breaks_if = "Alignment measurements on this payload and sensor after launch and thermal testing that differ from 30 arcseconds."
relation = "sig_ali = 30"
source = "larson_wertz"
