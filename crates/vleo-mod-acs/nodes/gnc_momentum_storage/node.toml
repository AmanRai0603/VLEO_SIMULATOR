# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "gnc_momentum_storage"
label = "Momentum storage required"
folder = "gnc_momentum_storage"   # frozen at seed; renaming the label never moves the directory
subsystem = "gnc"
parent = "l3_acs"
kind = "computed"
owner = "gnc"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 623
state = "published"

[question]
text = "How much angular momentum must the wheels be able to store?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How much spin, or angular momentum, the wheels must be able to store so the spacecraft can hold its attitude against the steady disturbing torque. It is that torque built up over half an orbit, with a 50 per cent margin on top."
breaks = "It takes the steady part of the disturbance over half a revolution and a fixed 50 per cent margin, and nothing more; a disturbance that keeps building for longer is not in it. Above 100 newton metre seconds no wheel assembly that fits this vehicle stores it."
by = "an assistant, from what this sheet states — for its owner (gnc) to confirm"

[maths]
expression = "h = T*T_orb/2*(1 + margin)"
source = "larson_wertz"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "h_req"
type = "AngularMomentum"
unit = "NewtonMetreSecond"
lower = 0.0
upper = 100.0
reason_lower = "a momentum magnitude cannot be negative"
reason_upper = "above 100 N.m.s no wheel assembly that fits this vehicle stores it"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "t"
var = "gnc_total_disturbance"
type = "Torque"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "p"
var = "orbit_period"
type = "Time"

[[algorithm.step]]
number = 1
text = "accumulate the secular torque over half a revolution with a 50% margin"
binds = "h"
type = "AngularMomentum"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (gnc) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "The relation as stated and cited from larson_wertz, not yet derived on the sheet: the secular torque accumulated over half a revolution with a 50% margin."
breaks_if = "A derivation or a comparison with larson_wertz that disagrees, a disturbance that accumulates over more than half a revolution, or a requirement above 100 newton metre seconds."
relation = "h = T*T_orb/2*(1 + margin)"
source = "larson_wertz"
