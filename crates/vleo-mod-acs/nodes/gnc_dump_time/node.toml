# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "gnc_dump_time"
label = "Momentum dump interval"
folder = "gnc_dump_time"   # frozen at seed; renaming the label never moves the directory
subsystem = "gnc"
parent = "l3_acs"
kind = "declared"
owner = "gnc"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 618
state = "published"

[question]
text = "How long may the wheels accumulate momentum before it is dumped?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How long the reaction wheels may keep soaking up momentum before it is shed: 45 minutes. The shedding is done by magnetorquers, coils that act against Earth's magnetic field."
breaks = "It is a declared interval, not worked out from how fast the wheels fill. Under a minute the magnetorquers would be commanded faster than the field geometry changes; over a day the wheels saturate, with no room to absorb more, long before the dump."
by = "an assistant, from what this sheet states — for its owner (gnc) to confirm"

[maths]
expression = "t_dump = 45"
source = "larson_wertz"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "t_dump"
type = "Time"
unit = "Minute"
lower = 1.0
upper = 1440.0
reason_lower = "below a minute the magnetorquers are being commanded faster than the field geometry changes"
reason_upper = "above a day the wheels saturate long before the dump"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 45.0
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (gnc) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That 45 minutes is the momentum dump interval, from the source the sheet cites (larson_wertz), confirmed by A. Rai on 2026-09-01."
breaks_if = "The wheels saturating in less than 45 minutes under the disturbances this design meets."
relation = "t_dump = 45"
source = "larson_wertz"
