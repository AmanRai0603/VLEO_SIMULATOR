# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "gnc_nav_position_error"
label = "Navigation position error"
folder = "gnc_nav_position_error"   # frozen at seed; renaming the label never moves the directory
subsystem = "gnc"
parent = "l3_acs"
kind = "computed"
owner = "gnc"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 627
state = "published"

[question]
text = "How well does the spacecraft know where it is?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How well the spacecraft knows where it is. It takes the error in the ranges measured by the navigation receiver and scales it by the geometric dilution, a factor for how much the geometry of the measurement worsens that error. It contributes to how accurately emitters can be located."
breaks = "It rests on just two numbers, the range error and one geometry factor, so it is only as good as they are. Above 10 kilometres the navigation solution is not usable."
by = "an assistant, from what this sheet states — for its owner (gnc) to confirm"

[maths]
expression = "e = URE*GDOP"
source = "larson_wertz"

[method]
text = """
# Transcribed from crates/vleo-mod-acs/nodes/gnc_nav_position_error/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
return navigation_position_error(u, g)
"""
by = ""
transcribed_from = "crates/vleo-mod-acs/nodes/gnc_nav_position_error/model.rs"
checked_by = ""

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "e_nav"
type = "Length"
unit = "Metre"
lower = 0.0
upper = 10000.0
reason_lower = "a position error cannot be negative"
reason_upper = "above 10 km the navigation solution is not usable"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "u"
var = "gnc_user_range_error"
type = "Length"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "g"
var = "gnc_gdop"
type = "Ratio"

[[algorithm.step]]
number = 1
text = "multiply the user range error by the geometric dilution"
binds = "e"
type = "Length"

[contributes]
kpis = ["kpi_geolocation"]

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (gnc) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "The relation as stated and cited from larson_wertz, not yet derived on the sheet, fed with the user range error and the geometric dilution."
breaks_if = "A derivation or a comparison with larson_wertz that disagrees, or a position error above 10 kilometres, where the navigation solution is not usable."
relation = "e = URE*GDOP"
source = "larson_wertz"
