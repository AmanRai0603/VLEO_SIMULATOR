# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "gnc_pointing_error"
label = "Pointing error, three sigma"
folder = "gnc_pointing_error"   # frozen at seed; renaming the label never moves the directory
subsystem = "gnc"
parent = "l3_acs"
kind = "computed"
owner = "gnc"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 625
state = "published"

[question]
text = "How accurately does the payload point?"
note = "Root-sum-squared, unlike the disturbance torques above. These terms are genuinely independent, and summing them linearly would give a budget nothing could ever meet."

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How accurately the payload points, as a three-sigma figure, a bound the error stays within nearly all the time. It combines four independent sources, sensor noise, alignment error, control error and thermal distortion, the way independent errors combine rather than by adding them. It contributes to how accurately emitters can be located."
breaks = "The combination is right only while the four sources really are independent; any two that move together would make the true error larger than this figure. Above three degrees no payload in this design produces a usable product."
wrong = "That the pointing errors should be added straight up, as the disturbance torques are. They are genuinely independent, and adding them linearly would give a budget nothing could ever meet."
by = "an assistant, from what this sheet states — for its owner (gnc) to confirm"

[maths]
expression = "sigma = sqrt(sum of squares of the independent contributors)"
source = "larson_wertz"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "sig_pt"
type = "Angle"
unit = "Arcsecond"
lower = 0.0
upper = 10800.0
reason_lower = "a pointing error cannot be negative"
reason_upper = "above three degrees no payload in this design produces a usable product"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "sen"
var = "gnc_sensor_noise"
type = "Angle"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "ali"
var = "gnc_alignment_error"
type = "Angle"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "ctl"
var = "gnc_control_error"
type = "Angle"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "thm"
var = "gnc_thermal_distortion"
type = "Angle"

[[algorithm.step]]
number = 1
text = "root-sum-square the four independent contributors and scale to three sigma"
binds = "s"
type = "Angle"

[contributes]
kpis = ["kpi_geolocation"]

[view]
kind = "bar"
y = "gnc_pointing_error"

[[version]]
n = 1
release = "next"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (gnc) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "The four contributors are genuinely independent, as the sheet's note states, and the combination cited from larson_wertz holds; it is not yet derived on the sheet."
breaks_if = "Two of the contributors are found to move together, or a derivation or a comparison with larson_wertz disagrees."
relation = "sigma = sqrt(sum of squares of the independent contributors)"
source = "larson_wertz"
