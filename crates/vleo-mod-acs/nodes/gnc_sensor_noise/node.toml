# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "gnc_sensor_noise"
label = "Attitude sensor noise"
folder = "gnc_sensor_noise"   # frozen at seed; renaming the label never moves the directory
subsystem = "gnc"
parent = "l3_acs"
kind = "declared"
owner = "gnc"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 612
state = "published"

[question]
text = "How noisy is the attitude measurement?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How noisy the spacecraft's measurement of its own orientation is: 12 arcseconds, where an arcsecond is one three-thousand-six-hundredth of a degree. Pointing can be no better than the sensor that measures it."
breaks = "It is one declared number from a textbook reference, not a figure for a chosen sensor. Below half an arcsecond no star tracker in this class performs that well; above one degree the sensor supports no pointing requirement in this design."
by = "an assistant, from what this sheet states — for its owner (gnc) to confirm"

[maths]
expression = "sig_sen = 12"
source = "larson_wertz"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "sig_sen"
type = "Angle"
unit = "Arcsecond"
lower = 0.5
upper = 3600.0
reason_lower = "below 0.5 arcsec no star tracker in this class performs that well"
reason_upper = "above one degree the sensor does not support any pointing requirement in this design"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 12.0
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (gnc) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That the declared 12 arcseconds is right for this design's attitude sensor, taken from the Larson and Wertz reference and confirmed by A. Rai on 2026-09-01."
breaks_if = "A data sheet or test result for the selected attitude sensor giving noise different from 12 arcseconds."
relation = "sig_sen = 12"
source = "larson_wertz"
