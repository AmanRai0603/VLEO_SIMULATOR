# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "gnc_along_track_error"
label = "Along-track prediction error after one day"
folder = "gnc_along_track_error"   # frozen at seed; renaming the label never moves the directory
subsystem = "gnc"
parent = "l3_acs"
kind = "computed"
owner = "gnc"
tier = "B"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 628
state = "published"

[question]
text = "How far out is a one-day orbit prediction, given how wrong the density model is?"
note = "The term that dominates orbit prediction in this regime, and the reason the density uncertainty is a published output rather than a footnote."

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How far along its path the spacecraft's predicted position will be out after one day, because the model of the air density it flies through is uncertain. In this regime it is the error that dominates orbit prediction, which is why the density uncertainty is published as an answer in its own right."
breaks = "It carries one source of error only: the density uncertainty applied to the drag, carried over exactly one day. Above 10000 kilometres the number stops meaning a distance the spacecraft is out by; it means the model is unusable there."
wrong = "That the uncertainty in the density model is a detail for a footnote. In this regime it is the term that dominates orbit prediction, so it is published as an output."
by = "an assistant, from what this sheet states — for its owner (gnc) to confirm"

[maths]
expression = "e = 1.5*da*t^2"
source = "doornbos2011"

[method]
text = """
# Transcribed from crates/vleo-mod-acs/nodes/gnc_along_track_error/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
# Constants the code held, written out here as it held them: 1 [d].
return along_track_error_from_drag(a * s, 1 [d])
"""
by = ""
transcribed_from = "crates/vleo-mod-acs/nodes/gnc_along_track_error/model.rs"
checked_by = ""

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "e_at"
type = "Length"
unit = "Metre"
lower = 0.0
upper = 10000000.0
reason_lower = "an error magnitude cannot be negative"
reason_upper = "above 10000 km the prediction is meaningless and the answer is that the model is unusable there"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "a"
var = "aero_drag_acceleration"
type = "Acceleration"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "s"
var = "env_density_uncertainty"
type = "Ratio"

[[algorithm.step]]
number = 1
text = "propagate the drag acceleration error, which is the density uncertainty applied to the drag, over one day"
binds = "e"
type = "Length"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (gnc) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "The relation as stated and cited from doornbos2011, not yet derived on the sheet: the drag acceleration error, taken as the density uncertainty applied to the drag, propagated over one day."
breaks_if = "A derivation or a comparison with doornbos2011 that disagrees with the relation, or a one-day error above 10000 kilometres, where the sheet says the model is unusable."
relation = "e = 1.5*da*t^2"
source = "doornbos2011"
