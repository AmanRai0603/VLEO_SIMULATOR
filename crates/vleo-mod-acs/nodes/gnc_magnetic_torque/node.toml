# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "gnc_magnetic_torque"
label = "Residual dipole torque"
folder = "gnc_magnetic_torque"   # frozen at seed; renaming the label never moves the directory
subsystem = "gnc"
parent = "l3_acs"
kind = "computed"
owner = "gnc"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 621
state = "published"

[question]
text = "How much torque does the residual magnetic dipole produce in the geomagnetic field?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "The twisting force produced when the magnetism the spacecraft carries without meaning to, its residual dipole, meets Earth's magnetic field. It is taken in the worst-case orientation, and the attitude wheels must hold against it."
breaks = "It is a worst case, with the spacecraft's magnetism turned to give the largest torque in the local field; the torque at any moment can be smaller. Above 1 newton metre no wheel that fits this vehicle can hold attitude."
by = "an assistant, from what this sheet states — for its owner (gnc) to confirm"

[maths]
expression = "T = m_res x B"
source = "larson_wertz"

[method]
text = """
# Transcribed from crates/vleo-mod-acs/nodes/gnc_magnetic_torque/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
return magnetic_torque(m, b)
"""
by = ""
transcribed_from = "crates/vleo-mod-acs/nodes/gnc_magnetic_torque/model.rs"
checked_by = ""

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "T_mag"
type = "Torque"
unit = "NewtonMetre"
lower = 0.0
upper = 1.0
reason_lower = "a torque magnitude cannot be negative"
reason_upper = "above 1 N.m no wheel that fits this vehicle can hold attitude"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "m"
var = "gnc_residual_dipole"
type = "DipoleMoment"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "b"
var = "env_magnetic_field"
type = "MagneticFluxDensity"

[[algorithm.step]]
number = 1
text = "take the worst-case cross product of the residual dipole with the local field"
binds = "t"
type = "Torque"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (gnc) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "The relation as stated and cited from larson_wertz, not yet derived on the sheet, taken at its worst-case orientation of the residual dipole against the local field."
breaks_if = "A derivation or a comparison with larson_wertz that disagrees, or a torque above 1 newton metre."
relation = "T = m_res x B"
source = "larson_wertz"
