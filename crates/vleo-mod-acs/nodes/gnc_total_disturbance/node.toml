# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "gnc_total_disturbance"
label = "Total disturbance torque"
folder = "gnc_total_disturbance"   # frozen at seed; renaming the label never moves the directory
subsystem = "gnc"
parent = "l3_acs"
kind = "computed"
owner = "gnc"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 622
state = "published"

[question]
text = "What is the worst-case disturbance torque the control system has to answer?"
note = "Summed, not root-sum-squared. These are biases that can and do align, and a wheel sized on their RSS saturates the first time they do."

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "The worst twisting force the attitude control system has to answer: the torques from the air, from gravity, from sunlight and from the spacecraft's own magnetism, added together at full size. They are added because they are steady pushes that can and do line up."
breaks = "It is the worst case, all four lined up at once; at any given moment the total can be smaller. It holds only these four torques. Above 5 newton metres the vehicle is uncontrollable by any actuator that fits it."
wrong = "That these torques should be combined like independent errors, as the pointing errors are. They are biases that can and do align, and a wheel sized on that smaller combination runs out of capacity the first time they do."
by = "an assistant, from what this sheet states — for its owner (gnc) to confirm"

[maths]
expression = "T = |T_aero| + |T_gg| + |T_srp| + |T_mag|"
source = "larson_wertz"

[method]
text = """
# Transcribed from crates/vleo-mod-acs/nodes/gnc_total_disturbance/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
return total_disturbance_torque(ta, tg, ts, tm)
"""
by = ""
transcribed_from = "crates/vleo-mod-acs/nodes/gnc_total_disturbance/model.rs"
checked_by = "Aman Rai"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "T_dis"
type = "Torque"
unit = "NewtonMetre"
lower = 0.0
upper = 5.0
reason_lower = "a torque magnitude cannot be negative"
reason_upper = "above 5 N.m the vehicle is uncontrollable by any actuator that fits it"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "ta"
var = "aero_torque"
type = "Torque"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "tg"
var = "gnc_gravity_gradient_torque"
type = "Torque"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "ts"
var = "gnc_solar_torque"
type = "Torque"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "tm"
var = "gnc_magnetic_torque"
type = "Torque"

[[algorithm.step]]
number = 1
text = "sum the magnitudes rather than root-sum-squaring them"
binds = "t"
type = "Torque"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (gnc) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "The four torques are biases that can align, as the sheet's note states, so their sizes are summed; the sum as cited from larson_wertz is not yet derived on the sheet."
breaks_if = "A torque outside these four turns out to matter, a derivation or a comparison with larson_wertz disagrees, or the total exceeds 5 newton metres, beyond any actuator that fits the vehicle."
relation = "T = |T_aero| + |T_gg| + |T_srp| + |T_mag|"
source = "larson_wertz"
