# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "gnc_gdop"
label = "Geometric dilution of precision"
folder = "gnc_gdop"   # frozen at seed; renaming the label never moves the directory
subsystem = "gnc"
parent = "l3_acs"
kind = "declared"
owner = "gnc"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 617
state = "published"

[question]
text = "How much does the satellite geometry amplify ranging error into position error?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How much the geometry of the satellites being ranged to magnifies the error in each range measurement into an error in position: a factor of 2.5."
breaks = "It is one declared factor, not worked out from the geometry actually in view. It cannot be below one, and above 20 the geometry is degenerate, the satellites too poorly placed, and the position solution is not usable."
by = "an assistant, from what this sheet states — for its owner (gnc) to confirm"

[maths]
expression = "GDOP = 2.5"
source = "larson_wertz"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "GDOP"
type = "Ratio"
unit = "One"
lower = 1.0
upper = 20.0
reason_lower = "a dilution below one is not geometrically possible"
reason_upper = "above 20 the geometry is degenerate and the solution is not usable"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 2.5
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "next"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (gnc) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That 2.5 is the geometric dilution of precision for this design, from the source the sheet cites (larson_wertz), confirmed by A. Rai on 2026-09-01."
breaks_if = "A geometry for this orbit and receiver giving a dilution of precision other than 2.5."
relation = "GDOP = 2.5"
source = "larson_wertz"
