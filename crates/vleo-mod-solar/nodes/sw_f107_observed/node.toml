# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "sw_f107_observed"
label = "Observed F10.7, the forecast's anchor"
folder = "sw_f107_observed"   # frozen at seed
subsystem = "solar"
parent = "l3_solar"
kind = "declared"
owner = "environment"
tier = "A"
criticality = "minor"   # minor | significant — significant means two reviewers and a differential fill
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
order = 1342
state = "published"

# WHY THIS ROW EXISTS, AND IT IS A WIRING REASON RATHER THAN A PHYSICS ONE.
#
# `env_f107` was answering two questions at once: *what is the Sun doing now*,
# which is what this subsystem's forecast starts from, and *what flux is the
# design sized to*, which is what the density chain reads. While both were one
# declared 150 that was invisible. It stops being invisible the moment the
# design reads the study's answer instead of the constant, because then the
# subsystem's own input would be the subsystem's own output — a loop with no
# physical meaning, and the resolver refuses it as an undeclared cycle.
#
# So the observed flux moves to the row that should own it. §20 step 2 did
# exactly this in the other direction when the mission length was declared on
# `orbit_mission_duration` and had to move to layer 2.

[question]
text = "What is the 10.7 cm radio flux doing now, for the forecast to start from?"
note = """
This is the PERSISTENCE ANCHOR and nothing else. It is not the flux the design
is sized to — that is what the subsystem computes and publishes through
l3_solar_interface, and what env_f107 now carries into the density chain.

It is worth knowing how little rests on it. The estimator that reads it weights
it exp(-L / 27 d), which sw_central_expectation's own reading section puts at
0.00114 at the SHORTEST lead its declared range allows, and at the declared
five-year mission it is around 5e-30. Measured rather than argued: moving this
row across its whole declared range, 60 to 400 sfu, leaves
sw_central_expectation at 86.8497 to six figures.
"""

[maths]
# NOT A NEW CONFIRMATION AND NOT A NEW NUMBER. This is the same 150 that has
# been declared on env_f107 since 2026-09-01 and confirmed there by A. Rai. The
# value has moved to the row that should own it and has not changed.
confirmed_by = "A. Rai / 2026-09-01, carried unchanged from env_f107"
expression = "F107_obs = 150"
source = "noaa_swpc"

[theory]
why = """
A forecast needs a starting point, and for solar flux the starting point is
what the Sun is doing now. That is a measurement, not a derivation, so this row
declares it rather than computing it.

It is separate from the flux the design is built to because the two are
different questions with different answers. Today's flux is an observation with
a lifetime of about one solar rotation. The design flux is a statement about a
five-year window that has not happened yet, and this subsystem exists to
produce it.
"""
reading = """
It is a SINGLE DAY'S LEVEL, and a stand-in one. The shipped climatology's 150
sfu is a round number chosen as a design default, not a reading taken on a
date, and nothing here pretends otherwise — `source` names the publisher of the
index rather than an observation.

That matters less than it looks, and the note above says by how much: the one
estimator reading this row weights it into insignificance at every lead the
tree can ask about. A person replacing 150 with a real observation would change
sw_central_expectation in the thirtieth decimal place. The row is here so that
the subsystem's input and the subsystem's output are not the same variable, and
a real observation would make it honest rather than make it matter.
"""

[[assumption]]
text = "One number stands for the current state of the Sun"
fails_when = "the question is asked at a lead short enough for persistence to carry weight. At a lead of days the flux on the day matters, the 27-day decay has barely started, and a round 150 would be doing real work badly. The declared lead range of this tree starts well past that, which is why it does not."

[[assumption]]
text = "It is a daily value, not an 81-day mean"
fails_when = "it is read as F10.7A. The two are different quantities with different ranges and the thermosphere relation uses both, weighting the mean 3.24 and the daily departure 1.3. sw_f107a_ratio is the row that relates them."

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "F107_obs"
type = "Ratio"
unit = "One"
lower = 60.0
upper = 400.0
reason_lower = "the same floor env_f107 declared and for the same reason: below 60 sfu has never been observed and every relation reading F10.7 has no support there"
reason_upper = "the same ceiling env_f107 declared: above 400 sfu is beyond the largest recorded daily value, so anything reading it is extrapolating"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 150.0
# NOT A NEW CONFIRMATION. The same value and the same confirmation env_f107
# carried; whoever re-confirms the observed flux re-confirms it here from now on.
confirmed_by = "A. Rai / 2026-09-01, carried unchanged from env_f107"

[view]
kind = "number"
