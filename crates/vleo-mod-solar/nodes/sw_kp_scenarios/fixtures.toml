# Known-good values, and where each came from. An expected value may
# never be produced by the code under test.
#
# WHAT THESE CHECK.
#
# One input vector, ten fixtures, one per published member. Every Ap below is a
# BIN CENTRE of the two slot-bias tables, so each bias lookup is an exact table
# entry rather than an interpolation, and the published IAGA scale is the only
# thing interpolated. That makes every expected value two table reads and one
# addition — arithmetic a person can redo from the two sources without running
# this code, which is what an independent derivation has to mean when the
# relation is a composition of lookups.
#
# The ten expected values are DISTINCT, and the five inputs are distinct. So a
# scenario wired to the wrong Ap, or a slot wired to the wrong table, moves at
# least two of the ten. That is the failure this row can have that its
# constituents cannot: each of them reads one Ap and cannot mispair anything.
#
# WHAT THEY CANNOT CHECK is whether the two bias tables are right. Those are
# medians of the record, measured by sw_kp_mean_bias and sw_kp_slot_bias, and
# they are those rows' evidence to carry. Nor do they check the study's own
# numbers — that is parity.csv beside this file, where all ten agree to the four
# decimals the study printed.

[[fixture]]
label = "the primary: the worst slot of the worst day. ap 90 is a bin centre, so the peak offset 1.7469 is exact and only the scale is interpolated, between Kp 6 at ap 80 and Kp 19/3 at ap 94"
variable = "Kp_peak_hotday"
expect = 7.9850088183
tolerance = 1e-9
provenance = "independent-derivation"
source = "iaga_kp_ap"
inputs = { ap_nominal = 12.5, ap_hotmean = 25.0, ap_coldmean = 7.5, ap_hotday = 90.0, ap_coldday = 2.5 }

