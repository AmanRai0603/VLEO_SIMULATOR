# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "l3_solar_ach_03"
label = "Closure — Ap, survival"
folder = "l3_solar_ach_03"   # frozen at seed; renaming the label never moves the directory
subsystem = "solar"
parent = "l3_solar"
kind = "achieved"
owner = "environment"
tier = "A"
criticality = "minor"   # minor | significant — significant means two reviewers and a differential fill
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
order = 1337
state = "published"

# THE ACHIEVED SIDE ONLY. Its paired requirement row, l3_solar_req_03, is
# still seeded and cannot be written here: layers/l3_solar.toml says a required
# row in this group states THE WORST SKY THIS DESIGN CAN SUSTAIN, which is a
# spacecraft capability and not something the solar record knows. That number is
# a declared value somebody confirms, and an agent may not supply one.
#
# So the closure this pair exists to make does not close yet. What exists is the
# environmental half, on a row, with its provenance — which is the half this
# subsystem owes.

# THE PAIR WITH ach_05, AND WHY BOTH EXIST. Two rows here answer what looks
# like one question -- the worst daily Ap the mission meets -- and they
# disagree by a factor of 1.75, 158.4 against 90.5. They are not rivals and
# neither is wrong. This one is a RETURN LEVEL: fit the record's daily Ap
# tail, ask what recurs once in five years, and get 158.4 regardless of which
# solar scenario the mission actually flies. ach_05 is a SCENARIO value: take
# the hot sustained level the driver set carries, add the within-rotation
# daily spread measured AT that level, and get 90.5 for that scenario's worst
# day. One is the tail of the whole record, the other is one column of the
# driver product. A design needs both, and the gap between them is the cost of
# designing to a scenario rather than to the record.

# WHY THIS ROW STOPPED BEING A RESTATEMENT.
#
# It used to read one input and return it unchanged: its whole body was
# `let ach = conclusion;`. Measured against the row beneath it, it produced the
# same number under every perturbation -- it WAS that row, under a second name,
# and a tree with two names for one number is a tree nobody can read.
#
# Worse, the closure it was supposed to be half of did not exist. Nothing read
# the requirement at all. l3_solar_req_03's own sheet says so in as many words:
# "Nothing in the tree compares 158.4 against 132 automatically; the three
# exceedance rows measure it and a person reads them." A design tool that
# cannot close its own requirement is not closing anything.
#
# So it now reads BOTH sides and publishes what neither of them holds: the
# signed fractional margin, in the sense the requirement declares. Positive is
# room, negative is a violation and its size. That is a third number, it is the
# one a designer actually acts on, and it moves when either side moves.
#
# The shape is the twelve KPI closures' -- mission::closure(req, ach, sense) --
# because a second way of computing a margin is a second way of getting its
# sign wrong.

[question]
text = "How much room does the Ap survival requirement have left?"
note = "The geomagnetic driver on the achieved side: the storm that recurs once per mission lifetime. Unlike the F10.7 pair this has no confidence attached, because geomagnetic activity has no usable long-term forecast and the study designs to a return period instead."

[maths]
# An achieved row restates the subsystem's conclusion on the side of the
# comparison the closure reads. It computes nothing of its own.
expression = "M_ap_survive = closure(Ap_req_survive, Ap_T, AtMost).margin"
source = "noaa_swpc"

# WHERE THIS RELATION CAME FROM. Prose, outside the sheet hash: correcting a
# sentence here does not invalidate a generated artefact. The tab before this one
# states the relation; this says why it is that relation, and the tab after it
# shows what the machine made of it.
[theory]
why = """
This is the achieved side of the closure that fails, and the reason it fails
is visible in how it is built rather than in any arithmetic. The F10.7 pair
compares a design value against a requirement and both are constructed the
same way, so they agree. The Ap pair compares what the RECORD expects
against what the VEHICLE is built for, and those are independent quantities
with no reason to agree — so the closure is a real test rather than a
consistency check, and it is the one that fails.
"""
reading = """
It has no confidence attached, unlike the F10.7 pair, and the absence is a
statement rather than an omission: geomagnetic activity has no usable
long-term forecast, so the study designs to a return period instead of to a
percentile. The number therefore means 'the storm expected once in a mission
of this length', and its top end rests on two observations in 28.2 years. A
margin computed against it carries none of that.
"""

[[theory.step]]
text = """
The achieved side restates the subsystem's geomagnetic conclusion, which is
sw_storm_return_level read at the declared mission length.
"""
math = "Ap_ach = Ap_T(5 yr) = 158.38"

[[theory.step]]
text = """
Set against the requirement the closure holds, and WHERE it sits is the finding.
158.38 is above the 132 the vehicle operates through and below the 207 it must
not be destroyed by, so the mission meets a storm it cannot work through and
survives it.
"""
math = "132 < 158.38 <= 207 — survived, not operated through"

[[theory.step]]
text = """
The two sides come from unrelated places, and that is what makes this closure
worth having. The requirement is a published threshold on the G scale; the
achieved value is a tail quantile of a 28-year record. Nothing ties them, so
there is no reason for them to agree — and when they do, the agreement means
something. This pair was 150 against 158.38 and FAILED until 2026-09-16, when
the requirement was re-anchored at the G4 threshold as a survival commitment
rather than as the operating capability plus 14 per cent.
"""

[[theory.step]]
text = """
All five requirements in this group are now anchored on something a reader can
check — two on the record's own extremes, three on published G thresholds — so
none of the five closures can pass merely because its number was picked above
whatever the chain happened to give. That was true of exactly one of them
before, and l3_solar_req_01 spent two revisions drifting from 9.6 per cent of
headroom to 140 before it was re-anchored.
"""

[[theory.step]]
text = """
And what the closure holding does NOT say is that the storm case is closed. The
mission is still outside its OPERATING environment for 1.42 days over five
years, in about 1.24 events of roughly one day each. Nothing in the tree
compares 158.38 against 132 automatically; the three exceedance rows measure it
and a person reads them.
"""


[[assumption]]
text = "It inherits every limitation of the row it restates, and a closure reading it sees none of them"
fails_when = "the same cost as the interface, and worth repeating on the row a closure actually binds. The number is sized on the cycle analogue at the mission's own epoch rather than on the record's unconditional mean, which this chain now reads the epoch to do — it was an open decision on sw_central_expectation and it has been made, moving this row by 28.0 sfu; where it is a percentile it is the 95th and not a worst case; and where it is a return level its top end rests on two observations in 28.2 years. A margin computed from this row against a capability carries none of that, and will look like a clean number either way."

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "M_ap_survive"
type = "Ratio"
unit = "One"
lower = -10.0
upper = 1.0
reason_lower = "a margin of -10 is a requirement exceeded by eleven times its own value. Below that the comparison has stopped being a design margin and become a sign that one side is in the wrong unit, and it should refuse rather than report a number nobody will read as a fraction"
reason_upper = "1 is the whole of the requirement: an achieved value of zero against a positive bound. A margin above 1 under this sense would mean the achieved value is negative, which none of these drivers can be"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "ach"
var = "sw_storm_return_level"
type = "Ratio"

[[input]]
# The requirement this closes against. `req` is not decoration: the gate reads
# this binding to decide the row IS a closure, and check 7e then requires the
# hole to apply the sense the requirement declares.
binding = "req"
var = "l3_solar_req_03"
type = "Ratio"

[[algorithm.step]]
number = 1
text = "compare achieved against required in the declared sense and return the signed fractional margin"
binds = "m"
type = "Ratio"

[view]
kind = "line"
over = "orbit_mission_duration"
points = 60
