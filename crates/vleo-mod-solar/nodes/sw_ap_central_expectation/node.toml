# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "sw_ap_central_expectation"
label = "Expected Ap over the mission window"
folder = "sw_ap_central_expectation"   # frozen at seed
subsystem = "solar"
parent = "l3_solar"
kind = "declared"
owner = "environment"
tier = "A"
criticality = "minor"   # minor | significant — significant means two reviewers and a differential fill
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
order = 1349
state = "published"

# The prior implementation, named so the parity grid beside this node has
# something to be the parity of.
migrated_from = "prf_density.m:215 (01_kernel/sw_study/06_density, local function designWindow_, B.fc27.pred(end))"
parity_tolerance = 0.01

[question]
text = "What daily planetary Ap should the mission window be expected to sit at?"
note = """
Every other Ap row in this subsystem answers an EXTREME — what recurs once
per mission, what G level to survive, how often a threshold is crossed. None of
them says what the window sits at on an ordinary day, and a band needs a centre
before it can have edges.
"""

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "The ordinary level of geomagnetic disturbance the mission window is expected to sit at, measured on the daily index of how unsettled Earth's magnetic field is. Every other row of this kind gives an extreme; this one gives the centre that the design bands are built around, about 22.1."
breaks = "It is simply the last forecast before the record ends, held flat across the whole window. It carries no trend with the solar cycle, so a window opening next month and one opening years out get the same number, and it is an average over about 27 days, not the level of any one day."
wrong = "It is easy to read this as the level of a typical day. It is the mean of a 27-day stretch, so by construction about half the days in the window sit above it."
by = "an assistant, from what this sheet states — for its owner (environment) to confirm"

[maths]
# A person has read this relation against its source.
confirmed_by = "A. Rai / 2026-09-16"
expression = "Ap_central = the last rotation forecast, held forward = 22.0954"
source = "noaa_swpc"

[theory]
why = """
The window this tool designs for opens after the record ends, so there is no
observation of it and no forecast reaching it. What the study does, and what is
done here, is to hold the LAST rotation forecast forward: the pattern's estimate
of the level the sun is at when the record stops, carried across the window
unchanged.

That is a weak statement and it is meant to be. It says the mission will sit
where the sun was last seen sitting, and its whole uncertainty is
sw_ap_mean_band_spread. It does not decline with the cycle, it does not rise
into the next maximum, and a window opening five years out gets the same centre
as one opening next month.
"""
reading = """
22.0954, against a record whose daily Ap runs from 0 to over 200. The study's own
nominal scenario for its window is 22.0925 — 0.013 per cent away, from a
derivation that shares no code with it.
"""

[[theory.step]]
text = "Cut the record into 27-day rotations and predict each from the ones before it, by the method sw_ap_mean_band_spread describes."
math = "pred(b) from rotations 1..b-1"

[[theory.step]]
text = "Take the last such prediction and hold it forward across the window."
math = "Ap_central = pred(last) = 22.0954"

[[assumption]]
text = "The level the sun was last at is the level it will be at"
fails_when = "the window is long or far out. This carries no cycle trend at all: the same number is published for a window opening next month and one opening in 2032, and over a 365-day window the sun demonstrably moves"

[[assumption]]
text = "A rotation-mean level stands in for a daily level"
fails_when = "a design reads it as a day. It is the mean of 27 days; half the days in the window are above it by construction, which is what sw_ap_daily_band_spread exists to say"

[[assumption]]
text = "The phase past the cycle table is an extrapolation"
fails_when = "it is read as measured. The last rotations sit past cycle 25's tabulated end and their phase wraps on the mean length of three cycles, one of which is incomplete"

[output]
symbol = "Ap_central"
type = "Ratio"
unit = "One"
lower = 1.0
upper = 40.0
reason_lower = "below 1 the level is beneath anything the record holds over a rotation: the quietest of 381 rotations in bundles/solar-weather@2026.09.14 has a mean Ap of 1.48. The bound WAS 0, carrying a reason about DAILY Ap — a single quiet day really is Ap 0 — which is the wrong quantity for this row. A rotation mean of 0 needs 27 consecutive Ap-0 days and the record has never held two"
reason_upper = "above 40 the value exceeds anything the record supports for this quantity, so it is an arithmetic error rather than an active sun. This row is a rotation-scale level, and the largest rotation mean of Ap in the 381 rotations of bundles/solar-weather@2026.09.14 is 36.96; the bound WAS 80, which is more than twice a level the sun has never reached over a rotation"

[value]
number = 22.095389
# NOT A CONFIRMATION. Derived on 2026-09-16 from
# bundles/solar-weather@2026.09.14 by the method above and cross-checked
# against the prior implementation in parity.csv beside this sheet. Nobody
# has yet read the number and agreed it, which is what this field is for.
# 22.095389 — the last rotation forecast held forward, 0.013 per cent from the study's own nominal.
confirmed_by = "A. Rai / 2026-09-16"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (environment) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That the level the Sun was last seen at is the level it will stay at across the window, the last rotation forecast of 22.095389 held forward, which A. Rai confirmed on 2026-09-16."
breaks_if = "The window is long or opens far in the future, so the Sun has moved along its cycle, or the extrapolated phase past the end of the cycle table turns out to be wrong."
relation = "Ap_central = the last rotation forecast, held forward = 22.0954"
source = "noaa_swpc"
