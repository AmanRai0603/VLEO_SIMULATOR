# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "sw_storm_rate"
label = "Days a year above a Kp threshold"
folder = "sw_storm_rate"   # frozen at seed; renaming the label never moves the directory
subsystem = "solar"
parent = "l3_solar"
kind = "computed"
owner = "environment"
tier = "A"
criticality = "minor"   # minor | significant — significant means two reviewers and a differential fill
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
order = 1353
state = "published"

# No migrated_from and no parity grid: an exceedance count over the record is a
# statistic and not a closed form, and there is no MATLAB here to run. Same
# reasoning as every measured row in this group.

[question]
text = "How many days a year does the real sky exceed this Kp?"
note = "The row that tells a reader what a declared Kp costs. env_kp declares Kp = 3 by hand, and this says the record exceeds it on 63.6 days a year — more than two months of every year. It takes a Kp rather than an Ap because the Kp is what the design declares and what the atmosphere model reads."

[maths]
# Convert the Kp to its ap on the published scale, then read the measured
# exceedance rate. Tabulated at the scale's own 28 values, so the only
# interpolation is inside one third of a Kp unit.
expression = "rate(Kp) = days per year with Ap > ap(Kp), measured over the record"
source = "noaa_swpc"

[[assumption]]
text = "Tabulated at the published scale's own 28 values, so the interpolation has almost nowhere to go"
fails_when = "the rate falls by four orders of magnitude across the scale — 364 days a year above Kp 0, 0.04 above Kp 8 — so interpolating it linearly between INTEGER Kp would overstate the rate badly in the middle of each interval. Measuring at all 28 published values instead leaves at most one third of a Kp unit between points, which is the granularity the scale itself has. Within that the answer is still a straight line and still this node's choice, not the record's."

[[assumption]]
text = "The top of the scale reads zero, and zero here means NOT OBSERVED rather than impossible"
fails_when = "the record holds no day above Ap 300, so the rate at Kp 8.67 and Kp 9 is measured as 0.0 days a year. That is 28.2 years of evidence, not a statement about the Sun: a Kp 9 day is a real and documented kind of event and this record simply does not contain one. Reading 0.0 as 'cannot happen' would be the worst possible misuse of this row, and a design sized on it would carry no allowance for the largest storms at all. Kp 8 already rests on a single day."

[[assumption]]
text = "It counts DAYS, not storms, and a storm lasts more than a day"
fails_when = "consecutive disturbed days are counted separately, so 63.6 days a year above Kp 3 is not 63.6 storms a year — it is fewer, longer events. sw_event_duration would give the mean length needed to convert one into the other and is not written. Anyone reading this as an event count will overestimate how often the sky is disturbed AND underestimate how long it stays that way."

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "rate"
type = "Ratio"
unit = "One"
lower = 0.0
upper = 366.0
reason_lower = "a count of days cannot be negative. Zero is reachable and is the measured value at the top of the scale, which the assumptions say means not observed in 28.2 years rather than impossible"
reason_upper = "there are at most 366 days in a year, so a rate above that is a counting error rather than a sky. The largest measured entry is 364.15 days a year above Kp 0, which is every day the record has an Ap at all"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "kp"
var = "env_kp"
type = "Ratio"

[[algorithm.step]]
number = 1
text = "read the measured exceedance rate at this Kp, tabulated at the published scale's own values"
binds = "r"
type = "Ratio"

[data]
# Pinned to solar-weather@2026.09.14; this list can only pin the NAME. All 28
# rates must be re-counted if the bundle version changes.
bundles = ["solar-weather"]

[view]
kind = "line"
over = "env_kp"
points = 60
