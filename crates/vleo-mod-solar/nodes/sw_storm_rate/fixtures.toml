# Known-good values, and where each came from.
#
# The one rule: an expected value may never be produced by the code
# under test. The schema refuses a row whose provenance is the
# implementation, because a number worked out by the thing being
# checked proves nothing.
#
# WHAT THESE ARE
#
# For each of the 28 published Kp values: the number of days in
# bundles/solar-weather whose daily Ap exceeds that Kp's tabulated ap, divided
# by the 28.197 years the record's 10,299 Ap days cover. Counted outside this
# crate, from the record.
#
# The integer Kp are the ones worth reading, and they are pinned first. The two
# ends are pinned because they are where the row is most likely to be misread:
# 364.15 at Kp 0 is every day the record has, and 0.0 at Kp 9 is 28.2 years of
# not seeing one rather than a statement that it cannot happen.

[[fixture]]
label = "Kp 0 — ap 0 — the record exceeds it on 364.1506 days a year"
expect = 364.1506
tolerance = 1e-12
provenance = "independent-derivation"
source = "noaa_swpc"
inputs = { kp = 0 }

