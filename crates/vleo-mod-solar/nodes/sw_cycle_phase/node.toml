# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "sw_cycle_phase"
label = "Solar cycle phase"
folder = "sw_cycle_phase"   # frozen at seed; renaming the label never moves the directory
subsystem = "solar"
parent = "l3_solar"
kind = "computed"
owner = "environment"
tier = "A"
criticality = "minor"   # minor | significant — significant means two reviewers and a differential fill
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
order = 1337
state = "published"

# No migrated_from and no parity grid: the numbers are statistics of the record
# rather than a closed form, and there is no MATLAB here to run. Same reasoning
# as every measured row in this group.

[question]
text = "How far through its solar cycle is the mission epoch?"
note = "Zero at the cycle's start and one at its end. This is the row the whole cycle-dependent half of the subsystem turns on: at the declared epoch it is 0.619, which is past maximum on the declining side — the storm-rich phase."

[maths]
expression = "phase(T) = (T - start_of_cycle) / mean_cycle_length"
source = "noaa_swpc"

[[assumption]]
text = "The epoch is past the record, so the phase is FOLDED with a mean cycle length rather than measured"
fails_when = "solar_cycles.csv gives cycle 25 a start of 2019-12-01 and an end of 2025-12-15 with a length of 6.04 years. That end and that length are artefacts of where the RECORD stops, not where the cycle stops: cycles 23 and 24 ran 11.88 and 11.00 years. The epoch, day 9862, is 382 days past that recorded end, so no cycle in the table contains it. The phase is therefore computed against the mean of the two COMPLETE cycles, 11.44 years, which is what prf_design's meanCycleAt does beyond its last cycle. If cycle 25 turns out short or long the phase moves, and every row reading it moves with it"

[[assumption]]
text = "It is a fraction of a cycle and not a measure of activity"
fails_when = "phase 0.619 does not mean 61.9% of anything physical. The cycle is not symmetric — the record's mean F10.7 by phase rises from 72 sfu at phase 0.025 to about 165 at 0.425 and falls to 68 by 0.975, so the rise is faster than the decline and equal phase steps are not equal activity steps. sw_mean_cycle_level is the row that turns a phase into a flux; reading the phase as a proxy for activity would get the asymmetry backwards"

[[assumption]]
text = "It cannot exceed one, and an epoch late in an unobserved cycle would want it to"
fails_when = "the fold divides elapsed time by a mean length, so an epoch more than 11.44 years past 2019-12-01 gives a phase above 1 and the declared bound refuses it. That is correct rather than convenient: past one cycle length the right answer is a new cycle number, and this row cannot supply one because the data does not say when cycle 26 begins"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "phase"
type = "Ratio"
unit = "One"
lower = 0.0
upper = 1.0
reason_lower = "a phase is a fraction of the way through a cycle and cannot be negative. A negative value means the epoch precedes the cycle it was assigned to"
reason_upper = "one is the end of the cycle. Above it the epoch belongs to the next cycle, and this row cannot name it because the record does not contain its start — so it refuses instead of folding round silently"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "epoch"
var = "sys_mission_requirements_mission_epoch"
type = "Time"

[[algorithm.step]]
number = 1
text = "divide the time elapsed since the current cycle's start by the mean length of the complete cycles"
binds = "out"
type = "Ratio"

[data]
# Pinned to solar-weather@2026.09.14; this list can only pin the NAME. The
# numbers must be re-measured if the bundle version changes.
bundles = ["solar-weather"]

[view]
kind = "line"
over = "sys_mission_requirements_mission_epoch"
points = 60
