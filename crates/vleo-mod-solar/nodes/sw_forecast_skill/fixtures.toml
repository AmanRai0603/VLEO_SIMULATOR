# Known-good values, and where each came from.
#
# The one rule: an expected value may never be produced by the code
# under test. The schema refuses a row whose provenance is the
# implementation, because a number worked out by the thing being
# checked proves nothing.
#
# 1 - MSE(outlook) / MSE(persistence), counted outside this crate from
# bundles/solar-weather over 1997-2025, with persistence taken as the last
# observed F10.7 strictly BEFORE the issue date. That baseline is the sheet's
# third assumption and it decides the sign of the short-lead answer: allowing
# the baseline the observation on the issue date itself turns the lead-1 skill
# from +0.069 into -1.314. Lead is a Time in SECONDS, so each input is
# days * 86400.
#
# THE ORDER MATTERS HERE AND IT IS NOT COSMETIC. The generated robustness test
# perturbs the FIRST fixture's input by plus and minus one per cent and requires
# the node not to refuse. Lead 26 is the declared value and the top of the
# declared domain, so a first fixture there would be perturbed to 26.26 and the
# node would correctly refuse. Lead 13 is interior.

