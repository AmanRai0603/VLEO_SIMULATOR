# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "sw_recurrence_lag"
label = "Rotation recurrence lag"
folder = "sw_recurrence_lag"   # frozen at seed; renaming the label never moves the directory
subsystem = "solar"
parent = "l3_solar"
kind = "declared"
owner = "environment"
tier = "A"
criticality = "minor"   # minor | significant — significant means two reviewers and a differential fill
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
order = 1340
state = "published"

# A statistic of the pinned record with no input, so it is declared rather than
# computed. There is nothing to compute it FROM inside the tree: the number comes
# from an autocorrelation counted over bundles/solar-weather and must be
# re-measured if the bundle version changes.

[question]
text = "At what lag does the solar-rotation signal in F10.7 peak?"
note = "The lag at which today's F10.7 best predicts a future day, once the 11-year cycle is removed. It is the reason a 27-day outlook is 27 days long, and it is the shortest horizon at which a design can expect an active region to come back round."

[maths]
confirmed_by = "A. Rai / 2026-09-14"   # a person read this relation against its source
expression = "L_rot = argmax over lag of corr(F107', F107' shifted by lag) = 26 d"
source = "noaa_swpc"

[[assumption]]
text = "26 is where the first peak sits and 27 is the period, and the one-day gap is a known bias in the estimator rather than a disagreement"
fails_when = "the first peak is read as the rotation period. The autocorrelation of the detrended series decays steeply from +0.936 at lag 1 to -0.066 at lag 13, and the rotation bump rides on the tail of that decay, so its apparent peak is pulled toward zero lag. The harmonics settle it: the second peak is at lag 54 and the third at lag 81, both exactly 27.0 days per cycle, and they sit far enough out that the decay no longer tilts them. So the period is 27 days and the first-peak estimate is one day short. This row reports the measured peak, which is what the MATLAB field C.rot_peak_lag holds; a row that needs the period should use 27 and cite the harmonics"

[[assumption]]
text = "The bump is broad, so the single lag overstates how sharp the recurrence is"
fails_when = "it is treated as a period a design can phase-lock to. Correlation exceeds +0.34 at every lag from 24 to 28 and exceeds +0.30 from 23 to 29 — a seven-day-wide shoulder. The Sun does not rotate as a solid body: the equator turns in about 25 days and mid-latitudes in about 28, and active regions emerge and decay within a rotation. So the recurrence is a tendency over a week-wide window, not a clock"

[[assumption]]
text = "The 11-year cycle was removed with a 365-day centred mean, and that choice sets what is left"
fails_when = "the detrending window is comparable to the signal. At 365 days it is thirteen rotations long, so it removes the cycle and the annual terms while leaving the rotation untouched; the residual has a standard deviation of 19.85 sfu about a mean of -0.03. A window near 27 days would remove the rotation itself and this row would measure nothing. 3 of 10319 days in the record have no F10.7 and are excluded pairwise rather than interpolated"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "L_rot"
type = "Time"
unit = "Day"
lower = 20.0
upper = 35.0
reason_lower = "below 20 days the autocorrelation is still on the steep descent from lag 1 and is falling, not peaking: it reads +0.186 at lag 20 against +0.376 at the peak. A value there would mean the detrending removed the rotation instead of the cycle"
reason_upper = "above 35 days the first bump has closed — the correlation is +0.031 at lag 35 and negative by 36 — and anything beyond is the second harmonic near lag 54, which is the same signal counted twice. A value there would be reporting a harmonic as the fundamental"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 26.0
confirmed_by = "A. Rai / 2026-09-14"

[data]
# Pinned to solar-weather@2026.09.14; this list can only pin the NAME. The
# numbers must be re-measured if the bundle version changes.
bundles = ["solar-weather"]

[view]
kind = "number"
