# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "sw_ap_daily_band_drop"
label = "Within-rotation daily Ap drop"
folder = "sw_ap_daily_band_drop"   # frozen at seed
subsystem = "solar"
parent = "l3_solar"
kind = "computed"
owner = "environment"
tier = "A"
criticality = "significant"   # minor | significant — significant means two reviewers and a differential fill
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
order = 1382
state = "published"

# NO migrated_from. The same reason as the other three daily rows: this no
# longer answers the question prf_density.m:221 answers.
#
# Of the four this is the one the correction moves least — 10.59 to 12.56 — and
# the one it matters most on, because sw_ap_cold_short is the row in the whole
# subsystem closest to a declared bound. The cold Ap day goes from 6.91 to 4.93,
# five units above a floor of zero.

[question]
text = "How far below its own rotation does a single day of Ap fall, at the declared confidence, at the level that rotation sits at?"
note = """
The cold tail of sw_ap_daily_band_spread's sample, and a separate row because
Ap's two tails are nothing like each other at any level. At a rotation of Ap 11
they are 14.67 up and 7.56 down; at Ap 26, 63.85 and 21.02 — the high tail is
three times the low one. The geomagnetic index is the most skewed quantity in
this subsystem, because it floors hard at zero and has no ceiling at all.

The cold day is the low-drag case, and on the Ap side it is also the quiet-sky
case a magnetometer, a magnetorquer sizing and an aerodynamic control authority
are bounded by from below.
"""

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How far a single day of geomagnetic disturbance can fall below its own 27-day average, at the one-in-twenty level and at the level that stretch sits at. It is measured from the daily record and read at the quiet design level, where it comes to about 12.56. It feeds the quietest single-day scenario, which sits closest to the zero floor."
breaks = "It is past scatter in days that already happened, not a forecast error. The drop is read from a table measured at eight levels and interpolated between them; the interpolation and the later subtraction do not know the index floors at zero, and the 27-day window is a conventional round number rather than a measured period."
wrong = "It is easy to treat this as the upward swing turned around. The upward swing is about twice the drop at the bottom of the table and three times at the top, so mirroring one onto the other is wrong by that factor."
by = "an assistant, from what this sheet states — for its owner (environment) to confirm"

[maths]
# A person has NOT read this relation against its source yet. The table is
# measured from the record by the method the theory sets out; nobody has agreed
# that the method or the knots are the right ones.
confirmed_by = ""
expression = "dAp_day_low(L) = -pctl(Ap - movmean(Ap, 27 d), 0.05) over days whose rotation sits within 15% of L"
source = "noaa_swpc"

[[input]]
# The level this drop applies AT. The quiet day rides on the quiet sustained
# level and on nothing else.
binding = "level"
var = "sw_ap_cold_long"
type = "Ratio"

[[algorithm.step]]
number = 1
text = "read the 5th-percentile within-rotation Ap departure off the measured table at this rotation level, as a magnitude"
binds = "band"
type = "Ratio"

[theory]
why = """
sw_ap_daily_band_spread's measurement, read from the other end: the same daily
record, the same centred 27-day moving mean, the same bins of rotation level,
the 5th percentile instead of the 95th, published as a magnitude.

The asymmetry is the reason this is a row and it is larger on Ap than anywhere
else in the subsystem. At Ap 4 the tails are 6.02 up and 2.97 down; at Ap 11,
14.67 and 7.56; at Ap 26, 63.85 and 21.02. The high tail is roughly twice the
low one at the bottom of the ladder and three times at the top. Ap is bounded
below at 0 and a quiet day really does sit there, so a rotation whose mean is 20
cannot fall more than 20 and can rise without limit — the distribution is not
merely skewed, it is truncated, and the truncation bites harder the lower the
rotation.

The low tail is also much better behaved than the high one. It rises smoothly by
a factor of seven across the ladder where the high tail rises by eleven with most
of it in the last third, because a quiet day is a quiet day whatever the rotation
and a storm day is not.
"""
reading = """
12.56 at the declared window, where sw_ap_cold_long puts the sustained quiet
level at 17.50 — between the Ap 15 and Ap 20 knots, so this is a genuine
interpolation rather than a clamp, unlike its high-tail twin. The old
single-number version gave 10.59.

sw_ap_cold_short therefore falls from 6.91 to 4.93. That is the narrowest
margin to a declared bound anywhere in this subsystem: five units above a floor
of zero, where before it was seven. With this table a sustained Ap below about
15.6 would put the cold day through the floor and the row would refuse.
"""

[[theory.step]]
text = "Take the daily Ap record and subtract the centred 27-day moving mean. The sample is identical to sw_ap_daily_band_spread's — the same days, the same moving mean, one measurement."
math = "dev(t) = Ap(t) - movmean(Ap, 27)(t)"

[[theory.step]]
text = "Bin every day by the level of its own rotation, within 15 per cent of each knot, exactly as the high tail does."
math = "bin(L) = { dev(t) : |movmean(Ap,27)(t) - L| <= 0.15 L }"

[[theory.step]]
text = "Read the 5th percentile instead of the 95th. Eight knots, Ap 4 to 26: 2.97, 4.17, 5.59, 7.56, 10.84, 14.30, 17.69, 21.02."
math = "lo(L) = pctl(bin(L), 0.05)"

[[theory.step]]
text = "Publish its magnitude, interpolated between knots and clamped beyond the ends. The declared window sits between two knots, so this is an interpolation."
math = "dAp_day_low(L) = -interp(L; knots) = 12.56 at L = 17.50"

# THE METHOD — the relation in the method language (docs/PSEUDOCODE.md). In the
# sheet hash: the generated code is translated from it.
[method]
text = """
# Transcribed from crates/vleo-mod-solar/nodes/sw_ap_daily_band_drop/model.rs (HOLE 1 and its guards) — the method the code already runs.
# Numbers: measured data, the 5th-percentile within-rotation Ap departure conditioned on rotation level, from the NOAA SWPC record (noaa_swpc); bins of 15 per cent, at least 200 days each.
# A Table1 lookup: linear between knots, clamped at both ends (never extrapolated). The answer is a magnitude; sw_ap_cold_short subtracts it.
let band = interp(level, [4.0, 6.0, 8.0, 11.0, 15.0, 20.0, 24.0, 26.0], [2.9704, 4.1685, 5.5926, 7.5556, 10.8370, 14.2963, 17.6926, 21.0185])

# Generated guards: the declared domain of dAp_day_low.
if band < 0 then
  refuse "below zero is not a distance; a negative drop means the tail has been read from the wrong end"
end
if band > 150 then
  refuse "above 150 the value exceeds anything the record supports, so it is an arithmetic error rather than a quiet sky"
end
return band
"""
by = "Aman Rai / 2026-10-03"

[[case]]
label = "at the declared window's own sustained quiet level, Ap 17.50 — a genuine interpolation between the 15 and 20 knots, unlike its high-tail twin's clamp."
refuse = "no"
expect = 12.5635147395
tolerance = 1e-9
inputs = { level = 17.49546836 }
origin = "hand"

[[case]]
label = "the Ap 15 knot, exactly — a transcription check on the lower bracket of that interpolation."
refuse = "no"
expect = 10.837
tolerance = 1e-12
inputs = { level = 15.0 }
origin = "hand"

[[case]]
label = "the Ap 11 knot, exactly — a transcription check where the high tail is twice this value."
refuse = "no"
expect = 7.5556
tolerance = 1e-12
inputs = { level = 11.0 }
origin = "hand"

[[case]]
label = "between the Ap 20 and Ap 24 knots — the interpolation on the upper half of the ladder."
refuse = "no"
expect = 15.99445
tolerance = 1e-9
inputs = { level = 22.0 }
origin = "hand"

[[case]]
label = "below the bottom of the table — the clamp."
refuse = "no"
expect = 2.9704
tolerance = 1e-12
inputs = { level = 1.0 }
origin = "hand"

[[case]]
label = "a value that is not a number: the node must refuse it, as its code does"
refuse = "yes"
inputs = { level = nan }
origin = "hand"

[[assumption]]
text = "The result stays above zero, and nothing in the arithmetic ensures it"
fails_when = "the sustained quiet level is small. With this table the crossing is at a sustained Ap near 15.6, and the declared window's 17.50 clears it by under two units of level — where before, with a single 10.59, the crossing was at 15.2. Conditioning on level did not move that crossing much because the drop falls with the level too, but the margin on the ANSWER narrowed from seven to five. sw_ap_cold_short's guard refuses rather than publishing a negative index, and it is the row most likely in this subsystem to fire"

[[assumption]]
text = "Ap's departures are strongly asymmetric at every level, and this row exists because of it"
fails_when = "it is treated as the negation of sw_ap_daily_band_spread. The high tail is twice the low one at Ap 4 and three times at Ap 26. Anything that mirrors one onto the other is wrong by a factor of two to three, and in the direction that puts the cold day below zero"

[[assumption]]
text = "A percentile of departures does not know that Ap floors at zero"
fails_when = "the rotation mean it is subtracted from is smaller than the drop. The table is measured from a sample that is itself truncated, so the low tail already reflects the floor implicitly — but the interpolation between knots does not, and neither does the subtraction in sw_ap_cold_short. The guard there is what stops it, not the statistic here"

[[assumption]]
text = "A 15 per cent bin half-width, which trades resolution against sample size"
fails_when = "either matters more than the other. The declared window sits between the Ap 15 knot, holding 1558 days, and the Ap 20 knot, holding 803. Both are well populated, so this row's own answer is on firmer ground than its high-tail twin's, which is reading the table's top knot at 300 days"

[[assumption]]
text = "The 27-day moving mean is the rotation"
fails_when = "Ap's recurrence is driven by coronal holes and high-speed streams whose period is nearer 27.0 days than the 27.27 of the equatorial photosphere. A 27-day window is the conventional round number rather than a measured period"

[[assumption]]
text = "It is the record's own daily scatter, not a forecast error"
fails_when = "this is read as an uncertainty. It says how far below its rotation the geomagnetic field has gone, measured on days that already happened"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "dAp_day_low"
type = "Ratio"
unit = "One"
lower = 0.0
upper = 150.0
reason_lower = "a drop of zero would mean no day ever falls below its rotation mean, which the record contradicts on about half the days it holds; below zero is not a distance, and a negative value here means the tail has been read from the wrong end"
reason_upper = "above 150 the value exceeds anything the record supports for this quantity, so it is an arithmetic error rather than a quiet sky"

[view]
kind = "line"
over = "sw_ap_cold_long"
points = 60

