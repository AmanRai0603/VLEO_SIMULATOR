# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "sw_exceedance_duration"
label = "How long one exceedance lasts"
folder = "sw_exceedance_duration"   # frozen at seed; renaming the label never moves the directory
subsystem = "solar"
parent = "l3_solar"
kind = "computed"
owner = "environment"
tier = "A"
criticality = "significant"   # minor | significant — significant means two reviewers and a differential fill
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
order = 1366
state = "published"

# The second of the three exceedance rows. sw_exceedance_rate says how often the
# design bound is passed; this says how long the vehicle stays outside it once
# it is. The two together are what decides whether an exceedance is an event to
# ride out or a condition to survive.

[question]
text = "Once the record goes above the design Ap, how long does it stay there?"
note = "The mean length of a run of consecutive days at or above sw_ap_design. At G3 it is 1.14 days — an exceedance is one disturbed day, not a siege. That is the reason 1.42 days of exceedance per mission is survivable rather than fatal."

[maths]
expression = "D_exc(Ap_design) = mean length of a run of consecutive days with Ap >= Ap_design"
source = "noaa_swpc"

# WHERE THIS RELATION CAME FROM. Prose, outside the sheet hash: correcting a
# sentence here does not invalidate a generated artefact. The tab before this one
# states the relation; this says why it is that relation, and the tab after it
# shows what the machine made of it.
[theory]
why = """
A rate says how often the bound is crossed and nothing about what a crossing
is like. Those are different design problems: 1.42 days of exceedance spread
as one day at a time is a transient an attitude and drag budget can absorb,
and the same 1.42 days arriving as a single continuous siege is a different
vehicle. So the second of the three exceedance numbers is the dwell — how
long a run above the bound lasts once it starts — and the answer is what
makes the violated requirement acceptable rather than fatal.
"""
reading = """
Read it as 'one day, occasionally two', not as 1.142857. At the G3 bound the
runs are six of one day and one of two, so the mean is exactly 8 over 7 and
removing the single two-day event makes it 1.000. The third decimal place is
arithmetic on a sample small enough to write out in full. Note also that it
is measured on DAILY means: a storm that peaks for six hours and subsides
may never lift a daily mean above the bound, so the event counted here is
coarser than the one a spacecraft feels.
"""

[[theory.step]]
text = """
Define an event as a maximal run of consecutive days that all reach the
bound, and measure the mean length of those runs. The definition needs one
rule that has no physics behind it: what ends a run.
"""
math = "D_exc = mean length of maximal runs with Ap >= Ap_design"

[[theory.step]]
text = """
The rule taken is that the first day failing the test ends the run. So a
disturbed week with one quieter day in the middle counts as two events
rather than one, which shortens this mean and raises the event count derived
from sw_exceedance_rate. Allowing a one-day bridge would be equally
defensible and would give a different pair of numbers; the rule is stated
rather than the answer being presented as unique. It is the same rule
sw_event_duration uses for F10.7, so the two rows are at least consistent
with each other.
"""

[[theory.step]]
text = """
Measured at the three design levels the answer is just over a day
everywhere, and it SHORTENS as the bound rises.
"""
math = "G1: 1.2718 d (max 5) G2: 1.2069 d (max 3) G3: 1.1429 d (max 2)"

[[theory.step]]
text = """
The shortening is not a coincidence, it is what a threshold cutting further
into a peaked distribution must do. A storm's Ap profile rises and falls;
the higher the horizontal line drawn across it, the narrower the slice above
the line. So the trend is a check on the measurement rather than a finding
about the Sun.
"""

[[theory.step]]
text = """
The design consequence is in how close the three numbers are. Switching G
level changes how OFTEN the bound is crossed by a factor of sixteen and how
LONG each crossing lasts by eleven per cent — so the lever a designer has is
the rate, not the dwell.
"""

[[theory.step]]
text = """
Which settles the question the requirement left open. At G3 the vehicle is
above its design Ap for about one day at a time, at most two: long enough to
matter to an attitude budget or a drag transient, not long enough to be a
sustained environment.
"""


[[assumption]]
text = "Just over one day at every level, and that is the finding"
fails_when = "a long exceedance is assumed. Measured, the mean run is 1.271845 days at the G1 bound, 1.206897 at G2 and 1.142857 at G3, and the maxima are 5, 3 and 2 days. The higher the bound the shorter the run, which is what a threshold cutting further into a peaked distribution must do. So at G3 the vehicle is above its design Ap for about one day at a time, at most two — long enough to matter to an attitude budget or a drag transient, not long enough to be a sustained environment. The three numbers are so close together that switching G level changes how OFTEN far more than how LONG"

[[assumption]]
text = "The mean is over 7 events at G3, and one of them is half the information"
fails_when = "the third decimal place is believed. At G3 the runs are six of one day and one of two, so the mean of 1.142857 is exactly 8 divided by 7. Remove the single two-day event and it is 1.000. The number is a mean over a sample small enough to write out, and it is published as a mean because that is what the study's field holds — but a designer should read it as 'one day, occasionally two'"

[[assumption]]
text = "A one-day dip below the bound ends the exceedance"
fails_when = "a storm rides just under the threshold for a day and comes back. Runs break on the first day that fails the test, so a disturbed week with one quieter day in the middle counts as two exceedances rather than one, shortening the mean and raising the event count in sw_exceedance_rate. Allowing a one-day bridge would be as defensible and would give a different pair of numbers. The rule is stated rather than the number being presented as unique — and it is the same rule sw_event_duration uses for F10.7, so the two are at least consistent with each other"

[[assumption]]
text = "Daily means, so a violent six hours and a disturbed day look the same"
fails_when = "the exceedance is short and sharp. Ap is the mean of eight three-hourly slots, so a storm that peaks for six hours and subsides can fail to lift the daily mean above the bound at all, and one that sits moderately high all day can pass it. This row therefore measures days on which the DAILY average exceeded the design value, which is a coarser event than the one a spacecraft feels. The record's three-hourly Kp is in observed_daily.csv and nothing in this group reads it yet"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "D_exc"
type = "Time"
unit = "Day"
lower = 1.0
upper = 5.0
reason_lower = "a run is at least one day by construction. A value below 1 means the run-finding is broken rather than that exceedances are brief"
reason_upper = "the longest run at any design level in 29 years is 5 days, at the G1 bound. A mean above that would exceed every single event the record contains, which no averaging can produce"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "ap_design"
var = "sw_ap_design"
type = "Ratio"

[[algorithm.step]]
number = 1
text = "read the measured mean length of a consecutive run at or above this Ap"
binds = "out"
type = "Time"

[data]
# Pinned to solar-weather@2026.09.14; this list can only pin the NAME. The
# numbers must be re-measured if the bundle version changes.
bundles = ["solar-weather"]

[view]
kind = "line"
over = "sw_storm_design_level"
points = 40
