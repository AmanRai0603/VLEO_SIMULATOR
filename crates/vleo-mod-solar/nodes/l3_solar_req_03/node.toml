# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "l3_solar_req_03"
label = "Ap"
folder = "l3_solar_req_03"   # frozen at seed; renaming the label never moves the directory
subsystem = "solar"
parent = "l3_solar"
kind = "declared"
owner = "environment"
tier = "A"
criticality = "significant"   # minor | significant — significant means two reviewers and a differential fill
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
order = 1334
state = "published"
# A ceiling, not a floor. The environment is something the vehicle must
# survive, so the requirement is satisfied by the sky being no worse than
# this, and the achieved row beside it must come in at or under.
sense = "<="

# WHERE 200 SITS ON THE NOAA G SCALE, WHICH IS THE QUESTION TO ASK OF IT.
#
# The G scale is defined on Kp, and the published ap equivalent amplitude gives
# the daily Ap each level bounds:
#
#     G1 minor     Kp 5     ap  48
#     G2 moderate  Kp 6     ap  80
#     G3 strong    Kp 7     ap 132
#     G4 severe    Kp 8     ap 207
#     G5 extreme   Kp 9     ap 400
#
# So a requirement of Ap <= 200 sits just under G4's ceiling: it is a G4-class
# commitment. That is ONE LEVEL ABOVE what the vehicle is designed to.
# sw_storm_design_level declares G3 and sw_ap_design turns that into 132.
#
# The three numbers in play, and the order they come in, is the whole point of
# this row existing:
#
#     designed for      132   sw_ap_design at G3
#     record expects    158.4 sw_storm_return_level at the 5-year mission
#     required to meet  200   this row
#
# The requirement is met — 158.4 is under 200, so the closure passes — and the
# design value is NOT. The vehicle is sized for a storm smaller than the one the
# record says a five-year mission will meet. The closure does not catch that,
# because the closure compares the requirement against what the record presents
# and not against what the structure was built for.
#
# That gap is closed by operating through the event rather than by building for
# it: 49 days in 29 years reach G4 and 16 reach G5, and those are the spikes
# sw_spike_threshold and sw_event_duration describe. Whoever reviews this row
# should decide whether that is acceptable, and the numbers to decide it with
# are all on rows rather than in a paragraph.

[question]
text = "What daily planetary Ap must this design survive?"
note = "A G4-class ceiling at 200. The vehicle is designed to G3, which is Ap 132, and the record expects 158.4 over a five-year mission — so the requirement is met while the design value is exceeded. The comment above sets out the three numbers and why they are in that order."

[maths]
confirmed_by = "A. Rai / 2026-09-14"   # a person read this relation against its source
expression = "Ap_req = 200"
source = "orbitt_case_c1"

[[assumption]]
text = "200 is the record's expectation with a round margin, and it lands one G level above the design"
fails_when = "the requirement is read as describing the vehicle. sw_storm_return_level at the declared five-year mission gives 158.4 and 200 is the next round number with usable headroom, about 26 per cent. On the G scale 200 sits between G3's ceiling of 132 and G4's of 207, so what has been committed to is G4-class survival while sw_storm_design_level declares G3. A requirement and a design value that disagree by a whole level is a thing to resolve, not a rounding."

[[assumption]]
text = "Switching the G level moves the design value and not this row"
fails_when = "somebody expects the requirement to follow the switch. sw_storm_design_level is the input a design turns to ask what a different storm level costs — G1 gives 48, G2 gives 80, G3 gives 132 — and sw_ap_design moves with it. This row does not: it is a commitment, and a commitment that silently tracked the design would never be violated and would therefore never be a requirement. Changing it is a separate, deliberate act."

[[assumption]]
text = "A daily mean, which is the wrong shape for what a storm does"
fails_when = "the storm is short or long. Daily Ap averages eight three-hourly slots, so a violent six-hour storm and a mild day-long disturbance can share a value, and a requirement written on the daily mean is satisfied by both. The atmosphere responds to the integral with a lag, not to the daily mean. The record's largest daily Ap is 273 — above this requirement — and it is one day in 29 years."

[[assumption]]
text = "It is met by the record and the record is 29 years long"
fails_when = "the mission meets something the record has not seen. The return level this is checked against is fitted through ranks 2 and 3 of a 28.2-year sample at the mission's five-year period, and the largest event in that sample, Ap 273, has an apparent return period of 28.2 years for no reason but that it is the largest thing in 28.2 years. Events well beyond this requirement are known from longer proxy records. A requirement that a 29-year record cannot violate is not thereby safe."

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "Ap_req"
type = "Ratio"
unit = "One"
lower = 20.0
upper = 400.0
reason_lower = "below 20 the requirement would be under the level at which the record's storms begin — the median day is Ap 7 and sw_storm_return_level's own floor is 20 — so a requirement there could not be met by any mission and is not a requirement"
reason_upper = "400 is the top of the published ap table, the value at Kp 9. A requirement above it is off the scale the G levels are defined on and could not be expressed as a G level at all"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 200.0
confirmed_by = "A. Rai / 2026-09-14"

[view]
kind = "number"
