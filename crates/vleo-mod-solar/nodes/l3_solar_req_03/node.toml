# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "l3_solar_req_03"
label = "Required — Ap, survival"
folder = "l3_solar_req_03"   # frozen at seed; renaming the label never moves the directory
subsystem = "solar"
parent = "l3_solar"
kind = "declared"
owner = "environment"
tier = "A"
criticality = "significant"   # minor | significant — significant means two reviewers and a differential fill
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
order = 1336
state = "published"
# A ceiling, not a floor. The environment is something the vehicle must
# survive, so the requirement is satisfied by the sky being no worse than
# this, and the achieved row beside it must come in at or under.
sense = "<="

# THE REQUIREMENT IS THE DESIGN CAPABILITY PLUS A MARGIN, AND IT IS NOT MET.
#
# The G scale is defined on Kp, and the published ap equivalent amplitude gives
# the daily Ap each level bounds:
#
#     G1 minor     Kp 5     ap  48
#     G2 moderate  Kp 6     ap  80
#     G3 strong    Kp 7     ap 132
#     G4 severe    Kp 8     ap 207
#     G5 extreme   Kp 9     ap 400
#
# THIS ROW WAS 150 AND THE CLOSURE FAILED. It was sw_ap_design's 132 with about
# 14 per cent on it, and sw_storm_return_level expects 158.4 over the declared
# five years, so the achieved side came in over the commitment. It had been that
# way since the pair was written, and nothing in the tree said so, because
# nothing in this tree evaluates a closure.
#
# It is now 207, the published ap at Kp 8, decided on 2026-09-16.
#
# AND IT IS NOT THE MOVE THIS SHEET USED TO REJECT, which is worth being exact
# about because the old text rejected it in as many words: "a margin chosen so
# the closure passes would have to exceed 158.4, which means about 200 — and 200
# sits in G4 territory, committing the vehicle on paper to a level it is not
# built for."
#
# What changed is the question, not the arithmetic. This row asks what must not
# DESTROY the vehicle. sw_storm_design_level asks what it OPERATES THROUGH, and
# that is still G3 — its own reason_upper says G4 "is handled by operating
# through the event rather than by building for it", and it is untouched. So
# the commitment here is survival at G4, not capability at G4, and nothing
# downstream of sw_ap_design moves: the four exceedance rows still measure
# exceedance of 132, which is still the operating level and is still exceeded.
#
# That also brings this row into line with its four siblings, all of which were
# re-anchored on published thresholds rather than on capability-plus-a-margin:
# 48 operate indefinitely, 132 survive one day, 207 not destroyed by the one
# storm. A ladder a reader can check against a scale.
#
# IT IS EXCEEDED, AND THAT IS THE POINT OF THE THREE ROWS BESIDE IT.
#
#     operates through   132   sw_ap_design at G3, unchanged
#     not destroyed by   207   this row, the G4 threshold
#     record expects     158.4 sw_storm_return_level over the declared 5 years
#
# 158.4 now sits BETWEEN the two: above what the vehicle operates through and
# below what it must survive. That is the honest shape of the answer, and it is
# more informative than either a passing closure or a failing one alone — the
# mission will meet a storm it cannot work through and will not be destroyed by
# it. The useful question is then how much, how often, for how long and when,
# and those are measured against the OPERATING level and each is a row:
#
#     sw_exceedance_rate       0.284 days a year above 132
#                              = 1.42 days over the five-year mission
#     sw_exceedance_duration   1.14 days per exceedance, at most 2
#                              = about 1.24 separate events
#     sw_exceedance_phase      median cycle phase 0.603, spread 0.294 to 0.736
#
# So the vehicle spends roughly one and a half days of a five-year mission
# outside what it is built for, in one or two separate one-day events, both
# falling on the declining side of the cycle. The declared epoch sits at phase
# 0.619 — inside that band, just past its median — so a mission starting
# 2027-01-01 meets them early rather than late.
#
# That is a survivable exceedance rather than a failed design, and it is only
# survivable because it is brief and rare. Switching sw_storm_design_level to G2
# moves every one of those numbers: 6.21 days per mission in about 5.1 events.

[question]
text = "What daily planetary Ap must this design survive?"
note = "The G3 design capability of Ap 132 with a 14 per cent margin on it. The record expects 158.4 over the declared five-year mission, so this requirement is NOT met — and the three exceedance rows say what that costs: about 1.42 days outside the bound over the mission, in one or two one-day events, on the declining side of the cycle where the epoch sits."

[maths]
confirmed_by = "A. Rai / 2026-09-16"   # a person read this relation against its source
expression = "Ap_req = ap(G4) = 207"
source = "orbitt_case_c1"

# WHERE THIS RELATION CAME FROM. Prose, outside the sheet hash: correcting a
# sentence here does not invalidate a generated artefact. The tab before this one
# states the relation; this says why it is that relation, and the tab after it
# shows what the machine made of it.
[theory]
why = """
This row asks what the mission must not be DESTROYED by. That is a different
question from what it OPERATES THROUGH, and separating the two is what lets both
be answered honestly.

The vehicle operates through G3: sw_storm_design_level declares it and
sw_ap_design turns it into a daily Ap of 132. The record expects 158.4 over the
declared five-year mission, so the mission WILL meet a storm it cannot work
through. That is a fact about the sky and no number written here changes it.

What this row commits to is that such a storm does not end the mission, and it
is anchored at 207 — the published ap at Kp 8, the G4 threshold. The three
exceedance rows then say what the operating violation costs, which is the
question a designer actually faces: 0.284 days a year above 132, 1.42 days over
the mission, in about 1.24 events averaging 1.14 days each.

This row used to be 132 plus a 14 per cent margin, 150, and the closure failed
because 158.4 exceeded it. Raising it was rejected then on the grounds that a
number above 158.4 "commits the vehicle on paper to a level it is not built
for". That objection holds for an OPERATING commitment and is why
sw_storm_design_level is untouched at G3. It does not hold for a SURVIVAL one,
which is what this row is.
"""
reading = """
The closure fails and the failure is bounded. 0.284 days a year above the
design Ap of 132 is 1.42 days over the mission, in about 1.24 events
averaging 1.14 days each, the longest run in 29 years being 2 days — roughly
thirty-four hours outside the design environment across five years, on the
declining side of the cycle where the declared epoch sits. If that is
unacceptable the answer is to move sw_storm_design_level, not to raise this
row until the arithmetic stops complaining. And note what this row does NOT
do: it does not follow the G-level switch. A commitment that tracked the
design would never be violated.
"""

[[theory.step]]
text = """
Begin from the capability, which is the only defensible starting point for a
commitment: sw_ap_design at the declared G3 gives a daily Ap of 132, the
value a day would reach with all eight slots at Kp 7.
"""

[[theory.step]]
text = """
Do not add a margin to it. A survival commitment is a different question from
an operating capability, so it is anchored where the published scale puts the
next band rather than at a percentage above what the vehicle works through.
"""
math = "Ap_req = ap(Kp 8) = 207, the G4 threshold"

[[theory.step]]
text = """
Now compare it with what the record expects, which is where the row stops
being arithmetic. sw_storm_return_level at five years gives 158.4 — above the
132 the vehicle operates through, below the 207 it must survive.
"""
math = "158.4 <= 207 — the closure holds, and 158.4 > 132 is the finding"

[[theory.step]]
text = """
The alternative was available and was rejected. A margin chosen so the
closure passes would have to exceed 158.4, which means about 200 — and 200
sits in G4 territory, committing the vehicle on paper to a level it is not
built for. A requirement that passes because its number was chosen to pass
is worse than one that fails honestly.
"""

[[theory.step]]
text = """
So the useful question becomes the size of the violation rather than its
existence, and that is what the exceedance rows answer: how often the record
goes past 132, for how long each time, and where in the cycle.
"""
math = "0.284 d/yr * 5 yr = 1.42 d, in ~1.24 events of ~1.14 d"

[[theory.step]]
text = """
Thirty-four hours outside the design environment over five years is a number
a programme can accept or reject. That is the whole purpose of writing the
requirement below the expectation: it converts a vague inadequacy into a
bounded one.
"""


[[assumption]]
text = "207 is a SURVIVAL commitment and not an operating capability, and the two are easy to confuse"
fails_when = "a reader takes this as the level the vehicle works through. It is not. sw_storm_design_level declares G3 and sw_ap_design turns it into 132, and that is the operating level; nothing about it moved. This row says a G4 storm does not end the mission, which sw_storm_design_level's own reason_upper describes as the right treatment for G4 — handled 'by operating through the event rather than by building for it'. A design that claimed to OPERATE at G4 would change sw_storm_design_level, and four exceedance rows would move with it."

[[assumption]]
text = "This closure now holds and the OPERATING one still does not, and the second is the one that matters"
fails_when = "a passing closure here is read as the storm case being closed. 158.4 sits between the two levels: above the 132 the vehicle operates through, below the 207 it must survive. So the mission meets a storm it cannot work through, and the size of that is what a designer needs — 0.284 days a year above 132, 1.42 days over the mission, about 1.24 events averaging 1.14 days each, longest run in 29 years 2 days. Roughly thirty-four hours outside the operating environment across five years. Nothing in the tree compares 158.4 against 132 automatically; the three exceedance rows measure it and a person reads them."

[[assumption]]
text = "Switching the G level moves the design value and the exceedance statistics, and not this row"
fails_when = "somebody expects the requirement to follow the switch. sw_storm_design_level is the input a design turns to ask what a different storm level costs — G1 gives 48, G2 gives 80, G3 gives 132 — and sw_ap_design and all three exceedance rows move with it. At G2 the exceedance rate is 1.24 days a year, 6.21 days over the mission in 5.1 events. This row does not move: it is a commitment, and a commitment that silently tracked the design would never be violated and would therefore never be a requirement. Changing it is a separate, deliberate act."

[[assumption]]
text = "A daily mean, which is the wrong shape for what a storm does"
fails_when = "the storm is short or long. Daily Ap averages eight three-hourly slots, so a violent six-hour storm and a mild day-long disturbance can share a value, and a requirement written on the daily mean is satisfied by both. The atmosphere responds to the integral with a lag, not to the daily mean. The record's largest daily Ap is 273 — above this requirement — and it is one day in 29 years."

[[assumption]]
text = "It is met by the record and the record is 29 years long"
fails_when = "the mission meets something the record has not seen. The return level this is checked against is fitted through ranks 2 and 3 of a 28.2-year sample at the mission's five-year period, and the largest event in that sample, Ap 273, has an apparent return period of 28.2 years for no reason but that it is the largest thing in 28.2 years. Events well beyond this requirement are known from longer proxy records. A requirement that a 29-year record cannot violate is not thereby safe."

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "Ap_req_survive"
type = "Ratio"
unit = "One"
lower = 20.0
upper = 400.0
reason_lower = "below 20 the requirement would be under the level at which the record's storms begin — the median day is Ap 7 and sw_storm_return_level's own floor is 20 — so a requirement there could not be met by any mission and is not a requirement"
reason_upper = "400 is the top of the published ap table, the value at Kp 9. A requirement above it is off the scale the G levels are defined on and could not be expressed as a G level at all"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 207.0
# 207 is the published ap equivalent amplitude at Kp 8, the G4 threshold. The
# DECISION — that the one storm the mission must not be destroyed by is a G4,
# while the level it OPERATES THROUGH stays G3 — was made on 2026-09-16.
confirmed_by = "A. Rai / 2026-09-16"

[view]
kind = "number"
