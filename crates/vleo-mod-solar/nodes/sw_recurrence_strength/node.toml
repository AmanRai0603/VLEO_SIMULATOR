# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "sw_recurrence_strength"
label = "Rotation recurrence strength"
folder = "sw_recurrence_strength"   # frozen at seed; renaming the label never moves the directory
subsystem = "solar"
parent = "l3_solar"
kind = "declared"
owner = "environment"
tier = "A"
criticality = "minor"   # minor | significant — significant means two reviewers and a differential fill
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
order = 1341
state = "published"

# A statistic of the pinned record with no input, so it is declared rather than
# computed. There is nothing to compute it FROM inside the tree: the number comes
# from an autocorrelation counted over bundles/solar-weather and must be
# re-measured if the bundle version changes.

[question]
text = "How strong is the solar-rotation recurrence in F10.7?"
note = "The correlation at the recurrence lag sw_recurrence_lag reports. It says how much of a future day a design can actually infer from an active region coming back round, and the answer is a useful tendency rather than a prediction: 0.376 is 14 per cent of the variance."

[maths]
confirmed_by = "A. Rai / 2026-09-14"   # a person read this relation against its source
expression = "r_rot = corr(F107', F107' shifted by L_rot) = 0.375988"
source = "noaa_swpc"

[[assumption]]
text = "A correlation of 0.376 explains 14 per cent of the variance, and that is the number a design should hear"
fails_when = "the correlation is read as the fraction of the signal that recurs. Squared it is 0.1414, so a rotation ahead the recurrence accounts for one seventh of the detrended variation and the other six sevenths is new. It is enough to make a 27-day outlook better than nothing — sw_forecast_skill measures +0.018 still at lead 23 — and nowhere near enough to size anything on"

[[assumption]]
text = "It is the strength at the FIRST peak and the signal keeps going"
fails_when = "the recurrence is assumed to die within one rotation. The second harmonic at lag 54 still carries +0.136 and the third at lag 81 carries +0.067, so an active region is faintly detectable three rotations out. This row reports only the first peak, which is what the MATLAB field C.rot_peak_r holds. The decay across harmonics — 0.376, 0.136, 0.067 — is roughly geometric and is the physical lifetime of an active region showing up in the statistics"

[[assumption]]
text = "Pooled over cycles 23, 24 and the rise of 25, and the recurrence is certainly not constant across them"
fails_when = "a design at a known cycle phase wants the recurrence it will actually see. At solar maximum there are many active regions and their overlap blurs the rotation signal; near minimum a single long-lived region can dominate it. This is one correlation over 10242 detrended days spanning all three, so it averages regimes in which the mechanism differs. A phase-conditioned version would be a separate row and would need the epoch, which now exists"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "r_rot"
type = "Ratio"
unit = "One"
lower = 0.1
upper = 0.7
reason_lower = "below 0.1 the rotation bump would be indistinguishable from the noise floor of the detrended series, whose correlation sits between -0.09 and +0.03 across lags 36 to 47. A value there means the detrending removed the signal"
reason_upper = "above 0.7 a rotation-ahead correlation would be stronger than the measured one-day correlation of the same series at lag 5 (+0.531), which would mean F10.7 is more predictable 26 days out than 5 days out. The measured value is 0.376 and nothing in the record approaches 0.7"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 0.375988
confirmed_by = "A. Rai / 2026-09-14"

[data]
# Pinned to solar-weather@2026.09.14; this list can only pin the NAME. The
# numbers must be re-measured if the bundle version changes.
bundles = ["solar-weather"]

[view]
kind = "number"
