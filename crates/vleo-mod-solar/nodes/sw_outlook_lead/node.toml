# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "sw_outlook_lead"
label = "Short-term forecast lead"
folder = "sw_outlook_lead"   # frozen at seed; renaming the label never moves the directory
subsystem = "solar"
parent = "l3_solar"
kind = "declared"
owner = "environment"
tier = "A"
criticality = "minor"   # minor | significant — significant means two reviewers and a differential fill
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# It sits immediately before sw_forecast_skill and sw_forecast_bias, the two
# rows that read it. Twelve rows were shifted by one to open the slot, because
# an argument printed after the functions that take it reads backwards.
order = 1349
state = "published"

# WHY THIS IS A SUBSYSTEM ROW AND NOT A SYSTEM-LAYER ONE.
#
# The long lead already exists and comes down from the mission:
# orbit_mission_duration, declared and confirmed, and three rows in this group
# read it as a lead today. This is the OTHER lead — the short one — and it is a
# different kind of thing.
#
# 27 days is not a number the mission chose. It is the synodic solar rotation,
# and it is the length of the outlook SWPC actually publishes: every issue in
# forecast_issued.csv carries exactly 27 rows. Putting it at layer 2 would imply
# somebody negotiated it, and nobody did — it is a property of the Sun and of
# the data source, which is what this subsystem owns.
#
# The nearest existing system-layer row is
# sys_navigation_and_orbit_determination_prediction_horizon, which is ephemeris
# prediction. Different quantity; not reused.

[question]
text = "How far ahead does the published short-term outlook reach?"
note = "The lead the forecast-verification rows are evaluated at. sw_forecast_skill and sw_forecast_bias both answer 'at what lead', and this is the lead worth asking about: the end of the published window, where the outlook is weakest and a design reading it is most exposed."

[maths]
confirmed_by = "A. Rai / 2026-09-14"   # a person read this relation against its source
expression = "L_short = 27 d"
source = "noaa_swpc"

[[assumption]]
text = "One lead, and the skill of the outlook is strongly lead-dependent"
fails_when = "measured on this record the issued outlook LOSES to persistence at leads 1 to 4, beats it from 5 to 23 with a peak skill of +0.24 near 13, and loses again from 24. So a single lead cannot characterise the product: 27 days is the pessimistic end and a row evaluated there says nothing about the useful middle. It is chosen because a design wants to know how bad the far edge is, not how good the centre is, and because it is the window's own length rather than a point somebody picked inside it."

[[assumption]]
text = "27 days is the rotation and the window at once, and those are two different reasons"
fails_when = "the synodic solar rotation is about 27.3 days and the published outlook is exactly 27 rows, so the two coincide closely enough that the sheet cannot tell them apart. If SWPC changed the outlook length the row would need to say which reason it meant. It is carried as 27 exactly, matching the data rather than the rotation, because what it indexes is the forecast table."

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "L_short"
type = "Time"
unit = "Day"
lower = 1.0
upper = 27.0
reason_lower = "a lead of less than a day is not a forecast the published outlook makes; its first row is lead 1"
reason_upper = "27 is the length of the published window and the last lead the forecast table contains. Beyond it there is no issued forecast to verify against, so a larger value would be asking the verification rows about rows that do not exist"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 27.0
confirmed_by = "A. Rai / 2026-09-14"

[view]
kind = "number"
