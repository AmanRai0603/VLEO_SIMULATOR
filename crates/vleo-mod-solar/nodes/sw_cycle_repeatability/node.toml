# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "sw_cycle_repeatability"
label = "Cycle-to-cycle repeatability"
folder = "sw_cycle_repeatability"   # frozen at seed; renaming the label never moves the directory
subsystem = "solar"
parent = "l3_solar"
kind = "declared"
owner = "environment"
tier = "A"
criticality = "minor"   # minor | significant — significant means two reviewers and a differential fill
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
order = 1345
state = "published"

# A statistic of the pinned record with no input, so it is declared rather than
# computed. There is nothing to compute it FROM inside the tree, and the number
# must be re-measured if the bundle version changes.

[question]
text = "How much does one solar cycle repeat the shape of the last one?"
note = "The correlation between cycles 23 and 24 after stacking both on phase. It is the credibility of sw_mean_cycle_level: that row hands a design a mean-cycle curve, and this row says how much a single cycle can be expected to look like it. The answer is that the SHAPE repeats and the AMPLITUDE does not, and a design that reads only the correlation will miss the second half."

[maths]
confirmed_by = "A. Rai / 2026-09-14"   # a person read this relation against its source
expression = "r_cyc = corr(F107 of cycle 23 by phase, F107 of cycle 24 by phase) = 0.7701"
source = "noaa_swpc"

# WHERE THIS RELATION CAME FROM. Prose, outside the sheet hash: correcting a
# sentence here does not invalidate a generated artefact. The tab before this one
# states the relation; this says why it is that relation, and the tab after it
# shows what the machine made of it.
[theory]
why = """
sw_mean_cycle_level hands a design the shape of the average cycle, built
from two. This row asks whether an object like that is worth anything —
whether a solar cycle repeats the one before it. The answer has to come in
two parts, and the reason is a property of the statistic rather than a
property of the Sun: a correlation is scale-free, so the obvious measure of
'do these two look alike' is structurally blind to the one thing a drag
design cares about. So the shape and the amplitude are measured separately,
and the second measurement is the one that carries the warning.
"""
reading = """
There is no distribution behind 0.77. The record holds exactly two complete
cycles, so this is a single observation of a correlation and not an estimate
of one, and two samples cannot tell a repeatable shape from a coincidence
between two particular cycles. No further analysis of this bundle can fix
that; it needs a longer record. Every consumer of the mean-cycle curve
inherits the limit, and the honest summary is narrow: these two cycles rose
and fell alike, and were not the same size.
"""

[[theory.step]]
text = """
Put both complete cycles on one axis. Each is stacked on phase in the same
twenty bins used by sw_mean_cycle_level, which turns two records of unequal
length into two curves that can be compared point for point.
"""

[[theory.step]]
text = """
Correlate the two curves. Pearson's r over the bins asks whether they rise
and fall together, which is the question 'does the cycle have a repeatable
shape' in measurable form.
"""
math = "r = cov(x, y) / (sd(x) * sd(y)) over the bins both cycles populate"

[[theory.step]]
text = """
Which bins count is a decision with a number attached, so it is stated
exactly. 273 consecutive days are absent from the record, 2017-01-01 to
2017-09-30, and they fall at cycle 24's phase 0.735 to 0.803: bin 15 is
emptied entirely and bin 14 is left with 141 days against the usual 201. The
rule is that a bin needs at least 150 days from BOTH cycles, which keeps 18.
Including the thin bin gives 0.7756 rather than 0.7701 — a small difference,
and the reason the rule is written as a threshold instead of as 'the bins
both cycles populate', which would be read as 19.
"""
math = "r over 18 bins = 0.7701; over 19 = 0.7756"

[[theory.step]]
text = """
0.77 means the two stacked cycles share 59 per cent of their variance. The
shape repeats, and it does not repeat exactly.
"""
math = "r^2 = 0.593"

[[theory.step]]
text = """
Now the part the correlation cannot see. Multiply one of the two curves by
any positive constant and r does not move at all — that is what scale-free
means — and the constant is precisely the amplitude a drag design needs. So
a correlation near one would be entirely compatible with two cycles
differing by a factor of two in flux.
"""
math = "r(x, y) = r(x, a*y) for every a > 0"

[[theory.step]]
text = """
So amplitude is measured separately, and it disagrees. The phase-stacked
peaks are 206.9 sfu for cycle 23 and 149.4 for cycle 24, a ratio of 0.722,
and the published smoothed peaks of 196.4 and 146.1 agree at 0.744. The rms
difference between the two curves is 37.7 sfu against a pooled mean near
112.
"""

[[theory.step]]
text = """
Two findings, then, and a design that reads only the first will be wrong in
the direction that costs it: the cycles rise and fall alike at r = 0.77, and
they are not the same size, at a peak ratio of 0.72 and an rms difference of
a third of the mean.
"""


[[assumption]]
text = "It is one pair of cycles, so there is no distribution behind this number"
fails_when = "0.77 is read as an expected repeatability with an uncertainty. The record holds exactly two complete cycles, 23 and 24, and cycle 25 is still running, so this is a single observation of a correlation and not an estimate of one. Two samples cannot tell a repeatable shape from a coincidence between two particular cycles, and nothing in this bundle can fix that: it needs a longer record. Every consumer of sw_mean_cycle_level inherits this limit"

[[assumption]]
text = "The shape repeats at 0.77 and the amplitude does not repeat at all, and these are separate findings"
fails_when = "the correlation is taken as the whole answer. A correlation is scale-free, so it is blind to exactly the thing a drag design cares about. Cycle 23's binned peak is 206.9 sfu and cycle 24's is 149.4, a ratio of 0.722 — the published smoothed peaks, 196.4 and 146.1, agree at 0.744 — and the rms difference between the two phase-stacked curves is 37.7 sfu against a pooled mean near 112. So the two cycles rise and fall alike and are not the same size. A mission sized on the mean of the two is sized for neither"

[[assumption]]
text = "Two of the twenty phase bins are excluded, because 273 consecutive days are absent from the record"
fails_when = "the bin count is assumed complete. observed_daily.csv carries 10319 rows across a 10592-day span and the whole shortfall is one contiguous gap, 2017-01-01 to 2017-09-30. That gap sits at cycle 24 phase 0.735 to 0.803, which empties bin 15 entirely and leaves bin 14 with 141 days against the usual 201. The correlation is therefore taken over the 18 bins in which BOTH cycles hold at least 150 days, which drops bin 15 for being empty and bin 14 for being thin. An earlier wording here said 'the 18 bins both cycles populate', which was imprecise and would have been read as 19: bin 14 is populated, with 141 days. Including it gives 0.7756 instead of 0.7701, so the rule is worth stating exactly rather than approximately. The gap is on the declining side where F10.7 is low and slowly varying, so its effect on a shape correlation is small; it is excluded rather than interpolated because interpolating across nine months invents the data"

[[assumption]]
text = "Twenty equal-width phase bins, and cycle length is taken from the published boundaries"
fails_when = "the boundaries move. Cycle 23 spans 4338 days and cycle 24 spans 4017, an 8 per cent difference, so an equal-PHASE bin is a different number of DAYS in each cycle — 217 against 201. Stacking on phase rather than on days since minimum is the choice that lets two unequal cycles be compared at all, and it means this row says nothing about whether the two cycles took the same TIME to do the same thing. They did not"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "r_cyc"
type = "Ratio"
unit = "One"
lower = 0.4
upper = 0.95
reason_lower = "below 0.4 the two stacked cycles would share less than 16 per cent of their variance, which would say the solar cycle has no repeatable shape at all. The measured value is 0.770 for 59 per cent shared, and the asymmetric fast rise and slow decline is present in both cycles, so a value that low means the stacking or the boundaries are wrong rather than the Sun being irregular"
reason_upper = "above 0.95 the two cycles would be near-identical in shape, which the record contradicts: the rms difference between the two phase-stacked curves is 37.7 sfu on a pooled mean near 112, and their peaks differ by 28 per cent. An answer that high means the correlation was taken over too few bins or after a normalisation that removed the disagreement"

