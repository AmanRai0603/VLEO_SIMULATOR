# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "sw_semiannual_amplitude"
label = "Semiannual Ap amplitude"
folder = "sw_semiannual_amplitude"   # frozen at seed; renaming the label never moves the directory
subsystem = "solar"
parent = "l3_solar"
kind = "declared"
owner = "environment"
tier = "A"
criticality = "minor"   # minor | significant — significant means two reviewers and a differential fill
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
order = 1361
state = "published"

# A statistic of the pinned record with no input, so it is declared rather than
# computed. It is the AMPLITUDE of the annual pattern, which is one number; the
# pattern's value at a particular date would be a different row and would read
# sys_mission_requirements_mission_epoch for the day of year.

[question]
text = "How large is the semiannual variation in geomagnetic activity?"
note = "Geomagnetic activity is higher near the equinoxes than near the solstices — the equinoctial or Russell-McPherron effect, from the changing angle between the interplanetary field and the geomagnetic dipole. This row says how big that seasonal swing is in Ap. It matters for a drag design because Ap drives the density model, but the size of the effect is the point: it moves the mean by about a tenth and predicts almost nothing about a given day."

[maths]
confirmed_by = "A. Rai / 2026-09-14"   # a person read this relation against its source
expression = "Ap(doy) = 10.4936 + A*cos(4*pi*(doy-1)/365.25 - phi),  A = 1.2781"
source = "noaa_swpc"

# WHERE THIS RELATION CAME FROM. Prose, outside the sheet hash: correcting a
# sentence here does not invalidate a generated artefact. The tab before this one
# states the relation; this says why it is that relation, and the tab after it
# shows what the machine made of it.
[theory]
why = """
Geomagnetic activity has a seasonal pattern that is not a seasonal pattern
on Earth: it peaks near both equinoxes and dips near both solstices, twice a
year. The mechanism is geometric. The solar wind's magnetic field is carried
in a frame fixed to the Sun, and how efficiently it couples into the
magnetosphere depends on the angle between that field and the Earth's dipole
— an angle whose annual sweep passes through its most favourable value
twice, near the equinoxes. That is the Russell-McPherron effect. This row
measures how big the resulting swing is, and the answer's SIZE is the point:
it moves the mean by about a tenth and predicts almost nothing about a given
day.
"""
reading = """
A shift in the mean, visible only in aggregate. The fit accounts for 0.63
per cent of the daily variance, and daily Ap has a standard deviation of
11.34 against a mean of 10.50 — so storm-to-storm variation exceeds the
season by more than an order of magnitude. It belongs in a monthly or annual
budget and is worthless as a daily correction. The amplitude is also
ADDITIVE in Ap, so it is a 12 per cent modulation at the record's mean and
would be 1.3 per cent at a storm level of 100; since the mechanism modulates
a coupling efficiency, the additive form understates the effect during
active periods and overstates it during quiet ones.
"""

[[theory.step]]
text = """
The expected shape comes from the mechanism rather than from the data. A
geometric angle that sweeps once a year and is most favourable twice per
sweep produces a signal at TWICE the annual frequency, so the term to fit is
a cosine of period half a year.
"""
math = "Ap(doy) ~ offset + A * cos(4*pi*(doy - 1)/365.25 - phi)"

[[theory.step]]
text = """
Fit that one term to the whole daily record by least squares — 10299 values
from 1997-01-09 to 2025-12-31 — solving for the offset, the amplitude and
the phase together. Nothing about the equinoxes is supplied to the fit.
"""
math = "offset = 10.4936, A = 1.2781 Ap"

[[theory.step]]
text = """
Now the test that distinguishes a physical effect from an arbitrary
harmonic: where did the fitted maxima land? At days of year 96.8 and 279.4 —
6 April and 6 October — within a week of both equinoxes, from a fit that was
given no knowledge of them. That is the signature being measured rather than
a curve being drawn.
"""

[[theory.step]]
text = """
The monthly means agree independently and without any fitting at all:
September at 11.88 and October at 11.84 at the top, December at 8.33 and
January at 8.61 at the bottom, a peak-to-trough ratio of 1.43.
"""

[[theory.step]]
text = """
And now the size, which is what a designer needs from this row. The fitted
amplitude explains 0.6347 per cent of the total variance of daily Ap. The
pattern is certain and it is small.
"""
math = "A / offset = 0.122; R^2 = 0.006347"

[[theory.step]]
text = """
One harmonic cannot carry everything the record shows. The two fitted maxima
are equal by construction and the observed ones are not — the autumn peak
reaches 11.88 against a spring peak near 11.39 — so an annual asymmetry is
being folded into the residual. Separating an annual term from the
semiannual one would fit better and would be a different row.
"""


[[assumption]]
text = "The seasonal signal is real and explains 0.63 per cent of the daily variance"
fails_when = "the amplitude is used to predict a day. Least squares over 10299 daily Ap values from 1997-01-09 to 2025-12-31 gives an amplitude of 1.278 on an offset of 10.494 — a swing of about 12 per cent about the mean — and the fit accounts for 0.006347 of the total variance. Daily Ap has a standard deviation of 11.34 against a mean of 10.50, so storm-to-storm variation dwarfs the season by more than an order of magnitude. The signal is a shift in the MEAN, visible only in aggregate: it belongs in a monthly or annual budget and is worthless as a daily correction"

[[assumption]]
text = "The maxima land on the equinoxes, which is how the fit is known to be the physical effect and not a fitting artefact"
fails_when = "the phase is ignored. The fitted maxima are at day of year 96.8 and 279.4 — 6 April and 6 October — within a week of both equinoxes, and the fit was given no knowledge of them. The monthly means agree independently: September 11.88 and October 11.84 at the top, December 8.33 and January 8.61 at the bottom, a peak-to-trough ratio of 1.43. Nothing was tuned to make that happen, so the 1.278 is measuring the equinoctial effect rather than an arbitrary harmonic"

[[assumption]]
text = "It is an additive amplitude in Ap, not a multiplicative one, and the distinction matters at high activity"
fails_when = "it is applied at an activity level far from the record's mean. The fit adds and subtracts 1.278 Ap regardless of the underlying level, so at the record's mean of 10.5 it is a 12 per cent modulation and at a storm level of 100 it would be 1.3 per cent. The physical mechanism is a modulation of coupling efficiency and so is closer to multiplicative, which means this additive form understates the seasonal effect during active periods and overstates it during quiet ones. It is carried additively because that is the form the record was fitted in, and a multiplicative version would need refitting on the log"

[[assumption]]
text = "One harmonic, so the annual and the semiannual are not separated"
fails_when = "an annual asymmetry is present, and one is: the two fitted maxima should be equal by construction, and the monthly means are not — the autumn peak near September and October reaches 11.88 while the spring peak near May reaches 11.39. A single semiannual term cannot represent that difference and folds it into the residual. Separating an annual from a semiannual term would be a better fit and a different row"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "A_sa"
type = "Ratio"
unit = "One"
lower = 0.5
upper = 3.0
reason_lower = "below 0.5 Ap the seasonal swing would be under 5 per cent of the mean and indistinguishable from the scatter between the record's individual months, whose means range 8.33 to 11.88. A value there means the fit lost the signal"
reason_upper = "above 3.0 Ap the modelled peak-to-trough swing would exceed 6 Ap, more than half the record's mean of 10.5 and larger than the observed spread of the monthly means, which is 3.55 from December to September. An answer that large means an annual or cycle term leaked into the semiannual one"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 1.278112
confirmed_by = "A. Rai / 2026-09-14"

[data]
# Pinned to solar-weather@2026.09.14; this list can only pin the NAME. The
# numbers must be re-measured if the bundle version changes.
bundles = ["solar-weather"]

[view]
kind = "number"
