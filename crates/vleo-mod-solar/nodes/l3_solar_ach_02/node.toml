# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "l3_solar_ach_02"
label = "Closure — F10.7, single day"
folder = "l3_solar_ach_02"   # frozen at seed; renaming the label never moves the directory
subsystem = "solar"
parent = "l3_solar"
kind = "achieved"
owner = "environment"
tier = "A"
criticality = "minor"   # minor | significant — significant means two reviewers and a differential fill
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
order = 1335
state = "published"

# THIS ROW USED TO BE A DUPLICATE OF ach_01 AND IS NOW A DIFFERENT MEASUREMENT.
#
# It restated sw_f107_design, exactly as ach_01 did, and its whole sheet was an
# argument for why the duplication was honest: layer 2 declares
# sys_space_environment_solar_flux and sys_space_environment_f10_7 as separate
# rows, each needed a partner here, and at layer 3 the solar flux IS F10.7.
#
# §20 resolves it twice over. The subsystem now publishes a sustained level and
# a single day rather than one design number, so the two pairs have two
# questions to answer; and §20.5 gives the two layer-2 rows different content —
# _solar_flux receives the whole driver set, _f10_7 receives the design value —
# so the layer-2 duplication that forced this row into existence is gone too.
#
# ach_01 restates sw_f107_design_long at 104.07; this restates
# sw_f107_design_short at 124.14, the same sustained level with the
# within-rotation daily excursion of 20.07 on top — that excursion read at the
# level the rotation sits at, which is what moved this row from 138.30.

# WHY THIS ROW STOPPED BEING A RESTATEMENT.
#
# It used to read one input and return it unchanged: its whole body was
# `let ach = conclusion;`. Measured against the row beneath it, it produced the
# same number under every perturbation -- it WAS that row, under a second name,
# and a tree with two names for one number is a tree nobody can read.
#
# Worse, the closure it was supposed to be half of did not exist. Nothing read
# the requirement at all. l3_solar_req_03's own sheet says so in as many words:
# "Nothing in the tree compares 158.4 against 132 automatically; the three
# exceedance rows measure it and a person reads them." A design tool that
# cannot close its own requirement is not closing anything.
#
# So it now reads BOTH sides and publishes what neither of them holds: the
# signed fractional margin, in the sense the requirement declares. Positive is
# room, negative is a violation and its size. That is a third number, it is the
# one a designer actually acts on, and it moves when either side moves.
#
# The shape is the twelve KPI closures' -- mission::closure(req, ach, sense) --
# because a second way of computing a margin is a second way of getting its
# sign wrong.

[question]
text = "How much room does the single-day F10.7 requirement have left?"
note = """
The single-day half of the F10.7 closure. Its partner, l3_solar_req_02, commits
the design to surviving 350 sfu — above the largest daily value in the record —
and this says what the window's own band actually reaches.
"""

[maths]
# An achieved row restates the subsystem's conclusion on the side of the
# comparison the closure reads. It computes nothing of its own.
expression = "M_f107_short = closure(F107_req_short, F107_short, AtMost).margin"
source = "noaa_swpc"

# WHERE THIS RELATION CAME FROM. Prose, outside the sheet hash: correcting a
# sentence here does not invalidate a generated artefact. The tab before this one
# states the relation; this says why it is that relation, and the tab after it
# shows what the machine made of it.
[theory]
why = """
A closure is a comparison between what is required and what is achieved, and it
is only checkable if both sides are rows. The requirement side is
l3_solar_req_02, a declared commitment about the vehicle; this is the achieved
side, and it is an identity on sw_f107_design_short.

WHICH conclusion it restates is the content of the row, because the subsystem
has three F10.7 conclusions a reader could mistake for each other:
sw_f107_design_long at 104.07 (the level the mission sustains for months),
sw_f107_design_short at 124.14 (a day inside that level) and sw_f107_design at
200.14 (a one-sided persistence drift from today's value, which since §20 step 5
is the achieved side of no closure at all). Restating the wrong one would move
this closure without anything in the tree noticing, because all three are fluxes
in the same range with the same unit and the same declared domain.
"""
reading = """
124.14 sfu at the declared window, against a ceiling of 350. The gap is large
and, unlike ach_01's, it means something: the achieved side is where the
window's ORDINARY band reaches and the requirement is where the record's worst
observed day sits, 343 sfu on 2023-02-17. A design is entitled to have both, and
the distance between them is the distance between a design band and an extreme.

The two terms behind the number are worth separating. 104.07 of it is the
sustained level — a centre of 86.85 with 1.28 standard deviations of the
rotation-forecast residual — and 20.07 is the within-rotation daily excursion AT
THAT LEVEL. This row read 138.30 until sw_daily_band_spread was conditioned on
the rotation level; the old single number, 34.23, was measured over rotations
averaging 136.63 sfu and applied at 104.07.

So the daily term is under a sixth of the answer here, where on the Ap side it
is seventy per cent: a design that treats the daily excursion as a detail is
making a different mistake on flux than on the geomagnetic index.
"""

[[theory.step]]
text = """
The closure to be made checkable is single-day F10.7 achieved against
single-day F10.7 required. Both sides must be rows, at the same layer, in the
same quantity and unit, or the comparison is not something the tree can verify.
"""

[[theory.step]]
text = """
The requirement side is a declared commitment with a person's name against it.
The achieved side must be the subsystem's own conclusion and nothing else, so
this row is an identity on sw_f107_design_short.
"""
math = "F107_ach = F107_short = 124.14 sfu"

[[theory.step]]
text = """
Which makes the closure arithmetic trivial and the closure itself informative:
124.14 achieved against 350 required, and the room between them is the room
between what the window presents and what the record's worst day has shown.
"""
math = "124.14 <= 350 — the closure holds"

[[theory.step]]
text = """
Note what the pass does NOT establish. It is a ceiling on an INDEX, and what a
spacecraft feels is the density that index produces at its altitude, through a
model this subsystem does not own. It also stacks two one-sided percentiles, so
the day it describes is rarer than the confidence attached to it.
"""

[[assumption]]
text = "It inherits every limitation of the row it restates, and a closure reading it sees none of them"
fails_when = "a margin is computed from this row against a capability. The centre beneath it is a cycle analogue at the mission's own epoch, scaled beyond one cycle past cycle 25's maximum by the mean amplitude of two completed cycles whose peaks differ by 41 per cent; the band around it is 1.28 sigma, the 90th percentile, while the run is labelled 95 per cent; and the daily term stacked on top is a separate one-sided percentile, so the combination is nearer a 1-in-100 day than a 1-in-20 one. None of that travels across the closure, and the margin looks like a clean number either way"

[[assumption]]
text = "It restates the single-day level and not one of its two siblings"
fails_when = "somebody reads it as the sustained level or as the persistence drift. The three are 124.14, 104.07 and 200.14 — all fluxes, same unit, same declared domain — so nothing in the tree would catch the substitution, and each would report a different margin against the same requirement"

[[assumption]]
text = "Nothing compares this row with its requirement automatically"
fails_when = "a reader assumes the tree checks the closure. The pairing is a convention the matrix draws; `sense` is declared on the requirement row and the gate checks only that it is present. The Ap storm closure in this same group, l3_solar_req_03 against l3_solar_ach_03, currently FAILS at 158.38 against 150 and nothing in the tree says so"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "M_f107_short"
type = "Ratio"
unit = "One"
lower = -10.0
upper = 1.0
reason_lower = "a margin of -10 is a requirement exceeded by eleven times its own value. Below that the comparison has stopped being a design margin and become a sign that one side is in the wrong unit, and it should refuse rather than report a number nobody will read as a fraction"
reason_upper = "1 is the whole of the requirement: an achieved value of zero against a positive bound. A margin above 1 under this sense would mean the achieved value is negative, which none of these drivers can be"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "ach"
var = "sw_f107_design_short"
type = "Ratio"

[[input]]
# The requirement this closes against. `req` is not decoration: the gate reads
# this binding to decide the row IS a closure, and check 7e then requires the
# hole to apply the sense the requirement declares.
binding = "req"
var = "l3_solar_req_02"
type = "Ratio"

[[algorithm.step]]
number = 1
text = "compare achieved against required in the declared sense and return the signed fractional margin"
binds = "m"
type = "Ratio"

[view]
kind = "line"
over = "orbit_mission_duration"
points = 60
