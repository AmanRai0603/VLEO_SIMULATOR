# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "l3_solar_ach_02"
label = "F10.7"
folder = "l3_solar_ach_02"   # frozen at seed; renaming the label never moves the directory
subsystem = "solar"
parent = "l3_solar"
kind = "achieved"
owner = "environment"
tier = "A"
criticality = "minor"   # minor | significant — significant means two reviewers and a differential fill
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
order = 1333
state = "published"

# THE ACHIEVED SIDE ONLY. Its paired requirement row, l3_solar_req_02, is
# still seeded and cannot be written here: layers/l3_solar.toml says a required
# row in this group states THE WORST SKY THIS DESIGN CAN SUSTAIN, which is a
# spacecraft capability and not something the solar record knows. That number is
# a declared value somebody confirms, and an agent may not supply one.
#
# So the closure this pair exists to make does not close yet. What exists is the
# environmental half, on a row, with its provenance — which is the half this
# subsystem owes.

[question]
text = "What F10.7 does the record say this mission will present, at 95% confidence?"
note = "The F10.7 driver on the achieved side. It is the same quantity as ach_01 in this subsystem because the solar flux IS F10.7 here — the layer-2 rows separate them and the subsystem does not, which is a finding rather than a design and is stated in the assumptions."

[maths]
# An achieved row restates the subsystem's conclusion on the side of the
# comparison the closure reads. It computes nothing of its own.
expression = "F107_ach = sw_f107_design"
source = "noaa_swpc"

# WHERE THIS RELATION CAME FROM. Prose, outside the sheet hash: correcting a
# sentence here does not invalidate a generated artefact. The tab before this one
# states the relation; this says why it is that relation, and the tab after it
# shows what the machine made of it.
[theory]
why = """
There is no derivation here that ach_01 does not carry, and inventing one
would be dishonest. The row exists because layer 2 declares
sys_space_environment_solar_flux and sys_space_environment_f10_7 as separate
quantities and the seeder mirrored both into this group. In the study they
are one quantity: F10.7 IS the solar flux index, and nothing in prf_drivers
distinguishes them. So two rows here answer with one number, and the
redundancy belongs to the layer-2 decomposition rather than to this
subsystem.
"""
reading = """
The duplication is real and is declared rather than disguised. Resolving it
is a decision about what layer 2 means — either
sys_space_environment_solar_flux means something other than F10.7, such as
the headline with its credibility attached, or one of the two rows should
not exist. Whoever settles what an interface publishes should settle this at
the same time, because both questions are about the same seam.
"""

[[theory.step]]
text = """
The quantity is the same as ach_01's and so is the number, because at layer
3 the solar flux and F10.7 are the same measurement. Two rows are written
because two partners exist above, not because two quantities exist below.
"""

[[theory.step]]
text = """
Writing one row and leaving the other seeded was the alternative, and it is
worse: an unseeded partner at layer 2 would read as an unanswered question
rather than as a duplicated one, and the duplication is the finding.
"""

[[theory.step]]
text = """
Inventing a difference between them was the other alternative, and it is
worse still. Any distinction written here to justify two rows would be a
claim about the quantity that the study's own data does not support.
"""
math = "F107_ach = F107_design = 228.14 sfu — identical to ach_01, on purpose"


[[assumption]]
text = "It inherits every limitation of the row it restates, and a closure reading it sees none of them"
fails_when = "the same cost as the interface, and worth repeating on the row a closure actually binds. The number is sized on the record's unconditional mean rather than on the mean cycle at the mission's epoch — the epoch is published and this chain does not yet read it, which is an open decision on sw_central_expectation worth 6.7 sfu; where it is a percentile it is the 95th and not a worst case; and where it is a return level its top end rests on two observations in 28.2 years. A margin computed from this row against a capability carries none of that, and will look like a clean number either way."
[[assumption]]
text = "ach_01 and ach_02 carry the same number, because at layer 3 the solar flux IS F10.7"
fails_when = "sys_space_environment declares sys_space_environment_solar_flux and sys_space_environment_f10_7 as separate rows, and the seeder mirrored both into this group. In the study they are one quantity: F10.7 is the solar flux index, and nothing in prf_drivers distinguishes them. So two rows here answer with one number, which is honest but redundant, and the redundancy belongs to the layer-2 decomposition rather than to this subsystem. Whoever settles what an interface publishes should settle this at the same time — either sys_space_environment_solar_flux means something else, such as the headline with its credibility, or one of the two rows should not exist."

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "F107_ach"
type = "Ratio"
unit = "One"
lower = 60.0
upper = 400.0
reason_lower = "the same floor as env_f107: below 60 sfu has never been observed"
reason_upper = "the same ceiling as env_f107: above 400 sfu every consumer of F10.7 is extrapolating"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "conclusion"
var = "sw_f107_design"
type = "Ratio"

[[algorithm.step]]
number = 1
text = "restate the subsystem's conclusion on the achieved side of the closure"
binds = "ach"
type = "Ratio"

[view]
kind = "line"
over = "orbit_mission_duration"
points = 60
