# Known-good values, and where each came from.
#
# The one rule: an expected value may never be produced by the code
# under test. The schema refuses a row whose provenance is the
# implementation, because a number worked out by the thing being
# checked proves nothing.
#
# The mean F10.7 of cycles 23 and 24, stacked on phase in twenty bins, counted
# outside this crate from bundles/solar-weather. Each fixture sits AT a bin
# centre where the relation returns the tabulated mean exactly, so the tolerance
# is transcription-tight. The 0.775 bin holds 217 days rather than ~418 because
# the two cycles have different lengths and the stacking leaves it thin — that is
# the record's shape, and it is pinned rather than smoothed.

