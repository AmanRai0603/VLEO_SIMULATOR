# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "sw_design_safe_duration"
label = "How long the design Ap lasts"
folder = "sw_design_safe_duration"   # frozen at seed; renaming the label never moves the directory
subsystem = "solar"
parent = "l3_solar"
kind = "computed"
owner = "environment"
tier = "A"
criticality = "significant"   # minor | significant — significant means two reviewers and a differential fill
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
order = 1392
state = "published"

# THE ROW THAT ANSWERS "WILL IT FAIL" WITH A DATE RATHER THAN A PROBABILITY.
#
# sw_storm_return_level maps a mission length to the Ap that recurs once within
# it. This row inverts that map: given what the vehicle is built for, how long
# can the mission be before the record expects to exceed it?
#
# It is the same fit read the other way round, so it cannot disagree with
# sw_storm_return_level. Ap(T) = 92.515531 + 40.926516 ln(T) inverts to
# T = exp((Ap - 92.515531) / 40.926516), in closed form, with no table and no
# interpolation.
#
# AT THE DECLARED G3 THE ANSWER IS 2.62 YEARS, AND THE MISSION IS 5.
#
#     G1  Ap  48   exceeded beyond 0.337 years
#     G2  Ap  80   exceeded beyond 0.737 years
#     G3  Ap 132   exceeded beyond 2.624 years
#
# So a five-year mission at G3 is past this point by 2.4 years, and at the
# declared length the record expects Ap 158.4 — 26.4 above the design bound and
# 8.4 above the requirement of 150, which l3_solar_req_03 sets out. The
# requirement itself is first exceeded beyond 4.07 years.
#
# What that costs is the three exceedance rows: 0.284 days a year above the
# bound, 1.14 days per event, median cycle phase 0.603. Roughly thirty-four
# hours outside the design environment over a five-year mission, in one or two
# one-day events, on the declining side of the cycle where the epoch sits.

[question]
text = "How long can the mission be before the record expects to exceed the design Ap?"
note = "The inverse of sw_storm_return_level, read against sw_ap_design. At the declared G3 it is 2.62 years against a declared mission of 5 — so the answer to whether the design is exceeded is yes, and this is when it starts."

[maths]
expression = "T_safe(Ap_design) = exp((Ap_design - 92.515531) / 40.926516)"
source = "noaa_swpc"

# WHERE THIS RELATION CAME FROM. Prose, outside the sheet hash: correcting a
# sentence here does not invalidate a generated artefact. The tab before this one
# states the relation; this says why it is that relation, and the tab after it
# shows what the machine made of it.
[theory]
why = """
The three exceedance rows answer how often, how long and when. This one
answers the question a programme manager asks instead of all three: how long
a mission could be before the record expects to exceed the design at all. It
is sw_storm_return_level read backwards — that row maps a mission length to
a storm level, and this one inverts the same fit — so it says nothing new
about the sky and everything about how to read the design decision.
"""
reading = """
A return period is not a countdown and a mission is not guaranteed its
share. A once-per-2.62-years storm can arrive in the first month or not in
ten years; what 2.62 means is that the expected COUNT of such days over a
2.62-year window is one. Over the declared five-year mission the expected
count is 1.42 days, which sw_exceedance_rate measures directly and which is
the figure to plan with. This row is the threshold where that count passes
one, not a date on which anything happens.
"""

[[theory.step]]
text = """
sw_storm_return_level fits the level a mission of length T should expect.
The question here is the inverse: given a level the design can take, what T
makes that level the expectation? Same fit, solved the other way.
"""
math = "Ap = a + b*ln(T) => T = exp((Ap - a)/b)"

[[theory.step]]
text = """
Substituting the fitted coefficients gives a closed form, which is why this
row is exact where the three exceedance tables are interpolations.
"""
math = "T_safe(Ap) = exp((Ap - 92.515531) / 40.926516)"

[[theory.step]]
text = """
At the declared G3 bound of Ap 132 that is 2.62 years, against a declared
mission of 5. So the design is exceeded at a little over half the mission
length, and the mission is 1.9 times longer than its design bound survives.
"""
math = "T_safe(132) = exp(39.4845 / 40.9265) = 2.6242 yr"

[[theory.step]]
text = """
Every level below G4 is exceeded well inside a five-year mission, which is
the same conclusion the rate row reaches from the other direction.
"""
math = "G1: 0.3370 yr G2: 0.7365 yr G3: 2.6242 yr"

[[theory.step]]
text = """
A design that must NOT be exceeded at five years needs Ap 158.4, which is G4
territory — and sw_storm_design_level refuses G4 on purpose, so the refusal
and this number are the same decision seen twice.
"""

[[theory.step]]
text = """
The row inherits the whole fit including the part that rests on two storms,
so where the answer lands inside the fitted range of 0.5035 to 14.0986 years
is what decides whether to trust it. At G3 the answer of 2.62 years sits
comfortably inside; a design bound near Ap 200 would put it near the top,
where the curve is supported by two observations.
"""


[[assumption]]
text = "It is exceeded, and the number is when rather than whether"
fails_when = "the row is read as a safety margin. At G3 the answer is 2.6242 years and orbit_mission_duration is declared at 5, so the mission is 1.9 times longer than the design bound survives. At G2 it is 0.7365 years and at G1 0.3370 — every level the G scale offers below G4 is exceeded well inside a five-year mission. A design that must not be exceeded at five years needs Ap 158.4, which is G4 territory, and sw_storm_design_level refuses G4 on purpose"

[[assumption]]
text = "It inherits the whole fit, including the part of it that rests on two storms"
fails_when = "the answer lands near the top of the fitted range. This is sw_storm_return_level's relation read backwards, so every limitation of that row applies here unchanged: the fit is log-linear through ranks 2 to 56 of a 28.197-year sample, the fitted domain is 0.5035 to 14.0986 years, and the top of it rests on two observations. At the G3 bound the answer of 2.62 years sits comfortably inside the fitted range, which is the one thing that makes this row trustworthy at the declared level and would not survive a design bound near Ap 200"

[[assumption]]
text = "A return period is not a countdown and a mission is not guaranteed its share"
fails_when = "2.62 years is read as time before failure. A once-per-2.62-years storm can arrive in the first month or not in ten years; what the number means is that the expected count of such days over a 2.62-year window is one. Over the declared five-year mission the expected count is 1.42 days, which sw_exceedance_rate measures directly and which is the figure to plan with. This row is the threshold where that count passes one, not a date on which anything happens"

[[assumption]]
text = "Closed form, so it is exact where the table rows are not"
fails_when = "it is compared against an interpolated row and they disagree. The three exceedance rows read a three-point table and interpolate between anchors, which their sheets declare is wrong between them. This row evaluates the fit itself at any Ap the producer can supply, so it is exact at every point including the ones between G levels. If the two ever disagree about a value between anchors, this row is right and the tables are the approximation"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "T_safe"
type = "Time"
unit = "Year"
lower = 0.3
upper = 3.0
reason_lower = "the shortest this relation can return is 0.3370 years, at the G1 bound of Ap 48. A bound at 0.3 sits just under it. A value below would mean a design level under Ap 46, which is beneath anything the G scale calls a storm"
reason_upper = "the longest is 2.6242 years, at the G3 bound of Ap 132, which is the top of the declared G range. A bound at 3 sits just above it. It is NOT a claim that no design survives longer: Ap 207 at G4 would reach 16.4 years, and sw_storm_design_level refuses G4 deliberately rather than this guard forbidding it"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "ap_design"
var = "sw_ap_design"
type = "Ratio"

[[algorithm.step]]
number = 1
text = "invert the storm return fit: the mission length at which this Ap recurs once"
binds = "out"
type = "Time"

[data]
# Pinned to solar-weather@2026.09.14; this list can only pin the NAME. The
# numbers must be re-measured if the bundle version changes.
bundles = ["solar-weather"]

[view]
kind = "line"
over = "sw_storm_design_level"
points = 40
