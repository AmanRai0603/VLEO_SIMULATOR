# Known-good values, and where each came from.
#
# The one rule: an expected value may never be produced by the code
# under test. The schema refuses a row whose provenance is the
# implementation, because a number worked out by the thing being
# checked proves nothing.
#
# WHAT THESE ARE
#
# The same measured cycle shape sw_central_expectation reads, maximised over
# each window by an independent Python implementation of the declared relation.
# Shape, period, amplitudes and peak date were measured on bundles/solar-weather
# outside this crate from observed_daily.csv and solar_cycles.csv; as with its
# sibling, these are computed from the six-decimal values as transcribed into
# vleo-core, because the transcribed table is the specification.
#
# The epoch crosses the interface in SECONDS like every other Time.
#
# THREE OF THESE ARE PROPERTIES, and they are what make the row worth testing:
#
#   the fifteen-year case returns 193.858025 sfu EXACTLY — the completed-cycle
#   mean amplitude — because a window that long contains a whole cycle
#   maximum, where the shape is 1.000000 by construction. Any error in that
#   amplitude, or a shape that no longer peaks at exactly one, shows up here as
#   a changed digit rather than as a plausible number;
#
#   the half-year case equals the five-year case, 110.656273. Both windows open
#   at the same epoch and the peak falls inside the first half-year, so
#   lengthening the mission cannot lower the maximum. A monotonicity a sampled
#   implementation would break;
#
#   the 2039 case is the one that pins the handover limit. Its window sits
#   entirely in a cycle minimum straddling the amplitude step, so the largest
#   value in it is the supremum just inside cycle 25 — a limit the analogue
#   approaches and never attains. An implementation checking only ends and
#   knots returns 78.335701 there instead of 82.382143 and passes every other
#   case in this file. That mutation was run and this is the fixture that
#   caught it;
#
#   the 2018 case, 174.098642, is below cycle 25's own peak of 225.1358 even
#   though the window contains the maximum — because the window ends in
#   2023-01, before the maximum in 2024-09. A relation that had lost the window
#   and was maximising over the whole cycle would return 225.1358 here.


[[fixture]]
label = "the declared case — the highest sustained level a 2027 five-year mission meets"
expect = 110.65627313580244
tolerance = 1e-12
provenance = "independent-derivation"
source = "noaa_swpc"
inputs = { lead = 157788000.0, epoch = 852076800.0 }

