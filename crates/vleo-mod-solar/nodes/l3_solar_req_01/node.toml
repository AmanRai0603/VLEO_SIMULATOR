# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "l3_solar_req_01"
label = "F10.7, sustained"
folder = "l3_solar_req_01"   # frozen at seed; renaming the label never moves the directory
subsystem = "solar"
parent = "l3_solar"
kind = "declared"
owner = "environment"
tier = "A"
criticality = "significant"   # minor | significant — significant means two reviewers and a differential fill
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
order = 1330
state = "published"
# A ceiling, not a floor. The environment is something the vehicle must
# survive, so the requirement is satisfied by the sky being no worse than
# this, and the achieved row beside it must come in at or under.
sense = "<="

[question]
text = "What sustained F10.7 must this design operate in, for as long as the mission lasts?"
note = """
The headline requirement of the five, and the first `required` row written
anywhere in this repository — no other subsystem has one, so the shape here is
the shape the other sixteen will copy. It is a ceiling the environment must not
exceed, and l3_solar_ach_01 is the number the record actually presents.

WHAT THIS ROW USED TO ASK, AND WHY IT CHANGED. It asked "what solar flux must
this design survive?" with no horizon on it, and l3_solar_req_02 asked the same
thing again at 95 per cent confidence — two rows, one question, one number.
§20 splits every driver into a level the mission SITS AT for months and a level
one day inside it reaches, because a design uses them for different things: an
array is sized on the sustained level, a thermal transient on the day. This row
is now the sustained half and req_02 is the single day, so the duplication is
gone and two different commitments are stated instead of one commitment twice.
"""

[maths]
# NOT A CONFIRMATION. The relation `F107_req = 250 sfu` and its source are
# unchanged, and the person who read them read them against a sheet that asked a
# DIFFERENT question: "what solar flux must this design survive?", with no
# horizon on it. This row now commits to a sustained level specifically. The
# question is inside the sheet hash, so the confirmation is against a sheet that
# no longer exists. If the same commitment is meant, restoring the name is one
# edit — but it has to be somebody making it, not an agent keeping it.
confirmed_by = ""
expression = "F107_req = 250 sfu"
source = "orbitt_case_c1"

# WHERE THIS RELATION CAME FROM. Prose, outside the sheet hash: correcting a
# sentence here does not invalidate a generated artefact. The tab before this one
# states the relation; this says why it is that relation, and the tab after it
# shows what the machine made of it.
[theory]
why = """
A requirement is not a prediction and not a capability: it is a commitment,
and its purpose is to be checkable against something measured. This row
commits the design to surviving a solar flux, and the checking partner is
l3_solar_ach_01, which reports what the record actually presents. The pair
is the closure, and the whole reason a requirement lives on its own row —
rather than being inferred from the design value — is that a commitment
which silently tracked the design could never be violated and would
therefore never be a requirement.
"""
reading = """
It is a ceiling on the DRIVER and says nothing about what the driver does to
the vehicle. F10.7 is an index of solar radio flux; what a spacecraft feels
is the density that flux produces at its altitude, through a model this
subsystem does not own. A design that meets F10.7 <= 250 and is sized with
the wrong drag coefficient has met this requirement and will still deorbit
early. The margin also has no derivation behind it: 250 is a round number
above what the chain then achieved, chosen so the closure passes with visible
room rather than by a hair, and a design that wants the margin to mean
something specific should replace it with a number that has a derivation. The
achieved side has since fallen from 228.14 to 200.14 — sw_central_expectation
stopped using the record's unconditional mean — so the headroom this round
number happens to give has widened from 9.6 to 24.9 per cent. The requirement
has NOT been re-derived to match, and whether it should come down is a decision
rather than an arithmetic consequence.
"""

[[theory.step]]
text = """
Start from what a requirement row must be able to do: be violated. If the
committed number were computed from the design value it would track every
change to the design and would always pass, which makes the closure a
tautology. So the value is DECLARED — a person's number with their name
against it — and the sense says which side of it is safe.
"""
math = "F107 <= F107_req (sense: <=)"

[[theory.step]]
text = """
The number started from the capability the design chain produced WHEN IT WAS
WRITTEN, which was sw_f107_design — a one-sided 95th-percentile PERSISTENCE
growth on the central expectation. That row is no longer the achieved side of
this closure. sw_f107_design_long is, and it answers a different question: how
far the pattern has historically been from the rotation level it predicted,
which is the width of the window rather than the drift from today.
"""
math = "was F107_design = 200.14 sfu   ·   now F107_long = 104.07 sfu"

[[theory.step]]
text = """
A requirement set exactly at the capability has no room in it: any change in
mission length or epoch would break the closure without anything being
wrong. So a margin is added, and this one is a round number rather than a
calculation — 250 was the next round figure above the 228.14 the chain
achieved when this was written, 9.6 per cent of headroom.

THE HEADROOM IS NOW ABSURD AND THE NUMBER HAS NOT BEEN RE-DERIVED. The achieved
side is 104.07, so 250 is 140 per cent above it. Two changes did that: the
centre moved from the record's unconditional mean to the cycle analogue at the
mission's own epoch, and the achieved row changed from a persistence growth to
a band width. Whether 250 should come down is a decision and not an arithmetic
consequence — but a ceiling nothing can approach is a closure that cannot fail,
which is the one thing a requirement must be able to do.
"""
math = "250 / 228.14 = 1.096, when written   ·   250 / 104.07 = 2.402, now"

[[theory.step]]
text = """
The number does not move with the epoch and is not meant to. The record runs
64 to 343 sfu across a cycle, so a mission starting in 2030 near minimum
would find 250 enormously conservative — but the requirement is the
vehicle's capability, and the sky's variation belongs on the achieved side
of the closure where it can be seen.
"""

[[theory.step]]
text = """
This is the first `required` row written anywhere in this repository, so its
shape is the shape sixteen other subsystems will copy. Two things about that
shape are worth stating: the seed's kind = "required" means
computed-with-a-sense, and a committed number like this one is kind =
"declared" with a top-level sense.
"""


[[assumption]]
text = "250 is the design value with a round margin on it, and the margin is a decision rather than a calculation"
fails_when = "somebody looks for the derivation. Nothing in the record picks 250. It was the next round number above the 228.14 the chain achieved when it was written, 9.6 per cent of headroom, chosen so the closure passed with visible room rather than by a hair. THE ACHIEVED SIDE IS NOW 104.07 AND THE HEADROOM IS 140 PER CENT, which is no longer a margin — it is a ceiling the environment cannot reach, and a requirement that cannot be violated is not a requirement. Its Ap siblings l3_solar_req_04 and l3_solar_req_05 are set at published G-scale thresholds instead, which is a number a reader can check and which stays still while the environment estimate moves underneath it. This row should be re-derived the same way, and that is a decision rather than an arithmetic consequence."

[[assumption]]
text = "It is a ceiling on the DRIVER and says nothing about what the driver does to the vehicle"
fails_when = "the requirement is read as a survivability statement. F10.7 is an index of solar radio flux; what a spacecraft actually feels is the density that flux produces at its altitude, through a model this subsystem does not own. A design that meets F10.7 <= 250 and is sized on a density model with the wrong drag coefficient has met this requirement and will still deorbit early. The closure this row takes part in is on the environment, and the environment is only the first half."

[[assumption]]
text = "One number for the whole mission, with no epoch and no phase in it"
fails_when = "the mission slips. The record runs 64 to 343 sfu across a cycle, so the flux a mission sees depends on where in the cycle it flies; the declared epoch of 2027-01-01 sits at phase 0.619, past maximum on the declining side. A mission starting in 2030 would sit near minimum and 250 would be enormously conservative. The requirement does not move with the epoch and is not meant to — it is the vehicle's capability, and the sky's variation belongs on the achieved side."

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "F107_req"
type = "Ratio"
unit = "One"
lower = 60.0
upper = 400.0
reason_lower = "the same floor as env_f107: below 60 sfu has never been observed, so a requirement there could never be met and is not a requirement"
reason_upper = "the same ceiling as env_f107: above 400 sfu every consumer of F10.7 is extrapolating, and a requirement written past the range its consumers support is not checkable"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 250.0
# NOT A CONFIRMATION, and the number has NOT moved. See the note against the
# relation above: the question narrowed from "what flux must this design
# survive" to "what sustained flux must it operate in", and a confirmation is
# against a sheet rather than against a digit.
confirmed_by = ""

[view]
kind = "number"
