# Known-good values, and where each came from.
#
# The one rule: an expected value may never be produced by the code
# under test. The schema refuses a row whose provenance is the
# implementation, because a number worked out by the thing being
# checked proves nothing.
#
# WHAT THESE ARE
#
# The cycle shape, the period, both amplitudes and the peak date were measured
# on bundles/solar-weather outside this crate, in Python, from
# observed_daily.csv and solar_cycles.csv. Each expectation below is that
# construction evaluated at the fixture's inputs by the same independent script.
#
# WHAT THEY THEREFORE DO NOT CATCH, said plainly. The shape is transcribed into
# vleo-core to six decimal places, and these expectations are computed from
# those same six-decimal values rather than from the full-precision
# measurement — because the transcribed table IS the specification once it is
# written down. So these check the transcription and the arithmetic around it,
# and they cannot check that the measurement behind the table was right.
#
# The epoch crosses the interface in SECONDS like every other Time, whatever
# unit the sheet declares it in. 852076800 s is 9862 days is 2027-01-01.
#
# FOUR OF THESE ARE PROPERTIES RATHER THAN ARITHMETIC, and they are the ones
# that check the relation rather than the typing:
#
#   the fifteen-year case says that once the window spans more than a cycle the
#   mean settles near the record's own level — 105.7 against 114.8, below it
#   because cycles after this one are given the completed-cycle mean amplitude
#   rather than cycle 25's stronger one. A shape with a wrong overall level
#   breaks this and nothing else here would;
#
#   the one-period-later case USED TO BE a periodicity check and is now the
#   opposite: epoch 14040 is exactly 4178 days after 9862, so the SHAPE repeats
#   and the answer does not — 78.2 against 86.8 — because the amplitude hands
#   over from cycle 25's measured peak to the mean of the completed ones. A
#   build that had lost the handover would return 86.8 here and pass every
#   other case in this file;
#
#   the two epoch cases at either end of the declared range say the answer
#   depends on WHEN, which is the point of the row: the same five-year mission
#   is 115.0 sfu opening in 2018 and 144.9 opening in late 2032. A relation
#   that had quietly lost its epoch would still pass every arithmetic case here
#   and fail these two.


[[fixture]]
label = "the declared case — epoch 2027-01-01, a five-year mission"
expect = 86.84972489094359
tolerance = 1e-12
provenance = "independent-derivation"
source = "noaa_swpc"
inputs = { today = 150.0, lead = 157788000.0, epoch = 852076800.0 }

[[fixture]]
label = "fifteen years — the window spans more than a cycle, so the mean settles near the record's own level"
