# Known-good values, and where each came from.
#
# The one rule: an expected value may never be produced by the code
# under test. The schema refuses a row whose provenance is the
# implementation, because a number worked out by the thing being
# checked proves nothing.
#
# WHAT THESE ARE
#
# The cycle shape R, cycle 25's 81-day peak and the mean completed-cycle length
# were measured on bundles/solar-weather outside this crate, in Python, from
# observed_daily.csv and solar_cycles.csv. Each expectation below is that
# construction evaluated at the fixture's inputs by the same independent script.
#
# WHAT THEY THEREFORE DO NOT CATCH, said plainly. The shape is transcribed into
# the implementation to six decimal places, and these expectations are computed
# from those same six-decimal values rather than from the full-precision
# measurement — because the transcribed table IS the specification once it is
# written down. So these check the transcription and the arithmetic around it,
# and they cannot check that the measurement behind the table was right. Derived
# at full precision instead, every case here misses by a relative 8e-08, which
# is the size of the rounding and not a disagreement.
#
# The epoch crosses the interface in SECONDS like every other Time, whatever
# unit the sheet declares it in. 852076800 s is 9862 days is 2027-01-01.
#
# THREE OF THESE ARE PROPERTIES RATHER THAN ARITHMETIC, and they are the ones
# that check the relation rather than the typing:
#
#   the fifteen-year case says that once the window spans more than a cycle the
#   mean returns to the record's own unconditional climatology of 114.84 — so
#   the new relation degrades into the old one exactly where the old one was
#   right, and a shape with a wrong mean level would break it;
#
#   the periodicity case says that moving the epoch one whole cycle period
#   changes nothing, which is what the modulo claims and the part of the
#   relation a sign or fold error would silently break;
#
#   the two epoch cases at either end of the declared range say the answer now
#   depends on WHEN, which is the entire point of the change: the same
#   five-year mission is 116.8 sfu opening in 2018 and 168.1 sfu opening in
#   late 2032. A relation that had quietly lost its epoch would still pass
#   every other case here and fail these two.


[[fixture]]
label = "the declared case — epoch 2027-01-01, a five-year mission"
expect = 90.38771803612747
tolerance = 1e-12
provenance = "independent-derivation"
source = "noaa_swpc"
inputs = { today = 150.0, lead = 157788000.0, epoch = 852076800.0 }

[[fixture]]
label = "fifteen years — the window spans more than a cycle, so the mean returns to the record's own climatology of 114.84"
expect = 119.1016920687434
tolerance = 1e-12
provenance = "independent-derivation"
source = "noaa_swpc"
inputs = { today = 150.0, lead = 473364000.0, epoch = 852076800.0 }

