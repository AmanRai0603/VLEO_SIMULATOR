# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "sw_alert_threshold"
label = "Geomagnetic alert threshold"
folder = "sw_alert_threshold"   # frozen at seed; renaming the label never moves the directory
subsystem = "solar"
parent = "l3_solar"
kind = "declared"
owner = "environment"
tier = "A"
criticality = "minor"   # minor | significant — significant means two reviewers and a differential fill
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
order = 1348
state = "published"

# WHY THIS ROW EXISTS BESIDE sw_spike_threshold.
#
# "What counts as a spike" has two answers in this study and they are not the
# same quantity. sw_spike_threshold is a property of the F10.7 record — the
# scatter of the flux about its own baseline, which the repository measured.
# This row is a property of the FORECASTER: the level at which SWPC decided to
# put out an alert, which is not measured at all. It is read off alerts.csv,
# where every one of 17971 alerts carries the threshold that triggered it.
#
# One row could not carry both without one of the two meanings being silent.

[question]
text = "At what geomagnetic level does the issuing centre put out an alert?"
note = "Not a property of the sky but of the people watching it, and it is the operational floor a mission's own alerting should not sit below. Read from the thresholds attached to the alerts as issued rather than chosen here."

[maths]
confirmed_by = "A. Rai / 2026-09-14"   # a person read this relation against its source
expression = "K_alert = the lowest threshold_value on threshold_var K in alerts.csv = 4"
source = "noaa_swpc"

# WHERE THIS RELATION CAME FROM. Prose, outside the sheet hash: correcting a
# sentence here does not invalidate a generated artefact. The tab before this one
# states the relation; this says why it is that relation, and the tab after it
# shows what the machine made of it.
[theory]
why = """
Every other row in this subsystem measures the sky. This one measures the
people watching it, and that is the point: a mission's own alerting should
not sit below the level at which the public service already reacts, because
below that level a mission would be responding to activity nobody is warning
about. So the number is READ from the thresholds attached to the alerts as
issued, rather than chosen here — which makes it a fact about operational
practice over 29 years rather than an engineering judgement.
"""
reading = """
Kp 4 is not a storm. It is 'active', one step below the G scale, which
starts at Kp 5 for G1, and 3318 days of the record reach Kp_max 4 or more —
32.2 per cent of all days, 114 a year. A mission that treated every alert as
a storm would be reacting a third of the time. It is also what WAS alerted
on, not what should be: the number reflects one centre's choices, including
changes in practice nobody recorded in this bundle, so a spacecraft with
different sensitivity needs its own threshold and this row is the reference
point for setting one.
"""

[[theory.step]]
text = """
The alerts as issued carry the threshold that triggered them, so the
question is answerable by reading a column rather than by inference. First
the population has to be identified: of the alerts in the record, 9408 carry
a K threshold, 119 carry an A threshold, and 8444 carry none at all — those
are summaries, cancellations and electron-flux notices.
"""

[[theory.step]]
text = """
The A-threshold alerts are a different quantity and are deliberately not in
this row. They are daily-index alerts at values 20, 30 and 50; this row is
the three-hourly K one, because a node answers one question.
"""

[[theory.step]]
text = """
Among the K alerts the thresholds used are 4 through 9, and their counts
fall steeply — which is itself a check that the column is being read
correctly, since alerts must become rarer as the trigger rises.
"""
math = "K 4: 5262 5: 2953 6: 901 7: 233 8: 38 9: 3"

[[theory.step]]
text = """
The answer wanted is the FLOOR, because the question is where watching
begins rather than where it intensifies. So the relation is the minimum of
the legitimate values.
"""
math = "K_alert = min = 4"

[[theory.step]]
text = """
Taking the minimum also happens to make this row immune to a defect in the
source that nothing in the bundle marks. Alongside the K values sit eleven
parsed thresholds of 414, 413, 425, 419, 430 and 408 — a parser running two
numbers together, not a Kp of 414. The minimum ignores them; any relation
taking a maximum or a mean of that column would be wrong.
"""


[[assumption]]
text = "Kp 4 is the floor and is not a storm"
fails_when = "it is read as a storm level. Kp 4 is 'active', one step below the G-scale, which starts at Kp 5 for G1. The record shows 3318 days reaching Kp_max 4 or more — 32.2 per cent of all days, 114 a year — so a mission that treated every alert as a storm would be reacting a third of the time. The alerts carry six distinct K thresholds and their counts fall steeply: 5262 alerts at K 4, 2953 at 5, 901 at 6, 233 at 7, 38 at 8 and 3 at 9. This row publishes the floor because it is the floor that says when watching begins"

[[assumption]]
text = "There is a second threshold variable and this row does not carry it"
fails_when = "somebody needs the A-index alerts. 119 of the alerts are on threshold_var A rather than K, at values 20 (77 alerts), 30 (27) and 50 (15). Those are daily-index alerts and this row is the three-hourly K one. 8444 alerts carry no threshold at all — they are summaries, cancellations and electron-flux notices — so the 9408 K-threshold alerts are the population this number comes from"

[[assumption]]
text = "Eleven of the parsed thresholds are nonsense and were not filtered out of the source"
fails_when = "the threshold column is trusted without looking. Alongside the K values 4 to 9 sit 414, 413, 425, 419, 430 and 408 — two alerts each for the first four, one each for the last two, eleven rows in total. They are a parser running two numbers together, not a Kp of 414. They do not affect this row, which takes the minimum of the legitimate values, but any relation that takes a maximum or a mean of that column will be wrong and nothing in the bundle marks them"

[[assumption]]
text = "It is what was alerted on, not what should be"
fails_when = "a mission adopts it as its own trigger. The number reflects one centre's operational choices over 29 years, including changes in practice nobody recorded in this bundle. A spacecraft whose sensitivity to geomagnetic activity differs from the assumptions behind a public alert service needs its own threshold, and this row is the reference point for setting one rather than the answer"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "K_alert"
type = "Ratio"
unit = "One"
lower = 4.0
upper = 9.0
reason_lower = "Kp is defined on 0 to 9 and no alert in the record was issued below 4. A value under it would mean an alert on a quiet sky, which the issuing centre has never done in 29 years"
reason_upper = "Kp 9 is the top of the scale; there is nothing above it to alert on. Only three alerts in the record carry a threshold of 9"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 4.0
confirmed_by = "A. Rai / 2026-09-14"

[data]
# Pinned to solar-weather@2026.09.14; this list can only pin the NAME. The
# numbers must be re-measured if the bundle version changes.
bundles = ["solar-weather"]

[view]
kind = "number"
