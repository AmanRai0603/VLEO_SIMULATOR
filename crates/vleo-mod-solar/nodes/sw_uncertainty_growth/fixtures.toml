# Known-good values, and where each came from.
#
# The one rule: an expected value may never be produced by the code
# under test. The schema refuses a row whose provenance is the
# implementation, because a number worked out by the thing being
# checked proves nothing.
#
# WHAT THESE ARE
#
# The empirical 95th percentile of F107(t+L) - F107(t) over
# bundles/solar-weather, counting only pairs where BOTH days were observed and
# they are exactly L days apart. Computed outside this crate, from the record.
#
# They deliberately do NOT match prf_design, which interpolates the record's 273
# absent days onto a full daily grid and so understates these percentiles by 1.0
# to 2.3 sfu. The sheet's second assumption says so. A parity grid here would
# have recorded a disagreement, which is why the node carries none.
#
# Each fixture sits AT a measured lead, where the relation returns the tabulated
# percentile exactly, so the tolerance is transcription-tight. Nothing between
# two leads is a fixture: there the answer is the interpolation's and not the
# record's. The two clamp cases are the behaviour the sheet declares.
#
# Lead is a Time in SECONDS at the boundary, so each is L * 86400.

[[fixture]]
label = "lead 183 days (0.50 yr) — 9947 observed pairs"
expect = 57
tolerance = 1e-12
provenance = "independent-derivation"
source = "noaa_swpc"
inputs = { lead = 15811200.0 }

