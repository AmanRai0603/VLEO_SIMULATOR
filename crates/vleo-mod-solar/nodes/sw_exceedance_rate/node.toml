# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "sw_exceedance_rate"
label = "Days a year above the design level"
folder = "sw_exceedance_rate"   # frozen at seed; renaming the label never moves the directory
subsystem = "solar"
parent = "l3_solar"
kind = "computed"
owner = "environment"
tier = "A"
criticality = "significant"   # minor | significant — significant means two reviewers and a differential fill
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
order = 1392
state = "published"

# THE FIRST OF THE THREE ROWS THAT SAY WHAT THE DESIGN BOUND COSTS.
#
# sw_ap_design says what the vehicle is built for. It does not say whether the
# sky stays under it, and the record says the sky does not. A design bound with
# no exceedance statistic beside it tells an engineer nothing about whether the
# mission survives — only what was hoped for.
#
# Three rows answer the question a designer actually has, and all three read
# sw_ap_design, so switching sw_storm_design_level between G1, G2 and G3 moves
# every one of them:
#
#   sw_exceedance_rate       how often          days a year above
#   sw_exceedance_duration   how long each      days per event
#   sw_exceedance_phase      when               where in the cycle
#
# At the declared G3 the answer is: 0.284 days a year, which over the declared
# five-year mission is 1.42 days above the bound in about 1.24 separate events.
# The design is exceeded. It is exceeded rarely, briefly, and predictably, and
# those three facts are what makes it an acceptable bound rather than a failed
# one — but only because they are measured and on a row.

[question]
text = "How many days a year does the record go above the design Ap?"
note = "The exceedance rate of sw_ap_design, measured over 28.197 years. Multiply by the mission length for the number of days the vehicle spends outside what it was built for: at G3 and five years that is 1.42 days."

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How many days a year the daily level of geomagnetic disturbance goes above the level the vehicle is built for, counted over 28.197 years of record. At the default storm grade G3 it is 0.284 days a year, so about 1.42 days over a five-year mission, which turns a broken requirement into a size a programme can decide on."
breaks = "It is a rate from the past, not a forecast, and at G3 it rests on only eight days; its honest range per mission is roughly 0.9 to 2.0 days. Between the three grade levels the straight-line reading overstates the rate badly, and the nine missing months of 2017 fall where exceedances cluster, so the true rate is more likely higher."
wrong = "It is tempting to treat the design level as a limit the sky respects. The record holds days above every storm grade below G4, so the choice is how many days of exceedance to accept, not whether there are any."
by = "an assistant, from what this sheet states — for its owner (environment) to confirm"

[maths]
expression = "R_exc(Ap_design) = days with Ap >= Ap_design, per year of record"
source = "noaa_swpc"

# WHERE THIS RELATION CAME FROM. Prose, outside the sheet hash: correcting a
# sentence here does not invalidate a generated artefact. The tab before this one
# states the relation; this says why it is that relation, and the tab after it
# shows what the machine made of it.
[theory]
why = """
The requirement built on the G3 capability is violated: the record expects
Ap 158.4 over the mission and the design is built for 132. A violated
requirement is useless information on its own — what a programme has to
decide is whether the violation is tolerable, and that decision needs three
numbers rather than one: how often, how long, and when. This row is the
first of the three. It converts 'the bound is exceeded' into 'the bound is
exceeded on this many days a year', which is the form a decision can
actually be taken on.
"""
reading = """
It is a rate over a record, not a forecast, and the record is short exactly
where it matters. Eight days above the G3 bound in 28.2 years is a sample
small enough that removing the single worst storm leaves seven; counting
uncertainty is roughly the square root of the count, so 0.284 a year is
0.284 give or take about 0.10 — a third of itself. Sizing on 1.42 days per
mission when the honest range is roughly 0.9 to 2.0 days is the correct use
of the number. Treating 1.42 as having two decimal places of meaning is not.
"""

[[theory.step]]
text = """
The measurement is a count and a division with nothing fitted in it: the
days whose daily Ap reaches the design bound, over the years of record
actually present.
"""
math = "R_exc(Ap_design) = #{ d : Ap(d) >= Ap_design } / 28.197 yr"

[[theory.step]]
text = """
The denominator is the days present, not the calendar span. That matters
because 273 days are absent: dividing by the span would dilute the rate by
the length of the gap, as though nothing could have happened in it. Dividing
by the days observed keeps the rate honest about what was measured and
silent about what was not.
"""

[[theory.step]]
text = """
Counted at the three levels sw_ap_design can return, the rate falls steeply:
131 days above Ap 48, 35 above Ap 80, 8 above Ap 132.
"""
math = "G1: 4.646 /yr G2: 1.241 /yr G3: 0.284 /yr"

[[theory.step]]
text = """
Which answers the design question at the declared level. Multiply by the
mission and the violation has a size: at G3 the vehicle spends 1.42 days of
a five-year mission outside what it was built for, at G2 6.21 days, at G1
23.2.
"""
math = "0.284 /yr * 5 yr = 1.42 d"

[[theory.step]]
text = """
Notice what the three numbers rule out. A design that must NEVER be exceeded
cannot be built at any level the G scale offers below G4, so the decision
available is not whether to have exceedances but how many days of them to
accept.
"""

[[theory.step]]
text = """
The relation is three anchors and a straight line, and the line is wrong.
Exceedance rate against threshold falls close to exponentially — 4.65 to
1.24 to 0.284 is a factor of 3.7 then 4.4 — so linear interpolation
overstates the rate badly between anchors. Nothing in the tree can reach
between them, because the G scale is integer-valued and the producer's range
is 1 to 3; the assumption is written so that the day something can, it is
not believed.
"""

[[theory.step]]
text = """
One bias in the count has a known direction. The 273 absent days sit at
cycle 24's phase 0.74 to 0.80, INSIDE the band where exceedances concentrate
rather than in the quiet part of the cycle. So whatever happened there is
missing from the numerator, and the true rate is more likely above this
figure than below it.
"""

# THE METHOD — the relation in the method language (docs/PSEUDOCODE.md). In the
# sheet hash: the generated code is translated from it.
[method]
text = """
# Transcribed from crates/vleo-mod-solar/nodes/sw_exceedance_rate/model.rs (HOLE 1 and its guards) — the method the code already runs.
# Numbers: days at or above each G-scale Ap bound per year of the 28.197 years of record, counted from bundles/solar-weather (NOAA SWPC record, noaa_swpc).
# Three anchors, Ap 48, 80 and 132 (G1, G2, G3) — the only values sw_ap_design can return. A Table1 lookup:
# linear between anchors (the sheet declares that interpolation wrong for this quantity and unreached), held at both ends.
let out = interp(ap_design, [48.0, 80.0, 132.0], [4.6458636761, 1.2412612875, 0.2837168657])

# Generated guards: the declared domain of R_exc.
if out < 0.1 then
  refuse "below 0.1 is under the lowest rate the table holds (0.284 at Ap 132), so the table has been read at the wrong end"
end
if out > 6 then
  refuse "above 6 days a year is over the highest rate the table holds (4.65 at Ap 48), below anything the G scale defines as a storm"
end
return out
"""
by = "Aman Rai / 2026-10-03"

[[case]]
label = "the G2 bound, Ap 80 — 35 days above in the record, 1.24 a year."
refuse = "no"
expect = 1.2412612875
tolerance = 1e-12
inputs = { ap_design = 80.0 }
origin = "hand"

[[case]]
label = "the G1 bound, Ap 48 — the lowest level the G scale defines."
refuse = "no"
expect = 4.6458636761
tolerance = 1e-12
inputs = { ap_design = 48.0 }
origin = "hand"

[[case]]
label = "the G3 bound, Ap 132 — the declared design level."
refuse = "no"
expect = 0.2837168657
tolerance = 1e-12
inputs = { ap_design = 132.0 }
origin = "hand"

[[case]]
label = "a value that is not a number: the node must refuse it, as its code does"
refuse = "yes"
inputs = { ap_design = nan }
origin = "hand"

[[assumption]]
text = "The design bound IS exceeded, and the rate is the whole argument for accepting it"
fails_when = "the bound is read as a limit the sky respects. At G3, Ap 132, the record holds 8 days above it in 28.197 years — 0.284 a year, one day in 1287. Over the declared five-year mission that is 1.42 days. At G2, Ap 80, it is 35 days, 1.24 a year, 6.21 days per mission; at G1, Ap 48, it is 131 days, 4.65 a year, 23.2 days per mission. A design that must never be exceeded cannot be built at any of these levels, and the decision is about how many days of exceedance are tolerable rather than whether there are any"

[[assumption]]
text = "Three points and a straight line between them, on a quantity that is anything but straight"
fails_when = "the answer is read anywhere except at 48, 80 or 132. Those are the only three values sw_ap_design can return, because the G scale is defined on integers and the producer's range is 1 to 3. The relation interpolates between them because Table1 must do something, and the interpolation is wrong: exceedance rate against threshold is close to exponential — 4.65, 1.24, 0.284 falls by a factor of 3.7 then 4.4 — so a linear reading between anchors overstates the rate badly in the middle. Nothing in the tree can reach those points, and this assumption exists so that the day something can, it is not believed"

[[assumption]]
text = "It is a rate over a record, not a forecast, and the record is short where it matters"
fails_when = "the mission is the one that meets the rare event. 8 days above G3 in 28 years is a small sample: remove the single worst storm and the count is 7. The rate has a counting uncertainty of roughly its own square root, so 0.284 a year is 0.284 give or take 0.10 — a third of itself. Sizing on 1.42 days per mission when the honest range is roughly 0.9 to 2.0 is the correct use of it; treating 1.42 as a number with two decimal places of meaning is not"

[[assumption]]
text = "273 absent days, and they are not spread evenly over the risk"
fails_when = "the count is read as complete. observed_daily.csv is missing 2017-01-01 to 2017-09-30. That window sits on cycle 24's decline at phase 0.74 to 0.80, which is inside the band where exceedances concentrate — sw_exceedance_phase puts their median at 0.603 and their spread at 0.29 to 0.74. So the gap is in the risky part of the cycle, not the quiet part, and the true rate is more likely above this figure than below it. The denominator used is 28.197 years, the days actually present, so the gap does not dilute the rate; what it does is remove whatever happened in it"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "R_exc"
type = "Ratio"
unit = "One"
lower = 0.1
upper = 6.0
reason_lower = "the lowest rate this relation can return is 0.284, at the G3 bound of Ap 132. A bound at 0.1 sits under it and catches a table read at the wrong end; it is NOT a claim that no design level is exceeded less often, because a higher bound than G3 is outside the declared G range"
reason_upper = "the highest is 4.65, at the G1 bound of Ap 48. A bound at 6 sits just above it. A rate above 6 days a year would mean the design level had fallen to around Ap 40, which is below anything the G scale defines as a storm and below what sw_ap_design can return"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "ap_design"
var = "sw_ap_design"
type = "Ratio"

[[algorithm.step]]
number = 1
text = "read the measured count of days at or above this Ap, per year of record"
binds = "out"
type = "Ratio"

[data]
# Pinned to solar-weather@2026.09.14; this list can only pin the NAME. The
# numbers must be re-measured if the bundle version changes.
bundles = ["solar-weather"]

[view]
kind = "line"
over = "sw_storm_design_level"
points = 40

