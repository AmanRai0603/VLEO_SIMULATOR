# Known-good values, and where each came from. An expected value may
# never be produced by the code under test.
#
# WHAT THESE ARE. A difference of two numbers this node does not compute, one of
# them times a constant this node declares. The centre comes from
# sw_central_expectation and the spread from sw_mean_band_spread, both pinned by
# their own evidence; what is checked here is that the subtraction is that
# subtraction — and in particular that it is a subtraction, since the only
# difference between this row and sw_f107_design_long is the sign.
#
# The inputs are chosen here rather than taken from the study. The study's own
# trio — 158.3304112313161, 13.496881576668528, 141.05440281317954 — would make
# the expected value the prior implementation's answer, and that may not be a
# fixture. It is in parity.csv beside this sheet, where it belongs.

[[fixture]]
