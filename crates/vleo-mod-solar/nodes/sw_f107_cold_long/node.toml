# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "sw_f107_cold_long"
label = "Sustained cold F10.7 to design to"
folder = "sw_f107_cold_long"   # frozen at seed
subsystem = "solar"
parent = "l3_solar"
kind = "computed"
owner = "environment"
tier = "A"
# SIGNIFICANT, for the same reason as its hot twin and not by default. It is one
# of the driver set's five scenarios, it feeds density then drag then lifetime,
# and it carries the same 1.28 this subsystem had to argue about rather than
# inherit. Two reviewers and a differential fill is the right cost for that.
criticality = "significant"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
order = 1376
state = "published"

# The prior implementation, named so the parity grid beside this node has
# something to be the parity of. designWindow_ forms both edges of the mean band
# in one statement and publishes them as the hotmean and coldmean scenarios; the
# grid holds the lower one.
migrated_from = "prf_density.m:217 (01_kernel/sw_study/06_density, local function designWindow_)"
# Pure arithmetic on two supplied numbers, so the two implementations should
# agree to the last bits. A grid loose enough to hide a wrong multiplier — or a
# wrong SIGN, which is the whole difference between this row and its twin —
# would defeat the only thing this grid is here to catch.
parity_tolerance = 1e-9

[question]
text = "What F10.7 must the design still work at as a sustained level over the mission window, on the low side?"
note = """
The lower edge of the mean band, and the scenario the study calls coldmean. Its
hot twin, sw_f107_design_long, is the level the mission must SURVIVE; this is
the level it must still WORK at, and they bound different failures.

A cold sky is thin air. Thin air is less drag, which sounds like good news and
is not: it is the case where an aerodynamically controlled vehicle has the least
authority, where a differential-drag constellation phases slowest, where a
de-orbit at end of life takes longest, and where a power budget gets the least
flux into the array. A tool that publishes only the hot edge has told the reader
about half of their problem.
"""

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "The low level of the Sun's flux the design must still work at, held over the mission window: the expected centre with a margin taken off, about 69.6 solar flux units. A cold Sun means thin air and less drag, which is the case with the least aerodynamic control, the slowest drag-based phasing, the longest end-of-life de-orbit and the least power into the array."
breaks = "The margin of 1.28 spreads is really a 90th-percentile edge while the run is called 95 per cent. The spread is treated as symmetric though forecast errors are skewed, which makes this edge a little too cold, and one spread is used across a whole window even though it changes over the cycle."
wrong = "The cold side is easy to read as the harmless one. Thin air is where drag-based control is weakest and de-orbit is slowest; a tool that publishes only the hot edge has told half the problem."
by = "an assistant, from what this sheet states — for its owner (environment) to confirm"

[maths]
# A person has NOT read this relation against its source yet.
confirmed_by = ""
expression = "F107_cold_long = F107_central - 1.28 * sigma_total"
source = "noaa_swpc"

[[input]]
binding = "central"
var = "sw_central_expectation"
type = "Ratio"

[[input]]
binding = "spread"
var = "sw_mean_band_spread"
type = "Ratio"

[[algorithm.step]]
number = 1
text = "subtract 1.28 standard deviations of the rotation-forecast residual from the central expectation"
binds = "sustained"
type = "Ratio"

[theory]
why = """
This is sw_f107_design_long with the sign of one term reversed, and it is a
separate row rather than a parameter on that one for a reason that is about
reading rather than about arithmetic. A design reads the hot level in one place
and the cold level in another, and the two are consumed by different
subsystems for different purposes. A single row with a sign flag would be a row
whose meaning depends on a value somebody has to go and look up.

The band is symmetric HERE and asymmetric one row down, which is worth holding
in mind. Both edges of the mean band are one sigma away from the centre because
sigma is a standard deviation and a standard deviation has no sides. The DAILY
band is not symmetric — sw_daily_band_spread reaches 34.23 above and
sw_daily_band_drop only 31.27 below — because those are percentiles of a skewed
sample rather than multiples of a spread. So the cold-day scenario is not the
mirror of the hot-day one, while the cold-mean scenario is the mirror of the
hot-mean one, and the two facts sit in adjacent rows.

The multiplier is 1.28, inherited from the same decision its twin records: the
study forms the mean band as centre +/- 1.28*sigma while labelling the run 95
per cent, and in the same function forms the daily band at the true 0.95. That
is reproduced rather than repaired, and reproducing it means using the same
1.28 on this side. Changing it would have to change both edges at once or the
band would stop being a band.
"""
reading = """
Fed the study's own two numbers the arithmetic is exact: 158.3304112313 minus
1.28 * 13.4968815767 is 141.0544028132, which is the coldmean scenario it
published to the last digit. With this repository's sigma in place of the study's
it is 141.1088, 0.04 per cent away. That is what the parity grid beside this
sheet checks, and it is a check on the RELATION.

The answer this row actually publishes is not 141. On the nominal case it is
69.6281 sfu, because sw_central_expectation does not hold the last rotation
forecast forward the way the study does — it reads the cycle analogue over the
mission's own dates and gives 86.8497 at the declared epoch, a deliberate and
recorded departure. So this row's own number and the scenario it is the parity
of are 71 sfu apart, and the whole of that gap is upstream of this relation.

69.6 sfu clears the guard at 60 by nine and a half. Its short sibling does not:
take the daily drop off and the result is 38.36, which the guard refuses. That
refusal is the correct outcome and it is documented in sw_f107_cold_short rather
than hidden, because it says something true — a symmetric band with a stacked
daily percentile is not a valid construction at a centre this low.
"""

[[theory.step]]
text = "Take the centre the cycle analogue gives for the window."
math = "F107_central = sw_central_expectation"

[[theory.step]]
text = "Take the spread the pattern has historically missed a rotation level by. The same number the hot edge uses, because it is one spread and not two."
math = "sigma_total = sw_mean_band_spread = 13.4544 sfu"

[[theory.step]]
text = "Subtract 1.28 of them. Symmetric with the hot edge, because a standard deviation has no sides; the DAILY band one row down is not symmetric, because percentiles of a skewed sample do."
math = "F107_cold_long = F107_central - 1.28 * sigma_total"

# THE METHOD — the relation in the method language (docs/PSEUDOCODE.md). In the
# sheet hash: the generated code is translated from it.
[method]
text = """
# Transcribed from crates/vleo-mod-solar/nodes/sw_f107_cold_long/model.rs (HOLE 1 and its guards) — the method the code already runs.
# Numbers: 1.28 spreads, declared in the sheet (source noaa_swpc) and not chosen in the hole — the same 1.28 the hot edge adds.
# The generated guard refuses an answer that is not a finite number; x - x is zero only for a finite x.
if (central - spread * 1.28) - (central - spread * 1.28) != 0 then
  refuse "the computation produced a value that is not a number"
end
let sustained = central - spread * 1.28
if sustained < 60 then
  refuse "below 60 sfu has never been observed: the band is wider than the sky"
end
if sustained > 400 then
  refuse "a cold level above 400 sfu is arithmetic, not sky: the spread was added rather than subtracted"
end
return sustained
"""
by = "Aman Rai / 2026-10-03"

[[case]]
label = "a mid-cycle centre of 160 with this repository's own measured spread — 160 - 1.28 × 13.454382."
refuse = "no"
expect = 142.77839104
tolerance = 1e-12
inputs = { central = 160.0, spread = 13.454382 }
origin = "hand"

[[case]]
label = "round numbers, so the arithmetic is checkable without a calculator — 100 - 1.28 × 20."
refuse = "no"
expect = 74.4
tolerance = 1e-12
inputs = { central = 100.0, spread = 20.0 }
origin = "hand"

[[case]]
label = "the centre sw_central_expectation actually gives at the declared epoch, 86.8497 — the case that matters, nine and a half sfu above the guard."
refuse = "no"
expect = 69.62809104
tolerance = 1e-10
inputs = { central = 86.8497, spread = 13.454382 }
origin = "hand"

[[case]]
label = "outside what the node holds for: its code refuses it, and so must the developer's"
refuse = "yes"
inputs = { central = 100.0, spread = 40.0 }
origin = "hand"

[[case]]
label = "outside what the node holds for: its code refuses it, and so must the developer's"
refuse = "yes"
inputs = { central = 500.0, spread = 10.0 }
origin = "hand"

[[case]]
label = "outside what the node holds for: its code refuses it, and so must the developer's"
refuse = "yes"
inputs = { central = inf, spread = 10.0 }
origin = "hand"

[[assumption]]
text = "1.28 is the confidence, and it is the 90th percentile while the run is called 95 per cent"
fails_when = "a reader takes the published band as a 95 per cent bound. Phi(1.28) = 0.8997, so this edge is the 10th percentile and not the 5th. A one-sided 95 per cent bound is 1.645 sigma, which at this sigma is a further 4.9 sfu DOWN. The daily half of the same band DOES use 0.95, so the two halves are not at one confidence, and this row reproduces that rather than silently repairing it Which number that is, is now a row of its own — sw_band_confidence, seeded by §30 B2 and unanswered, because the value needs a person. Until it carries one the multiplier is a literal in this hole and three others, each saying it is declared in the sheet while no sheet declares it. §44 measures what each answer costs: moving to 1.645 moves 47 rows and no KPI closure, leaves all five solar closures closing with 3.1 to 6.2 per cent less margin, and breaks no parity check in this repository"

[[assumption]]
text = "The band is symmetric because sigma is a standard deviation"
fails_when = "the residuals are skewed, which they are. A forecast that misses hardest when activity is highest has a long high tail and a short low one, so the true 10th percentile of the residuals is nearer the centre than 1.28 sigma and this edge is a little too cold. It errs toward the conservative on THIS side — a colder cold case is a harder case for drag authority — but it is the wrong number, not a safe one"

[[assumption]]
text = "One sigma covers the whole window"
fails_when = "sigma is not flat across the cycle — the source says so about its own number — so a window spanning a rise or a fall is given one width where it needs two"

[[assumption]]
text = "The cold edge is a design case and not a nuisance"
fails_when = "it is read as the harmless side. Thin air is the case with the least aerodynamic control authority, the slowest differential-drag phasing, the longest end-of-life de-orbit and the least array flux. Two of those are mission-ending in their own way"

[output]
symbol = "F107_cold_long"
type = "Ratio"
unit = "One"
lower = 60.0
upper = 400.0
reason_lower = "below 60 sfu has never been observed and every relation reading F10.7 has no support there. On this row the guard means something specific: a sustained level below the record's own floor says the band is wider than the sky, which happens when a window near solar minimum is given a sigma measured across a whole cycle"
reason_upper = "above 400 sfu the exospheric temperature relation is extrapolated past the largest recorded daily value. A COLD level there is arithmetic rather than sky — it means the spread has been added rather than subtracted, which is the one failure this row has that its twin does not"

[view]
kind = "number"

