# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "sw_event_duration"
label = "F10.7 burst duration"
folder = "sw_event_duration"   # frozen at seed; renaming the label never moves the directory
subsystem = "solar"
parent = "l3_solar"
kind = "declared"
owner = "environment"
tier = "A"
criticality = "minor"   # minor | significant — significant means two reviewers and a differential fill
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
order = 1344
state = "published"

# A statistic of the pinned record with no input, so it is declared rather than
# computed. It is the other half of sw_spike_threshold and is only defined
# relative to it: change that threshold and this number changes with it.

[question]
text = "Once F10.7 goes above the spike threshold, how long does it stay there?"
note = "The dwell that turns a threshold into an event. A design cares about duration rather than about the crossing, because a single elevated day and a week of them are different loads on a drag budget and on a power one."

[maths]
confirmed_by = "A. Rai / 2026-09-14"   # a person read this relation against its source
expression = "D_burst = mean length of a run of consecutive days with F107/F107A >= S_thr = 3.3115 d"
source = "noaa_swpc"

[[assumption]]
text = "A mean over a distribution that is not remotely symmetric"
fails_when = "the mean is used as a typical event. The 202 spike days fall into 61 runs: 24 of them are a single day, and the tail runs to 10. The distribution is 24 ones, 3 twos, 10 threes, 7 fours, 4 fives, 7 sixes, 2 sevens, 2 nines and 2 tens — so the modal event is one day and the mean is 3.31 because a handful of long bursts pull it up. The median is 3. A design that sizes on 3.31 days is sizing on neither the common case nor the bad one, and the bad one is what matters"

[[assumption]]
text = "It is defined entirely by sw_spike_threshold and moves when that moves"
fails_when = "this row is quoted without the threshold beside it. At the declared 1.3049 the record gives 61 events averaging 3.31 days; a lower threshold merges neighbouring runs into longer ones and a higher one splits them. The two rows are one definition in two places, and a change to either without the other makes the pair incoherent"

[[assumption]]
text = "A one-day gap ends an event, and that is a choice with no physics behind it"
fails_when = "the sky dips below the threshold for a day and comes back. Runs are broken on the first day that fails the test, so a two-week episode with one quiet day in the middle is counted as two events rather than one, shortening the mean. Allowing a one-day bridge would be as defensible and would give a different answer; nothing in the record says which is right, and this row states the rule rather than pretending the number is unique"

[[assumption]]
text = "The 273 absent days can neither start nor end a run"
fails_when = "an event straddled 2017. observed_daily.csv is missing 2017-01-01 to 2017-09-30, so a burst in those nine months is absent, and a burst that ran into 2017-01-01 or out of 2017-09-30 is truncated at the gap rather than followed. With 61 events over the record, one or two truncations would move the mean by a tenth of a day, which is the order of the effect and is not corrected for"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "D_burst"
type = "Time"
unit = "Day"
lower = 1.0
upper = 10.0
reason_lower = "a run is at least one day by construction, because a run of zero days is not an event. A value below 1 means the run-finding is broken rather than that events are short"
reason_upper = "the longest run in 29 years is 10 days. A mean above it would exceed every single event the record contains, which no averaging can produce"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 3.3114754098
confirmed_by = "A. Rai / 2026-09-14"

[data]
# Pinned to solar-weather@2026.09.14; this list can only pin the NAME. The
# numbers must be re-measured if the bundle version changes.
bundles = ["solar-weather"]

[view]
kind = "number"
