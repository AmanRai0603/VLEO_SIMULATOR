# Known-good values, and where each came from.
#
# The one rule: an expected value may never be produced by the code
# under test. The schema refuses a row whose provenance is the
# implementation, because a number worked out by the thing being
# checked proves nothing.
#
# A CROSSING'S EVIDENCE IS THAT IT CHANGES NOTHING
#
# There is no physics here to check. What can go wrong at a seam is that the seam
# alters what it carries — a stray factor, a unit conversion nobody asked for, a
# clamp inherited from the wrong row — and the failure is invisible because both
# sides look plausible. So every fixture below is an identity, and what they pin
# is that the number arriving is the number leaving.
#
# WHAT CHANGED WHEN THIS ROW STARTED CARRYING A SET. One identity per input is no
# longer enough evidence. Fifteen members are assembled from ten inputs, and the
# failure this row can now have that it could not before is a MISROUTING: a member
# published from the wrong input. Every member is a flux or an Ap in the same
# range as its neighbours, so a transposition would be a plausible number in the
# wrong scenario and no guard would see it.
#
# So the inputs below are the ten values of one coherent driver set — the declared
# window's, computed from this repository's own centre, spreads and drops by hand —
# and there is one fixture per member, each naming the member it is about. Ten
# distinct inputs and fifteen distinct expected values mean a transposition of any
# two inputs fails at least two fixtures. That is the whole point of them.
#
# NOT THE STUDY'S NUMBERS. The study's driver sets are in parity.csv territory and
# are not used here; these are this tree's own chain, so a fixture cannot pass by
# agreeing with the implementation this row was ported from.
#
# The ten inputs, for reference, are the same in every fixture:
#   f107_centre     158.3304112313    ap_centre       22.095389
#   f107_hot_long   175.5520201913    ap_hot_long     26.69530964
#   f107_cold_long  141.1088022713    ap_cold_long    17.49546836
#   f107_hot_day    209.7835016728    ap_hot_day      41.6971614919
#   f107_cold_day   109.8365800491    ap_cold_day     6.9065794711

