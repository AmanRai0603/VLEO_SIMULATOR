# Known-good values, and where each came from.
#
# The one rule: an expected value may never be produced by the code
# under test. The schema refuses a row whose provenance is the
# implementation, because a number worked out by the thing being
# checked proves nothing.
#
# A CROSSING'S EVIDENCE IS THAT IT CHANGES NOTHING
#
# There is no physics here to check. What can go wrong at a seam is that the
# seam alters what it carries — a stray factor, a unit conversion nobody asked
# for, a clamp inherited from the wrong row — and the failure is invisible
# because both sides look plausible. So every fixture below is the identity, at
# a value taken from somewhere real, and what they pin is that the number
# arriving is the number leaving.
#
# The four inputs are sw_f107_design's own fixture answers, so if that row's
# numbers move these move with it and a divergence means the seam started
# computing.

[[fixture]]
label = "the five-year conclusion crosses unchanged — 228.1374 sfu"
