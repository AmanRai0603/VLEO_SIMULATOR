# ---- what it reads -------------------------------------------------------
#
# Ten rows, each the producer of one scenario's one quantity. The consumer
# declares what it expects and assembly refuses a mismatch against what the
# producer publishes — which is the only place the whole graph is visible and
# therefore the only place to ask.

