# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "l3_solar_interface"
label = "Solar weather — subsystem interface"
folder = "l3_solar_interface"   # frozen at seed; renaming the label never moves the directory
subsystem = "solar"
parent = "l3_solar"
kind = "required"
owner = "environment"
tier = "A"
criticality = "minor"   # minor | significant — significant means two reviewers and a differential fill
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
order = 1329
state = "published"
# The single node that crosses between this layer and the one above.
# A subsystem is reached through its interface node, never by reaching
# into it, and that is what makes a layer something you can reason
# about on its own.
crosses_to = "sys_space_environment"

# THIS IS THE FIRST WRITTEN CROSSING IN THE REPOSITORY, AND IT SETS A
# CONVENTION FOR TWENTY MORE. TWO REVIEWERS.
#
# Twenty-one rows carry crosses_to and not one of them has ever been written,
# so what an interface row actually publishes has never been decided — only
# seeded. What is written here is the conservative reading and the alternative
# is stated so a reviewer can overturn it cheaply, while it is one node rather
# than twenty-one.
#
# THE READING TAKEN: an interface carries the subsystem's headline conclusion
# upward, unchanged. It is deliberately a pass-through. That is not redundancy —
# it is the point: a system reader opens one row and sees what the subsystem
# concluded, and never reaches into l3_solar to find it. The value is
# sw_f107_design, which is the number the study's whole F10.7 chain exists to
# produce.
#
# THE ALTERNATIVE READING: kind = "required" could mean this row states a
# SPACECRAFT CAPABILITY — the worst sky the design can sustain — with the
# environment's answer arriving as the achieved side. layers/l3_solar.toml
# frames the three req/ach pairs exactly that way. On that reading this row
# would be kind = "achieved" and the seeder's kind is wrong, or the capability
# belongs here and the conclusion crosses some other way.
#
# The two differ in which side of the closure this row sits on, which is why it
# is not a detail. The sense below is taken from the group's own stated closure
# direction.
sense = "<="

[question]
text = "What does the solar-weather subsystem conclude, for a system reader who will not open it?"
note = "One row, one number, no reaching in. Everything the subsystem establishes — the record, the cycle, the storms, the slot bias, the spread — arrives at sw_f107_design, and this carries that across to sys_space_environment. A reader who wants the working opens l3_solar and finds twenty-six rows; a reader who wants the answer opens this one."

[maths]
# A crossing does not compute. It republishes the conclusion so that the seam
# is a row somebody owns rather than an edge nobody looks at.
expression = "F107_crossing = F107_design"
source = "noaa_swpc"

[[assumption]]
text = "It carries the F10.7 driver only, and the subsystem concludes more than that"
fails_when = "sys_space_environment holds six rows — solar flux, F10.7, Ap, atmospheric density, thermospheric wind, atomic oxygen fluence — and this crossing answers one of them. The Ap side is measured and published inside the subsystem (sw_storm_return_level, and the peak-slot correction in sw_kp_slot_bias) and does not cross yet, because one row publishes one number and the convention allows exactly one crossing per subsystem. How a subsystem with more than one conclusion crosses is the same unsettled question as the kind above, and it is unsettled for all twenty-one interfaces, not just this one."

[[assumption]]
text = "It inherits every limitation of the row beneath it, and a system reader sees none of them"
fails_when = "this is the ordinary cost of a seam and it is worth stating where the seam is. The number crossing here cannot tell solar maximum from solar minimum, because no row in this tree publishes a date; it is a 95th percentile and not a worst case; and its centre is the record's unconditional mean. A reader at layer 2 sees 228 sfu and a credibility vector, and would have to open sw_f107_design and then sw_central_expectation to learn any of that. The credibility travels; the assumptions do not."

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "F107_crossing"
type = "Ratio"
unit = "One"
lower = 60.0
upper = 400.0
reason_lower = "the same floor as env_f107 and sw_f107_design: below 60 sfu has never been observed and every relation reading F10.7 has no support there. A crossing that narrowed or widened the range it carries would be changing the answer, so it declares the producer's own bounds"
reason_upper = "the same ceiling as env_f107 and sw_f107_design: above 400 sfu the exospheric temperature relation is extrapolated past the largest recorded daily value. Restating it here means a system reader sees the limit without opening the subsystem"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "conclusion"
var = "sw_f107_design"
type = "Ratio"

[[algorithm.step]]
number = 1
text = "carry the subsystem's F10.7 conclusion across the seam unchanged"
binds = "crossing"
type = "Ratio"

[view]
kind = "line"
over = "orbit_mission_duration"
points = 60
