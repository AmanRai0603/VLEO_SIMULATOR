# Known-good values, and where each came from. An expected value may
# never be produced by the code under test.
#
# A difference of two numbers this node does not compute. The sustained cold
# level comes from sw_f107_cold_long and the drop from sw_daily_band_drop, both
# pinned by their own evidence; what is checked here is that the two are stacked
# by subtraction and that the guard refuses a day below anything ever observed.
#
# The study's own pair is NOT used: its difference is the prior implementation's
# published coldday, and that may not be a fixture. It is in parity.csv.

[[fixture]]
