[[fixture]]
label = "ten years — rank 3, near the top of what 28.2 years of record can say anything about"
expect = 189.0
tolerance = 0.0119
provenance = "independent-derivation"
source = "noaa_swpc"
inputs = { life = 315576000.0 }
