# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "sw_storm_return_level"
label = "Ap at a storm return period"
folder = "sw_storm_return_level"   # frozen at seed; renaming the label never moves the directory
subsystem = "solar"
parent = "l3_solar"
kind = "computed"
owner = "environment"
tier = "A"
criticality = "minor"   # minor | significant — significant means two reviewers and a differential fill
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
order = 1366
state = "published"

# NO migrated_from, AND THAT IS NOT AN OVERSIGHT.
#
# prf_design.m:35-38 computes this by sorting the record descending, assigning
# rank i the exceedance probability i/N, and returning the i-th largest value
# whose return period is nearest the one asked for. There is no closed form to
# transcribe and no MATLAB in this environment to run, so a parity grid would
# have to be a reimplementation of that sort — which is my own reading of it
# twice over, not the prior implementation's opinion.
#
# What saves this node from needing one is that the MATLAB's answer IS an order
# statistic of the record, and the record is in bundles/solar-weather. So the
# fixtures below are the same numbers a parity export would have carried, read
# from the data both implementations read rather than from either of them.

[question]
text = "What daily planetary Ap recurs once per mission lifetime?"
note = "Geomagnetic activity has no usable long-term forecast, so a design does not predict the storm — it sizes for the worst one the mission is likely to meet. That makes the mission length the input: a five-year mission and a fifteen-year one are owed different skies, and this row moves when orbit_mission_duration moves."

[maths]
# The exceedance curve of the daily record, fitted. Return period is the
# reciprocal of exceedance probability by definition; the log-linear form and
# its two coefficients are the fit, and both are declared here rather than
# hidden in the hole body.
expression = "Ap(T) = 92.5155 + 40.9265*ln(T / 1 yr)"
source = "noaa_swpc"

# WHERE THIS RELATION CAME FROM. Prose, outside the sheet hash: correcting a
# sentence here does not invalidate a generated artefact. The tab before this one
# states the relation; this says why it is that relation, and the tab after it
# shows what the machine made of it.
[theory]
why = """
Geomagnetic activity has no usable forecast at mission timescales, so a
design cannot predict the storm it will meet. What it can do is size for the
worst storm the mission is LIKELY to meet, which turns the mission length
into the input: a five-year mission and a fifteen-year one are exposed to
different extremes of the same distribution. That is extreme-value reasoning
rather than forecasting, and the whole row is the empirical exceedance curve
of the daily record with a functional form fitted through its tail.
"""
reading = """
28.2 years of record support the whole curve and its top end rests on two
observations. At a fifteen-year mission the answer is fitted through the
second-largest daily Ap in the record; at ten years, the third. The declared
input range of 0.5 to 15 years reaches past both ends of the fitted range,
0.5035 to 14.0986 years, by 0.285 Ap at the bottom and 2.54 Ap at the top —
small, and an extrapolation nonetheless. A design needing the
once-per-century storm needs a longer record or a fitted extreme-value
model, not this row. The upper bound of 230 is the fit evaluated at a return
period equal to the record itself, so asking for a storm rarer than the
record refuses rather than answering.
"""

[[theory.step]]
text = """
Return period is not a model, it is a definition: the average interval
between events that exceed a level, which is the reciprocal of the
exceedance probability per unit time. Inverting it turns 'how long is the
mission' into 'how rare a storm must it tolerate'.
"""
math = "T(x) = 1 / P(Ap > x)"

[[theory.step]]
text = """
The empirical curve comes straight from the ranked record with nothing
assumed. Sort the daily Ap descending; the m-th largest value has been
exceeded m times in the record, so its return period is the record's length
divided by m.
"""
math = "T(rank m) = 28.1971 yr / m"

[[theory.step]]
text = """
That gives a staircase rather than a function, and a design needs a value at
an arbitrary mission length, so a form has to be fitted through it. Which
form is not arbitrary — it is a statement about the shape of the tail, and
the two candidates make different claims.
"""

[[theory.step]]
text = """
Log-linear in the return period is exactly the claim that the upper tail is
EXPONENTIAL. If the probability of exceeding x falls off as exp(-x/b), then
the return period rises as exp(x/b), and inverting that gives the level
growing with the logarithm of the return period.
"""
math = "P(Ap > x) ~ exp(-x/b) => T ~ exp(x/b) => x = a + b*ln(T)"

[[theory.step]]
text = """
Fitted over ranks 2 to 56 — return periods 0.5035 to 14.0986 years — least
squares gives the two coefficients. The residual rms against the empirical
staircase is 4.95 Ap, worst +8.6 and -12.9.
"""
math = "Ap(T) = 92.5155 + 40.9265 * ln(T / 1 yr)"

[[theory.step]]
text = """
A power law was tried on the same points and is more than twice as bad — rms
9.10, worst -47.7 — which is the evidence for the exponential tail rather
than a heavier one. That is a claim about this record over this range of
return periods and not about geomagnetic storms in general.
"""

[[theory.step]]
text = """
Rank 1 is deliberately excluded from the fitting range. The record's largest
day, Ap 273, sits above the log-linear trend and has an apparent return
period of exactly 28.2 years for no reason except that it is the largest
thing in 28.2 years. Including it would let one day set the slope of the
whole tail.
"""

[[theory.step]]
text = """
At the declared five-year mission the curve returns 158.4 Ap, and the whole
design chain hangs off that: it is what sw_kp_from_ap converts, what
l3_solar_ach_03 publishes as the achieved level, and what the requirement at
150 fails against.
"""
math = "Ap(5 yr) = 92.5155 + 40.9265 * ln(5) = 158.38"

[[theory.step]]
text = """
One assumption underneath all of this is worth naming because it is not
visible in the algebra: every day is treated as an independent draw. Storms
cluster — a coronal hole returns each solar rotation and a single event runs
for days — so the record holds fewer independent storms than storm days.
Clustering does not bias a quantile of the marginal distribution, but it
does mean the effective sample behind the tail is smaller than the day count
and the true uncertainty is wider than the residual above suggests.
"""


[[assumption]]
text = "The tail is log-linear in the return period, with the two coefficients fitted on this record"
fails_when = "the form is a choice, not the source's. Fitted over ranks 2 to 56 of the record, which is return periods 0.5035 to 14.0986 years; it carries a residual rms of 4.95 Ap against the empirical curve, worst +8.6 and -12.9. A power law on the same points is more than twice as bad (rms 9.10, worst -47.7), which is why this form and not that one. Anyone who needs the empirical step rather than a smooth curve should read the record, not this row."

[[assumption]]
text = "28.2 years of record support the whole curve, and its top end rests on two observations"
fails_when = "the empirical method cannot see past its own record length. At T = 15 years the answer is fitted through the second-largest daily Ap in 28.2 years, and at T = 10 years the third; the record's largest value, Ap 273, has an apparent return period of exactly 28.2 years for no reason other than that it is the largest thing in 28.2 years. The fitted domain is 0.5035 to 14.0986 years, and the declared input range 0.5 to 15 years reaches past BOTH ends of it: the curve is extrapolated by 0.285 Ap at a half-year mission and by 2.54 Ap at a fifteen-year one, because there is no rank between 1 and 2 and rank 1 is the record length itself. Small, but it is an extrapolation and an earlier version of this sheet claimed it was never one. A mission at the 15-year bound is being sized on a curve whose top is two data points. A design that needs the once-per-century storm needs a longer record or a fitted extreme-value model, not this row."

[[assumption]]
text = "Every day in the record is treated as an independent draw"
fails_when = "storms cluster — a coronal hole returns once per solar rotation and a single event runs for more than one day — so the record holds fewer independent storms than it holds storm days. Clustering does not bias the exceedance level itself, which is a quantile of the marginal distribution, but it does mean the effective sample behind the tail is smaller than N and the uncertainty on the answer is wider than the residual above suggests. sw_event_duration and sw_recurrence_lag both measure the clustering now — a mean disturbed run of 3.31 days and a recurrence peak at a lag of 26 days — and neither is fed back into this fit, so the widening they imply is declared here rather than applied."

[[assumption]]
text = "The record this is fitted on is missing 273 days, and the missing window contains storms"
fails_when = "2017-01-01 to 2017-09-30 has no rows in the daily table — nine months absent from a 29-year span, and the node's answer is a tail quantile of what remains. The hole is not empty of weather: the same bundle's alerts.csv records four days inside it with an OBSERVED K of 7 or more, including K = 8 three times on 7-8 September 2017. Bounding those days from the alerts (their other three-hourly intervals held at the record median) puts 2017-09-08 at a daily Ap of at least 104 and 2017-09-07 at 48, which would rank about 24th and 43rd in the record. Restoring them moves the five-year level by -0.0 Ap and the fifteen-year by -0.7: the tail is set by events far larger, so this particular gap does not bias this particular answer. A different gap, or one holding a top-ten storm, would."

[[assumption]]
text = "ap_planetary is the SWPC estimated planetary A, not the GFZ definitive value"
fails_when = "anyone reconciling these return levels against GFZ's definitive Ap series will find differences, and they are not transcription errors — they are two different published quantities. The bundle's INDEX.md says so; it is repeated here because a node author reads the sheet and not necessarily the bundle."

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "Ap_T"
type = "Ratio"
unit = "One"
lower = 20.0
upper = 230.0
reason_lower = "ap is an equivalent amplitude in nanotesla. Below 20 the answer is not a storm at all — the record's median day is 7 — so a return level under it means the input or the fit reached somewhere neither was meant to go"
reason_upper = "THE BOUND IS THE RECORD'S LENGTH, NOT THE TABLE'S END. The fit evaluated at a return period equal to the record itself, 28.1971 years, is Ap 229.18; 230 is the first round number above it, so a return period beyond the record refuses instead of answering. The previous bound was 400 — the last point of the published ap/Kp table — which first bites at a return period of 1832 years, sixty-five times the record, and so enforced nothing: this node would answer a once-per-century question with Ap 281 while its own assumptions said a century needs a longer record. Note that 230 is BELOW the record's largest single day, Ap 273: rank 1 sits above the log-linear trend and was deliberately left out of the fitting range, so the fit does not chase it. This bound is the fit's own reach, not the record's extreme"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "life"
var = "orbit_mission_duration"
type = "Time"

[[algorithm.step]]
number = 1
text = "take the mission length in years and read the fitted exceedance curve at that return period"
binds = "level"
type = "Ratio"

[data]
# THE COEFFICIENTS ARE PINNED TO A VERSION AND THIS DECLARATION IS NOT.
#
# The fit above was made on solar-weather@2026.09.14. This list is matched by
# NAME only — crates/vleo-modules/src/lib.rs compares `d == b` — so a run with a
# later solar-weather satisfies the precondition, computes with coefficients
# fitted on the older data, and records the newer version in its provenance. The
# answer would then cite data it did not come from.
#
# Until the machinery can pin a version, refitting is a manual obligation: if
# this bundle's version changes, this node's two coefficients must be refitted
# and its fixtures re-derived before the run is trusted.
bundles = ["solar-weather"]

[view]
kind = "line"
over = "orbit_mission_duration"
points = 60
