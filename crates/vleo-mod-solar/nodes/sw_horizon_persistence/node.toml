# No migrated_from and no parity grid: prf_horizon's structure function is an
# empirical RMS over the record rather than a closed form, and this row departs
# from it deliberately over the gap. Same reasoning as sw_uncertainty_growth.

[question]
text = "If all we know is today's F10.7, how wrong are we L days later?"
note = "prf_horizon's structure function D(L) = RMS[F107(t+L) - F107(t)], its first method. Paired with sw_horizon_climatology it answers the design question directly: which of the two cheapest forecasts is worth using at this lead, and what either costs."

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How wrong a forecast of the Sun's flux would be if it simply assumed today's value continues, at a given lead. The error grows from about 7 solar flux units at one day to about 50 at two years, with a dip at 27 days, because the Sun turns and the same active region faces Earth again."
breaks = "In a real run it is only ever asked about leads of half a year and up, so the dip and the short-lead shape are carried but never used. The error has not levelled off even at two years, so reading the tail as settled understates how much worse longer leads get."
wrong = "It is natural to assume forecast error only rises with lead. Today's flux is a better guide to one rotation ahead than to a fortnight ahead, and a smooth model would erase that."
by = "an assistant, from what this sheet states — for its owner (environment) to confirm"

[maths]
# The RMS of the L-day change, measured at eighteen leads and interpolated.
expression = "D(L) = RMS[F107(t+L) - F107(t)], from the record"
source = "noaa_swpc"

# WHERE THIS RELATION CAME FROM. Prose, outside the sheet hash: correcting a
# sentence here does not invalidate a generated artefact. The tab before this one
# states the relation; this says why it is that relation, and the tab after it
# shows what the machine made of it.
[theory]
why = """
Before asking whether a published forecast is any good, it is worth knowing
how much predictability there is to be had. The cheapest possible forecast
is persistence — assume today continues — and the error it accumulates as a
function of lead is a measurement of the process rather than of any
forecaster. In turbulence and in time series this object is called a
structure function, and its shape carries the memory of the system: where it
rises, the system is forgetting; where it flattens or dips, something is
repeating.
"""
reading = """
The declared input cannot reach the interesting part of this curve.
orbit_mission_duration is declared 0.5 to 15 years, so in a real run the row
is only ever asked about leads of 183 days and up — past the rotation dip,
past the rise, in the slow tail. The short-lead structure is carried because
the question is about predictability and the structure is the answer, but
nothing in this tree currently asks for it. Note too that persistence has
NOT saturated even at two years, so reading the tail as converged would
understate how much worse a longer lead still gets.
"""

[[theory.step]]
text = """
Define the error of persistence at a lead as the RMS difference between a
day and the day L later, over every pair of observed days that far apart.
"""
math = "D(L) = RMS[ F107(t + L) - F107(t) ]"

[[theory.step]]
text = """
For a process with no memory at all, this has a known limit. The difference
of two independent draws from the same distribution has twice the variance,
so the structure function saturates at the square root of two times the
standard deviation — which for this record is a number that can be checked
against the climatology row.
"""
math = "D(inf) = sqrt(2) * sigma = 1.414 * 44.39 = 62.77 sfu"

[[theory.step]]
text = """
Measured, it does not saturate inside the record's usable range: 7.1 sfu at
one day, 29.1 at fourteen, 49.63 at two years and still climbing toward, not
sitting at, the 62.77 limit. F10.7 is cyclic rather than a random walk, so a
longer lead keeps finding new ways to be different.
"""

[[theory.step]]
text = """
And in the middle of that rise there is a dip, which is the feature the
whole row exists to carry. The error falls from 29.1 sfu at fourteen days to
22.4 at twenty-seven days before rising again.
"""
math = "D(14 d) = 29.1 > D(27 d) = 22.4"

[[theory.step]]
text = """
Twenty-seven days is the synodic solar rotation. The same active region
carries round to face the Earth again, so today's flux is a BETTER guide to
the flux one rotation from now than to the flux a fortnight from now. It is
the one feature of this curve a forecaster would actually use, and any
monotone model of predictability erases it — which is why this is a table
and not a fit.
"""

[[theory.step]]
text = """
One methodological departure from the study, shared with
sw_uncertainty_growth. prf_horizon builds a full daily grid and fills the
record's 273 absent days by linear interpolation; interpolated days carry no
variability, so every error statistic spanning them is understated. This row
pairs only days that were both observed, which costs sample size and buys a
number that is not partly invented — and is therefore expected to disagree
slightly with the MATLAB.
"""

# THE METHOD — the relation in the method language (docs/PSEUDOCODE.md). In the
# sheet hash: the generated code is translated from it.
[method]
text = """
# Transcribed from crates/vleo-mod-solar/nodes/sw_horizon_persistence/model.rs (HOLE 1 and its guards) — the method the code already runs.
# Numbers: eighteen measured RMS values of F107(t+L) - F107(t) over observed pairs, from bundles solar-weather@2026.09.14 (NOAA SWPC record, noaa_swpc).
# A Table1 lookup on the lead in days: linear between leads, held at both ends. The dip at 27 d is the
# synodic solar rotation and is deliberate, not a transcription error.
let err = interp(lead, [1.0, 2.0, 3.0, 5.0, 7.0, 10.0, 14.0, 20.0, 27.0, 40.0, 60.0, 90.0, 135.0, 180.0, 270.0, 365.0, 547.0, 730.0] [d], [7.0784, 10.3796, 13.6671, 19.3021, 23.6294, 27.6511, 29.1328, 25.4695, 22.4321, 29.602, 27.9575, 30.1549, 31.0394, 32.9634, 35.7538, 38.8277, 43.7693, 49.6285])

# Generated guards: the declared domain of D_pers.
if err < 0 then
  refuse "an RMS cannot be negative"
end
if err > 65 then
  refuse "above 65 is unreachable by this relation (saturation is 62.77 sfu, the largest entry 49.63), so it is a broken table rather than an extreme sky"
end
return err
"""
by = "Aman Rai / 2026-10-03"

