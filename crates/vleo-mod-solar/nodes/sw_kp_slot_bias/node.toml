[[case]]
label = "above the last bin centre — Ap 1000 holds the 110-to-400 bin."
refuse = "no"
expect = 1.3174603174603174
tolerance = 1e-12
inputs = { ap = 1000.0 }
origin = "hand"

[[case]]
label = "outside what the node holds for: its code refuses it, and so must the developer's"
refuse = "yes"
inputs = { ap = nan }
origin = "hand"

[[assumption]]
text = "The correction is a median per bin, so it describes the typical day at that Ap and not the day in hand"
fails_when = "the offset is a distribution, not a number. Adding the median recovers the typical peak and still misses any individual day, and the spread within a bin is not published by this row. A design that needs the worst case at a given Ap needs a percentile of the offset, not its median."

[[assumption]]
text = "The nine bin medians are not monotone, and the top bin sits exactly at the record's support limit"
fails_when = "the offset rises with Ap as the concavity argument predicts — +1.000 at Ap 2.5 through +1.747 at Ap 90 — and then FALLS to +1.317 in the 110-to-400 bin. That bin holds 20 days, which is exactly prf_ap2kp's own minimum for using a bin at all, so the fall is as likely to be a small-sample artefact as a real saturation of the table near its top. It is carried through rather than smoothed away, because smoothing it would be this node inventing a shape the record does not show. Anyone designing at Ap above 110 is reading a correction supported by twenty days."

[[assumption]]
text = "The 24-hour-mean slot is NOT what this publishes"
fails_when = "the two slots have opposite signs, and using this row for the mean slot would double the error rather than remove it. Measured on the same 10,297 days, the mean-slot offset runs from +0.042 at Ap 2.5 down to -0.487 in the top bin — the table reads HIGH against the 24-hour mean and LOW against the peak. DTM2020_Oper wants both: akp(1) is a single three-hourly value, akp(3) the mean of the eight. The mean-slot offset is published by sw_kp_mean_bias; this row is the peak."

[[assumption]]
text = "WHICH SLOT A DESIGN IS DRIVEN BY IS NOT THIS ROW'S TO SAY, AND sw_kp_driving_slot IS WHERE IT WILL BE SAID"
fails_when = "this row is read as the answer to which slot matters. It corrects the table for ONE slot, the daily peak, and its existence is evidence that the two slots differ — not a statement that the peak is the one a design is driven by. That statement is sw_kp_driving_slot, which is seeded and unanswered: §30 B1 asks for it and the value needs a person. Until it carries one, every consumer of a Kp in this tree is choosing a slot implicitly, and this row and sw_kp_mean_bias exist to correct whichever one it turns out to be. The cross-reference is here so the two cannot drift: if sw_kp_driving_slot is answered 'mean', it is sw_kp_mean_bias and not this row that a drag design reads, and §43 measures what that choice is worth downstream — 70 rows move at either scenario, six of them KPI closures, and tools/kp_slot_cost.py re-measures it on every run"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "dKp_peak"
type = "Ratio"
unit = "One"
lower = 0.0
upper = 2.0
reason_lower = "Kp(ap) is concave, so by Jensen's inequality the daily peak three-hourly Kp cannot sit below the table's reading of the daily mean. A negative correction contradicts the inequality the whole row rests on, and means the sign or the slot has been swapped. The smallest measured bin median is +0.833"
reason_upper = "the largest measured bin median is +1.747 and the relation is a table that clamps at its ends, so no input can produce more than that. 2.0 is therefore unreachable by this relation and exists to catch a broken table rather than an extreme sky"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "ap"
var = "sw_storm_return_level"
type = "Ratio"

[[algorithm.step]]
number = 1
text = "read the measured peak-slot offset off the nine binned medians at this Ap"
binds = "off"
type = "Ratio"

[data]
# Pinned to solar-weather@2026.09.14, and this list can only pin the NAME —
# crates/vleo-modules compares `d == b`. The nine medians must be re-measured
# if the bundle version changes. Same obligation as sw_storm_return_level.
bundles = ["solar-weather"]

[view]
kind = "line"
over = "orbit_mission_duration"
points = 60

