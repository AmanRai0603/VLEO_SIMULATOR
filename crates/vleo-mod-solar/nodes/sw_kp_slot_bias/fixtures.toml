# Known-good values, and where each came from.
#
# The one rule: an expected value may never be produced by the code
# under test. The schema refuses a row whose provenance is the
# implementation, because a number worked out by the thing being
# checked proves nothing.
#
# WHAT THESE ARE
#
# The nine bin medians of  max_8(Kp) - table(Ap_daily)  over
# bundles/solar-weather, on the 10,297 days carrying both an Ap and all eight
# three-hourly Kp, binned on prf_ap2kp's own edges: 0 5 10 15 20 30 45 70 110
# 400. Computed outside this crate, from the record, which is also what
# prf_ap2kp's fitOffset_ returns — so these are the numbers a parity grid would
# have carried, and the node carries none.
#
# Each fixture is placed AT a bin centre, where the relation returns the
# tabulated median exactly, so the tolerance is transcription-tight rather than
# a fit residual. Nothing between two centres is a fixture: there the answer is
# the interpolation's and not the record's.
#
# The two clamp cases are included because holding the end bins rather than
# extrapolating is the behaviour prf_ap2kp chose and this node inherits.

[[fixture]]
label = "Ap bin 0-5, centre 2.5 — 2529 days"
expect = 1
tolerance = 1e-12
provenance = "independent-derivation"
source = "noaa_swpc"
inputs = { ap = 2.5 }

