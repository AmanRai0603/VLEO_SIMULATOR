rests_on = "That the fifth-percentile dip below the centred 27-day mean, binned within 15 per cent of the rotation level, describes the window, with the answer held at the lowest level for anything below 70 solar flux units."
breaks_if = "Evidence that quiet stretches below 70 solar flux units have larger daily dips, or that a different bin width or averaging window changes the table."
relation = "dF107_day_low(L) = -pctl(F107 - movmean(F107, 27 d), 0.05) over days whose rotation sits within 15% of L"
