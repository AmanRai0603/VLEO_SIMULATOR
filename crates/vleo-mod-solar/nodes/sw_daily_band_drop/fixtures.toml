# Known-good values, and where each came from. An expected value may
# never be produced by the code under test.
#
# WHAT THESE CHECK, AND WHAT THEY CANNOT.
#
# The table in this node's hole is MEASURED DATA. Its knots were derived from
# bundles/solar-weather@2026.09.14 by the method the theory tab sets out, in a
# separate implementation that shares no code with this one — so a fixture AT A
# KNOT is a transcription check: it says the seven or eight pairs were copied
# into the hole correctly, which is the commonest way a table goes wrong and is
# wrong everywhere at once when it does.
#
# A fixture BETWEEN knots checks the interpolation, worked out by hand from the
# two bracketing knots. A fixture outside the ends checks the clamp.
#
# What no fixture here can check is whether the KNOTS THEMSELVES are right. That
# is a question about the derivation and the record, and it is what the empty
# confirmed_by on this sheet is asking a person for.

[[fixture]]
label = "at the declared window's own sustained cold level, 69.63 — just under the bottom knot, so this is the clamp and it is the case that unblocked the chain"
