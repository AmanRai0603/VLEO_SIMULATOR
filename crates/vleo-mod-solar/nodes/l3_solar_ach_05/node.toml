# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "l3_solar_ach_05"
label = "Closure — Ap, single day"
folder = "l3_solar_ach_05"   # frozen at seed
subsystem = "solar"
parent = "l3_solar"
kind = "achieved"
owner = "environment"
tier = "A"
criticality = "minor"   # minor | significant — significant means two reviewers and a differential fill
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
order = 1341
state = "published"

# The environmental half of the single-day Ap closure. Its paired requirement is
# l3_solar_req_05, which declares what the vehicle can take; this says what the
# record says the window will present.

# THE PAIR WITH ach_03, AND WHY BOTH EXIST. This is the driver set's own
# answer: the sustained hot Ap with the within-rotation daily spread measured
# at that level added to it, so it stays consistent with the F10.7 columns
# beside it and moves when the scenario moves. ach_03 asks a different
# question of the same quantity -- what recurs once per mission life across
# the whole record -- and answers 158.4. Neither supersedes the other: this
# one belongs to the scenario, that one to the record.

# WHY THIS ROW STOPPED BEING A RESTATEMENT.
#
# It used to read one input and return it unchanged: its whole body was
# `let ach = conclusion;`. Measured against the row beneath it, it produced the
# same number under every perturbation -- it WAS that row, under a second name,
# and a tree with two names for one number is a tree nobody can read.
#
# Worse, the closure it was supposed to be half of did not exist. Nothing read
# the requirement at all. l3_solar_req_03's own sheet says so in as many words:
# "Nothing in the tree compares 158.4 against 132 automatically; the three
# exceedance rows measure it and a person reads them." A design tool that
# cannot close its own requirement is not closing anything.
#
# So it now reads BOTH sides and publishes what neither of them holds: the
# signed fractional margin, in the sense the requirement declares. Positive is
# room, negative is a violation and its size. That is a third number, it is the
# one a designer actually acts on, and it moves when either side moves.
#
# The shape is the twelve KPI closures' -- mission::closure(req, ach, sense) --
# because a second way of computing a margin is a second way of getting its
# sign wrong.

[question]
text = "How much room does the single-day Ap requirement have left?"
note = """
An achieved row restates the subsystem's conclusion on the side of the
comparison the closure reads. It computes nothing of its own, and it exists
rather than the closure reading sw_ap_design_short directly so that the
comparison binds two rows of the same shape at the same layer — visible on the
tree instead of an edge somebody has to trace.
"""

[maths]
# An achieved row restates the subsystem's conclusion on the side of the
# comparison the closure reads. It computes nothing of its own.
expression = "M_ap_short = closure(Ap_req_short, Ap_short, AtMost).margin"
source = "noaa_swpc"

[theory]
why = """
A closure is a comparison between what is required and what is achieved, and it
is only checkable if both sides are rows. The requirement side is l3_solar_req_05,
a declared commitment about the vehicle; this is the achieved side, and it is an
identity on sw_ap_design_short.

Which of the subsystem's Ap conclusions it restates is the whole content of the
row, because the subsystem has three that a reader could mistake for each other:
the sustained level, the worst day of the design band, and the one storm the
mission is expected to meet. This one is the single-day level. Its siblings are
sw_ap_design_long and sw_storm_return_level, and at the declared window the
three are 26.70, 90.55 and 158.38 — far enough apart that restating the wrong
one would move a closure from passing to failing or back.
"""
reading = """
90.5472 at the declared window, against a ceiling of 132. THE CLOSURE HOLDS,
with 46 per cent of room, and it did not until 2026-09-16.

It held at 41.70 before that, on a number that was wrong: the daily band was one
percentile measured over days whose rotations averaged Ap 11.64 and applied at a
sustained Ap of 26.70, where the record says a one-in-twenty day departs by
63.85. Conditioning the band on the rotation level took this row to 90.55 and
the closure failed at the old ceiling of 80, the G2 threshold.

The ceiling was raised to 132, the G3 threshold, by decision — not to make the
arithmetic pass but because a one-day commitment at G2 is below what this window
presents, and 90.55 is a G3-G4 day. The ladder stays anchored in the published
scale and stays ordered: 48 operate indefinitely, 132 survive one day, 207 not
destroyed by the one storm.

It inherits every limitation of the row it restates and a closure reading it sees
none of them: the centre beneath it is a cycle analogue at the mission's own
epoch, the band around that centre is 1.28 sigma — the 90th percentile, while the
run is labelled 95 per cent — and the within-rotation term is read at the top knot
of a table whose top knot rests on 300 days.
"""

[[theory.step]]
text = """
The closure to be made checkable is single-day Ap achieved against single-day Ap
required. Both sides must be rows, at the same layer, in the same quantity and
unit, or the comparison is not something the tree can verify.
"""

[[theory.step]]
text = """
The requirement side is a declared commitment with a person's name against it.
The achieved side must be the subsystem's own conclusion and nothing else, so
this row is an identity on sw_ap_design_short.
"""
math = "Ap_ach_short = sw_ap_design_short = 90.5472"

[[theory.step]]
text = """
Which makes the closure arithmetic trivial: 90.55 achieved against 132 required.
The ceiling is the G3 threshold, raised from G2 once the level-conditioned band
showed this window's own hot scenario reaching a G3-G4 day.
"""
math = "90.55 <= 132 — the closure holds"

[[assumption]]
text = "It inherits every limitation of the row it restates, and a closure reading it sees none of them"
fails_when = "a margin is computed from this row against a capability. The centre beneath it is a cycle analogue scaled, beyond one cycle past cycle 25's maximum, by the mean amplitude of two completed cycles whose peaks differ by 41 per cent; the band is 1.28 sigma, which is the 90th percentile and not the 95 per cent the run is labelled; and the residuals it is a sigma of are skewed. None of that travels across the closure, and the margin looks like a clean number either way"

[[assumption]]
text = "It restates the single-day level and not one of its two siblings"
fails_when = "somebody reads it as the other. The subsystem publishes three Ap conclusions — 26.70 sustained, 90.55 for the worst day of the design band, 158.38 for the one storm expected in the mission — and they answer three different questions. Restating the wrong one would move this closure from passing to failing or back without anything in the tree noticing"

[[assumption]]
text = "Nothing compares this row with its requirement automatically"
fails_when = "a reader assumes the tree checks the closure. The pairing is a convention the matrix draws; `sense` is declared on the requirement row and the gate checks only that it is present. All five closures in this group hold as of 2026-09-16, and two of them did not the day before — this one at 90.55 against 80, and the Ap storm at 158.38 against 150. Both were invisible to every machine check in this repository, and both were found by a person reading the numbers rather than by anything running"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "M_ap_short"
type = "Ratio"
unit = "One"
lower = -10.0
upper = 1.0
reason_lower = "a margin of -10 is a requirement exceeded by eleven times its own value. Below that the comparison has stopped being a design margin and become a sign that one side is in the wrong unit, and it should refuse rather than report a number nobody will read as a fraction"
reason_upper = "1 is the whole of the requirement: an achieved value of zero against a positive bound. A margin above 1 under this sense would mean the achieved value is negative, which none of these drivers can be"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "ach"
var = "sw_ap_design_short"
type = "Ratio"

[[input]]
# The requirement this closes against. `req` is not decoration: the gate reads
# this binding to decide the row IS a closure, and check 7e then requires the
# hole to apply the sense the requirement declares.
binding = "req"
var = "l3_solar_req_05"
type = "Ratio"

[[algorithm.step]]
number = 1
text = "compare achieved against required in the declared sense and return the signed fractional margin"
binds = "m"
type = "Ratio"

[view]
kind = "line"
over = "orbit_mission_duration"
points = 60
