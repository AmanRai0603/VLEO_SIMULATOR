# Known-good values, and where each came from. An expected value may
# never be produced by the code under test.
#
# WHAT THESE ARE. A sum of two numbers this node does not compute, times a
# constant this node declares. The centre comes from sw_central_expectation and
# the spread from sw_mean_band_spread, both pinned by their own evidence; what
# is checked here is only that the addition is that addition and that the
# declared bound refuses a level no consumer of F10.7 can model.
#
# The inputs are chosen here rather than taken from the study, deliberately.
# The study's own trio — 158.3304112313161, 13.496881576668528, 175.60641964945182
# — would make the expected value the prior implementation's answer, and that may
# not be a fixture. It is in parity.csv beside this sheet, where it belongs.

[[fixture]]
label = "a mid-cycle centre of 160 with this repository's own measured spread — 160 + 1.28 × 13.554959"
expect = 177.35034752
tolerance = 1e-12
provenance = "independent-derivation"
source = "noaa_swpc"
inputs = { central = 160.0, spread = 13.554959 }

[[fixture]]
label = "round numbers, so the arithmetic is checkable without a calculator — 100 + 1.28 × 20"
