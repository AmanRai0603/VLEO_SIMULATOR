# Known-good values, and where each came from.
#
# The one rule: an expected value may never be produced by the code
# under test. The schema refuses a row whose provenance is the
# implementation, because a number worked out by the thing being
# checked proves nothing.
#
# WHAT THESE ARE
#
# The RMS of F107(t+L) - 114.8437 — the error you carry if you forecast the record mean and nothing else, measured over bundles/solar-weather on pairs where BOTH days were
# observed and are exactly L days apart. Computed outside this crate, from the
# record. It is nearly flat because it is the record's own standard deviation, 44.39 sfu; it moves only as the set of target days shifts with the lead.
#
# Each fixture sits AT a measured lead, where the relation returns the tabulated
# value exactly, so the tolerance is transcription-tight. Nothing between two
# leads is a fixture: there the answer is the interpolation's. Lead is a Time in
# SECONDS at the boundary, so each is L * 86400.

[[fixture]]
label = "lead 1 day — 10312 observed pairs"
expect = 44.3929
tolerance = 1e-12
provenance = "independent-derivation"
source = "noaa_swpc"
inputs = { lead = 86400.0 }

