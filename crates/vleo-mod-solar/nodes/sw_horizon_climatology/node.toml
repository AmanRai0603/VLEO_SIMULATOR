# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "sw_horizon_climatology"
label = "F10.7 error from climatology at a lead"
folder = "sw_horizon_climatology"   # frozen at seed; renaming the label never moves the directory
subsystem = "solar"
parent = "l3_solar"
kind = "computed"
owner = "environment"
tier = "A"
criticality = "minor"   # minor | significant — significant means two reviewers and a differential fill
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
order = 1358
state = "published"

# No migrated_from and no parity grid, for the same two reasons as its pair: an
# empirical RMS rather than a closed form, and a deliberate departure over the
# record's absent days.

[question]
text = "If we forecast the record's mean F10.7 and nothing else, how wrong are we L days later?"
note = "The baseline that makes sw_horizon_persistence mean something. On its own this number says little; against persistence it says which of the two cheapest forecasts is worth using, and the lead where the answer changes is the horizon prf_horizon exists to find."

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How wrong a forecast of the Sun's flux would be if it always predicted the long-run average and ignored today. It is almost flat, about 44 to 45 solar flux units at every lead, and it is the yardstick for the other cheap forecast: today's flux beats it out to about 547 days and loses by 730."
breaks = "This baseline knows nothing about where the Sun is in its cycle; one that did would be much better and would beat today's-flux sooner, so the horizon it implies is too long. The crossover itself is not published by this row, and the table must be re-measured if the data bundle changes."
wrong = "It is easy to expect a baseline error that grows with lead. This one ignores lead, so its error is just the spread of the record about its mean, and that flatness is the point."
by = "an assistant, from what this sheet states — for its owner (environment) to confirm"

[maths]
# The RMS departure of the target day from the record mean, measured at the same
# eighteen leads and interpolated.
expression = "C(L) = RMS[F107(t+L) - 114.8437], from the record"
source = "noaa_swpc"

# WHERE THIS RELATION CAME FROM. Prose, outside the sheet hash: correcting a
# sentence here does not invalidate a generated artefact. The tab before this one
# states the relation; this says why it is that relation, and the tab after it
# shows what the machine made of it.
[theory]
why = """
A structure function on its own says how fast persistence degrades and not
whether persistence is worth using. That needs the other cheap forecast
beside it: ignore today entirely and predict the record's mean. Where the
two curves cross is the predictability horizon — the lead beyond which
knowing today's flux buys nothing. This row is the second curve, and its
defining property is one that looks like a defect until the purpose is
clear: it barely depends on the lead at all.
"""
reading = """
The crossover is the design answer and this row does not state it. Read
against sw_horizon_persistence, persistence is the better forecast out to
about 547 days and is beaten by 730 — so today's flux is worth something for
roughly a year and a half, which is far longer than a 27-day outlook horizon
would suggest. That number is a property of the pair and the tree carries
one answer per row, so a third row could state it and none does yet. And the
horizon is measured against a DEAF baseline: a climatology that knew the
cycle phase would beat persistence sooner.
"""

[[theory.step]]
text = """
Define the climatology forecast as predicting the record's unconditional
mean for every day, regardless of lead, and take its RMS error at the same
leads the persistence curve uses.
"""
math = "C(L) = RMS[ F107(t + L) - 114.8437 ]"

[[theory.step]]
text = """
Because the forecast does not use the lead, its error cannot depend on the
lead except through which target days happen to be in the sample. So the
curve should be flat, and a baseline that degrades with lead would be the
wrong baseline to compare against.
"""

[[theory.step]]
text = """
Measured, it is flat to within 1 sfu across three orders of magnitude in
lead — 44.39 at one day, 45.32 at two years. The whole variation comes from
the target-day set shifting rather than from anything becoming harder.
"""

[[theory.step]]
text = """
The value it is flat AT is the record's own standard deviation about its
mean, which makes it a consistency check on the persistence row: the
saturation limit quoted there, sqrt(2) times sigma, is sqrt(2) times this
number.
"""
math = "C(L) ~ sigma = 44.39 sfu; sqrt(2) * 44.39 = 62.77"

[[theory.step]]
text = """
Put the two curves together and the horizon falls out. Persistence starts
far below climatology — 7.1 against 44.4 at a one-day lead — rises past the
rotation dip, and crosses somewhere between 547 and 730 days.
"""

[[theory.step]]
text = """
One caveat that shortens the answer rather than lengthening it. This
baseline knows nothing about the solar cycle, and a phase-conditioned
climatology would be much better than 114.84 everywhere — so the horizon
this pair implies is the horizon against a deaf baseline, and a fair one
would be reached sooner. The date needed to build the fair baseline now
exists; this row deliberately does not use it, because changing the baseline
would change what the horizon means without changing its name.
"""

# THE METHOD — the relation in the method language (docs/PSEUDOCODE.md). In the
# sheet hash: the generated code is translated from it.
[method]
text = """
# Transcribed from crates/vleo-mod-solar/nodes/sw_horizon_climatology/model.rs (HOLE 1 and its guards) — the method the code already runs.
# Numbers: NOAA SWPC (noaa_swpc) F10.7 record, RMS departure of the target day from the record mean 114.8437 sfu, from solar-weather@2026.09.14.
# The eighteen measured leads in days; linear between them, held at both ends (as Table1 does).
# The generated "not a number" guard, moved to the input: the table is finite and held at both ends, so the answer is NaN exactly when the lead is.
if not (lead == lead) then
  refuse "the computation produced a value that is not a number"
end
let err = interp(lead, [1, 2, 3, 5, 7, 10, 14, 20, 27, 40, 60, 90, 135, 180, 270, 365, 547, 730] [d], [44.3929, 44.3953, 44.3968, 44.3993, 44.4012, 44.4036, 44.4069, 44.4071, 44.4147, 44.4242, 44.4344, 44.4458, 44.4635, 44.4714, 44.5344, 44.6734, 45.0333, 45.3201] [1])
if err < 0 then
  refuse "an RMS cannot be negative, and this one is the spread of the record about its own mean, 44 sfu"
end
if err > 50 then
  refuse "the measured entries run 44.39 to 45.32 sfu and the table clamps: above 50 the table is broken"
end
return err
"""
by = "Aman Rai / 2026-10-03"

