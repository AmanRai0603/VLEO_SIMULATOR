# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "sw_horizon_climatology"
label = "F10.7 error from climatology at a lead"
folder = "sw_horizon_climatology"   # frozen at seed; renaming the label never moves the directory
subsystem = "solar"
parent = "l3_solar"
kind = "computed"
owner = "environment"
tier = "A"
criticality = "minor"   # minor | significant — significant means two reviewers and a differential fill
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
order = 1350
state = "published"

# No migrated_from and no parity grid, for the same two reasons as its pair: an
# empirical RMS rather than a closed form, and a deliberate departure over the
# record's absent days.

[question]
text = "If we forecast the record's mean F10.7 and nothing else, how wrong are we L days later?"
note = "The baseline that makes sw_horizon_persistence mean something. On its own this number says little; against persistence it says which of the two cheapest forecasts is worth using, and the lead where the answer changes is the horizon prf_horizon exists to find."

[maths]
# The RMS departure of the target day from the record mean, measured at the same
# eighteen leads and interpolated.
expression = "C(L) = RMS[F107(t+L) - 114.8437], from the record"
source = "noaa_swpc"

# WHERE THIS RELATION CAME FROM. Prose, outside the sheet hash: correcting a
# sentence here does not invalidate a generated artefact. The tab before this one
# states the relation; this says why it is that relation, and the tab after it
# shows what the machine made of it.
[theory]
why = """
A structure function on its own says how fast persistence degrades and not
whether persistence is worth using. That needs the other cheap forecast
beside it: ignore today entirely and predict the record's mean. Where the
two curves cross is the predictability horizon — the lead beyond which
knowing today's flux buys nothing. This row is the second curve, and its
defining property is one that looks like a defect until the purpose is
clear: it barely depends on the lead at all.
"""
reading = """
The crossover is the design answer and this row does not state it. Read
against sw_horizon_persistence, persistence is the better forecast out to
about 547 days and is beaten by 730 — so today's flux is worth something for
roughly a year and a half, which is far longer than a 27-day outlook horizon
would suggest. That number is a property of the pair and the tree carries
one answer per row, so a third row could state it and none does yet. And the
horizon is measured against a DEAF baseline: a climatology that knew the
cycle phase would beat persistence sooner.
"""

[[theory.step]]
text = """
Define the climatology forecast as predicting the record's unconditional
mean for every day, regardless of lead, and take its RMS error at the same
leads the persistence curve uses.
"""
math = "C(L) = RMS[ F107(t + L) - 114.8437 ]"

[[theory.step]]
text = """
Because the forecast does not use the lead, its error cannot depend on the
lead except through which target days happen to be in the sample. So the
curve should be flat, and a baseline that degrades with lead would be the
wrong baseline to compare against.
"""

[[theory.step]]
text = """
Measured, it is flat to within 1 sfu across three orders of magnitude in
lead — 44.39 at one day, 45.32 at two years. The whole variation comes from
the target-day set shifting rather than from anything becoming harder.
"""

[[theory.step]]
text = """
The value it is flat AT is the record's own standard deviation about its
mean, which makes it a consistency check on the persistence row: the
saturation limit quoted there, sqrt(2) times sigma, is sqrt(2) times this
number.
"""
math = "C(L) ~ sigma = 44.39 sfu; sqrt(2) * 44.39 = 62.77"

[[theory.step]]
text = """
Put the two curves together and the horizon falls out. Persistence starts
far below climatology — 7.1 against 44.4 at a one-day lead — rises past the
rotation dip, and crosses somewhere between 547 and 730 days.
"""

[[theory.step]]
text = """
One caveat that shortens the answer rather than lengthening it. This
baseline knows nothing about the solar cycle, and a phase-conditioned
climatology would be much better than 114.84 everywhere — so the horizon
this pair implies is the horizon against a deaf baseline, and a fair one
would be reached sooner. The date needed to build the fair baseline now
exists; this row deliberately does not use it, because changing the baseline
would change what the horizon means without changing its name.
"""


[[assumption]]
text = "It is nearly flat, and it is the record's own standard deviation"
fails_when = "the climatology forecast ignores the lead entirely, so its error is the spread of the target days about the mean and nothing more: 44.39 sfu at a one-day lead, 45.32 at two years. The whole variation across eighteen leads is under 1 sfu, and it comes from the set of target days shifting rather than from anything getting harder. Anyone expecting a baseline that degrades with lead is expecting the wrong baseline — that is the point of using it as one."

[[assumption]]
text = "The crossover is the design answer, and this row does not state it"
fails_when = "read against sw_horizon_persistence, persistence is the better forecast out to about 547 days and is beaten by 730 — so today's flux is worth something for roughly a year and a half, which is longer than the 27-day outlook horizon would suggest. That crossover is the number a designer wants and neither row publishes it: it is a property of the pair, and the tree carries one answer per row. A third row could state it; none does yet."

[[assumption]]
text = "The mean is the record's unconditional mean, so this baseline knows nothing about the cycle"
fails_when = "a climatology that knew the solar cycle phase would be a much better baseline than 114.84 sfu everywhere, and would beat persistence sooner. That needs a date, and the date now exists: sys_mission_requirements_mission_epoch is published and sw_mean_cycle_level already turns it into a phase-conditioned level. So a fair baseline is buildable and is not built here — this row deliberately keeps the deaf baseline, because changing it would change what the horizon below means without changing its name. So the horizon this pair implies is the horizon against a DEAF baseline, and a fair baseline would shorten it."

[[assumption]]
text = "Only pairs of REAL observations exactly L days apart, which is again not what the MATLAB does"
fails_when = "prf_design and prf_horizon both build a full daily grid and fill the record's 273 absent days by linear interpolation. Interpolated days have no variability, so every error statistic spanning them is understated. This row pairs only days that were both observed, as sw_uncertainty_growth does, and for the same reason: a number that is partly invented is not a measurement of the record. It is therefore expected to disagree slightly with prf_horizon, which is why it carries no parity grid."

[[assumption]]
text = "Pinned to solar-weather@2026.09.14, and the [data] declaration can only pin the name"
fails_when = "crates/vleo-modules compares bundle NAMES, so a run with a later solar-weather satisfies the precondition and still uses this table. Every entry must be re-measured if the bundle version changes. The same obligation sits on every measured row in this group."

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "D_clim"
type = "Ratio"
unit = "One"
lower = 0.0
upper = 50.0
reason_lower = "an RMS cannot be negative, and this one cannot approach zero: it is the spread of the record about its own mean, which is 44 sfu"
reason_upper = "the measured entries run 44.39 to 45.32 sfu and the relation is a table that clamps, so no input can produce more. 50 is above both and tight enough to catch a broken table, which a bound of 65 would not"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "lead"
var = "orbit_mission_duration"
type = "Time"

[[algorithm.step]]
number = 1
text = "take the lead in days and read the measured climatology RMS at that lead"
binds = "err"
type = "Ratio"

[data]
bundles = ["solar-weather"]

[view]
kind = "line"
over = "orbit_mission_duration"
points = 60
