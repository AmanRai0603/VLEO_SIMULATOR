# Known-good values, and where each came from.
#
# The one rule: an expected value may never be produced by the code
# under test. The schema refuses a row whose provenance is the
# implementation, because a number worked out by the thing being
# checked proves nothing.
#
# A MARGIN'S EVIDENCE IS ARITHMETIC A PERSON CAN CHECK.
#
# There is no physics in this row. It reads two numbers the tree already
# publishes and returns (required - achieved) / required, so every fixture
# SUPPLIES both sides and states the quotient worked out by hand. Two of the
# three are the cases that catch a sign error, which is the only interesting
# way this row can be wrong: on the bound the margin is zero, and at twice
# the bound it is -1. A row applying the sense backwards passes neither.

[[fixture]]
label = "the sustained F10.7 the record presents against the 260 sfu commitment"
expect = 0.599725639035
tolerance = 1e-12
provenance = "independent-derivation"
source = "noaa_swpc"
inputs = { ach = 104.0713338509, req = 260.0000000 }

[[fixture]]
label = "exactly on the bound, where the margin must be zero and the closure still closed"
expect = 0.000000000000
tolerance = 1e-12
provenance = "independent-derivation"
source = "noaa_swpc"
inputs = { ach = 260.0000000, req = 260.0000000 }

[[fixture]]
label = "twice the bound, where the margin must be -1 and the closure must fail"
expect = -1.000000000000
tolerance = 1e-12
provenance = "independent-derivation"
source = "noaa_swpc"
inputs = { ach = 520.0000000, req = 260.0000000 }
