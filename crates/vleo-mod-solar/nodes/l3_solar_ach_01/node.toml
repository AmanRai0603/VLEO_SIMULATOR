# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "l3_solar_ach_01"
label = "Solar flux"
folder = "l3_solar_ach_01"   # frozen at seed; renaming the label never moves the directory
subsystem = "solar"
parent = "l3_solar"
kind = "achieved"
owner = "environment"
tier = "A"
criticality = "minor"   # minor | significant — significant means two reviewers and a differential fill
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
order = 1331
state = "published"

# THE ACHIEVED SIDE ONLY. Its paired requirement row, l3_solar_req_01, is
# still seeded and cannot be written here: layers/l3_solar.toml says a required
# row in this group states THE WORST SKY THIS DESIGN CAN SUSTAIN, which is a
# spacecraft capability and not something the solar record knows. That number is
# a declared value somebody confirms, and an agent may not supply one.
#
# So the closure this pair exists to make does not close yet. What exists is the
# environmental half, on a row, with its provenance — which is the half this
# subsystem owes.

[question]
text = "What is the worst solar flux the record says this mission will present?"
note = "The headline of the three. It is the same number the interface carries to sys_space_environment, restated on the achieved side of the closure so that the comparison against what the spacecraft can sustain happens on a row rather than in somebody's head."

[maths]
# An achieved row restates the subsystem's conclusion on the side of the
# comparison the closure reads. It computes nothing of its own.
expression = "F107_ach_flux = sw_f107_design"
source = "noaa_swpc"

[[assumption]]
text = "It inherits every limitation of the row it restates, and a closure reading it sees none of them"
fails_when = "the same cost as the interface, and worth repeating on the row a closure actually binds. The number cannot tell solar maximum from solar minimum, because no row in this tree publishes a date; where it is a percentile it is the 95th and not a worst case; and where it is a return level its top end rests on two observations in 28.2 years. A margin computed from this row against a capability carries none of that, and will look like a clean number either way."

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "F107_ach_flux"
type = "Ratio"
unit = "One"
lower = 60.0
upper = 400.0
reason_lower = "the same floor as env_f107 and sw_f107_design: below 60 sfu has never been observed and no relation reading F10.7 has support there"
reason_upper = "the same ceiling as env_f107 and sw_f107_design: above 400 sfu the exospheric temperature relation is extrapolated past the largest recorded daily value"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "conclusion"
var = "sw_f107_design"
type = "Ratio"

[[algorithm.step]]
number = 1
text = "restate the subsystem's conclusion on the achieved side of the closure"
binds = "ach"
type = "Ratio"

[view]
kind = "line"
over = "orbit_mission_duration"
points = 60
