# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "sw_ap_design_long"
label = "Sustained Ap to design to"
folder = "sw_ap_design_long"   # frozen at seed
subsystem = "solar"
parent = "l3_solar"
kind = "computed"
owner = "environment"
tier = "A"
# SIGNIFICANT, and not by default. This is one of the four numbers §20 has the
# subsystem publish, it feeds density then drag then lifetime, and its
# multiplier is a constant this sheet had to argue about rather than inherit.
# Two reviewers and a differential fill is the right cost for that.
criticality = "significant"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
order = 1377
state = "published"

# The prior implementation, named so the parity grid beside this node has
# something to be the parity of.
migrated_from = "prf_density.m:217 (01_kernel/sw_study/06_density, designWindow_, hotmean for ap)"
# Arithmetic on two supplied numbers: the two should agree to the last bits.
parity_tolerance = 1e-9

[question]
text = "What daily planetary Ap must the design survive as a sustained level over the mission window?"
note = """
The Ap twin of sw_f107_design_long, and NOT the same question as sw_ap_design.
That row asks what extreme recurs once per mission; this asks what level the
window sits at. A design needs both and they are different numbers by a factor
of several.
"""

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "The disturbed level of geomagnetic activity the design must survive, held over the mission window: the expected centre plus a margin, about 26.7 on the daily index. It feeds density, then drag, then lifetime, and is what a propellant budget integrates."
breaks = "The margin of 1.28 spreads is really a 90th-percentile edge while the run is labelled 95 per cent. The index cannot go below zero and swings a long way upward, so a symmetric margin understates the far upper tail, although at this particular margin it slightly over-covers."
wrong = "This is not the same as the storm level the design must survive once per mission; that asks what extreme recurs, this asks what level the window sits at, and the two differ by a factor of several."
by = "an assistant, from what this sheet states — for its owner (environment) to confirm"

[maths]
# A person has NOT read this relation against its source yet.
confirmed_by = ""
expression = "Ap_long = Ap_central + 1.28 * sigma_ap"
source = "noaa_swpc"

[[input]]
binding = "central"
var = "sw_ap_central_expectation"
type = "Ratio"

[[input]]
binding = "spread"
var = "sw_ap_mean_band_spread"
type = "Ratio"

[[algorithm.step]]
number = 1
text = "add 1.28 standard deviations of the Ap rotation-forecast residual to the central expectation"
binds = "sustained"
type = "Ratio"

[theory]
why = """
Ap_central says where the window sits, sw_ap_mean_band_spread says how wrong
the pattern has been about that, and 1.28 of the spread is the margin. The
multiplier is the same 1.28 as its F10.7 twin and carries the same problem: it
is the one-sided 90th percentile of a normal while the run is labelled 95 per
cent, and the daily half of the band uses the true 0.95.

Which number that is, is now a row of its own — sw_band_confidence, seeded by
§30 B2 and unanswered, because the value needs a person. Until it carries one
the multiplier is a literal in this hole and three others, each saying it is
declared in the sheet while no sheet declares it. §44 measures what each answer
costs: moving to 1.645 moves 47 rows and no KPI closure, leaves all five solar
closures closing with 3.1 to 6.2 per cent less margin, and breaks no parity
check in this repository.

Ap makes the normal assumption worse than F10.7 does. The index floors at zero,
a quiet rotation cannot undershoot far, and an active one overshoots a long
way — so the residuals are strongly right-skewed and a symmetric z multiplier
understates exactly the tail a design is sized against.

That is true of the far tail and NOT of this multiplier, which §45 measures:
at 1.28 sigma the Ap band holds 0.9148 to 0.9239 of the exceedances against a
normal's 0.8997, so it over-covers by 1.5 to 2.4 points. The understatement
starts beyond it — the 99th percentile of exceedance runs 2.53 to 2.87 sigma
where a normal says 2.33.
"""
reading = """
26.6953 at the declared window, against the study's hotmean of 26.6833 — 0.045
per cent, and the construction is exact on the study's own inputs:
22.0925383902 + 1.28 * 3.5865545525 = 26.6833282174.
"""

# THE METHOD — the relation in the method language (docs/PSEUDOCODE.md). In the
# sheet hash: the generated code is translated from it.
[method]
text = """
# Transcribed from crates/vleo-mod-solar/nodes/sw_ap_design_long/model.rs (HOLE 1 and its guards) — the method the code already runs.
# Numbers: 1.28 is declared in the sheet, the one-sided 90th percentile of a normal; the spread is the Ap rotation-forecast residual measured on the NOAA SWPC record (noaa_swpc); migrated from prf_density.m:217 designWindow_.
const z = 1.28 [1]   # one-sided 90th percentile of a normal, declared in the sheet
let sustained = central + spread * z

# Generated guards: the declared domain of Ap_long.
if sustained < 0 then
  refuse "Ap floors at zero, so a design level below it means a spread has been subtracted rather than added"
end
if sustained > 300 then
  refuse "above 300 the level exceeds the largest daily Ap in the record, 273, so a sustained level there is not a window this tool can model"
end
return sustained
"""
by = "Aman Rai / 2026-10-03"

[[case]]
label = "this repository's own chain — the Ap centre with its measured spread."
refuse = "no"
expect = 26.69530964
tolerance = 1e-12
inputs = { central = 22.095389, spread = 3.593688 }
origin = "hand"

[[case]]
label = "round numbers, checkable without a calculator."
refuse = "no"
expect = 25.12
tolerance = 1e-12
inputs = { central = 20.0, spread = 4.0 }
origin = "hand"

[[case]]
label = "a quiet centre with a narrow spread, where the lower guard starts to matter."
refuse = "no"
expect = 32.56
tolerance = 1e-12
inputs = { central = 30.0, spread = 2.0 }
origin = "hand"

[[case]]
label = "outside what the node holds for: its code refuses it, and so must the developer's"
refuse = "yes"
inputs = { central = -10.0, spread = 1.0 }
origin = "hand"

[[case]]
label = "outside what the node holds for: its code refuses it, and so must the developer's"
refuse = "yes"
inputs = { central = 290.0, spread = 10.0 }
origin = "hand"

[output]
symbol = "Ap_long"
type = "Ratio"
unit = "One"
lower = 0.0
upper = 300.0
reason_lower = "Ap floors at zero — a perfectly quiet day is Ap 0 — so a design level below it means a spread has been subtracted rather than added"
reason_upper = "above 300 the level exceeds the largest daily Ap in the record, 273, so a SUSTAINED level there is not a window this tool can model"

[view]
kind = "number"

