# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "pay_bits_per_pixel"
label = "Bits per pixel"
folder = "pay_bits_per_pixel"   # frozen at seed; renaming the label never moves the directory
subsystem = "pay"
parent = "l3_payload"
kind = "declared"
owner = "payload"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 660
state = "published"

[question]
text = "How many bits does each sample carry?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How many bits each image sample carries: 12. More bits mean a finer range of brightness levels."
breaks = "It is only useful between 8 and 16 bits. Below 8 the range of brightness is too coarse for measuring light accurately; above 16 the extra bits go below the detector's own noise."
wrong = "It is easy to think more bits always carry more information. Above 16 bits they exceed the detector's own noise floor, so the extra bits carry only noise."
by = "an assistant, from what this sheet states — for its owner (payload) to confirm"

[maths]
expression = "b_px = 12"
source = "orbitt_case_c1"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "b_px"
type = "Ratio"
unit = "One"
lower = 8.0
upper = 16.0
reason_lower = "below 8 bits the dynamic range is not usable for radiometry"
reason_upper = "above 16 bits exceeds the detector's own noise floor and the extra bits carry noise"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 12.0
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (payload) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That 12 bits per sample is right for this design's detector, as taken from the source case the sheet cites (orbitt_case_c1), confirmed by A. Rai on 2026-09-01."
breaks_if = "A detector or data-chain specification for this payload that samples at a number of bits other than 12."
relation = "b_px = 12"
source = "orbitt_case_c1"
