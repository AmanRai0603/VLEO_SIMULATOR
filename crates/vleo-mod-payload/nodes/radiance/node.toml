# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "pay_radiance"
label = "At-aperture spectral radiance"
folder = "radiance"   # frozen at seed; renaming the label never moves the directory
subsystem = "pay"
parent = "pay_optical"
kind = "declared"
owner = "payload"
tier = "A"
state = "published"

[question]
text = "How bright is the scene at the aperture, per unit wavelength?"

[maths]
expression = "L_ap = 60"
source = "modtran_ref"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "L_ap"
type = "Ratio"
unit = "One"
lower = 0.1
upper = 500.0
reason_lower = "below 0.1 W/m2/sr/um the scene is darker than any night-time reference used here"
reason_upper = "above 500 W/m2/sr/um the scene is brighter than a desert at noon"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 60.0
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

