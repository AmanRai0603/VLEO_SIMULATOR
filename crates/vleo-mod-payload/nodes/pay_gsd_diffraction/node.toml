# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "pay_gsd_diffraction"
label = "Diffraction-limited ground sample"
folder = "pay_gsd_diffraction"   # frozen at seed; renaming the label never moves the directory
subsystem = "pay"
parent = "l3_payload"
kind = "computed"
owner = "payload"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 671
state = "published"

[question]
text = "What is the finest detail the optics can resolve, whatever the detector?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "The finest detail on the ground, in metres, that the optics can resolve whatever the detector, set by the wavelength of the light, the aperture and the flight altitude through the Rayleigh criterion, the usual limit for telling two points apart. It feeds the ground-resolution performance measure."
breaks = "It is the optics' limit alone, at one wavelength and one aperture; the detector sets a separate one. Below a millimetre the relation is being fed an aperture that is not physical; above a kilometre no product in this design is being made."
by = "an assistant, from what this sheet states — for its owner (payload) to confirm"

[maths]
expression = "GSD = 1.22*lambda*h/D"
source = "larson_wertz"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "GSD_d"
type = "Length"
unit = "Metre"
lower = 0.001
upper = 1000.0
reason_lower = "below a millimetre the relation is being fed an aperture that is not physical"
reason_upper = "above a kilometre no product in this design is being made"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "h"
var = "orbit_altitude"
type = "Length"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "lam"
var = "pay_wavelength"
type = "Length"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "d"
var = "pay_aperture"
type = "Length"

[[algorithm.step]]
number = 1
text = "apply the Rayleigh criterion at the flight altitude"
binds = "g"
type = "Length"

[contributes]
kpis = ["kpi_gsd"]

[view]
kind = "line"
over = "orbit_altitude"
points = 60

[[version]]
n = 1
release = "next"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (payload) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "The Rayleigh criterion at the flight altitude, as stated and cited from larson_wertz, not yet derived on the sheet."
breaks_if = "A derivation or a check against larson_wertz disagrees, or the result falls below a millimetre or above a kilometre."
relation = "GSD = 1.22*lambda*h/D"
source = "larson_wertz"
