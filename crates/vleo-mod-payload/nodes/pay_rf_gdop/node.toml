# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "pay_rf_gdop"
label = "Geolocation geometric dilution"
folder = "pay_rf_gdop"   # frozen at seed; renaming the label never moves the directory
subsystem = "pay"
parent = "l3_payload"
kind = "declared"
owner = "payload"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 670
state = "published"

[question]
text = "How much does the formation geometry amplify timing error into position error?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How much the shape of the formation of satellites magnifies a small error in timing a radio signal into an error in where the emitter is placed. It cannot be below one; the design takes four, and it feeds the geolocation performance measure."
breaks = "It is one fixed number for the whole formation, picked by a person rather than worked out from where the satellites actually are. Past fifty the geometry is so poor that no position can be solved at all, and the number stops meaning anything."
by = "an assistant, from what this sheet states — for its owner (payload) to confirm"

[maths]
expression = "GDOP_rf = 4"
source = "orbitt_case_c2"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "GDOP_rf"
type = "Ratio"
unit = "One"
lower = 1.0
upper = 50.0
reason_lower = "a dilution below one is not geometrically possible"
reason_upper = "above 50 the formation geometry is degenerate and no solution is produced"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 4.0
confirmed_by = "A. Rai / 2026-09-01"

[contributes]
kpis = ["kpi_geolocation"]

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (payload) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That a dilution of 4 (a plain ratio) is right for this formation's geometry; the value is declared, confirmed by A. Rai on 2026-09-01, and the sheet gives no further reason for it."
breaks_if = "An analysis of the actual formation geometry giving a different dilution, or a geometry near enough to degenerate that the dilution heads towards fifty."
relation = "GDOP_rf = 4"
source = "orbitt_case_c2"
