# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "pay_compression"
label = "Image compression ratio"
folder = "pay_compression"   # frozen at seed; renaming the label never moves the directory
subsystem = "pay"
parent = "l3_payload"
kind = "declared"
owner = "payload"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 661
state = "published"

[question]
text = "By what factor is the imagery compressed before downlink?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "By what factor the imagery is squeezed before it is sent to the ground: 3. The larger the factor, the less data has to be sent down."
breaks = "The factor alone does not say how much image quality is lost. It is only meaningful from 1, no compression at all, up to 20; beyond 20 to 1 the compression loses enough to destroy the brightness measurements the product is sold on."
wrong = "It is easy to treat a higher compression factor as free downlink. Above 20 to 1 the loss destroys the measurements the product is sold on."
by = "an assistant, from what this sheet states — for its owner (payload) to confirm"

[maths]
expression = "CR_img = 3"
source = "ccsds122"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "CR_img"
type = "Ratio"
unit = "One"
lower = 1.0
upper = 20.0
reason_lower = "unity is no compression, the limit"
reason_upper = "above 20:1 the compression is lossy enough to destroy the radiometry the product is sold on"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 3.0
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "next"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (payload) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That a compression factor of 3 suits this design's imagery, following the compression standard the sheet cites (ccsds122), confirmed by A. Rai on 2026-09-01."
breaks_if = "A compression scheme chosen for this payload that achieves a different factor than 3, or quality tests showing the product's measurements do not survive it."
relation = "CR_img = 3"
source = "ccsds122"
