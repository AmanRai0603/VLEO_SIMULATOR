# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "pay_gsd"
label = "Achieved ground sample distance"
folder = "pay_gsd"   # frozen at seed; renaming the label never moves the directory
subsystem = "pay"
parent = "l3_payload"
kind = "computed"
owner = "payload"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 673
state = "published"

[question]
text = "What ground sample distance does the system actually achieve?"
note = "Taking the better of the two produces a resolution claim the optics cannot deliver and the detector cannot sample, and it survives review because both inputs are individually correct."

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "The size on the ground, in metres, of the finest detail the imager actually delivers: the worse of what the optics can resolve and what the detector can sample. It feeds the ground-resolution performance measure."
breaks = "It considers only those two limits. Below a millimetre the inputs are not physical; above a kilometre no product in this design is being made."
wrong = "That the resolution is the better of the two limits. That claim is one the optics cannot deliver and the detector cannot sample, and it survives review because both inputs are individually correct."
by = "an assistant, from what this sheet states — for its owner (payload) to confirm"

[maths]
expression = "GSD = max(GSD_diffraction, GSD_detector)"
source = "larson_wertz"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "GSD"
type = "Length"
unit = "Metre"
lower = 0.001
upper = 1000.0
reason_lower = "below a millimetre the inputs are not physical"
reason_upper = "above a kilometre no product in this design is being made"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "gd"
var = "pay_gsd_diffraction"
type = "Length"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "gp"
var = "pay_gsd_detector"
type = "Length"

[[algorithm.step]]
number = 1
text = "take the worse of the two limits, never the better"
binds = "g"
type = "Length"

[contributes]
kpis = ["kpi_gsd"]

[view]
kind = "number"

[[version]]
n = 1
release = "next"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (payload) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "The worse of the diffraction and detector limits, as stated and cited from larson_wertz, not yet derived on the sheet."
breaks_if = "A derivation or a check against larson_wertz disagrees, or the result falls below a millimetre or above a kilometre."
relation = "GSD = max(GSD_diffraction, GSD_detector)"
source = "larson_wertz"
