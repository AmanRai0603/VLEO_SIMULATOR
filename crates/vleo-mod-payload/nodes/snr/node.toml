# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "pay_snr"
label = "Optical signal to noise ratio"
folder = "snr"   # frozen at seed; renaming the label never moves the directory
subsystem = "pay"
parent = "l3_payload"
kind = "computed"
owner = "payload"
tier = "B"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
state = "published"

[question]
text = "How clean is one sample?"

[maths]
expression = "SNR = N_e/sqrt(N_e + N_dark + n_read^2)"
source = "larson_wertz"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "SNR_o"
type = "Ratio"
unit = "One"
lower = 0.0
upper = 10000.0
reason_lower = "a signal to noise ratio cannot be negative"
reason_upper = "above 10000 the detector is far outside its linear range"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "n"
var = "pay_signal_electrons"
type = "Ratio"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "nr"
var = "pay_read_noise"
type = "Ratio"

[[algorithm.step]]
number = 1
text = "combine shot noise, a nominal 5-electron dark contribution and read noise in quadrature"
binds = "s"
type = "Ratio"

[contributes]
kpis = ["kpi_gsd"]

[view]
kind = "number"

