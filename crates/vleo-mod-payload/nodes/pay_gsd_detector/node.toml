# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "pay_gsd_detector"
label = "Detector-limited ground sample"
folder = "pay_gsd_detector"   # frozen at seed; renaming the label never moves the directory
subsystem = "pay"
parent = "l3_payload"
kind = "computed"
owner = "payload"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 672
state = "published"

[question]
text = "What is the finest detail the detector can sample, whatever the optics?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "The finest detail on the ground, in metres, that the detector can sample whatever the optics: one pixel projected onto the ground through the focal length from the flight altitude."
breaks = "It is the detector's limit alone; the optics set a separate one. Below a millimetre the relation is being fed a focal length that is not physical; above a kilometre no product in this design is being made."
by = "an assistant, from what this sheet states — for its owner (payload) to confirm"

[maths]
expression = "GSD = h*p/f"
source = "larson_wertz"

[method]
text = """
# Transcribed from crates/vleo-mod-payload/nodes/pay_gsd_detector/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
return detector_limited_gsd(h, p, f)
"""
by = ""
transcribed_from = "crates/vleo-mod-payload/nodes/pay_gsd_detector/model.rs"
checked_by = "Aman Rai"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "GSD_p"
type = "Length"
unit = "Metre"
lower = 0.001
upper = 1000.0
reason_lower = "below a millimetre the relation is being fed a focal length that is not physical"
reason_upper = "above a kilometre no product in this design is being made"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "h"
var = "orbit_altitude"
type = "Length"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "p"
var = "pay_pixel_pitch"
type = "Length"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "f"
var = "pay_focal_length"
type = "Length"

[[algorithm.step]]
number = 1
text = "project one pixel onto the ground through the focal length"
binds = "g"
type = "Length"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (payload) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "Altitude times pixel pitch over focal length, as stated and cited from larson_wertz, not yet derived on the sheet."
breaks_if = "A derivation or a check against larson_wertz disagrees, or the result falls below a millimetre or above a kilometre."
relation = "GSD = h*p/f"
source = "larson_wertz"
