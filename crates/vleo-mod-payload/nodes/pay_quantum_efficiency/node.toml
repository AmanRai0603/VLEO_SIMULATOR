# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "pay_quantum_efficiency"
label = "Detector quantum efficiency"
folder = "pay_quantum_efficiency"   # frozen at seed; renaming the label never moves the directory
subsystem = "pay"
parent = "l3_payload"
kind = "declared"
owner = "payload"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 662
state = "published"

[question]
text = "What fraction of incident photons become photoelectrons?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "The share of light particles reaching the detector that become electrical signal: 0.75, that is three quarters. The higher it is, the more signal each image collects."
breaks = "It is one figure standing for the whole band of light the detector sees. It is only meaningful between 5 per cent, below which the detector is not one considered here, and 95 per cent, which no back-illuminated detector reaches across the band."
by = "an assistant, from what this sheet states — for its owner (payload) to confirm"

[maths]
expression = "QE = 0.75"
source = "orbitt_case_c1"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "QE"
type = "Ratio"
unit = "One"
lower = 0.05
upper = 0.95
reason_lower = "below 5% the detector is not one considered here"
reason_upper = "above 95% no back-illuminated detector reaches it across the band"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 0.75
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (payload) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That 0.75 is this design's detector efficiency, as taken from the source case the sheet cites (orbitt_case_c1), confirmed by A. Rai on 2026-09-01."
breaks_if = "A detector datasheet or test for this payload showing an efficiency across the band other than 0.75."
relation = "QE = 0.75"
source = "orbitt_case_c1"
