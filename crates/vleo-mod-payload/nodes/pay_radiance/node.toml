# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "pay_radiance"
label = "At-aperture spectral radiance"
folder = "pay_radiance"   # frozen at seed; renaming the label never moves the directory
subsystem = "pay"
parent = "l3_payload"
kind = "declared"
owner = "payload"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 664
state = "published"

[question]
text = "How bright is the scene at the aperture, per unit wavelength?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How bright the scene is when its light reaches the telescope, for each slice of wavelength: 60, somewhere between a dark night-time scene and a desert at noon."
breaks = "The number is carried without a unit; the unit appears only in the reasons for its bounds, as watts per square metre, per unit of viewing direction, per micrometre of wavelength. One brightness stands for every scene, held sensible from 0.1, darker than any night-time reference used here, to 500, brighter than a desert at noon."
by = "an assistant, from what this sheet states — for its owner (payload) to confirm"

[maths]
expression = "L_ap = 60"
source = "modtran_ref"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "L_ap"
type = "Ratio"
unit = "One"
lower = 0.1
upper = 500.0
reason_lower = "below 0.1 W/m2/sr/um the scene is darker than any night-time reference used here"
reason_upper = "above 500 W/m2/sr/um the scene is brighter than a desert at noon"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 60.0
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "next"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (payload) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That a scene brightness of 60 is the right reference for this design, with the value from the atmospheric reference the sheet cites (modtran_ref), confirmed by A. Rai on 2026-09-01."
breaks_if = "A reference scene or atmospheric model for this design's targets that gives a brightness at the telescope other than 60."
relation = "L_ap = 60"
source = "modtran_ref"
