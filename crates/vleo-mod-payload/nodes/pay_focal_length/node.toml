# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "pay_focal_length"
label = "Optical focal length"
folder = "pay_focal_length"   # frozen at seed; renaming the label never moves the directory
subsystem = "pay"
parent = "l3_payload"
kind = "declared"
owner = "payload"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 656
state = "published"

[question]
text = "What is the effective focal length of the telescope?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "The effective focal length of the telescope, the distance over which it brings light to a focus: 2.4 metres. It is one of the numbers the camera design is built from."
breaks = "It is only meaningful between 5 centimetres and 20 metres. Below 5 centimetres, the ground patch each pixel sees is coarser than anything useful; above 20 metres no folded optical path of this class is that long."
by = "an assistant, from what this sheet states — for its owner (payload) to confirm"

[maths]
expression = "f_o = 2.4"
source = "orbitt_case_c1"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "f_o"
type = "Length"
unit = "Metre"
lower = 0.05
upper = 20.0
reason_lower = "below 5 cm the detector-limited sample is coarser than anything useful"
reason_upper = "above 20 m no folded optical path of this class is that long"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 2.4
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "next"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (payload) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That 2.4 m is the telescope's effective focal length for this design, as taken from the source case the sheet cites (orbitt_case_c1), confirmed by A. Rai on 2026-09-01."
breaks_if = "A telescope design or specification for this payload with an effective focal length other than 2.4 m."
relation = "f_o = 2.4"
source = "orbitt_case_c1"
