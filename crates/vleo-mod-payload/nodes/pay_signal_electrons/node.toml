# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "pay_signal_electrons"
label = "Signal electrons per sample"
folder = "pay_signal_electrons"   # frozen at seed; renaming the label never moves the directory
subsystem = "pay"
parent = "l3_payload"
kind = "computed"
owner = "payload"
tier = "B"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 676
state = "published"

[question]
text = "How many photoelectrons does one ground sample produce?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How many electrons one ground sample frees in the detector, the raw signal the image is built from: light from the scene gathered through the aperture over the dwell time, passed through the optics, and converted at the detector's quantum efficiency, the fraction of light that becomes signal."
breaks = "It collects light over a fixed band 100 nanometres wide. Above a billion electrons the detector is saturated many times over, so the count stops meaning anything."
by = "an assistant, from what this sheet states — for its owner (payload) to confirm"

[maths]
expression = "N_e = L*Omega*A_px*B*tau*QE*t/(h*c/lambda)"
source = "larson_wertz"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "N_e"
type = "Ratio"
unit = "One"
lower = 0.0
upper = 1000000000.0
reason_lower = "an electron count cannot be negative"
reason_upper = "above a billion electrons the well is saturated many times over"

