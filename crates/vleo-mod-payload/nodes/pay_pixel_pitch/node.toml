# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "pay_pixel_pitch"
label = "Detector pixel pitch"
folder = "pay_pixel_pitch"   # frozen at seed; renaming the label never moves the directory
subsystem = "pay"
parent = "l3_payload"
kind = "declared"
owner = "payload"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 657
state = "published"

[question]
text = "How large is one detector pixel?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "The size of one detector pixel: 5.5 micrometres, a micrometre being a thousandth of a millimetre. Pixels too large let the detector, not the telescope, limit the detail."
breaks = "It is only meaningful between 1 and 30 micrometres. No space-qualified detector has pixels below one micrometre, and above 30 micrometres the pixel, not the telescope, limits the detail and the opening is wasted."
by = "an assistant, from what this sheet states — for its owner (payload) to confirm"

[maths]
expression = "p_x = 5.5"
source = "orbitt_case_c1"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "p_x"
type = "Length"
unit = "Micrometre"
lower = 1.0
upper = 30.0
reason_lower = "below one micrometre no space-qualified detector has pixels that small"
reason_upper = "above 30 micrometres the detector-limited sample dominates and the aperture is wasted"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 5.5
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "next"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (payload) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That 5.5 micrometres is the pixel size of this design's detector, as taken from the source case the sheet cites (orbitt_case_c1), confirmed by A. Rai on 2026-09-01."
breaks_if = "A detector selected for this payload whose pixel size differs from 5.5 micrometres."
relation = "p_x = 5.5"
source = "orbitt_case_c1"
