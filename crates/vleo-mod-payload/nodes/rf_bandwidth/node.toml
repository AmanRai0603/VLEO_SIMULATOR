# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "pay_rf_bandwidth"
label = "Intercept receiver bandwidth"
folder = "rf_bandwidth"   # frozen at seed; renaming the label never moves the directory
subsystem = "pay"
parent = "pay_rf"
kind = "declared"
owner = "payload"
tier = "A"
state = "published"

[question]
text = "Over what bandwidth does the geolocation payload observe?"

[maths]
expression = "B_rf = 20"
source = "orbitt_case_c2"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "B_rf"
type = "Frequency"
unit = "Megahertz"
lower = 0.1
upper = 500.0
reason_lower = "below 100 kHz the timing precision is too coarse for any geolocation requirement here"
reason_upper = "above 500 MHz the digitiser and the downlink neither fit nor close"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 20.0
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

