# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "pay_geolocation_error"
label = "RF geolocation error"
folder = "pay_geolocation_error"   # frozen at seed; renaming the label never moves the directory
subsystem = "pay"
parent = "l3_payload"
kind = "computed"
owner = "payload"
tier = "B"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 680
state = "published"

[question]
text = "How accurately can an emitter on the ground be located?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How accurately, in metres, a radio emitter on the ground can be located: the uncertainty in when its signal arrives, turned into a distance and enlarged by how poor the geometry of the measurement is. It feeds the geolocation performance measure."
breaks = "It takes the timing uncertainty and the geometry penalty as single figures. Below a centimetre no time-difference system in this design performs that well; above 10000 kilometres the answer carries no information."
by = "an assistant, from what this sheet states — for its owner (payload) to confirm"

[maths]
expression = "e = c*sigma_tau*GDOP"
source = "larson_wertz"

[method]
text = """
# Transcribed from crates/vleo-mod-payload/nodes/pay_geolocation_error/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
return tdoa_geolocation_error(s, g)
"""
by = ""
transcribed_from = "crates/vleo-mod-payload/nodes/pay_geolocation_error/model.rs"
checked_by = ""

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "e_geo"
type = "Length"
unit = "Metre"
lower = 0.01
upper = 10000000.0
reason_lower = "below a centimetre no time-difference system in this design performs that well"
reason_upper = "above 10000 km the answer carries no information"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "s"
var = "pay_toa_uncertainty"
type = "Time"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "g"
var = "pay_rf_gdop"
type = "Ratio"

[[algorithm.step]]
number = 1
text = "convert the timing uncertainty into a range uncertainty and apply the geometric dilution"
binds = "e"
type = "Length"

[contributes]
kpis = ["kpi_geolocation"]

[view]
kind = "line"
over = "pay_rf_bandwidth"
points = 60

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (payload) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "Timing uncertainty converted to range and multiplied by the geometric dilution, as stated and cited from larson_wertz, not yet derived on the sheet."
breaks_if = "A derivation or a check against larson_wertz disagrees, or the error falls below a centimetre or above 10000 kilometres."
relation = "e = c*sigma_tau*GDOP"
source = "larson_wertz"
