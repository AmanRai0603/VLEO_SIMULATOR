# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "pay_toa_uncertainty"
label = "Time of arrival uncertainty"
folder = "pay_toa_uncertainty"   # frozen at seed; renaming the label never moves the directory
subsystem = "pay"
parent = "l3_payload"
kind = "computed"
owner = "payload"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 679
state = "published"

[question]
text = "How precisely can the payload time an intercepted signal?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How precisely the payload can tell when an intercepted signal arrived. It is the best timing any receiver could reach, set by the signal's bandwidth, how strong it is against the noise and how long it is listened to, and that timing is what lets the payload say where a signal came from."
breaks = "It is a lower limit on timing, so a real receiver does no better and the number is the optimistic end. Coarser than about one second, the timing carries no information about where the signal came from; finer than a femtosecond, no receiver in this design times that precisely."
by = "an assistant, from what this sheet states — for its owner (payload) to confirm"

[maths]
expression = "sigma = 1/(2*pi*B*sqrt(2*SNR*B*T))"
source = "larson_wertz"

[method]
text = """
# Transcribed from crates/vleo-mod-payload/nodes/pay_toa_uncertainty/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
return toa_timing_uncertainty(b, s, t)
"""
by = ""
transcribed_from = "crates/vleo-mod-payload/nodes/pay_toa_uncertainty/model.rs"
checked_by = ""

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "sig_tau"
type = "Time"
unit = "Second"
lower = 1e-15
upper = 1.0
reason_lower = "below a femtosecond no receiver in this design times that precisely"
reason_upper = "above one second the measurement carries no geolocation information"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "b"
var = "pay_rf_bandwidth"
type = "Frequency"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "s"
var = "pay_rf_snr"
type = "Ratio"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "t"
var = "pay_rf_integration"
type = "Time"

[[algorithm.step]]
number = 1
text = "apply the Cramer-Rao lower bound on time-of-arrival estimation"
binds = "sg"
type = "Time"

[view]
kind = "number"

