# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "pay_dwell_time"
label = "Per-sample dwell time"
folder = "pay_dwell_time"   # frozen at seed; renaming the label never moves the directory
subsystem = "pay"
parent = "l3_payload"
kind = "computed"
owner = "payload"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 675
state = "published"

[question]
text = "How long does the sensor have to collect photons from one ground sample?"
note = "The constraint low altitude imposes and higher orbits do not: the ground moves under the sensor faster in angular terms, which partly gives back the signal-to-noise the shorter range won."

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How long, in seconds, the sensor has to collect light from one patch of ground before the ground has moved on by one sample: the size of a ground sample divided by the speed of the ground track."
breaks = "It is a limit low altitude imposes and higher orbits do not. Below a nanosecond no detector collects anything; above one second the ground has moved many samples during the collection."
wrong = "That flying lower only helps the image because the range is shorter. The ground moves under the sensor faster in angular terms, so collection time shrinks and partly gives back the signal-to-noise the shorter range won."
by = "an assistant, from what this sheet states — for its owner (payload) to confirm"

[maths]
expression = "t = GSD/V_g"
source = "larson_wertz"

[method]
text = """
# Transcribed from crates/vleo-mod-payload/nodes/pay_dwell_time/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
return dwell_time(g, v)
"""
by = ""
transcribed_from = "crates/vleo-mod-payload/nodes/pay_dwell_time/model.rs"
checked_by = ""

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "t_dwell"
type = "Time"
unit = "Second"
lower = 1e-09
upper = 1.0
reason_lower = "below a nanosecond no detector integrates"
reason_upper = "above one second the ground has moved many samples during the integration"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "g"
var = "pay_gsd"
type = "Length"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "v"
var = "orbit_ground_track_speed"
type = "Velocity"

[[algorithm.step]]
number = 1
text = "divide the ground sample distance by the ground track speed"
binds = "t"
type = "Time"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (payload) to confirm"
about = ["node"]
