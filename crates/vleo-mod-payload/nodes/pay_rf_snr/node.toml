# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "pay_rf_snr"
label = "Intercept signal to noise ratio"
folder = "pay_rf_snr"   # frozen at seed; renaming the label never moves the directory
subsystem = "pay"
parent = "l3_payload"
kind = "declared"
owner = "payload"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 668
state = "published"

[question]
text = "What signal to noise ratio does the intercepted emitter present, as a linear ratio?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How strong the intercepted radio emitter's signal is compared with the background noise, as a plain ratio rather than in decibels. The design takes ten: the signal is ten times the noise."
breaks = "It is one declared figure, not worked out from the emitter's power or distance. Below one tenth the signal cannot be detected at all, and above a thousand the emitter is so strong that locating it is no longer limited by this number."
wrong = "It is easy to read ten as ten decibels; the sheet asks for a linear ratio, so ten means the signal is ten times the noise."
by = "an assistant, from what this sheet states — for its owner (payload) to confirm"

[maths]
expression = "SNR_rf = 10"
source = "orbitt_case_c2"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "SNR_rf"
type = "Ratio"
unit = "One"
lower = 0.1
upper = 1000.0
reason_lower = "below 0.1 the signal is not detectable at all"
reason_upper = "above 1000 the emitter is so strong that geolocation is not the limiting problem"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 10.0
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (payload) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That a signal to noise ratio of 10 (a plain ratio) is what the intercepted emitter presents; the value is declared, confirmed by A. Rai on 2026-09-01, and the sheet gives no further reason for it."
breaks_if = "A link analysis or measurement for the emitters this payload targets that gives a different ratio, especially one near the undetectable floor of one tenth."
relation = "SNR_rf = 10"
source = "orbitt_case_c2"
