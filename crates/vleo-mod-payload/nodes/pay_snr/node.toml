# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "pay_snr"
label = "Optical signal to noise ratio"
folder = "pay_snr"   # frozen at seed; renaming the label never moves the directory
subsystem = "pay"
parent = "l3_payload"
kind = "computed"
owner = "payload"
tier = "B"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 677
state = "published"

[question]
text = "How clean is one sample?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How clean one sample is: the signal set against the noise that comes with it, from the randomness of the light itself, the detector's dark signal and its read noise. It feeds the ground-resolution performance measure."
breaks = "It takes a nominal dark contribution of 5 electrons rather than a measured one. Above 10000 the detector is far outside its linear range."
by = "an assistant, from what this sheet states — for its owner (payload) to confirm"

[maths]
expression = "SNR = N_e/sqrt(N_e + N_dark + n_read^2)"
source = "larson_wertz"

[method]
text = """
# Transcribed from crates/vleo-mod-payload/nodes/pay_snr/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
# Constants the code held, written out here as it held them: 5.
return optical_snr(n, 5, nr)
"""
by = ""
transcribed_from = "crates/vleo-mod-payload/nodes/pay_snr/model.rs"
checked_by = ""

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "SNR_o"
type = "Ratio"
unit = "One"
lower = 0.0
upper = 10000.0
reason_lower = "a signal to noise ratio cannot be negative"
reason_upper = "above 10000 the detector is far outside its linear range"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "n"
var = "pay_signal_electrons"
type = "Ratio"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "nr"
var = "pay_read_noise"
type = "Ratio"

[[algorithm.step]]
number = 1
text = "combine shot noise, a nominal 5-electron dark contribution and read noise in quadrature"
binds = "s"
type = "Ratio"

[contributes]
kpis = ["kpi_gsd"]

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (payload) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "Shot noise, a nominal 5-electron dark contribution and read noise combined in quadrature, as stated and cited from larson_wertz, not yet derived on the sheet."
breaks_if = "The detector's dark contribution differs from the nominal 5 electrons, a check against larson_wertz disagrees, or the ratio exceeds 10000."
relation = "SNR = N_e/sqrt(N_e + N_dark + n_read^2)"
source = "larson_wertz"
