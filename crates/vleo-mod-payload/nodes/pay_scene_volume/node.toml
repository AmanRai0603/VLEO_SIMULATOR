# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "pay_scene_volume"
label = "Data volume per scene"
folder = "pay_scene_volume"   # frozen at seed; renaming the label never moves the directory
subsystem = "pay"
parent = "l3_payload"
kind = "computed"
owner = "payload"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 678
state = "published"

[question]
text = "How much data is one imaged scene?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How much data one imaged scene makes, in gigabits, from the number of pixels, the bits per pixel, the spectral bands and the compression. It feeds the data-volume performance measure."
breaks = "It assumes a square scene as wide as the across-track pixel count, in exactly four spectral bands; a longer strip or a different number of bands would give another answer. Above a petabit no single scene in this design is produced."
by = "an assistant, from what this sheet states — for its owner (payload) to confirm"

[maths]
expression = "V = N_x*N_y*b*bands/CR"
source = "ccsds122"

[method]
text = """
# Transcribed from crates/vleo-mod-payload/nodes/pay_scene_volume/model.rs (its HOLE): the relation the code ran, line for line.
# The relation itself stays in the kernel; this says which one, with which inputs, in which units.
# Constants the code held, written out here as it held them: 4.
return scene_data_volume(n, n, b, 4, cr)
"""
by = ""
transcribed_from = "crates/vleo-mod-payload/nodes/pay_scene_volume/model.rs"
checked_by = ""

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "V_scene"
type = "DataVolume"
unit = "Gigabit"
lower = 0.0
upper = 1000000.0
reason_lower = "a data volume cannot be negative"
reason_upper = "above a petabit no single scene in this design is produced"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "n"
var = "pay_pixels_across"
type = "Ratio"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "b"
var = "pay_bits_per_pixel"
type = "Ratio"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "cr"
var = "pay_compression"
type = "Ratio"

[[algorithm.step]]
number = 1
text = "assume a square scene of the across-track width, in four spectral bands"
binds = "v"
type = "DataVolume"

[contributes]
kpis = ["kpi_data_volume"]

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (payload) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "A square scene in four bands, with the volume relation as stated and cited from ccsds122, not yet derived on the sheet."
breaks_if = "The scene is not square or not four bands, a check against ccsds122 disagrees, or the volume exceeds a petabit."
relation = "V = N_x*N_y*b*bands/CR"
source = "ccsds122"
