# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "pay_wavelength"
label = "Centre wavelength"
folder = "pay_wavelength"   # frozen at seed; renaming the label never moves the directory
subsystem = "pay"
parent = "l3_payload"
kind = "declared"
owner = "payload"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 658
state = "published"

[question]
text = "At what wavelength does the imager work?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "The wavelength of light the imager works at: 550 nanometres. It sets what kind of detector and optics the payload is."
breaks = "It is one centre value for what is really a band of wavelengths. Below 350 nanometres the atmosphere absorbs most of the signal, and above 2500 nanometres the detector would have to be a cooled infrared array, which is a different payload from the one described."
by = "an assistant, from what this sheet states — for its owner (payload) to confirm"

[maths]
expression = "lam_o = 550"
source = "orbitt_case_c1"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "lam_o"
type = "Length"
unit = "Nanometre"
lower = 350.0
upper = 2500.0
reason_lower = "below 350 nm the atmosphere absorbs most of the signal"
reason_upper = "above 2500 nm the detector is a cooled infrared array, which is not the payload described here"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 550.0
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "next"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (payload) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That the imager works at a centre wavelength of 550 nanometres; the value is declared, confirmed by A. Rai on 2026-09-01, and the sheet gives no further reason for it."
breaks_if = "A payload specification with a different working wavelength, or a change to a cooled infrared detector."
relation = "lam_o = 550"
source = "orbitt_case_c1"
