# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "pay_rf_bandwidth"
label = "Intercept receiver bandwidth"
folder = "pay_rf_bandwidth"   # frozen at seed; renaming the label never moves the directory
subsystem = "pay"
parent = "l3_payload"
kind = "declared"
owner = "payload"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 667
state = "published"

[question]
text = "Over what bandwidth does the geolocation payload observe?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "The width of the radio band the geolocation payload listens across: 20 megahertz. It governs how precisely signals can be timed to locate their source."
breaks = "It is only meaningful between 100 kilohertz and 500 megahertz. Below 100 kilohertz the timing is too coarse for any geolocation requirement here; above 500 megahertz the digitiser and the downlink neither fit nor close."
by = "an assistant, from what this sheet states — for its owner (payload) to confirm"

[maths]
expression = "B_rf = 20"
source = "orbitt_case_c2"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "B_rf"
type = "Frequency"
unit = "Megahertz"
lower = 0.1
upper = 500.0
reason_lower = "below 100 kHz the timing precision is too coarse for any geolocation requirement here"
reason_upper = "above 500 MHz the digitiser and the downlink neither fit nor close"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 20.0
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (payload) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "That 20 MHz is the receiver bandwidth for this design, as taken from the source case the sheet cites (orbitt_case_c2), confirmed by A. Rai on 2026-09-01."
breaks_if = "A receiver design or geolocation requirement for this payload that calls for a bandwidth other than 20 MHz."
relation = "B_rf = 20"
source = "orbitt_case_c2"
