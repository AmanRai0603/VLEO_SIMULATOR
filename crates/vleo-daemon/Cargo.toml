[package]
name = "vleo-daemon"
description = "FACE — the local daemon. It serves the interface assets itself at 127.0.0.1, so the page and the engine share one origin: no cross-origin negotiation, no private-network preflight, and no internet required."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "vleo-daemon"
path = "src/main.rs"

[dependencies]
vleo-modules = { workspace = true, features = ["std"] }
vleo-bus = { workspace = true, features = ["std"] }
vleo-core = { workspace = true, features = ["std"] }
vleo-units = { workspace = true, features = ["std"] }
vleo-data = { workspace = true }
# The sheet loader, so a face can be served the declaration form and — once the
# write path lands — edit a row. This crate is the single implementation of what
# a sheet means; the alternative was a second copy of the form in JavaScript,
# which would drift and look complete while doing it.
vleo-sheet = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
