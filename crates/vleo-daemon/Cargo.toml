[package]
name = "vleo-daemon"
description = "FACE — the local daemon. It serves the interface assets itself at 127.0.0.1, so the page and the engine share one origin: no cross-origin negotiation, no private-network preflight, and no internet required."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "vleo-daemon"
path = "src/main.rs"

[dependencies]
vleo-modules = { workspace = true, features = ["std"] }
vleo-bus = { workspace = true, features = ["std"] }
vleo-core = { workspace = true, features = ["std"] }
vleo-units = { workspace = true, features = ["std"] }
vleo-data = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
