[package]
name = "vleo-daemon"
description = "FACE — the local daemon. It serves the interface assets itself at 127.0.0.1, so the page and the engine share one origin: no cross-origin negotiation, no private-network preflight, and no internet required."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "vleo-daemon"
path = "src/main.rs"

[dependencies]
# Everything the daemon does is the server's; this crate is its program — the
# name on the command line and the Windows identity (build.rs).
vleo-server = { workspace = true }

[lints.rust]
unsafe_code = "forbid"

[build-dependencies]
embed-resource = "3"
