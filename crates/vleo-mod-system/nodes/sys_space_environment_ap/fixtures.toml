# Known-good values, and where each came from.
#
# The one rule: an expected value may never be produced by the code
# under test. The schema refuses a row whose provenance is the
# implementation, because a number worked out by the thing being
# checked proves nothing.
#
# A RECEIVING ROW'S EVIDENCE IS THAT IT CHANGES NOTHING
#
# There is no physics at a seam. What can go wrong is that the row alters what it
# carries — a stray factor, a unit conversion nobody asked for, a clamp inherited
# from the wrong producer — and the failure is invisible because both sides look
# plausible. So every fixture is the identity, at a value taken from somewhere
# real, and what they pin is that the number arriving is the number leaving.

[[fixture]]
label = "the single-day Ap this tree's own chain gives for the declared window, which exceeds its own requirement"
expect = 90.5472096400
tolerance = 1e-12
provenance = "independent-derivation"
source = "noaa_swpc"
inputs = { crossing = 90.5472096400 }

