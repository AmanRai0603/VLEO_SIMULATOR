# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "sys_space_environment_solar_flux"
label = "Solar flux, sustained"
folder = "sys_space_environment_solar_flux"   # frozen at seed; renaming the label never moves the directory
subsystem = "sys"
parent = "sys_space_environment"
kind = "computed"
owner = "environment"
tier = "A"
criticality = "minor"   # minor | significant — significant means two reviewers and a differential fill
layer = 2   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote.
order = 306
state = "published"

# THE FIRST LAYER-2 ROW IN THIS REPOSITORY TO RECEIVE ANYTHING.
#
# All six sys_space_environment rows were seeded and empty, and layers/l3_solar
# .toml opens by saying why: the seeded tree gave this heading six rows and no
# layer-3 group to answer them. The solar-weather subsystem was added to be that
# group, and §20 built the crossing. This is the far side of it.
#
# WHAT A LAYER-2 ROW READING A CROSSING LOOKS LIKE, since this is the first and
# sixteen more will copy it. It reads `l3_solar_interface`, which is the one node
# of the solar subsystem visible from here, and NOTHING else in l3_solar. That is
# the whole rule: a subsystem is reached through its interface, never into.
#
# The crossing publishes a SET — five scenarios across three quantities, fifteen
# variables — so a layer-2 row picks the member it is about and says which. This
# row takes the primary: the sustained hot level, which is the one number a
# system reader wants if they read one.

[question]
text = "What solar flux does the system design to, as a level sustained for months at a time?"
note = """
The headline of the space-environment heading, and the number an array is sized
on and a drag budget integrates. Its siblings carry what one DAY inside it
reaches: sys_space_environment_f10_7 for the flux and sys_space_environment_ap
for the geomagnetic index.

Sustained and single-day are two rows here for the same reason they are two rows
in the subsystem below: a design reads one or the other depending on what it is
sizing, and a tool that published only one would have decided for the reader
which of the two their problem is.
"""

[maths]
# A person has NOT read this relation against its source yet.
confirmed_by = ""
expression = "F107_sys = l3_solar_interface"
source = "noaa_swpc"

[[input]]
# The consumer declares what it expects. Assembly refuses a mismatch
# against what the producer publishes — which is the only place the
# whole graph is visible and therefore the only place to ask.
binding = "crossing"
var = "l3_solar_interface"
type = "Ratio"

[[algorithm.step]]
number = 1
text = "receive the subsystem's sustained flux conclusion across the seam"
binds = "received"
type = "Ratio"

# WHERE THIS RELATION CAME FROM. Prose, outside the sheet hash: correcting a
# sentence here does not invalidate a generated artefact.
[theory]
why = """
A layer-2 row states what the SYSTEM works with. It does not compute the
environment — nobody builds the Sun — so what it does is receive, from the one
node of the subsystem below that is visible from here.

It is an identity, and the identity is the point rather than an omission. A
layer-2 row that recomputed anything would be doing subsystem work in a place no
subsystem reviewer reads, and the number a system reader saw would not exist
anywhere inside the subsystem that owns it.

The declared range is the crossing's own, restated. Narrowing it would refuse
answers the subsystem considers valid and widening it would admit answers the
subsystem would refuse — either way this row would be changing the answer while
appearing to receive it.
"""
reading = """
104.07 sfu at the declared window. Two things about that number are worth a
system reader's attention and neither is visible from here.

It is far below the 158.33 the study this was ported from publishes for its own
window, because sw_central_expectation reads a cycle analogue over the mission's
own dates rather than holding the last rotation forecast forward. That is a
recorded decision, not a discrepancy.

And it is a 1.28-sigma band edge, which is the 90th percentile although the run
is labelled 95 per cent. The credibility vector travels across the seam; that
does not.

THE 81-DAY MEAN NOW ARRIVES TOO, as sys_space_environment_f10_7_81day, which
was added after step 6 found it missing. Every thermospheric density model in use
takes the pair, daily and 81-day, because the two carry different physics: the
daily value drives the EUV heating of the day and the 81-day mean the background
state. It carries the same number this row does, 104.07, because the hot day's
81-day companion IS the hot sustained level.

WHAT STILL DOES NOT ARRIVE is Kp, which does not cross at all. §20.8 names the
three ways out and none has been chosen. It is recorded on
sys_space_environment_atmospheric_density, which is where somebody writing that
row will meet it.
"""

[[theory.step]]
text = "The system layer states what it works with and does not compute the environment. So the row receives."

[[theory.step]]
text = "It receives from the subsystem's one visible node and from nothing else inside it, which is what makes layer 3 something layer 2 can reason about without opening."
math = "F107_sys = l3_solar_interface — identity, deliberately"

[[theory.step]]
text = "The crossing carries a set of fifteen, so this row names the member it is about: the primary, which is the sustained hot level."
math = "l3_solar_interface (primary) = F107_hotmean = 104.07 sfu"

[[assumption]]
text = "It receives and does not compute, and a system reader sees none of the subsystem's limitations"
fails_when = "a margin is taken against this number. It is a 1.28-sigma band edge — the 90th percentile, while the run is labelled 95 per cent — on a centre that beyond one cycle past cycle 25's maximum is scaled by the mean amplitude of two completed cycles whose peaks differ by 41 per cent. The credibility vector crosses the seam; the assumptions do not, and that is the ordinary cost of having a seam at all"

[[assumption]]
text = "Kp does not reach layer 2 at all, and a density model needs it"
fails_when = "somebody writes sys_space_environment_atmospheric_density from the flux rows alone. The daily flux and the 81-day mean both arrive now; Kp does not cross, because the subsystem's three Kp relations each answer at one Ap and a driver set needs them at five. §20.8 names the three ways out. Until one is chosen a density row would have to convert Ap to Kp itself, which is the duplication the crossing exists to prevent"

[[assumption]]
text = "It is the sustained level and not the single day"
fails_when = "somebody sizes a thermal transient on it. The single day is sys_space_environment_f10_7 at 124.14, twenty sfu higher. Reading the wrong one of the two under-sizes a transient case or over-sizes a steady one"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "F107_sys"
type = "Ratio"
unit = "One"
lower = 60.0
upper = 400.0
reason_lower = "the crossing's own floor, restated: below 60 sfu has never been observed and every relation reading F10.7 has no support there. A row that narrowed the range it received would be changing the answer"
reason_upper = "the crossing's own ceiling, restated: above 400 sfu the exospheric temperature relation is extrapolated past the largest recorded daily value"

[view]
kind = "number"
