folder = "sys_orbit_geometry_off_nadir_angle"   # frozen at seed; renaming the label never moves the directory
subsystem = "sys"
parent = "sys_orbit_geometry"
kind = "declared"
owner = "environment"
tier = ""
layer = 2   # 1 management · 2 the system · 3 subsystem · 4 the run
state = "empty"

# SEEDED — the folder exists and nothing has been specified in it.
