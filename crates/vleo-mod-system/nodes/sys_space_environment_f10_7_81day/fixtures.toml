# Known-good values, and where each came from.
#
# The one rule: an expected value may never be produced by the code
# under test.
#
# A RECEIVING ROW'S EVIDENCE IS THAT IT CHANGES NOTHING
#
# There is no physics at a seam. What can go wrong is that the row alters what it
# carries, and the failure is invisible because both sides look plausible. So
# every fixture is the identity, at a value taken from somewhere real.

[[fixture]]
label = "the 81-day mean this tree's own chain gives for the declared window's hot day — the sustained hot level, 104.07, not the day's own 124.14"
expect = 104.07110896
tolerance = 1e-12
provenance = "independent-derivation"
source = "noaa_swpc"
inputs = { crossing = 104.07110896 }

