# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "sys_mission_requirements_mission_duration"
label = "Mission duration"
folder = "sys_mission_requirements_mission_duration"   # frozen at seed; renaming the label never moves the directory
subsystem = "sys"
parent = "sys_mission_requirements"
kind = "declared"
owner = "systems"
tier = ""
layer = 2   # 1 management · 2 the system · 3 subsystem · 4 the run
# Where this row sits among its siblings, as whoever wrote them ordered
# them. Folders sort alphabetically and a tree that reads alphabetically
# is a tree nobody wrote: `Achievable lifetime` before `Specific impulse`
# reverses the order the source put them in, and the order is part of
# what the source said.
order = 275
state = "published"

[question]
text = "How long must the mission operate?"

# SAID SIMPLY, AND WHERE THAT BREAKS — docs/EXPLAINING.md. Prose, outside the
# sheet hash.
[explain]
simply = "How long the mission must operate: five years. Every subsystem sizes against this same mission length."
breaks = "It assumes one duration governs the whole programme. If a constellation replaces satellites on a schedule shorter than a satellite's life, the satellite's life and the service's life are different numbers, and this row is the service's."
wrong = "That this is each satellite's lifetime. When satellites are replaced sooner, it is the length of the service, not of any one satellite."
by = "an assistant, from what this sheet states — for its owner (systems) to confirm"

[maths]
expression = "T_mis_req = 5"
source = "orbitt_case_c1"

[[assumption]]
text = "One duration governs the whole programme — every subsystem sizes against the same mission length"
fails_when = "a constellation replenishes on a schedule shorter than a satellite's life, so the satellite duration and the service duration are different numbers and this row is the second of them"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "T_mis_req"
type = "Time"
unit = "Year"
lower = 0.5
upper = 15.0
reason_lower = "below six months the programme cannot amortise a satellite, so it is not the mission being designed"
reason_upper = "above 15 years the cost model, the degradation model and the battery cycle model are all extrapolated well past their fits"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 5.0
# NOT A NEW CONFIRMATION. This is the same five years that has been declared on
# orbit_mission_duration since 2026-09-01 and confirmed there by A. Rai; the
# number has moved to the row that should own it and has not changed. Whoever
# re-confirms the mission length re-confirms it here from now on.
confirmed_by = "A. Rai / 2026-09-01, carried unchanged from orbit_mission_duration"

[view]
kind = "number"

[[version]]
n = 1
release = "0.1.1"
date = "2026-09-27"
by = "an assistant, transcribed from this sheet — for its owner (systems) to confirm"
about = ["node"]
changed = "first version: the belief this row already rested on, written down"
rests_on = "The declared 5.0 years is the mission length for this design, from the case the sheet cites, carried unchanged from the earlier mission-duration row where A. Rai confirmed it on 2026-09-01; the sheet gives no further reason for five."
breaks_if = "A programme decision or specification setting a mission length other than five years, or a replenishment schedule that makes satellite life and service life different numbers."
relation = "T_mis_req = 5"
source = "orbitt_case_c1"
