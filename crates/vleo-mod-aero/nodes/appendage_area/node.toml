# The sheet. This is the only file in this folder that must be written by
# hand, and every other artefact here is generated from it. A hand edit
# outside a numbered HOLE block in model.rs fails the regeneration diff.
id = "aero_appendage_area"
label = "Appendage frontal area"
folder = "appendage_area"   # frozen at seed; renaming the label never moves the directory
subsystem = "aero"
parent = "l3_massaero"
kind = "declared"
owner = "mass"
tier = "A"
layer = 3   # 1 management · 2 the system · 3 subsystem · 4 the run
state = "published"

[question]
text = "How much frontal area do the array, antennas and radiators add beyond the body?"
note = "Separated from the body area because it is the term a power or thermal decision moves, and the tree has to show that coupling."

[maths]
expression = "A_app = 0.05"
source = "orbitt_case_c1"

[output]
# The node's one answer. The variable id is the node id: one small
# question, one answer, one folder, one row on the tree.
symbol = "A_app"
type = "Area"
unit = "SquareMetre"
lower = 0.0
upper = 5.0
reason_lower = "an area cannot be negative"
reason_upper = "above 5 m2 of appendage the design is an array with a satellite attached, and the drag closure is decided by the array alone"

[value]
# A number a person picked. It carries the same discipline as a
# fixture, because every margin in the design is built out of these.
number = 0.05
confirmed_by = "A. Rai / 2026-09-01"

[view]
kind = "number"

