[package]
name = "vleo-py"
description = "FACE — the Python wheel. It binds the same shared library the interface uses, so an analyst and a reviewer are looking at the same numbers. MATLAB reaches the engine through this wheel, out of process."
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "UNLICENSED"
authors = ["Orbitt Space"]
repository = "https://github.com/AmanRai0603/VLEO_SIMULATOR"

# Excluded from the workspace: it needs a Python interpreter to link against,
# and `pyo3` is the one dependency that must not be unified into a build that
# has no interpreter.

[lib]
# `_vleo`: the native module inside the `vleo` package. The package picks the
# one built for the machine it is on — python/vleo/__init__.py.
name = "_vleo"
crate-type = ["cdylib"]

[dependencies]
vleo-modules = { path = "../vleo-modules", features = ["std"] }
vleo-bus = { path = "../vleo-bus", features = ["std"] }
vleo-core = { path = "../vleo-core", features = ["std"] }
# The whole tool, not only the engine: `python -m vleo` serves the same pages
# the daemon does, from inside python.exe, so nothing new has to be run.
vleo-server = { path = "../vleo-server" }
# abi3: one build per system for every Python from 3.9, so one package carries
# one file per system rather than one per system and interpreter.
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39"] }

[build-dependencies]
embed-resource = "3"
