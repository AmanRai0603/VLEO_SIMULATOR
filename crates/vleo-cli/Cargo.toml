[package]
name = "vleo-cli"
description = "FACE — the command line. Batch work, sweeps, campaigns, the self test and the diagnostic bundle. It depends on the bus and never on a module, so it cannot change a result."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "vleo"
path = "src/main.rs"

[dependencies]
vleo-modules = { workspace = true, features = ["std"] }
vleo-bus = { workspace = true, features = ["std"] }
vleo-core = { workspace = true, features = ["std"] }
vleo-data = { workspace = true }
# The one place a figure of the record is worked out — the same function the
# daemon's /v1/figures route answers with, so `vleo figure` cannot drift from it.
vleo-server = { workspace = true }
# Saved results, many in one file (results.vleor).
vleo-results = { workspace = true }

[dev-dependencies]
# Make a group's release for the tests, as its group would: one row changed
# in the file, and the seal worked out by the library the group seals with.
rusqlite = { workspace = true }
vleo-files = { path = "../vleo-files" }
# Read the design converted to its files back as the folders it came from,
# and hold the engine run on it to today's answers.
vleo-sheet = { workspace = true }

[lints.rust]
unsafe_code = "forbid"

[build-dependencies]
embed-resource = "3"
