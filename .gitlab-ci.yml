# The gate, the nightly audit and the release, ported from .github/workflows/.
#
# One gate, called by the pipeline exactly as the authoring hook and a person
# call it. Where the hook runs one script and the pipeline runs another they
# drift within a month and the hook becomes theatre — so every job below is a
# command you can run on a laptop, and none of them is a pipeline-only rule.
#
# THE COST, BECAUSE IT DECIDES THE SHAPE OF THIS FILE. Measured from a real
# run of the GitHub pipeline this was ported from: 603 seconds of runner time
# across eight jobs, so about ten compute-minutes per push. GitLab Free gives
# 400 compute-minutes a month, which is forty pushes. The nightly audit on its
# own is roughly thirty-five minutes, which over a month is 2.6 times the whole
# free allowance.
#
# So the nightly is schedule-only and must be scheduled deliberately, the two
# expensive per-push jobs are separated from the cheap ones, and nothing here
# runs twice for one push. If minutes get tight, `panels` and
# `shipping-profile` are 69% of the bill between them and are the two to move
# to the schedule; the gate itself is 96 seconds.

# One pipeline per push, never two. Without this a branch with an open merge
# request builds twice and the bill doubles for nothing.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

default:
  # The toolchain is pinned in rust-toolchain.toml. A compiler change can move
  # a floating-point result, so a bump is a decision rather than a surprise —
  # and the image is pinned to the same version so the container does not
  # quietly become the bump.
  image: rust:1.94.1
  interruptible: true
  cache:
    key:
      files:
        - Cargo.lock
        - rust-toolchain.toml
    paths:
      - .cargo/
      - target/

variables:
  CARGO_TERM_COLOR: "always"
  RUSTFLAGS: "-D warnings"
  # GitLab only caches paths inside the project directory, so the registry has
  # to live here rather than in ~.
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  GIT_DEPTH: 0
  # The two expensive per-push jobs, 69% of the bill between them. Set HEAVY to
  # "false" in Settings -> CI/CD -> Variables to move them to the schedule when
  # minutes get tight. A plain variable rather than a `spec: inputs` header,
  # because inputs are documented for included configuration and an invalid key
  # at the root stops the whole pipeline from loading.
  HEAVY: "true"

stages:
  - gate
  - heavy
  - audit
  - release

# ---------------------------------------------------------------------------
# the gate — every push
# ---------------------------------------------------------------------------

build, generate, gate, test:
  stage: gate
  script:
    - cargo fmt --all -- --check
    - cargo clippy --workspace --all-targets -- -D warnings
    - cargo build --workspace
    # The regeneration diff. A hand edit outside a numbered HOLE block is
    # discarded by regeneration and therefore caught here, which is what makes
    # the generated region genuinely owned by the generator rather than merely
    # labelled that way.
    - cargo run -p xtask -- docs
    - |
      if ! git diff --quiet; then
        echo "ERROR: the committed artefacts differ from what the sheets generate."
        echo "Run 'cargo run -p xtask -- docs' and commit the result."
        git --no-pager diff --stat
        exit 1
      fi
    # Byte-stability. A generator whose output depends on iteration order, a
    # clock or a path fails this at random, and within a fortnight nobody reads
    # the check above.
    - cargo run -p xtask -- docs
    - cargo run -p xtask -- docs
    - git diff --quiet || { echo "ERROR: a generator is not deterministic"; exit 1; }
    - cargo run -p xtask -- gate
    - cargo run -p xtask -- assemble
    - cargo run -p xtask -- bundle verify
    # A fixture disagreement is a physics disagreement, not a build failure. It
    # goes to the node owner, and the tolerance is not the thing to change.
    - cargo test --workspace
    - cargo run -p xtask -- gap || true
    # Reported, never targeted: a number that must go up is a number somebody
    # makes go up.
    - cargo run -p xtask -- ready
    - cargo run -p xtask -- status
    - cargo run -p xtask -- graph

# Every script in tools/ checks itself before it is trusted to check anything
# else. A checker nobody has watched fail is a checker nobody knows works, and
# these decide what is allowed to merge.
the tools check themselves:
  stage: gate
  image: python:3.12-slim
  cache: []
  before_script:
    - apt-get update -qq && apt-get install -y -qq git >/dev/null
  script:
    - python3 tools/agent_lanes.py --selftest
    - python3 tools/commit_message.py --selftest
    - python3 tools/review_report.py --selftest
    - python3 tools/recipe.py --selftest
    - python3 tools/fleet_report.py --selftest
    - python3 tools/panel_check.py --selftest
    - python3 tools/instruction_lint.py --selftest
    - python3 tools/instruction_lint.py
    - python3 tools/release_notes.py --selftest
    # Every recipe, applied twice on a copy; the second must change nothing.
    - python3 tools/recipe.py --check
    # The same script the commit-msg hook runs, over the commits this branch
    # adds. A hook only fires inside the tool that installed it, so the rule
    # has to hold here too.
    - python3 tools/commit_message.py --range "$(git rev-list --max-parents=0 HEAD | tail -1)..HEAD"

# The advisory review. It cannot fail the pipeline, and that is the design
# rather than an oversight: a review that can fail a build is a review people
# learn to satisfy rather than to read, and within a month its findings are
# worded to pass rather than to be true. The gate blocks; this one only ever
# says something.
#
# It must never become a required check. An adopted review model belongs here
# beside the mechanical pass under two rules: it writes to the log and has no
# say in the merge, and its family must differ from whichever model wrote the
# change.
advisory review (never blocks):
  stage: gate
  image: python:3.12-slim
  cache: []
  allow_failure: true
  before_script:
    - apt-get update -qq && apt-get install -y -qq git >/dev/null
  script:
    - |
      base="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-$CI_COMMIT_BEFORE_SHA}"
      git cat-file -e "$base^{commit}" 2>/dev/null \
        || base="$(git rev-list --max-parents=0 HEAD | tail -1)"
      python3 tools/review_report.py --range "$base..HEAD" | tee review.txt
  artifacts:
    when: always
    paths: [review.txt]
    expire_in: 1 week

# Mutation testing, scoped to what the change touched. The nightly audit does
# the whole tree; here the question is only whether this change's own evidence
# would notice this change's own answer moving.
the changed nodes' tests are load-bearing:
  stage: gate
  script:
    - |
      base="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}"
      if [ -z "$base" ]; then base=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD); fi
      nodes=$(git diff --name-only "$base" HEAD \
                | sed -n 's|^crates/[^/]*/nodes/\([^/]*\)/.*$|\1|p' \
                | sort -u)
      echo "changed: ${nodes:-<none>}"
      # An empty list must write an empty file. `printf '%s\n' ""` writes a
      # newline, so the file is one byte, `[ -s ]` is true, and the branch that
      # says why nothing ran can never fire — the job goes silent instead.
      if [ -n "$nodes" ]; then printf '%s\n' "$nodes" > changed-nodes.txt
      else : > changed-nodes.txt; fi
    - |
      if [ ! -s changed-nodes.txt ]; then
        echo "no node folders in this change — nothing to mutate"
        exit 0
      fi
      rc=0
      while read -r n; do
        [ -z "$n" ] && continue
        echo -e "\e[0Ksection_start:$(date +%s):mut_$n\r\e[0K$n"
        cargo run -p xtask -- mutate "$n" || rc=1
        echo -e "\e[0Ksection_end:$(date +%s):mut_$n\r\e[0K"
      done < changed-nodes.txt
      exit $rc

# The two faces the workspace excludes, because they need targets of their own.
# `cargo build --workspace` does not reach them, so without this nothing builds
# two of the doors onto the kernel and they break silently until somebody opens
# one by hand.
the faces outside the workspace:
  stage: gate
  cache:
    key:
      files: [Cargo.lock, rust-toolchain.toml]
      prefix: excluded
    paths:
      - .cargo/
      - crates/vleo-wasm/target/
      - crates/vleo-py/target/
  script:
    - rustup target add wasm32-unknown-unknown
    # --locked, because these two do not share the workspace lockfile and
    # ADOPTION.lock's rule is the same for them: an exact version plus a
    # committed lock, resolved from it rather than fresh on the day.
    - cd crates/vleo-wasm && cargo build --locked --target wasm32-unknown-unknown --release && cd -
    - cd crates/vleo-py   && cargo build --locked --release

the kernel stays no_std:
  stage: gate
  script:
    - rustup target add thumbv7em-none-eabihf
    # If the no_std build ever acquires std, this fails. Cargo unifies features
    # across workspace members, so one face enabling std would silently give it
    # to the kernel — which is why this is a constrained target and never
    # `--workspace`.
    - cargo build -p vleo-units --target thumbv7em-none-eabihf --no-default-features
    - cargo build -p vleo-core  --target thumbv7em-none-eabihf --no-default-features

# ---------------------------------------------------------------------------
# the two expensive ones — 69% of the per-push bill between them
# ---------------------------------------------------------------------------

# The visual lane, checked the way the engine is. A wrong number crashes a
# test; a wrong chart looks beautiful, and the measured record of this codebase
# says that is where the defects live. Three checks per declared panel: it
# renders, it moves when its declared inputs move, and it matches a reference
# somebody looked at. The second is the one worth a browser — a panel wired to
# nothing renders perfectly and matches yesterday's reference every time.
the panels render, move and match:
  stage: heavy
  rules:
    - if: $HEAVY == "false"
      when: never
    - when: on_success
  before_script:
    - apt-get update -qq && apt-get install -y -qq python3 python3-pip python3-venv >/dev/null
    - python3 -m venv /tmp/v && . /tmp/v/bin/activate
    - pip install --quiet playwright Pillow
    - python3 -m playwright install --with-deps chromium
  script:
    - . /tmp/v/bin/activate
    - python3 tools/panel_check.py --selftest
    - python3 tools/panel_check.py

# Both profiles build on every merge. A customer build that fails only at
# release time fails on the day it can least be afforded — and link-time
# optimisation with a single codegen unit changes inlining, so the profile that
# ships is the profile that must be proven.
the profile that ships:
  stage: heavy
  rules:
    - if: $HEAVY == "false"
      when: never
    - when: on_success
  script:
    - cargo build --release --workspace
    - cargo test --release --workspace

# ---------------------------------------------------------------------------
# the nightly audit — schedule only
# ---------------------------------------------------------------------------
#
# Eight passes over everything. Three of them cannot run per-change: they need
# the whole tree, the whole ledger and yesterday's state, which is what makes
# the audit a different activity rather than a slower gate.
#
# There is no cron in this file. GitLab schedules live in the project settings
# (Settings -> CI/CD -> Schedules), so this must be created once by a person —
# and deliberately, because at roughly thirty-five minutes a night it is 2.6x
# the Free tier's whole monthly allowance. Weekly is the honest compromise on
# Free; nightly needs paid minutes or a self-hosted runner.

nightly audit:
  stage: audit
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  timeout: 3h
  before_script:
    - apt-get update -qq && apt-get install -y -qq python3 >/dev/null
  script:
    - echo "1 · build, both profiles"
    - cargo build --workspace
    - cargo build --release --workspace
    - echo "2 · golden vectors agree across profiles"
    - cargo test --workspace
    - cargo test --release --workspace
    - echo "3 · campaign over every reference case"
    - cargo run --release -p vleo-cli --bin vleo -- data sync
    - |
      for node in prop_thrust_to_drag pwr_margin thm_margin mass_margin com_link_margin kpi_thrust_margin; do
        echo "== $node"
        cargo run --release -p vleo-cli --bin vleo -- campaign "$node"
      done
    - echo "4 · the tree against its own rules"
    - cargo run -p xtask -- assemble
    - cargo run -p xtask -- graph
    - echo "5 · the gap pass, over everything"
    - cargo run -p xtask -- gap
    - echo "6 · reference data freshness"
    - cargo run -p xtask -- bundle verify
    # The one check that asks whether the tests would fail, not whether they
    # pass. Nightly rather than per-change because it is 138 cargo test runs.
    - echo "8 · the tests are load-bearing"
    - cargo run -p xtask -- mutate
    # Read from the harness's own local logs, so it reports nothing on a runner
    # that has none — which is the honest answer, and different from a fleet
    # that costs nothing.
    - echo "7 · the fleet — what fired, and what it cost"
    - python3 tools/fleet_report.py || true

# ---------------------------------------------------------------------------
# the release, and the one human approval
# ---------------------------------------------------------------------------
#
# Nothing is built before the tool is proven. The order is the point: a release
# that discovers its own failure after the artefacts are uploaded has already
# told somebody the wrong thing.

.release rules: &release_rules
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/

the tool is green before anything is built:
  stage: release
  <<: *release_rules
  before_script:
    - apt-get update -qq && apt-get install -y -qq python3 >/dev/null
  script:
    - |
      v="${CI_COMMIT_TAG#v}"
      echo "releasing $v"
      # The version in the manifests is the version being released. A tag that
      # disagrees with Cargo.toml produces a binary reporting a version nobody
      # can find in the history.
      have="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
      [ "$have" = "$v" ] || { echo "ERROR: Cargo.toml says $have, the tag says $v"; exit 1; }
      echo "VERSION=$v" > release.env
    - cargo run -p xtask -- gate
    - cargo run -p xtask -- docs
    - git diff --quiet || { echo "ERROR: regeneration changes the tree"; exit 1; }
    - cargo run -p xtask -- bundle verify
    # The profile that ships is the profile that is proven.
    - cargo test --release --workspace
    - python3 tools/release_notes.py --version "${CI_COMMIT_TAG#v}" --out notes.md
    - cat notes.md
  artifacts:
    reports:
      dotenv: release.env
    paths: [notes.md]
    expire_in: 1 month

# The three doors onto one kernel: the command line, the local server the
# browser face talks to, and the shared library the wheel and MATLAB bind.
#
# Linux only here. macOS and Windows hosted runners exist on GitLab.com, but
# macOS carries a compute-minute cost factor several times Linux's, and putting
# that on a tag pipeline by default is a bill nobody decided to pay. Add them
# with `tags: [saas-macos-medium-m1]` and `tags: [saas-windows-medium-amd64]`
# when the minutes are budgeted — the build commands are identical.
the shipping binaries:
  stage: release
  <<: *release_rules
  needs: ["the tool is green before anything is built"]
  script:
    - cargo build --release -p vleo-cli -p vleo-daemon -p vleo-ffi
  artifacts:
    paths:
      - target/release/vleo*
    exclude:
      - target/release/*.d
    expire_in: 1 month

# The one human approval.
#
# WHAT THIS IS AND IS NOT, ON EACH TIER. On Premium and above, a protected
# environment with deployment approvals is a real control: named approvers,
# enforced by GitLab, and this job cannot start without one. On Free there is
# no such control — `when: manual` means the job waits for a click, and anyone
# who can run a pipeline can click it, including the person who tagged it. That
# is a pause, not an approval, and calling it an approval is how a control stops
# being one.
#
# The guard below refuses to publish unless GitLab itself reports an approval
# rule on the environment. On Free that call cannot succeed, so on Free this
# pipeline does not publish at all — which is the honest outcome, and the same
# fail-closed shape the GitHub workflow has.
one human says yes:
  stage: release
  <<: *release_rules
  needs:
    - "the tool is green before anything is built"
    - "the shipping binaries"
  when: manual
  allow_failure: false
  environment:
    name: release
  # The `release` keyword is executed by release-cli, which is not in a bare
  # Alpine. A release job that fails for want of a tool fails after the approval
  # has been given, which is the worst possible moment to discover it.
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  cache: []
  before_script:
    - apk add --no-cache curl jq >/dev/null
  script:
    # Fail closed. An environment with no approval rule approves instantly and
    # leaves the same green tick as a reviewed one, so the difference has to be
    # asserted rather than assumed. Three outcomes, not two: "nobody is
    # required" and "this token cannot read the setting" both stop a release and
    # both should, but they send you to different places.
    - |
      api="$CI_API_V4_URL/projects/$CI_PROJECT_ID/protected_environments/release"
      code=$(curl -sS -o body.json -w '%{http_code}' \
               -H "JOB-TOKEN: $CI_JOB_TOKEN" "$api" || echo 000)
      echo "protected_environments/release -> HTTP $code"
      case "$code" in
        200) : ;;
        403|404)
          echo "ERROR: GitLab did not return a protected environment named 'release'."
          echo "ERROR: Either it is not protected, or this project's tier has no"
          echo "ERROR: deployment approvals — that feature is Premium and above."
          echo "ERROR: On Free there is no enforced approval to assert, so this"
          echo "ERROR: pipeline will not publish. See docs/RELEASE_SETUP.md."
          echo "ERROR: Nothing has been published."
          exit 1 ;;
        *)
          echo "ERROR: could not read the setting (HTTP $code). Response:"
          sed 's/^/ERROR:   /' body.json
          echo "ERROR: Nothing has been published."
          exit 1 ;;
      esac
      n=$(jq '[.approval_rules[]?] | length' body.json)
      echo "approval rules on 'release': $n"
      [ "$n" -ge 1 ] || {
        echo "ERROR: 'release' is protected and has no approval rules, so this"
        echo "ERROR: release would publish with nobody approving it. Add one at"
        echo "ERROR: Settings -> CI/CD -> Protected environments."
        echo "ERROR: Nothing has been published."
        exit 1
      }
      echo "a person is required to approve this release"
    # What the approver is agreeing to, in the log at the moment they agree. An
    # approval given against a page that does not say what is in the release is
    # a button press, not a decision.
    - cat notes.md
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "$CI_COMMIT_TAG"
    description: notes.md
