# A condition: laid over whichever customer is chosen.
#
# A customer says who the design is for. A condition says what it is
# asked to survive — an altitude, a solar state — so a stress is always
# asked of some customer's design rather than of a design nobody bought.
# A run applies, in this order: each row's declared value, the
# customer's [supply], this file's [supply], then whatever a person
# typed over it in the browser.
#
# Only declared, published rows may be supplied — gate check V16 refuses
# anything else. A condition that can no longer be applied says why in
# `unavailable`, and every face refuses it with that sentence rather than
# running it and quietly changing nothing.

id = "low_altitude"
kind = "condition"
label = "200 km — drag dominated"
note = "Drag-dominated and air-breathing propulsion in play. The propulsion layer carries thrust-to-drag as its binding target."

[supply]
# Laid over the chosen customer's values, and over each row's declared one.
orbit_altitude = 200000.0
