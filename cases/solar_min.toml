# A case: per-customer values against one shared architecture.
#
# What the customer chose, and nothing else: the architecture is never
# copied. What they did not buy is simply not in play, and n copies
# would mean n fixes and silent drift — the anti-clone-and-own rule,
# ISO/IEC 26580.
#
# The declared cycles live in layers/cycles.toml, once, because a loop
# is a property of the design rather than of the buyer. Every case
# inherits them.

id = "solar_min"
label = "Solar minimum, quiet conditions"
note = "The activity level at which the air-breathing concept is hardest, because there is least air to breathe."

[supply]
# Overrides on top of each declared node's own value.
env_f107 = 70.0
env_f107a = 70.0
env_kp = 1.0
