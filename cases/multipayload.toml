# THE case: one multipayload design, and every input it has.
#
# There is one case, not one file per customer. A customer or a sky is a set of
# input values, and values change far more often than the design does — a file
# per customer in this repository would make every new customer and every
# changed number a commit, and the tree would grow with the order book. So the
# values a person works with are not kept here. They are uploaded as a CSV, or
# typed on the Inputs page, and the application stores them OUTSIDE the
# checkout — beside the reference data, in ~/.vleo/case/, or wherever VLEO_CASE
# points — so git never sees them. Download the current values as a CSV to keep
# a copy or to hand to someone else; upload it again to put it back.
#
# What does live here is the shape of the case: which inputs describe the
# CONDITION the spacecraft flies in, and — by being everything else — which
# describe what the CUSTOMER asks for or chooses. Every input's default is the
# value declared on its own sheet, so a case that sets nothing runs the design
# as declared. Anything a run does not reach is simply not used.
#
# The declared cycles live in layers/cycles.toml, once, because a loop is a
# property of the design. The case carries them.

id = "multipayload"
label = "VLEO multipayload"
note = "The one case: every input of the multipayload design, grouped into what the customer chooses and the condition it flies in. Defaults are the values declared on each row; a saved case, uploaded as CSV or edited on the Inputs page, changes them without touching the repository."

[groups]
# The environment and orbit the spacecraft flies in. Every input not listed
# here is Customer. Gate check V16 refuses a name here that is not a declared,
# published input, so a renamed or retired row cannot linger in this list.
condition = [
    "env_chamber_temperature",             # Intake chamber gas temperature
    "env_wall_temperature",                # Spacecraft surface temperature
    "orbit_altitude",                      # Orbit altitude
    "orbit_beta_angle",                    # Beta angle
    "orbit_eccentricity",                  # Orbit eccentricity
    "orbit_inclination",                   # Orbit inclination
    "orbit_min_elevation",                 # Minimum useful elevation angle
    "sw_ap_central_expectation",           # Expected Ap over the mission window
    "sw_ap_mean_band_spread",              # Ap rotation-forecast residual spread
    "sw_band_coverage",                    # Stated band coverage
    "sw_cycle_repeatability",              # Cycle-to-cycle repeatability
    "sw_event_duration",                   # F10.7 burst duration
    "sw_f107_observed",                    # Observed F10.7, the forecast's anchor
    "sw_f107a_ratio",                      # Daily F10.7 scatter about F10.7A
    "sw_mean_band_spread",                 # Rotation-forecast residual spread
    "sw_recurrence_lag",                   # Rotation recurrence lag
    "sw_recurrence_strength",              # Rotation recurrence strength
    "sw_semiannual_amplitude",             # Semiannual Ap amplitude
    "sw_spike_threshold",                  # F10.7 spike threshold
    "sw_storm_design_level",               # Storm level designed for
]
