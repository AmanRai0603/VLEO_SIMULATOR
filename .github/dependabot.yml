# A bot opens the dependency bump; a person or an agent handles what it cannot.
#
# This file used to describe itself as rung one of a three-rung ladder, with a
# replayed-transform rung between it and a human. That middle rung was built as
# tools/recipe.py and never held a single recipe, so the ladder it belonged to
# was a diagram rather than a mechanism, and both are gone. What is left is this
# bot and the people it opens pull requests for, which is what actually ran.
#
# Dependabot rather than Renovate, because it
# runs on this platform with nothing to install, and the three safety settings
# that actually matter are the same ones and are set below FOR BOTH ECOSYSTEMS:
# the bot works on its own branch under its own identity, a release must have
# been public for fourteen days before it is proposed, and a major version is
# never proposed automatically. For a while that sentence was true of cargo and
# false of github-actions, which is how four major action bumps arrived in one
# pull request. A bot nobody installed is a rung that does not exist, which is
# worse than a different bot with the same guarantees.
version: 2

updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    # The bot's own branch, and only ever its own branch. That is the whole
    # boundary: a bot that edits anything else is an agent with no definition.
    target-branch: main
    labels: ["rung-1", "dependencies"]
    open-pull-requests-limit: 5
    # Fourteen days, as the working model specifies. A release that is days old
    # has not yet had its first bad week, and the yank usually comes inside the
    # first fortnight. Waiting is free; a yanked crate discovered by our
    # pipeline is not.
    cooldown:
      default-days: 14
    # Never automatically. A major version is a contract change, and the
    # semantic-version check exists to fire a human decision rather than to be
    # satisfied by one.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      # One pull request, one pipeline run, one review. Twenty separate patch
      # bumps is twenty chances for a flake to look like a break.
      patch-and-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels: ["rung-1", "pipeline"]
    open-pull-requests-limit: 3
    # THE TWO SETTINGS ABOVE WERE MISSING HERE, and the header of this file
    # said they applied to the bot rather than to one ecosystem. They did not:
    # cargo had both, github-actions had neither, so the guarantee this file
    # states in prose was implemented for half the things it governs. The
    # consequence was a real pull request -- #7, four MAJOR bumps at once,
    # checkout v4 to v7, cache v4 to v6, upload-artifact v4 to v7,
    # download-artifact v4 to v8 -- proposed automatically by a configuration
    # whose documentation says that never happens.
    cooldown:
      default-days: 14
    # A major version of an action is a contract change in the same way a major
    # crate version is: checkout v5 changed its default ref behaviour, and an
    # action that silently checks out something else is a pipeline that tests
    # something else. It fires a human decision instead.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      # Minor and patch only, matching cargo's group. With majors ignored the
      # group could not collect one anyway; saying so keeps the two ecosystems
      # readable side by side rather than subtly different.
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

# Deliberately not here: rust-toolchain.toml. A compiler change can move a
# floating-point result, and this whole system rests on the same numbers
# everywhere. That bump is a decision a person makes with the golden vectors in
# front of them, not a pull request that appears on a Monday.
