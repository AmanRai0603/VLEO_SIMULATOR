# One gate, called by the pipeline exactly as the authoring hook and a person
# call it. Where the hook runs one script and the pipeline runs another they
# drift within a month and the hook becomes theatre.
name: gate

on:
  # MAIN ONLY, not every branch. A branch push and the pull request that
  # follows it are two events carrying the SAME commit, and they land in
  # different concurrency groups -- refs/heads/<branch> against
  # refs/pull/<n>/merge -- so cancel-in-progress below never sees them as the
  # same work and neither cancels the other. The whole gate therefore ran
  # twice per commit. Measured on the last green run: eight jobs, about
  # seventeen billed minutes, and runs 145 and 146 are the same sha 721397ab
  # nineteen seconds apart. That doubling is what exhausted the month.
  #
  # Nothing reaches main except through a pull request, and `pull_request`
  # fires on every push to an open one, so no mergeable commit goes untested.
  # What is given up is CI on a branch with no pull request open yet.
  #
  # THAT COST IS LARGER THAN THIS COMMENT USED TO CLAIM. It said the local gate
  # is the check that is actually load-bearing there. The local gate is
  # `xtask gate && cargo test`, and it does not run tools/panel_check.py --
  # which is the only check the visual layer has, and which this repository's
  # own areas/document.md says is where the defects actually live. So on a
  # branch with no pull request the visual layer has NO automatic check at all.
  #
  # It is not hypothetical. Eleven commits ran on this branch with no pull
  # request; a daemon change broke the face's index; the matrix rendered
  # nothing and three panels went out of tolerance; the local gate was green
  # throughout and correctly so, because nothing in the kernel was wrong.
  # Anyone working a branch without a pull request open should run
  # `python3 tools/panel_check.py` by hand before pushing, and read its EXIT
  # CODE rather than its last line.
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  gate:
    name: build, generate, gate, test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The toolchain is pinned in rust-toolchain.toml. A compiler change can
      # move a floating-point result, so a bump is a decision rather than a
      # surprise.
      # restore-keys is not decoration. `key` alone is exact-match only, so
      # every Cargo.lock or toolchain edit was a TOTAL miss and each cached job
      # rebuilt the whole dependency graph from source. The prefix falls back
      # to the newest near-miss and cargo recompiles only what actually moved.
      - name: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: formatting
        run: cargo fmt --all -- --check

      - name: lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: build
        run: cargo build --workspace

      # The regeneration diff. A hand edit to a generated file is discarded by
      # regeneration and therefore caught here, which is what makes a generated
      # file genuinely owned by its generator rather than merely labelled so.
      # `variables` as well as `docs`, because it was missing and the register
      # went stale without anything noticing: docs/VARIABLES.md still carried
      # the pre-cycle-analogue prose from six solar sheets that had already
      # been corrected and regenerated. A generated file nothing regenerates in
      # CI is a file that drifts from its source and is believed anyway.
      - name: regenerate and compare
        run: |
          cargo run -p xtask -- docs
          cargo run -p xtask -- variables
          cargo run -p xtask -- derisk
          cargo run -p xtask -- guides
          if ! git diff --quiet; then
            echo "::error::the committed artefacts differ from what the sheets generate."
            echo "Run 'cargo run -p xtask -- docs' and commit the result."
            git --no-pager diff --stat
            exit 1
          fi

      # Byte-stability. A generator whose output depends on iteration order,
      # a clock or a path fails this at random, and within a fortnight nobody
      # reads the check above.
      - name: generators are byte-stable
        run: |
          cargo run -p xtask -- docs
          cargo run -p xtask -- variables
          cargo run -p xtask -- derisk
          cargo run -p xtask -- guides
          cargo run -p xtask -- docs
          cargo run -p xtask -- variables
          cargo run -p xtask -- derisk
          cargo run -p xtask -- guides
          git diff --quiet || { echo "::error::a generator is not deterministic"; exit 1; }

      # CODEOWNERS IS GENERATED AND NOTHING REGENERATED IT. Every other generated
      # artefact is covered by the regeneration diff above; this one was not, so
      # it drifted silently — 27 solar rows had no path rule at all, and a pull
      # request touching them routed to nobody for review. A generated file
      # outside the diff is a generated file that will be wrong.
      - name: CODEOWNERS is what the layer files say
        run: |
          cargo run -p xtask -- codeowners
          git diff --quiet -- CODEOWNERS || {
            echo "::error::CODEOWNERS is not what the layer files generate."
            echo "Run 'cargo run -p xtask -- codeowners' and commit the result."
            git --no-pager diff --stat -- CODEOWNERS
            exit 1
          }
      - name: the gate
        run: cargo run -p xtask -- gate

      - name: assembly validations
        run: cargo run -p xtask -- assemble

      - name: reference data verifies
        run: cargo run -p xtask -- bundle verify

      # A fixture disagreement is a physics disagreement, not a build failure.
      # It goes to the node owner, and the tolerance is not the thing to change.
      - name: evidence
        run: cargo test --workspace

      # A changed relation is refused by the parity gate, which holds every
      # answer the design read at run time gives to the one on record, to the
      # bit. Broken here one part in ten thousand, it must fail, naming the row.
      - name: a changed relation is caught by the parity gate
        run: |
          f=crates/vleo-core/src/physics/orbit.rs
          cp "$f" "$RUNNER_TEMP/kept.rs"
          sed -i 's|a \* a \* a / MU_EARTH))|a * a * a / MU_EARTH) * 1.0001)|' "$f"
          grep -q "1.0001" "$f"
          if cargo test -p vleo-cli --test the_design_read_at_run_time_answers_as_today > "$RUNNER_TEMP/parity.log" 2>&1; then
            echo "the parity gate passed a relation one part in ten thousand out"; exit 1
          fi
          grep -q "orbit_period," "$RUNNER_TEMP/parity.log"
          cp "$RUNNER_TEMP/kept.rs" "$f"

      # The authors' own code, run again on the cases recorded from it: Python
      # directly; MATLAB and Octave only where Octave is installed, and said
      # when it is not. A case the code no longer gives fails here.
      - name: the authors' code, rerun
        run: cargo run -p xtask -- rerun --all

      - name: the gap pass
        run: cargo run -p xtask -- gap || true

      # Which nodes have passed every machine stage and are waiting on a
      # person. Reported, never targeted: a number that must go up is a number
      # somebody makes go up.
      - name: ready for review
        run: cargo run -p xtask -- ready

      - name: the tree, reported
        run: |
          cargo run -p xtask -- status
          cargo run -p xtask -- graph

  # Every script in tools/ checks itself before it is trusted to check
  # anything else. A checker nobody has watched fail is a checker nobody knows
  # works, and these decide what is allowed to merge.
  tooling:
    name: the tools check themselves
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: the commit-message rule
        run: python3 tools/commit_message.py --selftest
      - name: the advisory review
        run: python3 tools/review_report.py --selftest
      # The house rules are an input to every change and prose is the one input
      # nothing else checks. Stale references are what they will really have —
      # a path renamed by a commit that never opened one.
      - name: the house rules' own references
        run: |
          python3 tools/docs_lint.py --selftest
          python3 tools/docs_lint.py
      # Every node is the same files in one directory, and that uniformity is
      # what makes adding a node a copy rather than a decision. It degrades one
      # folder at a time, and each individual departure looks harmless — which
      # is exactly the shape of thing a person will not notice and a check will.
      - name: no node folder has drifted from the template
        run: |
          python3 tools/template_check.py --selftest
          python3 tools/template_check.py
      # The same port, against the MATLAB tool's own saved run rather than
      # against the study's published CSVs. Its selftest needs no daemon; the
      # comparison itself runs in the panels job, where one is already up.
      - name: the mat comparison checks itself
        run: python3 tools/mat_parity.py --selftest
      # The drive's mirror creates, replaces in place and never deletes; its
      # selftest holds each of those against a drive in memory.
      - name: the drive's mirror checks itself
        run: python3 tools/drive.py --selftest
      - name: the release notes
        run: python3 tools/release_notes.py --selftest
      # The reference-signing checklist is generated from the panel sheets, so
      # the `confirmed_by` lines exist in exactly one place. A hand-kept copy of
      # who signed what is a second answer to the same question, and the one
      # that goes stale is always the copy.
      - name: the panel-review checklist
        run: |
          python3 tools/panel_review.py --selftest
          python3 tools/panel_review.py --check
      # The audit drives every editable input through its own branches and needs
      # a daemon, so the run itself is in the panels job; this is the half that
      # can check itself without one.
      - name: the branch audit checks itself
        run: python3 tools/branch_audit.py --selftest
      - name: the input control checks itself
        run: python3 tools/input_check.py --selftest
      - name: the manual check checks itself
        run: python3 tools/manual_check.py --selftest
      - name: the release's no-checker-inside guard checks itself
        run: python3 tools/checker_not_built_in.py --selftest
      # The walk-forward that reproduces sw_mean_band_spread's sigma disagrees
      # with the published number, and §31.4 rests on that disagreement being
      # real rather than an arithmetic slip. Its selftest checks the estimators
      # against synthetic series with known coefficients, that the walk never
      # reads a value it is predicting, and that the debias is the mean of the
      # residuals already seen. It needs no bundle and no daemon; the walk over
      # the record itself is minutes long and is not run here.
      # 29 cases now: the estimators against a known AR(2), the walk reading no
      # value it predicts, the causal debias as an identity, the ONE population
      # sigma every figure divides by, and the coverage fractions §45 rests on —
      # scale-free, reading the design-relevant side, and reported as straddling
      # when a span straddles rather than as one direction.
      - name: the walk-forward checks its own maths
        run: python3 tools/rotation_residuals.py --selftest
      # A theory tab is prose, so it sits outside the sheet hash and nothing
      # regenerates it — and it is what the person signing maths.confirmed_by
      # reads. This half needs no daemon: the coefficient parse proving itself
      # against the expression, the record's own ranges, and that every claim's
      # words are still in the sheet exactly once. The run against the engine is
      # in the panels job, which has one.
      - name: the theory tabs check their own numbers
        run: python3 tools/theory_check.py --selftest
      # §30 B1's decision row is seeded and unanswered, and this is the evidence
      # for it. The half that needs no daemon: the arithmetic of what counts as a
      # row that moved, that the decision row exists and is still SEEDED rather
      # than carrying a value nobody signed, and the two cross-references §30 B1
      # makes the condition of the step.
      - name: the Kp slot decision still has its evidence
        run: python3 tools/kp_slot_cost.py --selftest
      # §30 B2's decision row is seeded and unanswered too, and its evidence is
      # more fragile: it rests on two sentences in the legacy run's own header,
      # on that run's own numbers still implying 1.28, on four holes still
      # carrying the literal, and on NO parity check comparing a band value —
      # which is the fact that corrects §30 B2's cost table. All four are
      # checked here, and none of them needs a daemon.
      - name: the band confidence decision still has its evidence
        run: python3 tools/band_confidence_cost.py --selftest
      # The same script the commit-msg hook runs, over the commits this branch
      # adds. A hook only fires inside the tool that installed it — a terminal
      # with no hooksPath set has none — so the rule has to hold here too.
      #
      # THE COMMITS THIS BRANCH ADDS, which is what the step is called and what
      # it did not do. It computed the ROOT and checked all of history, so one
      # bad message anywhere in the past failed every branch forever — and a
      # message already merged cannot be fixed, because the remedy is rewriting
      # published history. A check with no recovery path is a check that will
      # one day be deleted rather than satisfied.
      #
      # It found one: the squash commit that merged #44 has an 83-character
      # line, so `main` itself was red and every pull request after it would
      # have been. The rule still holds everywhere it can be acted on — the
      # hook at author time, this step on what a branch adds.
      # On a pull request, the commits its own branch adds: everything its head
      # reaches that the base branch, as it stands now, does not. Not
      # base.sha..HEAD — GitHub keeps base.sha from when the request was opened,
      # and HEAD is the test merge, so that range also swept in every commit
      # merged into the base since, and failed a request for commits not its own.
      - name: every commit this branch adds
        run: |
          head="${{ github.event.pull_request.head.sha }}"
          base_ref="${{ github.event.pull_request.base.ref }}"
          if [ -n "$head" ] && [ -n "$base_ref" ]; then
            range="origin/$base_ref..$head"
          else
            range="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)..HEAD"
          fi
          echo "checking $range"
          python3 tools/commit_message.py --range "$range"

  # The advisory review. It cannot fail the build, and that is the design
  # rather than an oversight: a review that can fail a build is a review people
  # learn to satisfy rather than to read, and within a month its findings are
  # worded to pass rather than to be true. The gate blocks; this one only ever
  # says something.
  #
  # It is deliberately not a required check, and must never become one. An
  # adopted review model belongs in this job beside the mechanical pass, under
  # two rules: it writes to the summary and has no say in the merge, and its
  # family must differ from whichever model wrote the change. A model handed its
  # own reasoning to grade approves it.
  review:
    name: advisory review (never blocks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Its self-test lives in the blocking job above, on purpose: a broken
      # reviewer is a tooling defect and should fail, even though its findings
      # never can.
      - name: report on what changed
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          git cat-file -e "$base^{commit}" 2>/dev/null || base="$(git rev-list --max-parents=0 HEAD | tail -1)"
          python3 tools/review_report.py --range "$base..HEAD" | tee -a "$GITHUB_STEP_SUMMARY"

  # The visual lane, checked the way the engine is. A wrong number crashes a
  # test; a wrong chart looks beautiful, and the measured record of this
  # codebase says that is where the defects actually live. Three checks per
  # declared panel, none of which needs a person: it renders, it moves when its
  # declared inputs move, and it matches a reference somebody looked at.
  #
  # The second is the one worth the browser. A panel wired to nothing renders
  # perfectly and matches yesterday's reference every time.
  # THE FRONTEND ON ITS OWN. A frontend developer works against the contract,
  # not a build of the engine (contract/README.md), so this job has no Rust
  # toolchain at all: the page, served by tools/mock_engine.py from the
  # recorded answers in contract/examples, must load, draw the tree, run a row
  # and list results in a real browser. That the engine keeps the contract is
  # the contract tests' job, in `cargo test`.
  frontend-mock:
    name: the page on the mock engine, no Rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: the browser
        run: |
          pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
      - name: the mock engine checks itself
        run: python3 tools/mock_check.py --selftest
      - name: the page, on recorded answers only
        run: python3 tools/mock_check.py
      - name: the group application, on the example group folder
        run: python3 tools/group_check.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: the group and node applications, on database files
        run: python3 tools/group_db_check.py
      # A transcription is taken only with its source and the person who
      # checked the copy; the group application says so before the group seals.
      - name: a node's declaration, judged as the rule says
        run: node tools/declaration_check.mjs

  # THE READERS' FOLDER, AS A READER OPENS IT. `xtask readers` builds the pages
  # a team reads with no tool running, and the engine they carry; its own last
  # step proves every link is in the folder. This proves the pages WORK: opened
  # from file:// in Chromium, the engine compiled for the browser answers,
  # refuses and sweeps, and a widget on a row page is answered by it. Then the
  # same engine built natively is asked every question the page was asked, and
  # each answer must be the same text — the page's numbers are the tool's.
  readers:
    name: the readers' folder, opened from a file
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            crates/vleo-kernel-wasm/target
          key: ${{ runner.os }}-readers-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-readers-
      - run: rustup target add wasm32-unknown-unknown
      - name: the browser
        run: |
          pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
      # The generated pages first: each row's page in the folder is its
      # generated fragment, and generated/index.json says which rows compute.
      - name: the folder
        run: |
          cargo run -p xtask -- assemble
          cargo run -p xtask -- readers
      - name: the pages, the engine in the page, and a widget, from file://
        run: |
          python3 tools/readers_check.py --selftest
          python3 tools/readers_check.py --answers "$RUNNER_TEMP/answers.tsv"
      - name: the page's answers are the tool's
        working-directory: crates/vleo-kernel-wasm
        run: VLEO_BROWSER_ANSWERS="$RUNNER_TEMP/answers.tsv" cargo test --locked -- --include-ignored

  panels:
    name: the panels render, move and match
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: the browser
        run: |
          pip install --quiet playwright Pillow
          python3 -m playwright install --with-deps chromium
      - name: the checker checks itself first
        run: python3 tools/panel_check.py --selftest
      - name: every declared panel
        run: python3 tools/panel_check.py
      # The manual in the browser tells people what to paste and what they will
      # see. `cargo test` already holds every name in it to the code; this holds
      # every command to what it DOES — run exactly as written, its output
      # compared with what the manual says, and the working tree compared before
      # and after, because the page labels those commands safe to run. Here and
      # not in the gate job because two of them start the release daemon, which
      # this job has just built, and before the parity step below, which leaves
      # a daemon holding 7777. `--browser` then follows the browser half on the
      # real page, clicking the labels the manual names.
      - name: the manual's commands do what it says
        run: |
          python3 tools/manual_check.py --selftest
          python3 tools/manual_check.py
          python3 tools/manual_check.py --browser
      # The study's own code is not in this repository — only its published
      # output, seven CSVs. Every solar row that can be compared against that
      # output is re-derived here in Python, independently of the Rust, and the
      # engine is asked for the same number. A port whose numbers drift from the
      # thing it was ported from is the failure this whole subsystem exists to
      # avoid, and it is not the kind that shows up in a unit test.
      - name: the port still agrees with what the study published
        run: |
          cargo run --release -p vleo-daemon &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:7777/v1/index && break
            sleep 2
          done
          python3 tools/matlab_parity.py
          python3 tools/mat_parity.py
      # The field on a declared row, clicked the way a person clicks it. Every
      # defect it has caught was invisible to the engine and to a source
      # reading: a repaint from inside a change event, a button that destroyed
      # itself on blur, a column pushed off screen by one long refusal, and a
      # branch list still reading the shape the rule had before it moved into
      # the engine.
      - name: the input control, three stages, clicked
        run: python3 tools/input_check.py
      # Every editable input in the solar subsystem, driven through the branches
      # the engine says it is in. Solar is the one subsystem filled in end to
      # end, so it is the one where this can say anything. It reports findings
      # and does not fail the build: every finding it prints is a true statement
      # about the design, and a check that fails on those is a check people
      # learn to word their way past.
      - name: every solar input, through its own branches
        run: python3 tools/branch_audit.py --sub solar
      # And the theory tab's numbers against the engine that answers them: the
      # sheet's own expression against the implementation over its whole declared
      # domain, and every magnitude the derivation cites re-measured through
      # /v1/run. The tab is what a reviewer reads before signing the relation, so
      # a wrong magnitude in it reads as evidence.
      - name: the theory tab's numbers, against the engine
        run: python3 tools/theory_check.py
      # What choosing a Kp slot costs, through the whole tree. Not a check with a
      # verdict: it prints the evidence §30 B1 asks a person to decide against,
      # and fails only if the engine cannot produce it.
      - name: what the Kp slot choice costs downstream
        run: python3 tools/kp_slot_cost.py
      # And the band's four rows against the arithmetic that makes them: each is
      # its own centre plus or minus z sigma and nothing else, so if the relation
      # ever changes, every figure §44 records about it is about a relation that
      # is gone.
      - name: what the band confidence costs
        run: python3 tools/band_confidence_cost.py

  # The two faces the workspace excludes, because they need targets of their
  # own. `cargo build --workspace` does not reach them, so until this job
  # existed nothing in the pipeline built two of the six doors onto the kernel
  # and they could break silently for as long as nobody opened them by hand.
  excluded-faces:
    name: the faces outside the workspace
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/vleo-method-wasm/target
            crates/vleo-files-wasm/target
            crates/vleo-kernel-wasm/target
            crates/vleo-py/target
          key: ${{ runner.os }}-excluded-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-excluded-
      - run: rustup target add wasm32-unknown-unknown
      # --locked, because these two do not share the workspace lockfile and
      # ADOPTION.lock's rule is the same for them: an exact version plus a
      # committed lock, resolved from it rather than fresh on the day.
      # The library every design file is read, written and checked by, built
      # for the page: the same signing and checking the installed application
      # runs (docs/OPERATING_1_0.md, section 14). A workspace crate, so it is
      # resolved from the workspace's own lockfile.
      - name: the design-file library, for the page
        run: cargo build --locked -p vleo-files --target wasm32-unknown-unknown --release
      # The same library as the pages carry it (web/files.wasm.gz). Its
      # committed build is held to its sources by a test; this proves the
      # face still builds, and that a release signed through the chain checks
      # in the page exactly as it does installed — read with the page's own
      # SQLite, answered by the page's build, compared byte for byte.
      - name: the design-file library the pages carry
        working-directory: crates/vleo-files-wasm
        run: cargo build --locked --target wasm32-unknown-unknown --release
      - name: a release signed afresh checks through the chain in the page
        run: |
          cargo run --locked -q -p vleo-files --example a_signed_release -- "$RUNNER_TEMP/signed"
          node tools/files_check.mjs "$RUNNER_TEMP/signed"
      # The method checker the lesson form and the group application carry.
      # Its committed build is held to its sources by a test; this proves the
      # sources still build at all.
      - name: the method checker the pages carry
        working-directory: crates/vleo-method-wasm
        run: cargo build --locked --target wasm32-unknown-unknown --release
      # The engine a readers' page carries (xtask readers): the whole kernel,
      # built for the browser.
      - name: the engine for the readers' pages
        working-directory: crates/vleo-kernel-wasm
        run: cargo build --locked --target wasm32-unknown-unknown --release
      - name: the Python face
        working-directory: crates/vleo-py
        run: cargo build --locked --release
      # The one-file package, built with this system's engine only, installed
      # into a clean Python and started — the way a teammate will. The release
      # builds it with every system's engine and checks each one.
      - name: the Python package installs and starts
        run: |
          python3 tools/build_wheel.py --selftest
          cargo run --release -p xtask -- kit --files-only --out "$RUNNER_TEMP/wheel-kit"
          python3 tools/build_wheel.py --version 0.0.0 --kit "$RUNNER_TEMP/wheel-kit" \
            --native linux-x86_64=crates/vleo-py/target/release/lib_vleo.so --out "$RUNNER_TEMP/wheel"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q "$RUNNER_TEMP"/wheel/vleo-0.0.0-py3-none-any.whl
          cd "$RUNNER_TEMP" && HOME="$RUNNER_TEMP/home" venv/bin/python -m vleo --check

  # Both profiles build on every merge. A customer build that fails only at
  # release time fails on the day it can least be afforded — and link-time
  # optimisation with a single codegen unit changes inlining, so the profile
  # that ships is the profile that must be proven.
  shipping-profile:
    name: the profile that ships
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # This job had NO cache and is the most expensive in the file: four
      # minutes on the last green run, of which three were `cargo test
      # --release` compiling the test binaries from nothing, every time. Its
      # own key namespace, because release and debug artefacts are different
      # objects and one key holding both means whichever job saved first
      # decides what the other one restores.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-release-
      - run: cargo build --release --workspace
      - name: golden vectors against the shipping build
        run: cargo test --release --workspace

  no-std:
    name: the kernel stays no_std
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add thumbv7em-none-eabihf
      # If the no_std build ever acquires std, this fails. Cargo unifies
      # features across workspace members, so one face enabling std would
      # silently give it to the kernel — which is why this is a constrained
      # target and never `--workspace`.
      - run: cargo build -p vleo-units --target thumbv7em-none-eabihf --no-default-features
      - run: cargo build -p vleo-core --target thumbv7em-none-eabihf --no-default-features

  # TODAY'S DESIGN, BUILT ALIKE ON THREE SYSTEMS (docs/PLAN_1_0.md, phase D:
  # "today's design is built identically on two computers from the same
  # drive"). Each system builds the command line, builds today's design from
  # one drive — the solar group's sealed release — and prints the design it
  # runs and what it answers, each by its fingerprint. The three must agree
  # to the last bit: the same files, read alike, and every answer given
  # alike, which is what portable maths is for.
  alike:
    name: today's design (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: today's design, from a drive
        shell: bash
        run: |
          cargo build --locked -p vleo-cli
          mkdir -p drive/groups/l3_solar/releases scratch
          cp crates/vleo-files/tests/fixtures/l3_solar-1.1.vleo drive/groups/l3_solar/releases/
          # A path the program can open: Git Bash on Windows says /d/a/...,
          # which Windows does not.
          here() { (cd "$1" && (pwd -W 2>/dev/null || pwd)); }
          export VLEO_DRIVE="$(here drive)"
          s="$(here scratch)"
          export VLEO_DATA="$s/data" VLEO_CASE="$s/case.csv" VLEO_LOG="$s/log" VLEO_RESULTS="$s/results"
          ./target/debug/vleo version | tee version.txt
          grep -E "^  (design|answers) " version.txt > "fingerprint-${{ runner.os }}.txt"
          grep -q "l3_solar 1.1" version.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fingerprint-${{ runner.os }}
          path: fingerprint-${{ runner.os }}.txt
          if-no-files-found: error

  alike-compare:
    name: today's design, alike on three systems
    needs: alike
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fingerprint-*
          merge-multiple: true
      - name: the three agree
        run: |
          for f in fingerprint-*.txt; do echo "== $f"; cat "$f"; done
          test "$(ls fingerprint-*.txt | wc -l)" -eq 3
          test "$(cat fingerprint-*.txt | sort | uniq | wc -l)" -eq 2
