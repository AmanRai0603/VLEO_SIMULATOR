# The release pipeline, and the rule that decides what may be released.
#
# The working model's line for this is short: "the release pipeline itself, plus
# one human decision". Everything mechanical is mechanical — the version, the
# notes, the builds, the checks — so that the one thing left for a person is the
# only thing a person is better at: deciding whether this is the state of the
# tool that goes to a customer.
#
# That decision is the merge of a pull request into main. A release is cut only
# from a commit on main that a merged pull request put there; the first job
# refuses anything else before a single binary is built. The review happened on
# the pull request, where the change could be read — not on a button pressed
# after the artefacts exist. docs/RELEASE_SETUP.md says why this replaced the
# environment approval, and what branch protection it relies on.
#
# Two things this workflow may never do, and does not:
#
#   - change branch protection. The rules that decide what may merge are set by
#     a person in repository settings. A pipeline that can widen its own gate
#     has no gate.
#   - hold a signing key. Signing and notarisation take a certificate that
#     lives in an organisation secret a release engineer controls. The signing
#     job is deliberately absent until that certificate exists; a workflow that
#     pretends to sign is worse than one that admits it does not.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "the version to release, without the leading v"
        required: true

permissions:
  contents: read

jobs:
  # Nothing is built before the tool is proven. The order is the point: a
  # release that discovers its own failure after the artefacts are uploaded has
  # already told somebody the wrong thing.
  prove:
    name: the tool is green before anything is built
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The release rule. What is released is a commit on main, and main moves
      # only by merged pull requests — so the commit must be on main, and a
      # merged pull request into main must be the thing that put it there. A
      # tag pushed on a side branch, a run started from one, or a commit pushed
      # to main around review all stop here, before anything is built.
      - name: this commit came to main through a merged pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse HEAD)"
          case "${{ github.event_name }}" in
            workflow_dispatch)
              [ "${{ github.ref }}" = "refs/heads/main" ] || {
                echo "::error::A release is run from main, not ${{ github.ref }}. Nothing has been built."
                exit 1
              } ;;
            *)
              git fetch -q origin main
              git merge-base --is-ancestor "$sha" origin/main || {
                echo "::error::The tag ${{ github.ref_name }} is on $sha, which is not on main."
                echo "::error::Tag the merge commit of the release pull request. Nothing has been built."
                exit 1
              } ;;
          esac
          prs=$(gh api "repos/${{ github.repository }}/commits/$sha/pulls" \
            --jq '.[] | select(.merged_at != null and .base.ref == "main") | .number')
          if [ -z "$prs" ]; then
            echo "::error::$sha is on main, but no merged pull request into main put it there."
            echo "::error::Main moves only by reviewed pull requests; see docs/RELEASE_SETUP.md."
            echo "::error::Nothing has been built."
            exit 1
          fi
          # How many people other than the author must have approved it is a
          # repository variable, set by a person: RELEASE_APPROVALS. Unset, it
          # is 0 — on a one-person project GitHub lets nobody approve their own
          # pull request, so requiring one would stop every release.
          need="${{ vars.RELEASE_APPROVALS }}"
          need="${need:-0}"
          best=0
          echo "### Merged into main by" >> "$GITHUB_STEP_SUMMARY"
          for n in $prs; do
            title=$(gh api "repos/${{ github.repository }}/pulls/$n" --jq '.title')
            ok=$(gh api "repos/${{ github.repository }}/pulls/$n/reviews" \
              --jq '[.[] | select(.state == "APPROVED") | .user.login] | unique | length')
            echo "#$n $title — $ok approval(s)"
            echo "- #$n $title — $ok approval(s)" >> "$GITHUB_STEP_SUMMARY"
            if [ "$ok" -gt "$best" ]; then best=$ok; fi
          done
          [ "$best" -ge "$need" ] || {
            echo "::error::The pull request that put $sha on main has $best approval(s);"
            echo "::error::RELEASE_APPROVALS asks for $need. Nothing has been built."
            exit 1
          }

      - id: v
        run: |
          v="${{ inputs.version }}"
          [ -n "$v" ] || v="${GITHUB_REF_NAME#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "releasing $v"

      # The version in the manifests is the version being released. A tag that
      # disagrees with Cargo.toml produces a binary that reports a version
      # nobody can find in the history.
      - name: the tag and the manifest agree
        run: |
          have="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          want="${{ steps.v.outputs.version }}"
          [ "$have" = "$want" ] || {
            echo "::error::Cargo.toml says $have, the release says $want"
            exit 1
          }

      # A release names the beliefs it ships. Every node version recorded since
      # the last release says `next` until `xtask release` stamps it; a release
      # cut with any still unstamped would ship a change its own record cannot
      # place in a release.
      - name: every node version names this release
        run: cargo run -p xtask -- release "${{ steps.v.outputs.version }}" --check

      - name: the gate
        run: cargo run -p xtask -- gate

      - name: the generated artefacts match the sheets
        run: |
          cargo run -p xtask -- docs
          cargo run -p xtask -- derisk
          git diff --quiet || { echo "::error::regeneration changes the tree"; exit 1; }

      - name: reference data verifies
        run: cargo run -p xtask -- bundle verify

      # The profile that ships is the profile that is proven. Link-time
      # optimisation changes inlining, which can change a floating-point
      # result, so a release proved only in debug is not proved.
      - name: golden vectors against the shipping build
        run: cargo test --release --workspace

      - name: the notes, read off the log
        run: |
          python3 tools/release_notes.py \
            --version "${{ steps.v.outputs.version }}" \
            --out notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes.md

  build:
    name: the shipping binaries
    needs: prove
    strategy:
      fail-fast: false
      matrix:
        # `system` is the name the Python package gives each engine it carries.
        # Linux builds on the older Ubuntu so the programs and the engine load
        # on the laptops still running it, not only on the newest.
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            system: linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            system: macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            system: windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: rustup target add ${{ matrix.target }}
      # The three doors onto one kernel: the command line, the local server the
      # browser face talks to, and the shared library the wheel and MATLAB bind.
      - run: cargo build --release --target ${{ matrix.target }} -p vleo-cli -p vleo-daemon -p vleo-ffi
      # WHAT THE TEAM GETS: a kit, not the repository. The programs alone do not
      # run — the daemon reads the web face, the tree and every node's page — so
      # each platform ships as one zip of the programs beside exactly those files,
      # with START_HERE.md on top. docs/SHARING.md says how it is used.
      - name: the kit
        shell: bash
        run: |
          kit="vleo-${{ needs.prove.outputs.version }}-${{ matrix.target }}"
          cargo run --release -p xtask -- kit --bin "target/${{ matrix.target }}/release" --out "kit/$kit"
          # The kit's reference data must verify on the machine that built it,
          # with the program that ships in it. The 0.1.1 Windows kit did not —
          # its data had been rewritten to CRLF on checkout — and nothing here
          # noticed until a teammate saw every solar row refuse.
          VLEO_DATA="$RUNNER_TEMP/kit-data" "kit/$kit/vleo" data sync "kit/$kit/bundles"
          # No program carries the node form's checker built in. Compressed
          # WebAssembly inside a program, beside the script that unpacks it, is
          # what Chrome blocked in the first 0.3.0 Windows kit; the kit carries
          # it as web/method.wasm.gz instead, read when a form is made.
          python tools/checker_not_built_in.py web/method.wasm.gz "kit/$kit"
          cd kit
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a -tzip "../$kit.zip" "$kit" >/dev/null; else zip -qr "../$kit.zip" "$kit"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: vleo-${{ matrix.target }}
          path: vleo-${{ needs.prove.outputs.version }}-${{ matrix.target }}.zip
      # THE ENGINE FOR THE PYTHON PACKAGE: the same code as the daemon, built as
      # a Python module. One per system; the `wheel` job below puts all of them
      # in one file.
      - name: the engine for the Python package
        shell: bash
        run: |
          cargo build --locked --release --manifest-path crates/vleo-py/Cargo.toml --target ${{ matrix.target }}
          mkdir -p "pylib"
          for f in _vleo.dll lib_vleo.dylib lib_vleo.so; do
            src="crates/vleo-py/target/${{ matrix.target }}/release/$f"
            [ -f "$src" ] && cp "$src" pylib/
          done
          ls -l pylib
          python tools/checker_not_built_in.py web/method.wasm.gz pylib
      - uses: actions/upload-artifact@v4
        with:
          name: pylib-${{ matrix.system }}
          path: pylib/
          if-no-files-found: error
      # Intel Macs, from the Apple-silicon runner. Not load-bearing: if it does
      # not build, the package still carries the other three and says plainly
      # on an Intel Mac that it has no engine for it.
      - name: the engine for Intel Macs
        if: matrix.system == 'macos-arm64'
        continue-on-error: true
        shell: bash
        run: |
          rustup target add x86_64-apple-darwin
          cargo build --locked --release --manifest-path crates/vleo-py/Cargo.toml --target x86_64-apple-darwin
          mkdir -p pylib-intel && cp crates/vleo-py/target/x86_64-apple-darwin/release/lib_vleo.dylib pylib-intel/
      - uses: actions/upload-artifact@v4
        if: matrix.system == 'macos-arm64'
        continue-on-error: true
        with:
          name: pylib-macos-x86_64
          path: pylib-intel/
          if-no-files-found: ignore

  # ONE FILE FOR EVERY LAPTOP. The kit's programs are new, unsigned `.exe`
  # files, and that is what Windows and company antivirus question. This
  # package has none: `pip install` puts it in place and `python -m vleo` runs
  # the same engine inside python.exe. tools/build_wheel.py says how.
  wheel:
    name: the one file for every laptop
    needs: [prove, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pylib-*
          path: pylib
      - name: the wheel
        run: |
          v="${{ needs.prove.outputs.version }}"
          for need in windows-x86_64 macos-arm64 linux-x86_64; do
            [ -d "pylib/pylib-$need" ] || { echo "::error::no engine for $need"; exit 1; }
          done
          cargo run --release -p xtask -- kit --files-only --out wheel-kit
          VLEO_DATA="$RUNNER_TEMP/wheel-data" cargo run --release -p vleo-cli -- data sync wheel-kit/bundles
          args=""
          for d in pylib/pylib-*; do
            f=$(ls "$d"/* | head -1)
            args="$args --native ${d#pylib/pylib-}=$f"
          done
          python3 tools/build_wheel.py --version "$v" --kit wheel-kit $args --out .
      - uses: actions/upload-artifact@v4
        with:
          name: vleo-wheel
          path: vleo-${{ needs.prove.outputs.version }}-py3-none-any.whl
          if-no-files-found: error

  # The one file, installed and started on each system it is for, the way a
  # teammate will: pip install, then `python -m vleo --check`, which starts the
  # tool, asks it for its version and its page, and fails if either is not
  # whole. Python 3.9 on Windows proves the one engine serves every Python from
  # 3.9 up.
  wheel-check:
    name: the one file installs and starts
    needs: [prove, wheel]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: "3.12"
          - os: windows-latest
            python: "3.9"
          - os: macos-latest
            python: "3.12"
          - os: ubuntu-22.04
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: vleo-wheel
      - name: install it and start it
        shell: bash
        run: |
          python -m pip install ./vleo-${{ needs.prove.outputs.version }}-py3-none-any.whl
          cd "$RUNNER_TEMP"
          python -m vleo --check

  # Nothing here decides anything. The decision was the merge into main, and
  # the first job has already refused a commit that did not come through one.
  publish:
    name: publish the release
    needs: [prove, build, wheel, wheel-check]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artefacts

      # What was released, on the run's own page, beside the pull request that
      # decided it.
      - name: what is being released
        run: |
          cat artefacts/notes/notes.md >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Artefacts" >> "$GITHUB_STEP_SUMMARY"
          find artefacts -type f | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"

      - name: the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.prove.outputs.version }}"
          # The three kits and the one wheel; the engines the wheel was built
          # from are inside it, not beside it.
          mkdir upload
          find artefacts -type f \( -name 'vleo-*.zip' -o -name 'vleo-*.whl' \) -exec mv {} upload/ \;
          gh release create "v$v" \
            --title "v$v" \
            --notes-file artefacts/notes/notes.md \
            upload/* || gh release edit "v$v" --notes-file artefacts/notes/notes.md
