# The release pipeline, and the one human decision.
#
# The working model's line for this is short: "the release pipeline itself, plus
# one human approval". The two halves matter equally. Everything mechanical is
# mechanical — the version, the notes, the builds, the checks — so that the one
# thing left for a person is the only thing a person is better at: deciding
# whether this is the state of the tool that goes to a customer.
#
# Two things this workflow may never do, and does not:
#
#   - change branch protection. The rules that decide what may merge are set by
#     a person in repository settings. A pipeline that can widen its own gate
#     has no gate.
#   - hold a signing key. Signing and notarisation take a certificate that
#     lives in an organisation secret a release engineer controls, requested at
#     the approval step rather than read by this file. The signing job is
#     deliberately absent until that certificate exists; a workflow that
#     pretends to sign is worse than one that admits it does not.
name: release

on:
  push:
    # A release is vMAJOR.MINOR.PATCH and nothing else: `v1`, `v-test` or
    # `v0.3.0-rc` start no release. (The prove job checks the same pattern on a
    # version typed by hand.)
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      version:
        description: "the version to release, without the leading v"
        required: true

permissions:
  contents: read

jobs:
  # Nothing is built before the tool is proven. The order is the point: a
  # release that discovers its own failure after the artefacts are uploaded has
  # already told somebody the wrong thing.
  prove:
    name: the tool is green before anything is built
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: v
        run: |
          v="${{ inputs.version }}"
          [ -n "$v" ] || v="${GITHUB_REF_NAME#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::'$v' is not a version: a release is MAJOR.MINOR.PATCH, tagged vMAJOR.MINOR.PATCH"
            exit 1
          }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "releasing $v"

      # The version in the manifests is the version being released. A tag that
      # disagrees with Cargo.toml produces a binary that reports a version
      # nobody can find in the history.
      - name: the tag and the manifest agree
        run: |
          have="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          want="${{ steps.v.outputs.version }}"
          [ "$have" = "$want" ] || {
            echo "::error::Cargo.toml says $have, the release says $want"
            exit 1
          }

      # A release names the beliefs it ships. Every node version recorded since
      # the last release says `next` until `xtask release` stamps it; a release
      # cut with any still unstamped would ship a change its own record cannot
      # place in a release.
      - name: every node version names this release
        run: cargo run -p xtask -- release "${{ steps.v.outputs.version }}" --check

      - name: the gate
        run: cargo run -p xtask -- gate

      - name: the generated artefacts match the sheets
        run: |
          cargo run -p xtask -- docs
          cargo run -p xtask -- derisk
          git diff --quiet || { echo "::error::regeneration changes the tree"; exit 1; }

      - name: reference data verifies
        run: cargo run -p xtask -- bundle verify

      # The profile that ships is the profile that is proven. Link-time
      # optimisation changes inlining, which can change a floating-point
      # result, so a release proved only in debug is not proved.
      - name: golden vectors against the shipping build
        run: cargo test --release --workspace

      - name: the notes, read off the log
        run: |
          python3 tools/release_notes.py \
            --version "${{ steps.v.outputs.version }}" \
            --out notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes.md

  build:
    name: the shipping binaries
    needs: prove
    strategy:
      fail-fast: false
      matrix:
        # `system` is the name the Python package gives each engine it carries.
        # Linux builds on the older Ubuntu so the programs and the engine load
        # on the laptops still running it, not only on the newest.
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            system: linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            system: macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            system: windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: rustup target add ${{ matrix.target }}
      # The three doors onto one kernel: the command line, the local server the
      # browser face talks to, and the shared library the wheel and MATLAB bind.
      - run: cargo build --release --target ${{ matrix.target }} -p vleo-cli -p vleo-daemon -p vleo-app -p vleo-ffi
      # WHAT THE TEAM GETS: a kit, not the repository. The programs alone do not
      # run — the daemon reads the web face, the tree and every node's page — so
      # each platform ships as one zip of the programs beside exactly those files,
      # with START_HERE.md on top. docs/SHARING.md says how it is used.
      - name: the kit
        shell: bash
        run: |
          kit="vleo-${{ needs.prove.outputs.version }}-${{ matrix.target }}"
          cargo run --release -p xtask -- kit --bin "target/${{ matrix.target }}/release" --out "kit/$kit"
          # The kit's reference data must verify on the machine that built it,
          # with the program that ships in it. The 0.1.1 Windows kit did not —
          # its data had been rewritten to CRLF on checkout — and nothing here
          # noticed until a teammate saw every solar row refuse.
          VLEO_DATA="$RUNNER_TEMP/kit-data" "kit/$kit/vleo" data sync "kit/$kit/bundles"
          # No program carries the node form's checker built in. Compressed
          # WebAssembly inside a program, beside the script that unpacks it, is
          # what Chrome blocked in the first 0.3.0 Windows kit; the kit carries
          # it as web/method.wasm.gz instead, read when a form is made.
          python tools/checker_not_built_in.py web/method.wasm.gz "kit/$kit"
          echo "KIT=$kit" >> "$GITHUB_ENV"

      # SIGNING, SWITCHED ON BY ITS SECRETS. With no certificate this step
      # says so and changes nothing: the programs ship unsigned, with their
      # name, version and icon, and docs/FIRST_RUN.md says how to open them.
      # With WINDOWS_CERT_PFX (base64) and WINDOWS_CERT_PASSWORD set, every
      # program in the kit is signed and timestamped before it is zipped.
      - name: sign the Windows programs, when there is a certificate
        if: runner.os == 'Windows'
        shell: bash
        env:
          PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if [ -z "$PFX" ]; then
            echo "no WINDOWS_CERT_PFX secret: the programs ship unsigned (docs/RELEASE_SETUP.md)"
            exit 0
          fi
          echo "$PFX" | base64 -d > "$RUNNER_TEMP/cert.pfx"
          signtool=$(ls "/c/Program Files (x86)/Windows Kits/10/bin/"*/x64/signtool.exe | sort | tail -1)
          for exe in "kit/$KIT"/*.exe; do
            "$signtool" sign /fd sha256 /f "$RUNNER_TEMP/cert.pfx" /p "$PFX_PASSWORD" \
              /tr http://timestamp.digicert.com /td sha256 /d "VLEO Design Tool" "$exe"
          done
          rm -f "$RUNNER_TEMP/cert.pfx"

      - name: zip the kit
        shell: bash
        run: |
          kit="$KIT"
          cd kit
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a -tzip "../$kit.zip" "$kit" >/dev/null; else zip -qr "../$kit.zip" "$kit"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: vleo-${{ matrix.target }}
          path: vleo-${{ needs.prove.outputs.version }}-${{ matrix.target }}.zip

      # THE MAC APP: VLEO Design Tool.app, made from this kit. Signed with the
      # Developer ID and notarised when the Apple secrets exist; otherwise
      # signed ad hoc, which carries no identity but is what lets an
      # Apple-silicon Mac open it after one confirmation instead of calling it
      # damaged. `ditto` zips it with the bundle intact.
      - name: the Mac app
        if: runner.os == 'macOS'
        shell: bash
        env:
          P12: ${{ secrets.APPLE_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          v="${{ needs.prove.outputs.version }}"
          cargo run --release -p xtask -- app --kit "kit/$KIT" --out app
          a="app/VLEO Design Tool.app"
          if [ -n "$P12" ] && [ -n "$IDENTITY" ]; then
            kc="$RUNNER_TEMP/sign.keychain-db"
            security create-keychain -p ci "$kc"
            security set-keychain-settings -lut 3600 "$kc"
            security unlock-keychain -p ci "$kc"
            echo "$P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k ci "$kc"
            security list-keychains -d user -s "$kc"
            codesign --force --deep --options runtime --timestamp -s "$IDENTITY" "$a"
            if [ -n "$APPLE_ID" ] && [ -n "$TEAM_ID" ] && [ -n "$APP_PASSWORD" ]; then
              ditto -c -k --keepParent "$a" "$RUNNER_TEMP/notarise.zip"
              xcrun notarytool submit "$RUNNER_TEMP/notarise.zip" --apple-id "$APPLE_ID" \
                --team-id "$TEAM_ID" --password "$APP_PASSWORD" --wait
              xcrun stapler staple "$a"
            fi
            rm -f "$RUNNER_TEMP/cert.p12"
          else
            echo "no Apple signing secrets: the app is signed ad hoc (docs/RELEASE_SETUP.md)"
            codesign --force --deep -s - "$a"
          fi
          codesign --verify --deep --strict "$a"
          ditto -c -k --keepParent "$a" "VLEO-Design-Tool-$v-macos-arm64.zip"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: app-macos
          path: VLEO-Design-Tool-${{ needs.prove.outputs.version }}-macos-arm64.zip
          if-no-files-found: error
      # THE ENGINE FOR THE PYTHON PACKAGE: the same code as the daemon, built as
      # a Python module. One per system; the `wheel` job below puts all of them
      # in one file.
      - name: the engine for the Python package
        shell: bash
        run: |
          cargo build --locked --release --manifest-path crates/vleo-py/Cargo.toml --target ${{ matrix.target }}
          mkdir -p "pylib"
          for f in _vleo.dll lib_vleo.dylib lib_vleo.so; do
            src="crates/vleo-py/target/${{ matrix.target }}/release/$f"
            [ -f "$src" ] && cp "$src" pylib/
          done
          ls -l pylib
          python tools/checker_not_built_in.py web/method.wasm.gz pylib
      - uses: actions/upload-artifact@v4
        with:
          name: pylib-${{ matrix.system }}
          path: pylib/
          if-no-files-found: error
      # Intel Macs, from the Apple-silicon runner. Not load-bearing: if it does
      # not build, the package still carries the other three and says plainly
      # on an Intel Mac that it has no engine for it.
      - name: the engine for Intel Macs
        if: matrix.system == 'macos-arm64'
        continue-on-error: true
        shell: bash
        run: |
          rustup target add x86_64-apple-darwin
          cargo build --locked --release --manifest-path crates/vleo-py/Cargo.toml --target x86_64-apple-darwin
          mkdir -p pylib-intel && cp crates/vleo-py/target/x86_64-apple-darwin/release/lib_vleo.dylib pylib-intel/
      - uses: actions/upload-artifact@v4
        if: matrix.system == 'macos-arm64'
        continue-on-error: true
        with:
          name: pylib-macos-x86_64
          path: pylib-intel/
          if-no-files-found: ignore

  # ONE FILE FOR EVERY LAPTOP. The kit's programs are new, unsigned `.exe`
  # files, and that is what Windows and company antivirus question. This
  # package has none: `pip install` puts it in place and `python -m vleo` runs
  # the same engine inside python.exe. tools/build_wheel.py says how.
  wheel:
    name: the one file for every laptop
    needs: [prove, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pylib-*
          path: pylib
      - name: the wheel
        run: |
          v="${{ needs.prove.outputs.version }}"
          for need in windows-x86_64 macos-arm64 linux-x86_64; do
            [ -d "pylib/pylib-$need" ] || { echo "::error::no engine for $need"; exit 1; }
          done
          cargo run --release -p xtask -- kit --files-only --out wheel-kit
          VLEO_DATA="$RUNNER_TEMP/wheel-data" cargo run --release -p vleo-cli -- data sync wheel-kit/bundles
          args=""
          for d in pylib/pylib-*; do
            f=$(ls "$d"/* | head -1)
            args="$args --native ${d#pylib/pylib-}=$f"
          done
          python3 tools/build_wheel.py --version "$v" --kit wheel-kit $args --out .
      - uses: actions/upload-artifact@v4
        with:
          name: vleo-wheel
          path: vleo-${{ needs.prove.outputs.version }}-py3-none-any.whl
          if-no-files-found: error

  # The one file, installed and started on each system it is for, the way a
  # teammate will: pip install, then `python -m vleo --check`, which starts the
  # tool, asks it for its version and its page, and fails if either is not
  # whole. Python 3.9 on Windows proves the one engine serves every Python from
  # 3.9 up.
  wheel-check:
    name: the one file installs and starts
    needs: [prove, wheel]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: "3.12"
          - os: windows-latest
            python: "3.9"
          - os: macos-latest
            python: "3.12"
          - os: ubuntu-22.04
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: vleo-wheel
      - name: install it and start it
        shell: bash
        run: |
          python -m pip install ./vleo-${{ needs.prove.outputs.version }}-py3-none-any.whl
          cd "$RUNNER_TEMP"
          python -m vleo --check

  # THE ONE HUMAN DECISION, sized to the repository it runs in.
  #
  # By default it is the act of pushing a vMAJOR.MINOR.PATCH tag: only somebody
  # with write access can, and every check above has passed before anything is
  # published. That works on any plan. This repository is private on a personal
  # account, where GitHub offers no environments, so a job that waited on one
  # could never run and no release could ever be made.
  #
  # When the repository can have one — GitHub Pro, or an organisation on Team —
  # set the repository variable RELEASE_ENVIRONMENT to `release` and configure
  # that environment's required reviewers: publishing then waits for a
  # reviewer, and refuses to go ahead if nobody is required.
  # docs/RELEASE_SETUP.md says how.
  publish:
    name: the pushed tag is the decision
    if: vars.RELEASE_ENVIRONMENT == ''
    needs: [prove, build, wheel, wheel-check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artefacts
      - name: what is being released
        run: |
          cat artefacts/notes/notes.md >> "$GITHUB_STEP_SUMMARY"
          echo "### Artefacts" >> "$GITHUB_STEP_SUMMARY"
          find artefacts -type f | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
      - name: the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/publish_release.sh "${{ needs.prove.outputs.version }}" artefacts

  publish-reviewed:
    name: one reviewer says yes
    if: vars.RELEASE_ENVIRONMENT != ''
    needs: [prove, build, wheel, wheel-check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ vars.RELEASE_ENVIRONMENT }}
    permissions:
      contents: write
    steps:
      # Fail closed. An environment with no reviewers approves instantly and
      # leaves the same green tick as a reviewed one, so the difference is
      # asserted rather than assumed.
      - name: the approval is real
        env:
          GH_TOKEN: ${{ github.token }}
          ENVIRONMENT: ${{ vars.RELEASE_ENVIRONMENT }}
        run: |
          if ! body=$(gh api "repos/${{ github.repository }}/environments/$ENVIRONMENT" 2>&1); then
            echo "::error::Could not read the '$ENVIRONMENT' environment. Either it does not"
            echo "::error::exist, or this token cannot see it. The response was:"
            echo "$body" | sed 's/^/::error::  /'
            echo "::error::See docs/RELEASE_SETUP.md. Nothing has been published."
            exit 1
          fi
          rules=$(printf '%s' "$body" | jq -r '[.protection_rules[]?.type] | join(",")')
          echo "protection rules on '$ENVIRONMENT': ${rules:-<none>}"
          case ",$rules," in
            *,required_reviewers,*) echo "a person is required to approve this release" ;;
            *)
              echo "::error::'$ENVIRONMENT' has no required reviewers, so this release would"
              echo "::error::publish with nobody approving it. Add them, or unset the"
              echo "::error::RELEASE_ENVIRONMENT variable to release on the tag alone."
              echo "::error::See docs/RELEASE_SETUP.md. Nothing has been published."
              exit 1
              ;;
          esac
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artefacts
      - name: what is being released
        run: |
          cat artefacts/notes/notes.md >> "$GITHUB_STEP_SUMMARY"
          echo "### Artefacts" >> "$GITHUB_STEP_SUMMARY"
          find artefacts -type f | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
      - name: the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/publish_release.sh "${{ needs.prove.outputs.version }}" artefacts
