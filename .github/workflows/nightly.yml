# Eight passes, every night, over everything.
#
# Three of them cannot run in the per-change pipeline: they need the whole tree,
# the whole ledger and yesterday's state. That is what makes the audit a
# different activity rather than a slower gate.
name: nightly audit

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 1 · build, both profiles
        run: |
          cargo build --workspace
          cargo build --release --workspace

      - name: 2 · golden vectors agree across profiles
        run: |
          cargo test --workspace
          cargo test --release --workspace

      - name: 3 · campaign over every reference case
        run: |
          cargo run --release -p vleo-cli --bin vleo -- data sync
          for node in prop_thrust_to_drag pwr_margin thm_margin mass_margin com_link_margin kpi_thrust_margin; do
            echo "== $node"
            cargo run --release -p vleo-cli --bin vleo -- campaign "$node"
          done

      - name: 4 · the tree against its own rules
        run: |
          cargo run -p xtask -- assemble
          cargo run -p xtask -- graph

      - name: 5 · the gap pass, over everything
        run: cargo run -p xtask -- gap

      - name: 6 · reference data freshness
        run: cargo run -p xtask -- bundle verify

      # The one check that asks whether the tests would fail, not whether they
      # pass. It is nightly rather than per-change because it is 138 cargo test
      # runs; the per-change pipeline mutates only what the change touched.
      - name: 8 · the tests are load-bearing
        run: cargo run -p xtask -- mutate

      # Gaps W6 and W7. Cost per agent and firing rate were declared as things
      # to watch with no instrument behind them, and a target with no meter is
      # an intention. Read from the harness's own local logs, so it reports
      # nothing on a runner that has none — which is the honest answer, and
      # different from a fleet that costs nothing.
      - name: 7 · the fleet — what fired, and what it cost
        run: python3 tools/fleet_report.py || true
