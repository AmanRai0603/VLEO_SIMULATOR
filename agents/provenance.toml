# Where each agent definition came from, and what happens when it goes away.
#
# Two widely-used agent projects were acquired or archived within months of each
# other in 2026, and the teams built on them are still managing it. So every
# adopted definition is a vendored copy in this repository, pinned, never a
# reference to somebody else's file that can change under us.
#
# Eight fields, and the last three are the ones that make the file worth having:
#
#   source        BUILD (written here, because it encodes this domain) or
#                 ADOPT (copied from a collection and tuned)
#   upstream      the exact repository address. Not the name — four separate
#                 projects answer to "AgentLint", and one tool lives under two
#                 organisations. A name is not an identifier
#   pinned        the commit or release the copy was taken from
#   licence       as read, not as assumed. One row in the wider audit turned out
#                 to run a tiered licence rather than an open one
#   owner         who here decides what this definition says
#   model         which model runs it, and why that one
#   fallback      the named alternative in the same category, written down
#                 before it is needed
#   verified      the date somebody last checked the three things above are
#                 still true. A catalogue entry describes a project on the day
#                 it was written
#
# Re-verify quarterly, and whenever an upstream collection publishes. Promoting
# a change to any definition is H10: the fleet owner, with the evaluation set
# passing at k=3.
#
# THE MODEL-FAMILY RULE. A checker may not run the model family of the thing it
# checks. The reason is not that one family is better: it is that a model given
# its own reasoning to grade approves it. The working model states this twice —
# for the reviewer, "pinned to a different model family from the producer", and
# for differential fill, "the same hole filled independently by a second model
# family and the two compared numerically over the declared domain".
#
# `checks = "<agent>"` on a row below declares the pairing, and
# tools/instruction_lint.py refuses a pair whose models match. Without that,
# the rule is a sentence and the default — everything on one family, because
# that is what the last person configured — silently wins.

[[agent]]
id = "A"
name = "declaration-drafter"
source = "BUILD"
upstream = ""
pinned = ""
licence = "ours"
owner = "integrator"
model = "sonnet"
why_model = "reads unstructured sources into a fixed schema — following a field list, not reasoning about physics"
fallback = "the sheet template and its REQUIRED markers — a person fills it, slower"
verified = "2026-09-11"
note = "Written here because nothing off the shelf knows these fields. Its prohibition — supply mathematics, a reason, or a value — has nothing mechanical behind it."

[[agent]]
id = "B"
name = "fixture-recorder"
source = "BUILD"
upstream = ""
pinned = ""
licence = "ours"
owner = "integrator"
model = "sonnet"
why_model = "formats and shape-checks against a schema"
fallback = "fixtures.toml written by hand; the gate already refuses a bad provenance either way"
verified = "2026-09-11"
note = "Written here because the provenance rule is ours. The gate enforces the half that can be enforced."

[[agent]]
id = "C"
name = "hole-filler"
source = "ADOPT"
upstream = "a general coding subagent, narrowed to a few typed lines"
pinned = "vendored 2026-09-09; no upstream commit — the definition was written against the splice this repository provides"
licence = "ours, as written"
owner = "platform engineer"
model = "sonnet"
why_model = "two or three typed lines composing existing kernel relations; the types are the constraint, not the model"
fallback = "a person writes the hole. It is two or three lines"
verified = "2026-09-11"
note = "The only prohibition in the roster that is fully enforced: it has no write path at all. `cargo xtask fill` is the sole route from its output into a file."

[[agent]]
id = "E"
name = "test-author"
