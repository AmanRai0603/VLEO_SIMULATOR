name = "declaration-drafter"
expected_from = "the first node drafted from a paper rather than transcribed from CD-06"
why_kept = "Silent because every row so far came from the CD-06 tree, which was already structured — there was no unstructured source to read. It fires on the first sheet drafted from romano2021 or a measurement."
source = "BUILD"
upstream = ""
pinned = ""
licence = "ours"
owner = "integrator"
model = "sonnet"
why_model = "reads unstructured sources into a fixed schema — following a field list, not reasoning about physics"
fallback = "the sheet template and its REQUIRED markers — a person fills it, slower"
verified = "2026-09-11"
note = "Written here because nothing off the shelf knows these fields. Its prohibition — supply mathematics, a reason, or a value — has nothing mechanical behind it."

