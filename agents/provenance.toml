source = "ADOPT"
upstream = "the test-generation category; tuned to generate over a declared domain rather than from code"
pinned = "vendored 2026-09-09"
licence = "ours, as written"
owner = "platform engineer"
model = "opus"
why_model = "a checker: it must be able to see that a test is vacuous, which is the thing the producer's family is worst at seeing about itself"
fallback = "gen_tests already emits the harness and the property strategies from the sheet; E extends, it does not originate"
verified = "2026-09-11"
note = "Its scope is smaller than the roster implies, because most property tests are generated deterministically from the sheet."

[[agent]]
