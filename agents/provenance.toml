# The five that are not agents. Kept here because the register has to say what
# replaced each one, or a dead roster entry looks like an oversight.
[[replaced]]
id = "D"
name = "reviewer"
checks = "every producer — so its family must differ from whichever wrote the change, decided per pull request rather than pinned here"
replaced_by = "tools/review_report.py, plus a slot in the pipeline for an adopted review model"
upstream_if_adopted = "PR-Agent (now community-owned, docs at pr-agent.ai) or kodus. NOT coderabbitai/ai-pr-reviewer — archived and read-only since March 2024"
must_be = "a different model family from whichever wrote the change, and never a required check"
verified = "2026-09-11"

