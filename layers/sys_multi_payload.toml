label = "Multi-payload"
parent = "sys_satellite_system"
owner = "mass"
layer = 2
order = 77
box = false   # drawn as a nested box on the diagonal
tone = "slate"
cases = []   # empty means every case

[[relates]]
from = "sys_multi_payload"
to = "sys_eo_optical_service"
why = "what the shared bus allows the optics"

[[relates]]
from = "sys_multi_payload"
to = "sys_comms_service"
why = "what the shared bus allows the link"

