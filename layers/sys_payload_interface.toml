# A layer file: the rows in the tree that are not nodes.
#
# Headings, their parents, the relation edges between groups, and
# subsystem ownership — which CODEOWNERS is generated from. Changed
# rarely and reviewed by two people, because the tree is the
# decomposition and moving a branch moves everyone's work.

[[group]]
id = "sys_payload_interface"
label = "Payload interface"
parent = "sys_carry_the_payloads"
owner = "payload"
layer = 2
box = false   # drawn as a nested box on the diagonal
tone = "green"
cases = []   # empty means every case

