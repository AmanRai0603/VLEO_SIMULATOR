label = "Export control"
parent = "mgt_standards_and_compliance"
owner = "programme"
layer = 1
box = false   # drawn as a nested box on the diagonal
tone = "violet"
cases = []   # empty means every case

[[relates]]
from = "mgt_export_control"
to = "mgt_long_lead_items"
why = "what may be bought, and from where"

