# A bundle says what it is, where it came from, and until when it may be used.
#
# Immutable and versioned: a published version is never edited, and a
# correction is a new version. That is what lets a ledger row from eighteen
# months ago be reproduced exactly.
name = "solar-weather"
version = "2026.09.14"
provenance = "noaa_swpc"
licence_until = "2031-12-31"
stale_after_days = 180
note = """
The whole solar-weather record, as CSV anyone can open.

WHAT THIS IS. Twenty-nine years of daily observation — 1997-01-01 to
2025-12-31 — plus every issued 27-day forecast, every alert, the monthly means,
the three solar cycles the record spans, and a per-day geomagnetic regime.
70,415 rows across seven files.

THE RECORD IS NOT GAP-FREE, WHATEVER ITS OWN METADATA SAYS. The .mat this came
from describes its daily table as "gap-free daily observed". It is not:
2017-01-01 to 2017-09-30 is absent — 273 days, nine months, one continuous run
and the only gap in twenty-nine years. 10,319 rows across a 10,592-day span.
A mission window overlapping 2017 gets fewer days than it asked for, and
`vleo_data::days_missing` is how a caller finds that out before averaging over
a hole. The claim was inherited from the source and repeated here before it was
checked; it is written down now because the next person will inherit it too.

It arrived as a MATLAB .mat, which is openable by MATLAB and by people who know
which Python library to reach for. It is CSV here because data nobody can open
is data nobody can check, and this is the evidence under every density number
the tool will produce.

Three things were done to it, and nothing else. MATLAB datenums became calendar
dates. Every column got a name and a stated unit in the header. One table
became one file. No value was rounded, filtered, interpolated or rescaled:
every number was read back and compared against the source, and all of them —
f107, Ap, all eight three-hourly Kp, the College and Fredericksburg indices,
every forecast column, every regime label — match exactly.

WHAT IS MEASURED AND WHAT IS NOT. observed_daily.csv is the measurement.
forecast_issued.csv, forecast_issues.csv and alerts.csv are what was published
at the time, which is a record of what was said rather than of what happened.
monthly_means.csv, solar_cycles.csv and daily_regime.csv are DERIVED from the
daily record — the last of those is a three-component Gaussian mixture's
opinion, carrying its own confidence per day, and a day labelled 'storm' is a
day a model put there.

WHAT IS FACTORED OUT, AND WHAT IS NOT. forecast_issues.csv stores the archive
path under a base URL named in its own header, rather than the full address on
every row — 119 KB of one repeated prefix. Only the shared base is factored out.
Thirteen of the 1,437 paths disagree with their row's own date and issue number:
1998-08-25 carries issue 1199 and was fetched from 1998/09/prf1200.pdf. Those
are facts about the archive, and deriving the path from date and number instead
of storing it would have erased them.

ONE CAVEAT THE SOURCE ITSELF STATES. ap_planetary is the SWPC *estimated*
planetary A, not the GFZ definitive value. Anyone reconciling against GFZ will
find differences, and they are not transcription errors.

WHY THE BYTES ARE HERE. bundles/README.md says recipes live here and bundle
bytes do not, the registry holding the bytes instead. This one is 3.9 MB of
text and is kept in the repository on purpose: the record is the evidence for
every node the solar-weather subsystem will publish, and evidence behind a
registry nobody can reach is evidence nobody checks.
"""
files = [
  "INDEX.md",
  "observed_daily.csv",
  "forecast_issued.csv",
  "forecast_issues.csv",
  "alerts.csv",
  "monthly_means.csv",
  "solar_cycles.csv",
  "daily_regime.csv",
]
