id = "repeatability"
label = "Repeatability — the mean cycle against every cycle"
module = "web/js/solar.js"
mount = "canvas.sw-panel"
draws = """Every cycle the record holds, stacked on cycle phase, with the mean of the
COMPLETE cycles drawn heavier over them. Cycle 25 is dashed and stops part way,
because it is still running and the record simply has no days past its end."""
correct = """One line per cycle in the record plus one heavier line for the mean of the
complete ones, all spanning phase 0 to 1. The mean line lies between cycles 23 and
24 everywhere, because those are the complete cycles it averages — a mean that
escapes them is an averaging error. Cycle 25 may sit outside it, and does,
since it is excluded from the average. Cycle 25's line is dashed and ends before
phase 1 while the others do not. The vertical axis is labelled with the
selected variable and its unit, and changing the variable changes that label.
Bins that neither complete cycle populates to the declared minimum are absent
from the mean rather than drawn as zero."""
# A person looked at panels/reference/repeatability.png and agreed the picture
# is right. That is what makes check three mean anything: the reference is the
# claim, and without a name against it the check only proves the chart has not
# changed since a machine drew it.
confirmed_by = "A. Rai / 2026-09-15"
tolerance = 0.02
# The panel refetches the whole solar-weather record on every redraw, so
# check two has to wait on the content changing rather than on a fixed pause.
settle_ms = 8000

# A figure lives on the row it argues about, so driving it means opening that
# row. There is no solar view any more: it was a sixth item in a navigation
# whose subtitle says four layers, and it showed solar weather in a second
# place that disagreed with layer 3. panel_check re-runs this after every
# input to restore the starting state.
ready = """(async () => {
  await window.openNode('sw_cycle_phase');
  await new Promise(r => setTimeout(r, 200));
  const cv = document.querySelector('.row-figure canvas.sw-panel');
  if (!cv) throw new Error('no figure on sw_cycle_phase for the repeatability panel');
})()"""

[[input]]
name = "view"
drive = "(() => { const s = document.querySelector('.sw-opt[data-k=view]'); if (!s) throw new Error('no view control'); s.value = 'storm'; s.dispatchEvent(new Event('change')); })()"
why = """the two views draw different quantities entirely; a panel that shows the same picture for both is not reading the control"""

[[input]]
name = "v"
drive = "(() => { const s = document.querySelector('.sw-opt[data-k=v]'); if (!s) throw new Error('no v control'); s.value = 'ap'; s.dispatchEvent(new Event('change')); })()"
why = """each variable has its own axis label and its own scale — a chart that does not change is drawing one variable and labelling it three ways"""

[[input]]
name = "bins"
drive = "(() => { const s = document.querySelector('.sw-opt[data-k=bins]'); if (!s) throw new Error('no bins control'); s.value = '40'; s.dispatchEvent(new Event('change')); })()"
why = """the bin count sets the resolution of every line; doubling it must visibly change the curves"""
