id = "forecast"
label = "Forecast — the issued outlook, scored"
module = "web/js/solar.js"
mount = "canvas.sw-panel"
draws = """The published 27-day outlook scored against what actually arrived, by lead, by
rolling year, or by the age of the issue a user would have had in hand. The
first two views are THREE STACKED FRAMES on one x axis — skill, bias and RMS
error — because the three have different units and a shared y axis would be a
dual-axis chart. The persistence baseline is two lines in the skill frame, not
a control: the leaky one is drawn beside the strict one so the size of the leak
is visible rather than remembered."""
correct = """THREE FRAMES IN A COLUMN on the by-lead and by-year views, sharing one
horizontal axis with its ticks and title drawn ONCE at the bottom. Each frame
carries its own y label and its own scale; a single y axis across all three, or
two scales in one frame, is the defect to look for. A vertical read down the
stack must land on the same lead in every frame — the frames are registered on
one x extent, so a crosshair crossing all three at different leads means they
have been scaled separately.

The zero line is drawn and labelled on BOTH difference metrics. Skill is
against a baseline and bias is a signed error, so neither can be read without
the value that means "no difference" on the picture; RMS error gets no line,
because it is a magnitude that cannot go negative and zero there is perfection
rather than a baseline. The bias frame is the one to check hardest: with the
line drawn, the by-lead series is visibly below it at EVERY lead, which is the
outlook under-predicting F10.7 throughout.

THE SKILL FRAME WASHES EVERYTHING BELOW ZERO AND THE BIAS FRAME DOES NOT, and
that asymmetry is deliberate. On the skill frame zero is a verdict — below it
the outlook is worse than not bothering — so the side is worth saying without
being read. On the bias frame zero is a direction rather than a verdict, and
the bias is negative at all 27 leads, so a wash there would cover the whole
frame: a frame that is entirely shaded has said nothing. A bias frame washed
below zero is the defect to look for.

THE SKILL FRAME CARRIES TWO LINES and the dashed one must sit BELOW the solid
one at short lead. Solid is the strict baseline — the last observation before
the issue date, what a forecaster actually had — and the outlook beats it from
lead 1, peaking near +0.44 around lead 9 and going negative only at leads 23 to
25. Dashed is the leaky baseline, which is handed the issue date itself; it
makes persistence look better, so skill against it collapses at short lead. Two
lines that agree everywhere means the leak is not being computed.

Bias and RMS error have ONE line each and no baseline variant, because neither
uses a baseline. They are also computed over every pair with an observation
rather than over the pairs a baseline happened to reach, so their sample is
larger than the skill frame's — a panel where all three frames rest on the
identical count has tied a baseline-free metric to a baseline again.

ON THE BY-CALENDAR-YEAR VIEW the horizontal axis is the year of ISSUE and every
line BREAKS at every year dropped for thinness — 1997, 2000, 2009, 2010 and
2017. A continuous line across those is the defect to look for: it would draw
two years of evidence where the archive holds 25 pairs. The skill series dips
below the red line once, at 2008, and that is the record behaving rather than
the outlook failing — a flat minimum is the easy case for persistence, and the
RMS frame beneath it confirms it by showing that year as the smallest error in
the series. Every year is scored on leads 1 to 14 only, which is the band every
year populates; a version scoring all leads together would rank 2004 and 2007
highly for holding no long leads at all.

The lead axis runs 1 to 27, which is the outlook's nominal span and NOT the
same number as sw_outlook_lead's 26. The bundle carries leads from -26 to 392,
so drawing 1 to 27 is a deliberate restriction to the issued window; the row
publishes 26 because that is the longest lead most issues actually index. The
two disagree on purpose and a reviewer should not reconcile them by moving
either."""

# A person looked at panels/reference/forecast.png and agreed the picture
# is right. That is what makes check three mean anything: the reference is the
# claim, and without a name against it the check only proves the chart has not
# changed since a machine drew it.
# NOT CONFIRMED. The reference was re-recorded on 2026-09-18 against a
# picture whose CONTENT changed, not just its size: the by-lead and by-year views are now THREE STACKED FRAMES on one x axis instead of one metric at a time, the skill frame carries both persistence baselines as two lines, and bias and RMS error are computed over every pair with an observation rather than over the pairs a baseline reached; the metric and baseline controls are gone.
# The previous signature was against a different chart and carrying it
# forward would make check three prove only that a machine has not
# changed its mind. It needs a person to look at
# panels/reference/forecast.png and put their name here.
confirmed_by = "UNCONFIRMED / re-recorded 2026-09-19 after §34 moves 1 and 2; awaiting a look (last signed A. Rai / 2026-09-15, against the previous chart)"
tolerance = 0.02
# The panel refetches the whole solar-weather record on every redraw, so
# check two has to wait on the content changing rather than on a fixed pause.
settle_ms = 8000

# A figure lives on the row it argues about, so driving it means opening that
# row. There is no solar view any more: it was a sixth item in a navigation
# whose subtitle says four layers, and it showed solar weather in a second
# place that disagreed with layer 3. panel_check re-runs this after every
# input to restore the starting state.
ready = """(async () => {
  await window.openNode('sw_outlook_lead');
  await new Promise(r => setTimeout(r, 200));
  const cv = document.querySelector('.row-figure canvas.sw-panel');
  if (!cv) throw new Error('no figure on sw_outlook_lead for the forecast panel');
})()"""

# The view control has three branches and check two drives each one, because a
# branch nobody drives is how 'by calendar year' came to be advertised for
# months without existing. Two entries on one control is deliberate.
[[input]]
name = "view → by calendar year"
drive = "(() => { const s = document.querySelector('.sw-opt[data-k=view]'); if (!s) throw new Error('no view control'); s.value = 'year'; s.dispatchEvent(new Event('change')); })()"
why = """
one point per year on a year axis, against one point per lead on a lead axis —
different quantities on different axes. This is the branch that was offered and
unbuilt, so it is the branch that most needs a check demanding the canvas move.
"""

[[input]]
name = "view → issue age"
drive = "(() => { const s = document.querySelector('.sw-opt[data-k=view]'); if (!s) throw new Error('no view control'); s.value = 'age'; s.dispatchEvent(new Event('change')); })()"
why = """
against-lead and issue-age are different horizontal quantities — lead is what
the forecast promises, age is what a user actually has in hand, and the median
gap between issues is 7 days. A third option, 'rolling, by year', was offered
here until this check demanded the canvas change and found it was read nowhere.
"""
