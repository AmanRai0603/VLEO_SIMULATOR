id = "density"
label = "Density — the precondition, and why there is no curve"
module = "web/js/solar.js"
mount = "canvas.sw-panel"
draws = """Not a density profile. The study's density tab needs an atmosphere model owned
by a subsystem with nothing written in it, so what is drawn is the honest
precondition: the two drivers such a model takes, against each other, over
every day carrying both."""
correct = """the finding line reports the share of days below BOTH medians against the 25 per
cent two independent drivers would give, and the number of flux deciles in which
a storm-level Ap appears. A scatter of ten thousand dots does not tell a reader
either of those by looking.

A scatter of the two drivers against each other, one point per day carrying
both, with no fitted line through it — a trend line here would be this face
carrying a model no row owns. The axes are the two drivers with their units,
and the Ap axis STARTS AT ZERO. That is worth checking rather than assuming:
Ap has no negative values and a quiet day really is zero, so this is the one
panel whose data reaches the floor — and until the floor was declared the
chart's own padding ran the axis to -16.4 and drew space that cannot exist.
The note beneath states plainly that the tab has no rows and why, and gives the
measured correlation; a panel that quietly drew a density curve instead would
be the defect, and it is the one this spec exists to fix in place."""
# A person looked at panels/reference/density.png and agreed the picture
# is right. That is what makes check three mean anything: the reference is the
# claim, and without a name against it the check only proves the chart has not
# changed since a machine drew it.
#
# RE-CONFIRMED against the zero-floored picture. The axis change moved 4.6 per
# cent of this image's pixels, so the earlier look was at a different chart and
# did not carry; it was put back in front of a person and agreed again. That
# second look is the whole reason this row may go to main, and it is the step
# no check can perform.
# NOT CONFIRMED ANY MORE. The reference was re-recorded on 2026-09-19: every
# figure in the face now carries a finding line under its y label, so the frame
# below it has moved and the picture says something it did not say before. The
# earlier signature was against a picture without that line.
confirmed_by = "UNCONFIRMED / re-recorded 2026-09-19, §34 moves 1–5; awaiting a look. Every figure gained an answer line above the chart and a finding line inside it, and this panel’s own picture changed as well — see `correct` above for what to check"
tolerance = 0.02
# The panel refetches the whole solar-weather record on every redraw, so
# check two has to wait on the content changing rather than on a fixed pause.
settle_ms = 8000

# A figure lives on the row it argues about, so driving it means opening that
# row. There is no solar view any more: it was a sixth item in a navigation
# whose subtitle says four layers, and it showed solar weather in a second
# place that disagreed with layer 3. panel_check re-runs this after every
# input to restore the starting state.
ready = """(async () => {
  await window.openNode('sys_space_environment_atmospheric_density');
  await new Promise(r => setTimeout(r, 200));
  const cv = document.querySelector('.row-figure canvas.sw-panel');
  if (!cv) throw new Error('no figure on sys_space_environment_atmospheric_density for the density panel');
})()"""

# NO INPUTS, AND THAT IS A REAL GAP RATHER THAN AN OVERSIGHT. This panel
# declares no controls because it draws one fixed precondition, so check
# two — "it moves" — has nothing to drive and passes vacuously. Checks one
# and three still bite. If this tab ever gains a control, it gains an
# [[input]] here on the same day.
