id = "design"
label = "Design — the window against what the vehicle is built for"
module = "web/js/solar.js"
mount = "canvas.sw-panel"
draws = """What the record expects against what the design is built for: a return curve
for the Ap driver, or lead and confidence for F10.7, with the capability and
the requirement drawn on as the lines a reader compares against."""
correct = """A DARK RENDERING IS RECORDED BESIDE THE LIGHT ONE and both have to be looked at.
The canvas gets none of CSS's help: its palette is a second table in
web/js/chart.js, chosen and validated against the dark surface separately, so
it can be wrong in ways the light one is not. What to check is the same in both
— every claim above — plus one thing only the dark picture can show: nothing in
the frame should be a light block. A literal light fill that never followed the
scheme reads as a hole burned in the page.

the finding line says where the curve enters the shaded region and where it
reaches the requirement, both read off the drawn curve by interpolation.

The record's expectation as a curve, with the selected capability and the
selected requirement drawn as marks that sit at their stated values on the same
axis — at G3 the capability is Ap 132, and the requirement mark moves when the
requirement control does. Where the expectation crosses the capability is the
number sw_design_safe_duration publishes, and it is labelled AT THE CROSSING —
a dot on the curve with a short leader to "exceeded here", carrying the year.
It used to be a dashed rule the full height of the frame with its label at the
ceiling, which is a fact about a point told somewhere else. A vertical rule
here is the defect now. Both marks carry labels naming what
they are; two unlabelled horizontal lines are the defect this catches.

EVERYTHING ABOVE THE CAPABILITY IS WASHED, in the capability mark's own colour
and not the requirement's. The wash opens at the capability line and runs to
the top of the frame, so which side of the line is the bad side is something a
reader sees rather than works out. A wash drawn in the requirement's pink while
opening at the capability is the defect to look for: a region belongs to the
edge it opens at.

ON THE F10.7 BRANCH, which the reference image does not cover because it is
shot at the state the panel opens in: FIVE curves against mission length. Four
solid ones are the design rows — hot and cold, sustained and single day — and
they are nested in that order and never cross, because each cold value is below
its hot counterpart by construction. All four WANDER up and down with mission
length; a monotone set here means they are being read off something other than
the window mean.

The fifth is DASHED AND DRAWN AT HALF CONTRAST, and is not a design value: sw_window_peak_level is the
maximum of the same cycle analogue the other four are built on a mean of. It
must rise MONOTONICALLY and in steps — a longer window can only contain more of
the cycle, and the peak jumps when the window swallows another cycle maximum, so
a smooth or falling dashed line is the defect. It crosses ABOVE the hot
single-day curve at about 5.9 years, and that crossing is the point of drawing
it: past there the design is sized on a mean that sits under the thing it
averages.

The area between the hot single-day curve and the cold single-day curve is
FILLED: that area is the design window, which the note has always called it and
the picture used to leave as two edges a reader subtracted. The fill is bounded
by the outer two curves and by nothing else — a fill reaching the sustained
curves instead would be drawing the wrong window. The band above the
requirement is washed in the same pink the requirement line is drawn in."""
# A person looked at panels/reference/design.png and agreed the picture
# is right. That is what makes check three mean anything: the reference is the
# claim, and without a name against it the check only proves the chart has not
# changed since a machine drew it.
# NOT CONFIRMED ANY MORE. The reference was re-recorded on 2026-09-19: the Ap
# view now washes the region above the design level, and the F10.7 view fills
# the design window between its outer two curves. The CONTENT of the picture
# changed, not its size, so the earlier signature was against a different chart
# and carrying it forward would make check three prove only that a machine has
# not changed its mind.
confirmed_by = "UNCONFIRMED / re-recorded 2026-09-19, §34 moves 1–9; awaiting a look at BOTH pictures. Every figure gained an answer line above the chart, a finding line inside it, and a second rendering in the dark scheme — see `correct` above for what to check in each"
# Check four drives this panel: a brush, a key click, and the buttons that undo
# them. It is declared rather than inferred so a panel that deliberately offers
# no interaction does not fail a check for not having one.
interactive = true
# The panel refetches the whole solar-weather record on every redraw, so
# check two has to wait on the content changing rather than on a fixed pause.
settle_ms = 8000

# A figure lives on the row it argues about, so driving it means opening that
# row. There is no solar view any more: it was a sixth item in a navigation
# whose subtitle says four layers, and it showed solar weather in a second
# place that disagreed with layer 3. panel_check re-runs this after every
# input to restore the starting state.
ready = """(async () => {
  await window.openNode('sw_storm_return_level');
  await new Promise(r => setTimeout(r, 200));
  const cv = document.querySelector('.row-figure canvas.sw-panel');
  if (!cv) throw new Error('no figure on sw_storm_return_level for the design panel');
})()"""


# Check 3, the pixel comparison, is declined for this panel. Checks 1, 2,
# 2c and 4 still run: it renders, it moves, it states what the engine worked
# out and it undoes an interaction to the pixel.
pixel_reference = false
pixel_reference_why = """every number on it is a row the engine publishes, checked by that row's own fixtures, and check 2c proves the panel draws the engine's figure rather than holding a copy"""

[[input]]
name = "v"
drive = "(() => { const s = document.querySelector('.sw-opt[data-k=v]'); if (!s) throw new Error('no v control'); s.value = 'f107'; s.dispatchEvent(new Event('change')); })()"
why = """the Ap return curve and the F10.7 lead-and-confidence view are different quantities on different axes"""

[[input]]
name = "g"
drive = "(() => { const s = document.querySelector('.sw-opt[data-k=g]'); if (!s) throw new Error('no g control'); s.value = '1'; s.dispatchEvent(new Event('change')); })()"
why = """the G band sets the capability line; moving G3 to G1 must move that line from 132 to 48"""

[[input]]
name = "req"
drive = "(() => { const s = document.querySelector('.sw-opt[data-k=req]'); if (!s) throw new Error('no req control'); s.value = 'l3_solar_req_04'; s.dispatchEvent(new Event('change')); })()"
why = """the requirement is a separate mark from the capability and must move on its own — and it is now a ROW rather than a number typed into the panel"""

# THE CURVES AND WHAT THE PANEL SAYS ABOUT THEM ARE THE ENGINE'S (phase 10l):
# the `design` figure sweeps the rows on the reader's case, reads the
# requirement's own answer, and works out where the return curve reaches the
# bound and the requirement, the record's days above the bound and in how many
# runs, the F10.7 window's width, the worst single day and where the analogue's
# peak first climbs above it (vleo_modules::design). It replaces the three
# [[engine]] rows this panel declared — l3_solar_req_01, l3_solar_req_03 and
# sw_f107_design_short — because the page no longer runs or sweeps them itself:
# the figure carries them, as `req`, `level` and `hot`, and check 2c moves each
# number in it and demands the panel say something different.
#
# `req_at` is null on the opening view: the survival requirement, Ap 207, is
# never reached inside the declared mission lengths, so there is no number to
# move there. It is declared on the sustained requirement, which is reached.
[[figures]]
id = "design"
reads = ["years", "level", "bound", "req", "hits_at", "record", "points_refused"]

[[figures]]
id = "design"
state = "(() => { const s = document.querySelector('.sw-opt[data-k=req]'); if (!s) throw new Error('no req control'); s.value = 'l3_solar_req_04'; s.dispatchEvent(new Event('change')); })()"
reads = ["req_at"]

[[figures]]
id = "design"
state = "(() => { const s = document.querySelector('.sw-opt[data-k=v]'); if (!s) throw new Error('no v control'); s.value = 'f107'; s.dispatchEvent(new Event('change')); })()"
reads = ["req", "years", "hot", "hot_long", "cold_long", "cold", "analogue", "peak", "margin", "narrowest", "widest", "over", "points_refused"]
