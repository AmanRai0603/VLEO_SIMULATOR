id = "closure"
label = "Closure — each requirement against what the record gives it"
module = "web/js/solar.js"
mount = "canvas.sw-panel"
draws = """One required/achieved pair at a time, in two stacked frames on one axis. The
top frame holds what the record gives — the achieved quantity, swept — against
the requirement as a flat dashed line. The bottom frame holds the same fact as
a signed margin, a fraction of the requirement, with zero drawn. The horizontal
axis is whichever declared decision /v1/levers reports as spending this margin
fastest, excluding the requirement itself."""
correct = """A DARK RENDERING IS RECORDED BESIDE THE LIGHT ONE and both have to be looked at.
The canvas gets none of CSS's help: its palette is a second table in
web/js/chart.js, chosen and validated against the dark surface separately, so
it can be wrong in ways the light one is not. What to check is the same in both
— every claim above — plus one thing only the dark picture can show: nothing in
the frame should be a light block. A literal light fill that never followed the
scheme reads as a hole burned in the page.

THE FINDING LINE IS THE CHECK ABOVE, MADE BY THE PANEL. The crossing in the top
frame is computed from the achieved curve and the requirement line; the crossing
in the bottom one from the margin. They come from different arrays, and the
finding states that they agree — or, in capitals, that they do NOT, which is the
defect this block describes and nothing else could catch.

TWO FRAMES on one shared x axis, its ticks and title drawn once at the bottom.
The top frame carries two lines in the same unit: a swept curve and a flat
dashed one. THE REQUIREMENT LINE MUST BE FLAT — it is a declared number a
person chose, and a requirement that slopes means the panel is sweeping the
bound instead of the environment. The bottom frame carries one line with a red
zero rule on it.

The two frames must agree: wherever the swept curve crosses the requirement in
the top frame, the margin crosses zero in the bottom one, at the same x. They
are the same fact twice and a picture where the crossings are at different
places has computed the margin from something other than the two lines above
it.

THE AREA BETWEEN THE TWO LINES IS FILLED AND IT CHANGES COLOUR AT THE CROSSING.
Left of the crossing the fill is the achieved curve's own hue and it is margin
left; right of it the fill is the pink every bound in this face is drawn in and
it is requirement exceeded. The two meet exactly at the crossing and nowhere
else — where there IS a crossing, one fill in one colour across the whole span
is the defect, because it draws "this much is unspent" and "this much is
overspent" as the same wedge.

WHERE THERE IS NO CROSSING, one colour across the whole span is correct and the
finding line says so in as many words. That case is reachable and this sentence
did not used to admit it: on pair 04 the crossing sat at an expected Ap of 43.4,
which is a sky the record has never held over a rotation — the largest of its
381 rotation means is 36.96. The crossing was an artefact of
sw_ap_central_expectation being bounded at 80, and narrowing that bound to what
the record supports removed it. A figure that shows a requirement breached
outside anything the record holds is a false alarm, and it was one.
The bottom frame washes everything below zero in the same pink, and the wash
must start at the same x the top frame's pink fill does.

The margin is POSITIVE where the achieved curve is BELOW the requirement,
because every one of these five declares sense "<=" — the requirement is a
ceiling and room is what is left under it. A margin that rises as the achieved
curve rises has the sense backwards.

The horizontal axis must NOT be the pair's own requirement. A margin is a
fraction of its bound, so sweeping the bound moves the margin by construction
and says nothing about the sky; /v1/levers reports the requirement at or near
the top of every one of these five, and the panel is required to skip it. An
axis labelled "Required — ..." is that defect.

Switching the closure control must change the axis as well as the curves: the
two F10.7 pairs are spent fastest by the mean band spread, the survival pair by
mission duration, and the two sustained/daily Ap pairs by the expected Ap over
the window. An axis that stays the same across all five means the lever
question is not being asked."""
# NOT CONFIRMED. This panel is new on 2026-09-18 and nobody has looked at
# panels/reference/closure.png yet, and an agent may not be that person.
confirmed_by = "UNCONFIRMED / re-recorded 2026-09-21 after three solar bounds were narrowed to what the record supports. This panel sweeps the most-moving decision across its DECLARED range, so a bound change moves the axis: pair 04 now runs to Ap 40 rather than 80 and no longer shows the requirement being exceeded at 43.4, which was a crossing outside anything the record holds. Still awaiting a look at BOTH pictures — see `correct` above"
# Check four drives this panel: a brush, a key click, and the buttons that undo
# them. It is declared rather than inferred so a panel that deliberately offers
# no interaction does not fail a check for not having one.
interactive = true
settle_ms = 10000

ready = """(async () => {
  await window.openNode('l3_solar_ach_04');
  await new Promise(r => setTimeout(r, 200));
  const cv = document.querySelector('.row-figure canvas.sw-panel');
  if (!cv) throw new Error('no figure on l3_solar_ach_04 for the closure panel');
})()"""


# Check 3, the pixel comparison, is declined for this panel. Checks 1, 2,
# 2b and 4 still run: it renders, it moves, it reads the engine and it
# undoes an interaction to the pixel.
pixel_reference = false
pixel_reference_why = """a closure's margin and sense are checked by gate 7d and 7e on the sheet, and check 2b proves this panel reads the closure rather than restating it"""

[[input]]
name = "pair"
drive = "(() => { const s = document.querySelector('.sw-opt[data-k=pair]'); if (!s) throw new Error('no pair control'); s.value = '03'; s.dispatchEvent(new Event('change')); })()"
why = """each pair is a different requirement, a different achieved quantity and a different sweep axis; one picture for two of them means the control is ignored"""

[[engine]]
row = "l3_solar_ach_04"
why = """the bottom frame IS this row — a panel drawing a margin that does not move when the engine's margin moves is drawing a literal"""

[[engine]]
row = "l3_solar_req_04"
why = """the dashed line is this row's declared value, and it was the requirement literals in the design panel that went two revisions stale before anything noticed"""
