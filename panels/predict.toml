id = "predict"
label = "Predict — how far the flux moves over a lead"
module = "web/js/solar.js"
mount = "canvas.sw-panel"
draws = """Four percentiles of the change in the driver over a lead — 50th, 90th, 95th
and 99th — against that lead, out to fifteen years, as an ordinal ramp in one
hue with the 95th heavy. This is the measured quantity sw_uncertainty_growth
reads, drawn over its whole range rather than at the one lead a mission asks
about, and with the cost of choosing a percentile visible rather than hidden
behind a control."""
correct = """FOUR curves of percentile change against lead, nested and never crossing: the
99th is the topmost everywhere and the 50th the lowest, because they are
quantiles of one sample and a crossing would mean they were read off different
ones. They are four steps of ONE hue, light for the 50th to dark for the 99th,
never four different colours — an ordered set drawn in categorical hues says
the four are unrelated. The 95th is the heavy line. The horizontal axis ends at
the last lead in the ladder and NOT at fifteen years: the ladder is geometric
and its last rung is 13.54 years, and an axis that stopped exactly on fifteen
would mean the ladder had been resampled to be tidy. The curves are measured,
not fitted: at short leads they wobble rather than rising smoothly, and the
95th stops being monotone altogether — it rises to 116 sfu at 4.08 years, falls
to 64 at 10.03, and rises again, which is the eleven-year cycle showing
through. The four never cross: they are quantiles of one sorted sample at each
lead, so a crossing is the sample having been rebuilt per percentile. A smooth monotone curve means something has
been fitted. Every line FADES toward the long leads, because the pair count
falls away and a line of constant weight would claim the far end is as well
known as the near one. THE FAN IS FILLED between the 50th and the 99th, in the published
percentile's own hue and under all four lines. That area is what choosing a
percentile costs, and it must OPEN with the lead: a fill of roughly constant
width means the percentiles are not spreading and something has been fitted.
The fill carries no legend entry — it is the spread of the family the four
lines are, not a fifth quantity.

TWO NOTES SIT ON THE 95TH, at its mid-lead hump and its late dip, naming them
as half a solar cycle and a full one. They are found by searching the curve
between 3 and 6 years and between 9 and 12 — never typed — so a label cannot
drift from the point under it, and they are drawn ONLY where the hump is
actually higher than the late maximum. On Ap, where it is not, there are no
notes and that is correct rather than missing.

Splitting by cycle replaces the four with one curve per
cycle, at the 95th."""
# A person looked at panels/reference/predict.png and agreed the picture
# is right. That is what makes check three mean anything: the reference is the
# claim, and without a name against it the check only proves the chart has not
# changed since a machine drew it.
# NOT CONFIRMED. The reference was re-recorded on 2026-09-18 against a
# picture whose CONTENT changed, not just its size: the growth view now draws FOUR percentiles as an ordinal ramp instead of one at a time, always out to the full lead ladder; the percentile and span controls are gone.
# The previous signature was against a different chart and carrying it
# forward would make check three prove only that a machine has not
# changed its mind. It needs a person to look at
# panels/reference/predict.png and put their name here.
confirmed_by = "UNCONFIRMED / re-recorded 2026-09-19 after §34 moves 1 and 2; awaiting a look (last signed A. Rai / 2026-09-15, against the previous chart)"
tolerance = 0.02
# The panel refetches the whole solar-weather record on every redraw, so
# check two has to wait on the content changing rather than on a fixed pause.
settle_ms = 8000

# A figure lives on the row it argues about, so driving it means opening that
# row. There is no solar view any more: it was a sixth item in a navigation
# whose subtitle says four layers, and it showed solar weather in a second
# place that disagreed with layer 3. panel_check re-runs this after every
# input to restore the starting state.
ready = """(async () => {
  await window.openNode('sw_uncertainty_growth');
  await new Promise(r => setTimeout(r, 200));
  const cv = document.querySelector('.row-figure canvas.sw-panel');
  if (!cv) throw new Error('no figure on sw_uncertainty_growth for the predict panel');
})()"""

[[input]]
name = "v"
drive = "(() => { const s = document.querySelector('.sw-opt[data-k=v]'); if (!s) throw new Error('no v control'); s.value = 'ap'; s.dispatchEvent(new Event('change')); })()"
why = """the two drivers have different units and different spreads; one curve for both is a chart ignoring the variable"""

[[input]]
name = "by"
drive = "(() => { const s = document.querySelector('.sw-opt[data-k=by]'); if (!s) throw new Error('no by control'); s.value = 'cycle'; s.dispatchEvent(new Event('change')); })()"
why = """splitting by cycle must replace one curve with several; a single curve under both settings means the split is not wired"""
