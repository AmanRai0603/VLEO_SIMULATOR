id = "predict"
label = "Predict — how far the flux moves over a lead"
module = "web/js/solar.js"
mount = "canvas.sw-panel"
draws = """The selected percentile of the change in the driver over a lead, against that
lead, out to the selected span. This is the measured quantity
sw_uncertainty_growth reads, drawn over its whole range rather than at the one
lead a mission asks about."""
correct = """One curve of the percentile change against lead. The horizontal axis ends at
the last lead in the ladder and NOT at the selected span — the ladder is
geometric, so a five-year span draws out to 4.08 years, and an axis that
stopped exactly on the span would mean the ladder had been resampled to be
tidy. The curve is measured, not fitted: at short leads it wobbles rather than
rising smoothly, and at the fifteen-year span it stops being monotone
altogether — the record's 95th percentile rises to about +114 sfu near four
years, falls to about +66 near ten to eleven, and rises again, which is the
eleven-year cycle showing through. A smooth monotone curve at that span means
something has been fitted. Splitting by cycle replaces the single curve with
one per cycle."""
# A person looked at panels/reference/predict.png and agreed the picture
# is right. That is what makes check three mean anything: the reference is the
# claim, and without a name against it the check only proves the chart has not
# changed since a machine drew it.
confirmed_by = "A. Rai / 2026-09-15 (against the pre-move picture; content unchanged, canvas resized 2026-09-16, not yet re-looked)"
tolerance = 0.02
# The panel refetches the whole solar-weather record on every redraw, so
# check two has to wait on the content changing rather than on a fixed pause.
settle_ms = 8000

# A figure lives on the row it argues about, so driving it means opening that
# row. There is no solar view any more: it was a sixth item in a navigation
# whose subtitle says four layers, and it showed solar weather in a second
# place that disagreed with layer 3. panel_check re-runs this after every
# input to restore the starting state.
ready = """(async () => {
  await window.openNode('sw_uncertainty_growth');
  await new Promise(r => setTimeout(r, 200));
  const cv = document.querySelector('.row-figure canvas.sw-panel');
  if (!cv) throw new Error('no figure on sw_uncertainty_growth for the predict panel');
})()"""

[[input]]
name = "v"
drive = "(() => { const s = document.querySelector('.sw-opt[data-k=v]'); if (!s) throw new Error('no v control'); s.value = 'ap'; s.dispatchEvent(new Event('change')); })()"
why = """the two drivers have different units and different spreads; one curve for both is a chart ignoring the variable"""

[[input]]
name = "q"
drive = "(() => { const s = document.querySelector('.sw-opt[data-k=q]'); if (!s) throw new Error('no q control'); s.value = '0.5'; s.dispatchEvent(new Event('change')); })()"
why = """the median change and the 95th percentile are far apart — a curve that does not drop when the percentile does is not reading it"""

[[input]]
name = "span"
drive = "(() => { const s = document.querySelector('.sw-opt[data-k=span]'); if (!s) throw new Error('no span control'); s.value = '5478'; s.dispatchEvent(new Event('change')); })()"
why = """the span is the horizontal extent and the curve must reach it"""

[[input]]
name = "by"
drive = "(() => { const s = document.querySelector('.sw-opt[data-k=by]'); if (!s) throw new Error('no by control'); s.value = 'cycle'; s.dispatchEvent(new Event('change')); })()"
why = """splitting by cycle must replace one curve with several; a single curve under both settings means the split is not wired"""
