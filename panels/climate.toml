id = "climate"
label = "Climate — the long run a mission sits inside"
module = "web/js/solar.js"
mount = "canvas.sw-panel"
draws = """The record aggregated over the long run: by year, by day of year, by month, by
the 13-month smoother, or Kp against ap. The context a single mission window is
a slice of."""
correct = """the finding line counts how many of the drawn groups sit below the record mean
and the ratio of the highest to the lowest; on the Kp-against-ap setting it
counts the Kp at which the published table is above the median day and above the
90th percentile, which is this view’s claim made countable.

On the by-year setting the 2017 bar carries a note saying how many days that
year actually holds — the record has a 273-day gap in it, so the bar is a mean
over about 92 days and looks like every other bar. The count is read off the
record rather than typed, and the note is drawn only if that year really is
short.

On the Kp-against-ap setting the median is at full contrast and the two
percentile edges at half — they bound the shaded spread rather than being two
more curves to tell apart.

The selected aggregate over the whole record, with the horizontal axis labelled
for the aggregate chosen — years for by-year, 1 to 366 for day of year. On the
Kp-against-ap setting the published conversion table is drawn as points and
they are ALL present: Kp is reported in thirds, so a whole-Kp lookup silently
drops two values in three, and a line with gaps in it is that defect. That
setting is the one where the table sits above the median day at every Kp, which
is the panel's claim and must be visible."""
# A person looked at panels/reference/climate.png and agreed the picture
# is right. That is what makes check three mean anything: the reference is the
# claim, and without a name against it the check only proves the chart has not
# changed since a machine drew it.
# NOT CONFIRMED ANY MORE. The reference was re-recorded on 2026-09-19: the
# by-year view — which is the view the reference is shot at — now carries a note
# on the 2017 bar saying how few days that year actually holds. That is a
# CONTENT change, so the earlier signature was against a different picture.
confirmed_by = "UNCONFIRMED / re-recorded 2026-09-19, §34 moves 1–5; awaiting a look. Every figure gained an answer line above the chart and a finding line inside it, and this panel’s own picture changed as well — see `correct` above for what to check"
# WHY THE REFERENCE WAS RE-RECORDED, AND A FINDING ABOUT THIS CHECK.
#
# Adding sw_f107_cold_long put a third name in sw_central_expectation's
# "nodes read this" line. That line wrapped, everything under it moved a
# fraction of a pixel, and 2.6 per cent of this picture's pixels changed
# against a 2 per cent tolerance. The chart itself is identical: same bars,
# same axes, same mean line at 114.84 over the same 10316 days. Both images
# were compared before the reference was replaced.
#
# So this check currently measures sub-pixel layout as well as the chart, and
# it will fail again every time a row this panel opens gains a consumer — which
# on a row as widely read as sw_central_expectation is often. The tolerance is
# NOT the thing to change: 2 per cent is the right sensitivity for a chart. The
# candidates are capturing the canvas at a fixed device pixel ratio, or
# comparing after a structural-similarity pass rather than pixel by pixel.
# Left as a finding for the panel's owner rather than fixed here.
tolerance = 0.02
# The panel refetches the whole solar-weather record on every redraw, so
# check two has to wait on the content changing rather than on a fixed pause.
settle_ms = 8000

# A figure lives on the row it argues about, so driving it means opening that
# row. There is no solar view any more: it was a sixth item in a navigation
# whose subtitle says four layers, and it showed solar weather in a second
# place that disagreed with layer 3. panel_check re-runs this after every
# input to restore the starting state.
ready = """(async () => {
  await window.openNode('sw_central_expectation');
  await new Promise(r => setTimeout(r, 200));
  const cv = document.querySelector('.row-figure canvas.sw-panel');
  if (!cv) throw new Error('no figure on sw_central_expectation for the climate panel');
})()"""

[[input]]
name = "v"
drive = "(() => { const s = document.querySelector('.sw-opt[data-k=v]'); if (!s) throw new Error('no v control'); s.value = 'ap'; s.dispatchEvent(new Event('change')); })()"
why = """the three variables have different scales and different axis labels"""

[[input]]
name = "by"
drive = "(() => { const s = document.querySelector('.sw-opt[data-k=by]'); if (!s) throw new Error('no by control'); s.value = 'kpap'; s.dispatchEvent(new Event('change')); })()"
why = """the five aggregates are five different horizontal axes; the Kp-against-ap setting in particular changes the picture completely"""
