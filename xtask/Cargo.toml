[package]
name = "xtask"
description = "The generators, the gate and the assembly. One binary, called by the authoring hook, by the pipeline and by hand — because where the hook runs one script and the pipeline runs another they drift within a month and the hook becomes theatre."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
vleo-sheet = { workspace = true }
vleo-units = { workspace = true }
vleo-data = { workspace = true }
vleo-files = { path = "../crates/vleo-files" }
toml = { workspace = true }
# The test drive's sealed releases: a release file opened as SQLite, its
# version and record changed, and its seal written again over what it holds.
rusqlite = { workspace = true }
toml_edit = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
